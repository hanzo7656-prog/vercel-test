<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* استایل‌های صفحه ورود */
        body {
            margin: 0;
            padding: 0;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazir', 'Segoe UI', sans-serif;
        }
        .login-container {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 24px;
            padding: 40px 50px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo i {
            font-size: 3rem;
            color: #00d4ff;
        }
        .login-logo h1 {
            color: #e0e6ed;
            font-size: 1.5rem;
            margin: 10px 0 5px;
        }
        .login-logo p {
            color: #7a8fa3;
            font-size: 0.85rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: #a0b4c8;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: #0a0e17;
            border: 1px solid #1a2a3a;
            border-radius: 10px;
            color: #e0e6ed;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.05);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,212,255,0.3);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-links {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.85rem;
        }
        .login-links a {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .login-links a:hover {
            color: #00e5ff;
            text-decoration: underline;
        }
        .error-msg {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .support-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #1a2a3a;
            text-align: center;
            font-size: 0.8rem;
            color: #4a5a6a;
        }
        .support-section a {
            color: #00d4ff;
            text-decoration: none;
        }
        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-chart-line"></i>
            <h1>سیستم تشخیص الگو</h1>
            <p>ورود به حساب کاربری</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>👤 نام کاربری</label>
                <input type="text" id="username" class="form-control" placeholder="نام کاربری خود را وارد کنید" required>
            </div>
            <div class="form-group">
                <label>🔑 رمز عبور</label>
                <input type="password" id="password" class="form-control" placeholder="رمز عبور خود را وارد کنید" required>
            </div>
            <div id="loginError" class="error-msg"></div>
            <button type="submit" id="loginBtn" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> ورود
            </button>
        </form>

        <div class="login-links">
            <a href="#" id="forgotLink">🔄 فراموشی رمز عبور</a>
        </div>

        <div class="support-section">
            <span>پشتیبانی: </span>
            <a href="https://t.me/your_telegram_id" target="_blank">@your_telegram_id</a>
        </div>
    </div>

    <!-- مودال بازیابی رمز -->
    <div id="recoverModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center;">
        <div style="background:linear-gradient(145deg,#111d2b,#0d1624);border:1px solid #1a2a3a;border-radius:24px;padding:40px;max-width:420px;width:90%;max-height:90vh;overflow-y:auto;">
            <h2 style="color:#e0e6ed;text-align:center;margin-bottom:20px;">🔄 بازیابی رمز عبور</h2>
            <p style="color:#7a8fa3;text-align:center;font-size:0.85rem;margin-bottom:20px;">کد تایید به ایمیل شما ارسال خواهد شد</p>
            
            <div id="recoverStep1">
                <div class="form-group">
                    <label>📧 ایمیل بازیابی</label>
                    <input type="email" id="recoverEmail" class="form-control" placeholder="ایمیل ثبت شده خود را وارد کنید">
                </div>
                <div id="recoverError" class="error-msg"></div>
                <button onclick="sendRecoveryCode()" class="btn-login" style="margin-bottom:10px;">
                    <i class="fas fa-envelope"></i> ارسال کد تایید
                </button>
            </div>

            <div id="recoverStep2" style="display:none;">
                <div class="form-group">
                    <label>🔢 کد تایید</label>
                    <input type="text" id="recoverCode" class="form-control" placeholder="کد ۶ رقمی را وارد کنید" maxlength="6">
                </div>
                <div id="recoverVerifyError" class="error-msg"></div>
                <button onclick="verifyRecoveryCode()" class="btn-login" style="margin-bottom:10px;">
                    <i class="fas fa-check"></i> تایید و ورود
                </button>
                <div id="recoverSupport" style="display:none;text-align:center;padding:10px;background:#1a1a2a;border-radius:8px;margin-top:10px;">
                    <p style="color:#ffaa00;font-size:0.85rem;">❌ ایمیل یافت نشد</p>
                    <p style="color:#7a8fa3;font-size:0.8rem;">لطفاً با پشتیبانی تماس بگیرید:</p>
                    <a href="https://t.me/your_telegram_id" target="_blank" style="color:#00d4ff;font-size:1rem;">@your_telegram_id</a>
                </div>
            </div>

            <div style="text-align:center;margin-top:15px;">
                <button onclick="closeRecoverModal()" class="btn-login" style="background:transparent;border:1px solid #1a2a3a;color:#7a8fa3;">
                    ← بازگشت
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // مدیریت ورود
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                errorEl.textContent = 'لطفاً نام کاربری و رمز عبور را وارد کنید';
                errorEl.classList.add('show');
                return;
            }
            
            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ورود...';
            
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.error || 'خطا در ورود';
                    errorEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ورود';
                }
            } catch (err) {
                errorEl.textContent = 'خطا در ارتباط با سرور';
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ورود';
            }
        });

        // ============================================================
        // مدیریت بازیابی رمز
        // ============================================================
        let recoverEmail = '';

        document.getElementById('forgotLink').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('recoverModal').style.display = 'flex';
            document.getElementById('recoverStep1').style.display = 'block';
            document.getElementById('recoverStep2').style.display = 'none';
            document.getElementById('recoverSupport').style.display = 'none';
            document.getElementById('recoverError').classList.remove('show');
            document.getElementById('recoverVerifyError').classList.remove('show');
            document.getElementById('recoverEmail').value = '';
            document.getElementById('recoverCode').value = '';
        });

        function closeRecoverModal() {
            document.getElementById('recoverModal').style.display = 'none';
        }

        async function sendRecoveryCode() {
            const email = document.getElementById('recoverEmail').value.trim();
            const errorEl = document.getElementById('recoverError');
            const btn = event.target;
            
            if (!email) {
                errorEl.textContent = 'لطفاً ایمیل خود را وارد کنید';
                errorEl.classList.add('show');
                return;
            }
            
            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ارسال...';
            
            try {
                const res = await fetch('/recover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    recoverEmail = email;
                    document.getElementById('recoverStep1').style.display = 'none';
                    document.getElementById('recoverStep2').style.display = 'block';
                    document.getElementById('recoverSupport').style.display = 'none';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-envelope"></i> ارسال کد تایید';
                    alert('✅ کد تایید به ایمیل شما ارسال شد');
                } else if (data.show_support) {
                    document.getElementById('recoverSupport').style.display = 'block';
                    document.getElementById('recoverSupport').querySelector('p:first-child').textContent = '❌ ' + data.error;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-envelope"></i> ارسال کد تایید';
                } else {
                    errorEl.textContent = data.error || 'خطا در ارسال کد';
                    errorEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-envelope"></i> ارسال کد تایید';
                }
            } catch (err) {
                errorEl.textContent = 'خطا در ارتباط با سرور';
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-envelope"></i> ارسال کد تایید';
            }
        }

        async function verifyRecoveryCode() {
            const code = document.getElementById('recoverCode').value.trim();
            const errorEl = document.getElementById('recoverVerifyError');
            const btn = event.target;
            
            if (!code || code.length < 6) {
                errorEl.textContent = 'لطفاً کد ۶ رقمی را وارد کنید';
                errorEl.classList.add('show');
                return;
            }
            
            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال تایید...';
            
            try {
                const res = await fetch('/recover/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: recoverEmail, code })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    // نمایش نوتیفیکیشن یادآوری
                    if (data.recovered) {
                        alert('⚠️ شما با ایمیل بازیابی وارد شده‌اید.\nلطفاً رمز عبور و نام کاربری خود را در صفحه تنظیمات مشاهده کنید.');
                    }
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.error || 'کد اشتباه است';
                    errorEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> تایید و ورود';
                }
            } catch (err) {
                errorEl.textContent = 'خطا در ارتباط با سرور';
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> تایید و ورود';
            }
        }

        // کلید Enter برای ارسال
        document.getElementById('recoverCode').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                verifyRecoveryCode();
            }
        });
        document.getElementById('recoverEmail').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendRecoveryCode();
            }
        });

        // بستن مودال با کلیک خارج
        document.getElementById('recoverModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeRecoverModal();
            }
        });
    </script>
</body>
</html>
