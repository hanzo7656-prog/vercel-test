<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیش‌بینی الگو</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .result-box { padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; }
        .result-box.buy { background: rgba(0,255,136,0.1); border: 2px solid #00ff88; }
        .result-box.sell { background: rgba(255,68,68,0.1); border: 2px solid #ff4444; }
        .result-box.neutral { background: rgba(255,170,0,0.1); border: 2px solid #ffaa00; }
        .result-box .signal { font-size: 2rem; font-weight: bold; }
        .result-box .price { font-size: 1.2rem; margin-top: 5px; color: #a0b4c8; }
        .confidence-bar { width: 100%; height: 8px; background: #1a2a3a; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .confidence-bar .fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
        .confidence-bar .fill.buy { background: linear-gradient(90deg, #00ff88, #00cc66); }
        .confidence-bar .fill.sell { background: linear-gradient(90deg, #ff4444, #cc0000); }
        .confidence-bar .fill.neutral { background: linear-gradient(90deg, #ffaa00, #cc8800); }
        .hidden { display: none; }
        .result-details { margin-top: 15px; padding-top: 15px; border-top: 1px solid #1a2a3a; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: #7a8fa3; font-size: 0.9rem; }
        .chart-container { background: #0d1624; border-radius: 12px; padding: 20px; margin-top: 15px; border: 1px solid #1a2a3a; height: 350px; position: relative; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">📊 سیستم تشخیص الگو</a>
        <div class="navbar-menu">
            <a href="/">🏠 خانه</a>
            <a href="/dashboard">📈 داشبورد</a>
            <a href="/predict-page" class="active">🎯 پیش‌بینی</a>
            <a href="/test-api-page">🔌 تست API</a>
            <a href="/health-page">💚 سلامت</a>
            <a href="/stats-page">📊 آمار</a>
        </div>
        <div class="navbar-status">
            <span><span class="status-dot online"></span> آنلاین</span>
            <span style="color: #7a8fa3; font-size: 0.8rem;">
                ⏱️ <span id="uptimeDisplay">۰ ثانیه</span>
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-title">🎯 پیش‌بینی الگوی بازاری</div>
            <div class="card-subtitle">انتخاب ارز و بازه زمانی برای تشخیص الگوی قیمت</div>
            <form id="predictForm" onsubmit="return false;">
                <div class="row">
                    <div class="form-group">
                        <label>🪙 ارز دیجیتال</label>
                        <select class="form-control" id="coin">
                            <option value="bitcoin">بیت‌کوین (BTC)</option>
                            <option value="ethereum">اتریوم (ETH)</option>
                            <option value="tether">تتر (USDT)</option>
                            <option value="binancecoin">بایننس کوین (BNB)</option>
                            <option value="solana">سولانا (SOL)</option>
                            <option value="ripple">ریپل (XRP)</option>
                            <option value="cardano">کاردانو (ADA)</option>
                            <option value="dogecoin">داوج‌کوین (DOGE)</option>
                            <option value="polkadot">پولکادات (DOT)</option>
                            <option value="chainlink">چین‌لینک (LINK)</option>
                            <option value="avalanche">آوالانچ (AVAX)</option>
                            <option value="shiba-inu">شیبا اینو (SHIB)</option>
                            <option value="matic-network">پالیگان (MATIC)</option>
                            <option value="tron">ترون (TRX)</option>
                            <option value="uniSwap">یونی‌سواپ (UNI)</option>
                            <option value="litecoin">لایت‌کوین (LTC)</option>
                            <option value="bitcoin-cash">بیت‌کوین کش (BCH)</option>
                            <option value="cosmos">کازموس (ATOM)</option>
                            <option value="ethereum-classic">اتریوم کلاسیک (ETC)</option>
                            <option value="filecoin">فایل‌کوین (FIL)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>⏱️ بازه زمانی</label>
                        <select class="form-control" id="period">
                            <option value="24h">۲۴ ساعت</option>
                            <option value="1w">۱ هفته</option>
                            <option value="1m">۱ ماه</option>
                        </select>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button type="button" class="btn btn-success" onclick="submitPredict()">🚀 پیش‌بینی</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="loadingContainer" class="hidden">
            <div class="card"><div class="loading"><div class="spinner"></div><p>⏳ در حال پردازش داده‌ها...</p><p style="color:#4a5a6a;font-size:0.85rem;" id="taskIdDisplay"></p></div></div>
        </div>

        <div id="resultContainer" class="hidden">
            <div class="card"><div id="resultContent"></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/script.js"></script>
    <script>
        let currentTaskId = null;
        let checkInterval = null;
        let chartInstance = null;

        function submitPredict() {
            const coin = document.getElementById('coin').value;
            const period = document.getElementById('period').value;

            document.getElementById('loadingContainer').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            fetch(`/predict?coin=${coin}&period=${period}`)
                .then(res => res.json())
                .then(data => {
                    if (data.task_id) {
                        currentTaskId = data.task_id;
                        document.getElementById('taskIdDisplay').textContent = `شناسه تسک: ${currentTaskId}`;
                        startPolling();
                    } else {
                        document.getElementById('loadingContainer').classList.add('hidden');
                        showResult(data);
                    }
                })
                .catch(err => {
                    document.getElementById('loadingContainer').classList.add('hidden');
                    showToast('❌ خطا: ' + err.message, 'error');
                });
        }

        function startPolling() {
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(() => {
                fetch(`/task-status?task_id=${currentTaskId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'completed') {
                            clearInterval(checkInterval);
                            document.getElementById('loadingContainer').classList.add('hidden');
                            showResult(data.result);
                        } else if (data.status === 'failed') {
                            clearInterval(checkInterval);
                            document.getElementById('loadingContainer').classList.add('hidden');
                            showToast('❌ خطا در پردازش: ' + (data.error || 'خطای ناشناخته'), 'error');
                        }
                    })
                    .catch(err => console.error('Polling error:', err));
            }, 2000);
        }

        function showResult(result) {
            const container = document.getElementById('resultContainer');
            const content = document.getElementById('resultContent');
            container.classList.remove('hidden');

            if (result.error) {
                content.innerHTML = `<div class="result-box neutral"><div class="signal">❌ ${result.message || 'خطا'}</div></div>`;
                return;
            }

            const signalType = (result.signal_type || 'NEUTRAL').toLowerCase();
            const confidence = result.confidence_score || 50;
            const signalEmoji = signalType === 'buy' ? '🟢' : signalType === 'sell' ? '🔴' : '🟡';

            let html = `
                <div class="result-box ${signalType}">
                    <div class="signal">${signalEmoji} ${result.signal || 'بدون سیگنال'}</div>
                    <div style="font-size: 2.5rem; font-weight: bold; margin-top: 5px;">${result.confidence || '۵۰%'}</div>
                    <div class="confidence-bar"><div class="fill ${signalType}" style="width: ${confidence}%;"></div></div>
                    <div class="price">💰 $${Number(result.current_price || 0).toLocaleString()}</div>
                    <div class="result-details">
                        <span>🪙 ${result.coin_name || result.coin}</span>
                        <span>⏱️ ${result.period}</span>
                        <span>📊 ${result.data_points || 0} نقطه</span>
                        <span>⏱️ ${result.processing_time_ms || 0}ms</span>
                    </div>
                    <div style="margin-top:10px;font-size:0.8rem;color:#4a5a6a;">📅 ${result.timestamp ? new Date(result.timestamp).toLocaleString('fa-IR') : ''}</div>
                </div>
            `;

            // اضافه کردن نمودار
            html += `<div class="chart-container"><canvas id="priceChart"></canvas></div>`;
            content.innerHTML = html;

            // دریافت داده‌های چارت برای نمودار
            fetch(`/test-api?type=chart&coin=${result.coin}&period=${result.period}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.count > 0) {
                        createChart(data.sample || data.data || []);
                    }
                })
                .catch(err => console.error('Chart error:', err));
        }

        function createChart(data) {
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }

            const canvas = document.getElementById('priceChart');
            if (!canvas) return;

            const timestamps = data.map(p => new Date(p[0] * 1000).toLocaleString('fa-IR', {
                hour: '2-digit',
                minute: '2-digit',
                day: '2-digit',
                month: '2-digit'
            }));
            const prices = data.map(p => p[1]);

            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(0, 212, 255, 0.8)');
            gradient.addColorStop(0.5, 'rgba(0, 212, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 212, 255, 0.0)');

            chartInstance = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: timestamps,
                    datasets: [{
                        label: 'قیمت (USD)',
                        data: prices,
                        borderColor: '#00d4ff',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#00d4ff',
                        pointBorderColor: '#00d4ff',
                        tension: 0.3,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#a0b4c8', font: { family: 'Vazir' } }
                        },
                        tooltip: {
                            backgroundColor: '#0d1624',
                            titleColor: '#e0e6ed',
                            bodyColor: '#00d4ff',
                            borderColor: '#1a2a3a',
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    return `$${context.parsed.y.toFixed(2)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#7a8fa3', font: { family: 'Vazir' }, maxTicksLimit: 10 }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#7a8fa3', font: { family: 'Vazir' }, callback: value => '$' + value.toFixed(0) }
                        }
                    },
                    interaction: { intersect: false, mode: 'index' },
                    animation: { duration: 2000, easing: 'easeOutQuart' }
                }
            });
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('coin') && params.get('period')) {
            document.getElementById('coin').value = params.get('coin');
            document.getElementById('period').value = params.get('period');
            submitPredict();
        }

        // آپتایم
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof fetchAndStartUptime === 'function') {
                fetchAndStartUptime();
            }
        });
    </script>
</body>
</html>
