<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدل</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; min-height: 100vh; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard-header .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .menu-toggle {
            width: 44px; height: 44px; border-radius: 50%; background: #0d1624;
            border: 1px solid #1a2a3a; color: #e0e6ed; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 200;
        }
        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed; top: 80px; right: 20px;
            background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 10px 0;
            min-width: 200px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150; transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #a0b4c8; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0,212,255,0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.7rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .card:hover { border-color: rgba(0, 212, 255, 0.2); }
        .card-title {
            color: #00d4ff;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-subtitle {
            color: #7a8fa3;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500;
        }
        .badge-success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .badge-warning { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
        .badge-danger { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        .badge-gray { background: rgba(255,255,255,0.05); color: #7a8fa3; border: 1px solid rgba(255,255,255,0.05); }
        .badge-info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px;
            border: none; border-radius: 10px; font-size: 0.9rem; cursor: pointer;
            transition: all 0.3s ease; font-weight: 500; font-family: inherit;
        }
        .btn-success { background: linear-gradient(135deg, #00ff88, #00cc66); color: #0a0e17; }
        .btn-danger { background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-warning { background: linear-gradient(135deg, #ffaa00, #cc8800); color: #0a0e17; }
        .btn-sm { padding: 5px 14px; font-size: 0.8rem; }
        .btn-xs { padding: 3px 10px; font-size: 0.7rem; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,255,136,0.3); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,68,68,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }
        .btn-outline {
            background: transparent; border: 1px solid #1a2a3a; color: #7a8fa3;
        }
        .btn-outline:hover { border-color: #00d4ff; color: #e0e6ed; }

        .model-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 16px;
            background: #0a0e17;
            border-radius: 10px;
            border: 1px solid #1a2a3a;
            margin-bottom: 15px;
        }
        .model-status .left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .model-status .right {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .model-config {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #0d1624;
        }
        .model-config .form-group { margin-bottom: 0; }
        .model-config .form-group label {
            display: block;
            color: #a0b4c8;
            margin-bottom: 4px;
            font-size: 0.8rem;
        }
        .model-config .form-control {
            width: 100%;
            padding: 8px 12px;
            background: #0d1624;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .model-config .form-control:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .console {
            background: #080c14;
            border: 1px solid #1a2a3a;
            border-radius: 10px;
            padding: 12px 16px;
            max-height: 350px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #7a8fa3;
            direction: ltr;
            text-align: left;
            line-height: 1.8;
        }
        .console::-webkit-scrollbar { width: 4px; }
        .console::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 2px; }
        .console .log-info { color: #00d4ff; }
        .console .log-success { color: #00ff88; }
        .console .log-error { color: #ff4444; }
        .console .log-warning { color: #ffaa00; }
        .console .log-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .console .log-line .copy-btn {
            background: none;
            border: none;
            color: #4a5a6a;
            cursor: pointer;
            font-size: 0.65rem;
            padding: 0 4px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .console .log-line .copy-btn:hover {
            opacity: 1;
            color: #00d4ff;
        }

        /* ===== مودال پیشرفت ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: linear-gradient(145deg, #111d2b, #0a0e17);
            border: 1px solid #1a2a3a;
            border-radius: 24px;
            padding: 40px 50px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: modalIn 0.4s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box .progress-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            position: relative;
        }
        .modal-box .progress-circle svg {
            transform: rotate(-90deg);
            width: 120px;
            height: 120px;
        }
        .modal-box .progress-circle .bg {
            fill: none;
            stroke: #1a2a3a;
            stroke-width: 6;
        }
        .modal-box .progress-circle .progress {
            fill: none;
            stroke: #00d4ff;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }
        .modal-box .progress-circle .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: bold;
            color: #e0e6ed;
        }
        .modal-box .step-text {
            color: #a0b4c8;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        .modal-box .step-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }
        .modal-box .step-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1a2a3a;
            transition: all 0.3s ease;
        }
        .modal-box .step-dots .dot.active {
            background: #00d4ff;
            box-shadow: 0 0 15px rgba(0,212,255,0.3);
        }
        .modal-box .step-dots .dot.done {
            background: #00ff88;
        }
        .modal-box .close-modal-btn {
            margin-top: 20px;
            padding: 8px 30px;
            background: #1a2a3a;
            border: none;
            border-radius: 10px;
            color: #7a8fa3;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .modal-box .close-modal-btn:hover {
            background: #2a3a4a;
            color: #e0e6ed;
        }

        @media (max-width: 768px) {
            .model-config { grid-template-columns: 1fr; }
            .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .container { padding: 12px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
            .model-status { flex-direction: column; align-items: stretch; }
            .model-status .right { justify-content: flex-start; }
            .modal-box { padding: 30px 20px; margin: 0 15px; }
            .modal-box .progress-circle { width: 100px; height: 100px; }
            .modal-box .progress-circle svg { width: 100px; height: 100px; }
        }
        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
            .console { max-height: 200px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="container">

        <div class="card">
            <div class="card-title"><i class="fas fa-brain" style="color:#a855f7;"></i> مدیریت مدل</div>
            <div class="card-subtitle">آموزش و مدیریت مدل XGBoost</div>

            <!-- ===== وضعیت مدل ===== -->
            <div class="model-status" id="modelStatusBar">
                <div class="left">
                    <span>📊 وضعیت:</span>
                    <span id="modelStatusBadge" class="badge badge-warning">⏳ در حال بررسی...</span>
                    <span id="modelRunningBadge" class="badge badge-gray">⏹️ متوقف</span>
                    <span id="modelInfo" style="color:#4a5a6a;font-size:0.8rem;"></span>
                </div>
                <div class="right" id="modelControls">
                    <button class="btn btn-sm btn-success" onclick="toggleModel('start')">▶️ شروع آموزش</button>
                    <button class="btn btn-sm btn-danger" onclick="toggleModel('stop')" style="display:none;">⏹️ توقف آموزش</button>
                    <button class="btn btn-sm btn-primary" onclick="trainNow()">🧠 آموزش یکبار</button>
                    <button class="btn btn-sm btn-warning" onclick="refreshStatus()">🔄</button>
                </div>
            </div>

            <!-- ===== تنظیمات آموزش ===== -->
            <div class="model-config">
                <div class="form-group">
                    <label>🪙 ارزها</label>
                    <select class="form-control" id="trainCoins">
                        <option value="bitcoin,ethereum,solana,cardano,ripple">۵ ارز اصلی</option>
                        <option value="bitcoin,ethereum,solana">۳ ارز</option>
                        <option value="bitcoin">فقط بیت‌کوین</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>⏱️ بازه زمانی</label>
                    <select class="form-control" id="trainPeriod">
                        <option value="1w">۱ هفته</option>
                        <option value="1m" selected>۱ ماه</option>
                        <option value="3m">۳ ماه</option>
                        <option value="6m">۶ ماه</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>⏱️ تکرار</label>
                    <select class="form-control" id="trainInterval">
                        <option value="6">هر ۶ ساعت</option>
                        <option value="12">هر ۱۲ ساعت</option>
                        <option value="24">هر ۲۴ ساعت</option>
                    </select>
                </div>
                <div class="form-group" style="display:flex;align-items:flex-end;">
                    <button class="btn btn-sm btn-outline" onclick="clearLogs()" style="padding:8px 16px;">
                        <i class="fas fa-eraser"></i>
                    </button>
                </div>
            </div>

            <!-- ===== کنسول لاگ ===== -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="color:#7a8fa3;font-size:0.8rem;">📋 کنسول آموزش</span>
            </div>
            <div class="console" id="logConsole">
                <div class="log-info">⏳ در حال اتصال به سرور...</div>
            </div>
        </div>

    </div>

    <!-- ===== مودال پیشرفت ===== -->
    <div class="modal-overlay" id="progressModal">
        <div class="modal-box">
            <div class="progress-circle">
                <svg viewBox="0 0 120 120">
                    <circle class="bg" cx="60" cy="60" r="50"/>
                    <circle class="progress" id="progressCircle" cx="60" cy="60" r="50"
                        stroke-dasharray="314.16"
                        stroke-dashoffset="314.16"/>
                </svg>
                <div class="center-text" id="progressPercent">۰%</div>
            </div>
            <div class="step-text" id="progressStep">⏳ در حال آماده‌سازی...</div>
            <div class="step-dots" id="stepDots">
                <span class="dot" data-step="0"></span>
                <span class="dot" data-step="1"></span>
                <span class="dot" data-step="2"></span>
            </div>
            <button class="close-modal-btn" onclick="closeProgressModal()">بستن</button>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        let statusInterval = null;
        let logInterval = null;
        let progressInterval = null;
        let currentProgress = 0;
        let currentStep = 0;
        const steps = ['دریافت داده', 'در حال آموزش', 'آموزش به پایان رسید'];
        const totalSteps = steps.length;

        // ============================================================
        // وضعیت مدل
        // ============================================================
        function updateStatus() {
            fetch('/model/status')
                .then(res => res.json())
                .then(data => {
                    const modelStats = data?.stats || {};
                    const modelRunning = data?.is_running || false;
                    const isTraining = data?.is_training || false;
                    const modelExists = data?.model_exists || false;
                    const apiStatus = data?.api_status?.api_status || 'unknown';
                    const creditsRemaining = data?.api_status?.credits_remaining || 0;
                    const lastScore = modelStats?.last_score || null;
                    const totalTrainings = modelStats?.total_trainings || 0;

                    const badge = document.getElementById('modelStatusBadge');
                    if (badge) {
                        if (isTraining) {
                            badge.className = 'badge badge-warning';
                            badge.textContent = '⏳ در حال آموزش...';
                        } else if (modelExists) {
                            badge.className = 'badge badge-success';
                            badge.textContent = '✅ فعال';
                        } else {
                            badge.className = 'badge badge-warning';
                            badge.textContent = '⚠️ غیرفعال';
                        }
                    }

                    const runningBadge = document.getElementById('modelRunningBadge');
                    if (runningBadge) {
                        if (isTraining) {
                            runningBadge.className = 'badge badge-warning';
                            runningBadge.textContent = '⏳ در حال آموزش...';
                        } else if (modelRunning) {
                            runningBadge.className = 'badge badge-success';
                            runningBadge.textContent = '▶️ در حال اجرا';
                        } else {
                            runningBadge.className = 'badge badge-gray';
                            runningBadge.textContent = '⏹️ متوقف';
                        }
                    }

                    const info = document.getElementById('modelInfo');
                    if (info) {
                        const scoreText = lastScore !== null ? `دقت: ${lastScore}` : '';
                        const trainText = totalTrainings > 0 ? `آموزش: ${totalTrainings} بار` : '';
                        const apiText = `API: ${apiStatus === 'ok' ? '✅' : '❌'} | اعتبار: ${creditsRemaining}`;
                        info.textContent = `${scoreText} ${trainText} ${apiText}`.trim();
                    }

                    const startBtn = document.querySelector('#modelControls .btn-success');
                    const stopBtn = document.querySelector('#modelControls .btn-danger');
                    if (startBtn && stopBtn) {
                        if (modelRunning || isTraining) {
                            startBtn.style.display = 'none';
                            stopBtn.style.display = 'inline-flex';
                        } else {
                            startBtn.style.display = 'inline-flex';
                            stopBtn.style.display = 'none';
                        }
                    }

                    // بروزرسانی مودال اگر در حال آموزش باشه
                    if (isTraining) {
                        showProgressModal();
                    }
                })
                .catch(() => {
                    const badge = document.getElementById('modelStatusBadge');
                    if (badge) {
                        badge.className = 'badge badge-danger';
                        badge.textContent = '❌ خطا';
                    }
                });
        }

        function refreshStatus() {
            updateStatus();
            updateLogs();
        }

        // ============================================================
        // کنترل مدل
        // ============================================================
        function toggleModel(action) {
            const url = action === 'start' ? `/model/start?interval=${document.getElementById('trainInterval').value}` : '/model/stop';

            const startBtn = document.querySelector('#modelControls .btn-success');
            const stopBtn = document.querySelector('#modelControls .btn-danger');
            if (startBtn) startBtn.disabled = true;
            if (stopBtn) stopBtn.disabled = true;

            fetch(url, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || '✅ انجام شد');
                    refreshStatus();
                })
                .catch(err => alert('❌ خطا: ' + err.message))
                .finally(() => {
                    if (startBtn) startBtn.disabled = false;
                    if (stopBtn) stopBtn.disabled = false;
                });
        }

        function trainNow() {
            if (!confirm('آموزش دستی مدل ممکنه چند دقیقه طول بکشه. ادامه میدین؟')) return;
            
            const period = document.getElementById('trainPeriod').value;
            const btn = document.querySelector('#modelControls .btn-primary');
            if (btn) {
                btn.textContent = '⏳...';
                btn.disabled = true;
            }

            // نمایش مودال
            showProgressModal();
            currentProgress = 0;
            currentStep = 0;
            updateProgressModal();

            // شبیه‌سازی پیشرفت (چون سرور اطلاعی نمیده)
            let progress = 0;
            let step = 0;
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                progress += Math.random() * 5;
                if (progress > 100) progress = 100;
                
                if (progress > 30 && step < 1) { step = 1; currentStep = 1; }
                if (progress > 70 && step < 2) { step = 2; currentStep = 2; }
                
                currentProgress = Math.min(progress, 100);
                updateProgressModal();
                
                if (currentProgress >= 100) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            }, 300);

            fetch(`/model/train?period=${period}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        currentProgress = 100;
                        currentStep = 2;
                        updateProgressModal();
                        setTimeout(() => {
                            alert(`✅ مدل آموزش دید!\nدقت: ${data.accuracy || 'N/A'}\nتعداد نمونه: ${data.samples || 0}`);
                            closeProgressModal();
                        }, 500);
                    } else {
                        alert('❌ ' + data.message);
                        closeProgressModal();
                    }
                    refreshStatus();
                })
                .catch(err => {
                    alert('❌ خطا: ' + err.message);
                    closeProgressModal();
                })
                .finally(() => {
                    if (btn) {
                        btn.textContent = '🧠 آموزش یکبار';
                        btn.disabled = false;
                    }
                    if (progressInterval) {
                        clearInterval(progressInterval);
                        progressInterval = null;
                    }
                });
        }

        // ============================================================
        // مودال پیشرفت
        // ============================================================
        function showProgressModal() {
            document.getElementById('progressModal').classList.add('show');
        }

        function closeProgressModal() {
            document.getElementById('progressModal').classList.remove('show');
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function updateProgressModal() {
            const percent = Math.round(currentProgress);
            document.getElementById('progressPercent').textContent = percent + '%';
            
            const circumference = 314.16;
            const offset = circumference - (percent / 100) * circumference;
            document.getElementById('progressCircle').style.strokeDashoffset = offset;

            const stepText = steps[currentStep] || steps[0];
            document.getElementById('progressStep').textContent = '⏳ ' + stepText + '...';

            const dots = document.querySelectorAll('#stepDots .dot');
            dots.forEach((dot, i) => {
                dot.className = 'dot';
                if (i < currentStep) dot.classList.add('done');
                if (i === currentStep) dot.classList.add('active');
            });
        }

        // ============================================================
        // لاگ‌ها
        // ============================================================
        function updateLogs() {
            fetch('/model/status')
                .then(res => res.json())
                .then(data => {
                    const logs = data?.logs || [];
                    const consoleEl = document.getElementById('logConsole');
                    
                    if (logs.length === 0) {
                        consoleEl.innerHTML = `<div class="log-info">📭 هیچ لاگی ثبت نشده است</div>`;
                        return;
                    }

                    let html = '';
                    logs.forEach(log => {
                        let cls = 'log-info';
                        if (log.includes('✅')) cls = 'log-success';
                        else if (log.includes('❌')) cls = 'log-error';
                        else if (log.includes('⚠️')) cls = 'log-warning';
                        
                        const escapedLog = log.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        html += `
                            <div class="log-line">
                                <span class="${cls}">${escapedLog}</span>
                                <button class="copy-btn" onclick="copyLog('${escapedLog.replace(/'/g, "\\'")}')" title="کپی">
                                    <i class="fas fa-copy"></i>
                                </button>
                            </div>
                        `;
                    });
                    consoleEl.innerHTML = html;
                    consoleEl.scrollTop = consoleEl.scrollHeight;
                })
                .catch(() => {
                    document.getElementById('logConsole').innerHTML = '<div class="log-error">❌ خطا در دریافت لاگ</div>';
                });
        }

        function copyLog(text) {
            // حذف تگ‌های HTML
            const plainText = text.replace(/<[^>]*>/g, '').trim();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(plainText).then(() => {
                    showToast('📋 کپی شد!', 'success');
                }).catch(() => {
                    fallbackCopy(plainText);
                });
            } else {
                fallbackCopy(plainText);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('📋 کپی شد!', 'success');
            } catch {
                showToast('❌ کپی نشد!', 'error');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message, type = 'info') {
            const colors = {
                info: '#00d4ff',
                success: '#00ff88',
                error: '#ff4444',
                warning: '#ffaa00'
            };
            const toast = document.createElement('div');
            toast.textContent = message;
            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '20px',
                left: '50%',
                transform: 'translateX(-50%)',
                padding: '10px 24px',
                background: '#1a2a3a',
                color: '#e0e6ed',
                borderRadius: '10px',
                border: `2px solid ${colors[type] || colors.info}`,
                boxShadow: '0 4px 30px rgba(0,0,0,0.5)',
                zIndex: '9999',
                fontSize: '0.9rem',
                transition: 'all 0.3s ease',
                maxWidth: '90%'
            });
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 2000);
        }

        function clearLogs() {
            document.getElementById('logConsole').innerHTML = '<div class="log-info">📭 لاگ‌ها پاک شدند</div>';
            // همچنین لاگ‌های سرور رو پاک کن (در صورت امکان)
        }

        // ============================================================
        // راه‌اندازی
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            updateStatus();
            updateLogs();
            
            statusInterval = setInterval(updateStatus, 5000);
            logInterval = setInterval(updateLogs, 3000);
        });
    </script>

</body>
</html>
