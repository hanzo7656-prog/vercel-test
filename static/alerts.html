<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هشدارها</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .alerts-container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
        .alert-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .alert-filters button { padding: 6px 16px; border: 1px solid var(--border-color); border-radius: 8px; background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; }
        .alert-filters button:hover, .alert-filters button.active { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(0,212,255,0.05); }
        .alert-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px; transition: all 0.3s ease; border-right: 4px solid transparent; }
        .alert-item:hover { border-color: rgba(0,212,255,0.15); }
        .alert-item.critical { border-right-color: var(--accent-red); }
        .alert-item.warning { border-right-color: var(--accent-orange); }
        .alert-item.info { border-right-color: var(--accent-cyan); }
        .alert-item.resolved { opacity: 0.5; border-right-color: var(--accent-green); }
        .alert-item .alert-icon { font-size: 1.2rem; }
        .alert-item .alert-content { flex: 1; }
        .alert-item .alert-content .title { font-size: 0.9rem; }
        .alert-item .alert-content .source { font-size: 0.7rem; color: var(--text-secondary); }
        .alert-item .alert-time { font-size: 0.7rem; color: var(--text-secondary); white-space: nowrap; }
        .alert-item .alert-action { background: none; border: none; color: var(--accent-cyan); cursor: pointer; font-size: 0.85rem; transition: all 0.3s ease; }
        .alert-item .alert-action:hover { color: var(--accent-green); }
        .no-alerts { text-align: center; color: var(--text-secondary); padding: 30px; }
        .badge-count { background: rgba(0,212,255,0.1); color: var(--accent-cyan); padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; }
        @media (max-width: 768px) {
            .alert-item { flex-wrap: wrap; }
            .alert-item .alert-time { width: 100%; text-align: left; }
        }
    </style>
</head>
<body>
    <div id="navContainer"></div>
    
    <main class="alerts-container">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
            <h1>🔔 هشدارها</h1>
            <span class="badge-count" id="alertCount">۰ هشدار</span>
        </div>
        
        <div class="alert-filters">
            <button class="active" data-filter="all">همه</button>
            <button data-filter="critical">🚨 بحرانی</button>
            <button data-filter="warning">⚠️ هشدار</button>
            <button data-filter="info">ℹ️ اطلاع</button>
            <button data-filter="resolved">✅ حل شده</button>
            <button data-filter="unresolved">⏳ حل نشده</button>
        </div>
        
        <div id="alertsList">
            <div class="no-alerts">⏳ در حال بارگذاری...</div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/alerts.js"></script>
</body>
</html>
