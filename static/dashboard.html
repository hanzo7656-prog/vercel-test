<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیباگ داشبورد</title>
    <style>
        body { background: #0a0e17; color: #e0e6ed; font-family: monospace; padding: 20px; direction: rtl; }
        .card { background: #111d2b; border: 1px solid #1a2a3a; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .data-box { background: #0d1624; padding: 10px; border-radius: 8px; margin-top: 8px; border: 1px solid #2a3a4a; }
        .data-box pre { margin: 0; white-space: pre-wrap; word-break: break-all; color: #00d4ff; font-size: 0.8rem; }
        .status-ok { color: #00ff88; }
        .status-error { color: #ff4444; }
        .status-warning { color: #ffaa00; }
        .nav-container { margin-bottom: 20px; padding: 10px; background: #0d1624; border-radius: 8px; text-align: center; border: 1px dashed #00d4ff; }
        .nav-container h3 { color: #00d4ff; }
        button { background: #00d4ff; color: #0a0e17; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ====== بخش منو (برای تست nav.html) ====== -->
    <div class="card" style="border-color: #00d4ff;">
        <h3>🧭 تست بارگذاری منو (nav.html)</h3>
        <div id="navContainer" class="nav-container">
            <span class="status-warning">⏳ در حال بارگذاری منو...</span>
        </div>
        <button onclick="loadNavDebug()">بارگذاری مجدد منو</button>
    </div>

    <!-- ====== بخش داده‌های خام ====== -->
    <div class="card">
        <h3>📡 داده‌های خام از API (metrics)</h3>
        <button onclick="fetchRawMetrics()">دریافت داده‌ها</button>
        <div id="rawDataDisplay" class="data-box">
            <pre>برای دریافت داده‌ها روی دکمه کلیک کنید...</pre>
        </div>
    </div>

    <!-- ====== بخش کارت‌های شاخص‌ها ====== -->
    <div class="card">
        <h3>📊 شاخص‌های اصلی</h3>
        <div id="indicatorsDisplay" class="data-box">
            <pre>در انتظار داده...</pre>
        </div>
    </div>

    <!-- ====== بخش وضعیت مدل ====== -->
    <div class="card">
        <h3>🧠 وضعیت مدل</h3>
        <div id="modelDisplay" class="data-box">
            <pre>در انتظار داده...</pre>
        </div>
    </div>

    <!-- ====== بخش دیتابیس ====== -->
    <div class="card">
        <h3>🗄️ وضعیت دیتابیس‌ها</h3>
        <div id="dbDisplay" class="data-box">
            <pre>در انتظار داده...</pre>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. تابع بارگذاری منو (برای تست)
        // ============================================================
        function loadNavDebug() {
            const container = document.getElementById('navContainer');
            if (!container) return;

            container.innerHTML = '<span class="status-warning">⏳ در حال بارگذاری...</span>';

            fetch('/static/nav.html')
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                    }
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    // اجرای اسکریپت‌های داخل nav.html (برای فعال شدن منو)
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                    // اگر تابع initMenu در global scope باشد، صدا بزن
                    if (typeof initMenu === 'function') {
                        initMenu();
                    }
                    container.innerHTML += '<div style="margin-top:10px;color:#00ff88;font-size:0.8rem;">✅ منو با موفقیت بارگذاری شد!</div>';
                })
                .catch(err => {
                    container.innerHTML = `
                        <div style="color:#ff4444;">❌ خطا در بارگذاری منو: ${err.message}</div>
                        <div style="margin-top:8px;font-size:0.7rem;color:#7a8fa3;">مسیر: /static/nav.html</div>
                    `;
                });
        }

        // ============================================================
        // 2. دریافت داده‌های خام از metrics
        // ============================================================
        function fetchRawMetrics() {
            const display = document.getElementById('rawDataDisplay');
            display.innerHTML = '<pre class="status-warning">⏳ در حال دریافت داده...</pre>';

            fetch('/api/metrics')
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                    }
                    return res.json();
                })
                .then(data => {
                    // نمایش داده‌های خام
                    display.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                    
                    // به‌روزرسانی کارت‌های دیگر با داده‌های دریافتی
                    updateIndicators(data);
                    updateModelStatus(data);
                    updateDatabaseStatus(data);
                })
                .catch(err => {
                    display.innerHTML = `<pre style="color:#ff4444;">❌ خطا: ${err.message}</pre>`;
                });
        }

        // ============================================================
        // 3. به‌روزرسانی شاخص‌ها
        // ============================================================
        function updateIndicators(data) {
            const display = document.getElementById('indicatorsDisplay');
            if (!data || !data.data || !data.data.metrics) {
                display.innerHTML = '<pre class="status-error">❌ داده‌ای دریافت نشد</pre>';
                return;
            }

            const metrics = data.data.metrics;
            const stats = data.data.stats || {};

            const btcPrice = metrics.btc_price?.value || 'نامشخص';
            const btcChange = metrics.btc_price?.change_24h || 'نامشخص';
            const ethPrice = metrics.eth_price?.value || 'نامشخص';
            const ethChange = metrics.eth_price?.change_24h || 'نامشخص';
            const fearGreed = metrics.fear_greed?.value || 'نامشخص';
            const fearLabel = metrics.fear_greed?.classification || 'نامشخص';
            const credits = metrics.api_credits?.value || 'نامشخص';
            const apiStatus = metrics.api_status?.value || 'نامشخص';

            display.innerHTML = `
                <div><span style="color:#00d4ff;">₿ بیت‌کوین:</span> $${btcPrice} (تغییر: ${btcChange}%)</div>
                <div><span style="color:#a855f7;">⟠ اتریوم:</span> $${ethPrice} (تغییر: ${ethChange}%)</div>
                <div><span style="color:#ff8800;">😨 ترس و طمع:</span> ${fearGreed} (${fearLabel})</div>
                <div><span style="color:#00ff88;">💰 اعتبار:</span> ${credits}</div>
                <div><span style="color:#7a8fa8;">🔌 وضعیت API:</span> ${apiStatus}</div>
                <div><span style="color:#4a5a6a;">📊 تعداد جمع‌آوری‌ها:</span> ${stats.collections || 0}</div>
            `;
        }

        // ============================================================
        // 4. به‌روزرسانی وضعیت مدل
        // ============================================================
        function updateModelStatus(data) {
            const display = document.getElementById('modelDisplay');
            if (!data || !data.data || !data.data.metrics) {
                display.innerHTML = '<pre class="status-error">❌ داده‌ای دریافت نشد</pre>';
                return;
            }

            const metrics = data.data.metrics;
            const modelStatus = metrics.model_status?.value || {};
            const loaded = modelStatus.loaded ? '✅ فعال' : '📦 دمو';
            const version = modelStatus.version || 'نامشخص';
            const accuracy = metrics.model_accuracy?.value !== undefined ? (metrics.model_accuracy.value * 100).toFixed(1) + '%' : 'نامشخص';

            display.innerHTML = `
                <div><span style="color:#00d4ff;">وضعیت:</span> ${loaded}</div>
                <div><span style="color:#7a8fa8;">نسخه:</span> ${version}</div>
                <div><span style="color:#00ff88;">دقت:</span> ${accuracy}</div>
            `;
        }

        // ============================================================
        // 5. به‌روزرسانی وضعیت دیتابیس‌ها
        // ============================================================
        function updateDatabaseStatus(data) {
            const display = document.getElementById('dbDisplay');
            if (!data || !data.data || !data.data.metrics) {
                display.innerHTML = '<pre class="status-error">❌ داده‌ای دریافت نشد</pre>';
                return;
            }

            const metrics = data.data.metrics;
            const dbStatus = metrics.databases?.value || {};

            const pg = dbStatus.postgresql ? '🟢 متصل' : '🔴 قطع';
            const redis = dbStatus.redis ? '🟢 متصل' : '🔴 قطع';
            const sqlite = dbStatus.sqlite ? '🟢 متصل' : '🔴 قطع';

            display.innerHTML = `
                <div><span style="color:#3366ff;">🐘 PostgreSQL:</span> ${pg}</div>
                <div><span style="color:#ff4444;">⚡ Redis:</span> ${redis}</div>
                <div><span style="color:#00ff88;">📄 SQLite:</span> ${sqlite}</div>
            `;
        }

        // ============================================================
        // 6. اجرا در زمان بارگذاری صفحه
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // بارگذاری خودکار منو
            loadNavDebug();
            // دریافت خودکار داده‌ها
            fetchRawMetrics();
        });

        console.log('🐞 صفحه دیباگ داشبورد بارگذاری شد!');
    </script>
</body>
</html>
