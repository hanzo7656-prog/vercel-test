<!-- static/db-parts/sqlite.html -->
<div class="card-glow">
    <div class="card-header">
        <h3><i class="fas fa-file" style="color:#00ff88;"></i> مدیریت SQLite</h3>
        <div class="header-tools">
            <button class="btn-action success" onclick="refreshSqlite()">
                <i class="fas fa-sync-alt"></i> بروزرسانی
            </button>
            <button class="btn-action primary" onclick="compactSqlite()">
                <i class="fas fa-compress-alt"></i> فشرده‌سازی
            </button>
            <button class="btn-action" onclick="downloadSqlite()">
                <i class="fas fa-download"></i> دانلود
            </button>
        </div>
    </div>

    <div class="stats-grid" id="sqliteStats">
        <!-- کارت‌های آماری SQLite -->
    </div>

    <div class="table-wrap">
        <table class="table-modern" id="sqliteTable">
            <thead>
                <tr>
                    <th>نام جدول</th>
                    <th>تعداد رکوردها</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="sqliteTableBody">
                <tr><td colspan="3" style="text-align:center;color:var(--text-secondary);">در حال بارگذاری...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function init_sqlite() {
    loadSqliteStats();
    loadSqliteTables();
}

function loadSqliteStats() {
    const container = document.getElementById('sqliteStats');
    if (!container) return;

    fetch('/api/db/sqlite/tables')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const totalTables = data.data.length;
                const totalRows = data.data.reduce((sum, t) => sum + (t.row_count || 0), 0);

                container.innerHTML = `
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-table"></i></span>
                        <div class="stat-value cyan">${totalTables}</div>
                        <div class="stat-label">جدول</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-database"></i></span>
                        <div class="stat-value green">${totalRows.toLocaleString()}</div>
                        <div class="stat-label">رکورد</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-file"></i></span>
                        <div class="stat-value orange">SQLite</div>
                        <div class="stat-label">نوع دیتابیس</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-clock"></i></span>
                        <div class="stat-value pink">${new Date().toLocaleTimeString('fa-IR')}</div>
                        <div class="stat-label">آخرین بروزرسانی</div>
                    </div>
                `;
            }
        })
        .catch(() => {});
}

function loadSqliteTables() {
    const tbody = document.getElementById('sqliteTableBody');
    if (!tbody) return;

    fetch('/api/db/sqlite/tables')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--text-secondary);">جدولی یافت نشد</td></tr>';
                    return;
                }
                let html = '';
                data.data.forEach(table => {
                    html += `
                        <tr>
                            <td><strong>${table.table_name}</strong></td>
                            <td>${(table.row_count || 0).toLocaleString()}</td>
                            <td>
                                <div class="row-actions">
                                    <button onclick="viewSqliteTable('${table.table_name}')" title="مشاهده">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button onclick="exportSqliteTable('${table.table_name}')" title="خروجی">
                                        <i class="fas fa-file-export"></i>
                                    </button>
                                    <button class="danger" onclick="showToast('⚠️ حذف ${table.table_name} نیاز به تایید دارد', 'warning')" title="حذف">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } else {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#ff4444;">❌ خطا</td></tr>';
            }
        })
        .catch(() => {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#ff4444;">❌ خطا در ارتباط با سرور</td></tr>';
        });
}

function viewSqliteTable(tableName) {
    showToast(`📋 نمایش داده‌های ${tableName}...`, 'info');
    fetch(`/api/db/sqlite/table/${tableName}`)
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const columns = data.data.columns || [];
                const rows = data.data.rows || [];
                let msg = `📊 جدول: ${tableName}\n`;
                msg += `ستون‌ها: ${columns.join(', ')}\n`;
                msg += `تعداد رکوردها: ${rows.length}\n`;
                if (rows.length > 0) {
                    msg += '\nنمونه داده:\n';
                    rows.slice(0, 3).forEach(row => {
                        msg += JSON.stringify(row, null, 2) + '\n';
                    });
                }
                alert(msg);
            } else {
                showToast('❌ ' + (data.error || 'خطا'), 'error');
            }
        })
        .catch(() => showToast('❌ خطا', 'error'));
}

function exportSqliteTable(tableName) {
    showToast(`📤 خروجی ${tableName}...`, 'info');
    // پیاده‌سازی خروجی CSV
}

function compactSqlite() {
    showToast('⏳ فشرده‌سازی SQLite در حال انجام...', 'info');
    setTimeout(() => {
        showToast('✅ فشرده‌سازی با موفقیت انجام شد', 'success');
    }, 1500);
}

function downloadSqlite() {
    showToast('⏳ آماده‌سازی فایل برای دانلود...', 'info');
    setTimeout(() => {
        showToast('✅ دانلود شروع شد', 'success');
    }, 1000);
}

function refreshSqlite() {
    loadSqliteStats();
    loadSqliteTables();
    showToast('🔄 بروزرسانی شد', 'success');
}
</script>
