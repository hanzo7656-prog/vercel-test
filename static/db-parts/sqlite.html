<div class="db-card sqlite">
    <div class="db-header">
        <div class="db-info">
            <span class="db-icon"><i class="fas fa-file"></i></span>
            <span class="db-name">SQLite</span>
            <span class="db-description">بک‌آپ و گزارش‌ها</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="db-status" id="sqliteStatus">⏳ در حال بررسی...</span>
            <button class="btn-refresh" onclick="loadSqliteTables()" title="بروزرسانی">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:12px;background:#0a0e17;padding:10px;border-radius:8px;border:1px solid #1a2a3a;">
        <div style="text-align:center;">
            <div style="color:#7a8fa3;font-size:0.55rem;">جدول‌ها</div>
            <div style="color:#00ff88;font-size:1rem;font-weight:700;" id="sqliteTableCount">-</div>
        </div>
        <div style="text-align:center;">
            <div style="color:#7a8fa3;font-size:0.55rem;">کل رکوردها</div>
            <div style="color:#00d4ff;font-size:1rem;font-weight:700;" id="sqliteTotalRows">-</div>
        </div>
    </div>

    <div class="search-box">
        <select id="sqliteTableSelect" onchange="loadSqliteTableData()">
            <option value="">-- انتخاب جدول --</option>
        </select>
        <input type="text" id="sqliteSearchInput" placeholder="🔍 جستجو در رکوردها..." style="flex:2;">
        <button class="btn-refresh" onclick="loadSqliteTables()"><i class="fas fa-sync-alt"></i></button>
        <button class="btn-refresh" onclick="exportSqliteCSV()" style="color:#00ff88;" title="خروجی CSV">📥</button>
    </div>

    <div id="sqliteTableInfo" style="font-size:0.65rem;color:#7a8fa3;margin-bottom:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;">
        <span id="sqliteRowInfo">یک جدول را انتخاب کنید</span>
        <span id="sqliteUpdateTime"></span>
    </div>

    <div class="table-wrapper">
        <table class="table" id="sqliteTable">
            <thead id="sqliteTableHead"></thead>
            <tbody id="sqliteTableBody">
                <tr><td colspan="5" style="text-align:center;color:#4a5a6a;">یک جدول را انتخاب کنید</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let sqliteTables = [];
    let sqliteCurrentTable = '';

    function init_sqlite() {
        console.log('🔄 SQLite tab initialized');
        loadSqliteTables();
        document.getElementById('sqliteTableSelect').addEventListener('change', loadSqliteTableData);
        document.getElementById('sqliteSearchInput').addEventListener('keyup', function(e) {
            const search = this.value.toLowerCase();
            document.querySelectorAll('#sqliteTableBody tr').forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(search) ? '' : 'none';
            });
        });
    }

    function loadSqliteTables() {
        const select = document.getElementById('sqliteTableSelect');
        const status = document.getElementById('sqliteStatus');
        select.innerHTML = '<option value="">در حال بارگذاری...</option>';

        fetch('/api/db/sqlite/tables')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    sqliteTables = data.data;
                    select.innerHTML = '<option value="">-- انتخاب جدول --</option>';
                    let totalRows = 0;
                    sqliteTables.forEach(table => {
                        const option = document.createElement('option');
                        option.value = table.table_name;
                        const rowCount = table.row_count || 0;
                        totalRows += rowCount;
                        option.textContent = `${table.table_name} (${rowCount.toLocaleString()} رکورد)`;
                        select.appendChild(option);
                    });
                    document.getElementById('sqliteTableCount').textContent = sqliteTables.length;
                    document.getElementById('sqliteTotalRows').textContent = totalRows.toLocaleString();
                    status.textContent = '✅ متصل';
                    status.className = 'db-status online';
                } else {
                    status.textContent = '❌ خطا';
                    status.className = 'db-status offline';
                }
            })
            .catch(() => {
                status.textContent = '❌ قطع';
                status.className = 'db-status offline';
            });
    }

    function loadSqliteTableData() {
        const select = document.getElementById('sqliteTableSelect');
        const tableName = select.value;
        const tbody = document.getElementById('sqliteTableBody');
        const thead = document.getElementById('sqliteTableHead');
        const info = document.getElementById('sqliteRowInfo');
        const timeEl = document.getElementById('sqliteUpdateTime');

        if (!tableName) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#4a5a6a;">یک جدول را انتخاب کنید</td></tr>';
            thead.innerHTML = '';
            info.textContent = 'یک جدول را انتخاب کنید';
            timeEl.textContent = '';
            sqliteCurrentTable = '';
            return;
        }

        sqliteCurrentTable = tableName;
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#4a5a6a;">در حال بارگذاری...</td></tr>';

        fetch(`/api/db/sqlite/table/${tableName}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const columns = data.data.columns || [];
                    const rows = data.data.rows || [];

                    let headerHtml = '<tr>';
                    columns.forEach(col => {
                        headerHtml += `<th>${col}</th>`;
                    });
                    headerHtml += '</tr>';
                    thead.innerHTML = headerHtml;

                    if (rows.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="' + columns.length + '" style="text-align:center;color:#4a5a6a;">هیچ رکوردی یافت نشد</td></tr>';
                    } else {
                        let bodyHtml = '';
                        rows.forEach(row => {
                            bodyHtml += '<tr>';
                            columns.forEach(col => {
                                const value = row[col];
                                bodyHtml += `<td>${value !== null && value !== undefined ? value : '-'}</td>`;
                            });
                            bodyHtml += '</tr>';
                        });
                        tbody.innerHTML = bodyHtml;
                    }

                    info.textContent = `${rows.length} رکورد نمایش داده شده`;
                    timeEl.textContent = '🔄 ' + new Date().toLocaleTimeString('fa-IR');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ ' + data.error + '</td></tr>';
                }
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ خطا: ' + err.message + '</td></tr>';
            });
    }

    function exportSqliteCSV() {
        if (!sqliteCurrentTable) {
            showToast('⚠️ لطفاً ابتدا یک جدول را انتخاب کنید', 'warning');
            return;
        }
        const rows = document.querySelectorAll('#sqliteTableBody tr');
        let csv = '';
        rows.forEach(row => {
            const cells = row.querySelectorAll('td');
            const rowData = [];
            cells.forEach(cell => rowData.push(cell.textContent.trim()));
            csv += rowData.join(',') + '\n';
        });
        if (navigator.clipboard) {
            navigator.clipboard.writeText(csv).then(() => {
                showToast('📋 CSV کپی شد!', 'success');
            });
        }
    }
</script>
