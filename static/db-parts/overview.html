<!-- static/db-parts/overview.html -->
<div class="stats-grid" id="overviewStats">
    <!-- کارت‌های آماری -->
</div>

<div class="card-glow">
    <div class="card-header">
        <h3><i class="fas fa-server"></i> وضعیت دیتابیس‌ها</h3>
        <span class="badge-count" id="dbCount">۰ دیتابیس</span>
    </div>
    <div class="table-wrap">
        <table class="table-modern" id="overviewTable">
            <thead>
                <tr>
                    <th>نام</th>
                    <th>نوع</th>
                    <th>وضعیت</th>
                    <th>ورژن</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="overviewTableBody">
                <tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">در حال بارگذاری...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function init_overview() {
    const statsContainer = document.getElementById('overviewStats');
    const tableBody = document.getElementById('overviewTableBody');
    const countEl = document.getElementById('dbCount');

    fetch('/health/database')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const entries = Object.entries(data.data);
                if (countEl) countEl.textContent = entries.length + ' دیتابیس';

                // کارت‌های آماری
                let statsHtml = '';
                let connected = 0;
                entries.forEach(([name, info]) => {
                    if (info.connected) connected++;
                    const icon = info.type === 'redis' ? 'fa-bolt' :
                                info.type === 'postgresql' ? 'fa-database' : 'fa-file';
                    const color = info.connected ? 'green' : 'pink';
                    statsHtml += `
                        <div class="stat-item">
                            <span class="stat-icon"><i class="fas ${icon}"></i></span>
                            <div class="stat-value ${color}">${name}</div>
                            <div class="stat-label">${info.type || 'unknown'}</div>
                            <div class="stat-sub">
                                <span class="chip ${info.connected ? 'online' : 'offline'}">
                                    ${info.connected ? '✅ متصل' : '❌ قطع'}
                                </span>
                            </div>
                        </div>
                    `;
                });
                statsContainer.innerHTML = statsHtml;

                // جدول
                let tableHtml = '';
                entries.forEach(([name, info]) => {
                    const status = info.connected ? 'online' : 'offline';
                    tableHtml += `
                        <tr>
                            <td><strong>${name}</strong></td>
                            <td>${info.type || '—'}</td>
                            <td><span class="chip ${status}">${info.connected ? '🟢 متصل' : '🔴 قطع'}</span></td>
                            <td>${info.version || '—'}</td>
                            <td>
                                <div class="row-actions">
                                    <button onclick="showToast('🔄 پینگ ${name}...', 'info')" title="پینگ">
                                        <i class="fas fa-satellite-dish"></i>
                                    </button>
                                    <button onclick="showToast('📊 آمار ${name} در حال بارگذاری...', 'info')" title="آمار">
                                        <i class="fas fa-chart-bar"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = tableHtml;

            } else {
                statsContainer.innerHTML = '<p style="color:#ff4444;">❌ خطا در دریافت اطلاعات</p>';
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ خطا</td></tr>';
            }
        })
        .catch(() => {
            statsContainer.innerHTML = '<p style="color:#ff4444;">❌ خطا در ارتباط با سرور</p>';
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ خطا</td></tr>';
        });
}
</script>
