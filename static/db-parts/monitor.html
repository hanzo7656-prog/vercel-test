<!-- static/db-parts/monitor.html -->
<div class="card-glow">
    <div class="card-header">
        <h3><i class="fas fa-chart-line"></i> مانیتورینگ لحظه‌ای</h3>
        <div class="header-tools">
            <button class="btn-action success" onclick="toggleMonitor()">
                <i class="fas fa-play"></i> شروع
            </button>
            <button class="btn-action" onclick="clearMonitorLogs()">
                <i class="fas fa-eraser"></i> پاک کردن لاگ
            </button>
        </div>
    </div>

    <div class="stats-grid" id="monitorStats">
        <div class="stat-item">
            <span class="stat-icon"><i class="fas fa-server"></i></span>
            <div class="stat-value cyan" id="monitorUptime">—</div>
            <div class="stat-label">آپتایم سیستم</div>
        </div>
        <div class="stat-item">
            <span class="stat-icon"><i class="fas fa-microchip"></i></span>
            <div class="stat-value green" id="monitorCpu">—</div>
            <div class="stat-label">مصرف CPU</div>
        </div>
        <div class="stat-item">
            <span class="stat-icon"><i class="fas fa-memory"></i></span>
            <div class="stat-value orange" id="monitorMemory">—</div>
            <div class="stat-label">مصرف RAM</div>
        </div>
        <div class="stat-item">
            <span class="stat-icon"><i class="fas fa-database"></i></span>
            <div class="stat-value pink" id="monitorDbConnections">—</div>
            <div class="stat-label">اتصالات دیتابیس</div>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;">
        <div class="card-glow" style="padding:14px 16px;">
            <div style="font-size:0.65rem;color:var(--text-secondary);">لاگ‌های سیستم</div>
            <div id="monitorLogs" style="max-height:150px;overflow-y:auto;font-family:'Courier New',monospace;font-size:0.65rem;color:var(--text-secondary);line-height:1.8;margin-top:4px;">
                <div>⏳ در انتظار شروع مانیتورینگ...</div>
            </div>
        </div>
        <div class="card-glow" style="padding:14px 16px;">
            <div style="font-size:0.65rem;color:var(--text-secondary);">وضعیت سرویس‌ها</div>
            <div id="monitorServices" style="margin-top:4px;">
                <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.7rem;border-bottom:1px solid rgba(0,212,255,0.03);">
                    <span>🟢 PostgreSQL</span>
                    <span style="color:var(--accent-green);">✅ متصل</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.7rem;border-bottom:1px solid rgba(0,212,255,0.03);">
                    <span>⚡ Redis</span>
                    <span style="color:var(--accent-green);">✅ متصل</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.7rem;">
                    <span>📄 SQLite</span>
                    <span style="color:var(--accent-green);">✅ متصل</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let monitorInterval = null;
let monitorRunning = false;
const monitorLogs = [];

function init_monitor() {
    // بارگذاری اولیه
    updateMonitorStats();
}

function toggleMonitor() {
    const btn = event?.target?.closest('.btn-action') || document.querySelector('.btn-action.success');
    if (monitorRunning) {
        clearInterval(monitorInterval);
        monitorRunning = false;
        if (btn) {
            btn.innerHTML = '<i class="fas fa-play"></i> شروع';
            btn.className = 'btn-action success';
        }
        addMonitorLog('⏹️ مانیتورینگ متوقف شد');
        showToast('⏹️ مانیتورینگ متوقف شد', 'info');
    } else {
        monitorRunning = true;
        if (btn) {
            btn.innerHTML = '<i class="fas fa-pause"></i> توقف';
            btn.className = 'btn-action danger';
        }
        addMonitorLog('▶️ مانیتورینگ شروع شد');
        updateMonitorStats();
        monitorInterval = setInterval(updateMonitorStats, 3000);
        showToast('▶️ مانیتورینگ شروع شد', 'success');
    }
}

function updateMonitorStats() {
    // آپتایم
    const uptimeEl = document.getElementById('monitorUptime');
    if (uptimeEl) {
        fetch('/stats')
            .then(res => res.json())
            .then(data => {
                if (data.uptime) {
                    const parts = data.uptime.split(':').map(Number);
                    let totalSeconds = 0;
                    if (parts.length === 3) totalSeconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
                    else if (parts.length === 2) totalSeconds = parts[0] * 60 + parts[1];
                    else totalSeconds = parts[0] || 0;

                    if (totalSeconds < 60) uptimeEl.textContent = totalSeconds + 's';
                    else if (totalSeconds < 3600) uptimeEl.textContent = Math.floor(totalSeconds / 60) + 'm';
                    else uptimeEl.textContent = Math.floor(totalSeconds / 3600) + 'h ' + Math.floor((totalSeconds % 3600) / 60) + 'm';
                }
            })
            .catch(() => {});
    }

    // CPU
    const cpuEl = document.getElementById('monitorCpu');
    if (cpuEl) {
        fetch('/health/cpu')
            .then(res => res.json())
            .then(data => {
                const cpu = data.cpu_percent || 0;
                const color = cpu > 80 ? '#ff4444' : cpu > 60 ? '#ff8800' : 'var(--accent-green)';
                cpuEl.textContent = cpu.toFixed(1) + '%';
                cpuEl.style.color = color;
            })
            .catch(() => {});
    }

    // RAM
    const memEl = document.getElementById('monitorMemory');
    if (memEl) {
        fetch('/stats/memory')
            .then(res => res.json())
            .then(data => {
                if (data.success && data.data) {
                    const pct = data.data.percent || 0;
                    const color = pct > 80 ? '#ff4444' : pct > 60 ? '#ff8800' : 'var(--accent-green)';
                    memEl.textContent = pct.toFixed(1) + '%';
                    memEl.style.color = color;
                }
            })
            .catch(() => {});
    }

    // اتصالات دیتابیس
    const dbEl = document.getElementById('monitorDbConnections');
    if (dbEl) {
        fetch('/health/database')
            .then(res => res.json())
            .then(data => {
                if (data.success && data.data) {
                    const entries = Object.entries(data.data);
                    const connected = entries.filter(([_, info]) => info.connected).length;
                    dbEl.textContent = connected + '/' + entries.length;
                    dbEl.style.color = connected === entries.length ? 'var(--accent-green)' : '#ff8800';
                }
            })
            .catch(() => {});
    }

    // لاگ‌های دوره‌ای
    if (monitorRunning) {
        const statuses = ['✅ پایدار', '⚡ فعال', '📊 در حال پردازش'];
        const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
        addMonitorLog(`🔄 ${new Date().toLocaleTimeString('fa-IR')} - ${randomStatus}`);
    }
}

function addMonitorLog(message) {
    const container = document.getElementById('monitorLogs');
    if (!container) return;

    monitorLogs.push(message);
    if (monitorLogs.length > 50) monitorLogs.shift();

    let html = '';
    monitorLogs.slice(-20).forEach(log => {
        html += `<div>${log}</div>`;
    });
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
}

function clearMonitorLogs() {
    monitorLogs.length = 0;
    const container = document.getElementById('monitorLogs');
    if (container) container.innerHTML = '<div>🧹 لاگ‌ها پاک شدند</div>';
    showToast('🧹 لاگ‌ها پاک شدند', 'info');
}
</script>
