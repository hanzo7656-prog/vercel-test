<!-- static/db-parts/explorer.html -->
<div class="card-glow">
    <div class="card-header">
        <h3><i class="fas fa-search"></i> کاوشگر دیتابیس</h3>
        <div class="header-tools">
            <button class="btn-action success" onclick="exportData()">
                <i class="fas fa-file-export"></i> خروجی CSV
            </button>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="explorerSearch" placeholder="جستجو در دیتابیس..." onkeyup="searchExplorer(this.value)">
        <select id="explorerTarget" onchange="searchExplorer(document.getElementById('explorerSearch').value)">
            <option value="all">همه دیتابیس‌ها</option>
            <option value="postgresql">PostgreSQL</option>
            <option value="redis">Redis</option>
            <option value="sqlite">SQLite</option>
        </select>
        <button class="btn-action primary" onclick="searchExplorer(document.getElementById('explorerSearch').value)">
            <i class="fas fa-search"></i> جستجو
        </button>
        <button class="btn-action" onclick="clearSearch()">
            <i class="fas fa-times"></i> پاک کردن
        </button>
    </div>

    <div class="table-wrap">
        <table class="table-modern" id="explorerTable">
            <thead>
                <tr>
                    <th>دیتابیس</th>
                    <th>کلید/جدول</th>
                    <th>نوع</th>
                    <th>مقدار / محتوا</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="explorerTableBody">
                <tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">
                    برای جستجو عبارت مورد نظر را وارد کنید
                </td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let explorerResults = [];

function searchExplorer(query) {
    const tbody = document.getElementById('explorerTableBody');
    const target = document.getElementById('explorerTarget').value;

    if (!query || query.length < 2) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">حداقل ۲ کاراکتر وارد کنید</td></tr>';
        return;
    }

    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;"><div class="spinner-glow" style="width:24px;height:24px;margin:0 auto;"></div></td></tr>';

    fetch(`/api/db/search?q=${encodeURIComponent(query)}&target=${target}`)
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                explorerResults = data.data;
                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">نتیجه‌ای یافت نشد</td></tr>';
                    return;
                }
                let html = '';
                data.data.slice(0, 30).forEach(item => {
                    const dbIcon = item.database === 'PostgreSQL' ? '🐘' :
                                   item.database === 'Redis' ? '⚡' : '📄';
                    const content = item.content?.length > 80 ? item.content.substring(0, 80) + '...' : item.content || '—';
                    html += `
                        <tr>
                            <td>${dbIcon} ${item.database}</td>
                            <td><strong>${item.key || item.table || '—'}</strong></td>
                            <td>${item.type || 'table'}</td>
                            <td style="font-family:'Courier New',monospace;font-size:0.7rem;color:var(--text-secondary);">${content}</td>
                            <td>
                                <div class="row-actions">
                                    <button onclick="copyToClipboard('${content.replace(/'/g, "\\'")}')" title="کپی">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                    <button onclick="showToast('📋 کپی شد!', 'success')" title="جزئیات">
                                        <i class="fas fa-info-circle"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ ' + (data.error || 'خطا') + '</td></tr>';
            }
        })
        .catch(() => {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ خطا در ارتباط با سرور</td></tr>';
        });
}

function clearSearch() {
    document.getElementById('explorerSearch').value = '';
    document.getElementById('explorerTableBody').innerHTML = 
        '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">برای جستجو عبارت مورد نظر را وارد کنید</td></tr>';
}

function exportData() {
    if (explorerResults.length === 0) {
        showToast('⚠️ داده‌ای برای خروجی وجود ندارد', 'warning');
        return;
    }
    // ایجاد CSV
    let csv = 'Database,Key,Type,Content\n';
    explorerResults.forEach(item => {
        const content = (item.content || '').replace(/,/g, ';').replace(/\n/g, ' ');
        csv += `${item.database},${item.key || item.table || ''},${item.type || ''},"${content}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `explorer_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ خروجی CSV دانلود شد', 'success');
}

function copyToClipboard(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('📋 کپی شد!', 'success'));
    } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('📋 کپی شد!', 'success'); } catch {}
        document.body.removeChild(ta);
    }
}
</script>
