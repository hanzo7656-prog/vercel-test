<div class="db-card">
    <div class="db-header">
        <div class="db-info">
            <span class="db-icon"><i class="fas fa-search"></i></span>
            <span class="db-name">کاوشگر یکپارچه</span>
            <span class="db-description">جستجو در همه دیتابیس‌ها</span>
        </div>
    </div>

    <div class="search-box" style="flex-wrap:wrap;">
        <input type="text" id="explorerSearch" placeholder="🔍 عبارت مورد نظر را وارد کنید..." style="flex:3;min-width:150px;">
        <select id="explorerTarget" style="flex:1;min-width:120px;">
            <option value="all">🌐 همه دیتابیس‌ها</option>
            <option value="postgresql">🐘 PostgreSQL</option>
            <option value="redis">⚡ Redis</option>
            <option value="sqlite">📁 SQLite</option>
        </select>
        <select id="explorerLimit" style="flex:0.5;min-width:80px;">
            <option value="10">۱۰ نتیجه</option>
            <option value="25" selected>۲۵ نتیجه</option>
            <option value="50">۵۰ نتیجه</option>
        </select>
        <button class="btn-refresh" onclick="searchExplorer()" style="background:#00d4ff;color:#0a0e17;padding:8px 16px;border-radius:8px;border:none;font-weight:600;cursor:pointer;">
            <i class="fas fa-search"></i> جستجو
        </button>
        <button class="btn-refresh" onclick="clearExplorer()" style="color:#7a8fa3;">✕ پاک کردن</button>
    </div>

    <div id="explorerResults" style="margin-top:12px;">
        <div style="text-align:center;padding:30px 0;color:#4a5a6a;">
            <i class="fas fa-search" style="font-size:3rem;opacity:0.2;"></i>
            <p style="margin-top:8px;font-size:0.85rem;">برای شروع جستجو، عبارت را وارد کنید</p>
        </div>
    </div>
</div>

<script>
    function init_explorer() {
        console.log('🔄 Explorer tab initialized');
        document.getElementById('explorerSearch').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') searchExplorer();
        });
    }

    function searchExplorer() {
        const query = document.getElementById('explorerSearch').value.trim();
        const target = document.getElementById('explorerTarget').value;
        const limit = document.getElementById('explorerLimit').value;
        const results = document.getElementById('explorerResults');

        if (!query) {
            results.innerHTML = '<p style="color:#7a8fa3;text-align:center;font-size:0.8rem;">🔍 لطفاً عبارت جستجو را وارد کنید</p>';
            return;
        }

        results.innerHTML = '<div class="loading" style="padding:20px;"><div class="spinner" style="width:24px;height:24px;"></div><p style="color:#7a8fa3;font-size:0.8rem;">⏳ در حال جستجو...</p></div>';

        fetch(`/api/db/search?q=${encodeURIComponent(query)}&target=${target}&limit=${limit}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    renderSearchResults(data.data, query);
                } else {
                    results.innerHTML = `<p style="color:#ff4444;text-align:center;">❌ ${data.error}</p>`;
                }
            })
            .catch(err => {
                results.innerHTML = `<p style="color:#ff4444;text-align:center;">❌ ${err.message}</p>`;
            });
    }

    function renderSearchResults(results, query) {
        const container = document.getElementById('explorerResults');
        if (!results || results.length === 0) {
            container.innerHTML = `
                <div style="text-align:center;padding:30px 0;color:#4a5a6a;">
                    <i class="fas fa-search" style="font-size:2rem;opacity:0.2;"></i>
                    <p style="margin-top:8px;">🔍 نتیجه‌ای برای "<strong>${query}</strong>" یافت نشد</p>
                </div>
            `;
            return;
        }

        let html = `<div style="font-size:0.75rem;color:#7a8fa3;margin-bottom:8px;">${results.length} نتیجه برای "<strong>${query}</strong>"</div>`;
        results.forEach(item => {
            const dbColors = {
                'postgresql': '#3366ff',
                'redis': '#ff4444',
                'sqlite': '#00ff88'
            };
            const color = dbColors[item.database.toLowerCase()] || '#00d4ff';

            html += `
                <div class="db-card" style="margin-bottom:8px;padding:12px;border-left:3px solid ${color};">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                        <span style="color:${color};font-weight:600;font-size:0.85rem;">
                            <i class="fas ${item.database === 'Redis' ? 'fa-bolt' : item.database === 'PostgreSQL' ? 'fa-database' : 'fa-file'}"></i>
                            ${item.database}
                        </span>
                        <span class="badge" style="background:rgba(0,212,255,0.1);color:#00d4ff;font-size:0.55rem;">${item.type}</span>
                    </div>
                    <div style="font-family:'Courier New',monospace;font-size:0.7rem;color:#e0e6ed;margin-top:4px;word-break:break-all;max-height:80px;overflow-y:auto;background:#0a0e17;padding:6px;border-radius:4px;">
                        ${item.content}
                    </div>
                    <div style="font-size:0.55rem;color:#4a5a6a;margin-top:4px;">
                        ${item.table || item.key || ''}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function clearExplorer() {
        document.getElementById('explorerSearch').value = '';
        document.getElementById('explorerResults').innerHTML = `
            <div style="text-align:center;padding:30px 0;color:#4a5a6a;">
                <i class="fas fa-search" style="font-size:3rem;opacity:0.2;"></i>
                <p style="margin-top:8px;font-size:0.85rem;">برای شروع جستجو، عبارت را وارد کنید</p>
            </div>
        `;
    }
</script>
