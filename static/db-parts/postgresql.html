<!-- static/db-parts/postgresql.html -->
<div class="card-glow">
    <div class="card-header">
        <h3><i class="fas fa-database" style="color:#3366ff;"></i> مدیریت PostgreSQL</h3>
        <div class="header-tools">
            <button class="btn-action success" onclick="refreshPostgres()">
                <i class="fas fa-sync-alt"></i> بروزرسانی
            </button>
            <button class="btn-action primary" onclick="showToast('⏳ بک‌آپ در حال انجام...', 'info')">
                <i class="fas fa-download"></i> بک‌آپ
            </button>
        </div>
    </div>

    <div class="stats-grid" id="postgresStats">
        <!-- کارت‌های آماری PostgreSQL -->
    </div>

    <div class="search-bar">
        <input type="text" id="postgresSearch" placeholder="جستجوی جدول..." onkeyup="filterPostgresTables(this.value)">
        <button class="btn-action primary" onclick="filterPostgresTables(document.getElementById('postgresSearch').value)">
            <i class="fas fa-search"></i>
        </button>
    </div>

    <div class="table-wrap">
        <table class="table-modern" id="postgresTable">
            <thead>
                <tr>
                    <th>نام جدول</th>
                    <th>تعداد رکوردها</th>
                    <th>حجم (MB)</th>
                    <th>آخرین بروزرسانی</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="postgresTableBody">
                <tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">در حال بارگذاری...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function init_postgres() {
    loadPostgresStats();
    loadPostgresTables();
}

function loadPostgresStats() {
    const container = document.getElementById('postgresStats');
    if (!container) return;

    fetch('/api/db/postgresql/tables')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const totalTables = data.data.length;
                const totalRows = data.data.reduce((sum, t) => sum + (t.row_count || 0), 0);
                const totalSize = data.data.reduce((sum, t) => sum + (t.size_mb || 0), 0);

                container.innerHTML = `
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-table"></i></span>
                        <div class="stat-value cyan">${totalTables}</div>
                        <div class="stat-label">جدول</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-database"></i></span>
                        <div class="stat-value green">${totalRows.toLocaleString()}</div>
                        <div class="stat-label">رکورد</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-weight"></i></span>
                        <div class="stat-value orange">${totalSize.toFixed(1)} MB</div>
                        <div class="stat-label">حجم کل</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-clock"></i></span>
                        <div class="stat-value pink">${new Date().toLocaleTimeString('fa-IR')}</div>
                        <div class="stat-label">آخرین بروزرسانی</div>
                    </div>
                `;
            }
        })
        .catch(() => {});
}

function loadPostgresTables(filter = '') {
    const tbody = document.getElementById('postgresTableBody');
    if (!tbody) return;

    fetch('/api/db/postgresql/tables')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                let tables = data.data;
                if (filter) {
                    tables = tables.filter(t => t.table_name.includes(filter));
                }
                if (tables.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">جدولی یافت نشد</td></tr>';
                    return;
                }
                let html = '';
                tables.forEach(table => {
                    const size = table.size_mb ? table.size_mb.toFixed(2) : '0.00';
                    html += `
                        <tr>
                            <td><strong>${table.table_name}</strong></td>
                            <td>${(table.row_count || 0).toLocaleString()}</td>
                            <td>${size}</td>
                            <td>${table.last_update ? new Date(table.last_update).toLocaleString('fa-IR') : '—'}</td>
                            <td>
                                <div class="row-actions">
                                    <button onclick="viewTable('${table.table_name}')" title="مشاهده">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button onclick="showToast('📊 آنالیز ${table.table_name}...', 'info')" title="آنالیز">
                                        <i class="fas fa-chart-line"></i>
                                    </button>
                                    <button class="danger" onclick="showToast('⚠️ حذف ${table.table_name} نیاز به تایید دارد', 'warning')" title="حذف">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ خطا</td></tr>';
            }
        })
        .catch(() => {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ خطا در ارتباط با سرور</td></tr>';
        });
}

function filterPostgresTables(value) {
    loadPostgresTables(value);
}

function viewTable(tableName) {
    showToast(`📋 نمایش داده‌های جدول ${tableName}...`, 'info');
    fetch(`/api/db/postgresql/table/${tableName}`)
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const columns = data.data.columns || [];
                const rows = data.data.rows || [];
                let msg = `📊 جدول: ${tableName}\n`;
                msg += `ستون‌ها: ${columns.map(c => c.column_name).join(', ')}\n`;
                msg += `تعداد رکوردها: ${rows.length}\n`;
                if (rows.length > 0) {
                    msg += '\nنمونه داده:\n';
                    rows.slice(0, 3).forEach(row => {
                        msg += JSON.stringify(row, null, 2) + '\n';
                    });
                }
                alert(msg);
            } else {
                showToast('❌ ' + (data.error || 'خطا'), 'error');
            }
        })
        .catch(() => showToast('❌ خطا', 'error'));
}

function refreshPostgres() {
    loadPostgresStats();
    loadPostgresTables();
    showToast('🔄 بروزرسانی شد', 'success');
}
</script>
