<div class="db-card redis">
    <div class="db-header">
        <div class="db-info">
            <span class="db-icon"><i class="fas fa-bolt"></i></span>
            <span class="db-name">Redis</span>
            <span class="db-description">کش و داده‌های سریع</span>
        </div>
        <span class="db-status" id="redisStatus">⏳ در حال بررسی...</span>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
        <span style="color:#7a8fa3;font-size:0.7rem;">🔑 کلیدها: <span id="redisKeyCount">۰</span></span>
        <span style="color:#7a8fa3;font-size:0.7rem;">💾 حافظه: <span id="redisMemory">-</span></span>
        <button class="btn-refresh" onclick="loadRedisKeys()" style="margin-right:auto;">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <div class="search-box">
        <input type="text" id="redisSearchInput" placeholder="🔍 جستجو در کلیدها...">
        <select id="redisTypeFilter" onchange="filterRedisKeys()">
            <option value="all">همه انواع</option>
            <option value="string">String</option>
            <option value="hash">Hash</option>
            <option value="list">List</option>
            <option value="set">Set</option>
            <option value="zset">ZSet</option>
        </select>
    </div>

    <div class="table-wrapper">
        <table class="table" id="redisTable">
            <thead>
                <tr>
                    <th>🔑 کلید</th>
                    <th>📊 نوع</th>
                    <th>⏱️ TTL</th>
                    <th>📦 حجم</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="redisTableBody">
                <tr><td colspan="5" style="text-align:center;color:#4a5a6a;">در حال بارگذاری کلیدها...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- مودال نمایش مقدار -->
<div id="redisValueModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:#111d2b;border:1px solid #1a2a3a;border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 style="color:#e0e6ed;font-size:1rem;">📄 مقدار کلید</h3>
            <button onclick="closeRedisModal()" style="background:transparent;border:none;color:#ff4444;font-size:1.2rem;cursor:pointer;">✕</button>
        </div>
        <div id="redisModalContent" style="background:#0a0e17;padding:12px;border-radius:8px;color:#e0e6ed;font-family:'Courier New',monospace;font-size:0.85rem;word-break:break-all;max-height:300px;overflow-y:auto;"></div>
        <div style="margin-top:12px;display:flex;gap:8px;">
            <button class="btn-refresh" onclick="copyRedisValue()">📋 کپی</button>
            <button class="btn-refresh" onclick="deleteRedisKey()" style="color:#ff4444;">🗑️ حذف کلید</button>
        </div>
    </div>
</div>

<script>
    let redisKeys = [];
    let selectedRedisKey = '';

    function loadRedisKeys() {
        const tbody = document.getElementById('redisTableBody');
        const status = document.getElementById('redisStatus');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#4a5a6a;">در حال بارگذاری...</td></tr>';

        fetch('/api/db/redis/keys')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    redisKeys = data.data;
                    document.getElementById('redisKeyCount').textContent = data.count;
                    renderRedisKeys(redisKeys);
                    status.textContent = '✅ متصل';
                    status.className = 'db-status online';
                } else {
                    status.textContent = '❌ خطا';
                    status.className = 'db-status offline';
                }
            })
            .catch(() => {
                status.textContent = '❌ قطع';
                status.className = 'db-status offline';
            });
    }

    function renderRedisKeys(keys) {
        const tbody = document.getElementById('redisTableBody');
        if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#4a5a6a;">هیچ کلیدی یافت نشد</td></tr>';
            return;
        }

        let html = '';
        keys.forEach(item => {
            const size = item.size > 1024 ? (item.size/1024).toFixed(1) + 'KB' : item.size + 'B';
            html += `
                <tr>
                    <td style="font-family:'Courier New',monospace;font-size:0.75rem;">${item.key}</td>
                    <td><span class="badge" style="background:rgba(0,212,255,0.1);color:#00d4ff;">${item.type}</span></td>
                    <td>${item.ttl}</td>
                    <td>${size}</td>
                    <td>
                        <button class="btn-refresh" onclick="viewRedisKey('${item.key}')" style="padding:2px 8px;font-size:0.6rem;">👁️</button>
                        <button class="btn-refresh" onclick="deleteRedisKeyConfirm('${item.key}')" style="padding:2px 8px;font-size:0.6rem;color:#ff4444;">🗑️</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    // جستجو
    document.getElementById('redisSearchInput').addEventListener('keyup', function() {
        const search = this.value.toLowerCase();
        const filtered = redisKeys.filter(item => item.key.toLowerCase().includes(search));
        renderRedisKeys(filtered);
    });

    // فیلتر نوع
    function filterRedisKeys() {
        const type = document.getElementById('redisTypeFilter').value;
        const search = document.getElementById('redisSearchInput').value.toLowerCase();
        let filtered = redisKeys;
        if (type !== 'all') {
            filtered = filtered.filter(item => item.type === type);
        }
        if (search) {
            filtered = filtered.filter(item => item.key.toLowerCase().includes(search));
        }
        renderRedisKeys(filtered);
    }

    // مشاهده مقدار
    function viewRedisKey(key) {
        selectedRedisKey = key;
        const modal = document.getElementById('redisValueModal');
        const content = document.getElementById('redisModalContent');
        modal.style.display = 'flex';
        content.textContent = 'در حال بارگذاری...';

        fetch(`/api/db/redis/key/${encodeURIComponent(key)}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const val = data.data.value;
                    const formatted = typeof val === 'object' ? JSON.stringify(val, null, 2) : val;
                    content.textContent = formatted;
                } else {
                    content.textContent = '❌ ' + data.error;
                }
            })
            .catch(err => {
                content.textContent = '❌ ' + err.message;
            });
    }

    function closeRedisModal() {
        document.getElementById('redisValueModal').style.display = 'none';
    }

    function copyRedisValue() {
        const content = document.getElementById('redisModalContent');
        const text = content.textContent;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 کپی شد!', 'success');
            });
        } else {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('📋 کپی شد!', 'success');
        }
    }

    function deleteRedisKeyConfirm(key) {
        if (!confirm(`آیا از حذف کلید "${key}" اطمینان دارید؟`)) return;
        // TODO: پیاده‌سازی حذف
        showToast('🗑️ کلید حذف شد', 'success');
        loadRedisKeys();
    }

    // اجرا
    loadRedisKeys();
</script>
