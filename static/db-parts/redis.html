<!-- static/db-parts/redis.html -->
<div class="card-glow">
    <div class="card-header">
        <h3><i class="fas fa-bolt" style="color:#ff4444;"></i> مدیریت Redis</h3>
        <div class="header-tools">
            <button class="btn-action success" onclick="refreshRedis()">
                <i class="fas fa-sync-alt"></i> بروزرسانی
            </button>
            <button class="btn-action danger" onclick="clearAllRedis()">
                <i class="fas fa-trash-alt"></i> پاک کردن همه
            </button>
        </div>
    </div>

    <div class="stats-grid" id="redisStats">
        <!-- کارت‌های آماری Redis -->
    </div>

    <div class="search-bar">
        <input type="text" id="redisSearch" placeholder="جستجوی کلید..." onkeyup="filterRedisKeys(this.value)">
        <button class="btn-action primary" onclick="filterRedisKeys(document.getElementById('redisSearch').value)">
            <i class="fas fa-search"></i>
        </button>
        <button class="btn-action" onclick="clearRedisSearch()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="table-wrap">
        <table class="table-modern" id="redisTable">
            <thead>
                <tr>
                    <th>کلید</th>
                    <th>نوع</th>
                    <th>TTL</th>
                    <th>حجم</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="redisTableBody">
                <tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">در حال بارگذاری...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let redisData = [];

function init_redis() {
    loadRedisStats();
    loadRedisKeys();
}

function loadRedisStats() {
    const container = document.getElementById('redisStats');
    if (!container) return;

    fetch('/api/db/redis/keys')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const totalKeys = data.data.length;
                const types = {};
                let totalSize = 0;
                data.data.forEach(k => {
                    types[k.type] = (types[k.type] || 0) + 1;
                    totalSize += k.size || 0;
                });

                container.innerHTML = `
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-key"></i></span>
                        <div class="stat-value cyan">${totalKeys}</div>
                        <div class="stat-label">کلید</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-tag"></i></span>
                        <div class="stat-value pink">${Object.keys(types).length}</div>
                        <div class="stat-label">نوع</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-weight"></i></span>
                        <div class="stat-value orange">${(totalSize / 1024).toFixed(1)} KB</div>
                        <div class="stat-label">حجم کل</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon"><i class="fas fa-clock"></i></span>
                        <div class="stat-value green">${new Date().toLocaleTimeString('fa-IR')}</div>
                        <div class="stat-label">آخرین بروزرسانی</div>
                    </div>
                `;
            }
        })
        .catch(() => {});
}

function loadRedisKeys(filter = '') {
    const tbody = document.getElementById('redisTableBody');
    if (!tbody) return;

    fetch('/api/db/redis/keys')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                redisData = data.data;
                let keys = data.data;
                if (filter) {
                    keys = keys.filter(k => k.key.includes(filter));
                }
                if (keys.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">کلیدی یافت نشد</td></tr>';
                    return;
                }
                let html = '';
                keys.slice(0, 50).forEach(key => {
                    const ttlDisplay = key.ttl === '∞' ? '∞' : key.ttl + 's';
                    const typeColors = {
                        'string': 'cyan',
                        'hash': 'green',
                        'list': 'pink',
                        'set': 'orange',
                        'zset': 'purple'
                    };
                    const color = typeColors[key.type] || 'cyan';
                    html += `
                        <tr>
                            <td><strong style="color:var(--accent-${color});">${key.key}</strong></td>
                            <td><span class="chip ${color}">${key.type}</span></td>
                            <td>${ttlDisplay}</td>
                            <td>${key.size || 0} B</td>
                            <td>
                                <div class="row-actions">
                                    <button onclick="viewRedisKey('${key.key}')" title="مشاهده">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button onclick="copyRedisKey('${key.key}')" title="کپی">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                    <button class="danger" onclick="deleteRedisKey('${key.key}')" title="حذف">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ خطا</td></tr>';
            }
        })
        .catch(() => {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;">❌ خطا در ارتباط با سرور</td></tr>';
        });
}

function filterRedisKeys(value) {
    loadRedisKeys(value);
}

function clearRedisSearch() {
    document.getElementById('redisSearch').value = '';
    loadRedisKeys();
}

function viewRedisKey(key) {
    showToast(`🔍 دریافت ${key}...`, 'info');
    fetch(`/api/db/redis/key/${encodeURIComponent(key)}`)
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const val = data.data.value || '—';
                const msg = `📋 کلید: ${key}\nنوع: ${data.data.type}\nTTL: ${data.data.ttl}\n\nمقدار:\n${JSON.stringify(val, null, 2)}`;
                alert(msg);
            } else {
                showToast('❌ ' + (data.error || 'خطا'), 'error');
            }
        })
        .catch(() => showToast('❌ خطا', 'error'));
}

function copyRedisKey(key) {
    const keyToCopy = key;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(keyToCopy).then(() => showToast('📋 کپی شد!', 'success'));
    } else {
        const ta = document.createElement('textarea');
        ta.value = keyToCopy;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('📋 کپی شد!', 'success'); } catch {}
        document.body.removeChild(ta);
    }
}

function deleteRedisKey(key) {
    if (!confirm(`⚠️ آیا از حذف کلید "${key}" اطمینان دارید؟`)) return;
    showToast(`🗑️ در حال حذف ${key}...`, 'info');
    // اینجا باید API حذف کلید رو پیاده‌سازی کنید
    setTimeout(() => {
        showToast('✅ حذف شد', 'success');
        loadRedisKeys();
    }, 500);
}

function clearAllRedis() {
    if (!confirm('⚠️ هشدار! این عمل همه کلیدهای Redis را پاک می‌کند. ادامه می‌دهید؟')) return;
    showToast('⏳ در حال پاک کردن همه کلیدها...', 'warning');
    // پیاده‌سازی حذف همه
    setTimeout(() => {
        showToast('✅ همه کلیدها پاک شدند', 'success');
        loadRedisStats();
        loadRedisKeys();
    }, 1000);
}

function refreshRedis() {
    loadRedisStats();
    loadRedisKeys();
    showToast('🔄 بروزرسانی شد', 'success');
}
</script>
