<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آمار سیستم</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; min-height: 100vh; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard-header .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .menu-toggle {
            width: 44px; height: 44px; border-radius: 50%; background: #0d1624;
            border: 1px solid #1a2a3a; color: #e0e6ed; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 200;
        }
        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed; top: 80px; right: 20px;
            background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 10px 0;
            min-width: 200px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150; transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #a0b4c8; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0,212,255,0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.7rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 25px;
            margin-bottom: 20px;
        }
        .card-title { color: #00d4ff; font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .card-subtitle { color: #7a8fa3; font-size: 0.9rem; margin-bottom: 15px; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 25px;
            border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease; font-weight: 500; text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }

        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500;
        }
        .badge-success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .badge-warning { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
        .badge-danger { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }

        .table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .table th { text-align: right; padding: 12px 15px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 10px 15px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0,212,255,0.05); }

        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; gap: 15px; }
        .spinner { width: 50px; height: 50px; border: 4px solid #1a2a3a; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }

        @media (max-width: 768px) {
            .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .dashboard-header .status { font-size: 0.75rem; gap: 8px; }
            .container { padding: 12px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
            .row { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
            .flyout-menu a { font-size: 0.85rem; padding: 10px 16px; }
        }
    </style>
</head>
<body>

    <!-- منو -->
    <div id="navContainer"></div>

    <!-- محتوا -->
    <div class="container">
        <div class="card">
            <div class="card-title">📊 آمار سیستم</div>
            <div class="card-subtitle">آمار درخواست‌ها و عملکرد سیستم</div>
            <div style="margin-top:10px;">
                <button class="btn btn-primary" onclick="loadStats()">🔄 بروزرسانی</button>
            </div>
        </div>
        <div id="statsContent">
            <div class="loading"><div class="spinner"></div><p>در حال دریافت آمار...</p></div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        let statsStartTime = null;

        function loadStats() {
            const container = document.getElementById('statsContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال دریافت...</p></div>';

            fetch('/stats')
                .then(res => res.json())
                .then(data => {
                    if (data.uptime) {
                        const parts = data.uptime.split(':').map(Number);
                        let totalSeconds = 0;
                        if (parts.length === 3) {
                            totalSeconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
                        } else if (parts.length === 2) {
                            totalSeconds = parts[0] * 60 + parts[1];
                        } else {
                            totalSeconds = parts[0] || 0;
                        }
                        statsStartTime = Date.now() - (totalSeconds * 1000);
                    }

                    let html = '<div class="row">';

                    html += `
                        <div class="card">
                            <div class="card-title">📈 آمار کلی</div>
                            <table class="table">
                                <tr><td>مدل بارگذاری شده</td><td><span class="badge ${data.model_loaded ? 'badge-success' : 'badge-warning'}">${data.model_loaded ? '✅ بله' : '❌ خیر (DEMO)'}</span></td></tr>
                                <tr><td>آپتایم</td><td id="statsUptime">${data.uptime || '۰ ثانیه'}</td></tr>
                                <tr><td>زمان</td><td id="statsTimestamp">${data.timestamp ? new Date(data.timestamp).toLocaleString('fa-IR') : ''}</td></tr>
                            </table>
                        </div>
                    `;

                    if (data.api_stats) {
                        html += `
                            <div class="card">
                                <div class="card-title">🔌 آمار API</div>
                                <table class="table">
                                    <tr><td>کل درخواست‌ها</td><td>${data.api_stats.total_requests || 0}</td></tr>
                                    <tr><td>خطاها</td><td>${data.api_stats.errors || 0}</td></tr>
                                    <tr><td>اندازه کش</td><td>${data.api_stats.cache_size || 0}</td></tr>
                                    <tr><td>کلیدهای کش</td><td>${(data.api_stats.cache_keys || []).join(', ') || 'خالی'}</td></tr>
                                </table>
                            </div>
                        `;
                    }

                    html += `
                        <div class="card">
                            <div class="card-title">⏳ تسک‌های پس‌زمینه</div>
                            <table class="table">
                                <tr><td>تسک‌های در انتظار</td><td>${data.pending_tasks || 0}</td></tr>
                                <tr><td>کل تسک‌ها</td><td>${data.total_tasks || 0}</td></tr>
                            </table>
                        </div>
                    `;

                    html += '</div>';
                    container.innerHTML = html;

                    if (statsStartTime) {
                        updateStatsUptime();
                        setInterval(updateStatsUptime, 1000);
                    }
                })
                .catch(err => {
                    container.innerHTML = `<div class="card"><div class="card-title">❌ خطا</div><p style="color:#ff4444;">${err.message}</p></div>`;
                });
        }

        function updateStatsUptime() {
            const el = document.getElementById('statsUptime');
            if (!el || !statsStartTime) return;
            const elapsed = Math.floor((Date.now() - statsStartTime) / 1000);
            el.textContent = formatDuration(elapsed);
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadStats();
        });
    </script>

</body>
</html>
