<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آمار سیستم</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; min-height: 100vh; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard-header .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .menu-toggle {
            width: 44px; height: 44px; border-radius: 50%; background: #0d1624;
            border: 1px solid #1a2a3a; color: #e0e6ed; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 200;
        }
        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed; top: 80px; right: 20px;
            background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 10px 0;
            min-width: 200px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150; transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #a0b4c8; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0,212,255,0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.7rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .card:hover { border-color: rgba(0, 212, 255, 0.15); }
        .card-title {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-subtitle {
            color: #7a8fa3;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500;
        }
        .badge-success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .badge-warning { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
        .badge-danger { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        .badge-info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
        .badge-gray { background: rgba(255,255,255,0.05); color: #7a8fa3; border: 1px solid rgba(255,255,255,0.05); }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px;
            border: none; border-radius: 10px; font-size: 0.85rem; cursor: pointer;
            transition: all 0.3s ease; font-weight: 500; font-family: inherit;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }
        .btn-sm { padding: 5px 12px; font-size: 0.75rem; }

        .table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .table th { text-align: right; padding: 10px 12px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 10px 12px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0,212,255,0.03); }

        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }

        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #1a2a3a; border-top: 3px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .stat-item {
            background: #0a0e17;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #0d1624;
            text-align: center;
        }
        .stat-item .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #e0e6ed;
        }
        .stat-item .label {
            color: #4a5a6a;
            font-size: 0.7rem;
        }

        .uptime-display {
            font-family: 'Courier New', monospace;
            color: #00d4ff;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .row { grid-template-columns: 1fr; gap: 14px; }
            .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .container { padding: 12px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
            .stat-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
            .stat-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== MENU ===== -->
    <div id="navContainer"></div>

    <!-- ===== CONTENT ===== -->
    <div class="container">
        <div class="card">
            <div class="card-title"><i class="fas fa-chart-bar"></i> آمار سیستم</div>
            <div class="card-subtitle">آمار درخواست‌ها، عملکرد سیستم و وضعیت مدل</div>
            <button class="btn btn-primary btn-sm" onclick="loadStats()">
                <i class="fas fa-sync-alt"></i> بروزرسانی
            </button>
        </div>

        <div id="statsContent">
            <div class="loading"><div class="spinner"></div><p>در حال دریافت آمار...</p></div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        // ============================================================
        // بارگذاری منو
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        // ============================================================
        // متغیرها
        // ============================================================
        let statsInterval = null;
        let statsStartTime = null;

        // ============================================================
        // بارگذاری آمار
        // ============================================================
        function loadStats() {
            const container = document.getElementById('statsContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال دریافت آمار...</p></div>';

            Promise.all([
                fetch('/stats').then(res => res.json()),
                fetch('/model/status').then(res => res.json())
            ])
            .then(([statsData, modelData]) => {
                renderStats(statsData, modelData);
            })
            .catch(err => {
                container.innerHTML = `<div class="card" style="border-color:#ff4444;">
                    <div class="card-title" style="color:#ff4444;">❌ خطا</div>
                    <p style="color:#ff4444;">${err.message}</p>
                </div>`;
            });
        }

        // ============================================================
        // رندر آمار
        // ============================================================
        function renderStats(statsData, modelData) {
            const container = document.getElementById('statsContent');

            // ===== اطلاعات مدل =====
            const modelStats = modelData?.stats || {};
            const modelExists = modelData?.model_exists || false;
            const isRunning = modelData?.is_running || false;
            const isTraining = modelData?.is_training || false;
            const lastScore = modelStats?.last_score || null;
            const totalTrainings = modelStats?.total_trainings || 0;
            const dataPoints = modelStats?.data_points_used || 0;
            const lastTraining = modelStats?.last_training || null;
            const apiStatus = modelData?.api_status?.api_status || 'unknown';
            const creditsRemaining = modelData?.api_status?.credits_remaining || 0;
            
            // ✅ حالت مدل (BETA / DEMO)
            const mode = modelStats?.mode || 'DEMO';
            const modeDisplay = mode === 'BETA' ? '🧪 بتا' : '📦 دمو';
            const modeClass = mode === 'BETA' ? 'badge-success' : 'badge-warning';

            // دقت به درصد
            const scorePercent = lastScore !== null ? (lastScore * 100).toFixed(1) : '—';
            const scoreDisplay = lastScore !== null ? `${scorePercent}%` : '—';

            // وضعیت مدل
            let modelStatus = 'غیرفعال';
            let modelStatusClass = 'badge-gray';
            if (isTraining) {
                modelStatus = '⏳ در حال آموزش...';
                modelStatusClass = 'badge-warning';
            } else if (modelExists && isRunning) {
                modelStatus = '✅ فعال';
                modelStatusClass = 'badge-success';
            } else if (modelExists) {
                modelStatus = '⚠️ غیرفعال';
                modelStatusClass = 'badge-warning';
            }

            let html = '<div class="row">';

            // ===== کارت ۱: آمار کلی =====
            html += `
                <div class="card">
                    <div class="card-title"><i class="fas fa-server"></i> آمار کلی</div>
                    <table class="table">
                        <tr>
                            <td>وضعیت مدل</td>
                            <td><span class="badge ${modelStatusClass}">${modelStatus}</span></td>
                        </tr>
                        <tr>
                            <td>حالت مدل</td>
                            <td><span class="badge ${modeClass}">${modeDisplay}</span></td>
                        </tr>
                        <tr>
                            <td>آپتایم</td>
                            <td class="uptime-display" id="statsUptime">${statsData.uptime || '۰ ثانیه'}</td>
                        </tr>
                        <tr>
                            <td>زمان</td>
                            <td style="color:#7a8fa3;font-size:0.8rem;">${statsData.timestamp ? new Date(statsData.timestamp).toLocaleString('fa-IR') : ''}</td>
                        </tr>
                    </table>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="value">${totalTrainings}</div>
                            <div class="label">تعداد آموزش</div>
                        </div>
                        <div class="stat-item">
                            <div class="value">${scoreDisplay}</div>
                            <div class="label">آخرین دقت</div>
                        </div>
                        <div class="stat-item">
                            <div class="value">${dataPoints > 0 ? dataPoints : '—'}</div>
                            <div class="label">نقاط داده</div>
                        </div>
                        <div class="stat-item">
                            <div class="value">${creditsRemaining}</div>
                            <div class="label">اعتبار باقیمانده</div>
                        </div>
                    </div>
                </div>
            `;

            // ===== کارت ۲: آمار API =====
            if (statsData.api_stats) {
                const apiStats = statsData.api_stats;
                html += `
                    <div class="card">
                        <div class="card-title"><i class="fas fa-plug"></i> آمار API</div>
                        <table class="table">
                            <tr><td>کل درخواست‌ها</td><td>${apiStats.total_requests || 0}</td></tr>
                            <tr><td>خطاها</td><td><span class="badge ${apiStats.errors > 0 ? 'badge-warning' : 'badge-success'}">${apiStats.errors || 0}</span></td></tr>
                            <tr><td>اندازه کش</td><td>${apiStats.cache_size || 0}</td></tr>
                            <tr><td>کلیدهای کش</td><td style="font-size:0.75rem;color:#4a5a6a;">${(apiStats.cache_keys || []).join(', ') || 'خالی'}</td></tr>
                            <tr><td>وضعیت API</td><td><span class="badge ${apiStatus === 'ok' ? 'badge-success' : 'badge-danger'}">${apiStatus === 'ok' ? '✅ سالم' : '❌ مشکل'}</span></td></tr>
                        </table>
                    </div>
                `;
            }

            // ===== کارت ۳: تسک‌های پس‌زمینه =====
            html += `
                <div class="card">
                    <div class="card-title"><i class="fas fa-tasks"></i> تسک‌های پس‌زمینه</div>
                    <table class="table">
                        <tr><td>تسک‌های در انتظار</td><td>${statsData.pending_tasks || 0}</td></tr>
                        <tr><td>کل تسک‌ها</td><td>${statsData.total_tasks || 0}</td></tr>
                        <tr><td>آموزش خودکار</td><td><span class="badge ${isRunning ? 'badge-success' : 'badge-gray'}">${isRunning ? '▶️ در حال اجرا' : '⏹️ متوقف'}</span></td></tr>
                        ${lastTraining ? `<tr><td>آخرین آموزش</td><td style="font-size:0.75rem;color:#4a5a6a;">${new Date(lastTraining).toLocaleString('fa-IR')}</td></tr>` : ''}
                    </table>
                </div>
            `;

            html += '</div>';
            container.innerHTML = html;

            // ===== آپتایم زنده =====
            if (statsData.uptime) {
                const parts = statsData.uptime.split(':').map(Number);
                let totalSeconds = 0;
                if (parts.length === 3) {
                    totalSeconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
                } else if (parts.length === 2) {
                    totalSeconds = parts[0] * 60 + parts[1];
                } else {
                    totalSeconds = parts[0] || 0;
                }
                statsStartTime = Date.now() - (totalSeconds * 1000);
                updateStatsUptime();
                if (statsInterval) clearInterval(statsInterval);
                statsInterval = setInterval(updateStatsUptime, 1000);
            }
        }

        // ============================================================
        // آپتایم زنده
        // ============================================================
        function updateStatsUptime() {
            const el = document.getElementById('statsUptime');
            if (!el || !statsStartTime) return;
            const elapsed = Math.floor((Date.now() - statsStartTime) / 1000);
            el.textContent = formatDuration(elapsed);
        }

        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds} ثانیه`;
            const days = Math.floor(seconds / 86400);
            seconds -= days * 86400;
            const hours = Math.floor(seconds / 3600);
            seconds -= hours * 3600;
            const minutes = Math.floor(seconds / 60);
            seconds -= minutes * 60;
            let parts = [];
            if (days > 0) parts.push(`${days} روز`);
            if (hours > 0 || days > 0) parts.push(`${hours} ساعت`);
            if (minutes > 0 || hours > 0 || days > 0) parts.push(`${minutes} دقیقه`);
            parts.push(`${seconds} ثانیه`);
            return parts.join(' ');
        }

        // ============================================================
        // راه‌اندازی
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadStats();
            setInterval(loadStats, 30000);
        });
    </script>

</body>
</html>
