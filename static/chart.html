<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمودار</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0e17;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            flex-shrink: 0;
            z-index: 10;
        }
        .dashboard-header .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .menu-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #0d1624;
            border: 1px solid #1a2a3a;
            color: #e0e6ed;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 200;
        }
        .menu-toggle:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }
        .menu-toggle.open {
            border-color: #00d4ff;
            background: #00d4ff;
            color: #0a0e17;
        }

        .flyout-menu {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(13, 22, 36, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 10px 0;
            min-width: 200px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150;
            transform-origin: top right;
        }
        .flyout-menu.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: all;
        }
        .flyout-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #a0b4c8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border-right: 2px solid transparent;
        }
        .flyout-menu a:hover {
            background: rgba(0, 212, 255, 0.05);
            color: #e0e6ed;
            border-right-color: #00d4ff;
        }
        .flyout-menu a.active {
            color: #00d4ff;
            border-right-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }
        .flyout-menu .menu-divider {
            height: 1px;
            background: #1a2a3a;
            margin: 6px 16px;
        }
        .flyout-menu .menu-label {
            padding: 8px 20px 4px;
            font-size: 0.7rem;
            color: #4a5a6a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .flyout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .flyout-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .chart-container {
            flex: 1;
            padding: 12px 16px 16px;
            min-height: 0;
        }
        .chart-wrapper {
            height: 100%;
            width: 100%;
            background: #0a0e17;
            border-radius: 16px;
            border: 1px solid #1a2a3a;
            overflow: hidden;
        }
        .chart-wrapper .tradingview-widget-container {
            height: 100% !important;
            width: 100% !important;
        }
        .chart-wrapper .tradingview-widget-container__widget {
            height: calc(100% - 32px) !important;
            width: 100% !important;
        }

        @media (max-width: 768px) {
            .dashboard-header { padding: 10px 16px; flex-wrap: wrap; gap: 6px; }
            .dashboard-header .logo { font-size: 1rem; }
            .chart-container { padding: 8px 10px 10px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
        }
        @media (max-width: 480px) {
            .dashboard-header .status { font-size: 0.7rem; gap: 6px; }
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
            .flyout-menu a { font-size: 0.85rem; padding: 10px 16px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    منو (بارگذاری از nav.html)
    ============================================================ -->
    <div id="navContainer"></div>

    <!-- ============================================================
    CHART CONTENT - ویجت تریدینگ ویو
    ============================================================ -->
    <main class="chart-container">
        <div class="chart-wrapper">
            <!-- TradingView Widget BEGIN -->
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/symbols/BTCUSDT/?exchange=BINANCE" rel="noopener nofollow" target="_blank"><span class="blue-text">BTCUSDT price</span></a><span class="trademark"> by TradingView</span></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                    "allow_symbol_change": true,
                    "calendar": false,
                    "details": false,
                    "hide_side_toolbar": true,
                    "hide_top_toolbar": false,
                    "hide_legend": false,
                    "hide_volume": false,
                    "hotlist": false,
                    "interval": "60",
                    "locale": "en",
                    "save_image": true,
                    "style": "1",
                    "symbol": "BINANCE:BTCUSDT",
                    "theme": "dark",
                    "timezone": "Asia/Tehran",
                    "backgroundColor": "#0F0F0F",
                    "gridColor": "rgba(242, 242, 242, 0.2)",
                    "watchlist": [],
                    "withdateranges": false,
                    "compareSymbols": [],
                    "support_host": "https://www.tradingview.com",
                    "studies": [
                        "STD;RSI",
                        "STD;SMA",
                        "STD;MACD"
                    ],
                    "autosize": true
                }
                </script>
            </div>
            <!-- TradingView Widget END -->
        </div>
    </main>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        // ============================================================
        // بارگذاری منو از nav.html
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;

            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;

                    if (typeof initMenu === 'function') {
                        initMenu();
                    }

                    if (typeof fetchAndStartUptime === 'function') {
                        fetchAndStartUptime();
                    }
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        document.addEventListener('DOMContentLoaded', loadNav);
    </script>

</body>
</html>
