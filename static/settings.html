<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تنظیمات</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0a0e17;
            min-height: 100vh;
            font-family: 'Vazir', 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dashboard-header .logo {
            font-size: 1rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
        }

        #userDisplay {
            color: #00d4ff;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .menu-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #0d1624;
            border: 1px solid #1a2a3a;
            color: #e0e6ed;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 200;
        }

        .menu-toggle:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .menu-toggle.open {
            border-color: #00d4ff;
            background: #00d4ff;
            color: #0a0e17;
        }

        /* ============================================================
           FLYOUT MENU
           ============================================================ */
        .flyout-menu {
            position: fixed;
            top: 70px;
            right: 12px;
            background: rgba(13, 22, 36, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 10px 0;
            min-width: 170px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150;
            transform-origin: top right;
        }

        .flyout-menu.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: all;
        }

        .flyout-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #a0b4c8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border-right: 2px solid transparent;
        }

        .flyout-menu a:hover {
            background: rgba(0, 212, 255, 0.05);
            color: #e0e6ed;
            border-right-color: #00d4ff;
        }

        .flyout-menu a.active {
            color: #00d4ff;
            border-right-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .flyout-menu .menu-divider {
            height: 1px;
            background: #1a2a3a;
            margin: 6px 16px;
        }

        .flyout-menu .menu-label {
            padding: 8px 16px 4px;
            font-size: 0.65rem;
            color: #4a5a6a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .flyout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .flyout-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px;
        }

        /* ============================================================
           PAGE HEADER
           ============================================================ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .page-header h1 {
            color: #e0e6ed;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-header h1 i {
            color: #00d4ff;
        }

        .page-header .subtitle {
            color: #7a8fa3;
            font-size: 0.75rem;
        }

        .page-header .timestamp {
            color: #4a5a6a;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
        }

        /* ============================================================
           SETTINGS CARD
           ============================================================ */
        .settings-card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .settings-card:hover {
            border-color: rgba(0, 212, 255, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #0d1624;
            flex-wrap: wrap;
        }

        .card-header i {
            color: #00d4ff;
            font-size: 1rem;
            width: 24px;
        }

        .card-header h3 {
            color: #e0e6ed;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
        }

        .card-header .badge {
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.15);
            margin-right: auto;
        }

        .card-header .badge.admin {
            background: rgba(255, 170, 0, 0.1);
            color: #ffaa00;
            border-color: rgba(255, 170, 0, 0.15);
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card-body.full-width {
            grid-template-columns: 1fr;
        }

        /* ============================================================
           FORM
           ============================================================ */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            color: #a0b4c8;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .form-control {
            padding: 8px 12px;
            background: #0a0e17;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
        }

        .form-control:disabled,
        .form-control[readonly] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 500;
            font-family: inherit;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-success {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0e17;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 68, 68, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #1a2a3a;
            color: #7a8fa3;
        }

        .btn-outline:hover {
            border-color: #00d4ff;
            color: #e0e6ed;
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 0.7rem;
        }

        .btn-xs {
            padding: 3px 8px;
            font-size: 0.65rem;
        }

        /* ============================================================
           STATS GRID
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stats-grid .stat-item {
            background: #0a0e17;
            padding: 12px 10px;
            border-radius: 10px;
            border: 1px solid #1a2a3a;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stats-grid .stat-item:hover {
            border-color: rgba(0, 212, 255, 0.2);
            transform: translateY(-2px);
        }

        .stats-grid .stat-item .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
        }

        .stats-grid .stat-item .stat-label {
            color: #7a8fa3;
            font-size: 0.6rem;
            margin-top: 2px;
        }

        .stats-grid .stat-item .stat-icon {
            position: absolute;
            top: 4px;
            left: 6px;
            opacity: 0.1;
            font-size: 1.2rem;
        }

        .stats-grid .stat-item .stat-value.success { color: #00ff88; }
        .stats-grid .stat-item .stat-value.warning { color: #ffaa00; }
        .stats-grid .stat-item .stat-value.danger { color: #ff4444; }
        .stats-grid .stat-item .stat-value.info { color: #00d4ff; }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            min-width: 400px;
        }

        .table th {
            text-align: right;
            padding: 8px 10px;
            color: #00d4ff;
            border-bottom: 2px solid #1a2a3a;
            font-weight: 600;
        }

        .table td {
            padding: 8px 10px;
            border-bottom: 1px solid #0d1624;
            color: #c0d0e0;
        }

        .table tr:hover td {
            background: rgba(0, 212, 255, 0.03);
        }

        .badge-role {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 500;
        }

        .badge-role.admin { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid rgba(255, 170, 0, 0.2); }
        .badge-role.vip { background: rgba(0, 212, 255, 0.15); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.2); }
        .badge-role.guest { background: rgba(255, 255, 255, 0.05); color: #7a8fa3; border: 1px solid rgba(255, 255, 255, 0.05); }

        .badge-status.active { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.2); }
        .badge-status.inactive { background: rgba(255, 68, 68, 0.15); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.2); }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1a2a3a;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 10px 20px;
            background: #1a2a3a;
            color: #e0e6ed;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            font-size: 0.85rem;
            transition: all 0.3s ease;
            width: 100%;
            pointer-events: all;
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .toast.success { border-color: #00ff88; }
        .toast.error { border-color: #ff4444; }
        .toast.warning { border-color: #ffaa00; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (min-width: 768px) {
            .dashboard-header {
                padding: 16px 24px;
            }
            .dashboard-header .logo {
                font-size: 1.3rem;
            }
            .dashboard-header .status {
                font-size: 0.85rem;
            }
            .dashboard-header .uptime {
                font-size: 0.8rem;
            }
            #userDisplay {
                font-size: 0.85rem;
            }
            .menu-toggle {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }
            .flyout-menu {
                top: 80px;
                right: 20px;
                min-width: 200px;
            }
            .flyout-menu a {
                padding: 12px 20px;
                font-size: 0.95rem;
            }
            .container {
                padding: 20px;
            }
            .page-header h1 {
                font-size: 1.6rem;
            }
            .page-header .subtitle {
                font-size: 0.9rem;
            }
            .page-header .timestamp {
                font-size: 0.8rem;
            }
            .settings-card {
                padding: 24px;
                margin-bottom: 20px;
                border-radius: 16px;
            }
            .card-header h3 {
                font-size: 1.05rem;
            }
            .card-header .badge {
                font-size: 0.7rem;
                padding: 2px 12px;
            }
            .card-body {
                grid-template-columns: 1fr 1fr;
                gap: 16px 24px;
            }
            .stats-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 12px;
            }
            .stats-grid .stat-item {
                padding: 16px 18px;
            }
            .stats-grid .stat-item .stat-value {
                font-size: 1.5rem;
            }
            .stats-grid .stat-item .stat-label {
                font-size: 0.75rem;
            }
            .stats-grid .stat-item .stat-icon {
                font-size: 1.8rem;
            }
            .form-group label {
                font-size: 0.85rem;
            }
            .form-control {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            .btn {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
            .btn-sm {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            .btn-xs {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            .table {
                font-size: 0.85rem;
                min-width: auto;
            }
            .toast-container {
                bottom: 24px;
                max-width: 500px;
            }
            .toast {
                padding: 12px 28px;
                font-size: 0.95rem;
            }
            .badge-role {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .dashboard-header .uptime {
                display: none;
            }
            .flyout-menu {
                right: 8px;
                top: 60px;
                min-width: 150px;
            }
            .flyout-menu a {
                font-size: 0.8rem;
                padding: 8px 14px;
            }
            .page-header h1 {
                font-size: 1rem;
            }
            .settings-card {
                padding: 12px;
            }
        }

        @media (max-width: 380px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .stats-grid .stat-item {
                padding: 8px 6px;
            }
            .stats-grid .stat-item .stat-value {
                font-size: 0.9rem;
            }
            .page-header h1 {
                font-size: 0.9rem;
            }
            .card-header h3 {
                font-size: 0.8rem;
            }
        }

        /* ============================================================
           LANDSCAPE MOBILE
           ============================================================ */
        @media (max-height: 500px) and (orientation: landscape) {
            .dashboard-header {
                padding: 6px 12px;
            }
            .dashboard-header .logo {
                font-size: 0.8rem;
            }
            .dashboard-header .status {
                font-size: 0.6rem;
            }
            .menu-toggle {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
            .flyout-menu {
                top: 50px;
                right: 8px;
                min-width: 140px;
            }
            .flyout-menu a {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
            .container {
                padding: 6px 8px;
            }
            .settings-card {
                padding: 8px 10px;
                margin-bottom: 6px;
                border-radius: 8px;
            }
            .card-header {
                margin-bottom: 6px;
                padding-bottom: 6px;
            }
            .card-header h3 {
                font-size: 0.75rem;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
            }
            .stats-grid .stat-item {
                padding: 6px 4px;
            }
            .stats-grid .stat-item .stat-value {
                font-size: 0.8rem;
            }
            .stats-grid .stat-item .stat-label {
                font-size: 0.5rem;
            }
            .page-header h1 {
                font-size: 0.9rem;
            }
            .page-header .subtitle {
                font-size: 0.6rem;
            }
            .form-group label {
                font-size: 0.65rem;
            }
            .form-control {
                padding: 4px 8px;
                font-size: 0.7rem;
            }
            .btn {
                padding: 4px 10px;
                font-size: 0.65rem;
            }
            .btn-sm {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
            .btn-xs {
                padding: 2px 6px;
                font-size: 0.55rem;
            }
            .table {
                font-size: 0.6rem;
            }
            .table th,
            .table td {
                padding: 4px 6px;
            }
            .toast-container {
                bottom: 8px;
            }
            .toast {
                padding: 6px 14px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="container">

        <div class="page-header">
            <div>
                <h1><i class="fas fa-sliders-h"></i> تنظیمات</h1>
                <span class="subtitle">شخصی‌سازی و مدیریت حساب کاربری</span>
            </div>
            <span class="timestamp" id="pageTimestamp"></span>
        </div>

        <!-- Stats Card -->
        <div class="settings-card" id="statsSection">
            <div class="card-header">
                <i class="fas fa-chart-bar"></i>
                <h3>آمار سیستم</h3>
                <span class="badge">لحظه‌ای</span>
            </div>
            <div id="statsGrid" class="stats-grid">
                <div class="stat-item">
                    <span class="stat-icon"><i class="fas fa-clock"></i></span>
                    <div class="stat-value info" id="statUptime">-</div>
                    <div class="stat-label">آپتایم</div>
                </div>
                <div class="stat-item">
                    <span class="stat-icon"><i class="fas fa-code"></i></span>
                    <div class="stat-value" id="statRequests">-</div>
                    <div class="stat-label">درخواست‌ها</div>
                </div>
                <div class="stat-item">
                    <span class="stat-icon"><i class="fas fa-memory"></i></span>
                    <div class="stat-value" id="statCache">-</div>
                    <div class="stat-label">کش</div>
                </div>
                <div class="stat-item">
                    <span class="stat-icon"><i class="fas fa-coins"></i></span>
                    <div class="stat-value" id="statCredits">-</div>
                    <div class="stat-label">اعتبار</div>
                </div>
                <div class="stat-item">
                    <span class="stat-icon"><i class="fas fa-brain"></i></span>
                    <div class="stat-value" id="statModel">-</div>
                    <div class="stat-label">مدل</div>
                </div>
            </div>
        </div>

        <!-- User Account Card -->
        <div class="settings-card">
            <div class="card-header">
                <i class="fas fa-user-circle"></i>
                <h3>حساب کاربری</h3>
                <span class="badge" id="userRoleBadge">👤 مهمان</span>
            </div>
            <div class="card-body full-width">
                <div id="userInfo">
                    <div class="loading" style="padding:12px;">
                        <div class="spinner" style="width:24px;height:24px;"></div>
                        <p style="color:#7a8fa3;font-size:0.75rem;">در حال بارگذاری...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Users Management (Admin Only) -->
        <div class="settings-card" id="usersManagement" style="display:none;">
            <div class="card-header">
                <i class="fas fa-users-cog"></i>
                <h3>مدیریت کاربران</h3>
                <span class="badge admin">👑 فقط ادمین</span>
            </div>
            <div class="card-body full-width">
                <div class="table-wrapper">
                    <table class="table" id="usersTable">
                        <thead>
                            <tr>
                                <th>کاربر</th>
                                <th>نقش</th>
                                <th>وضعیت</th>
                                <th>ایمیل</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="5" style="text-align:center;color:#4a5a6a;font-size:0.7rem;">در حال بارگذاری...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Appearance Card -->
        <div class="settings-card">
            <div class="card-header">
                <i class="fas fa-palette"></i>
                <h3>ظاهر</h3>
                <span class="badge">شخصی‌سازی</span>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>حالت نمایش</label>
                    <select class="form-control" id="themeSelect">
                        <option value="dark">🌙 تیره</option>
                        <option value="light">☀️ روشن</option>
                        <option value="auto">🔄 خودکار</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>زبان</label>
                    <select class="form-control" id="languageSelect">
                        <option value="fa">🇮🇷 فارسی</option>
                        <option value="en">🇬🇧 English</option>
                    </select>
                </div>
            </div>
        </div>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>

    <script>
        console.log('🚀 ==========================================');
        console.log('🚀 Settings page loaded successfully');
        console.log('🚀 ==========================================');

        // ============================================================
        // راه‌اندازی اولیه
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM fully loaded');
            loadNav();
            loadAllData();
            setInterval(updateTimestamp, 1000);
            setInterval(loadStats, 30000);
        });

        // ============================================================
        // بارگذاری منو
        // ============================================================
        function loadNav() {
            console.log('📡 Loading navigation...');
            const container = document.getElementById('navContainer');
            if (!container) {
                console.warn('⚠️ navContainer not found!');
                return;
            }
            fetch('/static/nav.html')
                .then(res => {
                    console.log('📡 Nav fetch status:', res.status);
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    console.log('✅ Navigation loaded');
                    if (typeof initMenu === 'function') {
                        console.log('🔄 Initializing menu...');
                        initMenu();
                    }
                    loadUserInfo();
                })
                .catch(err => {
                    console.error('❌ Nav load error:', err);
                });
        }

        // ============================================================
        // بارگذاری همه داده‌ها
        // ============================================================
        function loadAllData() {
            console.log('📊 Loading all data...');
            loadStats();
            loadUserInfo();
            updateTimestamp();
        }

        // ============================================================
        // آپدیت تاریخ و ساعت
        // ============================================================
        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) {
                el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
            }
        }

        // ============================================================
        // آپتایم زنده
        // ============================================================
        let uptimeStartTime = null;
        let uptimeInterval = null;

        function startUptime(uptimeStr) {
            if (!uptimeStr) {
                console.warn('⚠️ No uptime string provided');
                return;
            }
            console.log('⏱️ Starting uptime with:', uptimeStr);
            const parts = uptimeStr.split(':').map(Number);
            let totalSeconds = 0;
            if (parts.length === 3) totalSeconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
            else if (parts.length === 2) totalSeconds = parts[0] * 60 + parts[1];
            else totalSeconds = parts[0] || 0;

            uptimeStartTime = Date.now() - (totalSeconds * 1000);
            updateUptimeDisplay();
            if (uptimeInterval) clearInterval(uptimeInterval);
            uptimeInterval = setInterval(updateUptimeDisplay, 1000);
            console.log('✅ Uptime started at:', new Date(uptimeStartTime).toLocaleString('fa-IR'));
        }

        function updateUptimeDisplay() {
            const el = document.getElementById('statUptime');
            if (!el || !uptimeStartTime) return;
            const elapsed = Math.floor((Date.now() - uptimeStartTime) / 1000);
            el.textContent = formatDuration(elapsed);
        }

        function formatDuration(seconds) {
            if (seconds < 60) return seconds + ' ثانیه';
            const days = Math.floor(seconds / 86400);
            seconds -= days * 86400;
            const hours = Math.floor(seconds / 3600);
            seconds -= hours * 3600;
            const minutes = Math.floor(seconds / 60);
            seconds -= minutes * 60;
            let parts = [];
            if (days > 0) parts.push(days + ' روز');
            if (hours > 0 || days > 0) parts.push(hours + ' ساعت');
            if (minutes > 0 || hours > 0 || days > 0) parts.push(minutes + ' دقیقه');
            parts.push(seconds + ' ثانیه');
            return parts.join(' ');
        }

        // ============================================================
        // بارگذاری آمار        // ============================================================
        function loadStats() {
            console.log('📊 Loading stats...');
            fetch('/stats', { credentials: 'include' })
                .then(res => {
                    console.log('📊 Stats response status:', res.status);
                    return res.json();
                })
                .then(data => {
                    console.log('📊 Stats data:', data);
                    if (data.uptime) startUptime(data.uptime);
                    const req = document.getElementById('statRequests');
                    if (req) req.textContent = data.api_stats?.total_requests || 0;
                    const cache = document.getElementById('statCache');
                    if (cache) cache.textContent = data.api_stats?.cache_size || 0;
                })
                .catch(err => console.error('❌ Stats error:', err));

            fetch('/credits', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const el = document.getElementById('statCredits');
                        if (el) el.textContent = data.data?.remaining || 0;
                    }
                })
                .catch(() => {});

            fetch('/model/status', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    const el = document.getElementById('statModel');
                    if (!el) return;
                    if (data?.is_training) el.textContent = '⏳ آموزش';
                    else if (data?.model_exists) el.textContent = '✅ فعال';
                    else el.textContent = '📦 دمو';
                })
                .catch(() => {});
        }

        // ============================================================
        // بارگذاری اطلاعات کاربر
        // ============================================================
        function loadUserInfo() {
            console.log('👤 Loading user info...');
            const userInfo = document.getElementById('userInfo');
            if (!userInfo) {
                console.warn('⚠️ userInfo element not found!');
                return;
            }
            userInfo.innerHTML = '<div style="text-align:center;padding:12px;color:#7a8fa3;font-size:0.8rem;">⏳ در حال بارگذاری...</div>';

            fetch('/api/user', { credentials: 'include' })
                .then(res => {
                    console.log('👤 User API status:', res.status);
                    if (res.status === 401) {
                        console.warn('⚠️ Unauthorized, redirecting to login');
                        window.location.href = '/login';
                        return null;
                    }
                    return res.json();
                })
                .then(data => {
                    if (data && data.success) {
                        console.log('👤 User data received:', data.data);
                        renderUserInfo(data.data);
                        updateUserDisplay(data.data);
                    } else if (data && !data.success) {
                        console.warn('⚠️ User API error:', data.error);
                        userInfo.innerHTML = '<div style="color:#ff4444;text-align:center;padding:12px;font-size:0.8rem;">❌ ' + data.error + '</div>';
                    }
                })
                .catch(err => {
                    console.error('❌ User info error:', err);
                    userInfo.innerHTML = '<div style="color:#ff4444;text-align:center;padding:12px;font-size:0.8rem;">❌ خطا در ارتباط با سرور</div>';
                });
        }

        // ============================================================
        // نمایش اطلاعات کاربر (بدون چشم - رمز مشخص)
        // ============================================================
        function renderUserInfo(user) {
            console.log('🎨 Rendering user info for:', user.username);
            const container = document.getElementById('userInfo');
            if (!container) return;

            const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };

            container.innerHTML = `
                <div class="user-info-grid">
                    <div class="form-group">
                        <label>👤 نام کاربری</label>
                        <input type="text" class="form-control" value="${user.username || '-'}" readonly>
                    </div>
                    <div class="form-group">
                        <label>🔑 رمز عبور</label>
                        <input type="text" class="form-control" value="${user.password_display || '••••••••'}" readonly>
                    </div>
                    <div class="form-group">
                        <label>📧 ایمیل</label>
                        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                            <span id="userEmailDisplay" style="color:#e0e6ed;padding:8px 12px;background:#0a0e17;border-radius:8px;flex:1;min-width:100px;font-size:0.85rem;">${user.recovery_email || '-'}</span>
                            <input type="email" id="userEmailInput" class="form-control" style="display:none;flex:1;min-width:100px;font-size:0.85rem;" placeholder="ایمیل جدید" value="${user.recovery_email || ''}">
                            <button class="btn btn-xs btn-outline" onclick="toggleEmailEdit(true)"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-xs btn-success" id="saveEmailBtn" style="display:none;" onclick="updateUserEmail()"><i class="fas fa-save"></i></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>📋 نقش</label>
                        <input type="text" class="form-control" value="${roleMap[user.role] || 'مهمان'}" readonly>
                    </div>
                    <div class="form-group">
                        <label>📊 وضعیت</label>
                        <input type="text" class="form-control" value="${user.active ? '✅ فعال' : '❌ غیرفعال'}" readonly>
                    </div>
                    <div class="form-group" style="justify-content:flex-end;">
                        <button class="btn btn-danger btn-sm" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> خروج</button>
                    </div>
                </div>
            `;

            // اگر ادمین هست، کاربران رو بارگذاری کن
            if (user.role === 'admin') {
                console.log('👑 Admin detected, loading user management');
                document.getElementById('usersManagement').style.display = 'block';
                loadUsers();
            }
        }

        // ============================================================
        // ویرایش ایمیل
        // ============================================================
        function toggleEmailEdit(enable) {
            const input = document.getElementById('userEmailInput');
            const display = document.getElementById('userEmailDisplay');
            const saveBtn = document.getElementById('saveEmailBtn');
            const editBtn = document.querySelector('.btn-outline[onclick*="toggleEmailEdit(true)"]');
            if (enable) {
                input.style.display = 'block';
                display.style.display = 'none';
                if (editBtn) editBtn.style.display = 'none';
                if (saveBtn) saveBtn.style.display = 'inline-flex';
                input.focus();
            } else {
                input.style.display = 'none';
                display.style.display = 'block';
                if (editBtn) editBtn.style.display = 'inline-flex';
                if (saveBtn) saveBtn.style.display = 'none';
            }
        }

        function updateUserEmail() {
            const emailInput = document.getElementById('userEmailInput');
            if (!emailInput) return;
            const newEmail = emailInput.value.trim();
            if (!newEmail || !newEmail.includes('@')) {
                showToast('❌ ایمیل نامعتبر است', 'error');
                return;
            }
            fetch('/api/user/email', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email: newEmail })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast('✅ ایمیل به‌روزرسانی شد', 'success');
                    document.getElementById('userEmailDisplay').textContent = newEmail;
                    toggleEmailEdit(false);
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            })
            .catch(() => showToast('❌ خطا در ارتباط با سرور', 'error'));
        }

        // ============================================================
        // خروج از حساب
        // ============================================================
        function logoutUser() {
            console.log('🚪 Logout requested');
            if (!confirm('آیا از خروج از حساب کاربری اطمینان دارید؟')) return;
            fetch('/logout', { method: 'POST', credentials: 'include' })
                .then(() => {
                    console.log('✅ Logout successful, redirecting to login');
                    window.location.href = '/login';
                })
                .catch(() => {
                    window.location.href = '/login';
                });
        }

        // ============================================================
        // نمایش نام کاربری
        // ============================================================
        function updateUserDisplay(user) {
            const display = document.getElementById('userDisplay');
            const badge = document.getElementById('userRoleBadge');
            if (display) {
                const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                display.textContent = roleMap[user.role] || user.username;
                console.log('👤 User display updated:', display.textContent);
            }
            if (badge) {
                const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                badge.textContent = roleMap[user.role] || '👤 مهمان';
            }
        }

        // ============================================================
        // مدیریت کاربران (ادمین)
        // ============================================================
        function loadUsers() {
            console.log('👥 Loading users...');
            const tbody = document.getElementById('usersTableBody');
            if (!tbody) return;
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#4a5a6a;font-size:0.7rem;">در حال بارگذاری...</td></tr>';
            fetch('/api/users', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        console.log('👥 Users loaded:', data.data.length);
                        renderUsers(data.data);
                    } else {
                        console.warn('⚠️ Users API error:', data.error);
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;font-size:0.7rem;">❌ ' + data.error + '</td></tr>';
                    }
                })
                .catch(err => {
                    console.error('❌ Users load error:', err);
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff4444;font-size:0.7rem;">❌ خطا</td></tr>';
                });
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            if (!tbody) return;
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#4a5a6a;font-size:0.7rem;">هیچ کاربری یافت نشد</td></tr>';
                return;
            }
            const roleMap = {
                'admin': '<span class="badge-role admin">👑 ادمین</span>',
                'vip': '<span class="badge-role vip">⭐ VIP</span>',
                'guest': '<span class="badge-role guest">👤 مهمان</span>'
            };
            let html = '';
            users.forEach(user => {
                const isAdmin = user.username === 'admin';
                const statusBadge = user.active ? '<span class="badge-status active">✅ فعال</span>' : '<span class="badge-status inactive">⛔ غیرفعال</span>';
                html += `<tr>
                    <td>${user.username}</td>
                    <td>${roleMap[user.role] || '👤 مهمان'}</td>
                    <td>${statusBadge}</td>
                    <td>${user.recovery_email || '-'}</td>
                    <td>${isAdmin ? '<span style="color:#4a5a6a;font-size:0.6rem;">غیرقابل تغییر</span>' : `
                        <button class="btn btn-xs btn-primary" onclick="toggleUserStatus('${user.username}')" style="padding:2px 6px;font-size:0.55rem;"><i class="fas fa-power-off"></i></button>
                        <button class="btn btn-xs btn-warning" onclick="changeUserRole('${user.username}')" style="padding:2px 6px;font-size:0.55rem;"><i class="fas fa-user-tag"></i></button>
                    `}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function toggleUserStatus(username) {
            console.log('🔄 Toggling user status:', username);
            if (!confirm('تغییر وضعیت کاربر ' + username + '؟')) return;
            fetch('/api/users/' + username, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ active: false })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast('✅ وضعیت تغییر کرد', 'success');
                    loadUsers();
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            })
            .catch(() => showToast('❌ خطا', 'error'));
        }

        function changeUserRole(username) {
            console.log('🔄 Changing user role:', username);
            const newRole = prompt('نقش جدید برای ' + username + ': (admin, vip, guest)');
            if (!newRole || !['admin', 'vip', 'guest'].includes(newRole)) return;
            fetch('/api/users/' + username, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ role: newRole })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast('✅ نقش تغییر کرد', 'success');
                    loadUsers();
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            })
            .catch(() => showToast('❌ خطا', 'error'));
        }

        // ============================================================
        // Toast
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const colors = { info: '#00d4ff', success: '#00ff88', error: '#ff4444', warning: '#ffaa00' };
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            toast.style.borderColor = colors[type] || colors.info;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 3000);
        }

        console.log('✅ ==========================================');
        console.log('✅ All settings logic loaded successfully');
        console.log('✅ ==========================================');
    </script>

</body>
</html>
