<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلامت سیستم</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; min-height: 100vh; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard-header .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .menu-toggle {
            width: 44px; height: 44px; border-radius: 50%; background: #0d1624;
            border: 1px solid #1a2a3a; color: #e0e6ed; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 200;
        }
        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed; top: 80px; right: 20px;
            background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 10px 0;
            min-width: 200px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150; transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #a0b4c8; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0,212,255,0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.7rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card-title {
            color: #00d4ff;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-subtitle {
            color: #7a8fa3;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 25px;
            border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease; font-weight: 500; text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }

        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500;
        }
        .badge-success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .badge-warning { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
        .badge-danger { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        .badge-info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }

        .table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .table th { text-align: right; padding: 12px 15px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 10px 15px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0,212,255,0.05); }

        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; gap: 15px; }
        .spinner { width: 50px; height: 50px; border: 4px solid #1a2a3a; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }

        /* ===== دایره‌های متریک ===== */
        .metric-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .metric-circle svg {
            transform: rotate(-90deg);
            width: 140px;
            height: 140px;
        }
        .metric-circle .bg {
            fill: none;
            stroke: #1a2a3a;
            stroke-width: 10;
        }
        .metric-circle .progress {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }
        .metric-circle .label {
            margin-top: 10px;
            color: #7a8fa3;
            font-size: 0.85rem;
        }
        .metric-circle .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e0e6ed;
        }
        .metric-circle .limit-text {
            color: #4a5a6a;
            font-size: 0.7rem;
        }
        .metric-circle .circle-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .metric-wrapper {
            position: relative;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .row { grid-template-columns: 1fr; }
            .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .container { padding: 12px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
        }
        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
            .metric-circle svg { width: 100px; height: 100px; }
            .metric-circle .value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- منو -->
    <div id="navContainer"></div>

    <!-- محتوا -->
    <div class="container">
        <div class="card">
            <div class="card-title">💚 سلامت سیستم</div>
            <div class="card-subtitle">وضعیت تمام اجزای سیستم</div>
            <div style="margin-top:10px;">
                <button class="btn btn-primary" onclick="loadHealth()">🔄 بروزرسانی</button>
            </div>
        </div>
        <div id="healthContent">
            <div class="loading"><div class="spinner"></div><p>در حال دریافت اطلاعات...</p></div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        function loadHealth() {
            const container = document.getElementById('healthContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال دریافت...</p></div>';

            fetch('/health')
                .then(res => res.json())
                .then(data => {
                    let html = '<div class="row">';

                    // ===== کارت دایره‌ای CPU و RAM =====
                    const cpuPercent = 0.1; // نمایش 0.1 به عنوان محدودیت
                    const ramUsed = data.components?.memory?.used_mb || 0;
                    const ramTotal = data.components?.memory?.total_mb || 512;
                    const ramPercent = data.components?.memory?.percent || 0;

                    // رنگ‌ها بر اساس درصد
                    const cpuColor = cpuPercent > 80 ? '#ff4444' : cpuPercent > 60 ? '#ffaa00' : '#00ff88';
                    const ramColor = ramPercent > 80 ? '#ff4444' : ramPercent > 60 ? '#ffaa00' : '#00ff88';

                    html += `
                        <div class="card" style="grid-column:1/-1;">
                            <div class="card-title">📊 مصرف منابع</div>
                            <div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:30px;padding:20px 0;">
                                <!-- CPU -->
                                <div class="metric-circle">
                                    <div class="metric-wrapper">
                                        <svg viewBox="0 0 140 140">
                                            <circle class="bg" cx="70" cy="70" r="60"/>
                                            <circle class="progress" cx="70" cy="70" r="60"
                                                stroke="${cpuColor}"
                                                stroke-dasharray="${2 * Math.PI * 60}"
                                                stroke-dashoffset="${2 * Math.PI * 60 * (1 - cpuPercent / 100)}"/>
                                        </svg>
                                        <div class="circle-text">
                                            <div class="value" style="color:${cpuColor};">${cpuPercent}%</div>
                                            <div class="limit-text">حد مجاز: 0.1 هسته</div>
                                        </div>
                                    </div>
                                    <div class="label">مصرف CPU</div>
                                </div>
                                <!-- RAM -->
                                <div class="metric-circle">
                                    <div class="metric-wrapper">
                                        <svg viewBox="0 0 140 140">
                                            <circle class="bg" cx="70" cy="70" r="60"/>
                                            <circle class="progress" cx="70" cy="70" r="60"
                                                stroke="${ramColor}"
                                                stroke-dasharray="${2 * Math.PI * 60}"
                                                stroke-dashoffset="${2 * Math.PI * 60 * (1 - ramPercent / 100)}"/>
                                        </svg>
                                        <div class="circle-text">
                                            <div class="value" style="color:${ramColor};">${ramPercent}%</div>
                                            <div class="limit-text">${ramUsed}MB / ${ramTotal}MB</div>
                                        </div>
                                    </div>
                                    <div class="label">مصرف RAM</div>
                                </div>
                            </div>
                        </div>
                    `;

                    // ===== وضعیت کلی =====
                    const statusClass = data.status === 'ok' ? 'badge-success' :
                                       data.status === 'degraded' ? 'badge-warning' : 'badge-danger';
                    html += `
                        <div class="card" style="grid-column:1/-1;">
                            <div class="card-title">📊 وضعیت کلی</div>
                            <div style="text-align:center;padding:15px;">
                                <span class="badge ${statusClass}" style="font-size:1.5rem;padding:10px 30px;">
                                    ${data.status || 'نامشخص'}
                                </span>
                            </div>
                            <div style="text-align:center;color:#4a5a6a;font-size:0.85rem;">${data.timestamp ? new Date(data.timestamp).toLocaleString('fa-IR') : ''}</div>
                        </div>
                    `;

                    // ===== اجزای سیستم =====
                    if (data.components) {
                        for (const [key, value] of Object.entries(data.components)) {
                            if (key === 'memory') continue; // قبلاً نمایش داده شد
                            const statusColor = value.status === 'healthy' ? 'badge-success' :
                                               value.status === 'degraded' ? 'badge-warning' :
                                               value.status === 'unhealthy' ? 'badge-danger' : 'badge-info';
                            html += `
                                <div class="card">
                                    <div class="card-title">${key}</div>
                                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                                        <span class="badge ${statusColor}">${value.status || 'نامشخص'}</span>
                                        <span style="color:#4a5a6a;font-size:0.85rem;">${value.message || ''}</span>
                                    </div>
                                    <pre style="background:#0d1624;padding:10px;border-radius:8px;overflow-x:auto;font-size:0.8rem;margin-top:10px;color:#c0d0e0;">${JSON.stringify(value, null, 2)}</pre>
                                </div>
                            `;
                        }
                    }

                    html += '</div>';
                    container.innerHTML = html;
                })
                .catch(err => {
                    container.innerHTML = `<div class="card"><div class="card-title">❌ خطا</div><p style="color:#ff4444;">${err.message}</p></div>`;
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadHealth();
            setInterval(loadHealth, 30000);
        });
    </script>

</body>
</html>
