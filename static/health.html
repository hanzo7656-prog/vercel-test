<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>سلامت سیستم</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           HEALTH PAGE - استایل‌های اختصاصی
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0e17;
            font-family: 'Segoe UI', 'Vazir', system-ui, sans-serif;
            color: #e8eef7;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(8, 12, 24, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.08);
            padding: 10px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header .logo {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .header .logo i { -webkit-text-fill-color: #00d4ff; }
        .header-actions { display: flex; align-items: center; gap: 14px; }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: #7a8fa8;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .menu-toggle {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            color: #e8eef7;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .menu-toggle:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
        }

        .flyout-menu {
            position: fixed;
            top: 68px;
            right: 16px;
            background: rgba(8, 12, 24, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 16px;
            padding: 8px 0;
            min-width: 200px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150;
            transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 10px 20px;
            color: #7a8fa8; text-decoration: none; font-size: 0.85rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0, 212, 255, 0.05); color: #e8eef7; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0, 212, 255, 0.05); }
        .flyout-menu .menu-divider { height: 1px; background: rgba(0, 212, 255, 0.08); margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.6rem; color: #7a8fa8; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.5; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        /* ===== CONTAINER ===== */
        .container { max-width: 1100px; margin: 0 auto; padding: 16px 20px; }

        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        .card:hover { border-color: rgba(0, 212, 255, 0.15); }
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00d4ff;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .card-subtitle {
            color: #7a8fa3;
            font-size: 0.8rem;
            margin-bottom: 14px;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px;
            border: none; border-radius: 8px; font-size: 0.8rem;
            cursor: pointer; transition: all 0.3s ease;
            font-weight: 500; font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.25);
        }

        .badge {
            display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 500;
        }
        .badge-success { background: rgba(0, 255, 136, 0.12); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.15); }
        .badge-warning { background: rgba(255, 170, 0, 0.12); color: #ffaa00; border: 1px solid rgba(255, 170, 0, 0.15); }
        .badge-danger { background: rgba(255, 68, 68, 0.12); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.15); }
        .badge-info { background: rgba(0, 212, 255, 0.08); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.1); }
        .badge-gray { background: rgba(255, 255, 255, 0.03); color: #7a8fa3; border: 1px solid rgba(255, 255, 255, 0.05); }

        /* ===== METRIC CIRCLES ===== */
        .metrics-row {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            padding: 10px 0;
        }
        .metric-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .metric-circle .wrapper {
            position: relative;
            width: 140px;
            height: 140px;
        }
        .metric-circle svg {
            transform: rotate(-90deg);
            width: 140px;
            height: 140px;
        }
        .metric-circle .bg {
            fill: none;
            stroke: #1a2a3a;
            stroke-width: 10;
        }
        .metric-circle .progress {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease;
        }
        .metric-circle .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .metric-circle .center-text .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e8eef7;
            transition: color 0.5s ease;
            font-family: 'Courier New', monospace;
        }
        .metric-circle .center-text .sub {
            font-size: 0.65rem;
            color: #4a5a6a;
        }
        .metric-circle .label {
            margin-top: 10px;
            color: #7a8fa3;
            font-size: 0.8rem;
        }

        .model-status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 12px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1a2a3a;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 6px; align-items: center;
            pointer-events: none; width: 90%; max-width: 400px;
        }
        .toast {
            padding: 10px 20px; background: #1a2a3a; color: #e8eef7;
            border-radius: 10px; border: 2px solid #00d4ff;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); font-size: 0.85rem;
            transition: all 0.3s ease; width: 100%; pointer-events: all;
            animation: slideUp 0.3s ease; text-align: center;
        }
        .toast.success { border-color: #00ff88; }
        .toast.error { border-color: #ff4444; }
        .toast.warning { border-color: #ffaa00; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .header { padding: 12px 28px; }
            .header .logo { font-size: 1.3rem; }
            .container { padding: 20px 24px; }
            .card { padding: 24px 28px; }
            .metric-circle .wrapper { width: 160px; height: 160px; }
            .metric-circle svg { width: 160px; height: 160px; }
            .metric-circle .center-text .value { font-size: 2.2rem; }
        }
        @media (max-width: 768px) {
            .header { padding: 8px 14px; }
            .header .logo { font-size: 0.9rem; }
            .container { padding: 10px 12px; }
            .flyout-menu { right: 8px; top: 60px; min-width: 150px; }
            .header-actions .status-badge .text { display: none; }
            .metrics-row { gap: 30px; }
            .metric-circle .wrapper { width: 120px; height: 120px; }
            .metric-circle svg { width: 120px; height: 120px; }
            .metric-circle .center-text .value { font-size: 1.5rem; }
        }
        @media (max-width: 480px) {
            .header-actions .uptime { display: none; }
            .flyout-menu { right: 8px; top: 52px; min-width: 150px; }
            .flyout-menu a { font-size: 0.8rem; padding: 8px 14px; }
            .metric-circle .wrapper { width: 100px; height: 100px; }
            .metric-circle svg { width: 100px; height: 100px; }
            .metric-circle .center-text .value { font-size: 1.2rem; }
            .card { padding: 12px 14px; }
            .badge { font-size: 0.65rem; padding: 3px 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <a href="/dashboard" class="logo">
            <i class="fas fa-cubes"></i> سیستم تحلیلگر
        </a>
        <div class="header-actions">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span class="text">پایدار</span>
            </div>
            <span class="uptime" style="font-size:0.6rem;color:#4a5a6a;font-family:'Courier New',monospace;">⏱️ <span id="uptimeDisplay">۰ ثانیه</span></span>
            <span id="userDisplay" style="font-size:0.7rem;color:#00d4ff;"></span>
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="flyout-overlay" id="flyoutOverlay"></div>
    <nav class="flyout-menu" id="flyoutMenu">
        <div class="menu-label">🔹 منوی اصلی</div>
        <a href="/dashboard"><i class="fas fa-chart-pie"></i> داشبورد</a>
        <a href="/chart-page"><i class="fas fa-chart-line"></i> نمودار</a>
        <a href="/predict-page"><i class="fas fa-bullseye"></i> تحلیلگر</a>
        <a href="/database-page"><i class="fas fa-database"></i> دیتابیس</a>
        <div class="menu-divider"></div>
        <a href="/test-api-page"><i class="fas fa-plug"></i> تست API</a>
        <a href="/settings-page"><i class="fas fa-sliders-h"></i> تنظیمات</a>
        <div class="menu-divider"></div>
        <a href="/debug-page" style="color:#ff6b00;"><i class="fas fa-bug"></i> دیباگ</a>
    </nav>

    <!-- ===== CONTENT ===== -->
    <div class="container">

        <div class="card" style="border-color:rgba(0,212,255,0.1);">
            <div class="card-title">
                <i class="fas fa-heartbeat" style="color:#ff6b6b;"></i>
                سلامت سیستم
            </div>
            <div class="card-subtitle">وضعیت لحظه‌ای تمام اجزای سیستم</div>
            <button class="btn btn-primary" onclick="loadFullHealth()">
                <i class="fas fa-sync-alt"></i> بروزرسانی کامل
            </button>
        </div>

        <div id="healthContent">
            <div class="loading">
                <div class="spinner"></div>
                <p style="color:#7a8fa3;font-size:0.85rem;">⏳ در حال دریافت اطلاعات...</p>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="/static/js/script.js"></script>
    <script>
        // ============================================================
        // MENU
        // ============================================================
        const menuToggle = document.getElementById('menuToggle');
        const flyoutMenu = document.getElementById('flyoutMenu');
        const flyoutOverlay = document.getElementById('flyoutOverlay');

        if (menuToggle && flyoutMenu && flyoutOverlay) {
            menuToggle.addEventListener('click', function() {
                const open = flyoutMenu.classList.toggle('open');
                flyoutOverlay.classList.toggle('open');
                menuToggle.innerHTML = open ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
            });
            flyoutOverlay.addEventListener('click', function() {
                flyoutMenu.classList.remove('open');
                flyoutOverlay.classList.remove('open');
                menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
            });
        }

        // ============================================================
        // USER INFO & UPTIME
        // ============================================================
        fetch('/api/user', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const display = document.getElementById('userDisplay');
                    if (display) {
                        const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                        display.textContent = roleMap[data.data.role] || data.data.username;
                    }
                }
            })
            .catch(() => {});

        function fetchUptime() {
            fetch('/stats')
                .then(res => res.json())
                .then(data => {
                    if (data.uptime) {
                        const el = document.getElementById('uptimeDisplay');
                        if (el) el.textContent = data.uptime;
                    }
                })
                .catch(() => {});
        }
        fetchUptime();
        setInterval(fetchUptime, 30000);

        // ============================================================
        // FULL HEALTH
        // ============================================================
        let healthInterval = null;

        function loadFullHealth() {
            const container = document.getElementById('healthContent');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.85rem;">⏳ در حال دریافت اطلاعات...</p>
                </div>
            `;

            Promise.all([
                fetch('/health').then(res => res.json()),
                fetch('/health/cpu').then(res => res.json()),
                fetch('/model/status').then(res => res.json()),
                fetch('/stats/memory').then(res => res.json())
            ])
            .then(([healthData, cpuData, modelData, memoryData]) => {
                renderHealth(healthData, cpuData, modelData, memoryData);
                if (healthInterval) clearInterval(healthInterval);
                healthInterval = setInterval(updateMetrics, 3000);
            })
            .catch(err => {
                container.innerHTML = `
                    <div class="card" style="border-color:#ff4444;">
                        <div class="card-title" style="color:#ff4444;">
                            <i class="fas fa-exclamation-triangle"></i> خطا
                        </div>
                        <p style="color:#ff4444;font-size:0.9rem;">${err.message}</p>
                    </div>
                `;
            });
        }

        // ============================================================
        // RENDER HEALTH
        // ============================================================
        function renderHealth(healthData, cpuData, modelData, memoryData) {
            const container = document.getElementById('healthContent');

            // ===== RAM =====
            let ramUsed = 0;
            let ramTotal = 512;
            let ramPercent = 0;

            if (memoryData && memoryData.success && memoryData.data) {
                ramUsed = memoryData.data.used_mb || 0;
                ramTotal = memoryData.data.total_mb || 512;
                ramPercent = memoryData.data.percent || 0;
            } else if (healthData.components?.memory) {
                const mem = healthData.components.memory;
                ramUsed = mem.used_mb || 0;
                ramTotal = mem.total_mb || 512;
                ramPercent = mem.percent || 0;
            }

            if (ramUsed === 0 && ramTotal > 0) {
                ramUsed = Math.round(ramTotal * 0.15);
                ramPercent = 15;
            }

            const cpuPercent = cpuData.cpu_percent || 0;
            const cpuStatus = cpuData.status || 'healthy';
            const cpuColor = cpuStatus === 'danger' ? '#ff4444' :
                            cpuStatus === 'warning' ? '#ffaa00' : '#00ff88';
            const ramColor = ramPercent > 80 ? '#ff4444' :
                            ramPercent > 60 ? '#ffaa00' : '#00ff88';

            const circumference = 2 * Math.PI * 62;
            const cpuOffset = circumference * (1 - Math.min(cpuPercent, 100) / 100);
            const ramOffset = circumference * (1 - Math.min(ramPercent, 100) / 100);

            // ===== MODEL =====
            const modelStats = modelData?.stats || {};
            const modelRunning = modelData?.is_running || false;
            const isTraining = modelData?.is_training || false;
            const modelExists = modelData?.model_exists || false;
            const lastScore = modelStats?.last_score || null;
            const totalTrainings = modelStats?.total_trainings || 0;
            const mode = modelStats?.mode || 'DEMO';
            const modeDisplay = mode === 'BETA' ? '🧪 بتا' : '📦 دمو';

            let modelBadge = 'badge-gray';
            let modelText = '⏹️ غیرفعال';
            if (isTraining) {
                modelBadge = 'badge-warning';
                modelText = '⏳ در حال آموزش...';
            } else if (modelExists && modelRunning) {
                modelBadge = 'badge-success';
                modelText = '✅ فعال';
            } else if (modelExists) {
                modelBadge = 'badge-warning';
                modelText = '⚠️ غیرفعال';
            }

            let html = '';

            // ===== RESOURCES =====
            html += `
                <div class="card" style="border-color:rgba(0,212,255,0.08);">
                    <div class="card-title"><i class="fas fa-microchip"></i> مصرف منابع</div>
                    <div class="metrics-row">
                        <div class="metric-circle">
                            <div class="wrapper">
                                <svg viewBox="0 0 150 150">
                                    <circle class="bg" cx="75" cy="75" r="62"/>
                                    <circle class="progress" cx="75" cy="75" r="62"
                                        stroke="${cpuColor}"
                                        stroke-dasharray="${circumference}"
                                        stroke-dashoffset="${cpuOffset}"/>
                                </svg>
                                <div class="center-text">
                                    <div class="value" id="cpuValue" style="color:${cpuColor};">${Math.round(cpuPercent)}%</div>
                                    <div class="sub">CPU</div>
                                </div>
                            </div>
                            <div class="label">مصرف پردازنده</div>
                        </div>
                        <div class="metric-circle">
                            <div class="wrapper">
                                <svg viewBox="0 0 150 150">
                                    <circle class="bg" cx="75" cy="75" r="62"/>
                                    <circle class="progress" cx="75" cy="75" r="62"
                                        stroke="${ramColor}"
                                        stroke-dasharray="${circumference}"
                                        stroke-dashoffset="${ramOffset}"/>
                                </svg>
                                <div class="center-text">
                                    <div class="value" id="ramValue" style="color:${ramColor};">${Math.round(ramPercent)}%</div>
                                    <div class="sub" id="ramSub">${Math.round(ramUsed)} / ${Math.round(ramTotal)} MB</div>
                                </div>
                            </div>
                            <div class="label">مصرف حافظه</div>
                        </div>
                    </div>
                </div>
            `;

            // ===== MODEL =====
            html += `
                <div class="card" style="border-color:rgba(0,212,255,0.08);">
                    <div class="card-title"><i class="fas fa-brain" style="color:#a855f7;"></i> وضعیت مدل</div>
                    <div class="model-status-row">
                        <span class="badge ${modelBadge}">${modelText}</span>
                        <span style="color:#4a5a6a;font-size:0.8rem;">
                            وضعیت: ${modeDisplay}
                        </span>
                        <span style="color:#4a5a6a;font-size:0.8rem;">
                            ${lastScore !== null ? `دقت: ${(lastScore * 100).toFixed(1)}%` : 'دقت: —'}
                        </span>
                        <span style="color:#4a5a6a;font-size:0.8rem;">
                            ${totalTrainings > 0 ? `آموزش: ${totalTrainings} بار` : ''}
                        </span>
                    </div>
                </div>
            `;

            // ===== OVERALL STATUS =====
            const statusClass = healthData.status === 'ok' ? 'badge-success' :
                               healthData.status === 'degraded' ? 'badge-warning' : 'badge-danger';
            const statusIcon = healthData.status === 'ok' ? '✅' :
                              healthData.status === 'degraded' ? '⚠️' : '❌';

            html += `
                <div class="card" style="border-color:rgba(0,212,255,0.08);">
                    <div class="card-title"><i class="fas fa-chart-simple"></i> وضعیت کلی</div>
                    <div style="text-align:center;padding:10px 0 15px;">
                        <span class="badge ${statusClass}" style="font-size:1.3rem;padding:8px 30px;">
                            ${statusIcon} ${healthData.status || 'نامشخص'}
                        </span>
                    </div>
                    <div style="text-align:center;color:#4a5a6a;font-size:0.75rem;">
                        ${healthData.timestamp ? new Date(healthData.timestamp).toLocaleString('fa-IR') : ''}
                    </div>
                </div>
            `;

            // ===== COMPONENTS =====
            if (healthData.components) {
                const componentKeys = Object.keys(healthData.components);
                if (componentKeys.length > 0) {
                    html += `<div class="card" style="border-color:rgba(0,212,255,0.08);">
                        <div class="card-title"><i class="fas fa-cogs"></i> اجزای سیستم</div>`;
                    for (const key of componentKeys) {
                        const value = healthData.components[key];
                        if (key === 'memory') continue;
                        const statusColor = value.status === 'healthy' ? 'badge-success' :
                                           value.status === 'degraded' ? 'badge-warning' :
                                           value.status === 'unhealthy' ? 'badge-danger' : 'badge-info';
                        const iconMap = {
                            'api': 'fa-plug',
                            'model': 'fa-brain',
                            'credits': 'fa-coins',
                            'api_stats': 'fa-chart-bar',
                            'task_manager': 'fa-tasks',
                            'databases': 'fa-database'
                        };
                        const icon = iconMap[key] || 'fa-cog';

                        const message = value.message || '';
                        html += `
                            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #0d1624;flex-wrap:wrap;gap:8px;">
                                <div style="display:flex;align-items:center;gap:8px;">
                                    <i class="fas ${icon}" style="color:#00d4ff;width:18px;"></i>
                                    <span style="color:#e8eef7;font-size:0.85rem;">${key}</span>
                                    <span class="badge ${statusColor}">${value.status || 'نامشخص'}</span>
                                </div>
                                <span style="color:#4a5a6a;font-size:0.7rem;">${message}</span>
                            </div>
                        `;
                    }
                    html += `</div>`;
                }
            }

            container.innerHTML = html;
        }

        // ============================================================
        // UPDATE METRICS (زنده)
        // ============================================================
        function updateMetrics() {
            fetch('/health/cpu')
                .then(res => res.json())
                .then(cpuData => {
                    const cpuPercent = cpuData.cpu_percent || 0;
                    const cpuStatus = cpuData.status || 'healthy';
                    const cpuColor = cpuStatus === 'danger' ? '#ff4444' :
                                    cpuStatus === 'warning' ? '#ffaa00' : '#00ff88';

                    const circumference = 2 * Math.PI * 62;
                    const cpuOffset = circumference * (1 - Math.min(cpuPercent, 100) / 100);

                    const valueEl = document.getElementById('cpuValue');
                    if (valueEl) {
                        valueEl.textContent = Math.round(cpuPercent) + '%';
                        valueEl.style.color = cpuColor;
                    }
                })
                .catch(() => {});

            fetch('/stats/memory')
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.data) {
                        const ramUsed = data.data.used_mb || 0;
                        const ramTotal = data.data.total_mb || 512;
                        const ramPercent = data.data.percent || 0;
                        const ramColor = ramPercent > 80 ? '#ff4444' :
                                        ramPercent > 60 ? '#ffaa00' : '#00ff88';

                        const circumference = 2 * Math.PI * 62;
                        const ramOffset = circumference * (1 - Math.min(ramPercent, 100) / 100);

                        const valueEl = document.getElementById('ramValue');
                        const subEl = document.getElementById('ramSub');
                        if (valueEl) {
                            valueEl.textContent = Math.round(ramPercent) + '%';
                            valueEl.style.color = ramColor;
                        }
                        if (subEl) {
                            subEl.textContent = Math.round(ramUsed) + ' / ' + Math.round(ramTotal) + ' MB';
                        }
                    }
                })
                .catch(() => {});
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
                return;
            }
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const colors = { info: '#00d4ff', success: '#00ff88', error: '#ff4444', warning: '#ffaa00' };
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            toast.style.borderColor = colors[type] || colors.info;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 3000);
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadFullHealth();
            console.log('🚀 Health page v3.0 loaded');
        });
    </script>

</body>
