<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلامت سیستم</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; min-height: 100vh; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard-header .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .menu-toggle {
            width: 44px; height: 44px; border-radius: 50%; background: #0d1624;
            border: 1px solid #1a2a3a; color: #e0e6ed; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 200;
        }
        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed; top: 80px; right: 20px;
            background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 10px 0;
            min-width: 200px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150; transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #a0b4c8; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0,212,255,0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.7rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* ===== CARDS ===== */
        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.03);
        }
        .card-title {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-subtitle {
            color: #7a8fa3;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 25px;
            border: none; border-radius: 10px; font-size: 0.95rem; cursor: pointer;
            transition: all 0.3s ease; font-weight: 500; text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }

        .badge {
            display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500;
        }
        .badge-success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .badge-warning { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
        .badge-danger { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        .badge-info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
        .badge-gray { background: rgba(255,255,255,0.05); color: #7a8fa3; border: 1px solid rgba(255,255,255,0.05); }

        .table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .table th { text-align: right; padding: 10px 12px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 10px 12px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0,212,255,0.03); }

        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }

        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px; gap: 15px; }
        .spinner { width: 45px; height: 45px; border: 4px solid #1a2a3a; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== METRIC CIRCLES ===== */
        .metrics-row {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
            padding: 20px 0;
        }
        .metric-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .metric-circle .wrapper {
            position: relative;
            width: 150px;
            height: 150px;
        }
        .metric-circle svg {
            transform: rotate(-90deg);
            width: 150px;
            height: 150px;
        }
        .metric-circle .bg {
            fill: none;
            stroke: #1a2a3a;
            stroke-width: 10;
        }
        .metric-circle .progress {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.2s ease;
        }
        .metric-circle .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .metric-circle .center-text .value {
            font-size: 2rem;
            font-weight: bold;
            color: #e0e6ed;
        }
        .metric-circle .center-text .sub {
            font-size: 0.7rem;
            color: #4a5a6a;
        }
        .metric-circle .label {
            margin-top: 12px;
            color: #7a8fa3;
            font-size: 0.9rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .row { grid-template-columns: 1fr; gap: 14px; }
            .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .container { padding: 12px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
            .metrics-row { gap: 30px; }
            .metric-circle .wrapper { width: 120px; height: 120px; }
            .metric-circle svg { width: 120px; height: 120px; }
            .metric-circle .center-text .value { font-size: 1.5rem; }
        }
        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
            .metric-circle .wrapper { width: 100px; height: 100px; }
            .metric-circle svg { width: 100px; height: 100px; }
            .metric-circle .center-text .value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- ===== MENU ===== -->
    <div id="navContainer"></div>

    <!-- ===== CONTENT ===== -->
    <div class="container">
        <div class="card" style="border-color:rgba(0,212,255,0.1);">
            <div class="card-title">
                <i class="fas fa-heartbeat" style="color:#ff6b6b;"></i>
                سلامت سیستم
            </div>
            <div class="card-subtitle">وضعیت لحظه‌ای تمام اجزای سیستم</div>
            <button class="btn btn-primary" onclick="loadHealth()">
                <i class="fas fa-sync-alt"></i> بروزرسانی
            </button>
        </div>

        <div id="healthContent">
            <div class="loading">
                <div class="spinner"></div>
                <p style="color:#7a8fa3;">در حال دریافت اطلاعات...</p>
            </div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        // ============================================================
        // بارگذاری منو
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        // ============================================================
        // بارگذاری سلامت
        // ============================================================
        function loadHealth() {
            const container = document.getElementById('healthContent');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;">در حال دریافت اطلاعات...</p>
                </div>
            `;

            Promise.all([
                fetch('/health').then(res => res.json()),
                fetch('/health/cpu').then(res => res.json())
            ])
            .then(([healthData, cpuData]) => {
                let html = '';

                // ===== کارت منابع (CPU + RAM) =====
                const ram = healthData.components?.memory || { used_mb: 0, total_mb: 512, percent: 0 };
                const ramPercent = ram.percent || 0;
                const ramUsed = ram.used_mb || 0;
                const ramTotal = ram.total_mb || 512;

                const cpuPercent = cpuData.cpu_percent || 0;
                const cpuStatus = cpuData.status || 'healthy';

                const cpuColor = cpuStatus === 'danger' ? '#ff4444' : 
                                cpuStatus === 'warning' ? '#ffaa00' : '#00ff88';
                const ramColor = ramPercent > 80 ? '#ff4444' : 
                                ramPercent > 60 ? '#ffaa00' : '#00ff88';

                const circumference = 2 * Math.PI * 62;
                const cpuOffset = circumference * (1 - Math.min(cpuPercent, 100) / 100);
                const ramOffset = circumference * (1 - Math.min(ramPercent, 100) / 100);

                html += `
                    <div class="card" style="grid-column:1/-1;border-color:rgba(0,212,255,0.08);">
                        <div class="card-title"><i class="fas fa-microchip"></i> مصرف منابع</div>
                        <div class="metrics-row">
                            <!-- CPU -->
                            <div class="metric-circle">
                                <div class="wrapper">
                                    <svg viewBox="0 0 150 150">
                                        <circle class="bg" cx="75" cy="75" r="62"/>
                                        <circle class="progress" cx="75" cy="75" r="62"
                                            stroke="${cpuColor}"
                                            stroke-dasharray="${circumference}"
                                            stroke-dashoffset="${cpuOffset}"/>
                                    </svg>
                                    <div class="center-text">
                                        <div class="value" style="color:${cpuColor};">${Math.round(cpuPercent)}%</div>
                                        <div class="sub">CPU</div>
                                    </div>
                                </div>
                                <div class="label">مصرف پردازنده</div>
                            </div>
                            <!-- RAM -->
                            <div class="metric-circle">
                                <div class="wrapper">
                                    <svg viewBox="0 0 150 150">
                                        <circle class="bg" cx="75" cy="75" r="62"/>
                                        <circle class="progress" cx="75" cy="75" r="62"
                                            stroke="${ramColor}"
                                            stroke-dasharray="${circumference}"
                                            stroke-dashoffset="${ramOffset}"/>
                                    </svg>
                                    <div class="center-text">
                                        <div class="value" style="color:${ramColor};">${Math.round(ramPercent)}%</div>
                                        <div class="sub">${Math.round(ramUsed)} / ${Math.round(ramTotal)} MB</div>
                                    </div>
                                </div>
                                <div class="label">مصرف حافظه</div>
                            </div>
                        </div>
                    </div>
                `;

                // ===== وضعیت کلی =====
                const statusClass = healthData.status === 'ok' ? 'badge-success' :
                                   healthData.status === 'degraded' ? 'badge-warning' : 'badge-danger';
                const statusIcon = healthData.status === 'ok' ? '✅' :
                                  healthData.status === 'degraded' ? '⚠️' : '❌';

                html += `
                    <div class="card" style="grid-column:1/-1;border-color:rgba(0,212,255,0.08);">
                        <div class="card-title"><i class="fas fa-chart-simple"></i> وضعیت کلی</div>
                        <div style="text-align:center;padding:10px 0 15px;">
                            <span class="badge ${statusClass}" style="font-size:1.4rem;padding:10px 35px;">
                                ${statusIcon} ${healthData.status || 'نامشخص'}
                            </span>
                        </div>
                        <div style="text-align:center;color:#4a5a6a;font-size:0.8rem;">
                            ${healthData.timestamp ? new Date(healthData.timestamp).toLocaleString('fa-IR') : ''}
                        </div>
                    </div>
                `;

                // ===== اجزای سیستم =====
                if (healthData.components) {
                    for (const [key, value] of Object.entries(healthData.components)) {
                        if (key === 'memory') continue;
                        const statusColor = value.status === 'healthy' ? 'badge-success' :
                                           value.status === 'degraded' ? 'badge-warning' :
                                           value.status === 'unhealthy' ? 'badge-danger' : 'badge-info';
                        const iconMap = {
                            'api': 'fa-plug',
                            'model': 'fa-brain',
                            'credits': 'fa-coins',
                            'api_stats': 'fa-chart-bar',
                            'task_manager': 'fa-tasks'
                        };
                        const icon = iconMap[key] || 'fa-cog';

                        html += `
                            <div class="card" style="border-color:rgba(0,212,255,0.05);">
                                <div class="card-title"><i class="fas ${icon}"></i> ${key}</div>
                                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                                    <span class="badge ${statusColor}">${value.status || 'نامشخص'}</span>
                                    <span style="color:#4a5a6a;font-size:0.85rem;">${value.message || ''}</span>
                                </div>
                                <pre style="background:#0a0e17;padding:12px;border-radius:8px;overflow-x:auto;font-size:0.8rem;margin-top:12px;color:#7a8fa3;border:1px solid #0d1624;">${JSON.stringify(value, null, 2)}</pre>
                            </div>
                        `;
                    }
                }

                container.innerHTML = html;
            })
            .catch(err => {
                container.innerHTML = `
                    <div class="card" style="border-color:#ff4444;">
                        <div class="card-title" style="color:#ff4444;"><i class="fas fa-exclamation-triangle"></i> خطا</div>
                        <p style="color:#ff4444;">${err.message}</p>
                    </div>
                `;
            });
        }

        // ============================================================
        // راه‌اندازی
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadHealth();
            setInterval(loadHealth, 30000);
        });
    </script>

</body>
</html>
