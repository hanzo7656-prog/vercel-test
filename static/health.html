<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلامت سیستم</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; min-height: 100vh; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard-header .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .menu-toggle {
            width: 44px; height: 44px; border-radius: 50%; background: #0d1624;
            border: 1px solid #1a2a3a; color: #e0e6ed; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 200;
        }
        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed; top: 80px; right: 20px;
            background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 10px 0;
            min-width: 200px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150; transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #a0b4c8; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0,212,255,0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.7rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(0, 212, 255, 0.2);
        }
        .card-title {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-subtitle {
            color: #7a8fa3;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px;
            border: none; border-radius: 10px; font-size: 0.85rem; cursor: pointer;
            transition: all 0.3s ease; font-weight: 500; text-decoration: none;
            font-family: inherit;
        }
        .btn-sm { padding: 5px 12px; font-size: 0.75rem; }
        .btn-success { background: linear-gradient(135deg, #00ff88, #00cc66); color: #0a0e17; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,255,136,0.3); }
        .btn-danger { background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,68,68,0.3); }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }
        .btn-warning { background: linear-gradient(135deg, #ffaa00, #cc8800); color: #0a0e17; }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,170,0,0.3); }

        .badge {
            display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500;
        }
        .badge-success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .badge-warning { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
        .badge-danger { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        .badge-info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
        .badge-gray { background: rgba(255,255,255,0.05); color: #7a8fa3; border: 1px solid rgba(255,255,255,0.05); }

        .table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .table th { text-align: right; padding: 10px 12px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 10px 12px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0,212,255,0.03); }

        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }

        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px; gap: 15px; }
        .spinner { width: 45px; height: 45px; border: 4px solid #1a2a3a; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== METRIC CIRCLES ===== */
        .metrics-row {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
            padding: 20px 0;
        }
        .metric-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .metric-circle .wrapper {
            position: relative;
            width: 150px;
            height: 150px;
        }
        .metric-circle svg {
            transform: rotate(-90deg);
            width: 150px;
            height: 150px;
        }
        .metric-circle .bg {
            fill: none;
            stroke: #1a2a3a;
            stroke-width: 10;
        }
        .metric-circle .progress {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease;
        }
        .metric-circle .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .metric-circle .center-text .value {
            font-size: 2rem;
            font-weight: bold;
            color: #e0e6ed;
            transition: color 0.5s ease;
        }
        .metric-circle .center-text .sub {
            font-size: 0.7rem;
            color: #4a5a6a;
        }
        .metric-circle .label {
            margin-top: 12px;
            color: #7a8fa3;
            font-size: 0.9rem;
        }

        /* ===== MODEL CARD ===== */
        .model-status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .model-status-row .info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .model-status-row .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .model-detail {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #0d1624;
        }
        .model-detail .item {
            background: #0a0e17;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #0d1624;
            text-align: center;
        }
        .model-detail .item .val {
            color: #e0e6ed;
            font-weight: 500;
        }
        .model-detail .item .lbl {
            color: #4a5a6a;
            font-size: 0.7rem;
        }

        @media (max-width: 768px) {
            .row { grid-template-columns: 1fr; gap: 14px; }
            .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .container { padding: 12px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
            .metrics-row { gap: 30px; }
            .metric-circle .wrapper { width: 120px; height: 120px; }
            .metric-circle svg { width: 120px; height: 120px; }
            .metric-circle .center-text .value { font-size: 1.5rem; }
            .model-status-row { flex-direction: column; align-items: stretch; }
            .model-status-row .actions { justify-content: flex-start; }
        }
        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
            .metric-circle .wrapper { width: 100px; height: 100px; }
            .metric-circle svg { width: 100px; height: 100px; }
            .metric-circle .center-text .value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- ===== MENU ===== -->
    <div id="navContainer"></div>

    <!-- ===== CONTENT ===== -->
    <div class="container">

        <!-- ===== کارت سلامت ===== -->
        <div class="card" style="border-color:rgba(0,212,255,0.1);">
            <div class="card-title">
                <i class="fas fa-heartbeat" style="color:#ff6b6b;"></i>
                سلامت سیستم
            </div>
            <div class="card-subtitle">وضعیت لحظه‌ای تمام اجزای سیستم</div>
            <button class="btn btn-primary" onclick="loadFullHealth()">
                <i class="fas fa-sync-alt"></i> بروزرسانی کامل
            </button>
        </div>

        <!-- ===== محتوای سلامت ===== -->
        <div id="healthContent">
            <div class="loading">
                <div class="spinner"></div>
                <p style="color:#7a8fa3;">در حال دریافت اطلاعات...</p>
            </div>
        </div>

    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        // ============================================================
        // بارگذاری منو
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        // ============================================================
        // متغیرها
        // ============================================================
        let healthInterval = null;

        // ============================================================
        // بارگذاری کامل سلامت
        // ============================================================
        function loadFullHealth() {
            const container = document.getElementById('healthContent');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;">در حال دریافت اطلاعات...</p>
                </div>
            `;

            Promise.all([
                fetch('/health').then(res => res.json()),
                fetch('/health/cpu').then(res => res.json()),
                fetch('/model/status').then(res => res.json())
            ])
            .then(([healthData, cpuData, modelData]) => {
                renderHealth(healthData, cpuData, modelData);
                
                if (healthInterval) clearInterval(healthInterval);
                healthInterval = setInterval(updateMetrics, 3000);
            })
            .catch(err => {
                container.innerHTML = `
                    <div class="card" style="border-color:#ff4444;">
                        <div class="card-title" style="color:#ff4444;"><i class="fas fa-exclamation-triangle"></i> خطا</div>
                        <p style="color:#ff4444;">${err.message}</p>
                    </div>
                `;
            });
        }

        // ============================================================
        // رندر سلامت
        // ============================================================
        function renderHealth(healthData, cpuData, modelData) {
            const container = document.getElementById('healthContent');
            const ram = healthData.components?.memory || { used_mb: 0, total_mb: 512, percent: 0 };
            const ramPercent = ram.percent || 0;
            const ramUsed = ram.used_mb || 0;
            const ramTotal = ram.total_mb || 512;

            const cpuPercent = cpuData.cpu_percent || 0;
            const cpuStatus = cpuData.status || 'healthy';
            const cpuColor = cpuStatus === 'danger' ? '#ff4444' : 
                            cpuStatus === 'warning' ? '#ffaa00' : '#00ff88';
            const ramColor = ramPercent > 80 ? '#ff4444' : 
                            ramPercent > 60 ? '#ffaa00' : '#00ff88';

            const circumference = 2 * Math.PI * 62;
            const cpuOffset = circumference * (1 - Math.min(cpuPercent, 100) / 100);
            const ramOffset = circumference * (1 - Math.min(ramPercent, 100) / 100);

            let html = '';

            // ===== کارت منابع =====
            html += `
                <div class="card" id="metricsCard" style="grid-column:1/-1;border-color:rgba(0,212,255,0.08);">
                    <div class="card-title"><i class="fas fa-microchip"></i> مصرف منابع</div>
                    <div class="metrics-row">
                        <div class="metric-circle" id="cpuMetric">
                            <div class="wrapper">
                                <svg viewBox="0 0 150 150">
                                    <circle class="bg" cx="75" cy="75" r="62"/>
                                    <circle class="progress" id="cpuProgress" cx="75" cy="75" r="62"
                                        stroke="${cpuColor}"
                                        stroke-dasharray="${circumference}"
                                        stroke-dashoffset="${cpuOffset}"/>
                                </svg>
                                <div class="center-text">
                                    <div class="value" id="cpuValue" style="color:${cpuColor};">${Math.round(cpuPercent)}%</div>
                                    <div class="sub">CPU</div>
                                </div>
                            </div>
                            <div class="label">مصرف پردازنده</div>
                        </div>
                        <div class="metric-circle" id="ramMetric">
                            <div class="wrapper">
                                <svg viewBox="0 0 150 150">
                                    <circle class="bg" cx="75" cy="75" r="62"/>
                                    <circle class="progress" id="ramProgress" cx="75" cy="75" r="62"
                                        stroke="${ramColor}"
                                        stroke-dasharray="${circumference}"
                                        stroke-dashoffset="${ramOffset}"/>
                                </svg>
                                <div class="center-text">
                                    <div class="value" id="ramValue" style="color:${ramColor};">${Math.round(ramPercent)}%</div>
                                    <div class="sub" id="ramSub">${Math.round(ramUsed)} / ${Math.round(ramTotal)} MB</div>
                                </div>
                            </div>
                            <div class="label">مصرف حافظه</div>
                        </div>
                    </div>
                </div>
            `;

            // ===== کارت مدل =====
            const modelStats = modelData?.stats || {};
            const modelRunning = modelData?.is_running || false;
            const isTraining = modelData?.is_training || false;
            const modelExists = modelData?.model_exists || false;
            const lastTraining = modelStats?.last_training || null;
            const lastScore = modelStats?.last_score || null;
            const totalTrainings = modelStats?.total_trainings || 0;
            const dataPoints = modelStats?.data_points_used || 0;
            const apiStatus = modelData?.api_status?.api_status || 'unknown';
            const creditsRemaining = modelData?.api_status?.credits_remaining || 0;

            const modelStatusBadge = modelExists ? 'badge-success' : 'badge-warning';
            const modelStatusText = modelExists ? '✅ فعال' : '⚠️ غیرفعال';
            const runningBadge = modelRunning ? 'badge-success' : 'badge-gray';
            const runningText = modelRunning ? 'در حال اجرا' : 'متوقف';

            html += `
                <div class="card" id="modelCard" style="border-color:rgba(0,212,255,0.08);">
                    <div class="card-title"><i class="fas fa-brain" style="color:#a855f7;"></i> وضعیت مدل</div>
                    
                    <div class="model-status-row">
                        <div class="info">
                            <span class="badge ${modelStatusBadge}">${modelStatusText}</span>
                            <span class="badge ${runningBadge}">${runningText}</span>
                            ${isTraining ? '<span class="badge badge-warning">⏳ در حال آموزش...</span>' : ''}
                            <span style="color:#4a5a6a;font-size:0.8rem;">
                                اعتبار: ${creditsRemaining}
                            </span>
                            <span style="color:#4a5a6a;font-size:0.8rem;">
                                API: ${apiStatus === 'ok' ? '✅' : '❌'}
                            </span>
                        </div>
                        <div class="actions">
                            ${!modelRunning ? 
                                `<button class="btn btn-sm btn-success" onclick="toggleModel('start')">▶️ روشن</button>` :
                                `<button class="btn btn-sm btn-danger" onclick="toggleModel('stop')">⏹️ خاموش</button>`
                            }
                            <button class="btn btn-sm btn-primary" onclick="trainNow()">🧠 آموزش دستی</button>
                            <button class="btn btn-sm btn-warning" onclick="refreshModelStatus()">🔄</button>
                        </div>
                    </div>

                    <div class="model-detail">
                        <div class="item">
                            <div class="val">${totalTrainings}</div>
                            <div class="lbl">تعداد آموزش</div>
                        </div>
                        <div class="item">
                            <div class="val">${lastScore !== null ? lastScore : '—'}</div>
                            <div class="lbl">آخرین دقت</div>
                        </div>
                        <div class="item">
                            <div class="val">${dataPoints > 0 ? dataPoints : '—'}</div>
                            <div class="lbl">نقاط داده</div>
                        </div>
                        <div class="item">
                            <div class="val">${lastTraining ? new Date(lastTraining).toLocaleString('fa-IR') : '—'}</div>
                            <div class="lbl">آخرین آموزش</div>
                        </div>
                    </div>
                </div>
            `;

            // ===== وضعیت کلی =====
            const statusClass = healthData.status === 'ok' ? 'badge-success' :
                               healthData.status === 'degraded' ? 'badge-warning' : 'badge-danger';
            const statusIcon = healthData.status === 'ok' ? '✅' :
                              healthData.status === 'degraded' ? '⚠️' : '❌';

            html += `
                <div class="card" style="grid-column:1/-1;border-color:rgba(0,212,255,0.08);">
                    <div class="card-title"><i class="fas fa-chart-simple"></i> وضعیت کلی</div>
                    <div style="text-align:center;padding:10px 0 15px;">
                        <span class="badge ${statusClass}" style="font-size:1.4rem;padding:10px 35px;">
                            ${statusIcon} ${healthData.status || 'نامشخص'}
                        </span>
                    </div>
                    <div style="text-align:center;color:#4a5a6a;font-size:0.8rem;">
                        ${healthData.timestamp ? new Date(healthData.timestamp).toLocaleString('fa-IR') : ''}
                    </div>
                </div>
            `;

            // ===== اجزای سیستم =====
            if (healthData.components) {
                for (const [key, value] of Object.entries(healthData.components)) {
                    if (key === 'memory') continue;
                    const statusColor = value.status === 'healthy' ? 'badge-success' :
                                       value.status === 'degraded' ? 'badge-warning' :
                                       value.status === 'unhealthy' ? 'badge-danger' : 'badge-info';
                    const iconMap = {
                        'api': 'fa-plug',
                        'model': 'fa-brain',
                        'credits': 'fa-coins',
                        'api_stats': 'fa-chart-bar',
                        'task_manager': 'fa-tasks'
                    };
                    const icon = iconMap[key] || 'fa-cog';

                    html += `
                        <div class="card" style="border-color:rgba(0,212,255,0.05);">
                            <div class="card-title"><i class="fas ${icon}"></i> ${key}</div>
                            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                                <span class="badge ${statusColor}">${value.status || 'نامشخص'}</span>
                                <span style="color:#4a5a6a;font-size:0.85rem;">${value.message || ''}</span>
                            </div>
                            <pre style="background:#0a0e17;padding:12px;border-radius:8px;overflow-x:auto;font-size:0.8rem;margin-top:12px;color:#7a8fa3;border:1px solid #0d1624;">${JSON.stringify(value, null, 2)}</pre>
                        </div>
                    `;
                }
            }

            container.innerHTML = html;
        }

        // ============================================================
        // به‌روزرسانی فقط اعداد
        // ============================================================
        function updateMetrics() {
            // CPU
            fetch('/health/cpu')
                .then(res => res.json())
                .then(cpuData => {
                    const cpuPercent = cpuData.cpu_percent || 0;
                    const cpuStatus = cpuData.status || 'healthy';
                    const cpuColor = cpuStatus === 'danger' ? '#ff4444' : 
                                    cpuStatus === 'warning' ? '#ffaa00' : '#00ff88';
                    
                    const circumference = 2 * Math.PI * 62;
                    const cpuOffset = circumference * (1 - Math.min(cpuPercent, 100) / 100);
                    
                    const cpuValueEl = document.getElementById('cpuValue');
                    const cpuProgressEl = document.getElementById('cpuProgress');
                    if (cpuValueEl) {
                        cpuValueEl.textContent = Math.round(cpuPercent) + '%';
                        cpuValueEl.style.color = cpuColor;
                    }
                    if (cpuProgressEl) {
                        cpuProgressEl.style.stroke = cpuColor;
                        cpuProgressEl.style.strokeDashoffset = cpuOffset;
                    }
                })
                .catch(err => console.error('CPU update error:', err));

            // RAM
            fetch('/health')
                .then(res => res.json())
                .then(data => {
                    const ram = data.components?.memory || { used_mb: 0, total_mb: 512, percent: 0 };
                    const ramPercent = ram.percent || 0;
                    const ramUsed = ram.used_mb || 0;
                    const ramTotal = ram.total_mb || 512;
                    const ramColor = ramPercent > 80 ? '#ff4444' : 
                                    ramPercent > 60 ? '#ffaa00' : '#00ff88';
                    
                    const circumference = 2 * Math.PI * 62;
                    const ramOffset = circumference * (1 - Math.min(ramPercent, 100) / 100);
                    
                    const ramValueEl = document.getElementById('ramValue');
                    const ramProgressEl = document.getElementById('ramProgress');
                    const ramSubEl = document.getElementById('ramSub');
                    if (ramValueEl) {
                        ramValueEl.textContent = Math.round(ramPercent) + '%';
                        ramValueEl.style.color = ramColor;
                    }
                    if (ramProgressEl) {
                        ramProgressEl.style.stroke = ramColor;
                        ramProgressEl.style.strokeDashoffset = ramOffset;
                    }
                    if (ramSubEl) {
                        ramSubEl.textContent = Math.round(ramUsed) + ' / ' + Math.round(ramTotal) + ' MB';
                    }
                })
                .catch(err => console.error('RAM update error:', err));
        }

        // ============================================================
        // کنترل مدل
        // ============================================================
        function toggleModel(action) {
            const url = action === 'start' ? '/model/start' : '/model/stop';
            fetch(url, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || '✅ انجام شد');
                    refreshModelStatus();
                })
                .catch(err => alert('❌ خطا: ' + err.message));
        }

        function trainNow() {
            if (!confirm('آموزش دستی مدل ممکنه چند دقیقه طول بکشه. ادامه میدین؟')) return;
            
            const btn = document.querySelector('.btn-primary[onclick="trainNow()"]');
            if (btn) {
                btn.textContent = '⏳ در حال آموزش...';
                btn.disabled = true;
            }

            fetch('/model/train', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(`✅ مدل آموزش دید!\nدقت: ${data.accuracy || 'N/A'}\nتعداد نمونه: ${data.samples || 0}`);
                    } else {
                        alert('❌ ' + data.message);
                    }
                    refreshModelStatus();
                })
                .catch(err => alert('❌ خطا: ' + err.message))
                .finally(() => {
                    if (btn) {
                        btn.textContent = '🧠 آموزش دستی';
                        btn.disabled = false;
                    }
                });
        }

        function refreshModelStatus() {
            fetch('/model/status')
                .then(res => res.json())
                .then(data => {
                    // به‌روزرسانی کارت مدل بدون رفرش کامل
                    const modelCard = document.getElementById('modelCard');
                    if (!modelCard) {
                        loadFullHealth();
                        return;
                    }

                    const modelStats = data?.stats || {};
                    const modelRunning = data?.is_running || false;
                    const isTraining = data?.is_training || false;
                    const modelExists = data?.model_exists || false;
                    const lastTraining = modelStats?.last_training || null;
                    const lastScore = modelStats?.last_score || null;
                    const totalTrainings = modelStats?.total_trainings || 0;
                    const dataPoints = modelStats?.data_points_used || 0;
                    const apiStatus = data?.api_status?.api_status || 'unknown';
                    const creditsRemaining = data?.api_status?.credits_remaining || 0;

                    // به‌روزرسانی متن‌ها
                    const badges = modelCard.querySelectorAll('.badge');
                    if (badges.length >= 2) {
                        // وضعیت مدل
                        badges[0].className = `badge ${modelExists ? 'badge-success' : 'badge-warning'}`;
                        badges[0].textContent = modelExists ? '✅ فعال' : '⚠️ غیرفعال';
                        
                        // وضعیت اجرا
                        badges[1].className = `badge ${modelRunning ? 'badge-success' : 'badge-gray'}`;
                        badges[1].textContent = modelRunning ? 'در حال اجرا' : 'متوقف';
                    }

                    // دکمه‌های روشن/خاموش
                    const actionsDiv = modelCard.querySelector('.actions');
                    if (actionsDiv) {
                        const startBtn = actionsDiv.querySelector('.btn-success');
                        const stopBtn = actionsDiv.querySelector('.btn-danger');
                        
                        if (modelRunning) {
                            if (startBtn) startBtn.style.display = 'none';
                            if (stopBtn) stopBtn.style.display = 'inline-flex';
                        } else {
                            if (startBtn) startBtn.style.display = 'inline-flex';
                            if (stopBtn) stopBtn.style.display = 'none';
                        }
                    }

                    // به‌روزرسانی جزئیات
                    const detailItems = modelCard.querySelectorAll('.model-detail .item .val');
                    if (detailItems.length >= 4) {
                        detailItems[0].textContent = totalTrainings;
                        detailItems[1].textContent = lastScore !== null ? lastScore : '—';
                        detailItems[2].textContent = dataPoints > 0 ? dataPoints : '—';
                        detailItems[3].textContent = lastTraining ? new Date(lastTraining).toLocaleString('fa-IR') : '—';
                    }

                    // اعتبار و API
                    const infoSpan = modelCard.querySelector('.info');
                    if (infoSpan) {
                        const spans = infoSpan.querySelectorAll('span');
                        if (spans.length >= 4) {
                            spans[2].textContent = `اعتبار: ${creditsRemaining}`;
                            spans[3].textContent = `API: ${apiStatus === 'ok' ? '✅' : '❌'}`;
                        }
                    }
                })
                .catch(err => console.error('Model status error:', err));
        }

        // ============================================================
        // راه‌اندازی
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadFullHealth();
        });
    </script>

</body>
</html>
