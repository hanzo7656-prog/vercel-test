<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت تسک‌ها</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; min-height: 100vh; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard-header .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .menu-toggle {
            width: 44px; height: 44px; border-radius: 50%; background: #0d1624;
            border: 1px solid #1a2a3a; color: #e0e6ed; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 200;
        }
        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed; top: 80px; right: 20px;
            background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 10px 0;
            min-width: 200px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150; transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #a0b4c8; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0,212,255,0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.7rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card-title {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-subtitle {
            color: #7a8fa3;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 20px; border: none; border-radius: 10px;
            font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease;
            font-weight: 500; text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #00ff88, #00cc66); color: #0a0e17; }
        .btn-warning { background: linear-gradient(135deg, #ffaa00, #cc8800); color: #0a0e17; }
        .btn-sm { padding: 4px 12px; font-size: 0.75rem; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,68,68,0.3); }

        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 0.7rem; font-weight: 500;
        }
        .badge-success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .badge-warning { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
        .badge-danger { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        .badge-info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
        .badge-gray { background: rgba(255,255,255,0.05); color: #7a8fa3; border: 1px solid rgba(255,255,255,0.05); }

        .table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .table th { text-align: right; padding: 10px 12px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 10px 12px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0,212,255,0.03); }

        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }

        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #1a2a3a; border-top: 3px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .progress-bar {
            width: 100%; height: 6px; background: #1a2a3a; border-radius: 4px; overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%; border-radius: 4px; transition: width 0.5s ease;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
        }

        .auto-task-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: #0a0e17; border-radius: 10px;
            border: 1px solid #1a2a3a; margin-bottom: 8px;
            flex-wrap: wrap; gap: 8px;
        }
        .auto-task-item .info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .auto-task-item .actions { display: flex; gap: 6px; }

        .controls-row {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;
        }

        .log-entry {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin: 2px 0;
            background: #0a0e17;
            border-right: 2px solid #1a2a3a;
        }
        .log-entry.success { border-right-color: #00ff88; color: #00ff88; }
        .log-entry.error { border-right-color: #ff4444; color: #ff4444; }
        .log-entry.info { border-right-color: #00d4ff; color: #00d4ff; }
        .log-entry.stopped { border-right-color: #ffaa00; color: #ffaa00; }

        @media (max-width: 768px) {
            .row { grid-template-columns: 1fr; }
            .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .container { padding: 12px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
            .auto-task-item { flex-direction: column; align-items: stretch; }
            .auto-task-item .actions { justify-content: flex-start; }
        }
        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
        }
    </style>
</head>
<body>

    <!-- منو -->
    <div id="navContainer"></div>

    <!-- محتوا -->
    <div class="container">

        <div class="card">
            <div class="card-title">⏳ مدیریت تسک‌های پس‌زمینه</div>
            <div class="card-subtitle">مدیریت تسک‌های دستی و خودکار سیستم</div>
            <div class="controls-row">
                <button class="btn btn-primary" onclick="loadStats()">🔄 بروزرسانی</button>
                <button class="btn btn-danger" onclick="clearTasks()">🗑️ پاک کردن تسک‌های تکمیل‌شده</button>
                <button class="btn btn-success" onclick="startAllAuto()">▶️ شروع همه تسک‌های خودکار</button>
                <button class="btn btn-warning" onclick="stopAllAuto()">⏹️ توقف همه تسک‌های خودکار</button>
            </div>
        </div>

        <div id="statsContent">
            <div class="loading"><div class="spinner"></div><p>در حال دریافت آمار...</p></div>
        </div>

    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        let statsInterval = null;

        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        function loadStats() {
            const container = document.getElementById('statsContent');
            
            fetch('/task-manager/stats')
                .then(res => res.json())
                .then(data => {
                    let html = '';

                    // ===== ردیف ۱: وضعیت کلی =====
                    html += `<div class="row">`;
                    html += `
                        <div class="card">
                            <div class="card-title">📊 وضعیت کلی</div>
                            <table class="table">
                                <tr><td>وضعیت</td><td><span class="badge ${data.config.running ? 'badge-success' : 'badge-danger'}">${data.config.running ? 'فعال' : 'متوقف'}</span></td></tr>
                                <tr><td>کارگرها</td><td>${data.workers.active} از ${data.workers.total} فعال</td></tr>
                                <tr><td>تسک‌ها</td><td>${data.tasks.total}</td></tr>
                                <tr><td>صف</td><td>${data.tasks.queue_size}</td></tr>
                            </table>
                        </div>
                    `;

                    html += `
                        <div class="card">
                            <div class="card-title">📈 آمار تسک‌ها</div>
                            <table class="table">
                                <tr><td>کل ارسال‌شده</td><td>${data.stats.total_submitted}</td></tr>
                                <tr><td>تکمیل‌شده</td><td><span class="badge badge-success">${data.stats.total_completed}</span></td></tr>
                                <tr><td>شکست‌خورده</td><td><span class="badge badge-danger">${data.stats.total_failed}</span></td></tr>
                                <tr><td>میانگین زمان</td><td>${data.stats.avg_processing_time?.toFixed(2) || 0}s</td></tr>
                            </table>
                        </div>
                    `;
                    html += `</div>`;

                    // ===== تسک‌های خودکار با درصد و ثانیه‌شمار =====
                    html += `<div class="card">`;
                    html += `<div class="card-title">🤖 تسک‌های خودکار</div>`;

                    if (data.auto_tasks && data.auto_tasks.length > 0) {
                        data.auto_tasks.forEach(task => {
                            const statusBadge = task.running ? 'badge-success' : 'badge-gray';
                            const statusText = task.running ? 'در حال اجرا' : 'متوقف';
                            const lastRun = task.last_run ? new Date(task.last_run).toLocaleString('fa-IR') : 'تاکنون اجرا نشده';
                            const progress = task.progress || 0;
                            const remaining = task.remaining_time || 0;

                            // نمایش دقیقه و ثانیه
                            const mins = Math.floor(remaining / 60);
                            const secs = remaining % 60;
                            const timeDisplay = remaining > 0 ? `${mins}:${secs.toString().padStart(2, '0')}` : '--:--';

                            html += `
                                <div class="auto-task-item" data-task-name="${task.name}">
                                    <div class="info" style="flex:1;">
                                        <span style="font-weight:500;color:#e0e6ed;min-width:160px;">${task.name}</span>
                                        <span class="badge ${statusBadge}">${statusText}</span>
                                        <span style="color:#4a5a6a;font-size:0.75rem;">⏱️ هر ${task.interval} ثانیه</span>
                                        <span style="color:#4a5a6a;font-size:0.75rem;">📊 ${task.total_runs} بار</span>
                                        <span style="color:#00ff88;font-size:0.75rem;">✅ ${task.successful_runs}</span>
                                        <span style="color:#ff4444;font-size:0.75rem;">❌ ${task.failed_runs}</span>
                                    </div>
                                    <div style="flex:1;min-width:150px;">
                                        <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:#7a8fa3;">
                                            <span>پیشرفت: ${progress}%</span>
                                            <span>⏳ ${timeDisplay}</span>
                                        </div>
                                        <div class="progress-bar">
                                            <div class="fill" style="width:${progress}%;"></div>
                                        </div>
                                    </div>
                                    <div class="actions">
                                        ${!task.running ? `<button class="btn btn-sm btn-success" onclick="startAuto('${task.name}')">▶️ شروع</button>` :
                                                           `<button class="btn btn-sm btn-danger" onclick="stopAuto('${task.name}')">⏹️ توقف</button>`}
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        html += `<p style="color:#4a5a6a;text-align:center;">هیچ تسک خودکاری ثبت نشده است</p>`;
                    }
                    html += `</div>`;

                    // ===== لاگ‌های تسک‌ها =====
                    html += `<div class="card">`;
                    html += `<div class="card-title">📋 لاگ تسک‌ها</div>`;
                    
                    let hasLogs = false;
                    if (data.auto_tasks) {
                        data.auto_tasks.forEach(task => {
                            if (task.logs && task.logs.length > 0) {
                                hasLogs = true;
                                html += `<div style="margin-bottom:10px;color:#7a8fa3;font-size:0.85rem;">${task.name}</div>`;
                                task.logs.slice().reverse().forEach(log => {
                                    const time = new Date(log.time).toLocaleString('fa-IR');
                                    const cls = log.event === 'success' ? 'success' : 
                                               log.event === 'error' ? 'error' : 
                                               log.event === 'stopped' ? 'stopped' : 'info';
                                    html += `
                                        <div class="log-entry ${cls}">
                                            [${time}] ${log.message}
                                        </div>
                                    `;
                                });
                            }
                        });
                    }
                    
                    if (!hasLogs) {
                        html += `<p style="color:#4a5a6a;text-align:center;">هیچ لاگی ثبت نشده است</p>`;
                    }
                    html += `</div>`;

                    // ===== وضعیت تسک‌ها =====
                    html += `
                        <div class="card">
                            <div class="card-title">📋 وضعیت تسک‌ها</div>
                            <table class="table">
                                <tr>
                                    <th>شناسه</th>
                                    <th>نام</th>
                                    <th>وضعیت</th>
                                    <th>پیشرفت</th>
                                    <th>زمان ایجاد</th>
                                </tr>
                    `;

                    if (data.tasks.total > 0) {
                        html += `
                            <tr>
                                <td colspan="5" style="text-align:center;color:#4a5a6a;">
                                    ${data.tasks.total} تسک در حافظه 
                                    (${data.tasks.pending} در صف، ${data.tasks.processing} در حال اجرا)
                                </td>
                            </tr>
                        `;
                    } else {
                        html += `
                            <tr>
                                <td colspan="5" style="text-align:center;color:#4a5a6a;">هیچ تسکی در حافظه نیست</td>
                            </tr>
                        `;
                    }
                    html += `</table></div>`;

                    container.innerHTML = html;
                })
                .catch(err => {
                    container.innerHTML = `<div class="card"><div class="card-title">❌ خطا</div><p style="color:#ff4444;">${err.message}</p></div>`;
                });
        }

        // ===== آپدیت خودکار هر ثانیه =====
        function startAutoRefresh() {
            if (statsInterval) clearInterval(statsInterval);
            statsInterval = setInterval(loadStats, 1000);
        }

        // ===== کنترل تسک‌ها =====
        function startAuto(name) {
            fetch(`/task-manager/auto/start?name=${encodeURIComponent(name)}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || '✅ تسک شروع شد');
                    loadStats();
                })
                .catch(err => alert('❌ خطا: ' + err.message));
        }

        function stopAuto(name) {
            fetch(`/task-manager/auto/stop?name=${encodeURIComponent(name)}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || '✅ تسک متوقف شد');
                    loadStats();
                })
                .catch(err => alert('❌ خطا: ' + err.message));
        }

        function startAllAuto() {
            fetch('/task-manager/auto/start-all', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || '✅ همه تسک‌ها شروع شدند');
                    loadStats();
                })
                .catch(err => alert('❌ خطا: ' + err.message));
        }

        function stopAllAuto() {
            fetch('/task-manager/auto/stop-all', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || '✅ همه تسک‌ها متوقف شدند');
                    loadStats();
                })
                .catch(err => alert('❌ خطا: ' + err.message));
        }

        function clearTasks() {
            if (!confirm('آیا از پاک کردن تمام تسک‌های تکمیل‌شده اطمینان دارید؟')) return;
            fetch('/task-manager/clear', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert('✅ ' + data.message);
                    loadStats();
                })
                .catch(err => alert('❌ خطا: ' + err.message));
        }

        // ===== راه‌اندازی =====
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadStats();
            startAutoRefresh();
        });
    </script>

</body>
</html>
