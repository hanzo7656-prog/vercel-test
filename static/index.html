<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم تشخیص الگوی بازاری</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(145deg, #111d2b, #0a0e17);
            border-radius: 20px;
            border: 1px solid #1a2a3a;
            margin-bottom: 30px;
        }
        .hero h1 {
            font-size: 2.5rem;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        .hero p {
            color: #7a8fa3;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        .quick-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }
        .quick-actions .btn {
            min-width: 140px;
            justify-content: center;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .status-item {
            background: #0d1624;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1a2a3a;
            text-align: center;
        }
        .status-item .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .status-item .label {
            color: #7a8fa3;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .status-item .value.green { color: #00ff88; }
        .status-item .value.yellow { color: #ffaa00; }
        .status-item .value.red { color: #ff4444; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">📊 سیستم تشخیص الگو</a>
        <div class="navbar-menu">
            <a href="/" class="active">🏠 خانه</a>
            <a href="/dashboard">📈 داشبورد</a>
            <a href="/predict-page">🎯 پیش‌بینی</a>
            <a href="/test-api-page">🔌 تست API</a>
            <a href="/health-page">💚 سلامت</a>
            <a href="/stats-page">📊 آمار</a>
        </div>
        <div class="navbar-status">
            <span><span class="status-dot online"></span> آنلاین</span>
            <span style="color: #7a8fa3; font-size: 0.8rem;">
                ⏱️ <span id="uptimeDisplay">۰ ثانیه</span>
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>🚀 سیستم تشخیص الگوهای بازاری</h1>
            <p>تحلیل هوشمند بازار کریپتو با الگوریتم‌های یادگیری ماشین</p>
            <div class="quick-actions">
                <a href="/dashboard" class="btn btn-primary">📈 ورود به داشبورد</a>
                <a href="/predict-page" class="btn btn-success">🎯 پیش‌بینی الگو</a>
                <a href="/health-page" class="btn btn-outline">💚 سلامت سیستم</a>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📊 وضعیت لحظه‌ای</div>
            <div id="statusSummary">
                <div class="loading" style="padding:20px;">
                    <div class="spinner" style="width:30px;height:30px;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 20px; color: #4a5a6a; font-size: 0.85rem; border-top: 1px solid #0d1624; margin-top: 30px;">
        <p>🚀 سیستم تشخیص الگوهای بازاری با XGBoost &nbsp;|&nbsp; نسخه ۴.۰</p>
    </footer>

    <script src="/static/js/script.js"></script>
    <script>
        function loadStatusSummary() {
            const container = document.getElementById('statusSummary');
            fetch('/health')
                .then(res => res.json())
                .then(data => {
                    const components = data.components || {};
                    const credits = components.credits || { remaining: 0 };
                    const memory = components.memory || { used_mb: 0, total_mb: 512 };
                    const statusClass = data.status === 'ok' ? 'green' : data.status === 'degraded' ? 'yellow' : 'red';
                    const statusText = data.status === 'ok' ? '✅ سالم' : data.status === 'degraded' ? '⚠️ محدود' : '❌ مشکل';
                    container.innerHTML = `
                        <div class="status-grid">
                            <div class="status-item">
                                <div class="value ${statusClass}">${statusText}</div>
                                <div class="label">وضعیت کلی</div>
                            </div>
                            <div class="status-item">
                                <div class="value">${memory.used_mb || 0} MB</div>
                                <div class="label">حافظه مصرفی</div>
                            </div>
                            <div class="status-item">
                                <div class="value">${numberWithCommas(credits.remaining || 0)}</div>
                                <div class="label">اعتبار باقیمانده</div>
                            </div>
                            <div class="status-item">
                                <div class="value" id="uptimeSummary">۰ ثانیه</div>
                                <div class="label">آپتایم</div>
                            </div>
                        </div>
                    `;
                })
                .catch(() => {
                    container.innerHTML = '<p style="color:#ff4444;text-align:center;">❌ خطا در دریافت وضعیت</p>';
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof fetchAndStartUptime === 'function') {
                fetchAndStartUptime();
            }
            loadStatusSummary();
            setInterval(loadStatusSummary, 30000);
        });
    </script>
</body>
</html>
