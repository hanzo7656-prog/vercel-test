<!-- ============================================================
     HEADER + MENU
     ============================================================ -->
<header class="dashboard-header">
    <a href="/dashboard" class="logo">📊 سیستم تشخیص الگو</a>
    <div style="display:flex;align-items:center;gap:16px;">
        <div class="status">
            <span class="dot"></span>
            <span id="statusText">آنلاین</span>
        </div>
        <span class="uptime">⏱️ <span id="uptimeDisplay">۰ ثانیه</span></span>
        <span id="userDisplay" style="color:#00d4ff;font-size:0.85rem;"></span>
        <button class="menu-toggle" id="menuToggle" aria-label="منو">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<div class="flyout-overlay" id="flyoutOverlay"></div>

<nav class="flyout-menu" id="flyoutMenu">
    <div class="menu-label">🔹 منوی اصلی</div>
    <a href="/dashboard"><i class="fas fa-chart-pie"></i> داشبورد</a>
    <a href="/chart-page"><i class="fas fa-chart-line"></i> نمودار</a>
    <a href="/predict-page"><i class="fas fa-bullseye"></i> مدل</a>
    <a href="/test-api-page"><i class="fas fa-plug"></i> تست API</a>
    <div class="menu-divider"></div>
    <a href="/health-page"><i class="fas fa-heartbeat"></i> سلامت</a>
    <a href="/database-page"><i class="fas fa-database"></i> دیتابیس</a>
    <a href="/settings-page"><i class="fas fa-sliders-h"></i> تنظیمات</a>
    <div class="menu-divider"></div>
    <a href="#" id="logoutMenuBtn" style="color:#ff4444;">
        <i class="fas fa-sign-out-alt"></i> خروج
    </a>
</nav>

<script>
    // ============================================================
    // تابع خروج از منو (اصلاح شده - مشکل ۳)
    // ============================================================
    function logoutFromMenu() {
        console.log('🚪 logoutFromMenu called'); // دیباگ
        
        if (!confirm('آیا از خروج از حساب کاربری اطمینان دارید؟')) {
            console.log('❌ User cancelled logout');
            return;
        }
        
        console.log('✅ User confirmed logout, sending request...');
        
        fetch('/logout', { 
            method: 'POST',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(res => {
            console.log('📡 Response status:', res.status);
            return res.json();
        })
        .then(data => {
            console.log('📡 Response data:', data);
            window.location.href = '/login';
        })
        .catch(err => {
            console.error('❌ Logout error:', err);
            window.location.href = '/login';
        });
    }

    // ============================================================
    // اتصال دکمه خروج به تابع (مشکل ۳)
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        const logoutBtn = document.getElementById('logoutMenuBtn');
        if (logoutBtn) {
            console.log('✅ Logout button found, attaching event listener');
            logoutBtn.onclick = function(e) {
                e.preventDefault();
                logoutFromMenu();
            };
        } else {
            console.warn('⚠️ Logout button not found!');
        }
        
        loadUserInfo();
    });

    // ============================================================
    // نمایش نام کاربری
    // ============================================================
    function loadUserInfo() {
        fetch('/api/user', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const display = document.getElementById('userDisplay');
                    if (display) {
                        const roleMap = {
                            'admin': '👑 ادمین',
                            'vip': '⭐ VIP',
                            'guest': '👤 مهمان'
                        };
                        display.textContent = roleMap[data.data.role] || data.data.username;
                    }
                }
            })
            .catch(() => {});
    }
</script>
