<!-- static/nav.html -->
<!-- ============================================================
     NAV - منوی اصلی (نسخه ۳.۰ - بروزرسانی شده برای معماری جدید)
     ============================================================ -->
<header class="dashboard-header">
    <a href="/dashboard" class="logo">
        <i class="fas fa-cubes"></i>
        <span>سیستم تحلیلگر</span>
        <span class="version-badge">v9.0</span>
    </a>
    <div class="header-actions">
        <!-- وضعیت سیستم -->
        <div class="status-badge" id="statusBadge">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">پایدار</span>
        </div>
        
        <!-- آپتایم -->
        <span class="uptime-display" id="uptimeDisplay">
            <i class="fas fa-clock"></i>
            <span id="uptimeText">۰ ثانیه</span>
        </span>
        
        <!-- کاربر -->
        <span class="user-display" id="userDisplay">
            <i class="fas fa-user-circle"></i>
            <span id="userName">مهمان</span>
        </span>
        
        <!-- دکمه منو -->
        <button class="menu-toggle" id="menuToggle" aria-label="منو">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<!-- Overlay برای بستن منو -->
<div class="flyout-overlay" id="flyoutOverlay"></div>

<!-- منوی کشویی -->
<nav class="flyout-menu" id="flyoutMenu">
    <div class="menu-header">
        <span class="menu-label">📊 منوی اصلی</span>
    </div>
    
    <a href="/dashboard" class="menu-item" data-page="dashboard">
        <i class="fas fa-chart-pie"></i>
        <span>داشبورد</span>
        <span class="menu-shortcut">⌘1</span>
    </a>
    
    <a href="/chart-page" class="menu-item" data-page="chart">
        <i class="fas fa-chart-line"></i>
        <span>نمودار</span>
        <span class="menu-shortcut">⌘2</span>
    </a>
    
    <a href="/predict-page" class="menu-item" data-page="predict">
        <i class="fas fa-robot"></i>
        <span>تحلیلگر</span>
        <span class="menu-shortcut">⌘3</span>
    </a>
    
    <a href="/database-page" class="menu-item" data-page="database">
        <i class="fas fa-database"></i>
        <span>دیتابیس</span>
        <span class="menu-shortcut">⌘4</span>
    </a>
    
    <div class="menu-divider"></div>
    
    <a href="/test-api-page" class="menu-item" data-page="test-api">
        <i class="fas fa-plug"></i>
        <span>تست API</span>
    </a>
    
    <a href="/settings-page" class="menu-item" data-page="settings">
        <i class="fas fa-sliders-h"></i>
        <span>تنظیمات</span>
    </a>
    
    <div class="menu-divider"></div>
    
    <a href="/debug-page" class="menu-item debug-link" data-page="debug">
        <i class="fas fa-bug"></i>
        <span>دیباگ</span>
        <span class="menu-badge">ADMIN</span>
    </a>
    
    <div class="menu-footer">
        <button class="menu-logout" onclick="logoutUser()">
            <i class="fas fa-sign-out-alt"></i>
            خروج
        </button>
        <span class="menu-version">v9.0.0</span>
    </div>
</nav>

<style>
/* ============================================================
   NAV - استایل‌های جدید
   ============================================================ */

    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 24px;
    background: rgba(10, 14, 23, 0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0, 212, 255, 0.08);
    position: sticky;
    top: 0;
    z-index: 100;
    min-height: 60px;
}

.dashboard-header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #00d4ff;
    text-decoration: none;
}

.dashboard-header .logo i {
    font-size: 1.3rem;
}

.dashboard-header .logo .version-badge {
    font-size: 0.5rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(0, 212, 255, 0.1);
    color: #00d4ff;
    border: 1px solid rgba(0, 212, 255, 0.15);
}

.header-actions {

    align-items: center;
    gap: 16px;
}

.status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    color: #7a8fa3;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    animation: pulse-dot 2s infinite;
}

.status-dot.warning {
    background: #ff8800;
}

.status-dot.error {
    background: #ff4444;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
}

.uptime-display {
    font-size: 0.65rem;
    color: #4a5a6a;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    gap: 4px;
}

.user-display {
    font-size: 0.75rem;
    color: #00d4ff;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
}

.menu-toggle {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(0, 212, 255, 0.04);
    border: 1px solid rgba(0, 212, 255, 0.08);
    color: #e0e6ed;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
}

.menu-toggle:hover {
    background: rgba(0, 212, 255, 0.08);
    border-color: #00d4ff;
}

.menu-toggle.open {
    border-color: #00d4ff;
    background: #00d4ff;
    color: #0a0e17;
}

/* ===== Flyout Menu ===== */
.flyout-menu {
    position: fixed;
    top: 68px;
    right: 16px;
    background: rgba(8, 12, 24, 0.96);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(0, 212, 255, 0.08);
    border-radius: 16px;
    padding: 8px 0;
    min-width: 220px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    transform: scale(0.9) translateY(-10px);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 150;
    transform-origin: top right;
}

.flyout-menu.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: all;
}

.flyout-menu .menu-header {
    padding: 8px 18px 6px;
    border-bottom: 1px solid rgba(0, 212, 255, 0.04);
}

.flyout-menu .menu-label {
    font-size: 0.6rem;
    color: #4a5a6a;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.flyout-menu .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    color: #7a8fa8;
    text-decoration: none;
    font-size: 0.85rem;
    transition: all 0.2s ease;
    border-right: 2px solid transparent;
    position: relative;
}

.flyout-menu .menu-item:hover {
    background: rgba(0, 212, 255, 0.04);
    color: #e8eef7;
    border-right-color: #00d4ff;
}

.flyout-menu .menu-item.active {
    color: #00d4ff;
    border-right-color: #00d4ff;
    background: rgba(0, 212, 255, 0.06);
}

.flyout-menu .menu-item i {
    width: 20px;
    text-align: center;
    font-size: 0.9rem;
}

.flyout-menu .menu-shortcut {
    margin-right: auto;
    font-size: 0.55rem;
    color: #4a5a6a;
    opacity: 0.4;
}

.flyout-menu .menu-badge {
    margin-right: auto;
    font-size: 0.5rem;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255, 68, 68, 0.15);
    color: #ff4444;
    border: 1px solid rgba(255, 68, 68, 0.15);
}

.flyout-menu .menu-divider {
    height: 1px;
    background: rgba(0, 212, 255, 0.04);
    margin: 6px 16px;
}

.flyout-menu .debug-link {
    color: #ff6b00;
}

.flyout-menu .debug-link:hover {
    color: #ff8800;
    border-right-color: #ff6b00;
}

.flyout-menu .menu-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 18px;
    border-top: 1px solid rgba(0, 212, 255, 0.04);
    margin-top: 4px;
}

.menu-logout {
    background: transparent;
    border: none;
    color: #4a5a6a;
    font-size: 0.7rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.3s ease;
    font-family: inherit;
}

.menu-logout:hover {
    color: #ff4444;
}

.menu-version {
    font-size: 0.55rem;
    color: #4a5a6a;
    opacity: 0.4;
}

/* ===== Overlay ===== */
.flyout-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
    z-index: 140;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.flyout-overlay.open {
    opacity: 1;
    pointer-events: all;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
    .dashboard-header {
        padding: 8px 14px;
        min-height: 50px;
    }
    .dashboard-header .logo {
        font-size: 0.9rem;
    }
    .dashboard-header .logo .version-badge {
        display: none;
    }
    .uptime-display {
        display: none;
    }
    .user-display {
        font-size: 0.65rem;
    }
    .user-display span {
        display: none;
    }
    .status-badge .status-text {
        display: none;
    }
    .flyout-menu {
        right: 10px;
        top: 58px;
        min-width: 180px;
    }
    .flyout-menu .menu-item {
        font-size: 0.8rem;
        padding: 8px 14px;
    }
    .flyout-menu .menu-shortcut {
        display: none;
    }
    .flyout-menu .menu-footer {
        flex-direction: column;
        gap: 4px;
        align-items: stretch;
        text-align: center;
    }
}

@media (max-width: 480px) {
    .dashboard-header .logo {
        font-size: 0.8rem;
    }
    .dashboard-header .logo i {
        font-size: 1rem;
    }
    .menu-toggle {
        width: 34px;
        height: 34px;
        font-size: 0.85rem;
    }
    .flyout-menu {
        right: 8px;
        top: 52px;
        min-width: 160px;
        border-radius: 12px;
    }
    .flyout-menu .menu-item {
        font-size: 0.75rem;
        padding: 8px 12px;
        gap: 8px;
    }
    .flyout-menu .menu-item i {
        width: 16px;
        font-size: 0.8rem;
    }
}
</style>

<script>
// ============================================================
// مدیریت منو
// ============================================================
(function() {
    'use strict';

    // ============================================================
    // ۱. منوی همبرگری
    // ============================================================
    function initMenu() {
        const menuToggle = document.getElementById('menuToggle');
        const flyoutMenu = document.getElementById('flyoutMenu');
        const flyoutOverlay = document.getElementById('flyoutOverlay');

        if (!menuToggle || !flyoutMenu || !flyoutOverlay) {
            console.warn('⚠️ Menu elements not found');
            return;
        }

        // باز/بستن منو
        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpen = flyoutMenu.classList.toggle('open');
            flyoutOverlay.classList.toggle('open');
            menuToggle.innerHTML = isOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
            menuToggle.classList.toggle('open', isOpen);
        });

        // بستن با کلیک روی overlay
        flyoutOverlay.addEventListener('click', function() {
            closeMenu();
        });

        // بستن با کلیک روی لینک‌ها
        flyoutMenu.querySelectorAll('.menu-item').forEach(function(link) {
            link.addEventListener('click', function() {
                closeMenu();
                // علامت‌گذاری آیتم فعال
                flyoutMenu.querySelectorAll('.menu-item').forEach(function(el) {
                    el.classList.remove('active');
                });
                this.classList.add('active');
            });
        });

        // بستن با کلید ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && flyoutMenu.classList.contains('open')) {
                closeMenu();
            }
        });

        // بستن با کلیک خارج
        document.addEventListener('click', function(e) {
            if (flyoutMenu.classList.contains('open')) {
                if (!flyoutMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                    closeMenu();
                }
            }
        });

        // علامت‌گذاری صفحه فعلی
        const currentPath = window.location.pathname;
        flyoutMenu.querySelectorAll('.menu-item').forEach(function(item) {
            const href = item.getAttribute('href');
            if (href && currentPath.startsWith(href) && href !== '/') {
                item.classList.add('active');
            } else if (href === '/' && currentPath === '/') {
                item.classList.add('active');
            }
        });
    }

    function closeMenu() {
        const flyoutMenu = document.getElementById('flyoutMenu');
        const flyoutOverlay = document.getElementById('flyoutOverlay');
        const menuToggle = document.getElementById('menuToggle');
        
        if (flyoutMenu) flyoutMenu.classList.remove('open');
        if (flyoutOverlay) flyoutOverlay.classList.remove('open');
        if (menuToggle) {
            menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
            menuToggle.classList.remove('open');
        }
    }

    // ============================================================
    // ۲. آپتایم
    // ============================================================
    let uptimeStartTime = null;
    let uptimeInterval = null;

    function fetchAndStartUptime() {
        fetch('/stats', { credentials: 'include' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.uptime) {
                    startUptime(data.uptime);
                }
            })
            .catch(function() {});
    }

    function startUptime(uptimeStr) {
        if (!uptimeStr) return;
        
        let totalSeconds = 0;
        const parts = uptimeStr.match(/(\d+)\s*(h|m|s)/g);
        if (parts) {
            parts.forEach(function(part) {
                const num = parseInt(part);
                const unit = part.slice(-1);
                if (unit === 'h') totalSeconds += num * 3600;
                else if (unit === 'm') totalSeconds += num * 60;
                else if (unit === 's') totalSeconds += num;
            });
        } else {
            const parts2 = uptimeStr.split(':').map(Number);
            if (parts2.length === 3) totalSeconds = parts2[0] * 3600 + parts2[1] * 60 + parts2[2];
            else if (parts2.length === 2) totalSeconds = parts2[0] * 60 + parts2[1];
            else totalSeconds = parts2[0] || 0;
        }

        uptimeStartTime = Date.now() - (totalSeconds * 1000);
        updateUptimeDisplay();
        
        if (uptimeInterval) clearInterval(uptimeInterval);
        uptimeInterval = setInterval(updateUptimeDisplay, 1000);
    }

    function updateUptimeDisplay() {
        const el = document.getElementById('uptimeText');
        if (!el || !uptimeStartTime) return;
        
        const elapsed = Math.floor((Date.now() - uptimeStartTime) / 1000);
        el.textContent = formatDuration(elapsed);
    }

    function formatDuration(seconds) {
        if (seconds < 60) return seconds + 's';
        
        const days = Math.floor(seconds / 86400);
        seconds -= days * 86400;
        const hours = Math.floor(seconds / 3600);
        seconds -= hours * 3600;
        const minutes = Math.floor(seconds / 60);
        seconds -= minutes * 60;
        
        let parts = [];
        if (days > 0) parts.push(days + 'd');
        if (hours > 0 || days > 0) parts.push(hours + 'h');
        if (minutes > 0 || hours > 0 || days > 0) parts.push(minutes + 'm');
        parts.push(seconds + 's');
        
        return parts.join(' ');
    }

    // ============================================================
    // ۳. وضعیت آنلاین/آفلاین
    // ============================================================
    function updateStatusDot() {
        fetch('/api/metrics', { credentials: 'include' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    const metrics = data.data.metrics || {};
                    const api = metrics.api_status?.value || 'unknown';
                    const dot = document.getElementById('statusDot');
                    const text = document.getElementById('statusText');
                    
                    if (dot && text) {
                        dot.className = 'status-dot';
                        if (api === 'ok') {
                            dot.classList.remove('warning', 'error');
                            text.textContent = 'پایدار';
                        } else if (api === 'degraded') {
                            dot.classList.add('warning');
                            text.textContent = 'ضعیف';
                        } else {
                            dot.classList.add('error');
                            text.textContent = 'قطع';
                        }
                    }
                }
            })
            .catch(function() {});
    }

    // ============================================================
    // ۴. نمایش کاربر
    // ============================================================
    function loadUserDisplay() {
        fetch('/api/user', { credentials: 'include' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    const display = document.getElementById('userName');
                    if (display) {
                        const roleMap = { 
                            'admin': '👑 ادمین', 
                            'vip': '⭐ VIP', 
                            'guest': '👤 مهمان' 
                        };
                        display.textContent = roleMap[data.data.role] || data.data.username;
                    }
                }
            })
            .catch(function() {});
    }

    // ============================================================
    // ۵. خروج
    // ============================================================
    window.logoutUser = function() {
        if (!confirm('آیا از خروج از حساب کاربری اطمینان دارید؟')) return;
        fetch('/logout', { method: 'POST', credentials: 'include' })
            .then(function() { window.location.href = '/login'; })
            .catch(function() { window.location.href = '/login'; });
    };

    // ============================================================
    // ۶. اجرا
    // ============================================================
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            initMenu();
            loadUserDisplay();
            updateStatusDot();
            setInterval(updateStatusDot, 10000);
            fetchAndStartUptime();
        });
    } else {
        initMenu();
        loadUserDisplay();
        updateStatusDot();
        setInterval(updateStatusDot, 10000);
        fetchAndStartUptime();
    }

    // صادر کردن توابع
    window.initMenu = initMenu;
    window.fetchAndStartUptime = fetchAndStartUptime;
    window.updateStatusDot = updateStatusDot;
    window.loadUserDisplay = loadUserDisplay;

})();
</script>
