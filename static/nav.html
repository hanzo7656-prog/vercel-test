<!-- static/nav.html -->
<header class="dashboard-header">
    <a href="/dashboard" class="logo">📊 سیستم تشخیص الگو</a>
    <div style="display:flex;align-items:center;gap:16px;">
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">آنلاین</span>
        </div>
        <span class="uptime">⏱️ <span id="uptimeDisplay">۰ ثانیه</span></span>
        <span id="userDisplay" style="color:#00d4ff;font-size:0.85rem;"></span>
        <button class="menu-toggle" id="menuToggle" aria-label="منو">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<div class="flyout-overlay" id="flyoutOverlay"></div>

<nav class="flyout-menu" id="flyoutMenu">
    <div class="menu-label">🔹 منوی اصلی</div>
    <a href="/dashboard"><i class="fas fa-chart-pie"></i> داشبورد</a>
    <a href="/chart"><i class="fas fa-chart-line"></i> نمودار</a>
    <a href="/predict"><i class="fas fa-bullseye"></i> تحلیلگر</a>
    <a href="/database"><i class="fas fa-database"></i> دیتابیس</a>
    <div class="menu-divider"></div>
    <a href="/test-api"><i class="fas fa-plug"></i> تست API</a>
    <a href="/settings"><i class="fas fa-sliders-h"></i> تنظیمات</a>
    <div class="menu-divider"></div>
    <a href="/debug" style="color:#ff6b00;"><i class="fas fa-bug"></i> دیباگ</a>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const menuToggle = document.getElementById('menuToggle');
    const flyoutMenu = document.getElementById('flyoutMenu');
    const flyoutOverlay = document.getElementById('flyoutOverlay');

    if (menuToggle && flyoutMenu && flyoutOverlay) {
        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            const open = flyoutMenu.classList.toggle('open');
            flyoutOverlay.classList.toggle('open');
            menuToggle.innerHTML = open ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
        });

        flyoutOverlay.addEventListener('click', function() {
            flyoutMenu.classList.remove('open');
            flyoutOverlay.classList.remove('open');
            menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
        });

        flyoutMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function() {
                flyoutMenu.classList.remove('open');
                flyoutOverlay.classList.remove('open');
                menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
            });
        });
    }

    fetch('/api/user', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                const display = document.getElementById('userDisplay');
                if (display) {
                    const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                    display.textContent = roleMap[data.data.role] || data.data.username;
                }
            }
        })
        .catch(() => {});

    function updateStatusDot() {
        fetch('/api/metrics')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const metrics = data.data.metrics || {};
                    const api = metrics.api_status?.value || 'unknown';
                    const dot = document.getElementById('statusDot');
                    const text = document.getElementById('statusText');
                    if (dot && text) {
                        if (api === 'ok') { dot.style.background = '#00ff88'; text.textContent = 'پایدار'; }
                        else if (api === 'degraded') { dot.style.background = '#ff8800'; text.textContent = 'ضعیف'; }
                        else { dot.style.background = '#ff4444'; text.textContent = 'قطع'; }
                    }
                }
            })
            .catch(() => {});
    }
    updateStatusDot();
    setInterval(updateStatusDot, 10000);
});
</script>
