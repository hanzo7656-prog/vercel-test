<!-- ============================================================
     HEADER + MENU
     ============================================================ -->
<header class="dashboard-header">
    <a href="/dashboard" class="logo">📊 سیستم تشخیص الگو</a>
    <div style="display:flex;align-items:center;gap:16px;">
        <div class="status">
            <span class="dot"></span>
            <span id="statusText">آنلاین</span>
        </div>
        <span class="uptime">⏱️ <span id="uptimeDisplay">۰ ثانیه</span></span>
        <span id="userDisplay" style="color:#00d4ff;font-size:0.85rem;"></span>
        <button class="menu-toggle" id="menuToggle" aria-label="منو">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<div class="flyout-overlay" id="flyoutOverlay"></div>

<nav class="flyout-menu" id="flyoutMenu">
    <div class="menu-label">🔹 منوی اصلی</div>
    <a href="/dashboard"><i class="fas fa-chart-pie"></i> داشبورد</a>
    <a href="/chart-page"><i class="fas fa-chart-line"></i> نمودار</a>
    <a href="/predict-page"><i class="fas fa-bullseye"></i> مدل</a>
    <a href="/test-api-page"><i class="fas fa-plug"></i> تست API</a>
    <div class="menu-divider"></div>
    <a href="/health-page"><i class="fas fa-heartbeat"></i> سلامت</a>
    <a href="/database-page"><i class="fas fa-database"></i> دیتابیس</a>
    <a href="/settings-page"><i class="fas fa-sliders-h"></i> تنظیمات</a>
    <div class="menu-divider"></div>
    <a href="#" id="logoutMenuBtn" style="color:#ff4444;">
        <i class="fas fa-sign-out-alt"></i> خروج
    </a>
</nav>

<script>
    // ============================================================
    // نمایش نام کاربری
    // ============================================================
    function loadUserInfo() {
        fetch('/api/user', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const display = document.getElementById('userDisplay');
                    if (display) {
                        const roleMap = {
                            'admin': '👑 ادمین',
                            'vip': '⭐ VIP',
                            'guest': '👤 مهمان'
                        };
                        display.textContent = roleMap[data.data.role] || data.data.username;
                    }
                }
            })
            .catch(() => {});
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadUserInfo();
        
        // اگه menu.js لود نشد، اینجا یه fallback برای خروج بذار
        const logoutBtn = document.getElementById('logoutMenuBtn');
        if (logoutBtn && !window._menuInitialized) {
            console.log('⚠️ menu.js not loaded, using fallback logout');
            logoutBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (!confirm('آیا از خروج از حساب کاربری اطمینان دارید؟')) return;
                fetch('/logout', { method: 'POST', credentials: 'include' })
                    .then(() => window.location.href = '/login')
                    .catch(() => window.location.href = '/login');
            });
        }
    });
</script>
