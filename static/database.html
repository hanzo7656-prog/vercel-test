<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>مدیریت دیتابیس</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/themes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #0a0e17;
            min-height: 100vh;
            font-family: 'Vazir', 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dashboard-header .logo {
            font-size: 1rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
        }

        #userDisplay {
            color: #00d4ff;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .menu-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #0d1624;
            border: 1px solid #1a2a3a;
            color: #e0e6ed;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 200;
        }

        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0, 212, 255, 0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        /* ===== FLYOUT MENU ===== */
        .flyout-menu {
            position: fixed;
            top: 70px;
            right: 12px;
            background: rgba(13, 22, 36, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 10px 0;
            min-width: 170px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150;
            transform-origin: top right;
        }

        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #a0b4c8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border-right: 2px solid transparent;
        }

        .flyout-menu a:hover { background: rgba(0, 212, 255, 0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0, 212, 255, 0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 16px 4px; font-size: 0.65rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }

        .flyout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        /* ============================================================
           DATABASE PAGE
           ============================================================ */
        .db-page {
            display: flex;
            min-height: calc(100vh - 70px);
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 20px;
            gap: 20px;
        }

        /* ===== CONTENT ===== */
        .db-content {
            flex: 1;
            min-width: 0;
        }

        .db-content .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .db-content .page-header h1 {
            color: #e0e6ed;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .db-content .page-header h1 i {
            color: #00d4ff;
        }

        .db-content .page-header .timestamp {
            color: #4a5a6a;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
        }

        .db-content .refresh-btn {
            background: transparent;
            border: 1px solid #1a2a3a;
            color: #7a8fa3;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .db-content .refresh-btn:hover {
            border-color: #00d4ff;
            color: #e0e6ed;
        }

        /* ============================================================
           CARDS
           ============================================================ */
        .db-card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .db-card:hover { border-color: rgba(0, 212, 255, 0.15); }

        .db-card .db-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .db-card .db-header .db-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .db-card .db-header .db-info .db-icon { font-size: 1.2rem; width: 28px; text-align: center; }
        .db-card .db-header .db-info .db-name { color: #e0e6ed; font-weight: 600; font-size: 0.95rem; }
        .db-card .db-header .db-info .db-description { color: #7a8fa3; font-size: 0.7rem; }

        .db-card .db-header .db-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .db-card .db-header .db-status.online { color: #00ff88; background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.2); }
        .db-card .db-header .db-status.offline { color: #ff4444; background: rgba(255, 68, 68, 0.1); border: 1px solid rgba(255, 68, 68, 0.2); }

        .db-card .db-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
        .db-card .db-body .db-field { display: flex; flex-direction: column; gap: 2px; }
        .db-card .db-body .db-field label { color: #7a8fa3; font-size: 0.6rem; font-weight: 500; }
        .db-card .db-body .db-field .db-value { color: #e0e6ed; font-size: 0.75rem; font-family: 'Courier New', monospace; background: #0a0e17; padding: 4px 8px; border-radius: 6px; border: 1px solid #1a2a3a; word-break: break-all; }

        .db-card .db-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #0d1624;
        }

        .db-card .db-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #4a5a6a;
            font-size: 0.6rem;
        }

        .db-card .db-stats .stat-item i { color: #7a8fa3; font-size: 0.55rem; }
        .db-card .db-stats .stat-item .stat-value { color: #e0e6ed; font-weight: 500; }

        /* ===== SEARCH ===== */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box input {
            flex: 1;
            padding: 6px 10px;
            background: #0a0e17;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.75rem;
            min-width: 120px;
            font-family: inherit;
        }

        .search-box input:focus { outline: none; border-color: #00d4ff; }
        .search-box select {
            padding: 6px 10px;
            background: #0a0e17;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.75rem;
            font-family: inherit;
        }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table { width: 100%; border-collapse: collapse; font-size: 0.65rem; min-width: 350px; }
        .table th { text-align: right; padding: 6px 8px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 6px 8px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0, 212, 255, 0.02); }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 12px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #1a2a3a;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 0.55rem;
            font-weight: 500;
        }

        .badge.success { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .badge.error { background: rgba(255, 68, 68, 0.1); color: #ff4444; }
        .badge.warning { background: rgba(255, 170, 0, 0.1); color: #ffaa00; }
        .badge.info { background: rgba(0, 212, 255, 0.1); color: #00d4ff; }

        .toast-container {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 8px 16px;
            background: #1a2a3a;
            color: #e0e6ed;
            border-radius: 8px;
            border: 2px solid #00d4ff;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            font-size: 0.8rem;
            transition: all 0.3s ease;
            width: 100%;
            pointer-events: all;
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .toast.success { border-color: #00ff88; }
        .toast.error { border-color: #ff4444; }

        /* ===== SIDEBAR STYLES ===== */
        .db-sidebar {
            width: 220px;
            background: #0d1624;
            border-left: 1px solid #1a2a3a;
            padding: 12px 0;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow-y: auto;
            position: sticky;
            top: 70px;
            height: calc(100vh - 70px);
            z-index: 50;
        }

        .db-sidebar::-webkit-scrollbar { width: 3px; }
        .db-sidebar::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 2px; }

        .db-sidebar .sidebar-brand {
            padding: 12px 16px 16px;
            border-bottom: 1px solid #1a2a3a;
            margin-bottom: 8px;
        }

        .db-sidebar .sidebar-brand h2 {
            color: #e0e6ed;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .db-sidebar .sidebar-brand h2 i { color: #00d4ff; }
        .db-sidebar .sidebar-brand .sub { color: #4a5a6a; font-size: 0.6rem; }

        .db-sidebar .sidebar-section { padding: 4px 8px; }
        .db-sidebar .sidebar-label {
            color: #4a5a6a;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 12px 4px;
        }

        .db-sidebar .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 8px;
            color: #7a8fa3;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
            text-decoration: none;
            width: 100%;
            background: transparent;
            border: none;
            font-family: inherit;
        }

        .db-sidebar .sidebar-item:hover { background: rgba(0, 212, 255, 0.05); color: #e0e6ed; }
        .db-sidebar .sidebar-item.active {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border-right: 2px solid #00d4ff;
        }

        .db-sidebar .sidebar-item i { width: 20px; text-align: center; font-size: 0.9rem; }
        .db-sidebar .sidebar-divider { height: 1px; background: #1a2a3a; margin: 6px 12px; }

        .db-sidebar .sidebar-item .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: auto;
        }

        .db-sidebar .sidebar-item .badge-dot.online { background: #00ff88; }
        .db-sidebar .sidebar-item .badge-dot.offline { background: #ff4444; }
        .db-sidebar .sidebar-item .badge-dot.warning { background: #ffaa00; }

        /* ===== SIDEBAR TOGGLE (موبایل) ===== */
        .sidebar-toggle-btn {
            display: none;
            background: transparent;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #7a8fa3;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .sidebar-toggle-btn:hover { border-color: #00d4ff; color: #e0e6ed; }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 45;
            top: 70px;
        }

        .sidebar-overlay.open { display: block; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .db-page { flex-direction: column; padding: 12px; gap: 12px; }
            .db-content .page-header h1 { font-size: 1rem; }
            .db-card { padding: 12px; }
            .db-card .db-body { grid-template-columns: 1fr; }
            .search-box { flex-direction: column; }
            .search-box input { width: 100%; }
            .search-box select { width: 100%; }
            .dashboard-header .uptime { display: none; }
            
            .db-sidebar {
                position: fixed;
                top: 70px;
                right: -100%;
                width: 260px;
                height: calc(100vh - 70px);
                border-radius: 0 0 16px 16px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
                transition: right 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
                z-index: 60;
            }

            .db-sidebar.open { right: 0; }
            .sidebar-toggle-btn { display: inline-flex; }
            .sidebar-overlay.open { display: block; }
        }

        @media (min-width: 769px) {
            .db-page { padding: 20px 24px; gap: 24px; }
            .db-content .page-header h1 { font-size: 1.4rem; }
            .db-card { padding: 20px 24px; }
            .db-card .db-body { grid-template-columns: 1fr 1fr; gap: 12px 24px; }
            .db-card .db-header .db-info .db-name { font-size: 1rem; }
            .sidebar-overlay { display: none !important; }
            .sidebar-toggle-btn { display: none !important; }
        }

        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 34px; height: 34px; font-size: 0.85rem; }
            .flyout-menu { right: 8px; top: 60px; min-width: 150px; }
            .flyout-menu a { font-size: 0.8rem; padding: 8px 14px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .db-sidebar { height: calc(100vh - 70px); }
            .db-card { padding: 8px 12px; margin-bottom: 6px; }
            .db-card .db-body { grid-template-columns: 1fr 1fr; gap: 4px 12px; }
            .db-card .db-body .db-field .db-value { font-size: 0.65rem; padding: 2px 6px; }
        }
    </style>
</head>
<body>

    <!-- ===== NAV (بارگذاری از فایل) ===== -->
    <div id="navContainer"></div>

    <!-- ===== DATABASE PAGE ===== -->
    <div class="db-page">

        <!-- ===== SIDEBAR (بارگذاری از فایل) ===== -->
        <div id="sidebarContainer"></div>

        <!-- ===== CONTENT ===== -->
        <main class="db-content" id="dbContent">
            <div class="page-header">
                <h1 id="pageTitle"><i class="fas fa-chart-pie"></i> نمای کلی</h1>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="timestamp" id="pageTimestamp"></span>
                    <button class="refresh-btn" onclick="refreshAll()" title="بروزرسانی همه">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div id="tabContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            </div>
        </main>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script src="/static/js/settings-theme.js"></script>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        let currentTab = 'overview';
        let sidebarOpen = false;

        // ============================================================
        // بارگذاری منو
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => {
                    if (!res.ok) throw new Error('nav.html یافت نشد');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    loadUserInfo();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                })
                .catch(err => {
                    console.error('❌ خطا در بارگذاری منو:', err);
                    container.innerHTML = `
                        <header class="dashboard-header">
                            <a href="/dashboard" class="logo">📊 سیستم تشخیص الگو</a>
                            <div style="display:flex;align-items:center;gap:16px;">
                                <div class="status">
                                    <span class="dot"></span>
                                    <span>آنلاین</span>
                                </div>
                                <span class="uptime">⏱️ <span id="uptimeDisplay">۰ ثانیه</span></span>
                                <button class="menu-toggle" onclick="window.location.href='/dashboard'">☰</button>
                            </div>
                        </header>
                    `;
                });
        }

        // ============================================================
        // بارگذاری سایدبار
        // ============================================================
        function loadSidebar() {
            const container = document.getElementById('sidebarContainer');
            if (!container) return;
            fetch('/static/sidebar.html')
                .then(res => {
                    if (!res.ok) throw new Error('sidebar.html یافت نشد');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    // اجرای اسکریپت‌های داخل سایدبار
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        if (oldScript.src) newScript.src = oldScript.src;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                    // تنظیم تب فعال
                    document.querySelectorAll('.sidebar-item').forEach(item => {
                        item.classList.toggle('active', item.dataset.tab === currentTab);
                    });
                })
                .catch(err => {
                    console.error('❌ خطا در بارگذاری سایدبار:', err);
                    container.innerHTML = `
                        <div style="padding:16px;color:#7a8fa3;text-align:center;font-size:0.8rem;">
                            ⚠️ سایدبار در دسترس نیست
                        </div>
                    `;
                });
        }

        // ============================================================
        // نمایش نام کاربری
        // ============================================================
        function loadUserInfo() {
            fetch('/api/user', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const display = document.getElementById('userDisplay');
                        if (display) {
                            const roleMap = {
                                'admin': '👑 ادمین',
                                'vip': '⭐ VIP',
                                'guest': '👤 مهمان'
                            };
                            display.textContent = roleMap[data.data.role] || data.data.username;
                        }
                    }
                })
                .catch(() => {});
        }

        // ============================================================
        // مدیریت سایدبار (برای موبایل)
        // ============================================================
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('dbSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('open', sidebarOpen);
            if (overlay) overlay.classList.toggle('open', sidebarOpen);
        }

        // ============================================================
        // آپدیت تاریخ و ساعت
        // ============================================================
        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) {
                el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
            }
        }

        // ============================================================
        // تغییر تب
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            const container = document.getElementById('tabContainer');
            const title = document.getElementById('pageTitle');

            // بروزرسانی سایدبار
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.toggle('active', item.dataset.tab === tab);
            });

            // بروزرسانی عنوان
            const titles = {
                'overview': '<i class="fas fa-chart-pie"></i> نمای کلی',
                'explorer': '<i class="fas fa-search"></i> کاوشگر',
                'monitor': '<i class="fas fa-chart-line"></i> مانیتورینگ',
                'postgresql': '<i class="fas fa-database" style="color:#3366ff;"></i> PostgreSQL',
                'redis': '<i class="fas fa-bolt" style="color:#ff4444;"></i> Redis',
                'sqlite': '<i class="fas fa-file" style="color:#00ff88;"></i> SQLite'
            };
            title.innerHTML = titles[tab] || tab;

            // بارگذاری محتوا
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            `;

            fetch(`/static/db-parts/${tab}.html`)
                .then(res => {
                    if (!res.ok) throw new Error('تاب یافت نشد');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    // اجرای اسکریپت‌های داخل تب
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        if (oldScript.src) newScript.src = oldScript.src;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                    // اجرای تابع init مخصوص تب
                    const initFn = window['init_' + tab];
                    if (typeof initFn === 'function') {
                        initFn();
                    }
                    // بستن سایدبار در موبایل
                    if (window.innerWidth <= 768 && sidebarOpen) {
                        toggleSidebar();
                    }
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="db-card">
                            <p style="color:#ff4444;text-align:center;padding:20px;">
                                ❌ خطا در بارگذاری: ${err.message}
                            </p>
                        </div>
                    `;
                });
        }

        // ============================================================
        // بروزرسانی همه
        // ============================================================
        function refreshAll() {
            switchTab(currentTab);
            showToast('🔄 بروزرسانی شد', 'success');
        }

        // ============================================================
        // Toast
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const colors = { info: '#00d4ff', success: '#00ff88', error: '#ff4444', warning: '#ffaa00' };
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            toast.style.borderColor = colors[type] || colors.info;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 3000);
        }

        // ============================================================
        // راه‌اندازی اولیه
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadSidebar();
            switchTab('overview');
            setInterval(updateTimestamp, 1000);
            setInterval(refreshAll, 30000);

            // بستن سایدبار با کلیک خارج
            document.addEventListener('click', function(e) {
                const sidebar = document.getElementById('dbSidebar');
                const toggleBtn = document.getElementById('sidebarToggleBtn');
                if (window.innerWidth <= 768 && sidebarOpen) {
                    if (!sidebar?.contains(e.target) && !toggleBtn?.contains(e.target)) {
                        toggleSidebar();
                    }
                }
            });

            // تغییر اندازه پنجره
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768 && sidebarOpen) {
                    toggleSidebar();
                }
            });
        });

        console.log('✅ Database page loaded successfully');
    </script>

</body>
</html>
