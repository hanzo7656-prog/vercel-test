<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت دیتابیس</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           THEME
           ============================================================ */
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111927;
            --bg-card: rgba(17, 25, 45, 0.6);
            --border-glow: rgba(0, 212, 255, 0.15);
            --text-primary: #e8edf5;
            --text-secondary: #8899bb;
            --accent-cyan: #00d4ff;
            --accent-pink: #ff6b9d;
            --accent-purple: #a855f7;
            --accent-green: #00ff88;
            --accent-orange: #ff8800;
            --shadow-glow: 0 8px 32px rgba(0, 212, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            font-family: 'Segoe UI', 'Vazir', system-ui, sans-serif;
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .dashboard-header {
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.08);
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo i { -webkit-text-fill-color: #00d4ff; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .menu-toggle {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-toggle:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.05);
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .db-sidebar {
            width: 220px;
            background: rgba(17, 25, 45, 0.8);
            backdrop-filter: blur(16px);
            border-left: 1px solid rgba(0, 212, 255, 0.06);
            padding: 16px 0;
            position: sticky;
            top: 68px;
            height: calc(100vh - 68px);
            overflow-y: auto;
            flex-shrink: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .db-sidebar::-webkit-scrollbar { width: 3px; }
        .db-sidebar::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }

        .sidebar-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.06);
            margin-bottom: 12px;
        }

        .sidebar-brand h2 {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .sidebar-brand h2 i { color: var(--accent-cyan); }
        .sidebar-brand .sub { font-size: 0.6rem; color: var(--text-secondary); margin-top: 2px; }

        .sidebar-section { padding: 4px 12px; }
        .sidebar-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            padding: 8px 10px 4px;
            opacity: 0.5;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.8rem;
            width: 100%;
            background: transparent;
            border: none;
            font-family: inherit;
            position: relative;
        }

        .sidebar-item:hover {
            background: rgba(0, 212, 255, 0.04);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: rgba(0, 212, 255, 0.08);
            color: var(--accent-cyan);
            box-shadow: inset 3px 0 0 var(--accent-cyan);
        }

        .sidebar-item i { width: 20px; text-align: center; font-size: 0.9rem; }
        .sidebar-item .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: auto;
        }
        .sidebar-item .badge-dot.online { background: var(--accent-green); }
        .sidebar-item .badge-dot.offline { background: #ff4444; }
        .sidebar-item .badge-dot.warning { background: var(--accent-orange); }

        .sidebar-divider {
            height: 1px;
            background: rgba(0, 212, 255, 0.06);
            margin: 8px 16px;
        }

        /* ============================================================
           MAIN LAYOUT
           ============================================================ */
        .db-page {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px;
            gap: 24px;
            min-height: calc(100vh - 68px);
        }

        .db-content {
            flex: 1;
            min-width: 0;
        }

        /* ============================================================
           PAGE HEADER
           ============================================================ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
        }

        .page-header h1 i {
            color: var(--accent-cyan);
            font-size: 1.2rem;
        }

        .page-header .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-glow {
            padding: 8px 20px;
            border-radius: 10px;
            border: none;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(168, 85, 247, 0.15));
            color: var(--text-primary);
            border: 1px solid rgba(0, 212, 255, 0.12);
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.15);
            border-color: var(--accent-cyan);
        }

        .btn-glow i { color: var(--accent-cyan); }

        .timestamp {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            opacity: 0.6;
        }

        /* ============================================================
           DASHBOARD GRID
           ============================================================ */
        .db-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        /* ============================================================
           STAT CARDS (Glassmorphism)
           ============================================================ */
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.06);
            border-radius: 16px;
            padding: 20px 24px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .stat-card:hover::before { opacity: 1; }
        .stat-card:hover {
            border-color: rgba(0, 212, 255, 0.15);
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
        }

        .stat-card .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 12px;
            display: inline-block;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 212, 255, 0.04);
        }

        .stat-card .stat-sub .highlight {
            color: var(--accent-green);
            font-weight: 600;
        }

        /* ============================================================
           CONTENT CARDS
           ============================================================ */
        .content-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .content-card:hover {
            border-color: rgba(0, 212, 255, 0.1);
        }

        .content-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .content-card .card-header h3 {
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .content-card .card-header h3 i { color: var(--accent-cyan); }

        /* ============================================================
           TABLES
           ============================================================ */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-modern {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .table-modern th {
            text-align: right;
            padding: 10px 14px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.06);
        }

        .table-modern td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.03);
            color: var(--text-primary);
        }

        .table-modern tr:hover td {
            background: rgba(0, 212, 255, 0.02);
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 500;
        }

        .status-chip.online {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.15);
        }

        .status-chip.offline {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.15);
        }

        .status-chip.warning {
            background: rgba(255, 136, 0, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 136, 0, 0.15);
        }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-modern {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 16px;
        }

        .spinner-glow {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(0, 212, 255, 0.05);
            border-top: 3px solid var(--accent-cyan);
            animation: spin 1s linear infinite;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.05);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-modern p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            width: 90%;
            max-width: 420px;
        }

        .toast {
            padding: 12px 24px;
            background: rgba(17, 25, 45, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.85rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            pointer-events: all;
            animation: toastIn 0.4s ease;
            text-align: center;
            width: 100%;
        }

        .toast.success { border-color: var(--accent-green); }
        .toast.error { border-color: #ff4444; }
        .toast.warning { border-color: var(--accent-orange); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .db-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .db-page { flex-direction: column; padding: 12px; gap: 12px; }
            .db-grid { grid-template-columns: 1fr; }
            .page-header h1 { font-size: 1.1rem; }
            .db-sidebar {
                position: fixed;
                top: 68px;
                right: -100%;
                width: 280px;
                height: calc(100vh - 68px);
                z-index: 60;
                border-radius: 0 0 16px 16px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            }
            .db-sidebar.open { right: 0; }
            .sidebar-toggle-btn {
                display: inline-flex !important;
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 55;
                top: 68px;
            }
            .sidebar-overlay.open { display: block; }
            .dashboard-header { padding: 10px 16px; }
            .logo { font-size: 1rem; }
            .header-actions .status-badge .text { display: none; }
        }

        @media (min-width: 769px) {
            .sidebar-toggle-btn { display: none !important; }
            .sidebar-overlay { display: none !important; }
        }

        @media (max-width: 480px) {
            .stat-card .stat-value { font-size: 1.5rem; }
            .content-card { padding: 16px; }
            .table-modern { font-size: 0.7rem; }
            .table-modern th, .table-modern td { padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="dashboard-header">
        <a href="/dashboard" class="logo">
            <i class="fas fa-cubes"></i> سیستم تحلیلگر
        </a>
        <div class="header-actions">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span class="text">سیستم پایدار</span>
            </div>
            <span style="font-size:0.65rem;color:var(--text-secondary);font-family:'Courier New',monospace;" id="uptimeDisplay">⏱️ ۰ ثانیه</span>
            <span id="userDisplay" style="font-size:0.75rem;color:var(--accent-cyan);"></span>
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- FLYOUT OVERLAY -->
    <div class="flyout-overlay" id="flyoutOverlay"></div>

    <!-- FLYOUT MENU -->
    <nav class="flyout-menu" id="flyoutMenu">
        <div class="menu-label">🔹 منوی اصلی</div>
        <a href="/dashboard"><i class="fas fa-chart-pie"></i> داشبورد</a>
        <a href="/chart-page"><i class="fas fa-chart-line"></i> نمودار</a>
        <a href="/predict-page"><i class="fas fa-bullseye"></i> مدل</a>
        <a href="/test-api-page"><i class="fas fa-plug"></i> تست API</a>
        <div class="menu-divider"></div>
        <a href="/health-page"><i class="fas fa-heartbeat"></i> سلامت</a>
        <a href="/database-page" class="active"><i class="fas fa-database"></i> دیتابیس</a>
        <a href="/settings-page"><i class="fas fa-sliders-h"></i> تنظیمات</a>
        <div class="menu-divider"></div>
        <a href="/debug-page" style="color:#ff6b00;"><i class="fas fa-bug"></i> دیباگ</a>
    </nav>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <div class="db-page">

        <!-- SIDEBAR -->
        <nav class="db-sidebar" id="dbSidebar">
            <div class="sidebar-brand">
                <h2><i class="fas fa-database"></i> دیتابیس</h2>
                <div class="sub">مدیریت &amp; مانیتورینگ</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-label">📊 نمای کلی</div>
                <button class="sidebar-item active" data-tab="overview" onclick="switchTab('overview')">
                    <i class="fas fa-chart-pie"></i> نمای کلی
                    <span class="badge-dot online" id="dotOverview"></span>
                </button>
                <button class="sidebar-item" data-tab="explorer" onclick="switchTab('explorer')">
                    <i class="fas fa-search"></i> کاوشگر
                </button>
                <button class="sidebar-item" data-tab="monitor" onclick="switchTab('monitor')">
                    <i class="fas fa-chart-line"></i> مانیتورینگ
                </button>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <div class="sidebar-label">🗄️ دیتابیس‌ها</div>
                <button class="sidebar-item" data-tab="postgresql" onclick="switchTab('postgresql')">
                    <i class="fas fa-database" style="color:#3366ff;"></i> PostgreSQL
                    <span class="badge-dot" id="dotPostgresql"></span>
                </button>
                <button class="sidebar-item" data-tab="redis" onclick="switchTab('redis')">
                    <i class="fas fa-bolt" style="color:#ff4444;"></i> Redis
                    <span class="badge-dot" id="dotRedis"></span>
                </button>
                <button class="sidebar-item" data-tab="sqlite" onclick="switchTab('sqlite')">
                    <i class="fas fa-file" style="color:#00ff88;"></i> SQLite
                    <span class="badge-dot" id="dotSqlite"></span>
                </button>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <button class="sidebar-item" onclick="refreshAll()" style="color:#ff8800;">
                    <i class="fas fa-sync-alt"></i> بروزرسانی همه
                </button>
            </div>
        </nav>

        <!-- OVERLAY (موبایل) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- CONTENT -->
        <main class="db-content">

            <div class="page-header">
                <h1 id="pageTitle"><i class="fas fa-chart-pie"></i> نمای کلی</h1>
                <div class="header-actions">
                    <span class="timestamp" id="pageTimestamp"></span>
                    <button class="btn-glow" onclick="refreshAll()">
                        <i class="fas fa-sync-alt"></i> بروزرسانی
                    </button>
                </div>
            </div>

            <div id="tabContainer">
                <div class="loading-modern">
                    <div class="spinner-glow"></div>
                    <p>بارگذاری داده‌های دیتابیس...</p>
                </div>
            </div>

        </main>

    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="/static/js/script.js"></script>
    <script>
        // ============================================================
        // STATE
        // ============================================================
        let currentTab = 'overview';
        let sidebarOpen = false;

        // ============================================================
        // MENU
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const flyoutMenu = document.getElementById('flyoutMenu');
            const overlay = document.getElementById('flyoutOverlay');

            if (menuToggle && flyoutMenu && overlay) {
                menuToggle.addEventListener('click', function() {
                    const open = flyoutMenu.classList.toggle('open');
                    overlay.classList.toggle('open');
                    menuToggle.innerHTML = open ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
                });

                overlay.addEventListener('click', function() {
                    flyoutMenu.classList.remove('open');
                    overlay.classList.remove('open');
                    menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
                });
            }

            // کاربر
            fetch('/api/user', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const display = document.getElementById('userDisplay');
                        if (display) {
                            const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                            display.textContent = roleMap[data.data.role] || data.data.username;
                        }
                    }
                })
                .catch(() => {});

            // آپتایم
            if (typeof fetchAndStartUptime === 'function') {
                fetchAndStartUptime();
            }

            // سایدبار موبایل
            const sidebar = document.getElementById('dbSidebar');
            const overlaySide = document.getElementById('sidebarOverlay');

            document.querySelector('.sidebar-toggle-btn')?.addEventListener('click', toggleSidebar);

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && sidebarOpen) {
                    if (!sidebar?.contains(e.target) && !e.target.closest('.sidebar-toggle-btn')) {
                        toggleSidebar();
                    }
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768 && sidebarOpen) {
                    toggleSidebar();
                }
            });

            // بارگذاری تب
            switchTab('overview');
            setInterval(updateTimestamp, 1000);
        });

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('dbSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('open', sidebarOpen);
            if (overlay) overlay.classList.toggle('open', sidebarOpen);
        }

        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
        }

        // ============================================================
        // SWITCH TAB
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            const container = document.getElementById('tabContainer');
            const title = document.getElementById('pageTitle');

            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.toggle('active', item.dataset.tab === tab);
            });

            const titles = {
                'overview': '<i class="fas fa-chart-pie"></i> نمای کلی',
                'explorer': '<i class="fas fa-search"></i> کاوشگر',
                'monitor': '<i class="fas fa-chart-line"></i> مانیتورینگ',
                'postgresql': '<i class="fas fa-database" style="color:#3366ff;"></i> PostgreSQL',
                'redis': '<i class="fas fa-bolt" style="color:#ff4444;"></i> Redis',
                'sqlite': '<i class="fas fa-file" style="color:#00ff88;"></i> SQLite'
            };
            title.innerHTML = titles[tab] || tab;

            container.innerHTML = `
                <div class="loading-modern">
                    <div class="spinner-glow"></div>
                    <p>بارگذاری ${titles[tab]?.replace(/<[^>]*>/g, '') || tab}...</p>
                </div>
            `;

            fetch(`/static/db-parts/${tab}.html`)
                .then(res => {
                    if (!res.ok) throw new Error('تاب یافت نشد');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const newScript = document.createElement('script');
                        newScript.textContent = old.textContent;
                        if (old.src) newScript.src = old.src;
                        old.parentNode.replaceChild(newScript, old);
                    });
                    const initFn = window['init_' + tab];
                    if (typeof initFn === 'function') initFn();

                    if (window.innerWidth <= 768 && sidebarOpen) toggleSidebar();
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="content-card">
                            <p style="color:#ff4444;text-align:center;padding:20px;">
                                ❌ خطا در بارگذاری: ${err.message}
                            </p>
                        </div>
                    `;
                });
        }

        function refreshAll() {
            switchTab(currentTab);
            showToast('🔄 بروزرسانی شد', 'success');
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        console.log('🚀 Database Dashboard v2.0 loaded');
    </script>
</body>
</html>
