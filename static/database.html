<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت دیتابیس</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0a0e17; min-height: 100vh; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard-header .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }
        #userDisplay {
            color: #00d4ff;
            font-size: 0.85rem;
        }

        .menu-toggle {
            width: 44px; height: 44px; border-radius: 50%; background: #0d1624;
            border: 1px solid #1a2a3a; color: #e0e6ed; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 200;
        }
        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed; top: 80px; right: 20px;
            background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a; border-radius: 16px; padding: 10px 0;
            min-width: 200px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150; transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #a0b4c8; text-decoration: none; font-size: 0.95rem;
            transition: all 0.2s ease; border-right: 2px solid transparent;
        }
        .flyout-menu a:hover { background: rgba(0,212,255,0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0,212,255,0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 20px 4px; font-size: 0.7rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .flyout-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        .card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .card:hover { border-color: rgba(0, 212, 255, 0.15); }
        .card-title {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .badge {
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.15);
            margin-right: auto;
        }
        .card-subtitle {
            color: #7a8fa3;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500;
        }
        .badge-success { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .badge-danger { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        .badge-info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
        .badge-gray { background: rgba(255,255,255,0.05); color: #7a8fa3; border: 1px solid rgba(255,255,255,0.05); }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px;
            border: none; border-radius: 10px; font-size: 0.85rem; cursor: pointer;
            transition: all 0.3s ease; font-weight: 500; font-family: inherit;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }
        .btn-sm { padding: 5px 12px; font-size: 0.75rem; }

        .table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .table th { text-align: right; padding: 10px 12px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 10px 12px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0,212,255,0.03); }

        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #1a2a3a; border-top: 3px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== دیتابیس کارت ===== */
        .db-card {
            background: #0a0e17;
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid #1a2a3a;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        .db-card:hover {
            border-color: rgba(0, 212, 255, 0.15);
        }
        .db-card .db-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .db-card .db-header .db-name {
            color: #00d4ff;
            font-weight: 600;
            font-size: 1rem;
        }
        .db-card .db-header .db-status {
            font-size: 0.85rem;
        }
        .db-card .db-header .db-status.online { color: #00ff88; }
        .db-card .db-header .db-status.offline { color: #ff4444; }

        .db-card .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }
        .db-card .form-group label {
            color: #a0b4c8;
            font-size: 0.8rem;
        }
        .db-card .form-control {
            padding: 8px 12px;
            background: #0d1624;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            width: 100%;
            box-sizing: border-box;
        }
        .db-card .form-control:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== توکن با چشم ===== */
        .token-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0d1624;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            padding: 0 4px 0 12px;
            transition: border-color 0.3s ease;
        }
        .token-input-wrapper:focus-within {
            border-color: #00d4ff;
        }
        .token-input-wrapper .form-control {
            border: none;
            padding: 8px 0;
            background: transparent;
            flex: 1;
        }
        .token-input-wrapper .form-control:focus {
            box-shadow: none;
        }
        .token-input-wrapper .token-actions {
            display: flex;
            gap: 2px;
        }
        .token-input-wrapper .action-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #7a8fa3;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            position: relative;
        }
        .token-input-wrapper .action-btn:hover {
            color: #e0e6ed;
            background: rgba(0, 212, 255, 0.06);
        }
        .token-input-wrapper .action-btn.active {
            color: #00d4ff;
        }
        .token-input-wrapper .action-btn .slash-line {
            position: absolute;
            width: 16px;
            height: 2px;
            background: #ff4444;
            border-radius: 2px;
            transform: rotate(-45deg) scale(0);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .token-input-wrapper .action-btn.active .slash-line {
            transform: rotate(-45deg) scale(1);
            opacity: 1;
        }
        .token-input-wrapper .action-btn.copied {
            color: #00ff88;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 768px) {
            .dashboard-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .container { padding: 12px; }
            .flyout-menu { right: 12px; top: 72px; min-width: 170px; }
        }
        @media (max-width: 480px) {
            .dashboard-header .uptime { display: none; }
            .menu-toggle { width: 38px; height: 38px; font-size: 1rem; }
            .flyout-menu { right: 8px; top: 64px; min-width: 150px; }
            .db-card .db-header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- منو -->
    <div id="navContainer"></div>

    <!-- محتوا -->
    <div class="container">

        <div class="card">
            <div class="card-title">
                <i class="fas fa-database"></i>
                مدیریت دیتابیس
                <span class="badge">اتصالات</span>
            </div>
            <div class="card-subtitle">مشاهده وضعیت و اطلاعات اتصالات دیتابیس</div>
            <button class="btn btn-primary btn-sm" onclick="loadDbStatus()">
                <i class="fas fa-sync-alt"></i> بروزرسانی
            </button>
        </div>

        <div id="dbContent">
            <div class="loading">
                <div class="spinner"></div>
                <p style="color:#7a8fa3;">در حال دریافت اطلاعات...</p>
            </div>
        </div>

    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        // ============================================================
        // بارگذاری منو
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    if (typeof fetchAndStartUptime === 'function') fetchAndStartUptime();
                    loadUserInfo();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        function loadUserInfo() {
            fetch('/api/user', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const display = document.getElementById('userDisplay');
                        if (display) {
                            const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                            display.textContent = roleMap[data.data.role] || data.data.username;
                        }
                    }
                })
                .catch(() => {});
        }

        // ============================================================
        // بارگذاری وضعیت دیتابیس
        // ============================================================
        function loadDbStatus() {
            const container = document.getElementById('dbContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p style="color:#7a8fa3;">در حال دریافت...</p></div>';

            fetch('/health/database')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderDbStatus(data.data);
                    } else {
                        container.innerHTML = `<div class="card"><p style="color:#ff4444;">❌ خطا در دریافت اطلاعات</p></div>`;
                    }
                })
                .catch(err => {
                    container.innerHTML = `<div class="card"><p style="color:#ff4444;">❌ خطا: ${err.message}</p></div>`;
                });
        }

        // ============================================================
        // رندر وضعیت دیتابیس
        // ============================================================
        function renderDbStatus(dbData) {
            const container = document.getElementById('dbContent');
            let html = '';

            const dbNames = Object.keys(dbData);

            if (dbNames.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <p style="color:#7a8fa3;text-align:center;padding:20px;">
                            📭 هیچ دیتابیسی پیکربندی نشده است
                        </p>
                    </div>
                `;
                return;
            }

            for (const name of dbNames) {
                const info = dbData[name];
                const isConnected = info.connected && info.ping;
                const statusClass = isConnected ? 'online' : 'offline';
                const statusText = isConnected ? '✅ متصل' : '❌ قطع';
                
                const url = info.url || 'تنظیم نشده';
                const token = info.token || '';
                const maskedToken = token.length > 10 ? token.substring(0, 6) + '••••••••' : (token || '••••••••');

                html += `
                    <div class="db-card">
                        <div class="db-header">
                            <span class="db-name"><i class="fas fa-server"></i> ${name}</span>
                            <span class="db-status ${statusClass}">${statusText}</span>
                        </div>

                        <div class="form-group">
                            <label>📡 آدرس</label>
                            <input type="text" class="form-control" value="${url}" disabled>
                        </div>

                        <div class="form-group">
                            <label>🔑 توکن</label>
                            <div class="token-input-wrapper">
                                <input type="password" id="token_${name}" class="form-control" value="${token}" readonly>
                                <div class="token-actions">
                                    <button class="action-btn" onclick="toggleTokenVisibility('${name}')" title="نمایش/پنهان کردن">
                                        <i class="fas fa-eye eye-icon"></i>
                                        <span class="slash-line"></span>
                                    </button>
                                    <button class="action-btn" onclick="copyToken('${name}')" title="کپی توکن">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:0.8rem;color:#4a5a6a;">
                            <span>📊 نوع: <span style="color:#7a8fa3;">${info.type || 'redis'}</span></span>
                            <span>📡 ping: <span style="color:${isConnected ? '#00ff88' : '#ff4444'};">${info.ping ? '✅' : '❌'}</span></span>
                            <span>⚙️ وضعیت: <span style="color:${info.enabled ? '#00ff88' : '#ff4444'};">${info.enabled ? 'فعال' : 'غیرفعال'}</span></span>
                        </div>
                    </div>
                `;
            }

            html += `
                <div style="text-align:center;margin-top:12px;">
                    <button class="btn btn-primary btn-sm" onclick="loadDbStatus()">
                        <i class="fas fa-sync-alt"></i> بروزرسانی مجدد
                    </button>
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================================
        // توکن - نمایش/پنهان کردن
        // ============================================================
        function toggleTokenVisibility(name) {
            const input = document.getElementById(`token_${name}`);
            if (!input) return;
            
            const wrapper = input.closest('.token-input-wrapper');
            const btn = wrapper.querySelector('.action-btn');
            const eyeIcon = btn.querySelector('.eye-icon');
            const slashLine = btn.querySelector('.slash-line');

            if (input.type === 'password') {
                input.type = 'text';
                btn.classList.add('active');
                if (eyeIcon) {
                    eyeIcon.className = 'fas fa-eye-slash eye-icon';
                }
                if (slashLine) {
                    slashLine.style.transform = 'rotate(-45deg) scale(1)';
                    slashLine.style.opacity = '1';
                }
            } else {
                input.type = 'password';
                btn.classList.remove('active');
                if (eyeIcon) {
                    eyeIcon.className = 'fas fa-eye eye-icon';
                }
                if (slashLine) {
                    slashLine.style.transform = 'rotate(-45deg) scale(0)';
                    slashLine.style.opacity = '0';
                }
            }
        }

        // ============================================================
        // کپی توکن
        // ============================================================
        function copyToken(name) {
            const input = document.getElementById(`token_${name}`);
            if (!input) return;

            const token = input.value;
            const wrapper = input.closest('.token-input-wrapper');
            const btn = wrapper.querySelector('.action-btn:last-child');

            if (navigator.clipboard) {
                navigator.clipboard.writeText(token).then(() => {
                    btn.classList.add('copied');
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = '<i class="fas fa-copy"></i>';
                    }, 2000);
                    showToast('📋 توکن کپی شد!', 'success');
                }).catch(() => {
                    showToast('❌ کپی نشد!', 'error');
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = token;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('📋 توکن کپی شد!', 'success');
                } catch {
                    showToast('❌ کپی نشد!', 'error');
                }
                document.body.removeChild(textarea);
            }
        }

        // ============================================================
        // Toast
        // ============================================================
        function showToast(message, type = 'info') {
            const colors = {
                info: '#00d4ff',
                success: '#00ff88',
                error: '#ff4444',
                warning: '#ffaa00'
            };
            const toast = document.createElement('div');
            toast.textContent = message;
            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '20px',
                left: '50%',
                transform: 'translateX(-50%)',
                padding: '10px 24px',
                background: '#1a2a3a',
                color: '#e0e6ed',
                borderRadius: '10px',
                border: `2px solid ${colors[type] || colors.info}`,
                boxShadow: '0 4px 30px rgba(0,0,0,0.5)',
                zIndex: '9999',
                fontSize: '0.9rem',
                transition: 'all 0.3s ease',
                maxWidth: '90%',
                fontFamily: 'inherit'
            });
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 3000);
        }

        // ============================================================
        // راه‌اندازی
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadDbStatus();
            setInterval(loadDbStatus, 30000);
        });
    </script>

</body>
</html>
