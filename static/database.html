<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>مدیریت دیتابیس</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/themes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #0a0e17;
            min-height: 100vh;
            font-family: 'Vazir', 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dashboard-header .logo {
            font-size: 1rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
        }

        #userDisplay {
            color: #00d4ff;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .menu-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #0d1624;
            border: 1px solid #1a2a3a;
            color: #e0e6ed;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 200;
        }

        .menu-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0, 212, 255, 0.1); }
        .menu-toggle.open { border-color: #00d4ff; background: #00d4ff; color: #0a0e17; }

        .flyout-menu {
            position: fixed;
            top: 70px;
            right: 12px;
            background: rgba(13, 22, 36, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 10px 0;
            min-width: 170px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150;
            transform-origin: top right;
        }

        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #a0b4c8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border-right: 2px solid transparent;
        }

        .flyout-menu a:hover { background: rgba(0, 212, 255, 0.05); color: #e0e6ed; border-right-color: #00d4ff; }
        .flyout-menu a.active { color: #00d4ff; border-right-color: #00d4ff; background: rgba(0, 212, 255, 0.05); }
        .flyout-menu .menu-divider { height: 1px; background: #1a2a3a; margin: 6px 16px; }
        .flyout-menu .menu-label { padding: 8px 16px 4px; font-size: 0.65rem; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }

        .flyout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .page-header h1 {
            color: #e0e6ed;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-header h1 i { color: #00d4ff; }
        .page-header .subtitle { color: #7a8fa3; font-size: 0.75rem; }
        .page-header .timestamp { color: #4a5a6a; font-size: 0.65rem; font-family: 'Courier New', monospace; }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: #0d1624;
            border-radius: 10px;
            padding: 4px;
            border: 1px solid #1a2a3a;
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .tabs .tab-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #7a8fa3;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            font-family: inherit;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tabs .tab-btn:hover { color: #e0e6ed; background: rgba(0, 212, 255, 0.05); }
        .tabs .tab-btn.active { color: #00d4ff; background: rgba(0, 212, 255, 0.1); }

        /* ===== TAB CONTENT ===== */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== CARDS ===== */
        .db-card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .db-card:hover { border-color: rgba(0, 212, 255, 0.15); transform: translateY(-2px); }

        .db-card.redis { border-left: 4px solid #ff4444; }
        .db-card.redis .db-icon { color: #ff4444; }

        .db-card.postgresql { border-left: 4px solid #3366ff; }
        .db-card.postgresql .db-icon { color: #3366ff; }

        .db-card.sqlite { border-left: 4px solid #00ff88; }
        .db-card.sqlite .db-icon { color: #00ff88; }

        .db-card .db-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .db-card .db-header .db-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .db-card .db-header .db-info .db-icon { font-size: 1.2rem; width: 28px; text-align: center; }
        .db-card .db-header .db-info .db-name { color: #e0e6ed; font-weight: 600; font-size: 0.95rem; }
        .db-card .db-header .db-info .db-description { color: #7a8fa3; font-size: 0.7rem; }

        .db-card .db-header .db-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .db-card .db-header .db-status.online { color: #00ff88; background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.2); }
        .db-card .db-header .db-status.offline { color: #ff4444; background: rgba(255, 68, 68, 0.1); border: 1px solid rgba(255, 68, 68, 0.2); }

        .db-card .db-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
        .db-card .db-body .db-field { display: flex; flex-direction: column; gap: 2px; }
        .db-card .db-body .db-field label { color: #7a8fa3; font-size: 0.65rem; font-weight: 500; }
        .db-card .db-body .db-field .db-value { color: #e0e6ed; font-size: 0.8rem; font-family: 'Courier New', monospace; background: #0a0e17; padding: 4px 8px; border-radius: 6px; border: 1px solid #1a2a3a; word-break: break-all; }

        .token-wrapper {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .token-wrapper .db-value {
            flex: 1;
            min-width: 0;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            background: #0a0e17;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #1a2a3a;
            color: #e0e6ed;
            word-break: break-all;
        }

        .token-wrapper .action-btn {
            background: transparent;
            border: 1px solid #1a2a3a;
            border-radius: 6px;
            color: #7a8fa3;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            min-height: 28px;
        }

        .token-wrapper .action-btn:hover { border-color: #00d4ff; color: #e0e6ed; }
        .token-wrapper .action-btn.active { border-color: #00d4ff; color: #00d4ff; }
        .token-wrapper .action-btn.copied { border-color: #00ff88; color: #00ff88; }

        .db-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #0d1624;
        }

        .db-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #4a5a6a;
            font-size: 0.65rem;
        }

        .db-stats .stat-item i { color: #7a8fa3; font-size: 0.6rem; }
        .db-stats .stat-item .stat-value { color: #e0e6ed; font-weight: 500; }

        .summary-card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .summary-card .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .summary-card .summary-item {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            background: #0a0e17;
            border: 1px solid #1a2a3a;
        }

        .summary-card .summary-item .summary-number { font-size: 1.2rem; font-weight: 700; color: #00d4ff; }
        .summary-card .summary-item .summary-label { color: #7a8fa3; font-size: 0.6rem; margin-top: 2px; }
        .summary-card .summary-item .summary-number.online { color: #00ff88; }
        .summary-card .summary-item .summary-number.offline { color: #ff4444; }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1a2a3a;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .toast-container {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 10px 20px;
            background: #1a2a3a;
            color: #e0e6ed;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            font-size: 0.85rem;
            transition: all 0.3s ease;
            width: 100%;
            pointer-events: all;
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .toast.success { border-color: #00ff88; }
        .toast.error { border-color: #ff4444; }

        .btn-refresh {
            background: transparent;
            border: 1px solid #1a2a3a;
            color: #7a8fa3;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh:hover { border-color: #00d4ff; color: #e0e6ed; }

        /* ===== TABLE ===== */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table { width: 100%; border-collapse: collapse; font-size: 0.7rem; min-width: 400px; }
        .table th { text-align: right; padding: 8px 10px; color: #00d4ff; border-bottom: 2px solid #1a2a3a; font-weight: 600; }
        .table td { padding: 8px 10px; border-bottom: 1px solid #0d1624; color: #c0d0e0; }
        .table tr:hover td { background: rgba(0, 212, 255, 0.03); }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box input {
            flex: 1;
            padding: 8px 12px;
            background: #0a0e17;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.8rem;
            min-width: 150px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .search-box select {
            padding: 8px 12px;
            background: #0a0e17;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.8rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .dashboard-header { padding: 16px 24px; }
            .dashboard-header .logo { font-size: 1.3rem; }
            .container { padding: 20px; }
            .page-header h1 { font-size: 1.6rem; }
            .db-card { padding: 20px 24px; margin-bottom: 16px; border-radius: 16px; }
            .db-card .db-body { grid-template-columns: 1fr 1fr; gap: 12px 24px; }
            .summary-card .summary-grid { gap: 16px; }
            .summary-card .summary-item .summary-number { font-size: 1.5rem; }
            .tabs .tab-btn { padding: 10px 24px; font-size: 0.9rem; }
            .table { font-size: 0.85rem; min-width: auto; }
        }

        @media (max-width: 480px) {
            .db-card .db-body { grid-template-columns: 1fr; }
            .dashboard-header .uptime { display: none; }
            .flyout-menu { right: 8px; top: 60px; min-width: 150px; }
            .summary-card .summary-grid { grid-template-columns: 1fr 1fr; }
            .page-header h1 { font-size: 1rem; }
            .tabs .tab-btn { font-size: 0.7rem; padding: 6px 10px; }
            .search-box { flex-direction: column; }
            .search-box input { width: 100%; }
        }

        @media (max-width: 380px) {
            .summary-card .summary-grid { grid-template-columns: 1fr; }
            .db-stats { flex-direction: column; gap: 4px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .dashboard-header { padding: 6px 12px; }
            .dashboard-header .logo { font-size: 0.8rem; }
            .db-card { padding: 10px 14px; margin-bottom: 8px; }
            .db-card .db-body { grid-template-columns: 1fr 1fr; gap: 4px 12px; }
            .container { padding: 6px 8px; }
            .summary-card { padding: 10px; }
            .summary-card .summary-grid { grid-template-columns: repeat(3, 1fr); }
            .page-header h1 { font-size: 0.9rem; }
            .flyout-menu { top: 50px; right: 8px; min-width: 140px; }
            .flyout-menu a { padding: 6px 12px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- ===== MENU ===== -->
    <div id="navContainer"></div>

    <!-- ===== CONTENT ===== -->
    <div class="container">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1><i class="fas fa-database"></i> مدیریت دیتابیس</h1>
                <span class="subtitle">وضعیت، مانیتورینگ و کاوشگر داده</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <span class="timestamp" id="pageTimestamp"></span>
                <button class="btn-refresh" onclick="refreshAll()">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <!-- ===== TABS ===== -->
        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-tab="overview">
                <i class="fas fa-chart-pie"></i> نمای کلی
            </button>
            <button class="tab-btn" data-tab="explorer">
                <i class="fas fa-search"></i> کاوشگر
            </button>
            <button class="tab-btn" data-tab="monitor">
                <i class="fas fa-chart-line"></i> مانیتورینگ
            </button>
            <button class="tab-btn" data-tab="postgresql">
                <i class="fas fa-database"></i> PostgreSQL
            </button>
            <button class="tab-btn" data-tab="redis">
                <i class="fas fa-bolt"></i> Redis
            </button>
            <button class="tab-btn" data-tab="sqlite">
                <i class="fas fa-file"></i> SQLite
            </button>
        </div>

        <!-- ===== TAB: OVERVIEW ===== -->
        <div class="tab-content active" id="tab-overview">
            <div id="overviewContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            </div>
        </div>

        <!-- ===== TAB: EXPLORER ===== -->
        <div class="tab-content" id="tab-explorer">
            <div id="explorerContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            </div>
        </div>

        <!-- ===== TAB: MONITOR ===== -->
        <div class="tab-content" id="tab-monitor">
            <div id="monitorContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            </div>
        </div>

        <!-- ===== TAB: POSTGRESQL ===== -->
        <div class="tab-content" id="tab-postgresql">
            <div id="postgresqlContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            </div>
        </div>

        <!-- ===== TAB: REDIS ===== -->
        <div class="tab-content" id="tab-redis">
            <div id="redisContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            </div>
        </div>

        <!-- ===== TAB: SQLITE ===== -->
        <div class="tab-content" id="tab-sqlite">
            <div id="sqliteContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script src="/static/js/settings-theme.js"></script>

    <script>
        // ============================================================
        // راه‌اندازی اولیه
        // ============================================================
        console.log('🚀 Database page loaded');

        let currentTab = 'overview';

        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadTab('overview');
            setInterval(updateTimestamp, 1000);
            setInterval(refreshAll, 30000);
        });

        // ============================================================
        // بارگذاری منو
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    loadUserInfo();
                })
                .catch(err => console.error('❌ Nav error:', err));
        }

        function loadUserInfo() {
            fetch('/api/user', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const display = document.getElementById('userDisplay');
                        if (display) {
                            const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                            display.textContent = roleMap[data.data.role] || data.data.username;
                        }
                    }
                })
                .catch(() => {});
        }

        // ============================================================
        // آپدیت تاریخ و ساعت
        // ============================================================
        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) {
                el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
            }
        }

        // ============================================================
        // مدیریت تب‌ها
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const tab = this.dataset.tab;
                currentTab = tab;
                loadTab(tab);
            });
        });

        function loadTab(tab) {
            const container = document.getElementById(tab + 'Content');
            if (!container) return;

            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color:#7a8fa3;font-size:0.8rem;">در حال بارگذاری...</p>
                </div>
            `;

            fetch(`/static/db-parts/${tab}.html`)
                .then(res => {
                    if (!res.ok) throw new Error('تاب یافت نشد');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
            
                    // ⭐ اجرای اسکریپت‌های داخل تب
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        // کپی کردن محتوا
                        newScript.textContent = oldScript.textContent;
                        // کپی کردن atribut های src (اگه باشه)
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        }
                        // جایگزینی
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
            
                    // ⭐ اگر تابع مخصوص تب وجود داشت، اجرا کن
                    const initFn = window['init_' + tab];
                    if (typeof initFn === 'function') {
                        initFn();
                    }
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="db-card">
                            <p style="color:#ff4444;text-align:center;padding:20px;">
                                ❌ خطا در بارگذاری: ${err.message}
                            </p>
                        </div>
                    `;
                });
        }

        // ============================================================
        // بروزرسانی همه
        // ============================================================
        function refreshAll() {
            loadTab(currentTab);
        }

        // ============================================================
        // Toast
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const colors = { info: '#00d4ff', success: '#00ff88', error: '#ff4444', warning: '#ffaa00' };
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            toast.style.borderColor = colors[type] || colors.info;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 3000);
        }
    </script>

</body>
</html>
