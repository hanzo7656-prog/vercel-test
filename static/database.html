<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>مدیریت پیشرفته دیتابیس</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #080c18;
            --bg-card: rgba(13, 22, 40, 0.75);
            --border-glow: rgba(0, 212, 255, 0.12);
            --text-primary: #e8eef7;
            --text-secondary: #7a8fa8;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-purple: #a855f7;
            --accent-pink: #ff6b9d;
            --accent-orange: #ff8800;
            --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        body {
            background: var(--bg-deep);
            font-family: 'Segoe UI', 'Vazir', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }

        .header {
            background: rgba(8, 12, 24, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glow);
            padding: 10px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header .logo {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .header .logo i { -webkit-text-fill-color: var(--accent-cyan); }
        .header-actions { display: flex; align-items: center; gap: 14px; }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .menu-toggle {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .menu-toggle:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-cyan);
        }

        .flyout-menu {
            position: fixed;
            top: 68px;
            right: 16px;
            background: rgba(8, 12, 24, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 8px 0;
            min-width: 200px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150;
            transform-origin: top right;
        }
        .flyout-menu.open { transform: scale(1); opacity: 1; pointer-events: all; }
        .flyout-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border-right: 2px solid transparent;
        }
        .flyout-menu a:hover {
            background: rgba(0, 212, 255, 0.05);
            color: var(--text-primary);
            border-right-color: var(--accent-cyan);
        }
        .flyout-menu a.active {
            color: var(--accent-cyan);
            border-right-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.05);
        }
        .flyout-menu .menu-divider {
            height: 1px;
            background: var(--border-glow);
            margin: 6px 16px;
        }
        .flyout-menu .menu-label {
            padding: 8px 20px 4px;
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.5;
        }
        .flyout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .flyout-overlay.open { opacity: 1; pointer-events: all; }

        .db-page {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
            padding: 16px 24px;
            gap: 20px;
            min-height: calc(100vh - 68px);
        }
        .db-content { flex: 1; min-width: 0; }

        /* ===== SIDEBAR ===== */
        .db-sidebar {
            width: 210px;
            background: rgba(8, 12, 24, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px 0;
            flex-shrink: 0;
            position: sticky;
            top: 84px;
            height: calc(100vh - 100px);
            overflow-y: auto;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .db-sidebar::-webkit-scrollbar { width: 2px; }
        .sidebar-brand {
            padding: 0 16px 16px;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 8px;
        }
        .sidebar-brand h2 {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .sidebar-brand h2 i { color: var(--accent-cyan); }
        .sidebar-brand .sub { font-size: 0.55rem; color: var(--text-secondary); opacity: 0.6; }
        .sidebar-section { padding: 4px 10px; }
        .sidebar-label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            padding: 8px 10px 4px;
            opacity: 0.4;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.75rem;
            width: 100%;
            background: transparent;
            border: none;
            font-family: inherit;
            position: relative;
        }
        .sidebar-item:hover {
            background: rgba(0, 212, 255, 0.04);
            color: var(--text-primary);
        }
        .sidebar-item.active {
            background: rgba(0, 212, 255, 0.08);
            color: var(--accent-cyan);
            box-shadow: inset 2px 0 0 var(--accent-cyan);
        }
        .sidebar-item i { width: 18px; text-align: center; font-size: 0.8rem; }
        .sidebar-item .badge-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            margin-right: auto;
        }
        .sidebar-item .badge-dot.online { background: var(--accent-green); }
        .sidebar-item .badge-dot.offline { background: #ff4444; }
        .sidebar-item .badge-dot.warning { background: var(--accent-orange); }
        .sidebar-divider {
            height: 1px;
            background: var(--border-glow);
            margin: 6px 12px;
        }

        .sidebar-toggle-btn {
            display: none;
            background: rgba(0, 212, 255, 0.04);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--text-secondary);
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .sidebar-toggle-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 55;
            top: 68px;
        }
        .sidebar-overlay.open { display: block; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .page-header h1 i { color: var(--accent-cyan); }
        .header-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-glow);
            background: rgba(0, 212, 255, 0.04);
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-action:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
            background: rgba(0, 212, 255, 0.08);
        }
        .btn-action.primary {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(168, 85, 247, 0.15));
            border-color: rgba(0, 212, 255, 0.2);
            color: var(--accent-cyan);
        }
        .timestamp {
            font-size: 0.6rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            opacity: 0.5;
        }

        .card-glow {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        .card-glow:hover { border-color: rgba(0, 212, 255, 0.15); }
        .card-glow .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-glow .card-header h3 {
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .card-glow .card-header h3 i { color: var(--accent-cyan); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 14px 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-item .stat-icon { font-size: 1.2rem; margin-bottom: 6px; display: block; }
        .stat-item .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: var(--text-primary);
        }
        .stat-item .stat-value.cyan { color: var(--accent-cyan); }
        .stat-item .stat-value.green { color: var(--accent-green); }
        .stat-item .stat-value.pink { color: var(--accent-pink); }
        .stat-item .stat-value.orange { color: var(--accent-orange); }
        .stat-item .stat-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-modern {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }
        .table-modern th {
            text-align: right;
            padding: 8px 12px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-glow);
        }
        .table-modern td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.03);
            color: var(--text-primary);
        }
        .table-modern tr:hover td { background: rgba(0, 212, 255, 0.02); }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 500;
        }
        .chip.online {
            background: rgba(0, 255, 136, 0.08);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.12);
        }
        .chip.offline {
            background: rgba(255, 68, 68, 0.08);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.12);
        }
        .chip.cyan {
            background: rgba(0, 212, 255, 0.06);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .search-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
            min-width: 120px;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.02);
        }
        .search-bar input::placeholder { color: var(--text-secondary); opacity: 0.4; }

        .loading-modern {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            gap: 16px;
        }
        .spinner-glow {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid rgba(0, 212, 255, 0.04);
            border-top: 3px solid var(--accent-cyan);
            animation: spin 0.9s linear infinite;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.03);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-modern p { color: var(--text-secondary); font-size: 0.8rem; }

        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            padding: 10px 20px;
            background: rgba(8, 12, 24, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.8rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            pointer-events: all;
            animation: toastIn 0.35s ease;
            text-align: center;
            width: 100%;
        }
        .toast.success { border-color: var(--accent-green); }
        .toast.error { border-color: #ff4444; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 768px) {
            .db-page { flex-direction: column; padding: 12px; gap: 12px; }
            .db-sidebar {
                position: fixed;
                top: 68px;
                right: -100%;
                width: 270px;
                height: calc(100vh - 68px);
                border-radius: 0 0 16px 16px;
                z-index: 60;
                border: 1px solid var(--border-glow);
            }
            .db-sidebar.open { right: 0; }
            .sidebar-toggle-btn { display: inline-flex; }
            .sidebar-overlay.open { display: block; }
            .header { padding: 8px 16px; }
            .header .logo { font-size: 0.95rem; }
            .header-actions .status-badge .text { display: none; }
            .card-glow { padding: 14px 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (min-width: 769px) {
            .sidebar-toggle-btn { display: none !important; }
            .sidebar-overlay { display: none !important; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .stat-item .stat-value { font-size: 1.1rem; }
            .stat-item { padding: 10px 12px; }
            .table-modern { font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="/dashboard" class="logo">
            <i class="fas fa-cubes"></i> سیستم تحلیلگر
        </a>
        <div class="header-actions">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span class="text">پایدار</span>
            </div>
            <span id="uptimeDisplay" style="font-size:0.6rem;color:var(--text-secondary);font-family:'Courier New',monospace;">⏱️ ۰ ثانیه</span>
            <span id="userDisplay" style="font-size:0.7rem;color:var(--accent-cyan);"></span>
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="flyout-overlay" id="flyoutOverlay"></div>
    <nav class="flyout-menu" id="flyoutMenu">
        <div class="menu-label">🔹 منوی اصلی</div>
        <a href="/dashboard"><i class="fas fa-chart-pie"></i> داشبورد</a>
        <a href="/chart-page"><i class="fas fa-chart-line"></i> نمودار</a>
        <a href="/predict-page"><i class="fas fa-bullseye"></i> مدل</a>
        <a href="/test-api-page"><i class="fas fa-plug"></i> تست API</a>
        <div class="menu-divider"></div>
        <a href="/database-page" class="active"><i class="fas fa-database"></i> دیتابیس</a>
        <a href="/settings-page"><i class="fas fa-sliders-h"></i> تنظیمات</a>
        <div class="menu-divider"></div>
        <a href="/debug-page" style="color:#ff6b00;"><i class="fas fa-bug"></i> دیباگ</a>
    </nav>

    <div class="db-page">

        <nav class="db-sidebar" id="dbSidebar">
            <div class="sidebar-brand">
                <h2><i class="fas fa-database"></i> دیتابیس</h2>
                <div class="sub">مدیریت &amp; مانیتورینگ</div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">📊 نمای کلی</div>
                <button class="sidebar-item active" data-tab="overview" onclick="switchTab('overview')">
                    <i class="fas fa-chart-pie"></i> نمای کلی
                    <span class="badge-dot online" id="dotOverview"></span>
                </button>
                <button class="sidebar-item" data-tab="explorer" onclick="switchTab('explorer')">
                    <i class="fas fa-search"></i> کاوشگر
                </button>
                <button class="sidebar-item" data-tab="monitor" onclick="switchTab('monitor')">
                    <i class="fas fa-chart-line"></i> مانیتورینگ
                </button>
            </div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section">
                <div class="sidebar-label">🗄️ دیتابیس‌ها</div>
                <button class="sidebar-item" data-tab="postgresql" onclick="switchTab('postgresql')">
                    <i class="fas fa-database" style="color:#3366ff;"></i> PostgreSQL
                    <span class="badge-dot" id="dotPostgresql"></span>
                </button>
                <button class="sidebar-item" data-tab="redis" onclick="switchTab('redis')">
                    <i class="fas fa-bolt" style="color:#ff4444;"></i> Redis
                    <span class="badge-dot" id="dotRedis"></span>
                </button>
                <button class="sidebar-item" data-tab="sqlite" onclick="switchTab('sqlite')">
                    <i class="fas fa-file" style="color:#00ff88;"></i> SQLite
                    <span class="badge-dot" id="dotSqlite"></span>
                </button>
            </div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section">
                <button class="sidebar-item" onclick="refreshAll()" style="color:#ffaa00;">
                    <i class="fas fa-sync-alt"></i> بروزرسانی همه
                </button>
            </div>
        </nav>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="db-content">
            <div class="page-header">
                <h1 id="pageTitle"><i class="fas fa-chart-pie"></i> نمای کلی</h1>
                <div class="header-tools">
                    <span class="timestamp" id="pageTimestamp"></span>
                    <button class="btn-action primary" onclick="refreshAll()">
                        <i class="fas fa-sync-alt"></i> بروزرسانی
                    </button>
                    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i> منو
                    </button>
                </div>
            </div>

            <div id="tabContainer">
                <div class="loading-modern">
                    <div class="spinner-glow"></div>
                    <p>بارگذاری داده‌های دیتابیس...</p>
                </div>
            </div>
        </main>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/script.js"></script>
    <script>
        // ============================================================
        // MENU
        // ============================================================
        const menuToggle = document.getElementById('menuToggle');
        const flyoutMenu = document.getElementById('flyoutMenu');
        const flyoutOverlay = document.getElementById('flyoutOverlay');

        if (menuToggle && flyoutMenu && flyoutOverlay) {
            menuToggle.addEventListener('click', function() {
                const open = flyoutMenu.classList.toggle('open');
                flyoutOverlay.classList.toggle('open');
                menuToggle.innerHTML = open ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
            });
            flyoutOverlay.addEventListener('click', function() {
                flyoutMenu.classList.remove('open');
                flyoutOverlay.classList.remove('open');
                menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
            });
        }

        // ============================================================
        // USER INFO & UPTIME
        // ============================================================
        fetch('/api/user', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const display = document.getElementById('userDisplay');
                    if (display) {
                        const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                        display.textContent = roleMap[data.data.role] || data.data.username;
                    }
                }
            })
            .catch(() => {});

        // آپتایم با localStorage برای حفظ بین صفحات
        let uptimeStartTime = localStorage.getItem('uptimeStartTime');
        if (uptimeStartTime) {
            uptimeStartTime = parseInt(uptimeStartTime);
        } else {
            fetch('/stats')
                .then(res => res.json())
                .then(data => {
                    if (data.uptime) {
                        const parts = data.uptime.match(/(\d+)\s*(h|m|s)/g);
                        let totalSeconds = 0;
                        if (parts) {
                            parts.forEach(part => {
                                const num = parseInt(part);
                                const unit = part.slice(-1);
                                if (unit === 'h') totalSeconds += num * 3600;
                                else if (unit === 'm') totalSeconds += num * 60;
                                else if (unit === 's') totalSeconds += num;
                            });
                        }
                        uptimeStartTime = Date.now() - (totalSeconds * 1000);
                        localStorage.setItem('uptimeStartTime', uptimeStartTime);
                    }
                })
                .catch(() => {});
        }

        function updateUptimeDisplay() {
            const el = document.getElementById('uptimeDisplay');
            if (!el || !uptimeStartTime) return;
            const elapsed = Math.floor((Date.now() - uptimeStartTime) / 1000);
            if (elapsed < 60) el.textContent = elapsed + 's';
            else if (elapsed < 3600) el.textContent = Math.floor(elapsed / 60) + 'm ' + (elapsed % 60) + 's';
            else el.textContent = Math.floor(elapsed / 3600) + 'h ' + Math.floor((elapsed % 3600) / 60) + 'm';
        }
        updateUptimeDisplay();
        setInterval(updateUptimeDisplay, 1000);

        // ============================================================
        // SIDEBAR
        // ============================================================
        let sidebarOpen = false;

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('dbSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('open', sidebarOpen);
            if (overlay) overlay.classList.toggle('open', sidebarOpen);
        }

        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('dbSidebar');
            const toggleBtn = document.getElementById('sidebarToggleBtn');
            if (window.innerWidth <= 768 && sidebarOpen) {
                if (!sidebar?.contains(e.target) && !toggleBtn?.contains(e.target)) {
                    toggleSidebar();
                }
            }
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768 && sidebarOpen) {
                toggleSidebar();
            }
        });

        // ============================================================
        // TABS
        // ============================================================
        let currentTab = 'overview';
        let isLoading = false;
        const loadedTabs = new Set();

        function switchTab(tab) {
            if (isLoading) return;
            if (currentTab === tab && loadedTabs.has(tab)) return;

            currentTab = tab;
            const container = document.getElementById('tabContainer');
            const title = document.getElementById('pageTitle');

            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.toggle('active', item.dataset.tab === tab);
            });

            const titles = {
                'overview': '<i class="fas fa-chart-pie"></i> نمای کلی',
                'explorer': '<i class="fas fa-search"></i> کاوشگر',
                'monitor': '<i class="fas fa-chart-line"></i> مانیتورینگ',
                'postgresql': '<i class="fas fa-database" style="color:#3366ff;"></i> PostgreSQL',
                'redis': '<i class="fas fa-bolt" style="color:#ff4444;"></i> Redis',
                'sqlite': '<i class="fas fa-file" style="color:#00ff88;"></i> SQLite'
            };
            title.innerHTML = titles[tab] || tab;

            if (loadedTabs.has(tab)) {
                const content = document.getElementById('tabContent_' + tab);
                if (content) {
                    container.innerHTML = content.innerHTML;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const newScript = document.createElement('script');
                        newScript.textContent = old.textContent;
                        if (old.src) newScript.src = old.src;
                        old.parentNode.replaceChild(newScript, old);
                    });
                    const initFn = window['init_' + tab];
                    if (typeof initFn === 'function') setTimeout(initFn, 100);
                    if (window.innerWidth <= 768 && sidebarOpen) toggleSidebar();
                    return;
                }
            }

            isLoading = true;
            container.innerHTML = `
                <div class="loading-modern">
                    <div class="spinner-glow"></div>
                    <p>بارگذاری ${titles[tab]?.replace(/<[^>]*>/g, '') || tab}...</p>
                </div>
            `;

            fetch(`/static/db-parts/${tab}.html`)
                .then(res => {
                    if (!res.ok) throw new Error('تاب یافت نشد');
                    return res.text();
                })
                .then(html => {
                    loadedTabs.add(tab);
                    const contentDiv = document.createElement('div');
                    contentDiv.id = 'tabContent_' + tab;
                    contentDiv.innerHTML = html;
                    container.innerHTML = contentDiv.innerHTML;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const newScript = document.createElement('script');
                        newScript.textContent = old.textContent;
                        if (old.src) newScript.src = old.src;
                        old.parentNode.replaceChild(newScript, old);
                    });
                    const initFn = window['init_' + tab];
                    if (typeof initFn === 'function') setTimeout(initFn, 100);
                    if (window.innerWidth <= 768 && sidebarOpen) toggleSidebar();
                    isLoading = false;
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="card-glow">
                            <p style="color:#ff4444;text-align:center;padding:20px;">
                                ❌ خطا در بارگذاری: ${err.message}
                            </p>
                        </div>
                    `;
                    isLoading = false;
                });
        }

        function refreshAll() {
            loadedTabs.clear();
            switchTab(currentTab);
            updateSidebarDots();
            showToast('🔄 بروزرسانی شد', 'success');
        }

        // ============================================================
        // SIDEBAR DOTS
        // ============================================================
        function updateSidebarDots() {
            fetch('/health/database')
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.data) {
                        const dbs = data.data;
                        const pg = dbs.postgresql || {};
                        const redis = dbs.redis || {};
                        const sqlite = dbs.sqlite || {};

                        const pgDot = document.getElementById('dotPostgresql');
                        if (pgDot) pgDot.className = 'badge-dot ' + (pg.connected ? 'online' : 'offline');

                        const redisDot = document.getElementById('dotRedis');
                        if (redisDot) redisDot.className = 'badge-dot ' + (redis.connected ? 'online' : 'offline');

                        const sqliteDot = document.getElementById('dotSqlite');
                        if (sqliteDot) sqliteDot.className = 'badge-dot ' + (sqlite.connected ? 'online' : 'offline');

                        const overviewDot = document.getElementById('dotOverview');
                        if (overviewDot) {
                            const allOnline = pg.connected && redis.connected && sqlite.connected;
                            overviewDot.className = 'badge-dot ' + (allOnline ? 'online' : 'warning');
                        }
                    }
                })
                .catch(() => {});
        }

        // ============================================================
        // TIMESTAMP & TOAST
        // ============================================================
        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
        }
        setInterval(updateTimestamp, 1000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const colors = { info: '#00d4ff', success: '#00ff88', error: '#ff4444', warning: '#ff8800' };
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            toast.style.borderColor = colors[type] || colors.info;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 3000);
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            switchTab('overview');
            updateSidebarDots();
            setInterval(updateSidebarDots, 10000);
            console.log('🚀 Database page v2.0 loaded');
        });
    </script>

</body>
</html>
