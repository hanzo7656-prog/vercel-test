<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>مدیریت دیتابیس</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0a0e17;
            min-height: 100vh;
            font-family: 'Vazir', 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #1a2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dashboard-header .logo {
            font-size: 1rem;
            font-weight: bold;
            color: #00d4ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .status {
            color: #7a8fa3;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .dashboard-header .uptime {
            color: #4a5a6a;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
        }

        #userDisplay {
            color: #00d4ff;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .menu-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #0d1624;
            border: 1px solid #1a2a3a;
            color: #e0e6ed;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 200;
        }

        .menu-toggle:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .menu-toggle.open {
            border-color: #00d4ff;
            background: #00d4ff;
            color: #0a0e17;
        }

        /* ============================================================
           FLYOUT MENU
           ============================================================ */
        .flyout-menu {
            position: fixed;
            top: 70px;
            right: 12px;
            background: rgba(13, 22, 36, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            padding: 10px 0;
            min-width: 170px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150;
            transform-origin: top right;
        }

        .flyout-menu.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: all;
        }

        .flyout-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #a0b4c8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border-right: 2px solid transparent;
        }

        .flyout-menu a:hover {
            background: rgba(0, 212, 255, 0.05);
            color: #e0e6ed;
            border-right-color: #00d4ff;
        }

        .flyout-menu a.active {
            color: #00d4ff;
            border-right-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .flyout-menu .menu-divider {
            height: 1px;
            background: #1a2a3a;
            margin: 6px 16px;
        }

        .flyout-menu .menu-label {
            padding: 8px 16px 4px;
            font-size: 0.65rem;
            color: #4a5a6a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .flyout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .flyout-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px;
        }

        /* ============================================================
           PAGE HEADER
           ============================================================ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .page-header h1 {
            color: #e0e6ed;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-header h1 i {
            color: #00d4ff;
        }

        .page-header .subtitle {
            color: #7a8fa3;
            font-size: 0.75rem;
        }

        .page-header .timestamp {
            color: #4a5a6a;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
        }

        .page-header .btn-refresh {
            background: transparent;
            border: 1px solid #1a2a3a;
            color: #7a8fa3;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-header .btn-refresh:hover {
            border-color: #00d4ff;
            color: #e0e6ed;
        }

        /* ============================================================
           DB CARDS
           ============================================================ */
        .db-card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .db-card:hover {
            border-color: rgba(0, 212, 255, 0.15);
            transform: translateY(-2px);
        }

        /* ===== رنگ‌بندی هر دیتابیس ===== */
        .db-card.redis {
            border-left: 4px solid #ff4444;
        }
        .db-card.redis .db-icon { color: #ff4444; }

        .db-card.postgresql {
            border-left: 4px solid #3366ff;
        }
        .db-card.postgresql .db-icon { color: #3366ff; }

        .db-card.sqlite {
            border-left: 4px solid #00ff88;
        }
        .db-card.sqlite .db-icon { color: #00ff88; }

        .db-card .db-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .db-card .db-header .db-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .db-card .db-header .db-info .db-icon {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
        }

        .db-card .db-header .db-info .db-name {
            color: #e0e6ed;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .db-card .db-header .db-info .db-description {
            color: #7a8fa3;
            font-size: 0.7rem;
        }

        .db-card .db-header .db-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .db-card .db-header .db-status.online {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .db-card .db-header .db-status.offline {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.2);
        }

        .db-card .db-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
        }

        .db-card .db-body .db-field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .db-card .db-body .db-field label {
            color: #7a8fa3;
            font-size: 0.65rem;
            font-weight: 500;
        }

        .db-card .db-body .db-field .db-value {
            color: #e0e6ed;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
            background: #0a0e17;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #1a2a3a;
            word-break: break-all;
        }

        .db-card .db-body .db-field .db-value .masked {
            color: #4a5a6a;
        }

        /* ===== توکن با چشم ===== */
        .token-wrapper {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .token-wrapper .db-value {
            flex: 1;
            min-width: 0;
        }

        .token-wrapper .action-btn {
            background: transparent;
            border: 1px solid #1a2a3a;
            border-radius: 6px;
            color: #7a8fa3;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            min-height: 28px;
        }

        .token-wrapper .action-btn:hover {
            border-color: #00d4ff;
            color: #e0e6ed;
        }

        .token-wrapper .action-btn.active {
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .token-wrapper .action-btn.copied {
            border-color: #00ff88;
            color: #00ff88;
        }

        /* ===== آمار دیتابیس ===== */
        .db-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #0d1624;
        }

        .db-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #4a5a6a;
            font-size: 0.65rem;
        }

        .db-stats .stat-item i {
            color: #7a8fa3;
            font-size: 0.6rem;
        }

        .db-stats .stat-item .stat-value {
            color: #e0e6ed;
            font-weight: 500;
        }

        /* ============================================================
           SUMMARY CARD
           ============================================================ */
        .summary-card {
            background: linear-gradient(145deg, #111d2b, #0d1624);
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .summary-card .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .summary-card .summary-item {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            background: #0a0e17;
            border: 1px solid #1a2a3a;
        }

        .summary-card .summary-item .summary-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .summary-card .summary-item .summary-label {
            color: #7a8fa3;
            font-size: 0.6rem;
            margin-top: 2px;
        }

        .summary-card .summary-item .summary-number.online { color: #00ff88; }
        .summary-card .summary-item .summary-number.offline { color: #ff4444; }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1a2a3a;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 10px 20px;
            background: #1a2a3a;
            color: #e0e6ed;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            font-size: 0.85rem;
            transition: all 0.3s ease;
            width: 100%;
            pointer-events: all;
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .toast.success { border-color: #00ff88; }
        .toast.error { border-color: #ff4444; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (min-width: 768px) {
            .dashboard-header {
                padding: 16px 24px;
            }
            .dashboard-header .logo {
                font-size: 1.3rem;
            }
            .dashboard-header .status {
                font-size: 0.85rem;
            }
            .dashboard-header .uptime {
                font-size: 0.8rem;
            }
            #userDisplay {
                font-size: 0.85rem;
            }
            .menu-toggle {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }
            .flyout-menu {
                top: 80px;
                right: 20px;
                min-width: 200px;
            }
            .flyout-menu a {
                padding: 12px 20px;
                font-size: 0.95rem;
            }
            .container {
                padding: 20px;
            }
            .page-header h1 {
                font-size: 1.6rem;
            }
            .page-header .subtitle {
                font-size: 0.9rem;
            }
            .page-header .timestamp {
                font-size: 0.8rem;
            }
            .db-card {
                padding: 20px 24px;
                margin-bottom: 16px;
                border-radius: 16px;
            }
            .db-card .db-header .db-info .db-name {
                font-size: 1.1rem;
            }
            .db-card .db-body {
                grid-template-columns: 1fr 1fr;
                gap: 12px 24px;
            }
            .db-card .db-body .db-field label {
                font-size: 0.75rem;
            }
            .db-card .db-body .db-field .db-value {
                font-size: 0.85rem;
                padding: 6px 12px;
            }
            .summary-card .summary-grid {
                gap: 16px;
            }
            .summary-card .summary-item .summary-number {
                font-size: 1.5rem;
            }
            .summary-card .summary-item .summary-label {
                font-size: 0.75rem;
            }
            .token-wrapper .action-btn {
                min-width: 34px;
                min-height: 34px;
                font-size: 0.8rem;
                padding: 4px 10px;
            }
        }

        @media (max-width: 480px) {
            .db-card .db-body {
                grid-template-columns: 1fr;
            }
            .dashboard-header .uptime {
                display: none;
            }
            .flyout-menu {
                right: 8px;
                top: 60px;
                min-width: 150px;
            }
            .flyout-menu a {
                font-size: 0.8rem;
                padding: 8px 14px;
            }
            .page-header h1 {
                font-size: 1rem;
            }
            .summary-card .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 380px) {
            .summary-card .summary-grid {
                grid-template-columns: 1fr;
            }
            .db-stats {
                flex-direction: column;
                gap: 4px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .dashboard-header {
                padding: 6px 12px;
            }
            .dashboard-header .logo {
                font-size: 0.8rem;
            }
            .db-card {
                padding: 10px 14px;
                margin-bottom: 8px;
            }
            .db-card .db-body {
                grid-template-columns: 1fr 1fr;
                gap: 4px 12px;
            }
            .db-card .db-header .db-info .db-name {
                font-size: 0.8rem;
            }
            .db-card .db-body .db-field .db-value {
                font-size: 0.7rem;
                padding: 2px 6px;
            }
            .container {
                padding: 6px 8px;
            }
            .summary-card {
                padding: 10px;
            }
            .summary-card .summary-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .page-header h1 {
                font-size: 0.9rem;
            }
            .flyout-menu {
                top: 50px;
                right: 8px;
                min-width: 140px;
            }
            .flyout-menu a {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- منو -->
    <div id="navContainer"></div>

    <!-- محتوا -->
    <div class="container">

        <!-- هدر -->
        <div class="page-header">
            <div>
                <h1><i class="fas fa-database"></i> مدیریت دیتابیس</h1>
                <span class="subtitle">وضعیت و اطلاعات اتصالات دیتابیس</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <span class="timestamp" id="pageTimestamp"></span>
                <button class="btn-refresh" onclick="loadDbStatus()">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <!-- خلاصه -->
        <div class="summary-card" id="summaryCard">
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-number" id="totalDbs">-</div>
                    <div class="summary-label">کل دیتابیس‌ها</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number online" id="onlineDbs">-</div>
                    <div class="summary-label">✅ متصل</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number offline" id="offlineDbs">-</div>
                    <div class="summary-label">❌ قطع</div>
                </div>
            </div>
        </div>

        <!-- محتوای دیتابیس‌ها -->
        <div id="dbContent">
            <div class="loading">
                <div class="spinner"></div>
                <p style="color:#7a8fa3;font-size:0.8rem;">در حال دریافت اطلاعات...</p>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/menu.js"></script>
    <script>
        // ============================================================
        // بارگذاری منو
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/static/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    if (typeof initMenu === 'function') initMenu();
                    loadUserInfo();
                })
                .catch(err => console.error('❌ خطا در بارگذاری منو:', err));
        }

        function loadUserInfo() {
            fetch('/api/user', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const display = document.getElementById('userDisplay');
                        if (display) {
                            const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                            display.textContent = roleMap[data.data.role] || data.data.username;
                        }
                    }
                })
                .catch(() => {});
        }

        // ============================================================
        // آپدیت تاریخ و ساعت
        // ============================================================
        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) {
                el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
            }
        }

        // ============================================================
        // بارگذاری وضعیت دیتابیس
        // ============================================================
        function loadDbStatus() {
            const container = document.getElementById('dbContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p style="color:#7a8fa3;font-size:0.8rem;">در حال دریافت...</p></div>';

            fetch('/health/database')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderDbStatus(data.data);
                        updateSummary(data.data);
                    } else {
                        container.innerHTML = `<div class="db-card"><p style="color:#ff4444;text-align:center;">❌ ${data.error || 'خطا در دریافت اطلاعات'}</p></div>`;
                    }
                })
                .catch(err => {
                    container.innerHTML = `<div class="db-card"><p style="color:#ff4444;text-align:center;">❌ خطا: ${err.message}</p></div>`;
                });

            updateTimestamp();
        }

        // ============================================================
        // آپدیت خلاصه
        // ============================================================
        function updateSummary(dbData) {
            const dbNames = Object.keys(dbData);
            const total = dbNames.length;
            let online = 0;
            let offline = 0;

            for (const name of dbNames) {
                if (dbData[name].connected && dbData[name].ping) {
                    online++;
                } else {
                    offline++;
                }
            }

            document.getElementById('totalDbs').textContent = total;
            document.getElementById('onlineDbs').textContent = online;
            document.getElementById('offlineDbs').textContent = offline;
        }

        // ============================================================
        // رندر وضعیت دیتابیس‌ها
        // ============================================================
        function renderDbStatus(dbData) {
            const container = document.getElementById('dbContent');
            const dbNames = Object.keys(dbData);

            if (dbNames.length === 0) {
                container.innerHTML = `
                    <div class="db-card">
                        <p style="color:#7a8fa3;text-align:center;padding:20px;">
                            📭 هیچ دیتابیسی پیکربندی نشده است
                        </p>
                    </div>
                `;
                return;
            }

            let html = '';

            // رنگ‌بندی و آیکون هر دیتابیس
            const dbStyles = {
                'redis': { icon: 'fa-bolt', class: 'redis', label: 'کش و داده‌های سریع' },
                'postgresql': { icon: 'fa-database', class: 'postgresql', label: 'داده‌های اصلی و ماندگار' },
                'sqlite': { icon: 'fa-file', class: 'sqlite', label: 'بک‌آپ و گزارش‌ها' }
            };

            for (const name of dbNames) {
                const info = dbData[name];
                const style = dbStyles[name] || dbStyles['postgresql'];
                const isConnected = info.connected && info.ping;

                // ماسک کردن رمز/توکن
                const password = info.password || info.token || '';
                const maskedPassword = password.length > 10 ? password.substring(0, 6) + '••••••••' : (password || '••••••••');

                // آمار (اگه موجود باشه)
                const stats = info.stats || {};
                const statsHtml = Object.keys(stats).length > 0 ? `
                    <div class="db-stats">
                        ${Object.entries(stats).map(([key, value]) => `
                            <span class="stat-item">
                                <i class="fas fa-chart-simple"></i>
                                ${key}: <span class="stat-value">${value}</span>
                            </span>
                        `).join('')}
                    </div>
                ` : '';

                html += `
                    <div class="db-card ${style.class}">
                        <div class="db-header">
                            <div class="db-info">
                                <span class="db-icon"><i class="fas ${style.icon}"></i></span>
                                <span class="db-name">${name}</span>
                                <span class="db-description">${style.label}</span>
                            </div>
                            <span class="db-status ${isConnected ? 'online' : 'offline'}">
                                ${isConnected ? '✅ متصل' : '❌ قطع'}
                            </span>
                        </div>

                        <div class="db-body">
                            <div class="db-field">
                                <label>📡 آدرس</label>
                                <div class="db-value">${info.host || info.url || '-'}</div>
                            </div>
                            <div class="db-field">
                                <label>🔑 رمز عبور / توکن</label>
                                <div class="token-wrapper">
                                    <div class="db-value" id="password_display_${name}">${maskedPassword}</div>
                                    <button class="action-btn" onclick="togglePassword('${name}')" title="نمایش/پنهان کردن">
                                        <i class="fas fa-eye" id="eye_${name}"></i>
                                    </button>
                                    <button class="action-btn" onclick="copyPassword('${name}')" title="کپی">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="db-field">
                                <label>📊 وضعیت</label>
                                <div class="db-value">${info.enabled ? '✅ فعال' : '⛔ غیرفعال'}</div>
                            </div>
                            <div class="db-field">
                                <label>📡 Ping</label>
                                <div class="db-value" style="color:${isConnected ? '#00ff88' : '#ff4444'};">${isConnected ? '✅ پاسخ می‌دهد' : '❌ پاسخ نمی‌دهد'}</div>
                            </div>
                        </div>

                        ${statsHtml}
                    </div>
                `;
            }

            // دکمه بروزرسانی
            html += `
                <div style="text-align:center;margin-top:12px;">
                    <button class="btn-refresh" onclick="loadDbStatus()" style="padding:8px 20px;">
                        <i class="fas fa-sync-alt"></i> بروزرسانی مجدد
                    </button>
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================================
        // نمایش/پنهان کردن رمز
        // ============================================================
        let passwordVisible = {};

        function togglePassword(name) {
            const display = document.getElementById(`password_display_${name}`);
            const eye = document.getElementById(`eye_${name}`);
            if (!display || !eye) return;

            if (passwordVisible[name]) {
                // پنهان
                const original = display.getAttribute('data-original') || display.textContent;
                display.textContent = original.length > 10 ? original.substring(0, 6) + '••••••••' : '••••••••';
                eye.className = 'fas fa-eye';
                passwordVisible[name] = false;
            } else {
                // نمایش
                const original = display.getAttribute('data-original');
                if (original) {
                    display.textContent = original;
                } else {
                    // ذخیره مقدار اصلی
                    const current = display.textContent;
                    if (current.includes('••••••••')) {
                        // اگه ماسک شده، از دیتابیس میخواهیم
                        fetch('/health/database')
                            .then(res => res.json())
                            .then(data => {
                                if (data.success && data.data[name]) {
                                    const pw = data.data[name].password || data.data[name].token || '';
                                    display.setAttribute('data-original', pw);
                                    display.textContent = pw;
                                    eye.className = 'fas fa-eye-slash';
                                    passwordVisible[name] = true;
                                }
                            })
                            .catch(() => {});
                        return;
                    }
                    display.setAttribute('data-original', current);
                }
                eye.className = 'fas fa-eye-slash';
                passwordVisible[name] = true;
            }
        }

        // ============================================================
        // کپی رمز
        // ============================================================
        function copyPassword(name) {
            const display = document.getElementById(`password_display_${name}`);
            if (!display) return;

            // اگه ماسک شده، ابتدا نمایش بده
            let text = display.textContent;
            if (text.includes('••••••••')) {
                // از دیتابیس بگیر
                fetch('/health/database')
                    .then(res => res.json())
                    .then(data => {
                        if (data.success && data.data[name]) {
                            const pw = data.data[name].password || data.data[name].token || '';
                            copyToClipboard(pw);
                        }
                    })
                    .catch(() => {});
                return;
            }

            copyToClipboard(text);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 کپی شد!', 'success');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('📋 کپی شد!', 'success');
            } catch {
                showToast('❌ کپی نشد!', 'error');
            }
            document.body.removeChild(textarea);
        }

        // ============================================================
        // Toast
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const colors = { info: '#00d4ff', success: '#00ff88', error: '#ff4444' };
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            toast.style.borderColor = colors[type] || colors.info;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // ============================================================
        // راه‌اندازی
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadDbStatus();
            setInterval(loadDbStatus, 30000);
            setInterval(updateTimestamp, 1000);
        });
    </script>

</body>
</html>
