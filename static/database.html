<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
    .monitor-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
    }
    .monitor-grid .full-width {
        grid-column: 1 / -1;
    }
    .chart-container {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-glow);
        border-radius: 12px;
        padding: 16px;
        position: relative;
        height: 220px;
        transition: all 0.3s ease;
    }
    .chart-container:hover {
        border-color: rgba(0, 212, 255, 0.15);
    }
    .chart-container .chart-title {
        font-size: 0.7rem;
        color: var(--text-secondary);
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .chart-container .chart-title .live-badge {
        font-size: 0.55rem;
        padding: 2px 10px;
        border-radius: 20px;
        background: rgba(0, 255, 136, 0.1);
        color: var(--accent-green);
        border: 1px solid rgba(0, 255, 136, 0.15);
        animation: pulse-badge 2s infinite;
    }
    @keyframes pulse-badge {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }
    .chart-container canvas {
        width: 100% !important;
        height: calc(100% - 24px) !important;
    }

    .monitor-stats-bar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 16px;
    }
    .monitor-stat {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-glow);
        border-radius: 12px;
        padding: 14px 16px;
        text-align: center;
        transition: all 0.3s ease;
    }
    .monitor-stat:hover {
        border-color: rgba(0, 212, 255, 0.15);
        transform: translateY(-2px);
    }
    .monitor-stat .stat-value {
        font-size: 1.6rem;
        font-weight: 700;
        font-family: 'Courier New', monospace;
        color: var(--text-primary);
        transition: color 0.3s ease;
    }
    .monitor-stat .stat-value.cyan { color: var(--accent-cyan); }
    .monitor-stat .stat-value.green { color: var(--accent-green); }
    .monitor-stat .stat-value.orange { color: var(--accent-orange); }
    .monitor-stat .stat-value.pink { color: var(--accent-pink); }
    .monitor-stat .stat-value.purple { color: var(--accent-purple); }
    .monitor-stat .stat-label {
        font-size: 0.6rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 2px;
    }
    .monitor-stat .stat-sub {
        font-size: 0.55rem;
        color: var(--text-secondary);
        margin-top: 4px;
        opacity: 0.5;
    }

    .logs-container {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-glow);
        border-radius: 12px;
        padding: 16px;
        max-height: 150px;
        overflow-y: auto;
        font-family: 'Courier New', monospace;
        font-size: 0.65rem;
        line-height: 1.8;
        color: var(--text-secondary);
    }
    .logs-container::-webkit-scrollbar { width: 3px; }
    .logs-container::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }
    .logs-container .log-entry {
        display: flex;
        gap: 12px;
        padding: 2px 0;
        border-bottom: 1px solid rgba(0, 212, 255, 0.02);
    }
    .logs-container .log-entry .log-time {
        color: var(--text-secondary);
        opacity: 0.4;
        min-width: 70px;
    }
    .logs-container .log-entry .log-msg {
        color: var(--text-primary);
    }
    .logs-container .log-entry .log-msg.info { color: var(--accent-cyan); }
    .logs-container .log-entry .log-msg.success { color: var(--accent-green); }
    .logs-container .log-entry .log-msg.warning { color: var(--accent-orange); }
    .logs-container .log-entry .log-msg.error { color: #ff4444; }

    @media (max-width: 1024px) {
        .monitor-grid { grid-template-columns: 1fr; }
        .monitor-stats-bar { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
        .monitor-stats-bar { grid-template-columns: 1fr 1fr; gap: 8px; }
        .monitor-stat { padding: 10px 12px; }
        .monitor-stat .stat-value { font-size: 1.2rem; }
        .chart-container { height: 180px; padding: 12px; }
    }
    @media (max-width: 480px) {
        .monitor-stats-bar { grid-template-columns: 1fr 1fr; gap: 8px; }
        .monitor-stat { padding: 8px 10px; }
        .monitor-stat .stat-value { font-size: 1rem; }
        .chart-container { height: 150px; }
        .logs-container { max-height: 120px; font-size: 0.55rem; }
    }
</style>

<!-- HTML STRUCTURE -->

        <span style="font-size:0.9rem;font-weight:500;color:var(--text-primary);">

<!-- CHARTS - فقط دیتابیس -->
<div class="monitor-grid">
    <!-- نمودار فضای دیسک -->
    <div class="chart-container">
        <div class="chart-title">
            <span><i class="fas fa-hdd" style="color:var(--accent-orange);"></i> فضای دیسک</span>
            <span class="live-badge">● LIVE</span>
        </div>
        <canvas id="diskChart"></canvas>
    </div>

    <!-- نمودار اتصالات دیتابیس -->
    <div class="chart-container">
        <div class="chart-title">
            <span><i class="fas fa-plug" style="color:var(--accent-cyan);"></i> اتصالات دیتابیس</span>
            <span class="live-badge">● LIVE</span>
        </div>
        <canvas id="connectionsChart"></canvas>
    </div>

    <!-- نمودار وضعیت دیتابیس‌ها (دایره‌ای) -->

<div class="logs-container" id="monitorLogs">
    <div class="log-entry">
        <span class="log-time">⏳</span>
        <span class="log-msg info">در انتظار شروع مانیتورینگ...</span>
    </div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
let monitorRunning = true;
let monitorInterval = null;
let logCounter = 0;

// داده‌های نمودارها
const diskData = [];
const connectionsData = [];
const timeLabels = [];
const MAX_DATA_POINTS = 30;

// نمونه‌های Chart.js
let diskChartInstance = null;
let connectionsChartInstance = null;
let dbStatusChartInstance = null;

// ============================================================
// INIT
// ============================================================
function init_monitor() {
    console.log('📊 راه‌اندازی مانیتورینگ دیتابیس...');
    initCharts();
    updateStats();
    addLog('🚀 مانیتورینگ دیتابیس شروع شد', 'success');

    monitorInterval = setInterval(() => {
        updateStats();
        updateCharts();
    }, 3000);
}

// ============================================================
// CHARTS
// ============================================================
function initCharts() {
    // 1. نمودار فضای دیسک
    const ctx1 = document.getElementById('diskChart')?.getContext('2d');
    if (ctx1) {
        diskChartInstance = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: ['فضای استفاده شده', 'فضای خالی'],
                datasets: [{
                    data: [40, 60],
                    backgroundColor: ['#ff8800', '#1a2a3a'],
                    borderColor: 'transparent',
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#7a8fa8',
                            font: { size: 9, family: 'Vazir' },
                            padding: 8,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(8, 12, 24, 0.9)',
                        borderColor: 'rgba(0, 212, 255, 0.15)',
                        borderWidth: 1,
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + context.parsed + '%';
                            }
                        }
                    }
                },
                cutout: '65%'
            }
        });
    }

    // 2. نمودار اتصالات دیتابیس
    const ctx2 = document.getElementById('connectionsChart')?.getContext('2d');
    if (ctx2) {
        connectionsChartInstance = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: timeLabels,
                datasets: [{
                    label: 'اتصالات فعال',
                    data: connectionsData,
                    borderColor: '#00d4ff',
                    backgroundColor: 'rgba(0, 212, 255, 0.05)',
                    borderWidth: 2,
                    pointRadius: 2,
                    pointBackgroundColor: '#00d4ff',
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            color: '#7a8fa8',
                            font: { size: 8, family: 'Vazir' },
                            boxWidth: 10,
                            padding: 4,
                            usePointStyle: true,
                            pointStyle: 'line'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(8, 12, 24, 0.9)',
                        borderColor: 'rgba(0, 212, 255, 0.15)',
                        borderWidth: 1,
                        titleColor: '#e8eef7',
                        bodyColor: '#00d4ff',
                        bodyFont: { size: 10 }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255,255,255,0.02)' },
                        ticks: { color: '#4a5a6a', font: { size: 6, family: 'Vazir' }, maxTicksLimit: 10 }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255,255,255,0.02)' },
                        ticks: { color: '#4a5a6a', font: { size: 7 } }
                    }
                },
                animation: {
                    duration: 500,
                    easing: 'easeOutQuart'
                }
            }
        });
    }

    // 3. نمودار وضعیت دیتابیس‌ها
    const ctx3 = document.getElementById('dbStatusChart')?.getContext('2d');
    if (ctx3) {
        dbStatusChartInstance = new Chart(ctx3, {
            type: 'doughnut',
            data: {
                labels: ['PostgreSQL', 'Redis', 'SQLite'],
                datasets: [{
                    data: [1, 1, 1],
                    backgroundColor: ['#3366ff', '#ff4444', '#00ff88'],
                    borderColor: 'transparent',
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#7a8fa8',
                            font: { size: 9, family: 'Vazir' },
                            padding: 8,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(8, 12, 24, 0.9)',
                        borderColor: 'rgba(0, 212, 255, 0.15)',
                        borderWidth: 1,
                        callbacks: {
                            label: function(context) {
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percent = total > 0 ? (context.parsed / total * 100).toFixed(1) : 0;
                                return context.label + ': ' + (context.parsed === 1 ? '🟢 متصل' : '🔴 قطع');
                            }
                        }
                    }
                },
                cutout: '65%'
            }
        });
    }
}

// ============================================================
// UPDATE STATS (فقط دیتابیس)
// ============================================================
function updateStats() {
    const now = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    // 1. اتصالات دیتابیس
    fetch('/health/database')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const entries = Object.entries(data.data);
                let connected = 0;
                entries.forEach(([name, info]) => {
                    if (info.connected) connected++;
                });
                const el = document.getElementById('statConnections');
                if (el) {
                    el.textContent = connected + '/' + entries.length;
                    el.className = 'stat-value ' + (connected === entries.length ? 'green' : 'orange');
                }

                // به‌روزرسانی نمودار دایره‌ای
                if (dbStatusChartInstance) {
                    const statuses = entries.map(([_, info]) => info.connected ? 1 : 0);
                    dbStatusChartInstance.data.datasets[0].data = statuses;
                    dbStatusChartInstance.update();
                }
            }
        })
        .catch(() => {});

    // 2. حجم دیتابیس
    fetch('/api/db/postgresql/tables')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                let totalSize = 0;
                let totalTables = 0;
                data.data.forEach(t => {
                    totalSize += t.size_mb || 0;
                    totalTables++;
                });
                const el = document.getElementById('statDbSize');
                if (el) {
                    el.textContent = totalSize.toFixed(1) + ' MB';
                    el.className = 'stat-value ' + (totalSize > 500 ? 'orange' : 'green');
                }
                const el2 = document.getElementById('statTables');
                if (el2) {
                    el2.textContent = totalTables;
                    el2.className = 'stat-value cyan';
                }
            }
        })
        .catch(() => {});

    // 3. فضای دیسک (از Scheduler)
    fetch('/api/metrics')
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                const metrics = data.data.metrics || {};
                const disk = metrics.disk_space?.value || {};
                const used = disk.percent || 0;
                const el = document.getElementById('statDiskUsage');
                if (el) {
                    el.textContent = used + '%';
                    el.className = 'stat-value ' + (used > 80 ? 'pink' : used > 60 ? 'orange' : 'green');
                }
                // به‌روزرسانی نمودار دیسک
                if (diskChartInstance) {
                    diskChartInstance.data.datasets[0].data = [used, 100 - used];
                    diskChartInstance.update();
                }
            }
        })
        .catch(() => {});

    // لاگ دوره‌ای
    if (logCounter % 5 === 0) {
        const statuses = [
            '✅ دیتابیس‌ها پایدار هستند',
            '📊 بروزرسانی متریک‌ها',
            '🔄 چرخه مانیتورینگ فعال'
        ];
        const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
        addLog(`${now} - ${randomStatus}`, 'info');
    }
    logCounter++;
}

// ============================================================
// UPDATE CHARTS DATA
// ============================================================
function updateCharts() {
    const now = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

    // اتصالات (شبیه‌سازی با داده‌های واقعی)
    fetch('/health/database')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.data) {
                const entries = Object.entries(data.data);
                let connected = 0;
                entries.forEach(([_, info]) => {
                    if (info.connected) connected++;
                });
                connectionsData.push(connected);
                if (connectionsData.length > MAX_DATA_POINTS) connectionsData.shift();

                timeLabels.push(now);
                if (timeLabels.length > MAX_DATA_POINTS) timeLabels.shift();

                if (connectionsChartInstance) {
                    connectionsChartInstance.data.labels = timeLabels;
                    connectionsChartInstance.data.datasets[0].data = connectionsData;
                    connectionsChartInstance.update('none');
                }
            }
        })
        .catch(() => {});
}

// ============================================================
// LOGS
// ============================================================
function addLog(message, type = 'info') {
    const container = document.getElementById('monitorLogs');
    if (!container) return;

    const time = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `
        <span class="log-time">${time}</span>
        <span class="log-msg ${type}">${message}</span>
    `;

    container.appendChild(entry);
    while (container.children.length > 50) {
        container.removeChild(container.firstChild);
    }
    container.scrollTop = container.scrollHeight;
}

function clearMonitorLogs() {
    const container = document.getElementById('monitorLogs');
    if (container) {
        container.innerHTML = `
            <div class="log-entry">
                <span class="log-time">🧹</span>
                <span class="log-msg info">لاگ‌ها پاک شدند</span>
            </div>
        `;
    }
    showToast('🧹 لاگ‌ها پاک شدند', 'info');
}

function refreshMonitor() {
    if (diskChartInstance) diskChartInstance.update();
    if (connectionsChartInstance) connectionsChartInstance.update();
    if (dbStatusChartInstance) dbStatusChartInstance.update();
    updateStats();
    addLog('🔄 بروزرسانی دستی', 'info');
    showToast('🔄 بروزرسانی شد', 'success');
}

function showToast(message, type = 'info') {
    const colors = { info: '#00d4ff', success: '#00ff88', error: '#ff4444', warning: '#ff8800' };
    const toast = document.createElement('div');
    toast.textContent = message;
    Object.assign(toast.style, {
        position: 'fixed',
        bottom: '20px',
        left: '50%',
        transform: 'translateX(-50%)',
        padding: '10px 24px',
        background: 'rgba(8,12,24,0.95)',
        backdropFilter: 'blur(20px)',
        border: `2px solid ${colors[type] || colors.info}`,
        borderRadius: '10px',
        color: '#e8eef7',
        fontSize: '0.85rem',
        zIndex: '9999',
        boxShadow: '0 8px 40px rgba(0,0,0,0.5)',
        transition: 'all 0.3s ease',
        maxWidth: '90%'
    });
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => document.body.removeChild(toast), 300);
    }, 3000);
}

// ============================================================
// AUTO START
// ============================================================
setTimeout(() => {
    if (document.getElementById('monitorStatsBar')) {
        init_monitor();
    }
}, 100);
</script>s
