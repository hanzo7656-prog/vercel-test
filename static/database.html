<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>مدیریت دیتابیس</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080c18; font-family: 'Segoe UI', 'Vazir', system-ui, sans-serif; color: #e8eef7; min-height: 100vh; }
        #navContainer { position: sticky; top: 0; z-index: 100; }
        .main-container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

        /* ===== HEADER ===== */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .page-header h1 { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .page-header h1 i { color: #00d4ff; }
        .page-header .subtitle { color: #7a8fa8; font-size: 0.8rem; }
        .page-header .timestamp { color: #4a5a6a; font-size: 0.65rem; font-family: 'Courier New', monospace; }

        /* ===== TABS ===== */
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: rgba(13, 22, 40, 0.6); border-radius: 12px; padding: 4px; border: 1px solid rgba(0, 212, 255, 0.06); overflow-x: auto; flex-wrap: wrap; }
        .tab-btn { padding: 8px 18px; background: transparent; border: none; border-radius: 8px; color: #7a8fa8; cursor: pointer; transition: all 0.3s ease; font-size: 0.8rem; font-family: inherit; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .tab-btn:hover { color: #e8eef7; background: rgba(0, 212, 255, 0.04); }
        .tab-btn.active { background: rgba(0, 212, 255, 0.08); color: #00d4ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== CARDS ===== */
        .db-card {
            background: rgba(13, 22, 40, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.06);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        .db-card:hover { border-color: rgba(0, 212, 255, 0.12); }
        .db-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
        .db-card .card-header h3 { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; color: #e8eef7; }
        .db-card .card-header h3 i { color: #00d4ff; }
        .db-card .card-header .badge { font-size: 0.55rem; padding: 2px 12px; border-radius: 20px; background: rgba(0, 212, 255, 0.06); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.08); }

        /* ===== STATS ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
        .stat-item { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(0, 212, 255, 0.06); border-radius: 12px; padding: 14px 16px; text-align: center; }
        .stat-item .stat-value { font-size: 1.4rem; font-weight: 700; font-family: 'Courier New', monospace; }
        .stat-item .stat-value.cyan { color: #00d4ff; }
        .stat-item .stat-value.green { color: #00ff88; }
        .stat-item .stat-value.orange { color: #ff8800; }
        .stat-item .stat-value.pink { color: #ff6b9d; }
        .stat-item .stat-label { font-size: 0.6rem; color: #7a8fa8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

        /* ===== TABLE ===== */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-modern { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        .table-modern th { text-align: right; padding: 8px 12px; color: #7a8fa8; font-weight: 500; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid rgba(0, 212, 255, 0.06); }
        .table-modern td { padding: 8px 12px; border-bottom: 1px solid rgba(0, 212, 255, 0.03); color: #e8eef7; }
        .table-modern tr:hover td { background: rgba(0, 212, 255, 0.02); }

        /* ===== CHIP ===== */
        .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 12px; border-radius: 20px; font-size: 0.6rem; font-weight: 500; }
        .chip.online { background: rgba(0, 255, 136, 0.08); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.12); }
        .chip.offline { background: rgba(255, 68, 68, 0.08); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.12); }
        .chip.cyan { background: rgba(0, 212, 255, 0.06); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.08); }
        .chip.warning { background: rgba(255, 136, 0, 0.08); color: #ff8800; border: 1px solid rgba(255, 136, 0, 0.12); }

        /* ===== SEARCH ===== */
        .search-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .search-bar input { flex: 1; padding: 8px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(0, 212, 255, 0.06); border-radius: 8px; color: #e8eef7; font-size: 0.8rem; font-family: inherit; min-width: 120px; }
        .search-bar input:focus { outline: none; border-color: #00d4ff; }
        .search-bar input::placeholder { color: #4a5a6a; opacity: 0.5; }
        .search-bar .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(0, 212, 255, 0.06); background: rgba(0, 212, 255, 0.04); color: #7a8fa8; cursor: pointer; font-size: 0.75rem; transition: all 0.3s ease; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
        .search-bar .btn:hover { border-color: #00d4ff; color: #e8eef7; background: rgba(0, 212, 255, 0.06); }

        /* ===== ROW ACTIONS ===== */
        .row-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .row-actions button { background: transparent; border: none; color: #7a8fa8; cursor: pointer; padding: 4px 6px; border-radius: 4px; transition: all 0.2s ease; font-size: 0.7rem; }
        .row-actions button:hover { color: #00d4ff; background: rgba(0, 212, 255, 0.04); }
        .row-actions button.danger:hover { color: #ff4444; background: rgba(255, 68, 68, 0.04); }

        /* ===== LOADING ===== */
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; gap: 14px; }
        .spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(0, 212, 255, 0.06); border-top: 3px solid #00d4ff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #7a8fa8; font-size: 0.8rem; }

        /* ===== TOAST ===== */
        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { padding: 10px 20px; background: rgba(8,12,24,0.95); backdrop-filter: blur(20px); border: 2px solid #00d4ff; border-radius: 10px; color: #e8eef7; font-size: 0.85rem; box-shadow: 0 8px 40px rgba(0,0,0,0.5); pointer-events: all; animation: slideUp 0.35s ease; text-align: center; width: 100%; }
        .toast.success { border-color: #00ff88; }
        .toast.error { border-color: #ff4444; }
        .toast.warning { border-color: #ff8800; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .main-container { padding: 12px 16px; } .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; } .stat-item .stat-value { font-size: 1.1rem; } .tabs { flex-wrap: nowrap; overflow-x: auto; } .tab-btn { font-size: 0.7rem; padding: 6px 12px; } }
        @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } .stat-item .stat-value { font-size: 1rem; } .table-modern { font-size: 0.65rem; } }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="main-container">

        <div class="page-header">
            <div>
                <h1><i class="fas fa-database"></i> مدیریت دیتابیس</h1>
                <span class="subtitle">مانیتورینگ و مدیریت دیتابیس‌های سیستم</span>
            </div>
            <span class="timestamp" id="pageTimestamp"></span>
        </div>

        <!-- TABS -->
        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')"><i class="fas fa-chart-pie"></i> نمای کلی</button>
            <button class="tab-btn" data-tab="postgresql" onclick="switchTab('postgresql')"><i class="fas fa-database" style="color:#3366ff;"></i> PostgreSQL</button>
            <button class="tab-btn" data-tab="redis" onclick="switchTab('redis')"><i class="fas fa-bolt" style="color:#ff4444;"></i> Redis</button>
            <button class="tab-btn" data-tab="sqlite" onclick="switchTab('sqlite')"><i class="fas fa-file" style="color:#00ff88;"></i> SQLite</button>
            <button class="tab-btn" data-tab="explorer" onclick="switchTab('explorer')"><i class="fas fa-search"></i> کاوشگر</button>
            <button class="tab-btn" data-tab="monitor" onclick="switchTab('monitor')"><i class="fas fa-chart-line"></i> مانیتورینگ</button>
        </div>

        <!-- TAB: OVERVIEW -->
        <div class="tab-content active" id="tab-overview">
            <div id="overviewContent">
                <div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>
            </div>
        </div>

        <!-- TAB: POSTGRESQL -->
        <div class="tab-content" id="tab-postgresql">
            <div id="postgresqlContent">
                <div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>
            </div>
        </div>

        <!-- TAB: REDIS -->
        <div class="tab-content" id="tab-redis">
            <div id="redisContent">
                <div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>
            </div>
        </div>

        <!-- TAB: SQLITE -->
        <div class="tab-content" id="tab-sqlite">
            <div id="sqliteContent">
                <div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>
            </div>
        </div>

        <!-- TAB: EXPLORER -->
        <div class="tab-content" id="tab-explorer">
            <div id="explorerContent">
                <div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>
            </div>
        </div>

        <!-- TAB: MONITOR -->
        <div class="tab-content" id="tab-monitor">
            <div id="monitorContent">
                <div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>
            </div>
        </div>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ===== LOAD NAV =====
        function loadNav() {
            const c = document.getElementById('navContainer');
            if (!c) return;
            fetch('/static/nav.html')
                .then(r => r.text())
                .then(h => {
                    c.innerHTML = h;
                    c.querySelectorAll('script').forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        old.parentNode.replaceChild(ns, old);
                    });
                    if (typeof initMenu === 'function') initMenu();
                })
                .catch(() => {});
        }

        // ===== TIMESTAMP =====
        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
        }
        setInterval(updateTimestamp, 1000);

        // ===== TABS =====
        let currentTab = 'overview';
        const loadedTabs = new Set();

        function switchTab(tab) {
            if (currentTab === tab && loadedTabs.has(tab)) return;
            currentTab = tab;

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));

            if (!loadedTabs.has(tab)) {
                loadTabContent(tab);
            }
        }

        function loadTabContent(tab) {
            const container = document.getElementById(tab + 'Content');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>';

            fetch('/static/db-parts/' + tab + '.html')
                .then(r => {
                    if (!r.ok) throw new Error('تاب یافت نشد');
                    return r.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    loadedTabs.add(tab);
                    container.querySelectorAll('script').forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        old.parentNode.replaceChild(ns, old);
                    });
                    const initFn = window['init_' + tab];
                    if (typeof initFn === 'function') setTimeout(initFn, 100);
                })
                .catch(() => {
                    container.innerHTML = `
                        <div class="db-card">
                            <p style="color:#ff4444;text-align:center;padding:20px;">
                                ❌ خطا در بارگذاری: تاب یافت نشد
                            </p>
                        </div>
                    `;
                });
        }

        // ===== TOAST =====
        function showToast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            if (!c) return;
            const colors = { info: '#00d4ff', success: '#00ff88', error: '#ff4444', warning: '#ff8800' };
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            t.style.borderColor = colors[type] || colors.info;
            c.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translateY(-10px)';
                setTimeout(() => t.remove(), 300);
            }, 3000);
        }

        // ===== LOAD OVERVIEW =====
        function loadOverview() {
            const container = document.getElementById('overviewContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>';

            fetch('/health/database')
                .then(r => r.json())
                .then(data => {
                    if (!data.success) throw new Error('خطا');
                    const dbs = data.data || {};
                    const entries = Object.entries(dbs);
                    let online = 0;
                    entries.forEach(([_, info]) => { if (info.connected) online++; });

                    let statsHtml = `
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-value cyan">${entries.length}</div><div class="stat-label">کل دیتابیس‌ها</div></div>
                            <div class="stat-item"><div class="stat-value green">${online}</div><div class="stat-label">متصل</div></div>
                            <div class="stat-item"><div class="stat-value pink">${entries.length - online}</div><div class="stat-label">قطع</div></div>
                            <div class="stat-item"><div class="stat-value orange">${new Date().toLocaleTimeString('fa-IR')}</div><div class="stat-label">آخرین بروزرسانی</div></div>
                        </div>
                        <div class="db-card">
                            <div class="card-header"><h3><i class="fas fa-server"></i> وضعیت دیتابیس‌ها</h3></div>
                            <div class="table-wrap">
                                <table class="table-modern">
                                    <thead><tr><th>نام</th><th>نوع</th><th>وضعیت</th><th>ورژن</th></tr></thead>
                                    <tbody>
                    `;

                    entries.forEach(([name, info]) => {
                        const status = info.connected ? 'online' : 'offline';
                        const icon = info.type === 'redis' ? '⚡' : info.type === 'postgresql' ? '🐘' : '📄';
                        statsHtml += `
                            <tr>
                                <td><strong>${icon} ${name}</strong></td>
                                <td>${info.type || '—'}</td>
                                <td><span class="chip ${status}">${info.connected ? '🟢 متصل' : '🔴 قطع'}</span></td>
                                <td>${info.version || '—'}</td>
                            </tr>
                        `;
                    });

                    statsHtml += `</tbody></table></div></div>`;
                    container.innerHTML = statsHtml;
                })
                .catch(() => {
                    container.innerHTML = `
                        <div class="db-card">
                            <p style="color:#ff4444;text-align:center;padding:20px;">❌ خطا در دریافت اطلاعات</p>
                        </div>
                    `;
                });
        }

        // ===== LOAD POSTGRESQL =====
        function loadPostgresql() {
            const container = document.getElementById('postgresqlContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>';

            fetch('/api/db/postgresql/tables')
                .then(r => r.json())
                .then(data => {
                    if (!data.success) throw new Error('خطا');
                    const tables = data.data || [];
                    let totalRows = 0, totalSize = 0;
                    tables.forEach(t => { totalRows += t.row_count || 0; totalSize += t.size_mb || 0; });

                    let html = `
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-value cyan">${tables.length}</div><div class="stat-label">جدول</div></div>
                            <div class="stat-item"><div class="stat-value green">${totalRows.toLocaleString()}</div><div class="stat-label">رکورد</div></div>
                            <div class="stat-item"><div class="stat-value orange">${totalSize.toFixed(1)} MB</div><div class="stat-label">حجم</div></div>
                        </div>
                        <div class="db-card">
                            <div class="card-header"><h3><i class="fas fa-table"></i> جدول‌ها</h3></div>
                            <div class="table-wrap">
                                <table class="table-modern">
                                    <thead><tr><th>نام جدول</th><th>رکورد</th><th>حجم (MB)</th><th>عملیات</th></tr></thead>
                                    <tbody>
                    `;

                    tables.forEach(t => {
                        html += `
                            <tr>
                                <td><strong>${t.table_name}</strong></td>
                                <td>${(t.row_count || 0).toLocaleString()}</td>
                                <td>${(t.size_mb || 0).toFixed(2)}</td>
                                <td><div class="row-actions"><button onclick="showToast('📋 نمایش ${t.table_name}', 'info')"><i class="fas fa-eye"></i></button></div></td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table></div></div>`;
                    container.innerHTML = html;
                })
                .catch(() => {
                    container.innerHTML = `<div class="db-card"><p style="color:#ff4444;text-align:center;padding:20px;">❌ خطا در دریافت اطلاعات</p></div>`;
                });
        }

        // ===== LOAD REDIS =====
        function loadRedis() {
            const container = document.getElementById('redisContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>';

            fetch('/api/db/redis/keys')
                .then(r => r.json())
                .then(data => {
                    if (!data.success) throw new Error('خطا');
                    const keys = data.data || [];

                    let html = `
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-value cyan">${keys.length}</div><div class="stat-label">کلید</div></div>
                            <div class="stat-item"><div class="stat-value green">${new Date().toLocaleTimeString('fa-IR')}</div><div class="stat-label">آخرین بروزرسانی</div></div>
                        </div>
                        <div class="db-card">
                            <div class="card-header"><h3><i class="fas fa-key"></i> کلیدها</h3></div>
                            <div class="table-wrap">
                                <table class="table-modern">
                                    <thead><tr><th>کلید</th><th>نوع</th><th>TTL</th><th>عملیات</th></tr></thead>
                                    <tbody>
                    `;

                    keys.slice(0, 30).forEach(k => {
                        html += `
                            <tr>
                                <td style="font-family:'Courier New',monospace;font-size:0.7rem;">${k.key}</td>
                                <td><span class="chip cyan">${k.type}</span></td>
                                <td>${k.ttl}</td>
                                <td><div class="row-actions"><button onclick="showToast('📋 مشاهده ${k.key}', 'info')"><i class="fas fa-eye"></i></button></div></td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table></div></div>`;
                    container.innerHTML = html;
                })
                .catch(() => {
                    container.innerHTML = `<div class="db-card"><p style="color:#ff4444;text-align:center;padding:20px;">❌ خطا در دریافت اطلاعات</p></div>`;
                });
        }

        // ===== LOAD SQLITE =====
        function loadSqlite() {
            const container = document.getElementById('sqliteContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>';

            fetch('/api/db/sqlite/tables')
                .then(r => r.json())
                .then(data => {
                    if (!data.success) throw new Error('خطا');
                    const tables = data.data || [];
                    let totalRows = 0;
                    tables.forEach(t => { totalRows += t.row_count || 0; });

                    let html = `
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-value cyan">${tables.length}</div><div class="stat-label">جدول</div></div>
                            <div class="stat-item"><div class="stat-value green">${totalRows.toLocaleString()}</div><div class="stat-label">رکورد</div></div>
                        </div>
                        <div class="db-card">
                            <div class="card-header"><h3><i class="fas fa-table"></i> جدول‌ها</h3></div>
                            <div class="table-wrap">
                                <table class="table-modern">
                                    <thead><tr><th>نام جدول</th><th>رکورد</th><th>عملیات</th></tr></thead>
                                    <tbody>
                    `;

                    tables.forEach(t => {
                        html += `
                            <tr>
                                <td><strong>${t.table_name}</strong></td>
                                <td>${(t.row_count || 0).toLocaleString()}</td>
                                <td><div class="row-actions"><button onclick="showToast('📋 نمایش ${t.table_name}', 'info')"><i class="fas fa-eye"></i></button></div></td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table></div></div>`;
                    container.innerHTML = html;
                })
                .catch(() => {
                    container.innerHTML = `<div class="db-card"><p style="color:#ff4444;text-align:center;padding:20px;">❌ خطا در دریافت اطلاعات</p></div>`;
                });
        }

        // ===== LOAD EXPLORER =====
        function loadExplorer() {
            const container = document.getElementById('explorerContent');
            container.innerHTML = `
                <div class="db-card">
                    <div class="card-header"><h3><i class="fas fa-search"></i> کاوشگر دیتابیس</h3></div>
                    <div class="search-bar">
                        <input type="text" id="explorerSearch" placeholder="جستجو..." onkeypress="if(event.key==='Enter') searchExplorer()">
                        <button class="btn" onclick="searchExplorer()"><i class="fas fa-search"></i> جستجو</button>
                        <button class="btn" onclick="clearExplorer()"><i class="fas fa-times"></i> پاک کردن</button>
                    </div>
                    <div id="explorerResults"><div class="no-data" style="text-align:center;color:#4a5a6a;padding:20px;">عبارت مورد نظر را وارد کنید</div></div>
                </div>
            `;
        }

        function searchExplorer() {
            const q = document.getElementById('explorerSearch').value.trim();
            const results = document.getElementById('explorerResults');
            if (!q) { results.innerHTML = '<div class="no-data" style="text-align:center;color:#4a5a6a;padding:20px;">عبارت مورد نظر را وارد کنید</div>'; return; }
            results.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال جستجو...</p></div>';

            fetch('/api/db/search?q=' + encodeURIComponent(q))
                .then(r => r.json())
                .then(data => {
                    if (!data.success) throw new Error('خطا');
                    const items = data.data || [];
                    if (items.length === 0) {
                        results.innerHTML = '<div class="no-data" style="text-align:center;color:#4a5a6a;padding:20px;">نتیجه‌ای یافت نشد</div>';
                        return;
                    }
                    let html = '';
                    items.forEach(item => {
                        html += `
                            <div style="padding:10px 14px;border-bottom:1px solid rgba(0,212,255,0.03);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                                <div><strong style="color:#00d4ff;">${item.database}</strong> • ${item.key || item.table || ''}</div>
                                <div style="font-size:0.65rem;color:#4a5a6a;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.content || ''}</div>
                            </div>
                        `;
                    });
                    results.innerHTML = html;
                })
                .catch(() => {
                    results.innerHTML = '<div class="no-data" style="text-align:center;color:#ff4444;padding:20px;">❌ خطا در جستجو</div>';
                });
        }

        function clearExplorer() {
            document.getElementById('explorerSearch').value = '';
            document.getElementById('explorerResults').innerHTML = '<div class="no-data" style="text-align:center;color:#4a5a6a;padding:20px;">عبارت مورد نظر را وارد کنید</div>';
        }

        // ===== LOAD MONITOR =====
        function loadMonitor() {
            const container = document.getElementById('monitorContent');
            container.innerHTML = `
                <div class="db-card">
                    <div class="card-header"><h3><i class="fas fa-chart-line"></i> مانیتورینگ دیتابیس</h3></div>
                    <div id="monitorStats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">
                        <div class="stat-item"><div class="stat-value cyan" id="monTotal">—</div><div class="stat-label">کل</div></div>
                        <div class="stat-item"><div class="stat-value green" id="monOnline">—</div><div class="stat-label">متصل</div></div>
                        <div class="stat-item"><div class="stat-value pink" id="monOffline">—</div><div class="stat-label">قطع</div></div>
                    </div>
                    <div id="monitorDetails"><div class="no-data" style="text-align:center;color:#4a5a6a;padding:20px;">در حال بارگذاری...</div></div>
                </div>
            `;

            fetch('/health/database')
                .then(r => r.json())
                .then(data => {
                    if (!data.success) throw new Error('خطا');
                    const dbs = data.data || {};
                    const entries = Object.entries(dbs);
                    let online = 0;
                    entries.forEach(([_, info]) => { if (info.connected) online++; });

                    document.getElementById('monTotal').textContent = entries.length;
                    document.getElementById('monOnline').textContent = online;
                    document.getElementById('monOffline').textContent = entries.length - online;

                    let html = '';
                    entries.forEach(([name, info]) => {
                        const status = info.connected ? '🟢 متصل' : '🔴 قطع';
                        html += `
                            <div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(0,212,255,0.03);">
                                <span><strong>${name}</strong> <span style="color:#4a5a6a;font-size:0.7rem;">${info.type || ''}</span></span>
                                <span style="color:${info.connected ? '#00ff88' : '#ff4444'};">${status}</span>
                            </div>
                        `;
                    });
                    document.getElementById('monitorDetails').innerHTML = html;
                })
                .catch(() => {
                    document.getElementById('monitorDetails').innerHTML = '<div class="no-data" style="text-align:center;color:#ff4444;padding:20px;">❌ خطا</div>';
                });
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadOverview();
            setInterval(() => { if (currentTab === 'overview') loadOverview(); }, 30000);
        });

        // ===== TAB LOAD FUNCTIONS =====
        window.init_overview = loadOverview;
        window.init_postgresql = loadPostgresql;
        window.init_redis = loadRedis;
        window.init_sqlite = loadSqlite;
        window.init_explorer = loadExplorer;
        window.init_monitor = loadMonitor;

        console.log('🚀 Database page v3.0 loaded');
    </script>

</body>
</html>
