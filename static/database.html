<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>مدیریت پیشرفته دیتابیس</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           BASE - طراحی مدرن با حس تحلیلگر
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #080c18;
            --bg-card: rgba(13, 22, 40, 0.75);
            --border-glow: rgba(0, 212, 255, 0.12);
            --text-primary: #e8eef7;
            --text-secondary: #7a8fa8;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-purple: #a855f7;
            --accent-pink: #ff6b9d;
            --accent-orange: #ff8800;
            --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        body {
            background: var(--bg-deep);
            font-family: 'Segoe UI', 'Vazir', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: rgba(8, 12, 24, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glow);
            padding: 10px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .logo {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .header .logo i { -webkit-text-fill-color: var(--accent-cyan); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .menu-toggle {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .menu-toggle:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-cyan);
        }

        /* ============================================================
           FLYOUT MENU
           ============================================================ */
        .flyout-menu {
            position: fixed;
            top: 68px;
            right: 16px;
            background: rgba(8, 12, 24, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 8px 0;
            min-width: 200px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 150;
            transform-origin: top right;
        }

        .flyout-menu.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: all;
        }

        .flyout-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border-right: 2px solid transparent;
        }

        .flyout-menu a:hover {
            background: rgba(0, 212, 255, 0.05);
            color: var(--text-primary);
            border-right-color: var(--accent-cyan);
        }

        .flyout-menu a.active {
            color: var(--accent-cyan);
            border-right-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.05);
        }

        .flyout-menu .menu-divider {
            height: 1px;
            background: var(--border-glow);
            margin: 6px 16px;
        }

        .flyout-menu .menu-label {
            padding: 8px 20px 4px;
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.5;
        }

        .flyout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .flyout-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .db-page {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
            padding: 16px 24px;
            gap: 20px;
            min-height: calc(100vh - 68px);
        }

        .db-content {
            flex: 1;
            min-width: 0;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .db-sidebar {
            width: 210px;
            background: rgba(8, 12, 24, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px 0;
            flex-shrink: 0;
            position: sticky;
            top: 84px;
            height: calc(100vh - 100px);
            overflow-y: auto;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .db-sidebar::-webkit-scrollbar { width: 2px; }

        .sidebar-brand {
            padding: 0 16px 16px;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 8px;
        }

        .sidebar-brand h2 {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .sidebar-brand h2 i { color: var(--accent-cyan); }
        .sidebar-brand .sub { font-size: 0.55rem; color: var(--text-secondary); opacity: 0.6; }

        .sidebar-section { padding: 4px 10px; }
        .sidebar-label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            padding: 8px 10px 4px;
            opacity: 0.4;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.75rem;
            width: 100%;
            background: transparent;
            border: none;
            font-family: inherit;
            position: relative;
        }

        .sidebar-item:hover {
            background: rgba(0, 212, 255, 0.04);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: rgba(0, 212, 255, 0.08);
            color: var(--accent-cyan);
            box-shadow: inset 2px 0 0 var(--accent-cyan);
        }

        .sidebar-item i { width: 18px; text-align: center; font-size: 0.8rem; }
        .sidebar-item .badge-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            margin-right: auto;
        }
        .sidebar-item .badge-dot.online { background: var(--accent-green); }
        .sidebar-item .badge-dot.offline { background: #ff4444; }
        .sidebar-item .badge-dot.warning { background: var(--accent-orange); }

        .sidebar-divider {
            height: 1px;
            background: var(--border-glow);
            margin: 6px 12px;
        }

        /* ============================================================
           PAGE HEADER
           ============================================================ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .page-header h1 i { color: var(--accent-cyan); }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-glow);
            background: rgba(0, 212, 255, 0.04);
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .btn-action:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
            background: rgba(0, 212, 255, 0.08);
        }

        .btn-action.primary {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(168, 85, 247, 0.15));
            border-color: rgba(0, 212, 255, 0.2);
            color: var(--accent-cyan);
        }

        .btn-action.primary:hover {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.08);
            transform: translateY(-2px);
        }

        .btn-action.danger {
            border-color: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .btn-action.danger:hover {
            background: rgba(255, 68, 68, 0.08);
            border-color: #ff4444;
        }

        .btn-action.success {
            border-color: rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
        }

        .btn-action.success:hover {
            background: rgba(0, 255, 136, 0.08);
            border-color: var(--accent-green);
        }

        .timestamp {
            font-size: 0.6rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            opacity: 0.5;
        }

        /* ============================================================
           CONTENT CARDS
           ============================================================ */
        .card-glow {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .card-glow:hover {
            border-color: rgba(0, 212, 255, 0.15);
        }

        .card-glow .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-glow .card-header h3 {
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .card-glow .card-header h3 i { color: var(--accent-cyan); }

        .card-glow .card-header .badge-count {
            font-size: 0.6rem;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid var(--border-glow);
            color: var(--text-secondary);
        }

        /* ============================================================
           STATS GRID
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 16px 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-item:hover::before { opacity: 1; }
        .stat-item:hover { border-color: rgba(0, 212, 255, 0.15); }

        .stat-item .stat-icon {
            font-size: 1.4rem;
            margin-bottom: 8px;
            display: block;
        }

        .stat-item .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: var(--text-primary);
        }

        .stat-item .stat-value.cyan { color: var(--accent-cyan); }
        .stat-item .stat-value.green { color: var(--accent-green); }
        .stat-item .stat-value.pink { color: var(--accent-pink); }
        .stat-item .stat-value.orange { color: var(--accent-orange); }

        .stat-item .stat-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-item .stat-sub {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border-glow);
        }

        .stat-item .stat-sub .highlight { color: var(--accent-green); font-weight: 600; }

        /* ============================================================
           TABLES
           ============================================================ */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-modern {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }

        .table-modern th {
            text-align: right;
            padding: 8px 12px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-glow);
        }

        .table-modern td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.03);
            color: var(--text-primary);
        }

        .table-modern tr:hover td {
            background: rgba(0, 212, 255, 0.02);
        }

        .table-modern .row-actions {
            display: flex;
            gap: 6px;
        }

        .table-modern .row-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-size: 0.7rem;
        }

        .table-modern .row-actions button:hover {
            color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.05);
        }

        .table-modern .row-actions button.danger:hover {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }

        /* ============================================================
           CHIPS / BADGES
           ============================================================ */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 500;
        }

        .chip.online {
            background: rgba(0, 255, 136, 0.08);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.12);
        }

        .chip.offline {
            background: rgba(255, 68, 68, 0.08);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.12);
        }

        .chip.warning {
            background: rgba(255, 136, 0, 0.08);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 136, 0, 0.12);
        }

        .chip.cyan {
            background: rgba(0, 212, 255, 0.06);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        .search-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
            min-width: 120px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.02);
        }

        .search-bar input::placeholder { color: var(--text-secondary); opacity: 0.4; }

        .search-bar select {
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.75rem;
            font-family: inherit;
        }

        .search-bar select:focus { outline: none; border-color: var(--accent-cyan); }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-modern {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            gap: 16px;
        }

        .spinner-glow {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid rgba(0, 212, 255, 0.04);
            border-top: 3px solid var(--accent-cyan);
            animation: spin 0.9s linear infinite;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.03);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-modern p {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 10px 20px;
            background: rgba(8, 12, 24, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.8rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            pointer-events: all;
            animation: toastIn 0.35s ease;
            text-align: center;
            width: 100%;
        }

        .toast.success { border-color: var(--accent-green); }
        .toast.error { border-color: #ff4444; }
        .toast.warning { border-color: var(--accent-orange); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============================================================
           SIDEBAR TOGGLE (موبایل)
           ============================================================ */
        .sidebar-toggle-btn {
            display: none;
            background: rgba(0, 212, 255, 0.04);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--text-secondary);
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .sidebar-toggle-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 55;
            top: 68px;
        }

        .sidebar-overlay.open { display: block; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .db-page { flex-direction: column; padding: 12px; gap: 12px; }
            .stats-grid { grid-template-columns: 1fr; }
            .page-header h1 { font-size: 1rem; }
            .db-sidebar {
                position: fixed;
                top: 68px;
                right: -100%;
                width: 270px;
                height: calc(100vh - 68px);
                border-radius: 0 0 16px 16px;
                z-index: 60;
                border: 1px solid var(--border-glow);
            }
            .db-sidebar.open { right: 0; }
            .sidebar-toggle-btn { display: inline-flex; }
            .sidebar-overlay.open { display: block; }
            .header { padding: 8px 16px; }
            .header .logo { font-size: 0.95rem; }
            .header-actions .status-badge .text { display: none; }
            .card-glow { padding: 14px 16px; }
        }

        @media (min-width: 769px) {
            .sidebar-toggle-btn { display: none !important; }
            .sidebar-overlay { display: none !important; }
        }

        @media (max-width: 480px) {
            .stat-item .stat-value { font-size: 1.2rem; }
            .stat-item { padding: 12px 14px; }
            .search-bar input { min-width: 80px; font-size: 0.7rem; }
            .search-bar select { font-size: 0.7rem; padding: 6px 10px; }
            .table-modern { font-size: 0.65rem; }
            .table-modern th, .table-modern td { padding: 5px 8px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header class="header">
        <a href="/dashboard" class="logo">
            <i class="fas fa-cubes"></i> سیستم تحلیلگر
        </a>
        <div class="header-actions">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span class="text">پایدار</span>
            </div>
            <span style="font-size:0.6rem;color:var(--text-secondary);font-family:'Courier New',monospace;" id="uptimeDisplay">⏱️ ۰ ثانیه</span>
            <span id="userDisplay" style="font-size:0.7rem;color:var(--accent-cyan);"></span>
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- ============================================================
    FLYOUT MENU
    ============================================================ -->
    <div class="flyout-overlay" id="flyoutOverlay"></div>
    <nav class="flyout-menu" id="flyoutMenu">
        <div class="menu-label">🔹 منوی اصلی</div>
        <a href="/dashboard"><i class="fas fa-chart-pie"></i> داشبورد</a>
        <a href="/chart-page"><i class="fas fa-chart-line"></i> نمودار</a>
        <a href="/predict-page"><i class="fas fa-bullseye"></i> مدل</a>
        <a href="/test-api-page"><i class="fas fa-plug"></i> تست API</a>
        <div class="menu-divider"></div>
        <a href="/database-page" class="active"><i class="fas fa-database"></i> دیتابیس</a>
        <a href="/settings-page"><i class="fas fa-sliders-h"></i> تنظیمات</a>
        <div class="menu-divider"></div>
        <a href="/debug-page" style="color:#ff6b00;"><i class="fas fa-bug"></i> دیباگ</a>
    </nav>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <div class="db-page">

        <!-- ===== SIDEBAR ===== -->
        <nav class="db-sidebar" id="dbSidebar">
            <div class="sidebar-brand">
                <h2><i class="fas fa-database"></i> دیتابیس</h2>
                <div class="sub">مدیریت &amp; مانیتورینگ</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-label">📊 نمای کلی</div>
                <button class="sidebar-item active" data-tab="overview" onclick="switchTab('overview')">
                    <i class="fas fa-chart-pie"></i> نمای کلی
                    <span class="badge-dot online" id="dotOverview"></span>
                </button>
                <button class="sidebar-item" data-tab="explorer" onclick="switchTab('explorer')">
                    <i class="fas fa-search"></i> کاوشگر
                </button>
                <button class="sidebar-item" data-tab="monitor" onclick="switchTab('monitor')">
                    <i class="fas fa-chart-line"></i> مانیتورینگ
                </button>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <div class="sidebar-label">🗄️ دیتابیس‌ها</div>
                <button class="sidebar-item" data-tab="postgresql" onclick="switchTab('postgresql')">
                    <i class="fas fa-database" style="color:#3366ff;"></i> PostgreSQL
                    <span class="badge-dot" id="dotPostgresql"></span>
                </button>
                <button class="sidebar-item" data-tab="redis" onclick="switchTab('redis')">
                    <i class="fas fa-bolt" style="color:#ff4444;"></i> Redis
                    <span class="badge-dot" id="dotRedis"></span>
                </button>
                <button class="sidebar-item" data-tab="sqlite" onclick="switchTab('sqlite')">
                    <i class="fas fa-file" style="color:#00ff88;"></i> SQLite
                    <span class="badge-dot" id="dotSqlite"></span>
                </button>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <button class="sidebar-item" onclick="refreshAll()" style="color:#ff8800;">
                    <i class="fas fa-sync-alt"></i> بروزرسانی همه
                </button>
            </div>
        </nav>

        <!-- ===== OVERLAY (موبایل) ===== -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ===== CONTENT ===== -->
        <main class="db-content">

            <div class="page-header">
                <h1 id="pageTitle"><i class="fas fa-chart-pie"></i> نمای کلی</h1>
                <div class="header-tools">
                    <span class="timestamp" id="pageTimestamp"></span>
                    <button class="btn-action primary" onclick="refreshAll()">
                        <i class="fas fa-sync-alt"></i> بروزرسانی
                    </button>
                    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i> منو
                    </button>
                </div>
            </div>

            <div id="tabContainer">
                <div class="loading-modern">
                    <div class="spinner-glow"></div>
                    <p>بارگذاری داده‌های دیتابیس...</p>
                </div>
            </div>

        </main>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="/static/js/script.js"></script>
    <script>
        // ============================================================
        // STATE
        // ============================================================
        let currentTab = 'overview';
        let sidebarOpen = false;

        // ============================================================
        // MENU
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // منوی فلای‌آوت
            const menuToggle = document.getElementById('menuToggle');
            const flyoutMenu = document.getElementById('flyoutMenu');
            const overlay = document.getElementById('flyoutOverlay');

            if (menuToggle && flyoutMenu && overlay) {
                menuToggle.addEventListener('click', function() {
                    const open = flyoutMenu.classList.toggle('open');
                    overlay.classList.toggle('open');
                    menuToggle.innerHTML = open ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
                });
                overlay.addEventListener('click', function() {
                    flyoutMenu.classList.remove('open');
                    overlay.classList.remove('open');
                    menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
                });
            }

            // نمایش نام کاربری
            fetch('/api/user', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const display = document.getElementById('userDisplay');
                        if (display) {
                            const roleMap = { 'admin': '👑 ادمین', 'vip': '⭐ VIP', 'guest': '👤 مهمان' };
                            display.textContent = roleMap[data.data.role] || data.data.username;
                        }
                    }
                })
                .catch(() => {});

            // آپتایم
            if (typeof fetchAndStartUptime === 'function') {
                fetchAndStartUptime();
            }

            // سایدبار موبایل
            const sidebar = document.getElementById('dbSidebar');
            const overlaySide = document.getElementById('sidebarOverlay');

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && sidebarOpen) {
                    if (!sidebar?.contains(e.target) && !e.target.closest('.sidebar-toggle-btn')) {
                        toggleSidebar();
                    }
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768 && sidebarOpen) {
                    toggleSidebar();
                }
            });

            // بارگذاری تب اولیه
            switchTab('overview');
            setInterval(updateTimestamp, 1000);

            // ============================================================
            // ✅ اضافه کردن بروزرسانی متریک‌های سیستم از MetricsCollector
            // ============================================================
            function updateSystemMetrics() {
                fetch('/api/metrics')
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            const m = data.data;
                            // به‌روزرسانی نقاط آنلاین/آفلاین در سایدبار
                            updateSidebarDots(m.databases);
                        }
                    })
                    .catch(err => console.error('Metrics error:', err));
            }

            function updateSidebarDots(databases) {
                if (!databases) return;

                // PostgreSQL
                const pgDot = document.getElementById('dotPostgresql');
                if (pgDot) {
                    pgDot.className = 'badge-dot ' + (databases.postgresql ? 'online' : 'offline');
                }

                // Redis
                const redisDot = document.getElementById('dotRedis');
                if (redisDot) {
                    redisDot.className = 'badge-dot ' + (databases.redis ? 'online' : 'offline');
                }

                // SQLite
                const sqliteDot = document.getElementById('dotSqlite');
                if (sqliteDot) {
                    sqliteDot.className = 'badge-dot ' + (databases.sqlite ? 'online' : 'offline');
                }

                // Overview
                const overviewDot = document.getElementById('dotOverview');
                if (overviewDot) {
                    const allOnline = databases.postgresql && databases.redis && databases.sqlite;
                    overviewDot.className = 'badge-dot ' + (allOnline ? 'online' : 'warning');
                }
            }

            // بروزرسانی اولیه و هر ۱۰ ثانیه
            updateSystemMetrics();
            setInterval(updateSystemMetrics, 10000);
        });

        // ============================================================
        // TOGGLE SIDEBAR
        // ============================================================
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('dbSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('open', sidebarOpen);
            if (overlay) overlay.classList.toggle('open', sidebarOpen);
        }

        // ============================================================
        // TIMESTAMP
        // ============================================================
        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
        }

        // ============================================================
        // SWITCH TAB
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            const container = document.getElementById('tabContainer');
            const title = document.getElementById('pageTitle');

            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.toggle('active', item.dataset.tab === tab);
            });

            const titles = {
                'overview': '<i class="fas fa-chart-pie"></i> نمای کلی',
                'explorer': '<i class="fas fa-search"></i> کاوشگر',
                'monitor': '<i class="fas fa-chart-line"></i> مانیتورینگ',
                'postgresql': '<i class="fas fa-database" style="color:#3366ff;"></i> PostgreSQL',
                'redis': '<i class="fas fa-bolt" style="color:#ff4444;"></i> Redis',
                'sqlite': '<i class="fas fa-file" style="color:#00ff88;"></i> SQLite'
            };
            title.innerHTML = titles[tab] || tab;

            container.innerHTML = `
                <div class="loading-modern">
                    <div class="spinner-glow"></div>
                    <p>بارگذاری ${titles[tab]?.replace(/<[^>]*>/g, '') || tab}...</p>
                </div>
            `;

            fetch(`/static/db-parts/${tab}.html`)
                .then(res => {
                    if (!res.ok) throw new Error('تاب یافت نشد');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const newScript = document.createElement('script');
                        newScript.textContent = old.textContent;
                        if (old.src) newScript.src = old.src;
                        old.parentNode.replaceChild(newScript, old);
                    });
                    const initFn = window['init_' + tab];
                    if (typeof initFn === 'function') initFn();

                    if (window.innerWidth <= 768 && sidebarOpen) toggleSidebar();
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="card-glow">
                            <p style="color:#ff4444;text-align:center;padding:20px;">
                                ❌ خطا در بارگذاری: ${err.message}
                            </p>
                        </div>
                    `;
                });
        }

        // ============================================================
        // REFRESH
        // ============================================================
        function refreshAll() {
            switchTab(currentTab);
            showToast('🔄 بروزرسانی شد', 'success');
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        console.log('🚀 Database Management System v4.0 (with MetricsCollector) loaded');
    </script>

</body>
</html>
