<!-- ============================================================
     ماژول نمودار - قابل استفاده در هر صفحه
     ============================================================ -->
<div id="chartModule">
    <div class="chart-header">
        <div class="chart-title">
            <span>📈 نمودار قیمت</span>
            <span id="chartCoinName" style="color:#00d4ff;font-size:0.85rem;"></span>
        </div>
        <div class="chart-price-info">
            <span id="chartPrice" style="font-size:1.5rem;font-weight:bold;">$--</span>
            <span id="chartChange" style="font-size:0.95rem;margin-right:10px;">--</span>
            <span style="color:#4a5a6a;font-size:0.75rem;margin-right:12px;">
                ▲ <span id="chartHigh">--</span> &nbsp;|&nbsp; ▼ <span id="chartLow">--</span>
            </span>
        </div>
    </div>

    <div class="chart-controls">
        <div class="chart-controls-left">
            <select id="chartCoin" class="form-control" style="width:150px;">
                <option value="bitcoin">بیت‌کوین (BTC)</option>
                <option value="ethereum">اتریوم (ETH)</option>
                <option value="solana">سولانا (SOL)</option>
                <option value="ripple">ریپل (XRP)</option>
                <option value="cardano">کاردانو (ADA)</option>
                <option value="dogecoin">داوج‌کوین (DOGE)</option>
                <option value="polkadot">پولکادات (DOT)</option>
                <option value="chainlink">چین‌لینک (LINK)</option>
                <option value="avalanche">آوالانچ (AVAX)</option>
            </select>

            <select id="chartPeriod" class="form-control" style="width:130px;">
                <option value="24h">۲۴ ساعت</option>
                <option value="1w">۱ هفته</option>
                <option value="1m">۱ ماه</option>
                <option value="3m">۳ ماه</option>
            </select>

            <button id="chartRefresh" class="btn btn-sm btn-primary">🔄</button>
        </div>

        <div class="chart-controls-right">
            <button id="maToggle" class="btn btn-sm btn-outline" data-active="false">
                📊 MA
            </button>
            <button id="logToggle" class="btn btn-sm btn-outline" data-active="false">
                📐 Log
            </button>
            <button id="resetZoom" class="btn btn-sm btn-outline">
                ⟲
            </button>
        </div>
    </div>

    <div class="chart-wrapper">
        <div id="chartLoading" class="chart-loading">
            <div class="spinner"></div>
            <span>در حال دریافت داده...</span>
        </div>
        <div id="chartError" class="chart-error" style="display:none;"></div>
        <canvas id="chartCanvas"></canvas>
    </div>

    <div class="chart-footer">
        <span id="chartTimeRange"></span>
        <span style="color:#4a5a6a;font-size:0.7rem;">
            داده‌های لحظه‌ای | هاور کنید تا جزئیات ببینید
        </span>
    </div>
</div>

<style>
    /* ============================================================
       استایل ماژول نمودار
       ============================================================ */
    #chartModule {
        background: linear-gradient(145deg, #111d2b, #0d1624);
        border: 1px solid #1a2a3a;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
        transition: border-color 0.3s ease;
    }
    #chartModule:hover {
        border-color: rgba(0, 212, 255, 0.15);
    }

    .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
    }
    .chart-title {
        color: #a0b4c8;
        font-size: 0.9rem;
    }
    .chart-title span:first-child {
        font-weight: 600;
        color: #e0e6ed;
    }
    .chart-price-info {
        text-align: left;
        direction: ltr;
    }

    .chart-controls {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
    }
    .chart-controls-left,
    .chart-controls-right {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
    }

    .chart-controls .form-control {
        background: #0a0e17;
        border: 1px solid #1a2a3a;
        color: #e0e6ed;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-family: inherit;
    }
    .chart-controls .form-control:focus {
        outline: none;
        border-color: #00d4ff;
    }

    .chart-controls .btn-outline {
        background: transparent;
        border: 1px solid #1a2a3a;
        color: #a0b4c8;
        padding: 6px 14px;
        font-size: 0.8rem;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
    }
    .chart-controls .btn-outline:hover {
        border-color: #00d4ff;
        color: #e0e6ed;
    }
    .chart-controls .btn-outline.active {
        border-color: #00d4ff;
        background: rgba(0, 212, 255, 0.1);
        color: #00d4ff;
    }
    .chart-controls .btn-sm {
        padding: 6px 14px;
        font-size: 0.8rem;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-family: inherit;
    }
    .chart-controls .btn-primary {
        background: #00d4ff;
        color: #0a0e17;
    }
    .chart-controls .btn-primary:hover {
        background: #00e5ff;
    }

    .chart-wrapper {
        position: relative;
        width: 100%;
        height: 340px;
        background: #0a0e17;
        border-radius: 12px;
        border: 1px solid #1a2a3a;
        overflow: hidden;
    }
    .chart-wrapper canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
    }

    .chart-loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(10, 14, 23, 0.7);
        z-index: 5;
        color: #7a8fa3;
        font-size: 0.9rem;
    }
    .chart-loading .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #1a2a3a;
        border-top: 3px solid #00d4ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .chart-error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ff4444;
        font-size: 0.95rem;
        background: rgba(10, 14, 23, 0.7);
        z-index: 5;
    }

    .chart-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 0.75rem;
        color: #4a5a6a;
        flex-wrap: wrap;
        gap: 6px;
    }
    .chart-footer #chartTimeRange {
        color: #7a8fa3;
    }

    /* Responsive */
    @media (max-width: 768px) {
        #chartModule {
            padding: 14px;
        }
        .chart-header {
            flex-direction: column;
            align-items: flex-start;
        }
        .chart-price-info {
            text-align: right;
            width: 100%;
        }
        .chart-price-info #chartPrice {
            font-size: 1.2rem;
        }
        .chart-controls {
            flex-direction: column;
            align-items: stretch;
        }
        .chart-controls-left,
        .chart-controls-right {
            flex-wrap: wrap;
            justify-content: center;
        }
        .chart-controls .form-control {
            width: 100% !important;
            min-width: unset;
        }
        .chart-wrapper {
            height: 240px;
        }
    }

    @media (max-width: 480px) {
        .chart-wrapper {
            height: 190px;
        }
        .chart-controls .btn-outline {
            padding: 4px 10px;
            font-size: 0.7rem;
        }
        .chart-price-info #chartPrice {
            font-size: 1rem;
        }
        .chart-price-info #chartChange {
            font-size: 0.8rem;
        }
    }
</style>
