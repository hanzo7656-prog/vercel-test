{% extends "base.html" %}

{% block title %}سلامت سیستم - تشخیص الگو{% endblock %}

{% block content %}
<div class="card">
    <div class="card-title">💚 سلامت سیستم</div>
    <div class="card-subtitle">وضعیت تمام اجزای سیستم</div>
    <div style="margin-top: 10px;">
        <button class="btn btn-primary" onclick="refreshHealth()">🔄 بروزرسانی</button>
    </div>
</div>

<div id="healthContent">
    <div class="loading">
        <div class="spinner"></div>
        <p style="color: #a0b4c8;">در حال دریافت اطلاعات...</p>
    </div>
</div>

<script>
    function refreshHealth() {
        fetch('/health')
            .then(res => res.json())
            .then(data => {
                let html = '<div class="row">';
                
                // وضعیت کلی
                const statusClass = data.status === 'ok' ? 'success' : data.status === 'degraded' ? 'warning' : 'danger';
                html += `
                    <div class="card">
                        <div class="card-title">📊 وضعیت کلی</div>
                        <div style="font-size: 2rem; text-align: center; padding: 10px;">
                            <span class="badge badge-${statusClass}" style="font-size: 1.5rem; padding: 10px 30px;">
                                ${data.status || 'نامشخص'}
                            </span>
                        </div>
                        <div style="text-align: center; color: #4a5a6a; font-size: 0.85rem;">
                            ${data.timestamp || ''}
                        </div>
                    </div>
                `;

                // اجزا
                if (data.components) {
                    for (const [key, value] of Object.entries(data.components)) {
                        const statusColor = value.status === 'healthy' ? 'success' : 
                                           value.status === 'degraded' ? 'warning' : 
                                           value.status === 'unhealthy' ? 'danger' : 'info';
                        html += `
                            <div class="card">
                                <div class="card-title">${key}</div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span class="badge badge-${statusColor}">${value.status || 'نامشخص'}</span>
                                    <span style="color: #4a5a6a; font-size: 0.85rem;">${value.message || ''}</span>
                                </div>
                                <pre style="background: #0d1624; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; margin-top: 10px;">${JSON.stringify(value, null, 2)}</pre>
                            </div>
                        `;
                    }
                }

                html += '</div>';
                document.getElementById('healthContent').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('healthContent').innerHTML = `
                    <div class="card">
                        <div class="card-title">❌ خطا</div>
                        <p style="color: #ff4444;">${err.message}</p>
                    </div>
                `;
            });
    }

    refreshHealth();
</script>
{% endblock %}
