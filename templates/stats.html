{% extends "base.html" %}

{% block title %}آمار - سیستم تشخیص الگو{% endblock %}

{% block content %}
<div class="card">
    <div class="card-title">📊 آمار سیستم</div>
    <div class="card-subtitle">آمار درخواست‌ها و عملکرد سیستم</div>
    <div style="margin-top: 10px;">
        <button class="btn btn-primary" onclick="refreshStats()">🔄 بروزرسانی</button>
    </div>
</div>

<div id="statsContent">
    <div class="loading">
        <div class="spinner"></div>
        <p style="color: #a0b4c8;">در حال دریافت آمار...</p>
    </div>
</div>

<script>
    function refreshStats() {
        fetch('/stats')
            .then(res => res.json())
            .then(data => {
                let html = '<div class="row">';
                
                // اطلاعات کلی
                html += `
                    <div class="card">
                        <div class="card-title">📈 آمار کلی</div>
                        <table class="table">
                            <tr><td>مدل بارگذاری شده</td><td><span class="badge ${data.model_loaded ? 'badge-success' : 'badge-warning'}">${data.model_loaded ? '✅ بله' : '❌ خیر (DEMO)'}</span></td></tr>
                            <tr><td>آپتایم</td><td>${data.uptime || 'نامشخص'}</td></tr>
                            <tr><td>زمان</td><td>${data.timestamp || ''}</td></tr>
                        </table>
                    </div>
                `;

                // API Stats
                if (data.api_stats) {
                    html += `
                        <div class="card">
                            <div class="card-title">🔌 آمار API</div>
                            <table class="table">
                                <tr><td>کل درخواست‌ها</td><td>${data.api_stats.total_requests || 0}</td></tr>
                                <tr><td>خطاها</td><td>${data.api_stats.errors || 0}</td></tr>
                                <tr><td>اندازه کش</td><td>${data.api_stats.cache_size || 0}</td></tr>
                                <tr><td>کلیدهای کش</td><td>${(data.api_stats.cache_keys || []).join(', ') || 'خالی'}</td></tr>
                            </table>
                        </div>
                    `;
                }

                // تسک‌ها
                html += `
                    <div class="card">
                        <div class="card-title">⏳ تسک‌های پس‌زمینه</div>
                        <table class="table">
                            <tr><td>تسک‌های در انتظار</td><td>${data.pending_tasks || 0}</td></tr>
                            <tr><td>کل تسک‌ها</td><td>${data.total_tasks || 0}</td></tr>
                        </table>
                    </div>
                `;

                html += '</div>';
                document.getElementById('statsContent').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('statsContent').innerHTML = `
                    <div class="card">
                        <div class="card-title">❌ خطا</div>
                        <p style="color: #ff4444;">${err.message}</p>
                    </div>
                `;
            });
    }

    refreshStats();
</script>
{% endblock %}
