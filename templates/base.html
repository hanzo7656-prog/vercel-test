<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سیستم تشخیص الگوی بازاری{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- ============================================================ -->
    <!-- Navigation -->
    <!-- ============================================================ -->
    <nav class="navbar">
        <a href="/dashboard" class="navbar-brand">
            📊 <span>سیستم تشخیص الگو</span>
        </a>
        <div class="navbar-menu">
            <a href="/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">📈 داشبورد</a>
            <a href="/predict-page" class="{% if active_page == 'predict' %}active{% endif %}">🎯 پیش‌بینی</a>
            <a href="/test-api-page" class="{% if active_page == 'test-api' %}active{% endif %}">🔌 تست API</a>
            <a href="/health-page" class="{% if active_page == 'health' %}active{% endif %}">💚 سلامت</a>
            <a href="/stats-page" class="{% if active_page == 'stats' %}active{% endif %}">📊 آمار</a>
        </div>
        <div class="navbar-status">
            <span>
                <span class="status-dot {{ status_class }}"></span>
                {{ status_text }}
            </span>
            <span style="color: #7a8fa3; font-size: 0.8rem;">
                ⏱️ {{ uptime }}
            </span>
        </div>
    </nav>

    <!-- ============================================================ -->
    <!-- Main Content -->
    <!-- ============================================================ -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- ============================================================ -->
    <!-- Footer -->
    <!-- ============================================================ -->
    <footer style="text-align: center; padding: 20px; color: #4a5a6a; font-size: 0.85rem; border-top: 1px solid #0d1624; margin-top: 30px;">
        <p>
            🚀 سیستم تشخیص الگوهای بازاری با XGBoost 
            &nbsp;|&nbsp; نسخه ۲.۰
            &nbsp;|&nbsp; {{ now }}
        </p>
    </footer>

    <!-- ============================================================ -->
    <!-- Scripts -->
    <!-- ============================================================ -->
    <script src="/static/js/script.js"></script>
    {% block extra_scripts %}{% endblock %}

</body>
</html>
