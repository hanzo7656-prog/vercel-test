{% extends "base.html" %}

{% block title %}تست API - سیستم تشخیص الگو{% endblock %}

{% block content %}
<div class="card">
    <div class="card-title">🔌 تست API کوین‌استیتس</div>
    <div class="card-subtitle">
        دریافت و نمایش داده‌های خام از API
    </div>

    <form id="testForm" onsubmit="return false;">
        <div class="row" style="grid-template-columns: 1fr 1fr 1fr auto;">
            <div class="form-group">
                <label for="testType">📋 نوع داده</label>
                <select class="form-control" id="testType">
                    <option value="chart" selected>نمودار قیمت (Chart)</option>
                    <option value="coin">اطلاعات لحظه‌ای (Coin)</option>
                    <option value="fear_greed">شاخص ترس و طمع</option>
                    <option value="btc_dominance">سلطه بیت‌کوین</option>
                    <option value="status">وضعیت API</option>
                    <option value="credits">اعتبار باقیمانده</option>
                </select>
            </div>
            <div class="form-group" id="coinGroup">
                <label for="testCoin">🪙 ارز</label>
                <select class="form-control" id="testCoin">
                    <option value="bitcoin">بیت‌کوین (BTC)</option>
                    <option value="ethereum">اتریوم (ETH)</option>
                    <option value="solana">سولانا (SOL)</option>
                </select>
            </div>
            <div class="form-group" id="periodGroup">
                <label for="testPeriod">⏱️ بازه</label>
                <select class="form-control" id="testPeriod">
                    <option value="1h">۱ ساعت</option>
                    <option value="4h">۴ ساعت</option>
                    <option value="24h" selected>۲۴ ساعت</option>
                </select>
            </div>
            <div class="form-group" style="display: flex; align-items: flex-end;">
                <button type="button" class="btn btn-primary" onclick="submitTest()">
                    🔍 دریافت
                </button>
            </div>
        </div>
    </form>

    <script>
        // نمایش/مخفی کردن فیلدها بر اساس نوع
        document.getElementById('testType').addEventListener('change', function() {
            const type = this.value;
            document.getElementById('coinGroup').style.display = 
                ['chart', 'coin', 'btc_dominance'].includes(type) ? 'block' : 'none';
            document.getElementById('periodGroup').style.display = 
                ['chart', 'btc_dominance'].includes(type) ? 'block' : 'none';
        });
    </script>
</div>

<!-- نتیجه -->
<div id="testResult" class="hidden">
    <div class="card">
        <div class="card-title">📊 نتیجه</div>
        <div id="testContent"></div>
    </div>
</div>

<!-- لودینگ -->
<div id="testLoading" class="hidden">
    <div class="card">
        <div class="loading">
            <div class="spinner"></div>
            <p style="color: #a0b4c8;">⏳ در حال دریافت داده...</p>
        </div>
    </div>
</div>

<script>
    function submitTest() {
        const type = document.getElementById('testType').value;
        const coin = document.getElementById('testCoin').value;
        const period = document.getElementById('testPeriod').value;

        let url = `/test-api?type=${type}`;
        if (['chart', 'coin', 'btc_dominance'].includes(type)) {
            url += `&coin=${coin}`;
        }
        if (['chart', 'btc_dominance'].includes(type)) {
            url += `&period=${period}`;
        }

        document.getElementById('testLoading').classList.remove('hidden');
        document.getElementById('testResult').classList.add('hidden');

        fetch(url)
            .then(res => res.json())
            .then(data => {
                document.getElementById('testLoading').classList.add('hidden');
                document.getElementById('testResult').classList.remove('hidden');
                document.getElementById('testContent').innerHTML = 
                    `<pre style="background: #0d1624; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; max-height: 500px; overflow-y: auto;">${JSON.stringify(data, null, 2)}</pre>`;
            })
            .catch(err => {
                document.getElementById('testLoading').classList.add('hidden');
                alert('خطا: ' + err.message);
            });
    }
</script>
{% endblock %}
