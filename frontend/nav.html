<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نویگیشن</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           نویگیشن جدید - ریسپانسیو و حرفه‌ای
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Vazir', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            direction: rtl;
        }

        /* ===== سایدبار ===== */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: #0f172a;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 16px;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 24px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #00d4ff;
        }
        .sidebar-brand .icon {
            font-size: 1.4rem;
        }
        .sidebar-brand .version {
            font-size: 0.55rem;
            color: #64748b;
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 20px;
            margin-right: auto;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
            padding: 0;
        }
        .sidebar-menu li {
            margin-bottom: 2px;
            list-style: none;
        }

        /* ===== لینک‌ها ===== */
        .nav-item-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-item-wrapper .nav-link {
            flex: 1;
        }
        .nav-item-wrapper .arrow-btn {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 0.7rem;
        }
        .nav-item-wrapper .arrow-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #f1f5f9;
        }
        .nav-item-wrapper .arrow-btn .arrow {
            transition: transform 0.3s ease;
        }
        .nav-item-wrapper .arrow-btn .arrow.open {
            transform: rotate(180deg);
        }

        .sidebar-menu li .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.25s ease;
            font-size: 0.85rem;
            position: relative;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            text-align: right;
            font-family: inherit;
        }
        .sidebar-menu li .nav-link i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
            transition: transform 0.3s ease;
        }

        .sidebar-menu li .nav-link:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #f1f5f9;
            transform: translateX(-4px);
        }
        .sidebar-menu li .nav-link:hover i {
            transform: scale(1.1);
        }

        .sidebar-menu li .nav-link.active {
            background: rgba(0, 212, 255, 0.08);
            color: #00d4ff;
        }
        .sidebar-menu li .nav-link.active::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            background: #00d4ff;
            border-radius: 0 4px 4px 0;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                height: 0;
                opacity: 0;
            }
            to {
                height: 24px;
                opacity: 1;
            }
        }

        /* ===== زیرمنو ===== */
        .submenu {
            list-style: none;
            padding-right: 44px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .submenu.open {
            max-height: 300px;
            opacity: 1;
        }
        .submenu li .nav-link {
            padding: 6px 14px !important;
            font-size: 0.75rem !important;
            color: #64748b !important;
            border-radius: 6px !important;
        }
        .submenu li .nav-link:hover {
            color: #f1f5f9 !important;
            background: rgba(255, 255, 255, 0.02) !important;
            transform: translateX(-2px) !important;
        }
        .submenu li .nav-link.active {
            color: #00d4ff !important;
            background: rgba(0, 212, 255, 0.04) !important;
        }

        .sidebar-menu li .nav-link .badge {
            margin-right: auto;
            background: #00d4ff;
            color: #0f172a;
            font-size: 0.5rem;
            padding: 1px 8px;
            border-radius: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .sidebar-menu .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            margin: 12px 0;
        }

        /* ===== فوتر ===== */
        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
            margin-top: auto;
        }
        .sidebar-footer .user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            color: #94a3b8;
        }
        .sidebar-footer .user .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-footer .user .name {
            font-weight: 500;
            color: #f1f5f9;
        }
        .sidebar-footer .user .role {
            font-size: 0.65rem;
            color: #64748b;
        }
        .sidebar-footer .logout {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            margin-top: 4px;
            background: none;
            border: none;
            width: 100%;
            text-align: right;
            cursor: pointer;
            font-family: inherit;
        }
        .sidebar-footer .logout:hover {
            background: rgba(239, 68, 68, 0.06);
            color: #ef4444;
        }
        .sidebar-footer .logout i {
            width: 20px;
            text-align: center;
        }

        /* ===== محتوای اصلی ===== */
        .main-content {
            flex: 1;
            padding: 24px 32px;
            min-height: 100vh;
            background: #0f172a;
        }

        /* ===== هدر موبایل ===== */
        .mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .mobile-header .brand {
            font-weight: 700;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mobile-header .hamburger {
            background: none;
            border: none;
            color: #f1f5f9;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
        }
        .mobile-header .hamburger:focus {
            outline: none;
        }

        /* ===== Overlay ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 998;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .sidebar-overlay.active {
            display: block;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 1024px) {
            .sidebar {
                width: 220px;
            }
            .sidebar-brand {
                font-size: 0.95rem;
            }
            .sidebar-menu li .nav-link {
                font-size: 0.8rem;
                padding: 8px 12px;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                position: fixed;
                top: 0;
                right: -280px;
                width: 280px;
                height: 100vh;
                z-index: 999;
                background: #0f172a;
                border-left: none;
                border-right: 1px solid rgba(255, 255, 255, 0.05);
                transition: right 0.35s ease;
                padding: 16px;
            }
            .sidebar.open {
                right: 0;
            }
            .mobile-header {
                display: flex;
            }
            .main-content {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 100%;
                right: -100%;
            }
            .sidebar.open {
                right: 0;
            }
            .main-content {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Overlay ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===== سایدبار ===== -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="icon">📊</span>
            <span class="brand-text">سیستم تحلیلگر</span>
            <span class="version">v10</span>
        </div>

        <ul class="sidebar-menu">
            <!-- داشبورد -->
            <li>
                <button class="nav-link active" data-page="dashboard" data-tooltip="داشبورد">
                    <i class="fas fa-chart-pie"></i>
                    <span class="link-text">داشبورد</span>
                </button>
            </li>

            <!-- تحلیلگر (با زیرمنو) -->
            <li>
                <div class="nav-item-wrapper">
                    <button class="nav-link has-submenu" data-page="analyzer" data-tooltip="تحلیلگر">
                        <i class="fas fa-robot"></i>
                        <span class="link-text">تحلیلگر</span>
                    </button>
                    <button class="arrow-btn" data-toggle="submenu">
                        <i class="fas fa-chevron-down arrow"></i>
                    </button>
                </div>
                <ul class="submenu">
                    <li><button class="nav-link" data-page="analyzer-predict"><i class="fas fa-wand-magic-sparkles"></i> پیش‌بینی</button></li>
                    <li><button class="nav-link" data-page="analyzer-indicators"><i class="fas fa-chart-bar"></i> شاخص‌ها</button></li>
                    <li><button class="nav-link" data-page="analyzer-history"><i class="fas fa-history"></i> تاریخچه</button></li>
                </ul>
            </li>

            <!-- مدل (با زیرمنو) -->
            <li>
                <div class="nav-item-wrapper">
                    <button class="nav-link has-submenu" data-page="model" data-tooltip="مدل">
                        <i class="fas fa-brain"></i>
                        <span class="link-text">مدل</span>
                        <span class="badge">Beta</span>
                    </button>
                    <button class="arrow-btn" data-toggle="submenu">
                        <i class="fas fa-chevron-down arrow"></i>
                    </button>
                </div>
                <ul class="submenu">
                    <li><button class="nav-link" data-page="model-dashboard"><i class="fas fa-chart-pie"></i> داشبورد مدل</button></li>
                    <li><button class="nav-link" data-page="model-training"><i class="fas fa-graduation-cap"></i> آموزش</button></li>
                    <li><button class="nav-link" data-page="model-schedule"><i class="fas fa-clock"></i> زمان‌بندی</button></li>
                    <li><button class="nav-link" data-page="model-history"><i class="fas fa-history"></i> تاریخچه</button></li>
                    <li><button class="nav-link" data-page="model-tools"><i class="fas fa-tools"></i> ابزارها</button></li>
                </ul>
            </li>

            <!-- دیتابیس (با زیرمنو) -->
            <li>
                <div class="nav-item-wrapper">
                    <button class="nav-link has-submenu" data-page="database" data-tooltip="دیتابیس">
                        <i class="fas fa-database"></i>
                        <span class="link-text">دیتابیس</span>
                    </button>
                    <button class="arrow-btn" data-toggle="submenu">
                        <i class="fas fa-chevron-down arrow"></i>
                    </button>
                </div>
                <ul class="submenu">
                    <li><button class="nav-link" data-page="db-postgresql"><i class="fas fa-database"></i> PostgreSQL</button></li>
                    <li><button class="nav-link" data-page="db-redis"><i class="fas fa-bolt"></i> Redis</button></li>
                    <li><button class="nav-link" data-page="db-sqlite"><i class="fas fa-file"></i> SQLite</button></li>
                </ul>
            </li>

            <!-- دیباگ -->
            <li>
                <button class="nav-link" data-page="debug" data-tooltip="دیباگ">
                    <i class="fas fa-bug"></i>
                    <span class="link-text">دیباگ</span>
                </button>
            </li>

            <!-- تنظیمات -->
            <li>
                <button class="nav-link" data-page="settings" data-tooltip="تنظیمات">
                    <i class="fas fa-cog"></i>
                    <span class="link-text">تنظیمات</span>
                </button>
            </li>

            <li class="divider"></li>

            <!-- هشدارها -->
            <li>
                <button class="nav-link" data-page="alerts" data-tooltip="هشدارها">
                    <i class="fas fa-bell"></i>
                    <span class="link-text">هشدارها</span>
                    <span class="badge" id="alertBadge">0</span>
                </button>
            </li>

            <!-- تاریخچه -->
            <li>
                <button class="nav-link" data-page="history" data-tooltip="تاریخچه">
                    <i class="fas fa-history"></i>
                    <span class="link-text">تاریخچه</span>
                </button>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="user">
                <div class="avatar" id="userAvatar">ع</div>
                <div class="user-info">
                    <div class="name" id="userName">کاربر</div>
                    <div class="role" id="userRole">مدیر سیستم</div>
                </div>
            </div>
            <button class="logout" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span class="logout-text">خروج</span>
            </button>
        </div>
    </nav>

    <!-- ===== هدر موبایل ===== -->
    <header class="mobile-header">
        <button class="hamburger" id="hamburgerBtn">
            <i class="fas fa-bars"></i>
        </button>
        <div class="brand"><span>📊</span> سیستم تحلیلگر</div>
        <div style="display:flex;gap:12px;align-items:center;">
            <span style="font-size:0.8rem;color:#94a3b8;"><i class="fas fa-user"></i> <span id="mobileUserName">کاربر</span></span>
        </div>
    </header>

    <!-- ===== محتوای اصلی ===== -->
    <main class="main-content">
        <div style="padding:20px;background:#1e293b;border-radius:12px;border:1px solid rgba(255,255,255,0.05);">
            <h2 style="margin-bottom:12px;">📄 محتوای اصلی</h2>
            <p style="color:#94a3b8;">این صفحه برای تست نویگیشن است.</p>
            <p style="color:#64748b;font-size:0.85rem;margin-top:8px;">📱 سایز صفحه را تغییر دهید.</p>
        </div>
    </main>

    <!-- ============================================================
    بارگذاری فایل‌های JS سیستم
    ============================================================ -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>

    <script>
        // ============================================================
        // ۱. کنترل موبایل
        // ============================================================
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        hamburgerBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', closeSidebar);

        document.querySelectorAll('.sidebar-menu .nav-link').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) closeSidebar();
            });
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) closeSidebar();
        });

        // ============================================================
        // ۲. زیرمنوها
        // ============================================================
        document.querySelectorAll('[data-toggle="submenu"]').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                const parentLi = this.closest('li');
                const submenu = parentLi.querySelector('.submenu');
                const arrow = this.querySelector('.arrow');

                if (!submenu) return;

                document.querySelectorAll('.submenu.open').forEach(menu => {
                    if (menu !== submenu) {
                        menu.classList.remove('open');
                        const parent = menu.closest('li');
                        const arrowIcon = parent.querySelector('.arrow');
                        if (arrowIcon) arrowIcon.classList.remove('open');
                    }
                });

                submenu.classList.toggle('open');
                if (arrow) arrow.classList.toggle('open');
            });
        });

        // ============================================================
        // ۳. نویگیشن به صفحات
        // ============================================================
        const pageMap = {
            'dashboard': '/dashboard',
            'analyzer': '/analyzer',
            'analyzer-predict': '/analyzer#predict',
            'analyzer-indicators': '/analyzer#indicators',
            'analyzer-history': '/analyzer#history',
            'model': '/model',
            'model-dashboard': '/model#dashboard',
            'model-training': '/model#training',
            'model-schedule': '/model#schedule',
            'model-history': '/model#history',
            'model-tools': '/model#tools',
            'database': '/database',
            'db-postgresql': '/database#postgresql',
            'db-redis': '/database#redis',
            'db-sqlite': '/database#sqlite',
            'debug': '/debug',
            'settings': '/settings',
            'alerts': '/alerts',
            'history': '/history'
        };

        document.querySelectorAll('.nav-link[data-page]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                const page = this.dataset.page;
                const url = pageMap[page] || '/';

                document.querySelectorAll('.sidebar-menu .nav-link.active').forEach(link => {
                    link.classList.remove('active');
                });
                this.classList.add('active');

                if (window.innerWidth <= 768) closeSidebar();

                window.location.href = url;
            });
        });

        // ============================================================
        // ۴. داده‌های واقعی
        // ============================================================

        async function loadUserInfo() {
            try {
                const data = await api.getUserInfo();
                if (data.success && data.data) {
                    const username = data.data.username || 'کاربر';
                    const roleMap = { 'admin': 'مدیر سیستم', 'vip': 'VIP', 'guest': 'مهمان' };
                    const role = roleMap[data.data.role] || 'کاربر';
                    
                    document.getElementById('userName').textContent = username;
                    document.getElementById('userRole').textContent = role;
                    document.getElementById('mobileUserName').textContent = username;
                    
                    const avatar = document.getElementById('userAvatar');
                    if (avatar) avatar.textContent = username.charAt(0).toUpperCase();
                }
            } catch (err) {
                console.error('User info error:', err);
            }
        }
        loadUserInfo();

        async function loadAlertCount() {
            try {
                const data = await api.getAlerts({ limit: 100, resolved: false });
                if (data.success && data.data) {
                    const count = data.data.length || 0;
                    const badge = document.getElementById('alertBadge');
                    if (badge) {
                        badge.textContent = count;
                        badge.style.display = count > 0 ? 'inline' : 'none';
                    }
                }
            } catch (err) {
                console.error('Alert count error:', err);
            }
        }
        loadAlertCount();
        setInterval(loadAlertCount, 30000);

        document.getElementById('logoutBtn').addEventListener('click', async function() {
            if (confirm('آیا از خروج اطمینان دارید؟')) {
                try {
                    await api.logout();
                    window.location.href = '/';
                } catch (err) {
                    window.location.href = '/';
                }
            }
        });

        console.log('✅ Navigation loaded');
    </script>

</body>
</html>
