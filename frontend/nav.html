<style>
    /* ============================================================
       NAVBAR STYLES v10.0
       ============================================================ */
    
    .navbar {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 1000;
        padding: 0 20px;
        height: 60px;
        display: flex;
        align-items: center;
        transition: var(--transition);
    }
    
    .navbar-container {
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }
    
    .navbar-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--accent-cyan);
        font-weight: 700;
        font-size: 1.1rem;
        flex-shrink: 0;
        transition: var(--transition);
    }
    
    .navbar-brand:hover {
        color: #00e5ff;
    }
    
    .navbar-brand .brand-icon {
        font-size: 1.3rem;
    }
    
    .navbar-brand .brand-version {
        font-size: 0.55rem;
        color: var(--text-muted);
        background: var(--bg-input);
        padding: 1px 8px;
        border-radius: var(--radius-full);
        border: 1px solid var(--border-color);
    }
    
    .navbar-toggle {
        display: none;
        flex-direction: column;
        gap: 4px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 6px;
        border-radius: var(--radius-sm);
        transition: var(--transition);
    }
    
    .navbar-toggle:hover {
        background: var(--bg-hover);
    }
    
    .navbar-toggle span {
        display: block;
        width: 22px;
        height: 2px;
        background: var(--text-primary);
        border-radius: 2px;
        transition: var(--transition);
    }
    
    .navbar-toggle.active span:nth-child(1) {
        transform: rotate(45deg) translate(4px, 4px);
    }
    
    .navbar-toggle.active span:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
    }
    
    .navbar-toggle.active span:nth-child(3) {
        transform: rotate(-45deg) translate(4px, -4px);
    }
    
    .navbar-menu {
        display: flex;
        align-items: center;
        gap: 2px;
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1;
    }
    
    .navbar-menu li {
        list-style: none;
    }
    
    .nav-link {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.8rem;
        transition: var(--transition);
        position: relative;
        white-space: nowrap;
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        width: 100%;
    }
    
    .nav-link i {
        font-size: 0.85rem;
        width: 18px;
        text-align: center;
    }
    
    .nav-link:hover {
        color: var(--text-primary);
        background: var(--bg-hover);
    }
    
    .nav-link.active {
        color: var(--accent-cyan);
        background: rgba(0, 212, 255, 0.06);
    }
    
    .nav-link.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 50%;
        transform: translateX(-50%);
        width: 20px;
        height: 2px;
        background: var(--accent-cyan);
        border-radius: 2px;
    }
    
    .nav-link.logout {
        color: var(--accent-red);
    }
    
    .nav-link.logout:hover {
        background: rgba(239, 68, 68, 0.06);
        color: var(--accent-rose);
    }
    
    .nav-link.theme-toggle {
        color: var(--text-muted);
    }
    
    .nav-link.theme-toggle:hover {
        color: var(--text-primary);
        background: var(--bg-hover);
    }
    
    .nav-badge {
        background: var(--accent-red);
        color: white;
        font-size: 0.5rem;
        padding: 1px 6px;
        border-radius: var(--radius-full);
        min-width: 16px;
        text-align: center;
        font-weight: 600;
    }
    
    .nav-divider {
        width: 1px;
        height: 28px;
        background: var(--border-color);
        margin: 0 4px;
    }
    
    .navbar-status {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
        font-size: 0.75rem;
        color: var(--text-secondary);
    }
    
    .status-item {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    
    .status-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        animation: pulse-dot 2s infinite;
    }
    
    .status-indicator.online { background: var(--accent-green); }
    .status-indicator.warning { background: var(--accent-orange); }
    .status-indicator.offline { background: var(--accent-red); }
    
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
    }
    
    .status-item.uptime {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text-muted);
    }
    
    .status-item.user {
        color: var(--accent-cyan);
        font-weight: 500;
    }
    
    .status-item.user i {
        font-size: 0.9rem;
    }
    
    /* ============================================================
       RESPONSIVE
       ============================================================ */
    
    @media (max-width: 1024px) {
        .navbar-menu { gap: 0; }
        .nav-link { padding: 6px 10px; font-size: 0.75rem; }
        .nav-link i { font-size: 0.75rem; width: 16px; }
    }
    
    @media (max-width: 768px) {
        .navbar { height: 54px; padding: 0 14px; }
        
        .navbar-toggle { display: flex; }
        
        .navbar-menu {
            position: fixed;
            top: 54px;
            left: 0;
            right: 0;
            flex-direction: column;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 16px;
            gap: 2px;
            border-bottom: 1px solid var(--border-color);
            transform: scaleY(0);
            transform-origin: top;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: calc(100vh - 54px);
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }
        
        .navbar-menu.open {
            transform: scaleY(1);
            opacity: 1;
            pointer-events: all;
        }
        
        .navbar-menu li { width: 100%; }
        
        .nav-link {
            padding: 10px 14px;
            width: 100%;
            font-size: 0.85rem;
        }
        
        .nav-link.active::after { display: none; }
        
        .nav-link.active {
            border-right: 2px solid var(--accent-cyan);
            background: rgba(0, 212, 255, 0.04);
        }
        
        .nav-divider {
            width: 100%;
            height: 1px;
            margin: 4px 0;
        }
        
        .navbar-status { gap: 10px; }
        .status-item.uptime { display: none; }
        .status-item.user span { display: none; }
    }
    
    @media (max-width: 480px) {
        .navbar { height: 48px; padding: 0 10px; }
        .navbar-brand { font-size: 0.9rem; }
        .navbar-brand .brand-version { display: none; }
        .navbar-menu { top: 48px; }
        .nav-link { font-size: 0.8rem; padding: 8px 12px; }
        .navbar-status .status-text { display: none; }
    }
</style>

<script>
    // ============================================================
    // NAVBAR SCRIPT v10.0
    // ============================================================
    (function() {
        'use strict';
        
        // ===== 1. منوی همبرگری =====
        const toggle = document.getElementById('navbarToggle');
        const menu = document.getElementById('navbarMenu');
        
        if (toggle && menu) {
            toggle.addEventListener('click', function(e) {
                e.stopPropagation();
                const isOpen = menu.classList.toggle('open');
                toggle.classList.toggle('active', isOpen);
                document.body.style.overflow = isOpen ? 'hidden' : '';
            });
            
            document.addEventListener('click', function(e) {
                if (menu.classList.contains('open')) {
                    if (!menu.contains(e.target) && !toggle.contains(e.target)) {
                        menu.classList.remove('open');
                        toggle.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                }
            });
            
            menu.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    menu.classList.remove('open');
                    toggle.classList.remove('active');
                    document.body.style.overflow = '';
                });
            });
        }
        
        // ===== 2. علامت‌گذاری صفحه فعال =====
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link[data-page]');
        
        navLinks.forEach(link => {
            const page = link.dataset.page;
            if (page === 'dashboard' && (currentPath === '/' || currentPath === '/dashboard')) {
                link.classList.add('active');
            } else if (page !== 'dashboard' && currentPath.includes(page)) {
                link.classList.add('active');
            }
        });
        
        // ===== 3. تغییر تم =====
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        
        if (themeToggle) {
            themeToggle.addEventListener('click', function(e) {
                e.preventDefault();
                if (window.app) {
                    window.app.toggleTheme();
                }
            });
            
            // بارگذاری تم ذخیره شده
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'dark') {
                themeIcon.className = 'fas fa-moon';
                themeLabel.textContent = 'تیره';
            } else {
                themeIcon.className = 'fas fa-sun';
                themeLabel.textContent = 'روشن';
            }
        }
        
        // ===== 4. خروج =====
        document.getElementById('logoutBtn')?.addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('آیا از خروج از حساب کاربری اطمینان دارید؟')) {
                api.logout()
                    .then(() => {
                        document.cookie = 'session_id=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
                        window.location.href = '/';
                    })
                    .catch(() => {
                        window.location.href = '/';
                    });
            }
        });
        
        // ===== 5. دریافت اطلاعات کاربر =====
        async function loadUserInfo() {
            try {
                const data = await api.getUserInfo();
                if (data.success) {
                    const display = document.getElementById('userDisplay');
                    if (display) {
                        const roleMap = { 
                            'admin': '👑 ادمین', 
                            'vip': '⭐ VIP', 
                            'guest': '👤 مهمان' 
                        };
                        display.innerHTML = `<i class="fas fa-user-circle"></i> ${roleMap[data.data.role] || data.data.username}`;
                    }
                }
            } catch (err) {
                console.error('User info error:', err);
            }
        }
        loadUserInfo();
        
        // ===== 6. آپتایم =====
        async function fetchUptime() {
            try {
                const data = await api.getStats();
                if (data.success) {
                    const el = document.getElementById('uptimeDisplay');
                    if (el) el.textContent = data.data.uptime || '0s';
                }
            } catch (err) {
                // Silently fail
            }
        }
        fetchUptime();
        setInterval(fetchUptime, 30000);
        
        // ===== 7. وضعیت سیستم =====
        async function updateStatus() {
            try {
                const data = await api.getMetrics();
                if (data.success) {
                    const metrics = data.data.metrics || {};
                    const apiStatus = metrics.api_status?.value || 'unknown';
                    const dot = document.getElementById('statusDot');
                    const text = document.getElementById('statusText');
                    
                    if (dot && text) {
                        dot.className = 'status-indicator';
                        if (apiStatus === 'ok') {
                            dot.classList.add('online');
                            text.textContent = 'پایدار';
                        } else if (apiStatus === 'degraded') {
                            dot.classList.add('warning');
                            text.textContent = 'ضعیف';
                        } else {
                            dot.classList.add('offline');
                            text.textContent = 'قطع';
                        }
                    }
                    
                    // تعداد هشدارها
                    const alertData = await api.getAlerts({ limit: 1, resolved: false });
                    const badge = document.getElementById('alertBadge');
                    if (badge && alertData.data) {
                        const count = alertData.data.length || 0;
                        badge.textContent = count;
                        badge.style.display = count > 0 ? 'inline' : 'none';
                    }
                }
            } catch (err) {
                // Silently fail
            }
        }
        updateStatus();
        setInterval(updateStatus, 15000);
        
        console.log('✅ Navbar v10.0 loaded');
    })();
</script>
