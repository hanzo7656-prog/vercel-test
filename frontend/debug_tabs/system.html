<!-- ============================================================
     debug_tabs/system.html — تب اطلاعات سیستم
     نسخه ۲.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="card">
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-server"></i>
            <span>اطلاعات کامل سیستم</span>
        </div>
        <button class="btn btn-xs btn-outline" onclick="refreshDebugSystem()">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <div id="systemContent">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری...</p>
        </div>
    </div>
</div>

<script>
// ============================================================
// DEBUG SYSTEM TAB
// ============================================================

async function refreshDebugSystem() {
    const container = document.getElementById('systemContent');
    if (!container) return;

    container.innerHTML = `
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری اطلاعات سیستم...</p>
        </div>
    `;

    try {
        const [systemRes, statsRes] = await Promise.allSettled([
            api.getDebugSystem(),
            api.getStats(),
        ]);

        const systemData = systemRes.status === 'fulfilled' ? systemRes.value : null;
        const statsData = statsRes.status === 'fulfilled' ? statsRes.value : null;

        if (!systemData?.success || !systemData.data) {
            throw new Error(systemData?.error || 'خطا در دریافت اطلاعات سیستم');
        }

        const s = systemData.data;
        const stats = statsData?.data || {};

        container.innerHTML = `
            <!-- Info Grid -->
            <div class="debug-info-grid">
                <div class="debug-info-card">
                    <div class="dic-label">🐍 Python</div>
                    <div class="dic-value">${escapeHtml(s.python || '—')}</div>
                </div>
                <div class="debug-info-card">
                    <div class="dic-label">🖥️ Platform</div>
                    <div class="dic-value">${escapeHtml(s.platform || '—')}</div>
                </div>
                <div class="debug-info-card">
                    <div class="dic-label">🌐 Environment</div>
                    <div class="dic-value text-cyan">${escapeHtml(s.environment || '—')}</div>
                </div>
                <div class="debug-info-card">
                    <div class="dic-label">⏰ Timezone</div>
                    <div class="dic-value">${escapeHtml(s.timezone || '—')}</div>
                </div>
                <div class="debug-info-card">
                    <div class="dic-label">📂 مسیر کاری</div>
                    <div class="dic-value dic-value-sm">${escapeHtml(s.cwd || '—')}</div>
                </div>
                <div class="debug-info-card">
                    <div class="dic-label">📅 زمان سرور</div>
                    <div class="dic-value text-green">${formatDate(new Date()) || '—'}</div>
                </div>
            </div>

            <!-- Info Sections -->
            <div class="debug-info-sections">
                <div class="debug-info-section">
                    <div class="dis-title">💻 اطلاعات سیستم</div>
                    <div class="dis-grid">
                        <span class="dis-key">Hostname:</span>
                        <span class="dis-val">${escapeHtml(s.hostname || '—')}</span>

                        <span class="dis-key">System:</span>
                        <span class="dis-val">${escapeHtml(s.system || '—')}</span>

                        <span class="dis-key">Release:</span>
                        <span class="dis-val">${escapeHtml(s.release || '—')}</span>

                        <span class="dis-key">Machine:</span>
                        <span class="dis-val">${escapeHtml(s.machine || '—')}</span>

                        <span class="dis-key">Processor:</span>
                        <span class="dis-val">${escapeHtml(s.processor || '—')}</span>
                    </div>
                </div>

                <div class="debug-info-section">
                    <div class="dis-title">📊 آمار سیستم</div>
                    <div class="dis-grid">
                        <span class="dis-key">جمع‌آوری‌ها:</span>
                        <span class="dis-val">${stats.collections || 0}</span>

                        <span class="dis-key">پیش‌بینی‌ها:</span>
                        <span class="dis-val">${stats.predictions || 0}</span>

                        <span class="dis-key">آپتایم:</span>
                        <span class="dis-val">${stats.uptime || '—'}</span>
                    </div>
                </div>
            </div>

            <!-- Env Variables -->
            <div class="debug-info-section">
                <div class="dis-title">🔧 متغیرهای محیطی مهم</div>
                <div class="dis-grid">
                    <span class="dis-key">FLASK_ENV:</span>
                    <span class="dis-val">${escapeHtml(s.environment || '—')}</span>

                    <span class="dis-key">TZ:</span>
                    <span class="dis-val">${escapeHtml(s.timezone || '—')}</span>

                    <span class="dis-key">PYTHONPATH:</span>
                    <span class="dis-val dis-val-sm">${escapeHtml(s.pythonpath || '—')}</span>
                </div>
            </div>
        `;
    } catch (err) {
        console.error('System error:', err);
        container.innerHTML = `
            <div class="empty-state error">
                <span class="empty-icon">⚠️</span>
                <div class="empty-title">خطا در دریافت اطلاعات</div>
                <div class="empty-message">${escapeHtml(err.message)}</div>
                <button class="empty-action" onclick="refreshDebugSystem()">
                    <i class="fas fa-sync-alt"></i>
                    تلاش مجدد
                </button>
            </div>
        `;
    }
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_system = function() {
    console.log('🖥️ Debug system tab initializing...');
    refreshDebugSystem();
};

window.cleanup_system = function() {
    console.log('🧹 Debug system tab cleaning up...');
    // No interval to clean
};

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
</script>

<style>
.debug-info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: var(--space-4);
    margin-bottom: var(--space-5);
}

.debug-info-card {
    background: var(--bg-input);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    transition: var(--transition);
    animation: slideUp 0.4s var(--ease-out) backwards;
}

.debug-info-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
}

.debug-info-card .dic-label {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: var(--fw-semibold);
    margin-bottom: var(--space-2);
}

.debug-info-card .dic-value {
    font-size: var(--fs-base);
    font-weight: var(--fw-semibold);
    color: var(--text-primary);
    font-family: var(--font-mono);
    word-break: break-word;
}

.debug-info-card .dic-value-sm {
    font-size: var(--fs-xs);
    font-weight: var(--fw-normal);
}

.debug-info-sections {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-4);
    margin-bottom: var(--space-4);
}

.debug-info-section {
    background: var(--bg-input);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
}

.dis-title {
    font-size: var(--fs-sm);
    color: var(--text-secondary);
    font-weight: var(--fw-semibold);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: var(--space-3);
    padding-bottom: var(--space-2);
    border-bottom: 1px solid var(--border-color);
}

.dis-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: var(--space-2) var(--space-4);
    font-size: var(--fs-sm);
}

.dis-key {
    color: var(--text-secondary);
    font-weight: var(--fw-medium);
}

.dis-val {
    color: var(--text-primary);
    font-family: var(--font-mono);
    word-break: break-word;
}

.dis-val-sm {
    font-size: var(--fs-xs);
}

@media (max-width: 768px) {
    .debug-info-sections {
        grid-template-columns: 1fr;
    }

    .debug-info-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 480px) {
    .debug-info-grid {
        grid-template-columns: 1fr;
    }
}
</style>
