<!-- ============================================================
     debug_tabs/cli.html — تب کنسول تعاملی
     نسخه ۲.۰ — با init/cleanup استاندارد + mode switcher
     ============================================================ -->

<div class="card">
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-terminal"></i>
            <span>کنسول تعاملی</span>
        </div>
        <button class="btn btn-xs btn-danger" onclick="clearCli()">
            <i class="fas fa-eraser"></i>
            <span>پاک</span>
        </button>
    </div>

    <!-- Mode Switcher -->
    <div class="cli-mode-switcher" id="cliModeSwitcher">
        <button class="cli-mode-btn active" data-mode="python" onclick="setCliMode('python')">
            <i class="fab fa-python"></i>
            <span>Python</span>
        </button>
        <button class="cli-mode-btn" data-mode="shell" onclick="setCliMode('shell')">
            <i class="fas fa-terminal"></i>
            <span>Shell</span>
        </button>
        <button class="cli-mode-btn" data-mode="terminal" onclick="setCliMode('terminal')">
            <i class="fas fa-desktop"></i>
            <span>Terminal</span>
        </button>
    </div>

    <!-- Output -->
    <div class="console-output cli-output" id="cliOutput">
        <div class="log-line">
            <span class="log-time">🚀</span>
            <span class="log-level info">INFO</span>
            <span class="log-msg">کنسول آماده است. <strong class="text-cyan">/help</strong> برای راهنما</span>
        </div>
        <div class="log-line">
            <span class="log-time">💡</span>
            <span class="log-level info">INFO</span>
            <span class="log-msg">
                میانبرها:
                <strong class="text-cyan">/cpu</strong>
                <strong class="text-cyan">/ram</strong>
                <strong class="text-cyan">/uptime</strong>
                <strong class="text-cyan">/stats</strong>
                <strong class="text-cyan">/clear</strong>
                <strong class="text-cyan">/help</strong>
            </span>
        </div>
    </div>

    <!-- Input -->
    <div class="cli-area">
        <div class="cli-input-wrapper">
            <span class="cli-prompt" id="cliPrompt">>>> </span>
            <textarea
                id="cliInput"
                class="cli-input"
                placeholder="دستور خود را وارد کنید..."
                spellcheck="false"></textarea>
        </div>

        <!-- Shortcuts -->
        <div class="cli-shortcuts">
            <button class="cli-shortcut" onclick="insertCliCommand('/cpu')">⚡ /cpu</button>
            <button class="cli-shortcut" onclick="insertCliCommand('/ram')">💾 /ram</button>
            <button class="cli-shortcut" onclick="insertCliCommand('/uptime')">⏱️ /uptime</button>
            <button class="cli-shortcut" onclick="insertCliCommand('/stats')">📊 /stats</button>
            <button class="cli-shortcut" onclick="insertCliCommand('/help')">❓ /help</button>
            <button class="cli-shortcut" onclick="insertCliCommand('ls -la')">📂 ls</button>
            <button class="cli-shortcut" onclick="insertCliCommand('ps aux')">📈 ps</button>
            <button class="cli-shortcut" onclick="insertCliCommand('df -h')">💿 df</button>
        </div>

        <!-- Actions -->
        <div class="cli-actions">
            <button class="btn btn-primary btn-sm" onclick="executeCliCommand()">
                <i class="fas fa-play"></i>
                <span>اجرا (Ctrl+Enter)</span>
            </button>
            <button class="btn btn-outline btn-sm" onclick="clearCliInput()">
                <i class="fas fa-times"></i>
                <span>پاک کردن</span>
            </button>
        </div>
    </div>
</div>

<script>
// ============================================================
// DEBUG CLI TAB
// ============================================================

let _cliMode = 'python';
let _cliHistory = [];
let _cliHistoryIndex = -1;
let _cliInitialized = false;

// ============================================================
// Commands Shortcuts
// ============================================================

const CLI_SHORTCUTS = {
    '/cpu': 'import psutil, os; p=psutil.Process(os.getpid()); print(f"App CPU: {p.cpu_percent(interval=0.3)}%")',
    '/ram': 'import psutil, os; p=psutil.Process(os.getpid()); m=p.memory_info(); print(f"App RAM: {m.rss/(1024*1024):.1f} MB")',
    '/uptime': 'import psutil, os, time; p=psutil.Process(os.getpid()); s=int(time.time()-p.create_time()); d,h,m=s//86400,(s%86400)//3600,(s%3600)//60; print(f"Uptime: {d}d {h}h {m}m")',
    '/stats': 'import psutil, os, time; p=psutil.Process(os.getpid()); m=p.memory_info(); c=p.cpu_percent(interval=0.3); u=int(time.time()-p.create_time()); d,h,mi=u//86400,(u%86400)//3600,(u%3600)//60; print(f"PID: {os.getpid()}\\nCPU: {c}%\\nRAM: {m.rss/(1024*1024):.1f} MB\\nUptime: {d}d {h}h {mi}m")',
    '/clear': '__CLEAR__',
    '/help': 'print("📋 میانبرها:\\n  /cpu   - مصرف CPU\\n  /ram   - مصرف RAM\\n  /uptime - آپتایم\\n  /stats - همه آمار\\n  /clear - پاک کردن\\n  /help  - راهنما")',
};

// ============================================================
// Mode Switcher
// ============================================================

function setCliMode(mode) {
    _cliMode = mode;

    const modes = {
        python: { prompt: '>>> ', color: '#00d4ff' },
        shell: { prompt: '$ ', color: '#f59e0b' },
        terminal: { prompt: '$ ', color: '#22d3ee' },
    };

    const cfg = modes[mode] || modes.python;

    // Update buttons
    document.querySelectorAll('#cliModeSwitcher .cli-mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
    });

    // Update prompt
    const prompt = document.getElementById('cliPrompt');
    if (prompt) {
        prompt.textContent = cfg.prompt;
        prompt.style.color = cfg.color;
    }

    // Update input
    const input = document.getElementById('cliInput');
    if (input) {
        input.placeholder = mode === 'python'
            ? 'دستور پایتون...'
            : mode === 'shell'
                ? 'دستور شل...'
                : 'دستور ترمینال...';
    }
}

function insertCliCommand(cmd) {
    const input = document.getElementById('cliInput');
    if (input) {
        input.value = cmd;
        input.focus();
    }
}

function clearCliInput() {
    const input = document.getElementById('cliInput');
    if (input) input.value = '';
}

// ============================================================
// Execute
// ============================================================

async function executeCliCommand() {
    const input = document.getElementById('cliInput');
    const output = document.getElementById('cliOutput');
    if (!input || !output) return;

    let cmd = input.value.trim();
    if (!cmd) {
        if (typeof showToast === 'function') showToast('⚠️ دستور را وارد کنید', 'warning');
        return;
    }

    // Save to history
    _cliHistory.push(cmd);
    if (_cliHistory.length > 50) _cliHistory.shift();
    _cliHistoryIndex = -1;

    let type = _cliMode;
    let actualCmd = cmd;

    // Check shortcut
    if (CLI_SHORTCUTS[cmd]) {
        actualCmd = CLI_SHORTCUTS[cmd];

        if (actualCmd === '__CLEAR__') {
            clearCli();
            input.value = '';
            return;
        }

        type = 'python';
    } else if (cmd.startsWith('/')) {
        type = 'shell';
        actualCmd = cmd.substring(1);
    }

    // Add command line
    const now = new Date().toLocaleTimeString('fa-IR');
    const typeLabels = {
        python: '🐍 PY',
        shell: '💻 SH',
        terminal: '🖥️ TM',
    };
    const typeColors = {
        python: 'var(--color-green)',
        shell: 'var(--color-orange)',
        terminal: 'var(--color-cyan)',
    };

    output.innerHTML += `
        <div class="log-line cmd">
            <span class="log-time">${now}</span>
            <span class="log-level" style="color:${typeColors[type] || 'var(--color-cyan)'};">
                ${typeLabels[type] || '📝'}
            </span>
            <span class="log-msg">${escapeHtml(cmd)}</span>
        </div>
    `;

    input.value = '';
    output.scrollTop = output.scrollHeight;

    // Execute
    try {
        const data = await api.executeDebugCommand(actualCmd, type, 15);

        if (data?.success) {
            const result = data.result || 'انجام شد';
            output.innerHTML += `
                <div class="log-line success">
                    <span class="log-time">${now}</span>
                    <span class="log-level success">✅ RESULT</span>
                    <span class="log-msg">${escapeHtml(result)}</span>
                    <button class="log-copy-btn" onclick="copyCliLine(this)">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
            `;
        } else {
            output.innerHTML += `
                <div class="log-line error">
                    <span class="log-time">${now}</span>
                    <span class="log-level error">❌ ERROR</span>
                    <span class="log-msg">${escapeHtml(data?.error || 'خطا')}</span>
                </div>
            `;
        }
    } catch (err) {
        output.innerHTML += `
            <div class="log-line error">
                <span class="log-time">${now}</span>
                <span class="log-level error">❌ ERROR</span>
                <span class="log-msg">${escapeHtml(err.message)}</span>
            </div>
        `;
    }

    output.scrollTop = output.scrollHeight;
}

function clearCli() {
    const output = document.getElementById('cliOutput');
    if (!output) return;

    const modeLabels = {
        python: 'Python',
        shell: 'Shell',
        terminal: 'Terminal',
    };

    output.innerHTML = `
        <div class="log-line">
            <span class="log-time">🧹</span>
            <span class="log-level info">INFO</span>
            <span class="log-msg">خروجی پاک شد</span>
        </div>
        <div class="log-line">
            <span class="log-time">💡</span>
            <span class="log-level info">INFO</span>
            <span class="log-msg">
                حالت فعلی: <strong>${modeLabels[_cliMode]}</strong> |
                <strong class="text-cyan">/help</strong> برای راهنما
            </span>
        </div>
    `;
}

function copyCliLine(btn) {
    const line = btn.closest('.log-line');
    if (!line) return;

    const msg = line.querySelector('.log-msg')?.textContent || '';

    if (navigator.clipboard) {
        navigator.clipboard.writeText(msg).then(() => {
            if (typeof showToast === 'function') showToast('📋 کپی شد', 'success');
        });
    }
}

// ============================================================
// Setup Events
// ============================================================

function _setupCliEvents() {
    const input = document.getElementById('cliInput');
    if (!input) return;

    input.addEventListener('keydown', (e) => {
        // Ctrl+Enter → execute
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            executeCliCommand();
            return;
        }

        // Up arrow → previous command
        if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (_cliHistory.length === 0) return;

            if (_cliHistoryIndex === -1) {
                _cliHistoryIndex = _cliHistory.length - 1;
            } else if (_cliHistoryIndex > 0) {
                _cliHistoryIndex--;
            }

            input.value = _cliHistory[_cliHistoryIndex] || '';
            return;
        }

        // Down arrow → next command
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (_cliHistoryIndex === -1) return;

            if (_cliHistoryIndex < _cliHistory.length - 1) {
                _cliHistoryIndex++;
                input.value = _cliHistory[_cliHistoryIndex] || '';
            } else {
                _cliHistoryIndex = -1;
                input.value = '';
            }
            return;
        }

        // Enter (without Ctrl) → new line (default textarea behavior)
    });
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_cli = function() {
    console.log('💻 Debug CLI tab initializing...');

    if (_cliInitialized) return;
    _cliInitialized = true;

    setCliMode('python');
    _setupCliEvents();
};

window.cleanup_cli = function() {
    console.log('🧹 Debug CLI tab cleaning up...');
    _cliInitialized = false;
};

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
</script>

<style>

}
