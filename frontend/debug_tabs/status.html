<!-- ============================================================
     debug_tabs/status.html — تب وضعیت سیستم
     نسخه ۲.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="card">
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-heartbeat"></i>
            <span>وضعیت سیستم</span>
        </div>
        <button class="btn btn-xs btn-outline" onclick="refreshDebugStatus()">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <div id="statusContent">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری...</p>
        </div>
    </div>
</div>

<script>
// ============================================================
// DEBUG STATUS TAB
// ============================================================

let _statusInterval = null;

async function refreshDebugStatus() {
    const container = document.getElementById('statusContent');
    if (!container) return;

    try {
        const data = await api.getMetrics();

        if (!data?.success || !data.data) {
            throw new Error(data?.error || 'خطا در دریافت اطلاعات');
        }

        const m = data.data.metrics || {};
        const stats = data.data.stats || {};

        const apiStatus = m.api_status?.value || 'unknown';
        const apiStatusText = {
            ok: '✅ سالم',
            degraded: '⚠️ ضعیف',
            error: '❌ قطع',
            unknown: '❓ نامشخص',
        };
        const apiStatusColor = {
            ok: 'green',
            degraded: 'orange',
            error: 'red',
            unknown: 'orange',
        };

        const modelStatus = m.model_status?.value || {};
        const dbs = m.databases?.value || {};

        container.innerHTML = `
            <div class="debug-status-grid">
                <div class="debug-status-card">
                    <div class="dsc-label">🔌 API</div>
                    <div class="dsc-value text-${apiStatusColor[apiStatus] || 'muted'}">
                        ${apiStatusText[apiStatus] || '—'}
                    </div>
                    <div class="dsc-sub">
                        اعتبار: ${(m.api_credits?.value || 0).toLocaleString('en-US')}
                    </div>
                </div>

                <div class="debug-status-card">
                    <div class="dsc-label">🧠 مدل</div>
                    <div class="dsc-value ${modelStatus.loaded ? 'text-green' : 'text-orange'}">
                        ${modelStatus.loaded ? '✅ فعال' : '📦 دمو'}
                    </div>
                    <div class="dsc-sub">
                        نسخه: ${modelStatus.version || 'N/A'}
                    </div>
                </div>

                <div class="debug-status-card">
                    <div class="dsc-label">📊 جمع‌آوری‌ها</div>
                    <div class="dsc-value text-cyan">
                        ${stats.collections || 0}
                    </div>
                    <div class="dsc-sub">
                        ${stats.predictions || 0} پیش‌بینی
                    </div>
                </div>
            </div>

            <div class="debug-db-list">
                <div class="debug-db-label">🗄️ دیتابیس‌ها:</div>
                <div class="debug-db-items">
                    ${Object.entries(dbs).map(([name, connected]) => `
                        <span class="badge ${connected ? 'badge-green' : 'badge-red'}">
                            ${connected ? '🟢' : '🔴'} ${escapeHtml(name)}
                        </span>
                    `).join('') || '<span class="text-muted text-sm">بدون اطلاعات</span>'}
                </div>
            </div>

            <div class="debug-timestamp">
                آخرین بروزرسانی: ${formatDate(data.data.timestamp) || '—'}
            </div>
        `;
    } catch (err) {
        console.error('Status error:', err);
        container.innerHTML = `
            <div class="empty-state error">
                <span class="empty-icon">❌</span>
                <div class="empty-title">خطا در ارتباط با سرور</div>
                <div class="empty-message">${escapeHtml(err.message)}</div>
                <button class="empty-action" onclick="refreshDebugStatus()">
                    <i class="fas fa-sync-alt"></i>
                    تلاش مجدد
                </button>
            </div>
        `;
    }
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_status = function() {
    console.log('📊 Debug status tab initializing...');
    refreshDebugStatus();

    if (_statusInterval) clearInterval(_statusInterval);
    _statusInterval = setInterval(() => {
        // فقط اگه تب status فعلی باشه
        const activeTab = document.querySelector('#debugTabs .tab-btn.active');
        if (activeTab?.dataset.tab === 'status') {
            refreshDebugStatus();
        }
    }, 10000);
};

window.cleanup_status = function() {
    console.log('🧹 Debug status tab cleaning up...');
    if (_statusInterval) {
        clearInterval(_statusInterval);
        _statusInterval = null;
    }
};

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
</script>

<style>
.debug-status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: var(--space-4);
    margin-bottom: var(--space-4);
}

.debug-status-card {
    background: var(--bg-input);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    transition: var(--transition);
    animation: slideUp 0.4s var(--ease-out) backwards;
}

.debug-status-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
}

.debug-status-card .dsc-label {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: var(--space-2);
    font-weight: var(--fw-semibold);
}

.debug-status-card .dsc-value {
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    font-family: var(--font-mono);
    margin-bottom: var(--space-1);
}

.debug-status-card .dsc-sub {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    font-family: var(--font-mono);
}

.debug-db-list {
    padding: var(--space-3) var(--space-4);
    background: var(--bg-input);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: var(--space-3);
    flex-wrap: wrap;
    margin-bottom: var(--space-3);
}

.debug-db-label {
    font-size: var(--fs-sm);
    color: var(--text-muted);
    font-weight: var(--fw-medium);
}

.debug-db-items {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
}

.debug-timestamp {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    font-family: var(--font-mono);
    text-align: left;
}
</style>
