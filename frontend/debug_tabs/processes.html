<div class="card">
    <div class="card-title">
        <i class="fas fa-tasks"></i> پردازش‌های فعال
        <div style="display:flex;gap:6px;margin-right:auto;">
            <input id="processSearch" placeholder="🔍 جستجو..." onkeyup="filterProcesses()" style="padding:4px 10px;font-size:0.7rem;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);width:150px;">
            <button class="btn btn-xs btn-outline" onclick="refreshProcesses()"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>
    <div id="processesContent">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری...</p>
        </div>
    </div>
</div>

<script>
// ============================================================
// PROCESSES TAB - کامل و پیشرفته
// ============================================================

let processesData = [];

async function refreshProcesses() {
    const container = document.getElementById('processesContent');
    container.innerHTML = `
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری پردازش‌ها...</p>
        </div>
    `;
    
    try {
        const data = await api.getDebugProcesses({ limit: 50 });
        if (data.success && data.data) {
            processesData = data.data || [];
            renderProcesses(processesData);
        } else {
            container.innerHTML = `
                <div class="error-msg">
                    <span class="icon">⚠️</span>
                    <p>خطا در دریافت پردازش‌ها</p>
                </div>
            `;
        }
    } catch (err) {
        console.error('Processes error:', err);
        container.innerHTML = `
            <div class="error-msg">
                <span class="icon">❌</span>
                <p>خطا در ارتباط با سرور</p>
                <p style="font-size:0.7rem;color:var(--text-muted);margin-top:4px;">${err.message}</p>
            </div>
        `;
    }
}

function renderProcesses(data) {
    const container = document.getElementById('processesContent');
    if (!data || data.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:30px;color:var(--text-muted);">
                <span style="font-size:2.5rem;display:block;margin-bottom:8px;">📭</span>
                هیچ پردازشی یافت نشد
            </div>
        `;
        return;
    }
    
    container.innerHTML = `
        <div style="overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border-color);">
            <table style="width:100%;border-collapse:collapse;font-size:0.7rem;min-width:600px;">
                <thead>
                    <tr>
                        <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.55rem;text-transform:uppercase;border-bottom:2px solid var(--border-color);background:var(--bg-input);">PID</th>
                        <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.55rem;text-transform:uppercase;border-bottom:2px solid var(--border-color);background:var(--bg-input);">نام</th>
                        <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.55rem;text-transform:uppercase;border-bottom:2px solid var(--border-color);background:var(--bg-input);">وضعیت</th>
                        <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.55rem;text-transform:uppercase;border-bottom:2px solid var(--border-color);background:var(--bg-input);">CPU</th>
                        <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.55rem;text-transform:uppercase;border-bottom:2px solid var(--border-color);background:var(--bg-input);">حافظه</th>
                        <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.55rem;text-transform:uppercase;border-bottom:2px solid var(--border-color);background:var(--bg-input);">عملیات</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.map(p => `
                        <tr onclick="showProcessDetails(${p.pid})" style="cursor:pointer;transition:var(--transition);">
                            <td style="padding:6px 12px;border-bottom:1px solid var(--border-color);font-family:var(--font-mono);font-size:0.7rem;color:var(--text-primary);">${p.pid || '—'}</td>
                            <td style="padding:6px 12px;border-bottom:1px solid var(--border-color);color:var(--text-primary);">${p.name || '—'}</td>
                            <td style="padding:6px 12px;border-bottom:1px solid var(--border-color);">
                                <span class="badge ${p.status === 'running' ? 'badge-green' : p.status === 'sleeping' ? 'badge-cyan' : 'badge-orange'}" style="padding:2px 10px;border-radius:20px;font-size:0.55rem;">
                                    ${p.status || '—'}
                                </span>
                            </td>
                            <td style="padding:6px 12px;border-bottom:1px solid var(--border-color);font-family:var(--font-mono);font-size:0.7rem;color:${(p.cpu_percent || 0) > 20 ? 'var(--accent-orange)' : 'var(--accent-cyan)'};">${(p.cpu_percent || 0).toFixed(1)}%</td>
                            <td style="padding:6px 12px;border-bottom:1px solid var(--border-color);font-family:var(--font-mono);font-size:0.7rem;color:${(p.memory_percent || 0) > 20 ? 'var(--accent-orange)' : 'var(--accent-cyan)'};">${(p.memory_percent || 0).toFixed(1)}%</td>
                            <td style="padding:6px 12px;border-bottom:1px solid var(--border-color);">
                                <button class="btn btn-xs btn-danger" onclick="event.stopPropagation();killProcess(${p.pid})" title="خاتمه پردازش" style="padding:2px 8px;font-size:0.55rem;">
                                    <i class="fas fa-skull"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
        <div style="margin-top:8px;font-size:0.6rem;color:var(--text-muted);text-align:left;">
            نمایش ${data.length} پردازش
        </div>
    `;
}

function filterProcesses() {
    const search = document.getElementById('processSearch').value.toLowerCase();
    const filtered = processesData.filter(p => 
        (p.name || '').toLowerCase().includes(search) ||
        String(p.pid || '').includes(search)
    );
    renderProcesses(filtered);
}

async function showProcessDetails(pid) {
    try {
        const data = await api.getProcessDetails(pid);
        if (data.success && data.data) {
            const d = data.data;
            let msg = `📋 جزئیات پردازش PID: ${pid}\n`;
            msg += `${'─'.repeat(40)}\n`;
            msg += `📛 نام: ${d.name || '—'}\n`;
            msg += `📊 وضعیت: ${d.status || '—'}\n`;
            msg += `⚡ CPU: ${(d.cpu_percent || 0).toFixed(1)}%\n`;
            msg += `🧠 RAM: ${(d.memory_percent || 0).toFixed(1)}%\n`;
            msg += `🧵 تردها: ${d.num_threads || 0}\n`;
            msg += `👤 کاربر: ${d.username || '—'}\n`;
            msg += `⏱️ شروع: ${d.create_time_formatted ? formatDate(d.create_time_formatted) : '—'}\n`;
            msg += `📂 مسیر: ${d.cwd || '—'}\n`;
            msg += `💻 دستور: ${d.cmdline ? d.cmdline.join(' ') : '—'}`;
            alert(msg);
        }
    } catch (err) {
        showToast('❌ خطا در دریافت جزئیات: ' + err.message, 'error');
    }
}

async function killProcess(pid) {
    if (!confirm(`⚠️ آیا از خاتمه پردازش ${pid} اطمینان دارید؟`)) return;
    try {
        const data = await api.killProcess(pid);
        if (data.success) {
            showToast(`✅ پردازش ${pid} خاتمه یافت`, 'success');
            refreshProcesses();
        } else {
            showToast('❌ ' + data.error, 'error');
        }
    } catch (err) {
        showToast('❌ خطا', 'error');
    }
}

window.init_processes = function() {
    refreshProcesses();
    setInterval(refreshProcesses, 15000);
};
</script>
