<!-- ============================================================
     debug_tabs/processes.html — تب پردازش‌ها
     نسخه ۲.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="card">
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-tasks"></i>
            <span>پردازش‌های فعال</span>
        </div>
        <div class="header-actions">
            <input
                type="text"
                id="processSearch"
                class="form-input form-input-sm"
                placeholder="🔍 جستجو..."
                oninput="filterDebugProcesses()"
                style="width: 180px;">
            <button class="btn btn-xs btn-outline" onclick="refreshDebugProcesses()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <div id="processesContent">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری پردازش‌ها...</p>
        </div>
    </div>
</div>

<script>
// ============================================================
// DEBUG PROCESSES TAB
// ============================================================

let _processesData = [];
let _processesInterval = null;

async function refreshDebugProcesses() {
    const container = document.getElementById('processesContent');
    if (!container) return;

    container.innerHTML = `
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری پردازش‌ها...</p>
        </div>
    `;

    try {
        const data = await api.getDebugProcesses({ limit: 50 });

        if (!data?.success) {
            throw new Error(data?.error || 'خطا در دریافت پردازش‌ها');
        }

        _processesData = data.data || [];
        renderDebugProcesses(_processesData);

    } catch (err) {
        console.error('Processes error:', err);
        container.innerHTML = `
            <div class="empty-state error">
                <span class="empty-icon">❌</span>
                <div class="empty-title">خطا در ارتباط با سرور</div>
                <div class="empty-message">${escapeHtml(err.message)}</div>
                <button class="empty-action" onclick="refreshDebugProcesses()">
                    <i class="fas fa-sync-alt"></i>
                    تلاش مجدد
                </button>
            </div>
        `;
    }
}

function renderDebugProcesses(data) {
    const container = document.getElementById('processesContent');
    if (!container) return;

    if (!data || data.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <span class="empty-icon">📭</span>
                <div class="empty-title">هیچ پردازشی یافت نشد</div>
                <div class="empty-message">لیست پردازش‌ها خالی است</div>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div class="table-wrap">
            <table class="table-modern">
                <thead>
                    <tr>
                        <th>PID</th>
                        <th>نام</th>
                        <th>وضعیت</th>
                        <th>CPU</th>
                        <th>حافظه</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.map(p => `
                        <tr style="cursor:pointer;" onclick="showDebugProcessDetails(${p.pid})">
                            <td style="font-family:var(--font-mono);">${p.pid || '—'}</td>
                            <td>${escapeHtml(p.name || '—')}</td>
                            <td>
                                <span class="badge ${
                                    p.status === 'running' ? 'badge-green' :
                                    p.status === 'sleeping' ? 'badge-cyan' :
                                    'badge-orange'
                                }">
                                    ${escapeHtml(p.status || '—')}
                                </span>
                            </td>
                            <td style="font-family:var(--font-mono);color:${(p.cpu_percent || 0) > 20 ? 'var(--color-orange)' : 'var(--color-cyan)'};">
                                ${(p.cpu_percent || 0).toFixed(1)}%
                            </td>
                            <td style="font-family:var(--font-mono);color:${(p.memory_percent || 0) > 20 ? 'var(--color-orange)' : 'var(--color-cyan)'};">
                                ${(p.memory_percent || 0).toFixed(1)}%
                            </td>
                            <td>
                                <button class="btn btn-xs btn-danger" onclick="event.stopPropagation();killDebugProcess(${p.pid})" title="خاتمه">
                                    <i class="fas fa-skull"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
        <div style="margin-top:var(--space-3);font-size:var(--fs-xs);color:var(--text-muted);text-align:left;">
            نمایش ${data.length} پردازش
        </div>
    `;
}

function filterDebugProcesses() {
    const search = (document.getElementById('processSearch')?.value || '').toLowerCase();
    const filtered = _processesData.filter(p =>
        (p.name || '').toLowerCase().includes(search) ||
        String(p.pid || '').includes(search)
    );
    renderDebugProcesses(filtered);
}

async function showDebugProcessDetails(pid) {
    try {
        const data = await api.getProcessDetails(pid);

        if (!data?.success || !data.data) {
            if (typeof showToast === 'function') showToast('❌ خطا در دریافت جزئیات', 'error');
            return;
        }

        const d = data.data;

        let msg = `📋 جزئیات پردازش PID: ${pid}\n`;
        msg += `${'─'.repeat(40)}\n`;
        msg += `📛 نام: ${d.name || '—'}\n`;
        msg += `📊 وضعیت: ${d.status || '—'}\n`;
        msg += `⚡ CPU: ${(d.cpu_percent || 0).toFixed(1)}%\n`;
        msg += `🧠 RAM: ${(d.memory_percent || 0).toFixed(1)}%\n`;
        msg += `🧵 تردها: ${d.num_threads || 0}\n`;
        msg += `👤 کاربر: ${d.username || '—'}\n`;
        msg += `⏱️ شروع: ${d.create_time_formatted ? formatDate(d.create_time_formatted) : '—'}\n`;
        msg += `📂 مسیر: ${d.cwd || '—'}\n`;
        msg += `💻 دستور: ${d.cmdline ? d.cmdline.join(' ') : '—'}`;

        alert(msg);
    } catch (err) {
        if (typeof showToast === 'function') {
            showToast('❌ خطا در دریافت جزئیات: ' + err.message, 'error');
        }
    }
}

async function killDebugProcess(pid) {
    if (!confirm(`⚠️ آیا از خاتمه پردازش ${pid} اطمینان دارید؟`)) return;

    try {
        const data = await api.killProcess(pid);

        if (data?.success) {
            if (typeof showToast === 'function') {
                showToast(`✅ پردازش ${pid} خاتمه یافت`, 'success');
            }
            refreshDebugProcesses();
        } else {
            if (typeof showToast === 'function') {
                showToast('❌ ' + (data?.error || 'خطا'), 'error');
            }
        }
    } catch (err) {
        if (typeof showToast === 'function') {
            showToast('❌ ' + err.message, 'error');
        }
    }
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_processes = function() {
    console.log('⚙️ Debug processes tab initializing...');
    refreshDebugProcesses();

    if (_processesInterval) clearInterval(_processesInterval);
    _processesInterval = setInterval(() => {
        const activeTab = document.querySelector('#debugTabs .tab-btn.active');
        if (activeTab?.dataset.tab === 'processes') {
            refreshDebugProcesses();
        }
    }, 15000);
};

window.cleanup_processes = function() {
    console.log('🧹 Debug processes tab cleaning up...');
    if (_processesInterval) {
        clearInterval(_processesInterval);
        _processesInterval = null;
    }
};

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
</script>

<style>
.form-input-sm {
    padding: 6px 12px;
    font-size: var(--fs-sm);
}
</style>
