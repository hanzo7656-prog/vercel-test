<!-- ============================================================
     debug_tabs/cache.html — تب کش (Redis)
     نسخه ۲.۰ — رفع خطاهای runtime + api.js هماهنگ
     ============================================================ -->

<div class="card">
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-database"></i>
            <span>مدیریت کش (Redis)</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-xs btn-outline" onclick="refreshDebugCache()">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="btn btn-xs btn-danger" onclick="purgeDebugCache()">
                <i class="fas fa-broom"></i>
                <span>پاکسازی کامل</span>
            </button>
        </div>
    </div>

    <!-- Stats -->
    <div class="cache-stats" id="cacheStats">
        <div class="cache-stat">
            <div class="cs-value cyan" id="cacheKeyCount">—</div>
            <div class="cs-label">🔑 کلیدها</div>
        </div>
        <div class="cache-stat">
            <div class="cs-value green" id="cacheMemory">—</div>
            <div class="cs-label">💾 حافظه</div>
        </div>
        <div class="cache-stat">
            <div class="cs-value" id="cacheStatus">—</div>
            <div class="cs-label">🔌 وضعیت</div>
        </div>
    </div>

    <!-- Search -->
    <div class="cache-toolbar">
        <input
            type="text"
            id="cacheSearchInput"
            class="form-input"
            placeholder="جستجو در کلیدها (مثال: session:*)..."
            onkeypress="if(event.key==='Enter') searchDebugCache()">
        <button class="btn btn-sm btn-outline" onclick="searchDebugCache()">
            <i class="fas fa-search"></i>
            <span>جستجو</span>
        </button>
        <button class="btn btn-sm btn-outline" onclick="refreshDebugCache()">
            <i class="fas fa-sync-alt"></i>
            <span>همه</span>
        </button>
    </div>

    <!-- Keys -->
    <div class="cache-keys" id="cacheKeys">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری کلیدها...</p>
        </div>
    </div>
</div>

<script>
// ============================================================
// DEBUG CACHE TAB
// ============================================================

let _cacheKeysData = [];
let _cacheInterval = null;

// ============================================================
// Load Cache Keys
// ============================================================

async function refreshDebugCache(pattern = '*') {
    const keysContainer = document.getElementById('cacheKeys');
    if (!keysContainer) return;

    keysContainer.innerHTML = `
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">در حال بارگذاری کلیدها...</p>
        </div>
    `;

    try {
        // ✅ FIX: به جای getDebugCache → getRedisKeys
        const data = await api.getRedisKeys({ pattern, limit: 200 });
        const statsData = await api.getRedisStats();

        if (!data?.success) {
            throw new Error(data?.error || 'خطا در دریافت کلیدها');
        }

        _cacheKeysData = data.data || [];

        // Stats
        const stats = statsData?.data || data.stats || {};
        const count = stats.total_keys || _cacheKeysData.length;
        const memory = stats.memory || stats.used_memory_human || '—';
        const connected = stats.connected !== false;

        setText('cacheKeyCount', count);
        setText('cacheMemory', memory);

        const statusEl = document.getElementById('cacheStatus');
        if (statusEl) {
            statusEl.textContent = connected ? '✅ متصل' : '❌ قطع';
            statusEl.className = 'cs-value ' + (connected ? 'green' : 'red');
        }

        // Render keys
        renderDebugCacheKeys(_cacheKeysData);

    } catch (err) {
        console.error('Cache error:', err);
        keysContainer.innerHTML = `
            <div class="empty-state error">
                <span class="empty-icon">❌</span>
                <div class="empty-title">خطا در دریافت کش</div>
                <div class="empty-message">${escapeHtml(err.message)}</div>
                <button class="empty-action" onclick="refreshDebugCache()">
                    <i class="fas fa-sync-alt"></i>
                    تلاش مجدد
                </button>
            </div>
        `;
    }
}

function renderDebugCacheKeys(keys) {
    const container = document.getElementById('cacheKeys');
    if (!container) return;

    if (!keys || keys.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <span class="empty-icon">🔑</span>
                <div class="empty-title">هیچ کلیدی یافت نشد</div>
                <div class="empty-message">Redis خالی است یا فیلتر نتیجه‌ای ندارد</div>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div class="cache-keys-grid">
            ${keys.map(k => `
                <div class="cache-key-item" title="${escapeAttr(k.key)}">
                    <span class="ck-key">${escapeHtml(k.key)}</span>
                    <button class="ck-delete" onclick="deleteDebugCacheKey('${escapeAttr(k.key)}')" title="حذف">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('')}
        </div>
    `;
}

// ============================================================
// Search
// ============================================================

async function searchDebugCache() {
    const pattern = document.getElementById('cacheSearchInput')?.value.trim() || '*';
    await refreshDebugCache(pattern);
}

// ============================================================
// Delete Key
// ============================================================

async function deleteDebugCacheKey(key) {
    if (!confirm(`⚠️ آیا از حذف کلید "${key}" اطمینان دارید؟`)) return;

    try {
        // ✅ FIX: به جای deleteCacheKey → deleteRedisKey
        const data = await api.deleteRedisKey(key);

        if (data?.success) {
            if (typeof showToast === 'function') {
                showToast('🗑️ کلید حذف شد', 'success');
            }
            refreshDebugCache();
        } else {
            if (typeof showToast === 'function') {
                showToast('❌ ' + (data?.error || 'خطا'), 'error');
            }
        }
    } catch (err) {
        if (typeof showToast === 'function') {
            showToast('❌ ' + err.message, 'error');
        }
    }
}

// ============================================================
// Purge All
// ============================================================

async function purgeDebugCache() {
    if (!confirm('⚠️ آیا از پاکسازی کامل کش اطمینان دارید؟ این عمل غیرقابل بازگشت است.')) return;

    try {
        // ✅ FIX: به جای purgeCache → clearRedis(true)
        const data = await api.clearRedis(true);

        if (data?.success) {
            if (typeof showToast === 'function') {
                showToast('🗑️ کش پاکسازی شد', 'success');
            }
            refreshDebugCache();
        } else {
            if (typeof showToast === 'function') {
                showToast('❌ ' + (data?.error || 'خطا'), 'error');
            }
        }
    } catch (err) {
        if (typeof showToast === 'function') {
            showToast('❌ ' + err.message, 'error');
        }
    }
}

// ============================================================
// Helpers
// ============================================================

function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value ?? '—';
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_cache = function() {
    console.log('💾 Debug cache tab initializing...');
    refreshDebugCache();

    if (_cacheInterval) clearInterval(_cacheInterval);
    _cacheInterval = setInterval(() => {
        const activeTab = document.querySelector('#debugTabs .tab-btn.active');
        if (activeTab?.dataset.tab === 'cache') {
            refreshDebugCache();
        }
    }, 30000);
};

window.cleanup_cache = function() {
    console.log('🧹 Debug cache tab cleaning up...');
    if (_cacheInterval) {
        clearInterval(_cacheInterval);
        _cacheInterval = null;
    }
};
</script>

<style>
