<div class="card">
    <div class="card-title">
        <i class="fas fa-database"></i> مدیریت کش (Redis)
        <div style="display:flex;gap:6px;margin-right:auto;">
            <button class="btn btn-xs btn-outline" onclick="refreshCache()"><i class="fas fa-sync-alt"></i></button>
            <button class="btn btn-xs btn-danger" onclick="purgeCache()"><i class="fas fa-broom"></i> پاکسازی کامل</button>
        </div>
    </div>
    
    <!-- ===== STATS ===== -->
    <div id="cacheStats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;">
        <div style="background:var(--bg-input);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-color);text-align:center;">
            <div style="font-size:1.2rem;font-weight:700;color:var(--accent-cyan);" id="cacheKeyCount">—</div>
            <div style="font-size:0.55rem;color:var(--text-muted);text-transform:uppercase;">🔑 کلیدها</div>
        </div>
        <div style="background:var(--bg-input);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-color);text-align:center;">
            <div style="font-size:1.2rem;font-weight:700;color:var(--accent-green);" id="cacheMemory">—</div>
            <div style="font-size:0.55rem;color:var(--text-muted);text-transform:uppercase;">💾 حافظه</div>
        </div>
        <div style="background:var(--bg-input);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-color);text-align:center;">
            <div style="font-size:1.2rem;font-weight:700;color:${connected ? 'var(--accent-green)' : 'var(--accent-red)'};" id="cacheStatus">—</div>
            <div style="font-size:0.55rem;color:var(--text-muted);text-transform:uppercase;">🔌 وضعیت</div>
        </div>
    </div>
    
    <!-- ===== SEARCH ===== -->
    <div class="cache-search" style="display:flex;gap:8px;margin-bottom:12px;">
        <input id="cacheSearchInput" placeholder="جستجو در کلیدها (مثل: session:*)" onkeypress="if(event.key==='Enter') searchCache()" style="flex:1;padding:6px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.75rem;">
        <button class="btn btn-xs btn-outline" onclick="searchCache()"><i class="fas fa-search"></i> جستجو</button>
        <button class="btn btn-xs btn-outline" onclick="refreshCache()"><i class="fas fa-sync-alt"></i> همه</button>
    </div>
    
    <!-- ===== KEYS ===== -->
    <div id="cacheKeys" style="display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border-color);min-height:60px;max-height:300px;overflow-y:auto;">
        <div class="loading-container" style="padding:20px;">
            <div class="loading-spinner" style="width:24px;height:24px;"></div>
            <p class="loading-text" style="font-size:0.7rem;">در حال بارگذاری کلیدها...</p>
        </div>
    </div>
</div>

<script>
// ============================================================
// CACHE TAB - کامل و پیشرفته
// ============================================================

let cacheKeysData = [];

async function refreshCache() {
    const keysContainer = document.getElementById('cacheKeys');
    keysContainer.innerHTML = `
        <div class="loading-container" style="padding:20px;">
            <div class="loading-spinner" style="width:24px;height:24px;"></div>
            <p class="loading-text" style="font-size:0.7rem;">در حال بارگذاری کلیدها...</p>
        </div>
    `;
    
    try {
        const data = await api.getDebugCache();
        if (data.success && data.data) {
            cacheKeysData = data.data.keys || [];
            const count = data.data.total_keys || 0;
            const connected = data.data.connected || false;
            const memory = data.data.memory || '—';
            
            document.getElementById('cacheKeyCount').textContent = count;
            document.getElementById('cacheMemory').textContent = memory;
            document.getElementById('cacheStatus').textContent = connected ? '✅ متصل' : '❌ قطع';
            document.getElementById('cacheStatus').style.color = connected ? 'var(--accent-green)' : 'var(--accent-red)';
            
            renderCacheKeys(cacheKeysData);
        } else {
            keysContainer.innerHTML = `
                <div style="text-align:center;padding:20px;color:var(--text-muted);width:100%;">
                    🔑 هیچ کلیدی یافت نشد
                </div>
            `;
        }
    } catch (err) {
        console.error('Cache error:', err);
        keysContainer.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--accent-red);width:100%;">
                ❌ خطا در دریافت کش
            </div>
        `;
    }
}

function renderCacheKeys(keys) {
    const container = document.getElementById('cacheKeys');
    if (!keys || keys.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--text-muted);width:100%;">
                🔑 هیچ کلیدی یافت نشد
            </div>
        `;
        return;
    }
    
    container.innerHTML = keys.map(k => `
        <span class="key-tag" data-key="${k.key}" style="background:rgba(0,0,0,0.3);padding:2px 10px;border-radius:4px;font-size:0.6rem;font-family:var(--font-mono);color:var(--accent-cyan);border:1px solid rgba(0,212,255,0.06);display:inline-flex;align-items:center;gap:6px;">
            ${k.key}
            <span onclick="deleteCacheKey('${k.key}')" style="cursor:pointer;color:var(--text-muted);font-size:0.5rem;transition:var(--transition);" 
                  onmouseover="this.style.color='var(--accent-red)'" 
                  onmouseout="this.style.color='var(--text-muted)'">✕</span>
        </span>
    `).join('');
}

async function searchCache() {
    const pattern = document.getElementById('cacheSearchInput').value.trim() || '*';
    const keysContainer = document.getElementById('cacheKeys');
    keysContainer.innerHTML = `
        <div class="loading-container" style="padding:20px;">
            <div class="loading-spinner" style="width:24px;height:24px;"></div>
            <p class="loading-text" style="font-size:0.7rem;">در حال جستجو...</p>
        </div>
    `;
    
    try {
        const data = await api.searchCache(pattern);
        if (data.success && data.data) {
            const keys = data.data;
            if (keys.length === 0) {
                keysContainer.innerHTML = `
                    <div style="text-align:center;padding:20px;color:var(--text-muted);width:100%;">
                        🔑 کلیدی با الگوی "${pattern}" یافت نشد
                    </div>
                `;
                return;
            }
            renderCacheKeys(keys);
        }
    } catch (err) {
        keysContainer.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--accent-red);width:100%;">
                ❌ خطا در جستجو
            </div>
        `;
    }
}

async function deleteCacheKey(key) {
    if (!confirm(`⚠️ آیا از حذف کلید "${key}" اطمینان دارید؟`)) return;
    try {
        const data = await api.deleteCacheKey(key);
        if (data.success) {
            showToast('🗑️ کلید "' + key + '" حذف شد', 'success');
            refreshCache();
        } else {
            showToast('❌ ' + data.error, 'error');
        }
    } catch (err) {
        showToast('❌ خطا', 'error');
    }
}

async function purgeCache() {
    if (!confirm('⚠️ آیا از پاکسازی کامل کش و آزادسازی حافظه اطمینان دارید؟')) return;
    try {
        const data = await api.purgeCache();
        if (data.success) {
            showToast('🗑️ کش پاکسازی و حافظه آزاد شد', 'success');
            refreshCache();
        } else {
            showToast('❌ ' + data.error, 'error');
        }
    } catch (err) {
        showToast('❌ خطا', 'error');
    }
}

window.init_cache = function() {
    refreshCache();
    setInterval(refreshCache, 30000);
};
</script>
