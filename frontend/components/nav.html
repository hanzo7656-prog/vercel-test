/* ============================================================
   FONTS
   ============================================================ */

/* ============================================================
   BASE VARIABLES
   ============================================================ */
:root {
    --sidebar-width: 280px;
    --sidebar-collapsed: 76px;
    --content-font-size: 16px;
    --content-line-height: 1.9;
    --content-font-family: 'Vazirmatn';

/* ============================================================
   RESET & BASE
   ============================================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    overflow-x: hidden;
}

body {
    font-family: var(--ui-font);
    background: var(--bg-page);
    min-height: 100vh;
    color: var(--text-light);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 0.5s ease, color 0.3s ease;
}

::selection {
    background: var(--primary);
    color: white;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--primary-light);
}

/* Smooth transitions on theme-driven elements */
.sidebar, .content-card, .card, .stat-card, .modal {
    transition:
        background 0.5s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}

/* ============================================================
   ANIMATIONS — Global Keyframes
   ============================================================ */

@keyframes borderGlow {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
}

@keyframes logoPulse {
    0%, 100% { box-shadow: 0 4px 12px var(--primary); }
    50% { box-shadow: 0 4px 24px var(--primary); }
}

@keyframes activeBar {
    0%, 100% { box-shadow: 0 0 8px var(--primary); }
    50% { box-shadow: 0 0 16px var(--primary); }
}

@keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
}

@keyframes fadeInTooltip {
    from { opacity: 0; transform: translateY(-50%) translateX(5px); }
    to { opacity: 1; transform: translateY(-50%) translateX(0); }
}

@keyframes statusPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

@keyframes toastIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes toastOut {
    to { opacity: 0; transform: translateY(20px); }
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(16px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

/* ============================================================
   NEON PROGRESS BAR — Top Loading Indicator
   ============================================================ */
.progress-bar {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    height: 3px;
    background: transparent;
    z-index: 999999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
}

.progress-bar.active {
    opacity: 1;
}

.progress-bar::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(
        90deg,
        var(--success) 0%,
        var(--info, #06b6d4) 33%,
        var(--primary) 66%,
        var(--primary-light) 100%
    );
    background-size: 300% 100%;
    animation: progressBarFlow 1.6s linear infinite;
    box-shadow:
        0 0 10px var(--primary),
        0 0 20px var(--primary),
        0 0 30px rgba(var(--primary-rgb), 0.6);
    border-radius: 0 0 4px 4px;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-bar::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 100%
    );
    background-size: 200% 100%;
    animation: progressBarShimmer 1.2s linear infinite;
    border-radius: 0 0 4px 4px;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    mix-blend-mode: overlay;
}

.progress-bar.set-width::before,
.progress-bar.set-width::after {
    width: var(--progress-width, 0%);
}

@keyframes progressBarFlow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

@keyframes progressBarShimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* Progress State — Glow Effect */
.progress-bar.glow::before {
    box-shadow:
        0 0 14px var(--primary),
        0 0 28px var(--primary),
        0 0 42px rgba(var(--primary-rgb), 0.8);
}

/* Success State */
.progress-bar.success::before {
    background: linear-gradient(90deg, var(--success), var(--success-dark));
    animation: none;
    box-shadow: 0 0 12px var(--success), 0 0 24px rgba(34, 197, 94, 0.5);
}

/* ============================================================
   READING MODE
   ============================================================ */
body.reading-mode .sidebar {
    transform: translateX(100%);
    width: 0;
    opacity: 0;
    pointer-events: none;
}

body.reading-mode .main-content {
    margin-right: 0 !important;
    margin-left: 0 !important;
    max-width: none !important;
    padding: 40px;
}

body.reading-mode .mobile-toggle { opacity: 0; pointer-events: none; }

/* Reading toggle button */
.reading-toggle {
    position: fixed;
    bottom: 30px;
    left: 30px;
    width: 56px;
    height: 56px;
    background: var(--primary);
    border: none;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 24px var(--primary);
    z-index: 998;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

.reading-toggle:hover {
    background: var(--primary-dark);
    transform: scale(1.1) rotate(-10deg);
}

.reading-toggle.active {
    background: #22c55e;
    transform: rotate(360deg);
}

body.reading-mode .reading-toggle {
    left: 50%;
    transform: translateX(-50%);
}

body.reading-mode .reading-toggle:hover {
    transform: translateX(-50%) scale(1.1);
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: var(--sidebar-width);
    background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 1000;
    overflow: visible;
    transition: width var(--transition), transform 0.4s ease, opacity 0.3s ease, background 0.5s ease;
}

.sidebar::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 2px;
    height: 100%;
    background: linear-gradient(180deg, transparent, var(--primary), transparent);
    opacity: 0.5;
    animation: borderGlow 3s ease-in-out infinite;
    pointer-events: none;
}

@media (min-width: 769px) {
    .sidebar.collapsed { width: var(--sidebar-collapsed); }
}

/* ---------- HEADER ---------- */
.sidebar-header {
    padding: 0 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    height: 72px;
    min-height: 72px;
    flex-shrink: 0;
    position: relative;
    gap: 8px;
}

.logo {
    width: 44px;
    height: 44px;
    min-width: 44px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
    position: relative;
    animation: logoPulse 4s ease-in-out infinite;
    cursor: pointer;
    text-decoration: none;
}

.logo svg { width: 22px; height: 22px; }

.logo-text {
    font-size: 17px;
    font-weight: 700;
    white-space: nowrap;
    color: var(--text-light);
    flex-shrink: 0;
    flex: 1;
    transition: color 0.3s ease;
}

/* Header quick actions */
.header-actions {
    display: flex;
    gap: 5px;
    margin-right: auto;
}

.icon-btn {
    width: 32px;
    height: 32px;
    min-width: 32px;
    background: var(--hover-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
    position: relative;
    text-decoration: none;
    padding: 0;
}

.icon-btn svg { width: 15px; height: 15px; }

.icon-btn:hover {
    background: var(--primary);
    color: white;
    transform: scale(1.08);
}

.icon-btn.active {
    background: var(--primary);
    color: white;
}

.icon-btn .lang-code {
    font-family: var(--mono-font);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

.icon-btn .badge-dot {
    position: absolute;
    top: -3px;
    left: -3px;
    width: 16px;
    height: 16px;
    background: #ef4444;
    color: white;
    font-size: 9px;
    font-weight: 700;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg-dark);
    font-family: var(--mono-font);
    animation: statusPulse 2s ease-in-out infinite;
}

.toggle-btn svg { transition: transform 0.3s ease; }
.sidebar.collapsed .toggle-btn svg { transform: rotate(180deg); }

/* ============================================================
   SEARCH
   ============================================================ */
.sidebar-search {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
}

.search-box {
    position: relative;
    display: flex;
    align-items: center;
    height: 44px;
}

.search-box > svg.search-icon {
    position: absolute;
    right: 12px;
    color: var(--text-muted);
    pointer-events: none;
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    transition: color 0.2s ease;
}

.search-box input {
    width: 100%;
    height: 44px;
    padding: 10px 40px 10px 12px;
    background: var(--hover-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-light);
    font-size: 14px;
    font-family: var(--ui-font);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(var(--primary-rgb, 99, 102, 241), 0.15);
    background: var(--bg-dark);
}

.search-box input:focus ~ svg.search-icon { color: var(--primary); }

.search-box input::placeholder { color: var(--text-muted); }

.search-shortcut {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-darker);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
    transition: opacity 0.2s ease;
    font-family: var(--mono-font);
}

.search-box input:focus ~ .search-shortcut,
.search-box input:not(:placeholder-shown) ~ .search-shortcut { opacity: 0; }

.search-count {
    position: absolute;
    bottom: -20px;
    right: 16px;
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity 0.2s ease;
    font-family: var(--mono-font);
}

.search-count.visible { opacity: 1; }

/* ============================================================
   MENU
   ============================================================ */
.sidebar-menu {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 10px;
    list-style: none;
}

.sidebar-menu::-webkit-scrollbar { width: 4px; }
.sidebar-menu::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 2px;
}
.sidebar-menu::-webkit-scrollbar-track { background: transparent; }

.menu-section {
    padding: 12px 12px 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    white-space: nowrap;
    font-family: var(--mono-font);
}

.menu-item {
    margin-bottom: 4px;
    position: relative;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.menu-item.dragging {
    opacity: 0.4;
    transform: scale(0.95);
}

.menu-item.drag-over {
    transform: scale(1.02);
}

.menu-item.drag-over::after {
    content: '';
    position: absolute;
    top: -2px;
    right: 8px;
    left: 8px;
    height: 3px;
    background: var(--primary);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--primary);
}

.drag-handle {
    width: 16px;
    height: 16px;
    min-width: 16px;
    opacity: 0;
    cursor: grab;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
    flex-shrink: 0;
    margin-right: -6px;
}

.menu-link:hover .drag-handle { opacity: 0.6; }
.drag-handle:active { cursor: grabbing; }

.menu-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 12px;
    color: var(--text-muted);
    text-decoration: none;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 500;
    position: relative;
    transition: background 0.2s ease, color 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    min-height: 44px;
    cursor: pointer;
    font-family: var(--ui-font);
}

.menu-link::before {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: linear-gradient(180deg, var(--primary), var(--primary-light));
    border-radius: 3px;
    transition: height 0.3s ease;
    box-shadow: 0 0 8px var(--primary);
}

.menu-link:hover { background: var(--hover-bg); color: var(--text-light); }
.menu-link:hover::before { height: 60%; }

.menu-link.active {
    background: linear-gradient(90deg, transparent, var(--hover-bg));
    color: var(--primary-light);
}

.menu-link.active::before {
    height: 60%;
    animation: activeBar 2s ease-in-out infinite;
}

.menu-link.keyboard-focus {
    background: var(--hover-bg);
    outline: 2px solid var(--primary);
    outline-offset: -2px;
}

.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
}

html[data-theme="light"] .ripple { background: rgba(0, 0, 0, 0.1); }

.menu-icon {
    width: 22px;
    height: 22px;
    min-width: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s ease;
}

.menu-icon svg { width: 20px; height: 20px; }

.menu-link:hover .menu-icon { transform: scale(1.15); }

.menu-label {
    white-space: nowrap;
    flex-shrink: 0;
    flex: 1;
    position: relative;
}

.menu-label mark {
    background: var(--highlight-bg);
    color: var(--highlight-text);
    padding: 0 2px;
    border-radius: 3px;
    font-weight: 700;
}

.badge {
    background: linear-gradient(135deg, #ef4444, #f97316);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: var(--mono-font);
    min-width: 20px;
    text-align: center;
}

.badge.success {
    background: linear-gradient(135deg, #22c55e, #16a34a);
}

.badge.info {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
}

.pin-btn {
    width: 22px;
    height: 22px;
    min-width: 22px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
    padding: 0;
}

.pin-btn svg { width: 14px; height: 14px; }

.menu-link:hover .pin-btn { opacity: 1; }
.pin-btn:hover { background: var(--hover-bg); color: var(--primary-light); }
.pin-btn.pinned { opacity: 1; color: var(--primary); }

/* ============================================================
   FLYOUT
   ============================================================ */
.flyout {
    position: fixed;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 8px;
    min-width: 200px;
    z-index: 1500;
    opacity: 0;
    visibility: hidden;
    transform: translateX(8px);
    transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease, background 0.3s ease;
    pointer-events: none;
}

.flyout.open {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
    pointer-events: auto;
}

.flyout-title {
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
}

.flyout-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13.5px;
    transition: all 0.2s ease;
    cursor: pointer;
    white-space: nowrap;
}

.flyout-item:hover { background: var(--hover-bg); color: var(--text-light); }
.flyout-item.active { background: var(--hover-bg); color: var(--primary-light); }

.flyout-item .flyout-icon {
    width: 16px;
    height: 16px;
    min-width: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.flyout-item .flyout-icon svg { width: 14px; height: 14px; }

/* ============================================================
   RECENT
   ============================================================ */
.menu-recent {
    padding: 6px 12px 12px;
    display: none;
}

.menu-recent.visible { display: block; }

.recent-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}

.recent-chip {
    background: var(--hover-bg);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--ui-font);
}

.recent-chip:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

/* ============================================================
   COLLAPSED STATE
   ============================================================ */
@media (min-width: 769px) {
    .sidebar.collapsed .logo-text,
    .sidebar.collapsed .menu-label,
    .sidebar.collapsed .badge,
    .sidebar.collapsed .menu-section,
    .sidebar.collapsed .user-info,
    .sidebar.collapsed .submenu,
    .sidebar.collapsed .pin-btn,
    .sidebar.collapsed .search-shortcut,
    .sidebar.collapsed .menu-recent,
    .sidebar.collapsed .search-count,
    .sidebar.collapsed .drag-handle,
    .sidebar.collapsed .header-actions .icon-btn[data-hide-collapsed] {
        display: none !important;
    }

    .sidebar.collapsed .sidebar-header {
        padding: 0;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        height: auto;
        min-height: 168px;
        padding: 14px 0;
    }

    .sidebar.collapsed .header-actions {
        order: 0;
        margin-right: 0;
        flex-direction: column;
        gap: 6px;
    }

    .sidebar.collapsed .sidebar-search { padding: 14px; }
    .sidebar.collapsed .search-box { justify-content: center; }

    .sidebar.collapsed .search-box input {
        width: 44px;
        padding: 0;
        color: transparent;
        cursor: pointer;
        text-align: center;
    }

    .sidebar.collapsed .search-box input::placeholder { color: transparent; }

    .sidebar.collapsed .search-box > svg.search-icon {
        right: 50%;
        transform: translateX(50%);
        color: var(--text-light);
    }

    .sidebar.collapsed .sidebar-menu { padding: 12px 8px; }

    .sidebar.collapsed .menu-link {
        justify-content: center;
        padding: 11px;
        gap: 0;
        overflow: visible;
    }

    .sidebar.collapsed .user-card {
        justify-content: center;
        padding: 10px 8px;
        gap: 0;
    }

    .sidebar.collapsed .menu-link[data-tooltip]:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        right: calc(100% + 14px);
        top: 50%;
        transform: translateY(-50%);
        background: var(--bg-dark);
        color: var(--text-light);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        white-space: nowrap;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        z-index: 1600;
        animation: fadeInTooltip 0.2s ease;
        pointer-events: none;
        display: block;
    }

    .sidebar.collapsed .menu-item.flyout-open > .menu-link[data-tooltip]::after {
        display: none;
    }
}

/* ============================================================
   FOOTER (USER CARD)
   ============================================================ */
.sidebar-footer {
    padding: 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
}

.user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: var(--hover-bg);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
}

.user-card:hover {
    background: var(--hover-bg);
    transform: translateX(-2px);
}

.avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: white;
    position: relative;
    flex-shrink: 0;
    font-size: 15px;
}

.avatar::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: -2px;
    width: 12px;
    height: 12px;
    background: #22c55e;
    border: 2px solid var(--bg-dark);
    border-radius: 50%;
    animation: statusPulse 2s ease-in-out infinite;
}

.user-info {
    white-space: nowrap;
    flex-shrink: 0;
    flex: 1;
    overflow: hidden;
}

.user-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-light);
    overflow: hidden;
    text-overflow: ellipsis;
}

.user-role {
    font-size: 12px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ============================================================
   OVERLAY
   ============================================================ */
.overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay-bg);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.overlay.active { opacity: 1; visibility: visible; }

/* ============================================================
   MOBILE TOGGLE
   ============================================================ */
.mobile-toggle {
    display: none;
    position: fixed;
    top: 20px;
    right: 20px;
    width: 48px;
    height: 48px;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    z-index: 1001;
    box-shadow: var(--shadow);
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
    padding: 0;
}

.mobile-toggle:hover {
    background: var(--primary-dark);
    transform: scale(1.05);
}

body.sidebar-open .mobile-toggle {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
}

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main-content {
    padding: 40px;
    min-height: 100vh;
    margin-right: var(--sidebar-width);
}

@media (min-width: 769px) {
    .main-content.expanded { margin-right: var(--sidebar-collapsed); }
}

@media (max-width: 768px) {
    .main-content {
        margin-right: 0;
        padding: 80px 16px 40px;
    }
}

/* ============================================================
   CONTENT CARD
   ============================================================ */
.content-card {
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    max-width: 900px;
    margin: 0 auto;
    animation: cardIn 0.5s ease backwards;
}

.content-card h1 {
    font-family: var(--content-font-family);
    font-size: 32px;
    margin-bottom: 16px;
    color: var(--text-light);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.3;
    transition: font-size 0.2s cubic-bezier(0.4, 0, 0.2, 1), font-family 0.4s ease;
}

.content-card h2 {
    font-family: var(--content-font-family);
    font-size: 24px;
    margin: 24px 0 12px;
    color: var(--text-light);
    font-weight: 700;
}

.content-card h3 {
    font-family: var(--content-font-family);
    font-size: 18px;
    margin: 20px 0 10px;
    color: var(--text-light);
    font-weight: 600;
}

.content-card p,
.content-card li {
    font-family: var(--content-font-family);
    color: var(--text-muted);
    font-size: var(--content-font-size);
    line-height: var(--content-line-height);
    margin-bottom: 12px;
    transition: font-size 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                line-height 0.2s ease,
                font-family 0.4s ease;
}

.content-card ul,
.content-card ol {
    margin-bottom: 12px;
    padding-inline-start: 24px;
}

.content-card code {
    background: var(--hover-bg);
    color: var(--primary-light);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: var(--mono-font);
}

.content-card strong {
    color: var(--text-light);
    font-weight: 700;
}

.content-card a {
    color: var(--primary-light);
    text-decoration: none;
    transition: color 0.2s ease;
}

.content-card a:hover {
    color: var(--primary);
    text-decoration: underline;
}

/* ============================================================
   FEATURE GRID (for dashboard demo)
   ============================================================ */
.feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 24px;
}

.feature-card {
    background: var(--hover-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    animation: fadeInUp 0.5s ease backwards;
}

.feature-card:nth-child(1) { animation-delay: 0.05s; }
.feature-card:nth-child(2) { animation-delay: 0.1s; }
.feature-card:nth-child(3) { animation-delay: 0.15s; }
.feature-card:nth-child(4) { animation-delay: 0.2s; }
.feature-card:nth-child(5) { animation-delay: 0.25s; }
.feature-card:nth-child(6) { animation-delay: 0.3s; }
.feature-card:nth-child(7) { animation-delay: 0.35s; }
.feature-card:nth-child(8) { animation-delay: 0.4s; }

.feature-card:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    box-shadow: 0 8px 24px rgba(var(--primary-rgb, 99, 102, 241), 0.15);
}

.feature-card h4 {
    color: var(--primary-light);
    font-size: 14px;
    margin-bottom: 6px;
    font-family: var(--content-font-family);
    font-weight: 700;
}

.feature-card p {
    font-size: 12px;
    line-height: 1.6;
    margin: 0;
    font-family: var(--content-font-family);
    color: var(--text-muted);
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
.command-palette-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 2000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 15vh;
}

.command-palette-overlay.open {
    opacity: 1;
    visibility: visible;
}

.command-palette {
    width: 90%;
    max-width: 600px;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    transform: translateY(-20px) scale(0.95);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
    font-family: var(--ui-font);
}

.command-palette-overlay.open .command-palette {
    transform: translateY(0) scale(1);
}

.command-search {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.command-search svg {
    color: var(--text-muted);
    flex-shrink: 0;
    width: 20px;
    height: 20px;
}

.command-search input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-light);
    font-size: 16px;
    font-family: inherit;
    outline: none;
}

.command-search input::placeholder { color: var(--text-muted); }

.command-search kbd {
    background: var(--hover-bg);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono-font);
}

.command-list {
    max-height: 400px;
    overflow-y: auto;
    padding: 8px;
}

.command-list::-webkit-scrollbar { width: 4px; }
.command-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

.command-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
    color: var(--text-light);
    font-size: 14px;
}

.command-item:hover,
.command-item.selected {
    background: var(--hover-bg);
}

.command-item.selected {
    background: linear-gradient(90deg, transparent, var(--hover-bg));
    box-shadow: inset 2px 0 0 var(--primary);
}

.command-item .cmd-icon {
    width: 20px;
    height: 20px;
    min-width: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-light);
}

.command-item .cmd-icon svg { width: 16px; height: 16px; }
.command-item .cmd-label { flex: 1; }

.command-item .cmd-shortcut {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--hover-bg);
    padding: 2px 8px;
    border-radius: 6px;
    font-family: var(--mono-font);
}

.command-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-container {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 1300;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    max-width: calc(100vw - 48px);
}

.toast {
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text-light);
    font-size: 13px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 240px;
    max-width: 400px;
    animation: toastIn 0.3s ease;
    pointer-events: auto;
    border-right: 3px solid var(--primary);
    font-family: var(--ui-font);
}

.toast.success { border-right-color: #22c55e; }
.toast.error { border-right-color: #ef4444; }
.toast.info { border-right-color: var(--primary); }
.toast.warning { border-right-color: #f59e0b; }

.toast > span:first-child {
    width: 20px;
    height: 20px;
    min-width: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.toast.success > span:first-child { color: #22c55e; }
.toast.error > span:first-child { color: #ef4444; }
.toast.warning > span:first-child { color: #f59e0b; }
.toast.info > span:first-child { color: var(--primary); }

.toast.removing { animation: toastOut 0.3s ease forwards; }

/* ============================================================
   TOUR OVERLAY (Placeholder — empty for now)
   ============================================================ */
.tour-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: var(--ui-font);
}

.tour-overlay.active {
    display: flex;
    animation: modalIn 0.3s ease;
}

.tour-tooltip {
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 420px;
    box-shadow: var(--shadow);
    color: var(--text-light);
}

.tour-tooltip h3 {
    font-size: 16px;
    margin-bottom: 10px;
    color: var(--primary-light);
}

.tour-tooltip p {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text-muted);
    margin-bottom: 18px;
}

.tour-tooltip .tour-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

.tour-tooltip button {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--hover-bg);
    color: var(--text-light);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.tour-tooltip button:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 768px) {
    .sidebar {
        transform: translateX(100%);
        width: var(--sidebar-width);
        transition: transform var(--transition);
    }
    .sidebar.mobile-open { transform: translateX(0); }
    .toggle-btn { display: none; }
    .mobile-toggle { display: flex; }
    .main-content { padding: 80px 16px 40px; margin-right: 0; }
    .content-card { padding: 24px 20px; }
    .content-card h1 { font-size: 22px; }
    .toast-container { left: 12px; right: 12px; bottom: 12px; }
    .toast { min-width: 0; max-width: none; }
    .reading-toggle { bottom: 20px; left: 20px; width: 48px; height: 48px; }
    .command-palette { max-width: calc(100vw - 20px); }
    .command-palette-overlay { padding-top: 10vh; }
    .feature-grid { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
    .content-card { padding: 20px 16px; }
    .content-card h1 { font-size: 20px; }
    .content-card h2 { font-size: 18px; }
}

/* ============================================================

   ============================================================ */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {

}

// ============================================================
// PROGRESS BAR
// ============================================================
// ============================================================
// PROGRESS BAR — Neon Top Bar
// ============================================================
const ProgressBar = {
    el: null,
    _timer: null,
    _finishTimer: null,
    _activeCount: 0,   // شمارنده برای عملیات همزمان

    init() {
        this.el = document.getElementById('progressBar');
    },

    /**
     * شروع progress
     * @param {Object} [opts]
     * @param {number} [opts.duration] — مدت تخمینی (اگه null باشه، نامعین)
     */
    start(opts = {}) {
        if (!this.el) return;
        this._activeCount++;

        // اگه اولین بار فعال می‌شه
        if (this._activeCount === 1) {
            this.el.classList.add('active', 'glow');
            this.el.classList.remove('success');
            this._setWidth(10);

            // اگه duration داری، به صورت خودکار پیش برو
            if (opts.duration) {
                this._animateTo(opts.duration);
            } else {
                // نامعین — تا 85% برو و بمون
                this._indeterminate();
            }
        }
    },

    /**
     * اتمام progress
     * @param {boolean} [success=true]
     */
    done(success = true) {
        if (!this.el) return;
        this._activeCount = Math.max(0, this._activeCount - 1);

        if (this._activeCount === 0) {
            this._clearTimers();

            if (success) {
                this.el.classList.add('success');
                this._setWidth(100);
            } else {
                this._setWidth(100);
            }

            this._finishTimer = setTimeout(() => {
                this.el.classList.remove('active', 'glow', 'success');
                // reset width بعد از fade out
                setTimeout(() => this._setWidth(0), 300);
            }, 350);
        }
    },

    /**
     * ست کردن درصد
     */
    set(percent) {
        if (!this.el) return;
        this._setWidth(Math.max(0, Math.min(100, percent)));
    },

    _setWidth(pct) {
        if (!this.el) return;
        this.el.style.setProperty('--progress-width', pct + '%');
        // trigger reflow
        this.el.classList.add('set-width');
    },

    _animateTo(duration) {
        const start = Date.now();
        const tick = () => {
            const elapsed = Date.now() - start;
            const pct = Math.min((elapsed / duration) * 90, 90); // فقط تا 90%
            this._setWidth(pct);
            if (pct < 90 && this._activeCount > 0) {
                this._timer = setTimeout(tick, 60);
            }
        };
        tick();
    },

    _indeterminate() {
        // برو تا 30%، بعد 60%، بعد 85% و بمون
        this._setWidth(25);
        setTimeout(() => { if (this._activeCount > 0) this._setWidth(55); }, 250);
        setTimeout(() => { if (this._activeCount > 0) this._setWidth(80); }, 700);
        setTimeout(() => { if (this._activeCount > 0) this._setWidth(88); }, 1400);
    },

    _clearTimers() {
        if (this._timer) { clearTimeout(this._timer); this._timer = null; }
        if (this._finishTimer) { clearTimeout(this._finishTimer); this._finishTimer = null; }
    },
};

// سازگاری با کد قدیمی
function showProgress(duration) {
    ProgressBar.start({ duration });
}

// expose
window.progressBar = ProgressBar;

/**
 * helper: wrap async function با progress
 */
window.withProgress = async function(promiseFn, opts = {}) {
    ProgressBar.start(opts);
    try {
        const result = await (typeof promiseFn === 'function' ? promiseFn() : promiseFn);
        ProgressBar.done(true);
        return result;
    } catch (err) {
        ProgressBar.done(false);
        throw err;
    }
};

// ============================================================
// DRAG & DROP
// ============================================================
let draggedItem = null;

function initDragDrop() {
    $$('.menu-item[draggable="true"]').forEach(item => {
        item.addEventListener('dragstart', function(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
        });

        item.addEventListener('dragend', function() {
            this.classList.remove('dragging');
            $$('.menu-item').forEach(i => i.classList.remove('drag-over'));
            draggedItem = null;
            saveMenuOrder();
        });

        item.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (this === draggedItem) return;
            this.classList.add('drag-over');
        });

        item.addEventListener('dragleave', function() {
            this.classList.remove('drag-over');
        });

        item.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            if (!draggedItem || this === draggedItem) return;

            const draggedSection = getItemSection(draggedItem);
            const targetSection = getItemSection(this);
            if (draggedSection !== targetSection) return;

            const rect = this.getBoundingClientRect();
            const midpoint = rect.top + rect.height / 2;

            if (e.clientY < midpoint) {
                this.parentNode.insertBefore(draggedItem, this);
            } else {
                this.parentNode.insertBefore(draggedItem, this.nextSibling);
            }

            showToast(t('tOrderSaved'), 'success', 1500);
        });
    });
}

function getItemSection(item) {
    let prev = item.previousElementSibling;
    while (prev) {
        if (prev.classList.contains('menu-section')) return prev.textContent.trim();
        prev = prev.previousElementSibling;
    }
    return '';
}

function saveMenuOrder() {
    const order = [];
    $$('.sidebar-menu .menu-item[draggable="true"]').forEach(item => {
        if (item.dataset.id) order.push(item.dataset.id);
    });
    Storage.setJSON('menuOrder', order);
}

function restoreMenuOrder() {
    const order = Storage.getJSON('menuOrder', []);
    if (order.length === 0) return;

    const menu = $('#sidebarMenu');
    if (!menu) return;

    order.forEach(id => {
        const item = menu.querySelector(`.menu-item[data-id="${id}"]`);
        if (item) menu.appendChild(item);
    });
}

function initPins() {
    $$('.pin-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const id = btn.dataset.pin;
            let pins = Storage.getJSON('pins', []);
            if (pins.includes(id)) {
                pins = pins.filter(p => p !== id);
                btn.classList.remove('pinned');
                showToast(t('tUnpinned'), 'info', 1200);
            } else {
                pins.push(id);
                btn.classList.add('pinned');
                showToast(t('tPinned'), 'success', 1200);
            }
            Storage.setJSON('pins', pins);
        });
    });
}

    recentChips.innerHTML = recent.map(r =>

    recentChips.querySelectorAll('.recent-chip').forEach(chip => {
        chip.addEventListener('click', () => {

            if (link) link.click();

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[s]);
}

function highlightText(text, query) {
    if (!query) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return escaped.replace(regex, '<mark>$1</mark>');
}

function initSearch() {
    if (!searchInput) return;

    searchInput.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
        let visibleCount = 0;

        $$('.menu-item').forEach(item => {
            const label = item.querySelector('.menu-label');
            if (!label) return;

            if (!label.dataset.originalText) {
                label.dataset.originalText = label.textContent;
            }

            const text = label.dataset.originalText;
            const matches = text.toLowerCase().includes(query);

            if (query) {
                if (matches) {
                    label.innerHTML = highlightText(text, query);
                    visibleCount++;
                } else {
                    label.innerHTML = escapeHtml(text);
                }
            } else {
                label.innerHTML = escapeHtml(text);
            }

            item.style.display = (matches || query === '') ? '' : 'none';
        });

        $$('.menu-section').forEach(section => {
            section.style.display = query === '' ? '' : 'none';
        });

        if (query) {
            searchCount.textContent = `${visibleCount} ${t('tResults')}`;
            searchCount.classList.add('visible');
        } else {
            searchCount.classList.remove('visible');
        }
    });

    searchInput.addEventListener('click', function() {
        if (!isMobile() && sidebar.classList.contains('collapsed')) {
            sidebar.classList.remove('collapsed');
            document.querySelector('.main-content')?.classList.remove('expanded');
            Storage.set('sidebarCollapsed', 'false');
            setTimeout(() => searchInput.focus(), 320);
        }
    });
}

// ============================================================
function initRipple() {
    document.addEventListener('click', (e) => {
        const link = e.target.closest('.menu-link');
        if (!link) return;

        const rect = link.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;

        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';

        link.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    });
}

function initActiveLinks() {
    // Set active based on current URL
    const path = window.location.pathname;
    $$('.menu-link').forEach(link => {
        const href = link.getAttribute('href') || '';
        // Match /dashboard with /dashboard or /dashboard/
        const isActive = href && (path === href || path.startsWith(href + '/'));
        link.classList.toggle('active', isActive);
    });

    // Click handler for recent tracking
    $$('.menu-link').forEach(link => {
        link.addEventListener('click', function() {
            if (this.parentElement.classList.contains('dragging')) return;

            const id = this.dataset.id;
            const nameKey = this.querySelector('.menu-label')?.dataset.i18n;
            const name = nameKey ? t(nameKey) : (this.dataset.name || this.querySelector('.menu-label')?.textContent);

            if (id && name) addToRecent(id, name);
            showProgress();

            if (isMobile()) closeMobileMenu();
        });
    });
}

function openCommandPalette() {
    if (!commandOverlay) return;
    commandOverlay.classList.add('open');
    commandInput.value = '';
    commandInput.focus();
    selectedCommandIndex = 0;
    renderCommands(commands);
}

function closeCommandPalette() {
    if (!commandOverlay) return;
    commandOverlay.classList.remove('open');
    commandInput?.blur();
}

function renderCommands(cmds) {
    if (!commandList) return;
    filteredCommands = cmds;

    if (cmds.length === 0) {
        commandList.innerHTML = `<div class="command-empty">${t('tNoResults')}</div>`;
        return;
    }

    // Group by category
    const grouped = {};
    cmds.forEach(cmd => {
        if (!grouped[cmd.group]) grouped[cmd.group] = [];
        grouped[cmd.group].push(cmd);
    });

    let html = '';
    let globalIdx = 0;

    const groupTitles = {
        actions: t('cmdGroupActions'),
        pages: t('cmdGroupPages'),
        nav: t('cmdGroupNav'),
    };

    Object.entries(grouped).forEach(([group, items]) => {
        html += `<div style="padding: 8px 14px 4px; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">${groupTitles[group] || group}</div>`;
        items.forEach(cmd => {
            const isSelected = globalIdx === selectedCommandIndex;
            html += `
                <div class="command-item ${isSelected ? 'selected' : ''}" data-index="${globalIdx}">
                    <span class="cmd-icon">${cmd.icon}</span>
                    <span class="cmd-label">${t(cmd.labelKey)}</span>
                    ${cmd.shortcut ? `<span class="cmd-shortcut">${cmd.shortcut}</span>` : ''}
                </div>
            `;
            globalIdx++;
        });
    });

    commandList.innerHTML = html;

    commandList.querySelectorAll('.command-item').forEach(item => {
        item.addEventListener('click', () => {
            const idx = parseInt(item.dataset.index, 10);
            executeCommand(idx);
        });
        item.addEventListener('mouseenter', () => {
            selectedCommandIndex = parseInt(item.dataset.index, 10);
            updateSelectedCommand();
        });
    });
}

function updateSelectedCommand() {
    if (!commandList) return;
    commandList.querySelectorAll('.command-item').forEach(item => {
        const idx = parseInt(item.dataset.index, 10);
        item.classList.toggle('selected', idx === selectedCommandIndex);
    });
    const selected = commandList.querySelector('.command-item.selected');
    selected?.scrollIntoView({ block: 'nearest' });
}

function executeCommand(index) {
    const cmd = filteredCommands[index];
    if (!cmd) return;
    closeCommandPalette();
    setTimeout(() => cmd.action(), 100);
}

function initCommandPalette() {
    if (!commandInput) return;

    commandInput.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
        selectedCommandIndex = 0;

        if (!query) {
            renderCommands(commands);
            return;
        }

        const filtered = commands.filter(cmd => {
            const label = t(cmd.labelKey).toLowerCase();
            return label.includes(query);
        });
        renderCommands(filtered);
    });

    commandInput.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedCommandIndex = Math.min(selectedCommandIndex + 1, filteredCommands.length - 1);
            updateSelectedCommand();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedCommandIndex = Math.max(selectedCommandIndex - 1, 0);
            updateSelectedCommand();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            executeCommand(selectedCommandIndex);
        } else if (e.key === 'Escape') {
            closeCommandPalette();
        }
    });

    commandOverlay?.addEventListener('click', (e) => {
        if (e.target === commandOverlay) closeCommandPalette();
    });
}

async function fetchAlertsCount() {

        if (!res.ok) return;
        const data = await res.json();
        if (!data.success) return;

        const count = (data.data || []).length;

        if (alertsBadge) {
            if (count > 0) {
                alertsBadge.textContent = count > 99 ? '99+' : String(count);
                alertsBadge.style.display = '';

        if (sidebarAlertsBadge) {
            if (count > 0) {

                sidebarAlertsBadge.style.display = '';
            } else {
                sidebarAlertsBadge.style.display = 'none';
            }
        }
    } catch (e) {

// ============================================================
function initKeyboardShortcuts() {
    document.addEventListener('keydown', function(e) {
        // Ctrl+Shift+P → Command Palette
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'p') {
            e.preventDefault();
            if (commandOverlay?.classList.contains('open')) closeCommandPalette();
            else openCommandPalette();
            return;
        }

        // Ctrl+B → Toggle Sidebar
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
            e.preventDefault();
            if (isMobile()) toggleMobileMenu();
            else toggleDesktopCollapse();
            return;
        }

        // Ctrl+K → Search
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            if (!isMobile() && sidebar.classList.contains('collapsed')) {
                sidebar.classList.remove('collapsed');
                document.querySelector('.main-content')?.classList.remove('expanded');
                Storage.set('sidebarCollapsed', 'false');
            }
            setTimeout(() => searchInput?.focus(), 100);
            return;
        }

        // Ctrl+Shift+R → Reading Mode
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'r') {
            e.preventDefault();
            toggleReadingMode();
            return;
        }

        // Escape → Close everything
        if (e.key === 'Escape') {
            if (commandOverlay?.classList.contains('open')) closeCommandPalette();
            else if (sidebar.classList.contains('mobile-open')) closeMobileMenu();
            closeFlyout();
        }
    });
}

// ============================================================
// SWIPE FOR MOBILE
// ============================================================
function initSwipe() {
    let touchStartX = 0;
    let touchStartY = 0;
    const SWIPE_THRESHOLD = 60;

    document.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
        if (!isMobile()) return;

        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;

        if (Math.abs(deltaX) < Math.abs(deltaY)) return;
        if (Math.abs(deltaX) < SWIPE_THRESHOLD) return;

        const isRTL = currentLang === 'fa';
        const edgeZone = isRTL ? window.innerWidth - 50 : 50;

        if (isRTL) {
            if (deltaX > 0 && touchStartX > edgeZone && !sidebar.classList.contains('mobile-open')) {
                openMobileMenu();
            }
            if (deltaX < 0 && sidebar.classList.contains('mobile-open')) {
                closeMobileMenu();
            }
        } else {
            if (deltaX < 0 && touchStartX < edgeZone && !sidebar.classList.contains('mobile-open')) {
                openMobileMenu();
            }
            if (deltaX > 0 && sidebar.classList.contains('mobile-open')) {
                closeMobileMenu();
            }
        }
    }, { passive: true });
}

// ============================================================
// WINDOW RESIZE
// ============================================================
function initResize() {
    let resizeTimer;
    let lastIsMobile = isMobile();

    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            const nowMobile = isMobile();
            if (nowMobile !== lastIsMobile) {
                lastIsMobile = nowMobile;
                closeMobileMenu();
                closeFlyout();
                if (nowMobile) {
                    sidebar.classList.remove('collapsed');
                    document.querySelector('.main-content')?.classList.remove('expanded');
                } else {
                    if (Storage.get('sidebarCollapsed') === 'true') {
                        sidebar.classList.add('collapsed');
                        document.querySelector('.main-content')?.classList.add('expanded');
                    }
                }
            }
        }, 150);
    });
}

    tourBtn?.addEventListener('click', startTour);

    // Sidebar toggle
    toggleBtn?.addEventListener('click', () => {
        if (!isMobile()) toggleDesktopCollapse();
    });
    mobileToggle?.addEventListener('click', toggleMobileMenu);
    overlay?.addEventListener('click', closeMobileMenu);

    // Reading mode
    readingToggle?.addEventListener('click', toggleReadingMode);

    // Restore sidebar state
    if (!isMobile() && Storage.get('sidebarCollapsed') === 'true') {
        sidebar.classList.add('collapsed');
        document.querySelector('.main-content')?.classList.add('expanded');
    }

    // Restore reading mode
    if (Storage.get('readingMode') === 'true') {
        document.body.classList.add('reading-mode');
        readingToggle?.classList.add('active');
        if (readingToggle) {
            readingToggle.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        }
    }

    // Init features
    initSearch();
    initRipple();
    initActiveLinks();
    initPins();
    initDragDrop();
    initCommandPalette();
    initKeyboardShortcuts();
    initSwipe();
    initResize();
    initSubmenus();

    // Restore menu order
    restoreMenuOrder();

    // Render recent & pins
    renderRecent();
    renderPins();

    // Fetch alerts count
    fetchAlertsCount();
    setInterval(fetchAlertsCount, 60000); // Refresh every 60s

    // Subscribe to theme changes from themeManager
    window.themeManager?.on?.(() => {
        applyThemeUI();
    });

    console.log(
        '%c Nav Manager v5.0 ',
        'background: linear-gradient(135deg, #6366f1, #818cf8); color: white; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 13px;'
    );
    console.log('%c Keyboard: Ctrl+B (sidebar) · Ctrl+K (search) · Ctrl+Shift+P (palette) · Ctrl+Shift+R (reading) ', 'color:#94a3b8;font-size:11px;');
    console.log('%c API: window.navManager ', 'color:#94a3b8;font-size:11px;');
}

// ============================================================
// BOOTSTRAP
// ============================================================
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
</body>
