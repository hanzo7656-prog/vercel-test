<style>

   Splash Loader
   ============================================================ */

<!-- ============================================================
     SCRIPT

<script>
// ============================================================
// SplashLoader v4.0 — با api.js + مدیریت خطای هوشمند
// ============================================================

(function() {
    'use strict';

    // ============================================================
    // تنظیمات
    // ============================================================

    const MAX_RETRIES = 2;              // حداکثر تلاش مجدد هر مرحله
    const RETRY_DELAY = 800;            // تأخیر بین retryها (ms)

    // ============================================================
    // تعریف مراحل با api.js
    // ============================================================

    const SPLASH_PHASES = [
        {
            id: 'splashPhase1',
            name: 'اتصال به دیتابیس',
            icon: '🔗',
            critical: false,        // اگه fail شد، می‌شه skip کرد
            check: async () => {
                if (!window.api) throw new Error('api.js لود نشده');
                const data = await window.api.getHealthSummary();
                if (!data || !data.success) {
                    throw new Error(data?.error || 'دیتابیس پاسخ نداد');
                }
                return true;
            }
        },
        {
            id: 'splashPhase2',
            name: 'بارگذاری مدل',
            icon: '🧠',
            critical: false,
            check: async () => {
                if (!window.api) throw new Error('api.js لود نشده');
                const data = await window.api.getModelStatus();
                if (!data || !data.success) {
                    throw new Error(data?.error || 'مدل پاسخ نداد');
                }
                // loaded=false هم قبوله (حالت دمو)
                return true;
            }
        },
        {
            id: 'splashPhase3',
            name: 'دریافت ارزها',
            icon: '📊',
            critical: false,
            check: async () => {
                if (!window.api) throw new Error('api.js لود نشده');
                const data = await window.api.getCoinsList({ limit: 10 });
                if (!data || !data.success) {
                    throw new Error(data?.error || 'لیست ارزها دریافت نشد');
                }
                if (!data.data || data.data.length === 0) {
                    throw new Error('لیست ارزها خالیه');
                }
                return true;
            }
        },
        {
            id: 'splashPhase4',
            name: 'دریافت قیمت‌ها',
            icon: '💰',
            critical: false,
            check: async () => {
                if (!window.api) throw new Error('api.js لود نشده');
                const data = await window.api.getPrices();
                if (!data || !data.success) {
                    throw new Error(data?.error || 'قیمت‌ها دریافت نشد');
                }
                return true;
            }
        },
        {
            id: 'splashPhase5',
            name: 'آماده‌سازی UI',
            icon: '🚀',
            critical: true,          // هیچ‌وقت skip نمی‌شه
            check: async () => {
                await new Promise(r => setTimeout(r, 300));
                return true;
            }
        }
    ];

    // ============================================================
    // State
    // ============================================================

    const state = {
        currentIndex: 0,
        isRunning: false,
        isPaused: false,
        aborted: false,
        skipAllFlag: false,       // اگه true، همه خطاهای بعدی skip می‌شن
        phaseResults: [],         // نتیجه هر مرحله
        onCompleteCallback: null,
        errorResolve: null,       // resolve تابع modal
    };

    // ============================================================
    // DOM Elements
    // ============================================================

    const elements = {
        loader: document.getElementById('splashLoader'),
        subtitle: document.getElementById('splashSubtitle'),
        progressBar: document.getElementById('splashProgressBar'),
        currentCount: document.getElementById('splashCurrentCount'),
        totalCount: document.getElementById('splashTotalCount'),
        currentPhaseText: document.getElementById('splashCurrentPhaseText'),
        errorModal: document.getElementById('splashErrorModal'),
        errorIcon: document.getElementById('splashErrorIcon'),
        errorTitle: document.getElementById('splashErrorTitle'),
        errorPhase: document.getElementById('splashErrorPhase'),
        errorMessage: document.getElementById('splashErrorMessage'),
        errorHint: document.getElementById('splashErrorHint'),
        skipAllBtn: document.getElementById('splashSkipAllBtn'),
    };

    // ============================================================
    // Helpers
    // ============================================================

    function toPersian(num) {
        return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function delay(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    // ============================================================
    // UI Updates
    // ============================================================

    function updatePhaseUI(phaseIndex, status = 'active') {
        SPLASH_PHASES.forEach((phase, idx) => {
            const el = document.getElementById(phase.id);
            if (!el) return;

            const countEl = el.querySelector('.phase-count');

            if (idx < phaseIndex) {
                el.className = 'phase-item done';
                if (countEl) countEl.textContent = '✅ انجام شد';
            } else if (idx === phaseIndex) {
                if (status === 'error') {
                    el.className = 'phase-item error';
                    if (countEl) countEl.textContent = '❌ خطا';
                } else if (status === 'skipped') {
                    el.className = 'phase-item skipped';
                    if (countEl) countEl.textContent = '⏭️ رد شد';
                } else {
                    el.className = 'phase-item active';
                    if (countEl) countEl.textContent = '⏳ در حال...';
                }
            } else {
                el.className = 'phase-item';
                if (countEl) countEl.textContent = '⏳ در انتظار';
            }
        });

        if (elements.currentPhaseText) {
            if (phaseIndex < SPLASH_PHASES.length) {
                elements.currentPhaseText.textContent = SPLASH_PHASES[phaseIndex].name;
            } else {
                elements.currentPhaseText.textContent = 'تکمیل شد ✅';
            }
        }
    }

    function updateProgress() {
        const done = SPLASH_PHASES.filter((_, i) => i < state.currentIndex).length;
        const percent = (done / SPLASH_PHASES.length) * 100;

        if (elements.progressBar) {
            elements.progressBar.style.width = percent + '%';
        }
        if (elements.currentCount) {
            elements.currentCount.textContent = toPersian(done);
        }
        if (elements.totalCount) {
            elements.totalCount.textContent = toPersian(SPLASH_PHASES.length);
        }
    }

    // ============================================================
    // Error Modal
    // ============================================================

    /**
     * نمایش modal خطا و انتظار برای تصمیم کاربر
     * @returns {Promise<'continue'|'skipAll'|'abort'>}
     */
    function showErrorModal(phase, errorMsg, attemptInfo = '') {
        return new Promise((resolve) => {

            // آیکون و عنوان بر اساس critical
            if (elements.errorIcon) {
                elements.errorIcon.textContent = phase.critical ? '🚨' : '⚠️';
            }
            if (elements.errorTitle) {
                elements.errorTitle.textContent = phase.critical
                    ? 'خطای بحرانی'
                    : 'خطا در بارگذاری';
            }
            if (elements.errorPhase) {
                const attemptText = attemptInfo ? ` (${attemptInfo})` : '';
                elements.errorPhase.textContent = `مرحله: ${phase.name}${attemptText}`;
            }
            if (elements.errorMessage) {
                elements.errorMessage.textContent = errorMsg;
            }

            // hint
            if (elements.errorHint) {
                if (phase.critical) {
                    elements.errorHint.innerHTML = `
                        <i class="fas fa-exclamation-triangle" style="color:var(--color-red);"></i>
                        <span>این مرحله حیاتیه و باید تکمیل بشه</span>
                    `;
                } else {
                    elements.errorHint.innerHTML = `
                        <i class="fas fa-info-circle"></i>
                        <span>با "ادامه بده" سیستم با داده‌های محدود کار می‌کنه</span>
                    `;
                }
            }

            // دکمه "رد کردن همه" - فقط اگه مراحل بعدی هم هستن
            const hasMorePhases = state.currentIndex < SPLASH_PHASES.length - 1;
            if (elements.skipAllBtn) {
                elements.skipAllBtn.style.display = hasMorePhases ? 'inline-flex' : 'none';
            }

            // نمایش modal
            elements.errorModal.classList.add('active');

            // ذخیره resolve
            state.errorResolve = resolve;
        });
    }

    // ============================================================
    // Error Retry
    // ============================================================

    /**
     * اجرای یه مرحله با retry
     */
    async function runPhaseWithRetry(phase) {
        let lastError = null;

        for (let attempt = 1; attempt <= MAX_RETRIES + 1; attempt++) {
            try {
                console.log(`🔍 [Splash] ${phase.name} - attempt ${attempt}`);
                await phase.check();
                console.log(`✅ [Splash] ${phase.name} - OK`);
                return { success: true, attempts: attempt };
            } catch (err) {
                lastError = err;
                console.warn(`⚠️ [Splash] ${phase.name} - attempt ${attempt} failed:`, err.message);

                // اگه آخرین تلاش نبود، صبر کن
                if (attempt <= MAX_RETRIES) {
                    await delay(RETRY_DELAY);
                }
            }
        }

        return {
            success: false,
            attempts: MAX_RETRIES + 1,
            error: lastError,
        };
    }

    // ============================================================
    // Run Phases
    // ============================================================

    async function runPhases() {
        for (let i = 0; i < SPLASH_PHASES.length; i++) {
            if (state.aborted) return;

            state.currentIndex = i;
            const phase = SPLASH_PHASES[i];

            // نمایش وضعیت فعال
            updatePhaseUI(i, 'active');
            updateProgress();

            // ===== چک مرحله با retry =====
            const result = await runPhaseWithRetry(phase);

            // ===== موفق =====
            if (result.success) {
                state.phaseResults.push({ phase: phase.name, status: 'ok' });
                updatePhaseUI(i + 1, 'active');
                updateProgress();
                await delay(200);
                continue;
            }

            // ===== خطا =====
            console.warn(`⚠️ [Splash] ${phase.name} failed after ${result.attempts} attempts`);

            // بروزرسانی UI به حالت خطا
            updatePhaseUI(i, 'error');

            // ===== اگه skipAll فعاله، خودکار skip کن =====
            if (state.skipAllFlag && !phase.critical) {
                console.log(`⏭️ [Splash] Auto-skipping (skipAll active): ${phase.name}`);
                state.phaseResults.push({ phase: phase.name, status: 'skipped-auto' });
                updatePhaseUI(i, 'skipped');
                await delay(300);
                continue;
            }

            // ===== نمایش modal و انتظار برای تصمیم کاربر =====
            const attemptInfo = `${result.attempts} تلاش`;
            const decision = await showErrorModal(
                phase,
                result.error?.message || 'خطای نامشخص',
                attemptInfo
            );

            // مخفی کردن modal
            elements.errorModal.classList.remove('active');

            if (decision === 'abort') {
                console.log(`🛑 [Splash] Aborted by user at: ${phase.name}`);
                state.aborted = true;
                state.phaseResults.push({ phase: phase.name, status: 'aborted' });
                abortAndRedirect();
                return;
            }

            if (decision === 'skipAll') {
                console.log(`⏭️ [Splash] Skip-all activated at: ${phase.name}`);
                state.skipAllFlag = true;
                state.phaseResults.push({ phase: phase.name, status: 'skipped' });
                updatePhaseUI(i, 'skipped');
                await delay(300);
                continue;
            }

            // continue (پیش‌فرض)
            if (phase.critical) {
                // مرحله critical رو نمی‌شه skip کرد
                console.warn(`⚠️ [Splash] Critical phase "${phase.name}" cannot be skipped, retrying...`);
                i--;  // دوباره همون مرحله رو اجرا کن
                continue;
            }

            console.log(`⏭️ [Splash] User skipped: ${phase.name}`);
            state.phaseResults.push({ phase: phase.name, status: 'skipped' });
            updatePhaseUI(i, 'skipped');
            await delay(300);
        }

        // همه مراحل تمام
        console.log('✅ [Splash] All phases completed');
        console.log('📊 Results:', state.phaseResults);

        if (elements.currentPhaseText) {
            elements.currentPhaseText.textContent = 'تکمیل شد ✅';
        }
        if (elements.progressBar) {
            elements.progressBar.style.width = '100%';
        }

        // مخفی کردن loader
        await delay(500);

        if (elements.loader) {
            elements.loader.classList.add('hidden');
        }

        state.isRunning = false;

        if (state.onCompleteCallback) {
            state.onCompleteCallback({
                phaseResults: state.phaseResults,
                skipped: state.phaseResults.filter(r => r.status.includes('skipped')).length,
                aborted: false,
            });
        }
    }

    // ============================================================
    // Abort
    // ============================================================

    function abortAndRedirect() {
        console.error('🛑 [Splash] Loading aborted by user');

        elements.errorModal.classList.remove('active');

        if (elements.currentPhaseText) {
            elements.currentPhaseText.textContent = 'متوقف شد ❌';
        }

        setTimeout(() => {
            window.location.href = '/500';
        }, 1500);
    }

    // ============================================================
    // Public API
    // ============================================================

    const splashLoader = {

        /**
         * شروع لود
         * @param {Function} onComplete - callback بعد از اتمام
         */
        async start(onComplete) {
            if (state.isRunning) return;

            state.isRunning = true;
            state.aborted = false;
            state.skipAllFlag = false;
            state.phaseResults = [];
            state.currentIndex = 0;
            state.onCompleteCallback = onComplete || null;

            // نمایش loader
            if (elements.loader) {
                elements.loader.classList.remove('hidden');
            }

            // تنظیم تعداد کل
            if (elements.totalCount) {
                elements.totalCount.textContent = toPersian(SPLASH_PHASES.length);
            }

            updateProgress();
            updatePhaseUI(0, 'active');

            // انتظار کوتاه تا api.js آماده بشه
            await delay(100);

            await runPhases();
        },

        /**
         * کاربر گفت "ادامه بده"
         */
        continueAfterError() {
            if (state.errorResolve) {
                const resolve = state.errorResolve;
                state.errorResolve = null;
                resolve('continue');
            }
        },

        /**
         * کاربر گفت "رد کردن همه"
         */
        skipAll() {
            if (state.errorResolve) {
                const resolve = state.errorResolve;
                state.errorResolve = null;
                resolve('skipAll');
            }
        },

        /**
         * کاربر گفت "توقف کامل"
         */
        abort() {
            if (state.errorResolve) {
                const resolve = state.errorResolve;
                state.errorResolve = null;
                resolve('abort');
            }
        },

        /**
         * مخفی کردن دستی
         */
        hide() {
            if (elements.loader) {
                elements.loader.classList.add('hidden');
            }
            state.isRunning = false;
        },

        /**
         * نمایش دستی
         */
        show() {
            if (elements.loader) {
                elements.loader.classList.remove('hidden');
            }
        },

        /**
         * وضعیت
         */
        getStatus() {
            return {
                isRunning: state.isRunning,
                currentPhase: state.currentIndex,
                totalPhases: SPLASH_PHASES.length,
                skipAllFlag: state.skipAllFlag,
                phases: SPLASH_PHASES.map(p => p.name),
                results: [...state.phaseResults],
            };
        },
    };

    // ============================================================
    // Expose
    // ============================================================

    window.splashLoader = splashLoader;
    window.loading = splashLoader;      // سازگاری با نسخه قدیم

    console.log('✅ SplashLoader v4.0 loaded (smart error handling)');
})();
</script>
