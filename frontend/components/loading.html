<!-- ============================================================
     loading.html - اسپلش لودینگ اولیه وب سرویس
     نسخه ۲.۰ - با نام‌های ثابت و مستقل
     ============================================================ -->

<div class="splash-loader" id="splashLoader">
    <div class="splash-content">
        
        <!-- لوگو -->
        <div class="splash-logo">
            <i class="fas fa-chart-pie"></i>
        </div>
        
        <!-- عنوان -->
        <div class="splash-title">
            <span class="highlight">سیستم تحلیلگر</span>
        </div>
        <div class="splash-subtitle">
            <i class="fas fa-sync-alt fa-fw" style="color:#00d4ff; animation: spin 1.5s linear infinite;"></i>
            در حال بارگذاری...
        </div>
        
        <!-- نوار پیشرفت -->
        <div class="splash-progress-wrapper">
            <div class="splash-progress-bar" id="splashProgressBar"></div>
        </div>
        
        <!-- شمارش -->
        <div class="splash-counter">
            <span id="splashCurrentCount">۰</span>
            <span class="total"> / <span id="splashTotalCount">۰</span></span>
        </div>
        
        <!-- مراحل -->
        <div class="splash-phases" id="splashPhasesContainer">
            <div class="phase-item" id="splashPhase1">
                <span class="phase-icon">🔗</span>
                <span class="phase-name">اتصال به دیتابیس</span>
                <span class="phase-count">۰ / ۰</span>
            </div>
            <div class="phase-item" id="splashPhase2">
                <span class="phase-icon">🧠</span>
                <span class="phase-name">بارگذاری مدل</span>
                <span class="phase-count">۰ / ۰</span>
            </div>
            <div class="phase-item" id="splashPhase3">
                <span class="phase-icon">🌐</span>
                <span class="phase-name">دریافت قیمت‌ها</span>
                <span class="phase-count">۰ / ۰</span>
            </div>
            <div class="phase-item" id="splashPhase4">
                <span class="phase-icon">📊</span>
                <span class="phase-name">پردازش داده</span>
                <span class="phase-count">۰ / ۰</span>
            </div>
            <div class="phase-item" id="splashPhase5">
                <span class="phase-icon">⚡</span>
                <span class="phase-name">راه‌اندازی نظارت</span>
                <span class="phase-count">۰ / ۰</span>
            </div>
            <div class="phase-item" id="splashPhase6">
                <span class="phase-icon">🚀</span>
                <span class="phase-name">آماده‌سازی UI</span>
                <span class="phase-count">۰ / ۰</span>
            </div>
        </div>
        
        <!-- وضعیت فعلی -->
        <div class="splash-current">
            <i class="fas fa-circle" style="color:#00d4ff;font-size:0.4rem;vertical-align:middle;"></i>
            <span class="current-text">در حال <span class="highlight-text" id="splashCurrentPhaseText">آماده‌سازی</span></span>
        </div>
        
    </div>
</div>

<style>
    /* ============================================================
       استایل‌های اسپلش لودینگ (بارگذاری اولیه)
       ============================================================ */
    
    .splash-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #0f172a;
        z-index: 99999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    .splash-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(1.03);
    }
    
    .splash-content {
        max-width: 520px;
        width: 90%;
        padding: 24px;
        text-align: center;
    }
    
    .splash-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #00d4ff, #8b5cf6);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.4rem;
        color: #fff;
        box-shadow: 0 8px 40px rgba(0, 212, 255, 0.2);
        animation: splashLogoPulse 2s ease-in-out infinite;
        position: relative;
    }
    
    .splash-logo::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 28px;
        background: linear-gradient(135deg, #00d4ff, #8b5cf6);
        opacity: 0.15;
        filter: blur(16px);
        z-index: -1;
        animation: splashLogoGlow 2s ease-in-out infinite alternate;
    }
    
    @keyframes splashLogoPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }
    
    @keyframes splashLogoGlow {
        0% { opacity: 0.15; transform: scale(1); }
        100% { opacity: 0.3; transform: scale(1.2); }
    }
    
    .splash-title {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 4px;
    }
    
    .splash-title .highlight {
        background: linear-gradient(135deg, #00d4ff, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    .splash-subtitle {
        font-size: 0.85rem;
        color: #64748b;
        margin-bottom: 24px;
    }
    
    .splash-progress-wrapper {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        padding: 3px;
        margin-bottom: 12px;
        position: relative;
        overflow: hidden;
    }
    
    .splash-progress-bar {
        height: 6px;
        border-radius: 10px;
        background: linear-gradient(90deg, #00d4ff, #8b5cf6, #ec4899);
        width: 0%;
        transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
    }
    
    .splash-progress-bar::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 40px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        animation: splashShimmer 1.8s infinite;
    }
    
    @keyframes splashShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
    }
    
    .splash-counter {
        font-size: 1.2rem;
        font-weight: 600;
        font-family: 'Courier New', monospace;
        color: #00d4ff;
        margin: 4px 0 16px;
    }
    
    .splash-counter .total {
        color: #475569;
        font-weight: 400;
    }
    
    .splash-phases {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        margin: 16px 0 12px;
    }
    
    .phase-item {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 10px 8px;
        transition: all 0.4s ease;
        text-align: center;
    }
    
    .phase-item .phase-icon {
        font-size: 1.1rem;
        display: block;
        margin-bottom: 2px;
    }
    
    .phase-item .phase-name {
        font-size: 0.6rem;
        color: #64748b;
        display: block;
        font-weight: 500;
    }
    
    .phase-item .phase-count {
        font-size: 0.55rem;
        color: #475569;
        display: block;
        margin-top: 2px;
        font-family: 'Courier New', monospace;
    }
    
    .phase-item.active {
        border-color: rgba(0, 212, 255, 0.2);
        background: rgba(0, 212, 255, 0.04);
    }
    
    .phase-item.active .phase-name {
        color: #00d4ff;
    }
    
    .phase-item.done {
        border-color: rgba(34, 211, 238, 0.1);
        background: rgba(34, 211, 238, 0.03);
    }
    
    .phase-item.done .phase-name {
        color: #22d3ee;
    }
    
    .phase-item.done .phase-count {
        color: #22d3ee;
    }
    
    .splash-current {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-top: 8px;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .splash-current .current-text {
        color: #f1f5f9;
    }
    
    .splash-current .highlight-text {
        color: #00d4ff;
        font-weight: 500;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
        .splash-phases {
            grid-template-columns: 1fr 1fr;
        }
    }
    
    @media (max-width: 480px) {
        .splash-title {
            font-size: 1.1rem;
        }
        .splash-counter {
            font-size: 1rem;
        }
        .splash-phases {
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }
        .phase-item {
            padding: 6px 4px;
        }
        .phase-item .phase-name {
            font-size: 0.5rem;
        }
    }
</style>

<script>
// ============================================================
// SPLASH LOADER - بارگذاری اولیه وب سرویس
// نام: window.loading (ثابت)
// متدها: start(callback), hide(), show(), getStatus()
// ============================================================

(function() {
    'use strict';
    
    // ===== داده‌های مراحل =====
    const SPLASH_PHASES = [
        { id: 'splashPhase1', name: 'اتصال به دیتابیس', icon: '🔗', total: 8, current: 0 },
        { id: 'splashPhase2', name: 'بارگذاری مدل', icon: '🧠', total: 5, current: 0 },
        { id: 'splashPhase3', name: 'دریافت قیمت‌ها', icon: '🌐', total: 10, current: 0 },
        { id: 'splashPhase4', name: 'پردازش داده', icon: '📊', total: 10, current: 0 },
        { id: 'splashPhase5', name: 'راه‌اندازی نظارت', icon: '⚡', total: 7, current: 0 },
        { id: 'splashPhase6', name: 'آماده‌سازی UI', icon: '🚀', total: 10, current: 0 }
    ];
    
    const SPLASH_TOTAL_ITEMS = SPLASH_PHASES.reduce((sum, p) => sum + p.total, 0);
    let splashCurrentPhaseIndex = 0;
    let splashIsComplete = false;
    let splashOnCompleteCallback = null;
    let splashIsRunning = false;
    
    // ===== عناصر DOM =====
    const splashElements = {
        loader: document.getElementById('splashLoader'),
        progressBar: document.getElementById('splashProgressBar'),
        currentCount: document.getElementById('splashCurrentCount'),
        totalCount: document.getElementById('splashTotalCount'),
        currentPhaseText: document.getElementById('splashCurrentPhaseText')
    };
    
    // ===== بروزرسانی UI =====
    function updateSplashPhaseUI(phaseIndex) {
        SPLASH_PHASES.forEach((phase, idx) => {
            const el = document.getElementById(phase.id);
            if (!el) return;
            const countEl = el.querySelector('.phase-count');
            
            if (idx < phaseIndex) {
                el.className = 'phase-item done';
                if (countEl) countEl.textContent = `${phase.total} / ${phase.total}`;
            } else if (idx === phaseIndex) {
                el.className = 'phase-item active';
                if (countEl) countEl.textContent = `${phase.current} / ${phase.total}`;
            } else {
                el.className = 'phase-item';
                if (countEl) countEl.textContent = `۰ / ${phase.total}`;
            }
        });
        
        if (splashElements.currentPhaseText) {
            if (phaseIndex < SPLASH_PHASES.length) {
                splashElements.currentPhaseText.textContent = SPLASH_PHASES[phaseIndex].name;
            } else {
                splashElements.currentPhaseText.textContent = 'تکمیل شد ✅';
            }
        }
    }
    
    function updateSplashProgress() {
        const totalDone = SPLASH_PHASES.reduce((sum, p) => sum + p.current, 0);
        const percent = Math.min((totalDone / SPLASH_TOTAL_ITEMS) * 100, 100);
        
        if (splashElements.progressBar) {
            splashElements.progressBar.style.width = percent + '%';
        }
        if (splashElements.currentCount) {
            splashElements.currentCount.textContent = totalDone;
        }
        if (splashElements.totalCount) {
            splashElements.totalCount.textContent = SPLASH_TOTAL_ITEMS;
        }
    }
    
    // ===== شروع لودینگ =====
    function startSplashLoading(onComplete) {
        if (splashIsRunning) return;
        
        splashIsRunning = true;
        splashOnCompleteCallback = onComplete || null;
        
        // تنظیم عدد کل از ابتدا
        if (splashElements.totalCount) {
            splashElements.totalCount.textContent = SPLASH_TOTAL_ITEMS;
        }
        
        // ریست مراحل
        SPLASH_PHASES.forEach(p => p.current = 0);
        splashCurrentPhaseIndex = 0;
        splashIsComplete = false;
        
        // نمایش لودینگ
        if (splashElements.loader) {
            splashElements.loader.classList.remove('hidden');
        }
        
        updateSplashPhaseUI(0);
        updateSplashProgress();
        
        // شروع بارگذاری
        runSplashLoading();
    }
    
    // ===== اجرای مراحل =====
    async function runSplashLoading() {
        for (let phaseIdx = 0; phaseIdx < SPLASH_PHASES.length; phaseIdx++) {
            const phase = SPLASH_PHASES[phaseIdx];
            splashCurrentPhaseIndex = phaseIdx;
            
            // مرحله جاری
            phase.current = 0;
            updateSplashPhaseUI(phaseIdx);
            updateSplashProgress();
            
            // شبیه‌سازی انجام آیتم‌های هر مرحله
            const stepDelay = 60 + Math.random() * 80;
            for (let i = 1; i <= phase.total; i++) {
                phase.current = i;
                updateSplashPhaseUI(phaseIdx);
                updateSplashProgress();
                await new Promise(resolve => setTimeout(resolve, stepDelay));
            }
            
            // کامل شدن مرحله
            phase.current = phase.total;
            updateSplashPhaseUI(phaseIdx);
            updateSplashProgress();
            
            // تاخیر بین مراحل
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        // لودینگ کامل شد
        splashIsComplete = true;
        splashIsRunning = false;
        if (splashElements.currentPhaseText) {
            splashElements.currentPhaseText.textContent = 'تکمیل شد ✅';
        }
        
        // مخفی کردن لودینگ بعد از ۵۰۰ms
        setTimeout(() => {
            if (splashElements.loader) {
                splashElements.loader.classList.add('hidden');
            }
            if (splashOnCompleteCallback) {
                splashOnCompleteCallback();
            }
        }, 500);
    }
    
    // ===== توابع عمومی با نام‌های ثابت =====
    window.loading = {
        start: startSplashLoading,
        hide: function() {
            if (splashElements.loader) {
                splashElements.loader.classList.add('hidden');
            }
            splashIsRunning = false;
        },
        show: function() {
            if (splashElements.loader) {
                splashElements.loader.classList.remove('hidden');
            }
        },
        getStatus: function() {
            return {
                isComplete: splashIsComplete,
                isRunning: splashIsRunning,
                currentPhase: splashCurrentPhaseIndex,
                phases: SPLASH_PHASES.map(p => ({ ...p })),
                totalItems: SPLASH_TOTAL_ITEMS
            };
        }
    };
    
    console.log('✅ SplashLoader v2.0 loaded (window.loading)');
    
})();
</script>
