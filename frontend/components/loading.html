<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-color="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#070c16">
<title>در حال بارگذاری...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   SPLASH LOADER v6 — Transparency-First Design
   ============================================================ */

/* ---------- Color Themes ---------- */
html[data-color="indigo"]  { --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8; --primary-rgb: 99, 102, 241; }
html[data-color="emerald"] { --primary: #10b981; --primary-dark: #059669; --primary-light: #34d399; --primary-rgb: 16, 185, 129; }
html[data-color="rose"]    { --primary: #f43f5e; --primary-dark: #e11d48; --primary-light: #fb7185; --primary-rgb: 244, 63, 94; }
html[data-color="amber"]   { --primary: #f59e0b; --primary-dark: #d97706; --primary-light: #fbbf24; --primary-rgb: 245, 158, 11; }
html[data-color="violet"]  { --primary: #a855f7; --primary-dark: #9333ea; --primary-light: #c084fc; --primary-rgb: 168, 85, 247; }
html[data-color="cyan"]    { --primary: #06b6d4; --primary-dark: #0891b2; --primary-light: #22d3ee; --primary-rgb: 6, 182, 212; }
html[data-color="custom"]  { --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8; --primary-rgb: 99, 102, 241; }

/* ---------- Dark Theme ---------- */
html[data-theme="dark"] {
    --bg-page: #070c16;
    --bg-card: rgba(20, 28, 45, 0.75);
    --bg-card-solid: #131c2d;
    --bg-glass: rgba(19, 28, 45, 0.85);
    --bg-input: rgba(10, 16, 28, 0.8);
    --bg-hover: rgba(148, 163, 184, 0.06);
    --bg-hover-strong: rgba(148, 163, 184, 0.1);
    --text-light: #e6edf7;
    --text-muted: #8b9bb4;
    --text-dim: #5c6b82;
    --text-faint: #3d4959;
    --border: rgba(148, 163, 184, 0.07);
    --border-strong: rgba(148, 163, 184, 0.15);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
    --shadow-focus: 0 0 0 3px rgba(var(--primary-rgb), 0.15);
    --success: #22c55e;
    --success-dark: #16a34a;
    --warning: #f59e0b;
    --warning-dark: #d97706;
    --danger: #ef4444;
    --danger-dark: #dc2626;
    --info: #06b6d4;
    --success-bg: rgba(34, 197, 94, 0.1);
    --warning-bg: rgba(245, 158, 11, 0.1);
    --danger-bg: rgba(239, 68, 68, 0.1);
    --info-bg: rgba(6, 182, 212, 0.1);
    --primary-bg: rgba(var(--primary-rgb), 0.1);
}

/* ---------- Light Theme ---------- */
html[data-theme="light"] {
    --bg-page: #f6f8fc;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-solid: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.9);
    --bg-input: rgba(248, 250, 252, 0.95);
    --bg-hover: rgba(15, 23, 42, 0.04);
    --bg-hover-strong: rgba(15, 23, 42, 0.07);
    --text-light: #0d1421;
    --text-muted: #5c6b82;
    --text-dim: #8b9bb4;
    --text-faint: #a8b4c4;
    --border: rgba(15, 23, 42, 0.06);
    --border-strong: rgba(15, 23, 42, 0.12);
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.12);
    --shadow-focus: 0 0 0 3px rgba(var(--primary-rgb), 0.15);
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --info: #0891b2;
    --success-bg: rgba(22, 163, 74, 0.08);
    --warning-bg: rgba(217, 119, 6, 0.08);
    --danger-bg: rgba(220, 38, 38, 0.08);
    --info-bg: rgba(8, 145, 178, 0.08);
    --primary-bg: rgba(var(--primary-rgb), 0.08);
}

/* ---------- Base ---------- */
:root {
    --ui-font: 'Vazirmatn', system-ui, sans-serif;
    --mono-font: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    overflow: hidden;
    height: 100vh;
}

body {
    font-family: var(--ui-font);
    background: var(--bg-page);
    color: var(--text-light);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background var(--transition), color var(--transition);
}

::selection { background: var(--primary); color: white; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

/* ============================================================
   ROOT CONTAINER
   ============================================================ */
.splash-root {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 99999;
    overflow: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.6s ease;
}

.splash-root.exit {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: scale(1.03);
}

/* ============================================================
   ANIMATED BACKGROUND
   ============================================================ */
.splash-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
}

.splash-bg::before {
    content: '';
    position: absolute;
    top: -30%;
    right: -20%;
    width: 80%;
    height: 80%;
    background: radial-gradient(circle, rgba(var(--primary-rgb), 0.12) 0%, transparent 60%);
    animation: bgFloat1 15s ease-in-out infinite;
    pointer-events: none;
}

.splash-bg::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -20%;
    width: 80%;
    height: 80%;
    background: radial-gradient(circle, rgba(var(--primary-rgb), 0.08) 0%, transparent 60%);
    animation: bgFloat2 18s ease-in-out infinite;
    pointer-events: none;
}

@keyframes bgFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
    50% { transform: translate(-40px, 30px) scale(1.15); opacity: 1; }
}

@keyframes bgFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
    50% { transform: translate(40px, -30px) scale(1.2); opacity: 0.9; }
}

/* Floating Particles */
.splash-particles {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.splash-particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--primary);
    border-radius: 50%;
    opacity: 0.4;
    box-shadow: 0 0 6px var(--primary);
    animation: particleFloat linear infinite;
    will-change: transform, opacity;
}

@keyframes particleFloat {
    0% {
        transform: translate(0, 100vh) scale(0.5);
        opacity: 0;
    }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% {
        transform: translate(var(--drift, 0), -100px) scale(1);
        opacity: 0;
    }
}

/* ============================================================
   MAIN CARD
   ============================================================ */
.splash-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    background: var(--bg-card);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-strong);
    border-radius: 24px;
    padding: 32px 28px 24px;
    box-shadow:
        var(--shadow-lg),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    display: flex;
    flex-direction: column;
    gap: 22px;
    animation: cardIn 0.6s var(--ease-spring);
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    overflow-x: hidden;
}

.splash-card::-webkit-scrollbar { width: 4px; }
.splash-card::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ============================================================
   ORBITAL LOGO + PROGRESS RING
   ============================================================ */
.splash-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

.orbital-wrapper {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Progress Ring SVG */
.progress-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    pointer-events: none;
}

.progress-ring__track {
    fill: none;
    stroke: var(--bg-hover-strong);
    stroke-width: 6;
}

.progress-ring__fill {
    fill: none;
    stroke: url(#progressGradient);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 402;
    stroke-dashoffset: 402;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 0 8px var(--primary));
}

.progress-ring__dot {
    fill: var(--primary-light);
    filter: drop-shadow(0 0 10px var(--primary));
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Orbital Logo */
.orbital-logo {
    position: relative;
    width: 90px;
    height: 90px;
    border-radius: 26px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow:
        0 12px 40px rgba(var(--primary-rgb), 0.4),
        0 0 0 8px rgba(var(--primary-rgb), 0.05);
    animation: logoPulse 2.5s ease-in-out infinite;
    z-index: 1;
}

.orbital-logo svg {
    width: 42px;
    height: 42px;
    animation: logoSpin 20s linear infinite;
}

@keyframes logoSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes logoPulse {
    0%, 100% {
        transform: scale(1);
        box-shadow:
            0 12px 40px rgba(var(--primary-rgb), 0.4),
            0 0 0 8px rgba(var(--primary-rgb), 0.05);
    }
    50% {
        transform: scale(1.04);
        box-shadow:
            0 16px 52px rgba(var(--primary-rgb), 0.55),
            0 0 0 12px rgba(var(--primary-rgb), 0.08);
    }
}

/* Orbiting dot */
.orbital-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    background: var(--primary);
    border-radius: 50%;
    box-shadow:
        0 0 12px var(--primary),
        0 0 24px rgba(var(--primary-rgb), 0.6);
    transform-origin: 0 0;
    animation: orbit 3.5s linear infinite;
    pointer-events: none;
}

@keyframes orbit {
    from {
        transform: rotate(0deg) translateX(65px) rotate(0deg);
    }
    to {
        transform: rotate(360deg) translateX(65px) rotate(-360deg);
    }
}

/* Percent inside ring - hidden, we show in label below */
.orbital-percent {
    display: none;
}

/* ============================================================
   TITLE + SUBTITLE
   ============================================================ */
.splash-title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: -0.3px;
    line-height: 1.3;
    background: linear-gradient(135deg, var(--text-light), var(--primary-light));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.splash-subtitle {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono-font);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: -6px;
}

.splash-subtitle::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--primary);
    border-radius: 50%;
    animation: dotPulse 1.5s ease-in-out infinite;
    box-shadow: 0 0 8px var(--primary);
}

@keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
}

/* ============================================================
   STATS BAR (Estimated Time + Progress + Step)
   ============================================================ */
.splash-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 12px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
}

.splash-stats::before {
    content: '';
    position: absolute;
    top: 0; right: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg,
        transparent 0%,
        var(--primary) 50%,
        transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 2.5s linear infinite;
    opacity: 0.6;
}

@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

.stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px;
    position: relative;
    min-width: 0;
}

.stat-item:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 0;
    top: 15%;
    height: 70%;
    width: 1px;
    background: var(--border);
}

.stat-icon {
    width: 20px;
    height: 20px;
    color: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2px;
}

.stat-icon svg { width: 14px; height: 14px; }

.stat-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 700;
    font-family: var(--mono-font);
    text-align: center;
    white-space: nowrap;
}

.stat-value {
    font-size: 14px;
    color: var(--text-light);
    font-family: var(--mono-font);
    font-weight: 700;
    letter-spacing: -0.3px;
    text-align: center;
    white-space: nowrap;
}

.stat-value.success { color: var(--success); }
.stat-value.warning { color: var(--warning); }
.stat-value.danger  { color: var(--danger); }
.stat-value.primary { color: var(--primary-light); }

/* ============================================================
   STEPS LIST
   ============================================================ */
.splash-steps {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 4px;
    border-radius: 14px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    max-height: 280px;
    overflow-y: auto;
}

.splash-steps::-webkit-scrollbar { width: 4px; }
.splash-steps::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.step-item {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    transition: all 0.3s var(--ease-spring);
    position: relative;
    overflow: hidden;
    background: transparent;
}

.step-item.is-pending {
    opacity: 0.6;
}

.step-item.is-active {
    background: var(--primary-bg);
    border: 1px solid rgba(var(--primary-rgb), 0.2);
    box-shadow: 0 0 0 1px rgba(var(--primary-rgb), 0.1) inset;
    animation: stepActiveGlow 2s ease-in-out infinite;
}

@keyframes stepActiveGlow {
    0%, 100% {
        box-shadow: 0 0 0 1px rgba(var(--primary-rgb), 0.1) inset;
    }
    50% {
        box-shadow:
            0 0 0 1px rgba(var(--primary-rgb), 0.15) inset,
            0 0 12px rgba(var(--primary-rgb), 0.15);
    }
}

.step-item.is-done {
    background: rgba(34, 197, 94, 0.04);
    opacity: 0.85;
}

.step-item.is-error {
    background: var(--danger-bg);
    border: 1px solid rgba(239, 68, 68, 0.3);
    animation: stepShake 0.4s ease;
}

@keyframes stepShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
}

.step-item.is-skipped {
    opacity: 0.5;
    background: rgba(245, 158, 11, 0.04);
}

.step-item.is-warning {
    background: var(--warning-bg);
    border: 1px solid rgba(245, 158, 11, 0.3);
}

/* Icon */
.step-icon {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s var(--ease-spring);
    background: var(--bg-hover);
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono-font);
    font-weight: 700;
    position: relative;
}

.step-icon svg {
    width: 13px;
    height: 13px;
}

.step-item.is-pending .step-icon {
    background: var(--bg-hover);
    color: var(--text-faint);
}

.step-item.is-active .step-icon {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.4);
}

.step-item.is-active .step-icon svg {
    animation: spin 1.2s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.step-item.is-done .step-icon {
    background: var(--success);
    color: white;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
}

.step-item.is-error .step-icon {
    background: var(--danger);
    color: white;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
}

.step-item.is-skipped .step-icon {
    background: var(--warning);
    color: white;
}

.step-item.is-warning .step-icon {
    background: var(--warning);
    color: white;
    animation: pulseWarning 1.5s ease-in-out infinite;
}

@keyframes pulseWarning {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

/* Content */
.step-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
}

.step-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.step-item.is-pending .step-name { color: var(--text-muted); }
.step-item.is-done .step-name { color: var(--text-light); }
.step-item.is-skipped .step-name { color: var(--text-dim); text-decoration: line-through; }

.step-hint {
    font-size: 10.5px;
    color: var(--text-dim);
    font-family: var(--mono-font);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.step-hint .warning-text {
    color: var(--warning);
    font-weight: 700;
    animation: pulseWarning 1.5s ease-in-out infinite;
}

.step-hint .error-text {
    color: var(--danger);
    font-weight: 700;
}

/* Inner Progress Bar (for active step) */
.step-progress {
    height: 4px;
    background: var(--bg-hover-strong);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    margin-top: 2px;
}

.step-progress-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    width: 0%;
    transition: width 0.4s ease;
    position: relative;
    overflow: hidden;
}

.step-progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s linear infinite;
}

/* Indeterminate */
.step-progress.indeterminate .step-progress-fill {
    width: 30% !important;
    animation: indeterminate 1.6s ease-in-out infinite;
}

@keyframes indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
}

/* Right Side Info */
.step-info {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    flex-shrink: 0;
}

.step-time {
    font-size: 10.5px;
    color: var(--text-dim);
    font-family: var(--mono-font);
    font-weight: 700;
    white-space: nowrap;
}

.step-item.is-active .step-time { color: var(--primary-light); }
.step-item.is-done .step-time { color: var(--success); }
.step-item.is-error .step-time { color: var(--danger); }
.step-item.is-skipped .step-time { color: var(--warning); }
.step-item.is-warning .step-time { color: var(--warning); }

.step-action-btn {
    padding: 3px 8px;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-family: var(--ui-font);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.step-action-btn:hover {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    transform: translateY(-1px);
}

.step-action-btn svg {
    width: 10px;
    height: 10px;
}

/* Done Checkmark Animation */
.step-item.is-done .step-icon::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 12px;
    border: 2px solid var(--success);
    opacity: 0;
    animation: checkPop 0.5s ease;
}

@keyframes checkPop {
    0% {
        opacity: 0.8;
        transform: scale(0.7);
    }
    100% {
        opacity: 0;
        transform: scale(1.3);
    }
}

/* ============================================================

   ============================================================ */
.splash-actions {

    justify-content: space-between;
    gap: 8px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
}

.actions-left,
.actions-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s var(--ease-spring);
    white-space: nowrap;
    user-select: none;
    border: 1px solid transparent;
    background: var(--bg-hover);
    border-color: var(--border);
    color: var(--text-light);
}

.action-btn:hover {
    background: var(--bg-hover-strong);
    border-color: var(--border-strong);
    transform: translateY(-1px);
}

.action-btn:active {
    transform: translateY(0);
}

.action-btn svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
}

.action-btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.3);
}

.action-btn.primary:hover {
    background: var(--primary-dark);
    box-shadow: 0 6px 18px rgba(var(--primary-rgb), 0.4);
}

.action-btn.warning {
    background: var(--warning);
    border-color: var(--warning);
    color: white;
}

.action-btn.warning:hover {
    background: var(--warning-dark);
    transform: translateY(-1px);
}

.action-btn.danger {
    background: transparent;
    border-color: rgba(239, 68, 68, 0.3);
    color: var(--danger);
}

.action-btn.danger:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
}

.action-btn.ghost {
    background: transparent;
    border-color: var(--border);
    color: var(--text-muted);
}

.action-btn.ghost:hover {
    background: var(--bg-hover);
    color: var(--text-light);
}

.action-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
}

/* ============================================================
   SUCCESS STATE
   ============================================================ */
.splash-root.success .orbital-logo {
    background: linear-gradient(135deg, var(--success), var(--success-dark));
    animation: successPop 0.6s var(--ease-spring);
}

.splash-root.success .progress-ring__fill {
    stroke: var(--success);
    filter: drop-shadow(0 0 8px var(--success));
}

.splash-root.success .progress-ring__dot {
    fill: var(--success);
    filter: drop-shadow(0 0 10px var(--success));
}

.splash-root.success .orbital-dot {
    background: var(--success);
    box-shadow:
        0 0 12px var(--success),
        0 0 24px rgba(34, 197, 94, 0.6);
}

@keyframes successPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.15); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); }
}

.splash-root.success .splash-title {
    background: linear-gradient(135deg, var(--success), var(--success-dark));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Confetti Burst on Success */
.confetti-burst {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    overflow: hidden;
}

.confetti-piece {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    opacity: 0;
    animation: confettiBurst 1.2s ease-out forwards;
}

@keyframes confettiBurst {
    0% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(0.6);
    }
    100% {
        opacity: 0;
        transform:
            translate(calc(-50% + var(--x, 0px)), calc(-50% + var(--y, 0px)))
            rotate(var(--rot, 720deg))
            scale(1);
    }
}

/* ============================================================
   ERROR MODAL OVERLAY
   ============================================================ */
.splash-error-modal {
    position: fixed;
    inset: 0;
    z-index: 100;

    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    animation: fadeIn 0.25s ease;
}

.splash-error-modal.open {
    display: flex;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.error-card {
    background: var(--bg-card-solid);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 20px;
    padding: 28px 24px;

}

.error-card::before {
    content: '';

    top: -50%;
    left: -50%;

    height: 200%;

    pointer-events: none;
}

.error-icon {

    z-index: 1;
}

.error-icon svg {
    width: 30px;
    height: 30px;
}

@keyframes errorBounce {

    60% { transform: translateY(0) rotate(5deg); }
}

.error-title {
    font-size: 17px;
    font-weight: 700;

    z-index: 1;
}

.error-step-name {

    border-radius: 8px;

    z-index: 1;
}

.error-message {

.error-actions {

    flex-wrap: wrap;
    position: relative;
    z-index: 1;
}

.error-actions .action-btn {

.splash-hint {

    pointer-events: none;
    opacity: 0.8;
}

.splash-hint kbd {
    background: var(--bg-card-solid);
    border: 1px solid var(--border-strong);

    padding: 2px 7px;
    border-radius: 5px;
    font-family: var(--mono-font);
    font-size: 10px;
    font-weight: 700;
    color: var(--text-light);
}

@keyframes hintFade {
    from { opacity: 0; transform: translate(-50%, 12px); }
    to { opacity: 0.8; transform: translate(-50%, 0); }
}

/* ============================================================
   PAUSED STATE
   ============================================================ */
.splash-root.paused .orbital-logo {

}

}

.splash-root.paused .orbital-dot {

}

}

.splash-root.paused .splash-subtitle::before {

@media (prefers-reduced-motion: reduce) {

    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

// ============================================================
// RENDER STEPS
// ============================================================
function renderSteps() {
    const container = $('#splashSteps');
    if (!container) return;

    container.innerHTML = state.steps.map((step, idx) => {
        const isDone = idx < state.currentIndex;
        const isActive = idx === state.currentIndex && state.status === 'running';
        const isError = step.status === 'error';
        const isSkipped = step.status === 'skipped';
        const isWarning = step.status === 'warning';

        let statusClass = 'is-pending';
        if (isError) statusClass = 'is-error';
        else if (isSkipped) statusClass = 'is-skipped';
        else if (isWarning) statusClass = 'is-warning';
        else if (isDone) statusClass = 'is-done';
        else if (isActive) statusClass = 'is-active';

        const icon = isError ? ICONS.error
                    : isSkipped ? ICONS.skipped
                    : isWarning ? ICONS.warning
                    : isDone ? ICONS.check
                    : isActive ? ICONS.spinner
                    : ICONS.pending;

        // Time display
        let timeText = '';
        if (step.actualDuration) {
            timeText = formatMs(step.actualDuration);
        } else if (isActive) {
            timeText = formatMs(Date.now() - state.stepStartTime);
        } else if (isDone || isSkipped) {
            timeText = '✓';
        } else {
            timeText = '~' + formatMs(step.weight);
        }

        // Hint text
        let hintText = '';
        if (isActive) {
            const hintKey = step.hint || 'hintLoading';
            hintText = t(hintKey);
            if (step.currentProgress) {
                hintText += ` — ${step.currentProgress.current}/${step.currentProgress.total}`;
            }
        } else if (isDone) {
            hintText = t('stepDone');
        } else if (isError) {
            hintText = step.errorMessage || t('errorUnknown');
        } else if (isSkipped) {
            hintText = t('stepSkipped');
        } else if (isWarning) {
            hintText = t('stepWarning');
        } else if (idx > state.currentIndex) {
            hintText = t('stepPending');
        }

        // Progress bar (only for active step)
        const showProgress = isActive;
        const progressPercent = step.currentProgress
            ? (step.currentProgress.current / step.currentProgress.total) * 100
            : 0;
        const indeterminate = isActive && !step.currentProgress;

        // Action buttons per step (only for active step)
        let actionBtn = '';
        if (isActive && !step.critical) {
            actionBtn = `<button class="step-action-btn" data-skip-step="${idx}" title="${t('skip')}">
                ${t('skip')}
            </button>`;
        } else if (isError) {
            actionBtn = `<button class="step-action-btn" data-retry-step="${idx}" title="${t('retry')}">
                ${t('retry')}
            </button>`;
        }

        const stepName = step.nameKey ? t(step.nameKey) : (step.name || '—');

        return `
            <div class="step-item ${statusClass}" data-step-idx="${idx}" role="listitem">
                <div class="step-icon">${icon}</div>
                <div class="step-content">
                    <div class="step-name">${escapeHtml(stepName)}</div>
                    <div class="step-hint">${escapeHtml(hintText)}</div>
                    ${showProgress ? `
                        <div class="step-progress ${indeterminate ? 'indeterminate' : ''}">
                            <div class="step-progress-fill" style="width: ${indeterminate ? 0 : progressPercent}%"></div>
                        </div>
                    ` : ''}
                </div>
                <div class="step-info">
                    <div class="step-time">${escapeHtml(timeText)}</div>
                    ${actionBtn}
                </div>
            </div>
        `;
    }).join('');

    // Bind actions
    container.querySelectorAll('[data-skip-step]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.skipStep, 10);
            if (idx === state.currentIndex) {
                skipCurrentStep();
            }
        });
    });

    container.querySelectorAll('[data-retry-step]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.retryStep, 10);
            if (idx === state.currentIndex) {
                retryCurrentStep();
            }
        });
    });
}

// UPDATE PROGRESS RING
// ============================================================
function updateProgressRing(percent) {
    const fill = $('#progressRingFill');
    const dot = $('#progressRingDot');

    if (!fill) return;

    const circumference = 402; // 2π * 64
    const offset = circumference - (percent / 100) * circumference;

    fill.style.strokeDashoffset = offset;

    // Update dot position
    if (dot) {
        const angle = (percent / 100) * 360 - 90; // Start from top
        const rad = (angle * Math.PI) / 180;
        const cx = 70 + 64 * Math.cos(rad);
        const cy = 70 + 64 * Math.sin(rad);
        dot.setAttribute('cx', cx);
        dot.setAttribute('cy', cy);
    }
}

// ============================================================
// UPDATE STATS BAR
// ============================================================
function updateStats() {
    const statTime = $('#statTime');
    const statProgress = $('#statProgress');
    const statStep = $('#statStep');

    // Progress percent
    const percent = calculateProgress();

    // Estimated time remaining
    const remaining = estimateRemainingTime();

    // Step counter
    const stepText = `${toPersian(Math.min(state.currentIndex + 1, state.steps.length))} ${t('stepOf')} ${toPersian(state.steps.length)}`;

    if (statTime) {
        statTime.textContent = remaining > 0 ? formatSeconds(remaining) : t('completing');
    }

    if (statProgress) {
        statProgress.textContent = toPersian(Math.round(percent)) + '٪';
    }

    if (statStep) {
        statStep.textContent = stepText;
    }

    updateProgressRing(percent);
}

// ============================================================
// CALCULATE PROGRESS
// ============================================================
function calculateProgress() {
    if (state.steps.length === 0) return 0;

    let completedWeight = 0;
    state.steps.forEach((step, idx) => {
        if (idx < state.currentIndex) {
            // Fully completed/skipped/errored
            completedWeight += step.weight;
        } else if (idx === state.currentIndex && state.status === 'running') {
            // Partial weight based on current step progress
            if (step.currentProgress) {
                const pct = step.currentProgress.current / step.currentProgress.total;
                completedWeight += step.weight * pct;
            } else {
                // Estimate by time (max 90% of the step)
                const elapsed = Date.now() - state.stepStartTime;
                const pct = Math.min(elapsed / step.weight, 0.9);
                completedWeight += step.weight * pct;
            }
        }
    });

    return Math.min((completedWeight / state.totalEstimatedWeight) * 100, 100);
}

// ============================================================
// ESTIMATE REMAINING TIME
// ============================================================
function estimateRemainingTime() {
    if (state.status !== 'running') return 0;

    let remainingMs = 0;

    state.steps.forEach((step, idx) => {
        if (idx < state.currentIndex) return; // Done

        if (idx === state.currentIndex && state.status === 'running') {
            // Current step — estimate based on progress
            if (step.currentProgress) {
                const elapsed = Date.now() - state.stepStartTime;
                const pct = step.currentProgress.current / step.currentProgress.total;
                if (pct > 0) {
                    const totalEstimate = elapsed / pct;
                    remainingMs += Math.max(0, totalEstimate - elapsed);
                } else {
                    remainingMs += step.weight;
                }
            } else {
                const elapsed = Date.now() - state.stepStartTime;
                remainingMs += Math.max(0, step.weight - elapsed);
            }
        } else {
            // Future steps — use weight
            remainingMs += step.weight;
        }
    });

    return remainingMs / 1000;
}

// ============================================================
// RUN SINGLE STEP
// ============================================================
async function runStep(idx) {
    const step = state.steps[idx];
    if (!step) return;

    state.stepStartTime = Date.now();
    step.status = 'active';
    step.currentProgress = null;
    state.status = 'running';
    renderSteps();
    updateStats();

    // Update subtitle
    const subtitle = $('#splashSubtitle');
    if (subtitle) subtitle.textContent = t('subtitle');

    // Progress callback for step
    const progressCallback = (current, total) => {
        step.currentProgress = { current, total };
        renderSteps();
        updateStats();
    };

    try {
        // Execute with timeout protection
        const timeoutMs = (step.weight || 1000) * 6; // max 6x weight
        const result = await Promise.race([
            step.check(progressCallback),
            new Promise((_, reject) =>
                setTimeout(() => reject(new Error(t('errorTimeout'))), timeoutMs)
            ),
        ]);

        step.actualDuration = Date.now() - state.stepStartTime;
        step.status = 'done';

        if (state.skipAllFlag && !step.critical) {
            // If skipAll was active, keep going
        }

        renderSteps();
        updateStats();

        // Small pause for UX (visible transition)
        await new Promise(r => setTimeout(r, 120));

        return { success: true, result };
    } catch (err) {
        step.actualDuration = Date.now() - state.stepStartTime;
        step.status = 'error';
        step.errorMessage = err.message || t('errorUnknown');

        renderSteps();
        updateStats();

        return { success: false, error: err, step };
    }
}

// ============================================================
// SLOW STEP DETECTION
// ============================================================
function checkStepSpeed() {
    if (state.status !== 'running') return;
    if (state.currentIndex >= state.steps.length) return;

    const step = state.steps[state.currentIndex];
    if (!step || step.status !== 'active') return;

    const elapsed = Date.now() - state.stepStartTime;
    const threshold = step.weight * state.slowThreshold;

    if (elapsed > threshold && step.status !== 'warning') {
        step.status = 'warning';
        renderSteps();
    }
}

// ============================================================
// SKIP CURRENT STEP
// ============================================================
function skipCurrentStep() {
    if (state.status !== 'running') return;
    if (state.currentIndex >= state.steps.length) return;

    const step = state.steps[state.currentIndex];
    if (step.critical) {
        // Can't skip critical
        return;
    }

    step.status = 'skipped';
    step.actualDuration = Date.now() - state.stepStartTime;
    step.skipped = true;

    renderSteps();
    updateStats();

    // Force move to next step
    state.currentIndex++;
    setTimeout(() => {
        if (state.status === 'running' || state.status === 'paused') {
            runLoop();
        }
    }, 200);
}

// ============================================================
// RETRY CURRENT STEP
// ============================================================
function retryCurrentStep() {
    if (state.currentIndex >= state.steps.length) return;

    const step = state.steps[state.currentIndex];
    step.status = 'pending';
    step.errorMessage = null;

    state.errorShown = false;
    closeErrorModal();

    renderSteps();
    state.status = 'running';
    runLoop();
}

// ============================================================
// ABORT
// ============================================================
function abortLoading() {
    state.aborted = true;
    state.status = 'aborted';
    stopTimers();

    const root = $('#splashRoot');
    if (root) root.classList.add('exit');

    if (state.onAbort) {
        try { state.onAbort(); } catch (e) { console.error(e); }
    }

    // Fallback redirect
    setTimeout(() => {
        if (window.location.pathname !== '/500') {
            window.location.href = '/500';
        }
    }, 800);
}

// ============================================================
// SHOW ERROR MODAL
// ============================================================
function showErrorModal(step) {
    state.errorShown = true;

    const modal = $('#errorModal');
    const stepName = $('#errorStepName');
    const message = $('#errorMessage');
    const title = $('#errorTitle');
    const skipAllBtn = $('#btnSkipAll');
    const retryBtn = $('#btnRetry');

    if (title) title.textContent = step.critical ? t('errorCritical') : t('errorTitle');
    if (stepName) stepName.textContent = step.nameKey ? t(step.nameKey) : (step.name || '—');
    if (message) message.textContent = step.errorMessage || t('errorUnknown');

    // Hide skip for critical steps
    if (skipAllBtn) {
        skipAllBtn.style.display = step.critical ? 'none' : 'inline-flex';
    }

    if (modal) modal.classList.add('open');
}

function closeErrorModal() {
    const modal = $('#errorModal');
    if (modal) modal.classList.remove('open');
}

// ============================================================
// MAIN LOOP
// ============================================================
async function runLoop() {
    if (state.aborted) return;

    // All steps done?
    if (state.currentIndex >= state.steps.length) {
        await completeLoading();
        return;
    }

    // If paused, wait
    if (state.status === 'paused') {
        return;
    }

    // Skip-all flag: auto-skip non-critical steps
    if (state.skipAllFlag) {
        const step = state.steps[state.currentIndex];
        if (step && !step.critical) {
            step.status = 'skipped';
            step.skipped = true;
            step.actualDuration = Date.now() - state.stepStartTime;
            renderSteps();
            updateStats();
            state.currentIndex++;
            setTimeout(() => runLoop(), 150);
            return;
        }
    }

    const result = await runStep(state.currentIndex);

    if (state.aborted) return;

    if (result.success) {
        state.currentIndex++;
        updateStats();
        setTimeout(() => runLoop(), 100);
    } else {
        // Error — show modal
        showErrorModal(result.step);
    }
}

// ============================================================
// COMPLETE LOADING
// ============================================================
async function completeLoading() {
    state.status = 'success';
    state.completed = true;
    stopTimers();

    const root = $('#splashRoot');
    const title = $('#splashTitle');
    const subtitle = $('#splashSubtitle');

    if (root) root.classList.add('success');
    if (title) title.textContent = t('allDone');
    if (subtitle) subtitle.textContent = t('completing');

    updateProgressRing(100);
    updateStats();

    // Confetti
    burstConfetti();

    // Wait a moment to show success
    await new Promise(r => setTimeout(r, 1000));

    // Exit animation
    if (root) root.classList.add('exit');

    // Callback
    const totalTime = Date.now() - state.startTime;
    const skipped = state.steps.filter(s => s.status === 'skipped').length;

    if (state.onComplete) {
        try {
            state.onComplete({
                totalTime,
                steps: state.steps.length,
                skipped,
                results: state.steps.map(s => ({
                    id: s.id,
                    name: s.nameKey ? t(s.nameKey) : s.name,
                    status: s.status,
                    duration: s.actualDuration,
                })),
            });
        } catch (e) {
            console.error('onComplete error:', e);
        }
    }

    // Remove from DOM
    setTimeout(() => {
        if (root && root.parentNode) {
            root.style.display = 'none';
        }
    }, 700);
}

// ============================================================
// TIMERS
// ============================================================
function startTimers() {
    stopTimers();

    // Update stats every 100ms (for smooth ring + time)
    state.updateIntervalId = setInterval(() => {
        if (state.status === 'running') {
            updateStats();
            checkStepSpeed();
        }
    }, 100);

    // Re-render steps every 500ms (for active step time update)
    state.intervalId = setInterval(() => {
        if (state.status === 'running') {
            // Only update the active step's time display
            const activeEl = $('.step-item.is-active, .step-item.is-warning');
            if (activeEl) {
                const timeEl = activeEl.querySelector('.step-time');
                if (timeEl) {
                    timeEl.textContent = formatMs(Date.now() - state.stepStartTime);
                }
            }
        }
    }, 500);
}

function stopTimers() {
    if (state.updateIntervalId) {
        clearInterval(state.updateIntervalId);
        state.updateIntervalId = null;
    }
    if (state.intervalId) {
        clearInterval(state.intervalId);
        state.intervalId = null;
    }
}

// ============================================================
// PAUSE / RESUME
// ============================================================
function pauseLoading() {
    if (state.status !== 'running') return;

    state.status = 'paused';

    const root = $('#splashRoot');
    const subtitle = $('#splashSubtitle');
    const btnPause = $('#btnPause');

    if (root) root.classList.add('paused');
    if (subtitle) subtitle.textContent = t('subtitlePaused');

    if (btnPause) {
        btnPause.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span>${t('resume')}</span>
        `;
    }
}

function resumeLoading() {
    if (state.status !== 'paused') return;

    state.status = 'running';
    state.stepStartTime = Date.now() - (state.stepDurations[state.steps[state.currentIndex]?.id] || 0);

    const root = $('#splashRoot');
    const subtitle = $('#splashSubtitle');
    const btnPause = $('#btnPause');

    if (root) root.classList.remove('paused');
    if (subtitle) subtitle.textContent = t('subtitle');

    if (btnPause) {
        btnPause.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="4" width="4" height="16" rx="1"/>
                <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
            <span>${t('pause')}</span>
        `;
    }

    runLoop();
}

// ============================================================
// EVENT BINDINGS
// ============================================================
function bindEvents() {

    // Pause/Resume
    $('#btnPause')?.addEventListener('click', () => {
        if (state.status === 'paused') resumeLoading();
        else pauseLoading();
    });

    // Skip current
    $('#btnSkip')?.addEventListener('click', skipCurrentStep);

    // Abort
    $('#btnAbort')?.addEventListener('click', () => {
        abortLoading();
    });

    // Error modal — Retry
    $('#btnRetry')?.addEventListener('click', () => {
        retryCurrentStep();
    });

    // Error modal — Skip All
    $('#btnSkipAll')?.addEventListener('click', () => {
        state.skipAllFlag = true;
        closeErrorModal();
        state.errorShown = false;

        const step = state.steps[state.currentIndex];
        if (step) {
            step.status = 'skipped';
            step.skipped = true;
            step.actualDuration = Date.now() - state.stepStartTime;
        }
        state.currentIndex++;
        renderSteps();
        updateStats();
        state.status = 'running';
        setTimeout(() => runLoop(), 200);
    });

    // Error modal — Abort
    $('#btnErrorAbort')?.addEventListener('click', () => {
        abortLoading();
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
        if (state.status === 'success' || state.aborted) return;

        // Space → Pause/Resume
        if (e.code === 'Space' && !e.target.matches('input, textarea')) {
            e.preventDefault();
            if (state.status === 'paused') resumeLoading();
            else pauseLoading();
            return;
        }

        // S → Skip
        if (e.key.toLowerCase() === 's' && !e.target.matches('input, textarea')) {
            e.preventDefault();
            skipCurrentStep();
            return;
        }

        // Esc → Abort
        if (e.key === 'Escape') {
            e.preventDefault();
            abortLoading();
        }
    });
}

// ============================================================
// PUBLIC API
// ============================================================
const splashLoader = {

    /**
     * شروع بارگذاری
     * @param {Object} options
     * @param {Array} [options.steps] — آرایه گام‌ها (اگه نباشه، preset استفاده می‌شه)
     * @param {string} [options.lang='fa'] — زبان (fa/en)
     * @param {Function} [options.onComplete] — کال‌بک موفقیت
     * @param {Function} [options.onAbort] — کال‌بک انصراف
     * @param {Function} [options.onError] — کال‌بک خطا
     */
    async start(options = {}) {
        // Reset
        state.aborted = false;
        state.completed = false;
        state.errorShown = false;
        state.skipAllFlag = false;
        state.currentIndex = 0;
        state.startTime = Date.now();
        state.status = 'running';
        state.stepDurations = {};

        // Language
        currentLang = options.lang || document.documentElement.lang || 'fa';
        if (currentLang !== 'fa' && currentLang !== 'en') currentLang = 'fa';

        // Steps
        const rawSteps = options.steps || getPresetSteps();
        state.steps = rawSteps.map(s => ({
            ...s,
            status: 'pending',
            actualDuration: null,
            errorMessage: null,
            currentProgress: null,
        }));

        // Calculate total weight
        state.totalEstimatedWeight = state.steps.reduce((sum, s) => sum + (s.weight || 500), 0);

        // Callbacks
        state.onComplete = options.onComplete || null;
        state.onAbort = options.onAbort || null;
        state.onError = options.onError || null;

        // Reset root
        const root = $('#splashRoot');
        if (root) {
            root.classList.remove('exit', 'success', 'paused');
            root.style.display = '';
        }

        // Apply i18n
        applyI18n();

        // Init particles
        createParticles();

        // Initial render
        renderSteps();
        updateStats();
        updateProgressRing(0);

        // Start timers
        startTimers();

        // Run
        await runLoop();
    },

    /**
     * توقف موقت
     */
    pause() {
        pauseLoading();
    },

    /**
     * ادامه
     */
    resume() {
        resumeLoading();
    },

    /**
     * رد کردن گام فعلی
     */
    skip() {
        skipCurrentStep();
    },

    /**
     * انصراف کامل
     */
    abort() {
        abortLoading();
    },

    /**
     * وضعیت فعلی
     */
    getState() {
        const progress = calculateProgress();
        const remaining = estimateRemainingTime();
        return {
            status: state.status,
            currentStep: state.currentIndex,
            totalSteps: state.steps.length,
            percent: Math.round(progress),
            estimatedRemaining: remaining,
            elapsed: (Date.now() - state.startTime) / 1000,
            skipped: state.steps.filter(s => s.status === 'skipped').length,
            errors: state.steps.filter(s => s.status === 'error').length,
        };
    },

    /**
     * تعیین زبان
     */
    setLang(lang) {
        currentLang = lang;
        applyI18n();
        renderSteps();
    },

    /**
     * مخفی کردن دستی
     */
    hide() {
        const root = $('#splashRoot');
        if (root) root.classList.add('exit');
    },

    /**
     * نمایش دستی
     */
    show() {
        const root = $('#splashRoot');
        if (root) {
            root.classList.remove('exit');
            root.style.display = '';
        }
    },
};

// ============================================================
// EXPOSE
// ============================================================
window.splashLoader = splashLoader;

// Alias for backwards compat
window.splash = splashLoader;

// ============================================================
// AUTO-START — راه‌اندازی خودکار
// ============================================================

/**
 * شروع خودکار بارگذاری وقتی صفحه باز می‌شه
 */
async function autoStart() {
    // بررسی که کاربر لاگین کرده
    let hasAuth = false;

    // بررسی localStorage (فقط به عنوان hint، نه اعتبار)
    try {
        const username = localStorage.getItem('username');
        const sessionId = localStorage.getItem('session_id');
        if (username || sessionId) hasAuth = true;
    } catch (e) { /* ignore */ }

    // اگه هیچ نشونه‌ای از auth نیست، بفرست به login
    // (سرور هم چک می‌کنه — این فقط برای UX بهتره)
    // ولی چون در حالت عادی از login میایم اینجا، پس معمولاً auth داری

    // تعیین زبان از localStorage
    let lang = 'fa';
    try {
        lang = localStorage.getItem('login_lang') || 'fa';
    } catch (e) { /* ignore */ }

    // شروع بارگذاری
    await splashLoader.start({
        lang: lang,

        onComplete: (result) => {
            console.log('✅ Loading complete:', result);

            // ذخیره خلاصه loading در session
            try {
                sessionStorage.setItem('loading_summary', JSON.stringify({
                    totalTime: result.totalTime,
                    steps: result.steps,
                    skipped: result.skipped,
                }));
            } catch (e) { /* ignore */ }

            // ✅ Redirect به داشبورد
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 500);
        },

        onAbort: () => {
            console.log('⛔ Loading aborted by user');
            // کاربر خودش انصراف داد — برگرد به login
            setTimeout(() => {
                window.location.href = '/login';
            }, 300);
        },

        onError: (err) => {
            console.error('❌ Loading error:', err);
            // خطای غیرقابل‌حل — برگرد به login
            // (اگه خطای شبکه باشه، بهتره کاربر دوباره لاگین کنه)
        },
    });
}

// اجرا بعد از DOMContentLoaded
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        bindEvents();      // ← ← ← این خط رو اضافه کن
        autoStart();
    });
} else {
    bindEvents();          // ← ← ← این خط رو اضافه کن
    autoStart();
}

// ============================================================
// LOG
// ============================================================
console.log(
    '%c Splash Loader v6.0 ',
    'background: linear-gradient(135deg, #6366f1, #818cf8); color: white; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 13px;'
);
console.log('%c Transparency-First with Time Estimation ', 'color:#94a3b8;font-size:11px;');
console.log('%c Keyboard: Space (pause) · S (skip) · Esc (abort) ', 'color:#94a3b8;font-size:11px;');

})();
</script>
