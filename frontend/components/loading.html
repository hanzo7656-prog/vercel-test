<!-- ============================================================
     loading.html - Splash Loader با چک واقعی APIها
     نسخه ۳.۰ - با تشخیص خطا و Modal تصمیم‌گیری
     ============================================================ -->

<div class="splash-loader" id="splashLoader">
    <div class="splash-content">
        
        <!-- لوگو -->
        <div class="splash-logo">
            <i class="fas fa-chart-pie"></i>
        </div>
        
        <!-- عنوان -->
        <div class="splash-title">
            <span class="highlight">سیستم تحلیلگر</span>
        </div>
        <div class="splash-subtitle">
            <i class="fas fa-sync-alt fa-fw" style="color:#00d4ff; animation: spin 1.5s linear infinite;"></i>
            در حال بارگذاری...
        </div>
        
        <!-- نوار پیشرفت -->
        <div class="splash-progress-wrapper">
            <div class="splash-progress-bar" id="splashProgressBar"></div>
        </div>
        
        <!-- شمارش -->
        <div class="splash-counter">
            <span id="splashCurrentCount">۰</span>
            <span class="total"> / <span id="splashTotalCount">۰</span></span>
        </div>
        
        <!-- مراحل -->
        <div class="splash-phases" id="splashPhasesContainer">
            <div class="phase-item" id="splashPhase1">
                <span class="phase-icon">🔗</span>
                <span class="phase-name">اتصال به دیتابیس</span>
                <span class="phase-count">⏳ در انتظار</span>
            </div>
            <div class="phase-item" id="splashPhase2">
                <span class="phase-icon">🧠</span>
                <span class="phase-name">بارگذاری مدل</span>
                <span class="phase-count">⏳ در انتظار</span>
            </div>
            <div class="phase-item" id="splashPhase3">
                <span class="phase-icon">🌐</span>
                <span class="phase-name">اتصال به API</span>
                <span class="phase-count">⏳ در انتظار</span>
            </div>
            <div class="phase-item" id="splashPhase4">
                <span class="phase-icon">📊</span>
                <span class="phase-name">دریافت ارزها</span>
                <span class="phase-count">⏳ در انتظار</span>
            </div>
            <div class="phase-item" id="splashPhase5">
                <span class="phase-icon">💰</span>
                <span class="phase-name">دریافت قیمت‌ها</span>
                <span class="phase-count">⏳ در انتظار</span>
            </div>
            <div class="phase-item" id="splashPhase6">
                <span class="phase-icon">🚀</span>
                <span class="phase-name">آماده‌سازی UI</span>
                <span class="phase-count">⏳ در انتظار</span>
            </div>
        </div>
        
        <!-- وضعیت فعلی -->
        <div class="splash-current">
            <i class="fas fa-circle" style="color:#00d4ff;font-size:0.4rem;vertical-align:middle;"></i>
            <span class="current-text">در حال <span class="highlight-text" id="splashCurrentPhaseText">آماده‌سازی</span></span>
        </div>
        
    </div>
</div>

<!-- ============================================================
     MODAL خطا
     ============================================================ -->
<div class="splash-error-modal" id="splashErrorModal">
    <div class="splash-error-card">
        <div class="splash-error-icon">⚠️</div>
        <div class="splash-error-title">خطا در بارگذاری</div>
        <div class="splash-error-phase" id="splashErrorPhase">مرحله: اتصال به دیتابیس</div>
        <div class="splash-error-message" id="splashErrorMessage">خطای نامشخص</div>
        
        <div class="splash-error-actions">
            <button class="splash-btn splash-btn-primary" onclick="window.splashLoader.skipCurrent()">
                ✅ بله، ادامه بده
            </button>
            <button class="splash-btn splash-btn-danger" onclick="window.splashLoader.abort()">
                ❌ خیر، متوقف کن
            </button>
        </div>
    </div>
</div>

<style>
    /* ============================================================
       SPLASH LOADER STYLES
       ============================================================ */

    .splash-loader.hidden {

    .splash-content {

    .splash-current {

    /* ============================================================
       ERROR MODAL STYLES
       ============================================================ */
    
    .splash-error-modal {
        position: fixed;

<script>
// ============================================================
// SPLASH LOADER v3.0 - با چک واقعی APIها
// ============================================================

(function() {
    'use strict';
    
    // ===== تعریف مراحل با API واقعی =====
    const SPLASH_PHASES = [
        {
            id: 'splashPhase1',
            name: 'اتصال به دیتابیس',
            icon: '🔗',
            check: async () => {
                const res = await fetch('/api/health/database', { credentials: 'include' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'دیتابیس پاسخ نداد');
                return true;
            }
        },
        {
            id: 'splashPhase2',
            name: 'بارگذاری مدل',
            icon: '🧠',
            check: async () => {
                const res = await fetch('/api/model/status', { credentials: 'include' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'مدل بارگذاری نشد');
                // مدل ممکنه loaded=false باشه (حالت DEMO) ولی این خطا نیست
                return true;
            }
        },
        {
            id: 'splashPhase3',
            name: 'اتصال به API',
            icon: '🌐',
            check: async () => {
                const res = await fetch('/api/coinstats/all', { credentials: 'include' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'API خارجی پاسخ نداد');
                return true;
            }
        },
        {
            id: 'splashPhase4',
            name: 'دریافت ارزها',
            icon: '📊',
            check: async () => {
                const res = await fetch('/api/coinstats/coins?limit=10', { credentials: 'include' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'لیست ارزها دریافت نشد');
                return true;
            }
        },
        {
            id: 'splashPhase5',
            name: 'دریافت قیمت‌ها',
            icon: '💰',
            check: async () => {
                const res = await fetch('/api/coinstats/prices', { credentials: 'include' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'قیمت‌ها دریافت نشد');
                return true;
            }
        },
        {
            id: 'splashPhase6',
            name: 'آماده‌سازی UI',
            icon: '🚀',
            check: async () => {
                // یه تأخیر کوتاه برای انیمیشن
                await new Promise(r => setTimeout(r, 300));
                return true;
            }
        }
    ];
    
    const TOTAL_PHASES = SPLASH_PHASES.length;
    let currentPhaseIndex = 0;
    let isRunning = false;
    let isPaused = false;
    let onCompleteCallback = null;
    let aborted = false;
    
    // ===== عناصر DOM =====
    const elements = {
        loader: document.getElementById('splashLoader'),
        progressBar: document.getElementById('splashProgressBar'),
        currentCount: document.getElementById('splashCurrentCount'),
        totalCount: document.getElementById('splashTotalCount'),
        currentPhaseText: document.getElementById('splashCurrentPhaseText'),
        errorModal: document.getElementById('splashErrorModal'),
        errorPhase: document.getElementById('splashErrorPhase'),
        errorMessage: document.getElementById('splashErrorMessage')
    };
    
    // ===== بروزرسانی UI =====
    function updatePhaseUI(phaseIndex, status = 'active') {
        SPLASH_PHASES.forEach((phase, idx) => {
            const el = document.getElementById(phase.id);
            if (!el) return;
            const countEl = el.querySelector('.phase-count');
            
            if (idx < phaseIndex) {
                el.className = 'phase-item done';
                if (countEl) countEl.textContent = '✅ انجام شد';
            } else if (idx === phaseIndex) {
                if (status === 'error') {
                    el.className = 'phase-item error';
                    if (countEl) countEl.textContent = '❌ خطا';
                } else if (status === 'skipped') {
                    el.className = 'phase-item skipped';
                    if (countEl) countEl.textContent = '⏭️ رد شد';
                } else {
                    el.className = 'phase-item active';
                    if (countEl) countEl.textContent = '⏳ در حال...';
                }
            } else {
                el.className = 'phase-item';
                if (countEl) countEl.textContent = '⏳ در انتظار';
            }
        });
        
        if (elements.currentPhaseText) {
            if (phaseIndex < SPLASH_PHASES.length) {
                elements.currentPhaseText.textContent = SPLASH_PHASES[phaseIndex].name;
            } else {
                elements.currentPhaseText.textContent = 'تکمیل شد ✅';
            }
        }
    }
    
    function updateProgress() {
        const done = SPLASH_PHASES.filter((_, i) => i < currentPhaseIndex).length;
        const percent = (done / TOTAL_PHASES) * 100;
        
        if (elements.progressBar) {
            elements.progressBar.style.width = percent + '%';
        }
        if (elements.currentCount) {
            elements.currentCount.textContent = done;
        }
        if (elements.totalCount) {
            elements.totalCount.textContent = TOTAL_PHASES;
        }
    }
    
    // ===== نمایش خطا و انتظار برای تصمیم کاربر =====
    function showErrorModal(phaseName, errorMsg) {
        return new Promise((resolve) => {
            elements.errorPhase.textContent = `مرحله: ${phaseName}`;
            elements.errorMessage.textContent = errorMsg;
            elements.errorModal.classList.add('active');
            
            // دخیره کردن callback برای استفاده در skipCurrent/abort
            window._splashErrorResolve = resolve;
        });
    }
    
    // ===== شروع لودینگ =====
    async function startLoading(onComplete) {
        if (isRunning) return;
        
        isRunning = true;
        aborted = false;
        onCompleteCallback = onComplete || null;
        currentPhaseIndex = 0;
        
        // نمایش لودینگ
        if (elements.loader) {
            elements.loader.classList.remove('hidden');
        }
        
        // تنظیم عدد کل
        if (elements.totalCount) {
            elements.totalCount.textContent = TOTAL_PHASES;
        }
        
        updateProgress();
        updatePhaseUI(0, 'active');
        
        // اجرای مراحل
        await runPhases();
    }
    
    // ===== اجرای مراحل =====
    async function runPhases() {
        for (let i = 0; i < SPLASH_PHASES.length; i++) {
            if (aborted) return;
            
            currentPhaseIndex = i;
            const phase = SPLASH_PHASES[i];
            
            // نمایش وضعیت فعال
            updatePhaseUI(i, 'active');
            updateProgress();
            
            // اجرای چک
            let success = false;
            let errorMsg = '';
            
            try {
                console.log(`🔍 [Splash] Checking: ${phase.name}`);
                await phase.check();
                success = true;
                console.log(`✅ [Splash] ${phase.name} - OK`);
            } catch (err) {
                success = false;
                errorMsg = err.message || 'خطای نامشخص';
                console.error(`❌ [Splash] ${phase.name} - Error:`, err);
            }
            
            if (success) {
                // موفق → برو مرحله بعد
                updatePhaseUI(i + 1, 'active');
                updateProgress();
                await new Promise(r => setTimeout(r, 200));
            } else {
                // خطا → نمایش modal
                console.warn(`⚠️ [Splash] Showing error modal for: ${phase.name}`);
                
                // بروزرسانی UI به حالت خطا
                updatePhaseUI(i, 'error');
                
                // نمایش modal و انتظار برای تصمیم کاربر
                const decision = await showErrorModal(phase.name, errorMsg);
                
                if (decision === 'skip') {
                    // کاربر گفت بله → skip کن
                    console.log(`⏭️ [Splash] Skipping: ${phase.name}`);
                    updatePhaseUI(i, 'skipped');
                    await new Promise(r => setTimeout(r, 300));
                    continue;
                } else {
                    // کاربر گفت خیر → متوقف کن
                    console.log(`🛑 [Splash] Aborted by user at: ${phase.name}`);
                    aborted = true;
                    abortAndRedirect();
                    return;
                }
            }
        }
        
        // همه مراحل موفق
        console.log('✅ [Splash] All phases completed');
        if (elements.currentPhaseText) {
            elements.currentPhaseText.textContent = 'تکمیل شد ✅';
        }
        if (elements.progressBar) {
            elements.progressBar.style.width = '100%';
        }
        
        // مخفی کردن لودینگ
        setTimeout(() => {
            if (elements.loader) {
                elements.loader.classList.add('hidden');
            }
            isRunning = false;
            if (onCompleteCallback) {
                onCompleteCallback();
            }
        }, 500);
    }
    
    // ===== Skip مرحله فعلی =====
    function skipCurrent() {
        if (window._splashErrorResolve) {
            elements.errorModal.classList.remove('active');
            const resolve = window._splashErrorResolve;
            window._splashErrorResolve = null;
            resolve('skip');
        }
    }
    
    // ===== Abort کامل =====
    function abort() {
        if (window._splashErrorResolve) {
            elements.errorModal.classList.remove('active');
            const resolve = window._splashErrorResolve;
            window._splashErrorResolve = null;
            resolve('abort');
        }
    }
    
    // ===== توقف و ریدایرکت به صفحه خطا =====
    function abortAndRedirect() {
        // لاگ در کنسول
        console.error('🛑 [Splash] Loading aborted by user. Redirecting to /500');
        
        // اگه error modal باز بود، ببند
        elements.errorModal.classList.remove('active');
        
        // نمایش پیام در لودینگ
        if (elements.currentPhaseText) {
            elements.currentPhaseText.textContent = 'متوقف شد ❌';
        }
        
        // ریدایرکت بعد از 1.5 ثانیه
        setTimeout(() => {
            window.location.href = '/500';
        }, 1500);
    }
    
    // ===== API عمومی =====
    window.loading = {
        start: startLoading,
        hide: function() {
            if (elements.loader) elements.loader.classList.add('hidden');
            isRunning = false;
        },
        show: function() {
            if (elements.loader) elements.loader.classList.remove('hidden');
        },
        skipCurrent: skipCurrent,
        abort: abort,
        getStatus: function() {
            return {
                isRunning: isRunning,
                currentPhase: currentPhaseIndex,
                totalPhases: TOTAL_PHASES,
                phases: SPLASH_PHASES.map(p => p.name)
            };
        }
    };
    
    console.log('✅ SplashLoader v3.0 loaded (with real API checks)');
    
})();
</script>
