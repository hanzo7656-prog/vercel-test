<script>
// ============================================================
// LoadingSystem v5.0 — دو حالت تخصصی
// ============================================================

(function() {
    'use strict';

    class LoadingSystem {
        constructor() {
            // ===== Inline =====
            this.inlineLoader = document.getElementById('inlineLoader');
            this.inlineSpinner = document.getElementById('inlineLoaderSpinner');
            this._inlineContainer = null;
            this._inlineSavedParent = null;
            this._inlineSavedNext = null;

            // ===== Modal =====
            this.modalLoader = document.getElementById('modalLoader');
            this.modalMessageEl = document.getElementById('modalLoaderMessage');
            this.modalSubMessageEl = document.getElementById('modalLoaderSubMessage');
            this.modalProgress = document.getElementById('modalLoaderProgress');
            this.modalProgressWrapper = document.getElementById('modalLoaderProgressWrapper');
            this.modalPercentWrapper = document.getElementById('modalLoaderPercent');
            this.modalPercentValue = document.getElementById('modalLoaderPercentValue');
            this.modalCancelBtn = document.getElementById('modalLoaderCancel');
            this.modalSpinner = document.getElementById('modalLoaderSpinner');

            // State
            this.mode = null;         // 'inline' | 'modal'
            this.isActive = false;
            this.isCompleting = false;
            this.progressTimer = null;
            this._messages = [];
            this._subMessages = [];
            this._currentIndex = 0;
            this._duration = null;
            this._onCompleteCallback = null;
            this._onCancelCallback = null;
        }

        // ========================================================
        // INLINE MODE — داخل container
        // ========================================================

        /**
         * نمایش لودینگ داخل یک container
         * @param {HTMLElement|string} container - عنصر یا سلکتور
         * @param {Object} [options]
         * @param {string} [options.color] - رنگ spinner
         */
        showInline(container, options = {}) {
            const el = typeof container === 'string'
                ? document.querySelector(container)
                : container;

            if (!el) {
                console.warn('⚠️ LoadingSystem: container not found');
                return;
            }

            // cleanup قبلی
            this._cleanupInline();

            // مطمئن شو container relative هست
            const styles = window.getComputedStyle(el);
            if (styles.position === 'static') {
                el.style.position = 'relative';
            }

            // ذخیره parent اصلی
            this._inlineSavedParent = this.inlineLoader.parentNode;
            this._inlineSavedNext = this.inlineLoader.nextSibling;

            // منتقل به container
            el.appendChild(this.inlineLoader);
            this._inlineContainer = el;

            // رنگ
            if (options.color && this.inlineSpinner) {
                this.inlineSpinner.style.setProperty('--color-1', options.color);
            }

            // نمایش
            this.inlineLoader.classList.add('active');
            this.mode = 'inline';
            this.isActive = true;

            console.log('🔄 Inline loader shown in', el.className || el.id);
        }

        hideInline() {
            if (this.mode !== 'inline') return;

            this.inlineLoader.classList.remove('active');
            this._cleanupInline();

            this.mode = null;
            this.isActive = false;

            console.log('✅ Inline loader hidden');
        }

        _cleanupInline() {
            this.inlineLoader.classList.remove('active');

            // برگردون به body
            if (this._inlineSavedParent) {
                try {
                    if (this._inlineSavedNext) {
                        this._inlineSavedParent.insertBefore(this.inlineLoader, this._inlineSavedNext);
                    } else {
                        this._inlineSavedParent.appendChild(this.inlineLoader);
                    }
                } catch (e) {
                    document.body.appendChild(this.inlineLoader);
                }
                this._inlineSavedParent = null;
                this._inlineSavedNext = null;
            }

            this._inlineContainer = null;
        }

        // ========================================================
        // MODAL MODE — کل صفحه
        // ========================================================

        /**
         * نمایش لودینگ modal
         * @param {Object} [options]
         * @param {string[]} [options.messages]
         * @param {string[]} [options.subMessages]
         * @param {number} [options.duration] - auto progress
         * @param {boolean} [options.showProgress=true]
         * @param {boolean} [options.showPercent=false]
         * @param {string} [options.color='#00d4ff']
         * @param {boolean} [options.cancellable=false]
         * @param {Function} [options.onComplete]
         * @param {Function} [options.onCancel]
         */
        showModal(options = {}) {
            const {
                messages = ['در حال انجام...'],
                subMessages = ['لطفاً صبر کنید'],
                duration = null,
                showProgress = true,
                showPercent = false,
                color = '#00d4ff',
                cancellable = false,
                onComplete = null,
                onCancel = null,
            } = options;

            if (this.isActive) return;

            this.isActive = true;
            this.isCompleting = false;
            this.mode = 'modal';
            this._onCompleteCallback = onComplete || null;
            this._onCancelCallback = onCancel || null;

            // messages
            this._messages = Array.isArray(messages) ? messages : [messages];
            this._subMessages = Array.isArray(subMessages) ? subMessages : [subMessages];
            this._currentIndex = 0;
            this._duration = duration;

            // set initial
            this.modalMessageEl.textContent = this._messages[0] || 'در حال انجام...';
            this.modalSubMessageEl.textContent = this._subMessages[0] || 'لطفاً صبر کنید';

            // color
            if (this.modalSpinner) {
                this.modalSpinner.style.setProperty('--color-1', color);
            }

            // progress
            if (this.modalProgressWrapper) {
                this.modalProgressWrapper.style.display = showProgress ? 'block' : 'none';
            }

            if (showProgress && this.modalProgress) {
                this.modalProgress.style.width = '0%';
            }

            // percent
            if (this.modalPercentWrapper) {
                this.modalPercentWrapper.style.display = showPercent ? 'flex' : 'none';
            }

            if (showPercent && this.modalPercentValue) {
                this.modalPercentValue.textContent = '۰';
            }

            // cancel
            if (this.modalCancelBtn) {
                this.modalCancelBtn.style.display = cancellable ? 'inline-flex' : 'none';
                this.modalCancelBtn.onclick = () => this.cancelModal();
            }

            // show
            this.modalLoader.classList.add('active');
            this.modalLoader.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';

            // auto progress
            if (duration) {
                this._startModalProgress(duration);
            }

            console.log('🔄 Modal loader shown:', this._messages[0]);
        }

        hideModal() {
            if (this.mode !== 'modal') return;

            this.modalLoader.classList.remove('active');
            this.modalLoader.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';

            if (this.progressTimer) {
                clearTimeout(this.progressTimer);
                this.progressTimer = null;
            }

            if (this.modalProgress) {
                this.modalProgress.style.width = '0%';
            }

            this.mode = null;
            this.isActive = false;
            this.isCompleting = false;

            console.log('✅ Modal loader hidden');
        }

        completeModal() {
            if (this.mode !== 'modal' || this.isCompleting) return;

            this.isCompleting = true;
            this.modalMessageEl.textContent = '✅ انجام شد';
            this.modalSubMessageEl.textContent = '';

            if (this.modalProgress) {
                this.modalProgress.style.width = '100%';
            }

            if (this.modalPercentValue) {
                this.modalPercentValue.textContent = this._toPersian(100);
            }

            setTimeout(() => {
                this.hideModal();
                if (this._onCompleteCallback) {
                    try { this._onCompleteCallback(); } catch (e) { console.error(e); }
                }
            }, 600);
        }

        cancelModal() {
            if (this.mode !== 'modal') return;

            if (this._onCancelCallback) {
                try { this._onCancelCallback(); } catch (e) { console.error(e); }
            } else {
                this.hideModal();
            }
        }

        // ========================================================
        // Modal progress
        // ========================================================

        _startModalProgress(duration) {
            if (this.progressTimer) {
                clearTimeout(this.progressTimer);
                this.progressTimer = null;
            }

            const startTime = Date.now();

            const update = () => {
                if (this.mode !== 'modal' || this.isCompleting) return;

                const elapsed = Date.now() - startTime;
                const percent = Math.min((elapsed / duration) * 100, 100);

                if (this.modalProgress) {
                    this.modalProgress.style.width = percent + '%';
                }

                if (this.modalPercentValue) {
                    this.modalPercentValue.textContent = this._toPersian(Math.round(percent));
                }

                // rotate messages
                if (this._messages.length > 1) {
                    const ratio = elapsed / duration;
                    const total = this._messages.length;
                    const newIndex = Math.min(Math.floor(ratio * total), total - 1);

                    if (newIndex !== this._currentIndex) {
                        this.modalMessageEl.textContent = this._messages[newIndex] || '';
                        this.modalSubMessageEl.textContent = this._subMessages[newIndex] || '';
                        this._currentIndex = newIndex;
                    }
                }

                if (percent < 100) {
                    this.progressTimer = setTimeout(update, 50);
                }
            };

            update();
        }

        // ========================================================
        // Auto-detect hide (بسته به mode)
        // ========================================================

        hide() {
            if (this.mode === 'inline') this.hideInline();
            else if (this.mode === 'modal') this.hideModal();
        }

        complete() {
            if (this.mode === 'modal') this.completeModal();
            else this.hide();
        }

        // ========================================================
        // Helpers
        // ========================================================

        setMessage(message) {
            if (this.modalMessageEl) this.modalMessageEl.textContent = message;
        }

        setSubMessage(message) {
            if (this.modalSubMessageEl) this.modalSubMessageEl.textContent = message;
        }

        setProgress(percent) {
            const clamped = Math.min(Math.max(percent, 0), 100);
            if (this.modalProgress) {
                this.modalProgress.style.width = clamped + '%';
            }
            if (this.modalPercentValue) {
                this.modalPercentValue.textContent = this._toPersian(Math.round(clamped));
            }
        }

        getStatus() {
            return {
                mode: this.mode,
                isActive: this.isActive,
                isCompleting: this.isCompleting,
            };
        }

        _toPersian(num) {
            return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }
    }

    const loadingSystem = new LoadingSystem();
    window.loadingSystem = loadingSystem;

    // ===== Alias های ساده =====
    window.loading = {
        inline: (container, opts) => loadingSystem.showInline(container, opts),
        hideInline: () => loadingSystem.hideInline(),
        modal: (opts) => loadingSystem.showModal(opts),
        hideModal: () => loadingSystem.hideModal(),
        completeModal: () => loadingSystem.completeModal(),
        hide: () => loadingSystem.hide(),
        complete: () => loadingSystem.complete(),
    };

    console.log('✅ LoadingSystem v5.0 loaded (inline + modal)');
})();
</script>
