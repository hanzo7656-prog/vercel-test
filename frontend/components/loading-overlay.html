<!-- ============================================================
     loading-overlay.html - لودینگ پیشرفته برای پروسه‌های داخلی
     نسخه ۲.۰ - کاملاً مستقل و با نام‌های ثابت
     ============================================================ -->

<style>
    /* ===== OVERLAY ===== */
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 99999;
        display: none;
        justify-content: center;
        align-items: center;
        animation: overlayFadeIn 0.3s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Vazir', system-ui, sans-serif;
        direction: rtl;
    }
    
    .loading-overlay.active {
        display: flex;
    }

    @keyframes overlayFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* ===== CARD ===== */
    .loading-card {
        background: rgba(17, 24, 39, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 40px 48px;
        min-width: 280px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 8px 48px rgba(0, 0, 0, 0.6);
        animation: cardSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
    }

    [data-theme="light"] .loading-card {
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(0, 0, 0, 0.06);
    }

    .loading-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at center, rgba(0, 212, 255, 0.03), transparent 70%);
        pointer-events: none;
        animation: cardGlow 3s ease-in-out infinite;
    }

    @keyframes cardSlideUp {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes cardGlow {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.1) rotate(3deg); }
    }

    /* ===== SPINNER ===== */
    .loading-spinner-wrapper {
        position: relative;
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
    }

    .loading-spinner-wrapper svg {
        width: 100%;
        height: 100%;
        animation: spinnerRotate 1.2s linear infinite;
    }

    @keyframes spinnerRotate {
        to { transform: rotate(360deg); }
    }

    .loading-spinner-wrapper .spinner-circle-bg {
        fill: none;
        stroke-width: 3;
        stroke: rgba(255, 255, 255, 0.06);
    }

    [data-theme="light"] .loading-spinner-wrapper .spinner-circle-bg {
        stroke: rgba(0, 0, 0, 0.06);
    }

    .loading-spinner-wrapper .spinner-circle-fg {
        fill: none;
        stroke-width: 3;
        stroke: #00d4ff;
        stroke-linecap: round;
        stroke-dasharray: 180;
        stroke-dashoffset: 0;
        animation: spinnerDash 1.2s ease-in-out infinite;
    }

    @keyframes spinnerDash {
        0% { stroke-dashoffset: 180; }
        50% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 180; }
    }

    /* ===== THREE DOTS ===== */
    .loading-dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 8px 0 16px;
    }

    .loading-dots .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        opacity: 0.3;
        transition: all 0.3s ease;
    }

    [data-theme="light"] .loading-dots .dot {
        background: rgba(0, 0, 0, 0.2);
    }

    .loading-dots .dot.active {
        opacity: 1;
        background: #00d4ff;
        transform: scale(1.2);
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .loading-dots .dot:nth-child(1).active {
        animation: dotPulse 1.2s ease-in-out infinite 0s;
    }
    .loading-dots .dot:nth-child(2).active {
        animation: dotPulse 1.2s ease-in-out infinite 0.2s;
    }
    .loading-dots .dot:nth-child(3).active {
        animation: dotPulse 1.2s ease-in-out infinite 0.4s;
    }

    @keyframes dotPulse {
        0%, 100% {
            opacity: 0.3;
            transform: scale(1);
        }
        50% {
            opacity: 1;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
    }

    /* ===== MESSAGES ===== */
    .loading-message {
        font-size: 0.95rem;
        font-weight: 500;
        color: #f1f5f9;
        margin-top: 4px;
        min-height: 28px;
        transition: all 0.3s ease;
    }

    [data-theme="light"] .loading-message {
        color: #0f172a;
    }

    .loading-submessage {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-top: 4px;
        min-height: 20px;
        transition: all 0.3s ease;
    }

    [data-theme="light"] .loading-submessage {
        color: #475569;
    }

    /* ===== PROGRESS BAR ===== */
    .loading-progress {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        margin-top: 16px;
        overflow: hidden;
        position: relative;
    }

    [data-theme="light"] .loading-progress {
        background: rgba(0, 0, 0, 0.05);
    }

    .loading-progress .progress-fill {
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, #00d4ff, #8b5cf6);
        width: 0%;
        transition: width 0.5s ease;
    }

    .loading-progress .progress-fill.indeterminate {
        width: 30%;
        animation: progressIndeterminate 1.5s ease-in-out infinite;
    }

    @keyframes progressIndeterminate {
        0% { transform: translateX(0%); width: 30%; }
        50% { width: 60%; }
        100% { transform: translateX(300%); width: 30%; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
        .loading-card {
            padding: 28px 20px;
            min-width: unset;
        }
        .loading-spinner-wrapper {
            width: 56px;
            height: 56px;
        }
        .loading-message {
            font-size: 0.85rem;
        }
        .loading-dots .dot {
            width: 8px;
            height: 8px;
        }
    }
</style>

<!-- ===== LOADING OVERLAY ===== -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
        <!-- Spinner -->
        <div class="loading-spinner-wrapper">
            <svg viewBox="0 0 72 72">
                <circle class="spinner-circle-bg" cx="36" cy="36" r="28"/>
                <circle class="spinner-circle-fg" cx="36" cy="36" r="28"/>
            </svg>
        </div>

        <!-- Three Dots -->
        <div class="loading-dots" id="loadingDots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Messages -->
        <div class="loading-message" id="loadingMessage">در حال انجام...</div>
        <div class="loading-submessage" id="loadingSubMessage">لطفاً صبر کنید</div>

        <!-- Progress Bar -->
        <div class="loading-progress">
            <div class="progress-fill indeterminate" id="loadingProgress"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// LOADING SYSTEM - کلاس مدیریت لودینگ داخلی
// نام کلاس: LoadingSystem (ثابت)
// دسترسی: window.loadingSystem
// ============================================================

class LoadingSystem {
    constructor() {
        this.overlay = document.getElementById('loadingOverlay');
        this.messageEl = document.getElementById('loadingMessage');
        this.subMessageEl = document.getElementById('loadingSubMessage');
        this.dots = document.querySelectorAll('#loadingDots .dot');
        this.progress = document.getElementById('loadingProgress');
        this.isActive = false;
        this.dotsInterval = null;
        this.progressTimer = null;
        this.onCompleteCallback = null;
        this.isCompleting = false;
    }

    // ===== نمایش لودینگ =====
    show(options = {}) {
        const {
            messages = ['در حال انجام...'],
            subMessages = ['لطفاً صبر کنید'],
            duration = null,
            onComplete = null,
            showProgress = true
        } = options;

        if (this.isActive) return;

        this.isActive = true;
        this.isCompleting = false;
        this.onCompleteCallback = onComplete || null;

        // تنظیم پیام‌ها
        const mainMsg = Array.isArray(messages) ? messages[0] : messages;
        const subMsg = Array.isArray(subMessages) ? subMessages[0] : subMessages;

        this.messageEl.textContent = mainMsg || 'در حال انجام...';
        this.subMessageEl.textContent = subMsg || 'لطفاً صبر کنید';

        // مدیریت دات‌ها
        this.startDotsAnimation();

        // مدیریت نوار پیشرفت
        if (showProgress) {
            this.progress.classList.remove('indeterminate');
            this.progress.style.width = '0%';
        } else {
            this.progress.classList.add('indeterminate');
        }

        // نمایش overlay
        this.overlay.classList.add('active');
        document.body.style.overflow = 'hidden';

        // اگر مدت زمان مشخص شده
        if (duration) {
            this.startProgressAnimation(duration);
        }

        // ذخیره پیام‌ها برای استفاده بعدی
        this._messages = Array.isArray(messages) ? messages : [messages];
        this._subMessages = Array.isArray(subMessages) ? subMessages : [subMessages];
        this._currentIndex = 0;
        this._duration = duration;

        console.log('🔄 Loading overlay shown:', mainMsg);
    }

    // ===== بروزرسانی پیام =====
    updateMessage(index) {
        if (!this._messages || index >= this._messages.length) return;

        const mainMsg = this._messages[index] || this._messages[this._messages.length - 1];
        const subMsg = this._subMessages[index] || this._subMessages[index] || '';

        // اگر پیام شامل | باشد، جدا کن
        const parts = mainMsg.split('|');
        this.messageEl.textContent = parts[0] || mainMsg;
        this.subMessageEl.textContent = parts[1] || subMsg || '';

        this._currentIndex = index;
    }

    // ===== بروزرسانی پیشرفت =====
    updateProgress(percent) {
        if (this.progress) {
            this.progress.classList.remove('indeterminate');
            this.progress.style.width = Math.min(Math.max(percent, 0), 100) + '%';
        }
    }

    // ===== شروع انیمیشن دات‌ها =====
    startDotsAnimation() {
        this.stopDotsAnimation();
        let activeIndex = 0;

        this.dots.forEach(d => d.classList.remove('active'));

        this.dotsInterval = setInterval(() => {
            this.dots.forEach(d => d.classList.remove('active'));
            if (this.dots.length > 0) {
                this.dots[activeIndex % this.dots.length].classList.add('active');
                activeIndex = (activeIndex + 1) % this.dots.length;
            }
        }, 400);
    }

    // ===== توقف انیمیشن دات‌ها =====
    stopDotsAnimation() {
        if (this.dotsInterval) {
            clearInterval(this.dotsInterval);
            this.dotsInterval = null;
        }
        this.dots.forEach(d => d.classList.remove('active'));
    }

    // ===== شروع انیمیشن پیشرفت =====
    startProgressAnimation(duration) {
        if (this.progressTimer) {
            clearTimeout(this.progressTimer);
            this.progressTimer = null;
        }

        this.progress.classList.remove('indeterminate');
        const startTime = Date.now();

        const updateProgress = () => {
            if (!this.isActive || this.isCompleting) return;
            
            const elapsed = Date.now() - startTime;
            const percent = Math.min((elapsed / duration) * 100, 100);
            this.progress.style.width = percent + '%';

            // بروزرسانی پیام‌ها بر اساس پیشرفت
            if (this._messages && this._messages.length > 1) {
                const ratio = elapsed / duration;
                const totalMessages = this._messages.length;
                const newIndex = Math.min(Math.floor(ratio * totalMessages), totalMessages - 1);
                if (newIndex !== this._currentIndex) {
                    this.updateMessage(newIndex);
                }
            }

            if (percent < 100) {
                this.progressTimer = setTimeout(updateProgress, 50);
            } else {
                this.progress.style.width = '100%';
            }
        };

        updateProgress();
    }

    // ===== تکمیل لودینگ =====
    complete() {
        if (!this.isActive || this.isCompleting) return;

        this.isCompleting = true;

        // نمایش پیام پایان
        this.messageEl.textContent = '✅ انجام شد';
        this.subMessageEl.textContent = 'عملیات با موفقیت کامل شد';
        this.progress.style.width = '100%';
        this.stopDotsAnimation();

        // مخفی کردن بعد از ۸۰۰ms
        setTimeout(() => {
            this.hide();
            if (this.onCompleteCallback) {
                this.onCompleteCallback();
            }
        }, 800);
    }

    // ===== مخفی کردن لودینگ =====
    hide() {
        if (!this.isActive) return;

        this.isActive = false;
        this.isCompleting = false;
        this.overlay.classList.remove('active');
        document.body.style.overflow = '';
        this.stopDotsAnimation();

        if (this.progressTimer) {
            clearTimeout(this.progressTimer);
            this.progressTimer = null;
        }

        this.progress.classList.add('indeterminate');
        this.progress.style.width = '0%';
        this.dots.forEach(d => d.classList.remove('active'));

        console.log('✅ Loading overlay hidden');
    }

    // ===== متدهای کمکی =====
    setMessage(message) {
        this.messageEl.textContent = message;
    }

    setSubMessage(message) {
        this.subMessageEl.textContent = message;
    }

    setProgress(percent) {
        this.updateProgress(percent);
    }

    // ===== بررسی وضعیت =====
    getStatus() {
        return {
            isActive: this.isActive,
            isCompleting: this.isCompleting,
            currentMessage: this.messageEl?.textContent || '',
            currentSubMessage: this.subMessageEl?.textContent || '',
            progress: this.progress?.style?.width || '0%'
        };
    }
}

// ===== نمونه Singleton با نام ثابت =====
const loadingSystem = new LoadingSystem();

// ===== ذخیره در window با نام ثابت =====
window.loadingSystem = loadingSystem;

console.log('✅ LoadingSystem v2.0 loaded (window.loadingSystem)');
</script>
