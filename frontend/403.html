<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e1a">
    <title>دسترسی ممنوع | سیستم تحلیلگر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/themes.css">

    <!-- Page-specific -->
    <link rel="stylesheet" href="/css/pages/errors.css">
</head>
<body>

    <div class="error-page error-403">

        <div class="error-container">

            <!-- ====================================================
                 SVG Animation — Lock + Chain + Hand
                 ==================================================== -->
            <div class="error-svg-wrapper">
                <svg class="error-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Defs -->
                    <defs>
                        <linearGradient id="lockBody" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#8b5cf6"/>
                            <stop offset="100%" stop-color="#6d28d9"/>
                        </linearGradient>
                        <linearGradient id="lockShackle" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#a78bfa"/>
                            <stop offset="100%" stop-color="#7c3aed"/>
                        </linearGradient>
                        <linearGradient id="chainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#64748b"/>
                            <stop offset="100%" stop-color="#334155"/>
                        </linearGradient>
                        <radialGradient id="keyholeGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
                            <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
                        </radialGradient>
                    </defs>

                    <!-- ============================================
                         Rotating Chain Ring
                         ============================================ -->
                    <g style="transform-origin: 100px 100px; animation: chainSpin 12s linear infinite;">
                        <!-- Chain links around the lock -->
                        <circle cx="100" cy="35" r="5" fill="none" stroke="url(#chainGradient)" stroke-width="3"/>
                        <circle cx="145" cy="55" r="5" fill="none" stroke="url(#chainGradient)" stroke-width="3"/>
                        <circle cx="165" cy="100" r="5" fill="none" stroke="url(#chainGradient)" stroke-width="3"/>
                        <circle cx="145" cy="145" r="5" fill="none" stroke="url(#chainGradient)" stroke-width="3"/>
                        <circle cx="100" cy="165" r="5" fill="none" stroke="url(#chainGradient)" stroke-width="3"/>
                        <circle cx="55" cy="145" r="5" fill="none" stroke="url(#chainGradient)" stroke-width="3"/>
                        <circle cx="35" cy="100" r="5" fill="none" stroke="url(#chainGradient)" stroke-width="3"/>
                        <circle cx="55" cy="55" r="5" fill="none" stroke="url(#chainGradient)" stroke-width="3"/>
                    </g>

                    <!-- ============================================
                         Lock Group (shakes)
                         ============================================ -->
                    <g style="transform-origin: 100px 100px; animation: lockShake 2.5s ease-in-out infinite;">

                        <!-- Shackle (U-shape top) -->
                        <path
                            d="M 75 95 L 75 70 Q 75 45 100 45 Q 125 45 125 70 L 125 95"
                            fill="none"
                            stroke="url(#lockShackle)"
                            stroke-width="10"
                            stroke-linecap="round"/>

                        <!-- Lock body -->
                        <rect
                            x="65" y="90" width="70" height="65" rx="10"
                            fill="url(#lockBody)"
                            stroke="#4c1d95"
                            stroke-width="2"/>

                        <!-- Inner highlight -->
                        <rect
                            x="70" y="95" width="60" height="55" rx="7"
                            fill="none"
                            stroke="rgba(255,255,255,0.15)"
                            stroke-width="1"/>

                        <!-- Keyhole glow -->
                        <circle cx="100" cy="115" r="18" fill="url(#keyholeGlow)" style="animation: pulseGlow 2s ease-in-out infinite;"/>

                        <!-- Keyhole circle -->
                        <circle cx="100" cy="115" r="8" fill="#1e1b4b"/>

                        <!-- Keyhole bottom (slot) -->
                        <path
                            d="M 100 123 L 96 138 L 104 138 Z"
                            fill="#1e1b4b"/>

                        <!-- Keyhole shine -->
                        <circle cx="98" cy="113" r="2" fill="rgba(255,255,255,0.4)"/>
                    </g>

                    <!-- ============================================
                         Hand (tries to open the lock)
                         ============================================ -->
                    <g style="animation: float 3s ease-in-out infinite;">
                        <!-- Forearm -->
                        <rect x="155" y="130" width="35" height="16" rx="8" fill="#fbbf24" opacity="0.8"/>
                        <!-- Fist -->
                        <circle cx="155" cy="138" r="12" fill="#f59e0b"/>
                        <!-- Fingers -->
                        <circle cx="148" cy="130" r="4" fill="#f59e0b"/>
                        <circle cx="148" cy="146" r="4" fill="#f59e0b"/>
                        <circle cx="155" cy="152" r="4" fill="#f59e0b"/>
                    </g>

                    <!-- ============================================
                         Small warning stars
                         ============================================ -->
                    <g style="animation: starTwinkle 2s ease-in-out infinite;">
                        <path d="M 40 40 L 42 47 L 50 49 L 42 51 L 40 58 L 38 51 L 30 49 L 38 47 Z" fill="#fbbf24" opacity="0.7"/>
                    </g>
                    <g style="animation: starTwinkle 2.5s ease-in-out infinite 0.5s;">
                        <path d="M 165 160 L 167 165 L 172 167 L 167 169 L 165 174 L 163 169 L 158 167 L 163 165 Z" fill="#c4b5fd" opacity="0.7"/>
                    </g>

                </svg>
            </div>

            <!-- ====================================================
                 Error Code
                 ==================================================== -->
            <div class="error-code">403</div>

            <!-- ====================================================
                 Title & Description
                 ==================================================== -->
            <h1 class="error-title">
                <i class="fas fa-lock"></i>
                دسترسی ممنوع
            </h1>

            <p class="error-description">
                شما اجازه دسترسی به این بخش را ندارید.
                این منطقه فقط برای کاربران دارای دسترسی خاص باز است.
                اگر فکر می‌کنید اشتباهی رخ داده، با مدیر سیستم تماس بگیرید.
            </p>

            <!-- ====================================================
                 Actions
                 ==================================================== -->
            <div class="error-actions">
                <a href="/dashboard" class="btn btn-primary">
                    <i class="fas fa-home"></i>
                    <span>بازگشت به داشبورد</span>
                </a>
                <button class="btn btn-outline" onclick="history.back()">
                    <i class="fas fa-arrow-right"></i>
                    <span>بازگشت</span>
                </button>
            </div>

            <!-- ====================================================
                 Meta
                 ==================================================== -->
            <div class="error-meta">
                <span class="error-meta-item">
                    <i class="fas fa-clock"></i>
                    <span id="errorTime">—</span>
                </span>
                <span class="error-meta-item">
                    <i class="fas fa-hashtag"></i>
                    <span id="errorId">—</span>
                </span>
            </div>

        </div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaliday@1/dist/index.min.js"></script>

    <script>
    (function() {
        'use strict';

        // ساعت خطا
        const timeEl = document.getElementById('errorTime');
        if (timeEl) {
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString('fa-IR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
            });
        }

        // کد رهگیری
        const idEl = document.getElementById('errorId');
        if (idEl) {
            const id = Math.random().toString(36).substring(2, 10).toUpperCase();
            idEl.textContent = id;
        }

        console.log('🔒 Error 403 page loaded');
    })();
    </script>

</body>
</html>
