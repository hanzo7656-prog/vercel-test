<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    
    <!-- اسکریپت‌های اصلی (مشابه سایر صفحات) -->
    <script src="/frontend/js/utils.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/app.js"></script>
    
    <style>
        /* استایل‌های ساده برای تست */
        .test-box {
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    
    <!-- ===== نویگیشن ===== -->
    <div id="navContainer"></div>
    <script>
        // بارگذاری ساده نویگیشن
        fetch('/frontend/nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navContainer').innerHTML = html;
            })
            .catch(err => console.error('nav error:', err));
    </script>
    
    <!-- ===== محتوای داشبورد ===== -->
    <div class="container">
        <div class="test-box">
            <h2>📊 تست داشبورد</h2>
            <p id="testStatus">در حال بارگذاری...</p>
            <button onclick="testAPI()" class="btn btn-primary">تست API</button>
        </div>
    </div>
    
    <script>
        // تست ساده API
        async function testAPI() {
            try {
                const result = await api.getHealth();
                document.getElementById('testStatus').textContent = '✅ API وصل است: ' + JSON.stringify(result);
            } catch (e) {
                document.getElementById('testStatus').textContent = '❌ API خطا: ' + e.message;
            }
        }
        
        // تست خودکار
        setTimeout(testAPI, 1000);
    </script>
</body>
</html>
