<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>داشبورد</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .welcome-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.05), rgba(139, 92, 246, 0.05));
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .welcome-card:hover { border-color: rgba(0, 212, 255, 0.15); }
        .welcome-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.03), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .welcome-card .welcome-content { position: relative; z-index: 1; }
        .welcome-card .greeting { font-size: 1.4rem; font-weight: 700; }
        .welcome-card .greeting .highlight { color: var(--accent-cyan); }
        .welcome-card .sub-greeting { color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
        .welcome-card .quick-stats { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
        .welcome-card .quick-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-input);
            padding: 4px 14px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
        }
        .welcome-card .quick-stat .num { color: var(--text-primary); font-weight: 600; font-family: var(--font-mono); }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .market-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: var(--transition);
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .market-card:hover { border-color: var(--border-hover); transform: translateY(-3px); box-shadow: var(--shadow); }
        .market-card .market-icon { font-size: 1.4rem; margin-bottom: 2px; }
        .market-card .market-name { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .market-card .market-price { font-size: 1.1rem; font-weight: 700; font-family: var(--font-mono); margin: 2px 0; }
        .market-card .market-change { font-size: 0.7rem; font-weight: 500; }
        .market-card .market-change.up { color: var(--accent-green); }
        .market-card .market-change.down { color: var(--accent-red); }
        .market-card .market-change.neutral { color: var(--text-muted); }
        .market-card .market-change.up::before { content: '▲ '; }
        .market-card .market-change.down::before { content: '▼ '; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .dashboard-grid .full-width { grid-column: 1 / -1; }
        .dashboard-grid .half-width { grid-column: span 2; }

        .chart-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: var(--transition);
        }
        .chart-card:hover { border-color: var(--border-hover); }
        .chart-card .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .chart-card .chart-title { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
        .chart-card .chart-title i { color: var(--accent-cyan); }
        .chart-card .chart-badge {
            font-size: 0.55rem;
            padding: 2px 12px;
            border-radius: var(--radius-full);
            background: rgba(34, 211, 238, 0.08);
            color: var(--accent-green);
            border: 1px solid rgba(34, 211, 238, 0.12);
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .chart-card .chart-wrapper { height: 200px; position: relative; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            transition: var(--transition);
            text-align: center;
        }
        .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
        .stat-card .stat-icon { font-size: 1.2rem; display: block; margin-bottom: 4px; }
        .stat-card .stat-value { font-size: 1.1rem; font-weight: 700; font-family: var(--font-mono); }
        .stat-card .stat-value.cyan { color: var(--accent-cyan); }
        .stat-card .stat-value.green { color: var(--accent-green); }
        .stat-card .stat-value.orange { color: var(--accent-orange); }
        .stat-card .stat-value.red { color: var(--accent-red); }
        .stat-card .stat-label { font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

        .ram-bar-container {
            width: 100%;
            height: 8px;
            background: var(--bg-input);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-top: 6px;
        }
        .ram-bar {
            height: 100%;
            border-radius: var(--radius-full);
            transition: width 0.5s ease, background 0.5s ease;
            width: 0%;
        }
        .ram-bar-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .activity-list { display: flex; flex-direction: column; gap: 4px; }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-hover);
            transition: var(--transition);
        }
        .activity-item:hover { background: var(--bg-input); }
        .activity-item .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .activity-item .activity-icon.cyan { background: rgba(0, 212, 255, 0.1); color: var(--accent-cyan); }
        .activity-item .activity-icon.green { background: rgba(34, 211, 238, 0.1); color: var(--accent-green); }
        .activity-item .activity-icon.purple { background: rgba(139, 92, 246, 0.1); color: var(--accent-purple); }
        .activity-item .activity-icon.orange { background: rgba(245, 158, 11, 0.1); color: var(--accent-orange); }
        .activity-item .activity-icon.red { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
        .activity-item .activity-content { flex: 1; min-width: 0; }
        .activity-item .activity-text { font-size: 0.8rem; color: var(--text-primary); }
        .activity-item .activity-text .highlight { color: var(--accent-cyan); font-weight: 500; }
        .activity-item .activity-time { font-size: 0.6rem; color: var(--text-muted); font-family: var(--font-mono); flex-shrink: 0; }

        .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .quick-actions .btn { padding: 6px 16px; border-radius: var(--radius-sm); font-size: 0.75rem; }

        @media (max-width: 1200px) { .market-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr 1fr; }
            .dashboard-grid .half-width { grid-column: span 1; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .market-grid { grid-template-columns: 1fr 1fr; }
            .welcome-card { padding: 18px 20px; }
            .welcome-card .greeting { font-size: 1.1rem; }
            .welcome-card .quick-stats { gap: 12px; }
            .welcome-card .quick-stat { font-size: 0.7rem; }
            .chart-card .chart-wrapper { height: 160px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
        }
        @media (max-width: 480px) {
            .market-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .market-card { padding: 12px 14px; }
            .market-card .market-price { font-size: 0.9rem; }
            .activity-item { padding: 6px 10px; flex-wrap: wrap; }
            .activity-item .activity-time { width: 100%; text-align: left; }
            .quick-actions .btn { width: 100%; justify-content: center; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="container">

        <div class="welcome-card">
            <div class="welcome-content">
                <div class="greeting">👋 خوش آمدید، <span class="highlight" id="userName">کاربر</span></div>
                <div class="sub-greeting">
                    <span class="status-dot online" id="statusDot"></span>
                    <span id="statusMessage">سیستم در وضعیت پایدار است</span>
                </div>
                <div class="quick-stats">
                    <div class="quick-stat">🕐 آپتایم: <span class="num" id="uptimeDisplay">—</span></div>
                    <div class="quick-stat">🧠 مدل: <span class="num" id="modelStatus">—</span></div>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <span class="stat-icon">💻</span>
                <div class="stat-value cyan" id="cpuValue">—</div>
                <div class="stat-label">CPU</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🧠</span>
                <div class="stat-value" id="ramValue">—</div>
                <div class="stat-label">RAM</div>
                <div class="ram-bar-container"><div class="ram-bar" id="ramBar" style="width:0%"></div></div>
                <div class="ram-bar-label" id="ramLabel">—</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">⏱️</span>
                <div class="stat-value green" id="uptimeDisplay2">—</div>
                <div class="stat-label">آپتایم اپلیکیشن</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">📊</span>
                <div class="stat-value purple" id="collectionsValue">—</div>
                <div class="stat-label">جمع‌آوری‌ها</div>
            </div>
        </div>

        <!-- Market Cards -->
        <div class="market-grid" id="marketGrid">
            <div class="market-card">
                <div class="market-icon">₿</div>
                <div class="market-name">بیت‌کوین</div>
                <div class="market-price" id="btcPrice">—</div>
                <div class="market-change" id="btcChange">—</div>
            </div>
            <div class="market-card">
                <div class="market-icon">⟠</div>
                <div class="market-name">اتریوم</div>
                <div class="market-price" id="ethPrice">—</div>
                <div class="market-change" id="ethChange">—</div>
            </div>
            <div class="market-card">
                <div class="market-icon">😨</div>
                <div class="market-name">ترس و طمع</div>
                <div class="market-price" id="fearGreedValue">—</div>
                <div class="market-change" id="fearGreedLabel">—</div>
            </div>
            <div class="market-card">
                <div class="market-icon">📊</div>
                <div class="market-name">سلطه BTC</div>
                <div class="market-price" id="btcDominance">—</div>
                <div class="market-change" id="btcDominanceChange">—</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="dashboard-grid">
            <div class="chart-card half-width">
                <div class="chart-header">
                    <div class="chart-title"><i class="fas fa-microchip"></i> منابع سیستم</div>
                    <span class="chart-badge">● LIVE</span>
                </div>
                <div class="chart-wrapper"><canvas id="cpuRamChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title"><i class="fas fa-plug"></i> درخواست‌ها</div>
                    <span class="chart-badge">● LIVE</span>
                </div>
                <div class="chart-wrapper"><canvas id="apiChart"></canvas></div>
            </div>
            <div class="chart-card full-width">
                <div class="chart-header">
                    <div class="chart-title"><i class="fas fa-bolt"></i> فعالیت‌های اخیر</div>
                    <span class="chart-badge" id="activityCount">۰ رویداد</span>
                </div>
                <div class="activity-list" id="activityList">
                    <div class="loading-container"><div class="loading-spinner"></div><p class="loading-text">در حال بارگذاری...</p></div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <a href="/analyzer" class="btn btn-primary"><i class="fas fa-robot"></i> تحلیلگر</a>
            <a href="/model" class="btn btn-outline"><i class="fas fa-brain"></i> مدل</a>
            <a href="/database" class="btn btn-outline"><i class="fas fa-database"></i> دیتابیس</a>
            <a href="/chart" class="btn btn-outline"><i class="fas fa-chart-line"></i> نمودار</a>
            <button class="btn btn-outline" onclick="refreshDashboard()"><i class="fas fa-sync-alt"></i> بروزرسانی</button>
        </div>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // ============================================================
        // DASHBOARD CONTROLLER
        // ============================================================
        
        let statsInterval = null;
        let chartInterval = null;
        let charts = {};
        let chartData = { cpu: [], ram: [], api: [], labels: [] };
        const MAX_DATA = 30;

        class DashboardController {
            constructor() {
                this.init();
            }
            
            async init() {
                console.log('🚀 Dashboard initializing...');
                await this.loadNav();
                this.initCharts();
                await this.loadAllData();
                this.startAutoUpdate();
                console.log('🚀 Dashboard ready');
            }
            
            async loadNav() {
                const container = document.getElementById('navContainer');
                if (!container) return;
                try {
                    const res = await fetch('/nav.html');
                    if (!res.ok) throw new Error('nav.html not found');
                    const html = await res.text();
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        old.parentNode.replaceChild(ns, old);
                    });
                } catch (err) {
                    console.error('❌ Nav error:', err);
                }
            }
            
            initCharts() {
                // CPU/RAM Chart
                const ctx1 = document.getElementById('cpuRamChart')?.getContext('2d');
                if (ctx1) {
                    charts.cpuRam = new Chart(ctx1, {
                        type: 'line',
                        data: {
                            labels: chartData.labels,
                            datasets: [
                                { label: 'CPU', data: chartData.cpu, borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,0.05)', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: true },
                                { label: 'RAM', data: chartData.ram, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.05)', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: true }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'top', labels: { color: 'var(--text-secondary)', font: { size: 9 }, boxWidth: 12, usePointStyle: true } }
                            },
                            scales: {
                                x: { grid: { color: 'var(--border-color)' }, ticks: { color: 'var(--text-muted)', font: { size: 7 } } },
                                y: { beginAtZero: true, max: 100, grid: { color: 'var(--border-color)' }, ticks: { color: 'var(--text-muted)', font: { size: 7 }, callback: v => v + '%' } }
                            },
                            animation: { duration: 400 }
                        }
                    });
                }
                
                // API Chart
                const ctx2 = document.getElementById('apiChart')?.getContext('2d');
                if (ctx2) {
                    charts.api = new Chart(ctx2, {
                        type: 'bar',
                        data: {
                            labels: chartData.labels,
                            datasets: [{ label: 'درخواست‌ها', data: chartData.api, backgroundColor: 'rgba(236,72,153,0.5)', borderColor: '#ec4899', borderWidth: 1.5, borderRadius: 4 }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { color: 'var(--border-color)' }, ticks: { color: 'var(--text-muted)', font: { size: 7 } } },
                                y: { beginAtZero: true, grid: { color: 'var(--border-color)' }, ticks: { color: 'var(--text-muted)', font: { size: 7 } } }
                            },
                            animation: { duration: 400 }
                        }
                    });
                }
            }
            
            updateCharts(metrics) {
                const now = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                const cpu = metrics?.metrics?.cpu?.value || 0;
                const ram = metrics?.metrics?.ram?.percent || 0;
                const apiCount = metrics?.stats?.collections || 0;
                
                chartData.cpu.push(cpu);
                chartData.ram.push(ram);
                chartData.api.push(apiCount);
                chartData.labels.push(now);
                
                if (chartData.cpu.length > MAX_DATA) {
                    chartData.cpu.shift();
                    chartData.ram.shift();
                    chartData.api.shift();
                    chartData.labels.shift();
                }
                
                if (charts.cpuRam) {
                    charts.cpuRam.data.labels = chartData.labels;
                    charts.cpuRam.data.datasets[0].data = chartData.cpu;
                    charts.cpuRam.data.datasets[1].data = chartData.ram;
                    charts.cpuRam.update('none');
                }
                if (charts.api) {
                    charts.api.data.labels = chartData.labels;
                    charts.api.data.datasets[0].data = chartData.api;
                    charts.api.update('none');
                }
            }
            
            async loadAllData() {
                try {
                    await this.loadAppStats();
                    const metrics = await app.loadMetrics();
                    if (metrics) {
                        this.updateUI(metrics);
                        this.updateCharts(metrics);
                    }
                    const user = await app.loadUser();
                    if (user) document.getElementById('userName').textContent = user.username || 'کاربر';
                    await this.loadActivities();
                } catch (err) {
                    console.error('Failed to load data:', err);
                }
            }
            
            async loadAppStats() {
                try {
                    const res = await fetch('/api/app/stats', { credentials: 'include' });
                    const data = await res.json();
                    if (data.success && data.data) {
                        const stats = data.data;
                        
                        // RAM
                        const ramEl = document.getElementById('ramValue');
                        const ramBar = document.getElementById('ramBar');
                        const ramLabel = document.getElementById('ramLabel');
                        if (ramEl) {
                            ramEl.textContent = `${stats.ram.used_mb} MB (${stats.ram.percent}%)`;
                            const pct = stats.ram.percent;
                            ramEl.className = 'stat-value ' + (pct > 80 ? 'red' : pct > 60 ? 'orange' : 'green');
                        }
                        if (ramBar) {
                            const pct = Math.min(stats.ram.percent, 100);
                            ramBar.style.width = `${pct}%`;
                            ramBar.style.background = pct > 80 ? 'var(--accent-red)' : pct > 60 ? 'var(--accent-orange)' : 'var(--accent-green)';
                        }
                        if (ramLabel) {
                            ramLabel.textContent = `${stats.ram.used_mb} MB / ${stats.ram.limit_mb} MB`;
                        }
                        
                        // CPU
                        const cpuEl = document.getElementById('cpuValue');
                        if (cpuEl) {
                            cpuEl.textContent = `${stats.cpu.percent}%`;
                            const pct = stats.cpu.percent;
                            cpuEl.className = 'stat-value ' + (pct > 80 ? 'red' : pct > 60 ? 'orange' : 'cyan');
                        }
                        
                        // Uptime
                        const uptimeEl = document.getElementById('uptimeDisplay');
                        const uptimeEl2 = document.getElementById('uptimeDisplay2');
                        if (uptimeEl) uptimeEl.textContent = stats.uptime.app_formatted;
                        if (uptimeEl2) uptimeEl2.textContent = stats.uptime.app_formatted;
                    }
                } catch (err) {
                    console.error('Failed to load app stats:', err);
                }
            }
            
            updateUI(metrics) {
                const m = metrics?.metrics || {};
                const stats = metrics?.stats || {};
                
                document.getElementById('collectionsValue').textContent = stats.collections || 0;
                
                const modelStatus = m.model_status?.value || {};
                document.getElementById('modelStatus').textContent = modelStatus.loaded ? '✅ فعال' : '📦 دمو';
                
                const btc = m.btc_price || {};
                document.getElementById('btcPrice').textContent = formatCurrency(btc.value);
                const btcChange = document.getElementById('btcChange');
                if (btc.change_24h !== undefined) {
                    btcChange.textContent = formatPercent(btc.change_24h);
                    btcChange.className = 'market-change ' + (btc.change_24h >= 0 ? 'up' : 'down');
                } else { btcChange.textContent = '—'; btcChange.className = 'market-change neutral'; }
                
                const eth = m.eth_price || {};
                document.getElementById('ethPrice').textContent = formatCurrency(eth.value);
                const ethChange = document.getElementById('ethChange');
                if (eth.change_24h !== undefined) {
                    ethChange.textContent = formatPercent(eth.change_24h);
                    ethChange.className = 'market-change ' + (eth.change_24h >= 0 ? 'up' : 'down');
                } else { ethChange.textContent = '—'; ethChange.className = 'market-change neutral'; }
                
                const fg = m.fear_greed || {};
                document.getElementById('fearGreedValue').textContent = fg.value || '—';
                document.getElementById('fearGreedLabel').textContent = fg.classification || '—';
                document.getElementById('fearGreedLabel').className = 'market-change neutral';
                
                const dominance = m.btc_dominance || {};
                document.getElementById('btcDominance').textContent = dominance.value ? dominance.value + '%' : '—';
                
                const apiStatus = m.api_status?.value || 'unknown';
                const dot = document.getElementById('statusDot');
                const msg = document.getElementById('statusMessage');
                dot.className = 'status-dot';
                if (apiStatus === 'ok') {
                    dot.classList.add('online');
                    msg.textContent = 'سیستم در وضعیت پایدار است';
                } else if (apiStatus === 'degraded') {
                    dot.classList.add('warning');
                    msg.textContent = 'سیستم با عملکرد کاهش یافته کار می‌کند';
                } else {
                    dot.classList.add('offline');
                    msg.textContent = 'سیستم با مشکل مواجه است';
                }
            }
            
            async loadActivities() {
                const container = document.getElementById('activityList');
                const countEl = document.getElementById('activityCount');
                try {
                    const alerts = await api.getAlerts({ limit: 5, resolved: false });
                    const history = await api.getModelHistory(3);
                    let activities = [];
                    if (alerts.success && alerts.data) {
                        alerts.data.forEach(a => {
                            activities.push({
                                icon: a.level === 'CRITICAL' ? '🚨' : a.level === 'WARNING' ? '⚠️' : 'ℹ️',
                                iconClass: a.level === 'CRITICAL' ? 'red' : a.level === 'WARNING' ? 'orange' : 'cyan',
                                text: a.message || 'هشدار جدید',
                                time: new Date(a.timestamp),
                                type: 'alert'
                            });
                        });
                    }
                    if (history.success && history.data) {
                        history.data.slice(0, 3).forEach(h => {
                            activities.push({
                                icon: '🧠',
                                iconClass: 'purple',
                                text: `مدل جدید <span class="highlight">${h.version || 'v1'}</span> با دقت ${((h.accuracy || 0) * 100).toFixed(1)}% آموزش دید`,
                                time: new Date(h.training_date),
                                type: 'model'
                            });
                        });
                    }
                    activities.sort((a, b) => b.time - a.time);
                    activities = activities.slice(0, 10);
                    countEl.textContent = `${activities.length} رویداد`;
                    if (activities.length === 0) {
                        container.innerHTML = `<div class="activity-item" style="justify-content:center;color:var(--text-muted);padding:20px;">📭 هیچ فعالیتی ثبت نشده است</div>`;
                        return;
                    }
                    container.innerHTML = activities.map(a => `
                        <div class="activity-item">
                            <div class="activity-icon ${a.iconClass}">${a.icon}</div>
                            <div class="activity-content"><div class="activity-text">${a.text}</div></div>
                            <div class="activity-time">${formatTimeAgo(a.time)}</div>
                        </div>
                    `).join('');
                } catch (err) {
                    console.error('Failed to load activities:', err);
                    container.innerHTML = `<div class="activity-item" style="justify-content:center;color:var(--accent-red);padding:20px;">❌ خطا در دریافت فعالیت‌ها</div>`;
                }
            }
            
            startAutoUpdate() {
                // App stats هر ۳ ثانیه
                statsInterval = setInterval(() => this.loadAppStats(), 3000);
                // Metrics هر ۱۰ ثانیه
                setInterval(() => { app.loadMetrics(); }, 10000);
                // Activities هر ۳۰ ثانیه
                setInterval(() => { this.loadActivities(); }, 30000);
            }
            
            async refresh() {
                showToast('🔄 بروزرسانی...', 'info');
                await this.loadAllData();
                showToast('✅ بروزرسانی شد', 'success');
            }
        }
        
        function refreshDashboard() {
            if (window.dashboard) dashboard.refresh();
            else location.reload();
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            window.dashboard = new DashboardController();
        });
    </script>
</body>
</html>
