<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>داشبورد</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    
    <style>
        /* ============================================================
           استایل‌های اختصاصی داشبورد (با پالت جذاب)
           ============================================================ */
        
        /* ---- متغیرهای رنگی ---- */
        :root {
            --gradient-primary: linear-gradient(135deg, #00d4ff, #7c3aed, #ec4899);
            --gradient-card: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(124, 58, 237, 0.05));
            --glow-cyan: 0 0 30px rgba(0, 212, 255, 0.1);
            --glow-purple: 0 0 30px rgba(124, 58, 237, 0.1);
        }

        /* ---- انیمیشن‌ها ---- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.05); }
            50% { box-shadow: 0 0 40px rgba(0, 212, 255, 0.15); }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(6deg); }
        }

        @keyframes shimmerText {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* ---- دکمه‌های یکدست ---- */
        .btn-uniform {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 22px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            white-space: nowrap;
            min-height: 42px;
            min-width: 110px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.15);
        }
        .btn-uniform:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 35px rgba(0, 212, 255, 0.25);
        }
        .btn-uniform:active {
            transform: scale(0.96);
        }
        .btn-uniform-outline {
            background: transparent;
            border: 1.5px solid rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            box-shadow: none;
        }
        .btn-uniform-outline:hover {
            background: rgba(0, 212, 255, 0.05);
            border-color: #00d4ff;
        }

        /* ---- کارت‌های ریسپانسیو با شیشه‌ای ---- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px 18px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 0;
            overflow: hidden;
            position: relative;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 212, 255, 0.03), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .stat-card:hover::before {
            opacity: 1;
        }
        .stat-card:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: rgba(0, 212, 255, 0.15);
            box-shadow: var(--glow-cyan);
        }

        .stat-card .stat-icon {
            font-size: 1.6rem;
            margin-bottom: 4px;
            display: block;
            animation: floatIcon 4s ease-in-out infinite;
        }
        .stat-card .stat-label {
            font-size: 0.6rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }
        .stat-card .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            margin: 4px 0 2px;
            background: linear-gradient(135deg, #f1f5f9, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .stat-value.cyan { background: linear-gradient(135deg, #00d4ff, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .stat-value.green { background: linear-gradient(135deg, #22d3ee, #84cc16); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .stat-value.purple { background: linear-gradient(135deg, #8b5cf6, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .stat-value.pink { background: linear-gradient(135deg, #ec4899, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .stat-value.orange { background: linear-gradient(135deg, #f59e0b, #fb923c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .stat-card .stat-change {
            font-size: 0.65rem;
            font-weight: 500;
        }
        .stat-card .stat-change.up { color: #22d3ee; }
        .stat-card .stat-change.down { color: #ef4444; }
        .stat-card .stat-change.neutral { color: #94a3b8; }
        .stat-card .stat-change.up::before { content: '▲ '; }
        .stat-card .stat-change.down::before { content: '▼ '; }

        /* ---- نمودارها ---- */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.8s ease;
        }
        .chart-box {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-width: 0;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        .chart-box:hover {
            border-color: rgba(0, 212, 255, 0.08);
            box-shadow: var(--glow-cyan);
        }

        /* ---- هدر خوش‌آمدگویی ---- */
        .welcome-header {
            background: var(--gradient-card);
            border: 1px solid rgba(0, 212, 255, 0.06);
            border-radius: 20px;
            padding: 24px 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: slideUp 0.4s ease;
            transition: all 0.4s ease;
        }
        .welcome-header:hover {
            border-color: rgba(0, 212, 255, 0.12);
            box-shadow: var(--glow-cyan);
        }
        .welcome-header .greeting {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f1f5f9, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-header .greeting .highlight {
            background: linear-gradient(135deg, #00d4ff, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .welcome-header .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22d3ee;
            animation: pulse-dot 2s infinite;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        .welcome-header .quick-stats {
            display: flex;
            gap: 18px;
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .welcome-header .quick-stats .num {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* ---- فعالیت‌ها ---- */
        .activity-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 4px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .activity-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 212, 255, 0.05);
            transform: translateX(-4px);
        }
        .activity-item .a-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .activity-item:hover .a-icon {
            transform: scale(1.1);
        }
        .activity-item .a-icon.buy { background: rgba(34, 211, 238, 0.12); color: #22d3ee; }
        .activity-item .a-icon.sell { background: rgba(239, 68, 68, 0.12); color: #ef4444; }
        .activity-item .a-icon.neutral { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
        .activity-item .a-icon.model { background: rgba(139, 92, 246, 0.12); color: #8b5cf6; }
        .activity-item .a-text { flex: 1; font-size: 0.8rem; color: #f1f5f9; }
        .activity-item .a-text .highlight { color: #00d4ff; font-weight: 500; }
        .activity-item .a-time {
            font-size: 0.6rem;
            color: #64748b;
            font-family: 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 10px;
            border-radius: 20px;
        }
        
        .activity-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 18px 22px;
            animation: slideUp 1s ease;
            transition: all 0.4s ease;
        }
        .activity-card:hover {
            border-color: rgba(0, 212, 255, 0.06);
        }
        .activity-card .activity-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .activity-card .activity-title i {
            color: #f59e0b;
        }
        
        .chart-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 20px;
            animation: slideUp 0.6s ease;
            transition: all 0.4s ease;
        }
        .chart-card:hover {
            border-color: rgba(0, 212, 255, 0.06);
        }
        .chart-card .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .chart-card .chart-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-card .chart-title i { color: #00d4ff; }
        .chart-card .chart-badge {
            font-size: 0.5rem;
            padding: 3px 12px;
            background: rgba(34, 211, 238, 0.1);
            color: #22d3ee;
            border-radius: 20px;
            border: 1px solid rgba(34, 211, 238, 0.1);
            animation: pulseGlow 2s infinite;
        }
        .chart-card .chart-wrapper { height: 220px; position: relative; }
        .chart-card .chart-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .chart-card .chart-stats .num {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* ---- ریسپانسیو ---- */
        @media (max-width: 1024px) {
            .chart-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .btn-uniform { width: 100%; justify-content: center; min-width: unset; }
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .chart-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 12px 14px; }
            .stat-card .stat-value { font-size: 1rem; }
            .welcome-header { flex-direction: column; align-items: stretch; padding: 16px 18px; }
            .welcome-header .quick-stats { flex-wrap: wrap; }
            .chart-card .chart-wrapper { height: 160px; }
            .activity-item { flex-wrap: wrap; }
            .activity-item .a-time { width: 100%; text-align: left; }
        }
        @media (max-width: 480px) {
            .dashboard-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card .stat-value { font-size: 0.85rem; }
            .stat-card .stat-icon { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    کانتینر اسپینر لودینگ (بارگذاری پویا)
    ============================================================ -->
    <div id="loadingContainer"></div>

    <!-- ============================================================
    محتوای اصلی داشبورد
    ============================================================ -->
    <div class="container dashboard-content" id="dashboardContent" style="display:none;">

        <!-- ===== هدر خوش‌آمدگویی ===== -->
        <div class="welcome-header">
            <div>
                <div class="greeting">👋 خوش آمدید، <span class="highlight" id="userName">کاربر</span></div>
                <div class="status">
                    <span class="dot"></span>
                    <span id="statusMessage">سیستم در وضعیت پایدار است</span>
                </div>
            </div>
            <div class="quick-stats">
                <span>🧠 مدل: <span class="num" id="modelStatus">✅ فعال</span></span>
                <span>📊 جمع‌آوری‌ها: <span class="num" id="collectionsDisplay">۰</span></span>
            </div>
        </div>

        <!-- ===== کارت‌های آماری ===== -->
        <div class="dashboard-grid" id="statsGrid">
            <div class="stat-card">
                <span class="stat-icon">₿</span>
                <span class="stat-label">ارزش BTC + ETH</span>
                <div class="stat-value cyan" id="statTotalValue">$۰</div>
                <div class="stat-change up" id="statTotalChange">۰%</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">📈</span>
                <span class="stat-label">سیگنال خرید</span>
                <div class="stat-value green" id="statBuySignals">۰</div>
                <div class="stat-change up" id="statBuyChange">۰%</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">📉</span>
                <span class="stat-label">سیگنال فروش</span>
                <div class="stat-value pink" id="statSellSignals">۰</div>
                <div class="stat-change down" id="statSellChange">۰%</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🎯</span>
                <span class="stat-label">دقت مدل</span>
                <div class="stat-value purple" id="statAccuracy">۰%</div>
                <div class="stat-change up" id="statAccuracyChange">۰%</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">⚡</span>
                <span class="stat-label">اعتبار API</span>
                <div class="stat-value orange" id="statCredits">۰</div>
                <div class="stat-change neutral" id="statCreditsStatus">⚠️ در حال دریافت</div>
            </div>
        </div>

        <!-- ===== نمودار عملکرد مدل ===== -->
        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-title"><i class="fas fa-chart-line"></i> عملکرد مدل (دقت در ۳۰ روز اخیر)</div>
                <span class="chart-badge">● LIVE</span>
            </div>
            <div class="chart-wrapper">
                <canvas id="performanceChart"></canvas>
            </div>
            <div class="chart-stats">
                <span>📊 دقت فعلی: <span class="num" id="chartCurrentAccuracy">۰%</span></span>
                <span>🏆 بهترین: <span class="num" id="chartBestAccuracy">۰%</span></span>
            </div>
        </div>

        <!-- ===== فعالیت‌های اخیر ===== -->
        <div class="activity-card">
            <div class="activity-title"><i class="fas fa-bolt"></i> فعالیت‌های اخیر</div>
            <div id="activityList">
                <div class="loading-container" style="padding:16px;text-align:center;">
                    <div class="loading-spinner" style="width:24px;height:24px;border:3px solid rgba(255,255,255,0.05);border-top-color:#00d4ff;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;"></div>
                    <p style="color:var(--text-muted);font-size:0.75rem;margin-top:10px;">در حال بارگذاری فعالیت‌ها...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================================
    کانتینر نویگیشن
    ============================================================ -->
    <div id="navContainer"></div>

    <!-- ============================================================
    اسکریپت‌ها
    ============================================================ -->
    <script src="/frontend/js/utils.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/app.js"></script>

    <script>
        // ============================================================
        // ۱. بارگذاری اسپینر لودینگ
        // ============================================================
        function loadLoadingComponent() {
            const container = document.getElementById('loadingContainer');
            if (!container) return;

            fetch('/frontend/components/loading.html')
                .then(res => {
                    if (!res.ok) throw new Error('loading.html not found');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    console.log('✅ Loading component loaded');

                    // شروع لودینگ بعد از بارگذاری
                    setTimeout(() => {
                        if (window.loading) {
                            window.loading.start(function() {
                                console.log('✅ Loading complete!');
                                loadDashboardData();
                            });
                        } else {
                            console.warn('⚠️ loading component not initialized');
                            loadDashboardData();
                        }
                    }, 300);
                })
                .catch(err => {
                    console.error('❌ Loading component error:', err);
                    // اگر اسپینر بارگذاری نشد، مستقیماً داشبورد را نشان بده
                    document.getElementById('dashboardContent').style.display = 'block';
                    loadDashboardData();
                });
        }

        // ============================================================
        // ۲. بارگذاری نویگیشن
        // ============================================================
        function loadNavigation() {
            const container = document.getElementById('navContainer');
            if (!container) return;

            fetch('/frontend/nav.html')
                .then(res => {
                    if (!res.ok) throw new Error('nav.html not found');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const newScript = document.createElement('script');
                        newScript.textContent = old.textContent;
                        old.parentNode.replaceChild(newScript, old);
                    });
                    console.log('✅ Navigation loaded');
                })
                .catch(err => {
                    console.error('❌ Navigation error:', err);
                });
        }

        // ============================================================
        // ۳. بارگذاری داده‌های داشبورد
        // ============================================================
        let chartInstance = null;

        async function loadDashboardData() {
            try {
                const [health, metrics, status, credits, performance, predictions, alerts, prices, user] = await Promise
                    .allSettled([
                        api.getHealth(),
                        api.getMetrics(),
                        api.getModelStatus(),
                        api.getCredits(),
                        api.getModelPerformance(),
                        api.getPredictionHistory(50),
                        api.getAlerts({ limit: 10, resolved: false }),
                        api.getPrices(),
                        api.getUserInfo()
                    ]);

                // بروزرسانی داشبورد
                updateDashboard({
                    health: health.value,
                    metrics: metrics.value,
                    status: status.value,
                    credits: credits.value,
                    performance: performance.value,
                    predictions: predictions.value,
                    alerts: alerts.value,
                    prices: prices.value,
                    user: user.value
                });

                // نمودار
                initChart(performance.value);

                // نمایش داشبورد
                const content = document.getElementById('dashboardContent');
                if (content) content.style.display = 'block';

            } catch (error) {
                console.error('❌ Dashboard data error:', error);
                document.getElementById('dashboardContent').style.display = 'block';
            }
        }

        // ============================================================
        // ۴. بروزرسانی داشبورد
        // ============================================================
        function updateDashboard(data) {
            const status = data.status?.data || {};
            const metrics = data.metrics?.data || {};
            const credits = data.credits?.data || {};
            const predictions = data.predictions?.data || [];
            const prices = data.prices?.data || {};
            const user = data.user?.data || {};

            // کاربر
            if (user.username) {
                const nameEl = document.getElementById('userName');
                if (nameEl) nameEl.textContent = user.username;
            }

            // وضعیت
            const health = data.health || {};
            const statusMsg = document.getElementById('statusMessage');
            if (statusMsg) {
                if (health.status === 'ok') statusMsg.textContent = 'سیستم در وضعیت پایدار است';
                else if (health.status === 'degraded') statusMsg.textContent = 'سیستم با عملکرد کاهش یافته کار می‌کند';
                else statusMsg.textContent = 'سیستم با مشکل مواجه است';
            }

            // مدل
            const modelLoaded = status.loaded || false;
            const modelEl = document.getElementById('modelStatus');
            if (modelEl) {
                modelEl.textContent = modelLoaded ? '✅ فعال' : '📦 دمو';
                modelEl.style.color = modelLoaded ? '#22d3ee' : '#f59e0b';
            }

            // جمع‌آوری‌ها
            const collections = metrics.stats?.collections || 0;
            const colEl = document.getElementById('collectionsDisplay');
            if (colEl) colEl.textContent = collections.toLocaleString();

            // اعتبار
            const remainingCredits = credits.remainingCredits || 0;
            const creditEl = document.getElementById('statCredits');
            const creditStatus = document.getElementById('statCreditsStatus');
            if (creditEl) creditEl.textContent = remainingCredits.toLocaleString();
            if (creditStatus) {
                if (remainingCredits > 100) {
                    creditStatus.textContent = '✅ به اندازه';
                    creditStatus.className = 'stat-change up';
                    creditStatus.style.color = '#22d3ee';
                } else if (remainingCredits > 20) {
                    creditStatus.textContent = '⚠️ کم';
                    creditStatus.className = 'stat-change neutral';
                    creditStatus.style.color = '#f59e0b';
                } else {
                    creditStatus.textContent = '🚨 بحرانی';
                    creditStatus.className = 'stat-change down';
                    creditStatus.style.color = '#ef4444';
                }
            }

            // دقت
            const accuracy = status.last_score || 0;
            const accEl = document.getElementById('statAccuracy');
            if (accEl) {
                accEl.textContent = (accuracy * 100).toFixed(1) + '%';
                accEl.style.color = accuracy > 0.6 ? '#22d3ee' : '#f59e0b';
            }

            // سیگنال‌ها
            const buySignals = predictions.filter(p => p.signal_type === 'BUY').length;
            const sellSignals = predictions.filter(p => p.signal_type === 'SELL').length;
            const buyEl = document.getElementById('statBuySignals');
            const sellEl = document.getElementById('statSellSignals');
            if (buyEl) buyEl.textContent = buySignals;
            if (sellEl) sellEl.textContent = sellSignals;

            // ارزش کل
            const btcPrice = prices?.BTC?.price || 0;
            const ethPrice = prices?.ETH?.price || 0;
            const totalEl = document.getElementById('statTotalValue');
            if (totalEl) totalEl.textContent = '$' + (btcPrice + ethPrice).toLocaleString();

            // فعالیت‌ها
            renderActivities(predictions, data.alerts?.data || []);
        }

        // ============================================================
        // ۵. رندر فعالیت‌ها
        // ============================================================
        function renderActivities(predictions, alerts) {
            const container = document.getElementById('activityList');
            if (!container) return;

            const activities = [];

            predictions.slice(0, 5).forEach(p => {
                const signalMap = { 'BUY': { icon: 'buy', label: 'خرید', emoji: '🟢' },
                    'SELL': { icon: 'sell', label: 'فروش', emoji: '🔴' },
                    'NEUTRAL': { icon: 'neutral', label: 'خنثی', emoji: '🟡' } };
                const s = signalMap[p.signal_type] || signalMap['NEUTRAL'];
                activities.push({
                    icon: s.emoji,
                    iconClass: s.icon,
                    text: `${s.label} <span class="highlight">${p.coin_name || p.coin}</span> (اطمینان ${p.confidence || 50}%)`,
                    time: p.timestamp
                });
            });

            alerts.slice(0, 3).forEach(a => {
                const levelMap = { 'CRITICAL': { icon: '🚨', class: 'sell' }, 'WARNING': { icon: '⚠️',
                        class: 'neutral' }, 'INFO': { icon: 'ℹ️', class: 'buy' } };
                const l = levelMap[a.level] || levelMap['INFO'];
                activities.push({
                    icon: l.icon,
                    iconClass: l.class,
                    text: a.message || 'هشدار جدید',
                    time: a.timestamp
                });
            });

            activities.sort((a, b) => new Date(b.time) - new Date(a.time));
            const top = activities.slice(0, 10);

            if (top.length === 0) {
                container.innerHTML =
                    `<div style="text-align:center;padding:20px;color:#64748b;font-size:0.8rem;">📭 هیچ فعالیتی ثبت نشده است</div>`;
                return;
            }

            container.innerHTML = top.map(a => `
                <div class="activity-item">
                    <div class="a-icon ${a.iconClass}">${a.icon}</div>
                    <div class="a-text">${a.text}</div>
                    <div class="a-time">${formatTimeAgo(a.time)}</div>
                </div>
            `).join('');
        }

        // ============================================================
        // ۶. نمودار
        // ============================================================
        function initChart(performanceData) {
            const ctx = document.getElementById('performanceChart');
            if (!ctx) return;

            if (chartInstance) { chartInstance.destroy();
                chartInstance = null; }

            const labels = performanceData?.labels || [];
            const accuracyData = performanceData?.accuracy || [];

            if (labels.length === 0 || accuracyData.length === 0) {
                const fakeLabels = Array.from({ length: 30 }, (_, i) => (i + 1).toString());
                const fakeData = fakeLabels.map(() => Math.round(50 + Math.random() * 20));
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: fakeLabels,
                        datasets: [{
                            label: 'دقت (%)',
                            data: fakeData,
                            borderColor: '#00d4ff',
                            backgroundColor: 'rgba(0,212,255,0.05)',
                            borderWidth: 2.5,
                            pointRadius: 2,
                            pointBackgroundColor: '#00d4ff',
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(
                                context) { return 'دقت: ' + context.parsed.y + '%'; } } } },
                        scales: {
                            x: { grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false }, ticks: { color: '#94a3b8',
                                    font: { size: 8 }, maxTicksLimit: 10 } },
                            y: { min: 30, max: 100, grid: { color: 'rgba(255,255,255,0.03)',
                                drawBorder: false }, ticks: { color: '#94a3b8', font: { size: 8 },
                                callback: v => v + '%' } }
                        },
                        interaction: { intersect: false, mode: 'index' }
                    }
                });
                return;
            }

            const current = accuracyData[accuracyData.length - 1] || 0;
            const best = Math.max(...accuracyData) || 0;
            document.getElementById('chartCurrentAccuracy').textContent = current.toFixed(1) + '%';
            document.getElementById('chartBestAccuracy').textContent = best.toFixed(1) + '%';

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'دقت (%)',
                        data: accuracyData,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0,212,255,0.05)',
                        borderWidth: 2.5,
                        pointRadius: 2,
                        pointBackgroundColor: '#00d4ff',
                        pointBorderColor: '#0f172a',
                        pointBorderWidth: 1,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) {
                                return 'دقت: ' + context.parsed.y + '%';
                            } } } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false }, ticks: { color: '#94a3b8',
                                font: { size: 8 }, maxTicksLimit: 10 } },
                        y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.03)',
                            drawBorder: false }, ticks: { color: '#94a3b8', font: { size: 8 },
                            callback: v => v + '%' } }
                    },
                    interaction: { intersect: false, mode: 'index' }
                }
            });
        }

        // ============================================================
        // ۷. مقداردهی اولیه
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNavigation();
            loadLoadingComponent();
            console.log('🚀 Dashboard v3.0 loaded');
        });
    </script>

</body>
