<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e1a">
    <title>ورود | سیستم تحلیلگر</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <!-- ============================================================
         LOGIN PAGE
         ============================================================ -->
    <div class="login-page">

        <!-- ====================================================
             ذرات شناور پس‌زمینه
             ==================================================== -->
        <div class="login-orbs" id="loginOrbs">
            <div class="login-orb orb-1"></div>
            <div class="login-orb orb-2"></div>
            <div class="login-orb orb-3"></div>
            <!-- ذرات کوچک با JS اضافه می‌شن -->
        </div>

        <!-- ====================================================
             Theme Toggle
             ==================================================== -->
        <button
            class="login-theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="تغییر تم"
            title="تغییر تم">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>

        <!-- ====================================================
             Login Card
             ==================================================== -->
        <div class="login-card">

            <!-- ============================================
                 Logo
                 ============================================ -->
            <div class="login-logo">
                <div class="login-logo-icon">
                    <i class="fas fa-chart-pie"></i>
                </div>
                <h1 class="login-title">سیستم تحلیلگر</h1>
                <p class="login-subtitle">
                    ورود به پنل مدیریت و تحلیل بازار
                </p>
                <span class="login-version-badge">v10.0</span>
            </div>

            <!-- ============================================
                 Error Message
                 ============================================ -->
            <div class="login-error" id="loginError" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="loginErrorText">خطا در ورود</span>
            </div>

            <!-- ============================================
                 Login Form
                 ============================================ -->
            <form class="login-form" id="loginForm" autocomplete="on">

                <!-- Username -->
                <div class="login-field">
                    <label class="login-field-label" for="username">
                        <i class="fas fa-user"></i>
                        <span>نام کاربری</span>
                    </label>
                    <div class="login-input-wrapper">
                        <input
                            type="text"
                            id="username"
                            class="login-input"
                            placeholder="نام کاربری خود را وارد کنید"
                            autocomplete="username"
                            required
                            dir="rtl"
                            spellcheck="false">
                        <i class="fas fa-user login-input-icon"></i>
                    </div>
                </div>

                <!-- Password -->
                <div class="login-field">
                    <label class="login-field-label" for="password">
                        <i class="fas fa-lock"></i>
                        <span>رمز عبور</span>
                    </label>
                    <div class="login-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            class="login-input"
                            placeholder="رمز عبور خود را وارد کنید"
                            autocomplete="current-password"
                            required
                            dir="rtl">
                        <i class="fas fa-lock login-input-icon"></i>
                        <button
                            type="button"
                            class="login-password-toggle"
                            id="passwordToggle"
                            aria-label="نمایش رمز عبور"
                            title="نمایش/مخفی کردن رمز">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember / Forgot -->
                <div class="login-options">
                    <label class="login-remember">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>مرا به خاطر بسپار</span>
                    </label>
                    <a href="#" class="login-forgot" id="forgotPassword">
                        فراموشی رمز؟
                    </a>
                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    class="login-submit"
                    id="loginSubmit">
                    <span id="loginSubmitText">ورود به سیستم</span>
                </button>

            </form>

            <!-- ============================================
                 Divider
                 ============================================ -->
            <div class="login-divider">
                <span>یا</span>
            </div>

            <!-- ============================================
                 Social Login
                 ============================================ -->
            <div class="login-social">

                <button
                    type="button"
                    class="login-social-btn google"
                    id="googleLogin"
                    title="ورود با گوگل">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>ورود با گوگل</span>
                </button>

                <button
                    type="button"
                    class="login-social-btn telegram"
                    id="telegramLogin"
                    title="ورود با تلگرام">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#0088cc">
                        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                    </svg>
                    <span>ورود با تلگرام</span>
                </button>

            </div>

            <!-- ============================================
                 Footer
                 ============================================ -->
            <div class="login-footer">
                <span>حساب کاربری ندارید؟</span>
                <a href="#" id="signupLink">ثبت‌نام کنید</a>
            </div>

        </div>

    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="/js/core/theme.js"></script>
    <script src="/js/core/index.js"></script>

    <script>
    // ============================================================
    // LOGIN PAGE SCRIPT
    // ============================================================

    (function() {
        'use strict';

        // ========================================================
        // ۱. ذرات شناور
        // ========================================================

        function initParticles() {
            const container = document.getElementById('loginOrbs');
            if (!container) return;

            const colors = ['', 'purple', 'pink'];
            const count = 20;

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'login-particle ' + colors[Math.floor(Math.random() * colors.length)];

                const size = Math.random() * 5 + 2;
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const duration = Math.random() * 20 + 15;
                const delay = Math.random() * -20;

                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = left + '%';
                p.style.top = top + '%';
                p.style.animationDuration = duration + 's';
                p.style.animationDelay = delay + 's';

                container.appendChild(p);
            }
        }

        // ========================================================
        // ۲. Theme Toggle
        // ========================================================

        function initThemeToggle() {
            const btn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');

            if (!btn || !icon) return;

            const update = () => {
                const mode = window.themeManager?.getMode() || 'dark';
                const icons = {
                    dark: 'fas fa-moon',
                    light: 'fas fa-sun',
                    auto: 'fas fa-circle-half-stroke',
                };
                icon.className = icons[mode] || icons.dark;
            };

            btn.addEventListener('click', () => {
                window.themeManager?.toggle();
                update();
            });

            update();

            // subscribe
            window.themeManager?.on(update);
        }

        // ========================================================
        // ۳. Password Toggle
        // ========================================================

        function initPasswordToggle() {
            const input = document.getElementById('password');
            const btn = document.getElementById('passwordToggle');
            const icon = document.getElementById('passwordToggleIcon');

            if (!input || !btn || !icon) return;

            btn.addEventListener('click', () => {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
                btn.setAttribute('aria-label', isPassword ? 'مخفی کردن رمز' : 'نمایش رمز');
            });
        }

        // ========================================================
        // ۴. Error
        // ========================================================

        function showError(message) {
            const errorEl = document.getElementById('loginError');
            const textEl = document.getElementById('loginErrorText');
            if (!errorEl || !textEl) return;

            textEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            const errorEl = document.getElementById('loginError');
            if (errorEl) errorEl.classList.remove('show');
        }

        // ========================================================
        // ۵. Loading
        // ========================================================

        function setLoading(loading) {
            const btn = document.getElementById('loginSubmit');
            const text = document.getElementById('loginSubmitText');
            if (!btn || !text) return;

            if (loading) {
                btn.disabled = true;
                text.innerHTML = 'در حال ورود...';
            } else {
                btn.disabled = false;
                text.textContent = 'ورود به سیستم';
            }
        }

        // ========================================================
        // ۶. Login Submit
        // ========================================================

        function initLoginForm() {
            const form = document.getElementById('loginForm');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const remember = document.getElementById('rememberMe');

            if (!form || !username || !password) return;

            // بازیابی نام کاربری ذخیره‌شده
            try {
                const saved = localStorage.getItem('saved_username');
                if (saved) {
                    username.value = saved;
                    password.focus();
                }
            } catch (e) { /* ignore */ }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();

                const user = username.value.trim();
                const pass = password.value.trim();

                if (!user) {
                    showError('لطفاً نام کاربری را وارد کنید');
                    username.focus();
                    return;
                }

                if (!pass) {
                    showError('لطفاً رمز عبور را وارد کنید');
                    password.focus();
                    return;
                }

                setLoading(true);

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username: user, password: pass }),
                    });

                    const data = await response.json();

                    if (data.success) {
                        // ذخیره session
                        if (data.session_id) {
                            document.cookie = `session_id=${data.session_id}; path=/; max-age=86400; SameSite=Lax`;
                            try {
                                localStorage.setItem('session_id', data.session_id);
                                localStorage.setItem('username', data.username || user);
                            } catch (e) { /* ignore */ }
                        }

                        // ذخیره نام کاربری اگه remember
                        if (remember && remember.checked) {
                            try {
                                localStorage.setItem('saved_username', user);
                            } catch (e) { /* ignore */ }
                        } else {
                            try {
                                localStorage.removeItem('saved_username');
                            } catch (e) { /* ignore */ }
                        }

                        // ریدایرکت
                        window.location.href = '/dashboard';
                    } else {
                        showError(data.error || 'نام کاربری یا رمز عبور اشتباه است');
                        setLoading(false);
                        password.value = '';
                        password.focus();
                    }
                } catch (err) {
                    console.error('❌ Login error:', err);
                    showError('خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.');
                    setLoading(false);
                }
            });

            // پاک کردن خطا هنگام تایپ
            username.addEventListener('input', hideError);
            password.addEventListener('input', hideError);
        }

        // ========================================================
        // ۷. Social (placeholder)
        // ========================================================

        function initSocial() {
            const google = document.getElementById('googleLogin');
            const telegram = document.getElementById('telegramLogin');
            const signup = document.getElementById('signupLink');
            const forgot = document.getElementById('forgotPassword');

            if (google) {
                google.addEventListener('click', () => {
                    alert('🚧 ورود با گوگل به‌زودی...');
                });
            }

            if (telegram) {
                telegram.addEventListener('click', () => {
                    alert('🚧 ورود با تلگرام به‌زودی...');
                });
            }

            if (signup) {
                signup.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🚧 ثبت‌نام به‌زودی...');
                });
            }

            if (forgot) {
                forgot.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🚧 بازیابی رمز به‌زودی...');
                });
            }
        }

        // ========================================================
        // ۸. Init
        // ========================================================

        function init() {
            initParticles();
            initThemeToggle();
            initPasswordToggle();
            initLoginForm();
            initSocial();

            console.log('✅ Login page ready');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>

</body>
</html>
