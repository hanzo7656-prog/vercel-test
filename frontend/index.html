<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - سیستم تحلیلگر</title>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #080c18;
            font-family: 'Segoe UI', 'Vazir', system-ui, sans-serif;
            color: #e8eef7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================================
           ANIMATED BACKGROUND
           ============================================================ */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            animation: floatOrb 25s ease-in-out infinite alternate;
        }

        .bg-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #00d4ff;
            top: -100px;
            right: -100px;
            animation-duration: 30s;
        }

        .bg-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: #a855f7;
            bottom: -80px;
            left: -80px;
            animation-duration: 25s;
            animation-delay: -8s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-80px, 50px) scale(1.2); }
            66% { transform: translate(70px, -60px) scale(0.9); }
            100% { transform: translate(-40px, 40px) scale(1.1); }
        }

        /* ============================================================
           LOGIN CONTAINER
           ============================================================ */
        .login-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .login-box {
            background: rgba(13, 22, 40, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: 24px;
            padding: 44px 38px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
        }

        .login-box:hover {
            border-color: rgba(0, 212, 255, 0.15);
            transform: translateY(-2px);
        }

        /* ============================================================
           LOGO
           ============================================================ */
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 8px;
        }

        .login-logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .login-logo .subtitle {
            color: #7a8fa8;
            font-size: 0.85rem;
            margin-top: 4px;
            font-weight: 400;
        }

        .login-logo .version {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.55rem;
            color: #4a5a6a;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ============================================================
           FORM
           ============================================================ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #a0b4c8;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a5a6a;
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.06);
            border-radius: 12px;
            color: #e8eef7;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.04);
            background: rgba(10, 14, 23, 0.8);
        }

        .form-group input::placeholder {
            color: #4a5a6a;
            opacity: 0.5;
        }

        /* ============================================================
           BUTTON
           ============================================================ */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(0, 212, 255, 0.25);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ============================================================
           ERROR
           ============================================================ */
        .error-msg {
            color: #ff4444;
            font-size: 0.85rem;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: rgba(255, 68, 68, 0.06);
            border: 1px solid rgba(255, 68, 68, 0.12);
            border-radius: 10px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-msg.show {
            display: flex;
        }

        .error-msg .error-icon {
            font-size: 1.1rem;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .login-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(0, 212, 255, 0.04);
            color: #4a5a6a;
            font-size: 0.75rem;
        }

        .login-footer a {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #00e5ff;
            text-decoration: underline;
        }

        /* ============================================================
           SPINNER
           ============================================================ */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .login-box {
                padding: 28px 20px;
                border-radius: 18px;
            }
            .login-logo h1 {
                font-size: 1.3rem;
            }
            .login-logo .icon {
                font-size: 2.2rem;
            }
            .form-group input {
                padding: 10px 38px 10px 14px;
                font-size: 0.85rem;
            }
            .btn-login {
                padding: 12px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 380px) {
            .login-box {
                padding: 20px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <!-- ===== LOGIN ===== -->
    <div class="login-container">
        <div class="login-box">

            <!-- LOGO -->
            <div class="login-logo">
                <span class="icon">📊</span>
                <h1>سیستم تحلیلگر</h1>
                <p class="subtitle">ورود به پنل مدیریت</p>
                <span class="version">v9.0</span>
            </div>

            <!-- FORM -->
            <form id="loginForm" autocomplete="off" novalidate>
                <div class="form-group">
                    <label>👤 نام کاربری</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input
                            type="text"
                            id="username"
                            placeholder="نام کاربری خود را وارد کنید"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label>🔑 رمز عبور</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="password"
                            placeholder="رمز عبور خود را وارد کنید"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <div id="loginError" class="error-msg">
                    <span class="error-icon">❌</span>
                    <span id="errorText">خطا</span>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    ورود
                </button>
            </form>

            <!-- FOOTER -->
            <div class="login-footer">
                <span>پشتیبانی: </span>
                <a href="https://t.me/your_telegram_id" target="_blank">@your_telegram_id</a>
            </div>

        </div>
    </div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorEl = document.getElementById('loginError');
            const errorText = document.getElementById('errorText');
            const btn = document.getElementById('loginBtn');

            function showError(message) {
                errorText.textContent = message;
                errorEl.classList.add('show');
            }

            function hideError() {
                errorEl.classList.remove('show');
            }

            function setLoading(loading) {
                if (loading) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner"></span> در حال ورود...';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = 'ورود';
                }
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    const active = document.activeElement;
                    if (active === usernameInput || active === passwordInput) {
                        e.preventDefault();
                        form.dispatchEvent(new Event('submit'));
                    }
                }
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showError('لطفاً نام کاربری و رمز عبور را وارد کنید');
                    return;
                }

                hideError();
                setLoading(true);

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // ✅ تنظیم کوکی با session_id (راه‌حل اصلی)
                        document.cookie = `session_id=${data.session_id}; path=/; max-age=86400;`;

                        // ذخیره در localStorage برای استفاده‌های بعدی
                        localStorage.setItem('session_id', data.session_id);
                        localStorage.setItem('username', data.username);

                        // ✅ ریدایرکت به داشبورد
                        window.location.href = '/dashboard';
                    } else {
                        showError(data.error || 'نام کاربری یا رمز عبور اشتباه است');
                        setLoading(false);
                    }

                } catch (error) {
                    console.error('Login error:', error);
                    showError('خطا در ارتباط با سرور. لطفاً مجدداً تلاش کنید.');
                    setLoading(false);
                }
            });

            usernameInput.addEventListener('input', hideError);
            passwordInput.addEventListener('input', hideError);

        });
    </script>

</body>
</html>
