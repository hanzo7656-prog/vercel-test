<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - سیستم تحلیلگر</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>📊 سیستم تحلیلگر</h1>
            <p class="subtitle">ورود به حساب کاربری</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید" required>
                </div>
                <div id="loginError" class="error-msg"></div>
                <button type="submit" id="loginBtn">ورود</button>
            </form>
            <div class="login-footer">
                <span>پشتیبانی: <a href="#">@your_telegram</a></span>
            </div>
        </div>
    </div>
    <script src="/js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                errorEl.textContent = 'لطفاً نام کاربری و رمز عبور را وارد کنید';
                errorEl.style.display = 'block';
                return;
            }

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = '⏳ در حال ورود...';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.error || 'خطا در ورود';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'ورود';
                }
            } catch (err) {
                errorEl.textContent = 'خطا در ارتباط با سرور';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'ورود';
            }
        });
    </script>
</body>
</html>
