<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - سیستم تحلیلگر</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #080c18;
            font-family: 'Segoe UI', 'Vazir', system-ui, sans-serif;
            color: #e8eef7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: rgba(13, 22, 40, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: 24px;
            padding: 44px 38px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
        }
        .login-box:hover { border-color: rgba(0, 212, 255, 0.15); transform: translateY(-2px); }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo .icon { font-size: 2.8rem; display: block; margin-bottom: 8px; }
        .login-logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-logo .subtitle { color: #7a8fa8; font-size: 0.85rem; margin-top: 4px; }
        .login-logo .version {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.55rem;
            color: #4a5a6a;
            background: rgba(255,255,255,0.03);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #a0b4c8; font-size: 0.8rem; font-weight: 500; margin-bottom: 6px; }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a5a6a;
            font-size: 1rem;
        }
        .form-group .input-wrapper .toggle-password {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #4a5a6a;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
            transition: color 0.3s ease;
        }
        .form-group .input-wrapper .toggle-password:hover { color: #00d4ff; }
        .form-group input {
            width: 100%;
            padding: 12px 44px 12px 44px;
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.06);
            border-radius: 12px;
            color: #e8eef7;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.04);
            background: rgba(10, 14, 23, 0.8);
        }
        .form-group input::placeholder { color: #4a5a6a; opacity: 0.5; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 4px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 35px rgba(0, 212, 255, 0.25); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .error-msg {
            color: #ff4444;
            font-size: 0.85rem;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: rgba(255, 68, 68, 0.06);
            border: 1px solid rgba(255, 68, 68, 0.12);
            border-radius: 10px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-msg.show { display: flex; }
        .login-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(0, 212, 255, 0.04);
            color: #4a5a6a;
            font-size: 0.75rem;
        }
        .login-footer a { color: #00d4ff; text-decoration: none; }
        .login-footer a:hover { color: #00e5ff; text-decoration: underline; }
        .spinner-sm {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.15);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .login-box { padding: 28px 20px; }
            .login-logo h1 { font-size: 1.3rem; }
            .login-logo .icon { font-size: 2.2rem; }
            .form-group input { padding: 10px 38px 10px 38px; font-size: 0.85rem; }
            .btn-login { padding: 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="login-logo">
            <span class="icon">📊</span>
            <h1>سیستم تحلیلگر</h1>
            <p class="subtitle">ورود به پنل مدیریت</p>
            <span class="version">v10.0</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>👤 نام کاربری</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید" required>
                </div>
            </div>
            <div class="form-group">
                <label>🔑 رمز عبور</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید" required>
                    <button type="button" class="toggle-password" id="togglePassword" title="نمایش/مخفی کردن رمز عبور">
                        👁️
                    </button>
                </div>
            </div>
            <div id="loginError" class="error-msg"><span>❌</span><span id="errorText">خطا</span></div>
            <button type="submit" class="btn-login" id="loginBtn">ورود</button>
        </form>

        <div class="login-footer">
            <span>پشتیبانی: </span>
            <a href="#" target="_blank">@your_telegram_id</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePassword');
            const errorEl = document.getElementById('loginError');
            const errorText = document.getElementById('errorText');
            const btn = document.getElementById('loginBtn');

            // ===== Toggle Password =====
            let isPasswordVisible = false;
            toggleBtn.addEventListener('click', function() {
                isPasswordVisible = !isPasswordVisible;
                passwordInput.type = isPasswordVisible ? 'text' : 'password';
                toggleBtn.textContent = isPasswordVisible ? '👁️‍🗨️' : '👁️';
            });

            function showError(message) {
                errorText.textContent = message;
                errorEl.classList.add('show');
            }
            function hideError() { errorEl.classList.remove('show'); }
            function setLoading(loading) {
                if (loading) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-sm"></span> در حال ورود...';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = 'ورود';
                }
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                if (!username || !password) {
                    showError('لطفاً نام کاربری و رمز عبور را وارد کنید');
                    return;
                }
                hideError();
                setLoading(true);
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await response.json();
                    if (data.success) {
                        document.cookie = `session_id=${data.session_id}; path=/; max-age=86400;`;
                        localStorage.setItem('session_id', data.session_id);
                        localStorage.setItem('username', data.username);
                        window.location.href = '/dashboard';
                    } else {
                        showError(data.error || 'نام کاربری یا رمز عبور اشتباه است');
                        setLoading(false);
                    }
                } catch (error) {
                    showError('خطا در ارتباط با سرور. لطفاً مجدداً تلاش کنید.');
                    setLoading(false);
                }
            });
            usernameInput.addEventListener('input', hideError);
            passwordInput.addEventListener('input', hideError);
        });
    </script>
</body>
</html>
