<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-color="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#070c16">
<title>خطای سرور | سیستم تحلیلگر</title>

<!-- ⚡ FOUC Prevention -->
<script>
(function() {
    try {
        var html = document.documentElement;
        var theme = localStorage.getItem('app_theme') || 'dark';
        html.setAttribute('data-theme', theme);
        var color = localStorage.getItem('app_color') || 'indigo';
        html.setAttribute('data-color', color);
        var preset = localStorage.getItem('app_preset');
        if (preset && preset !== 'default') {
            html.setAttribute('data-preset', preset);
        }
        if (color === 'custom') {
            var customHex = localStorage.getItem('app_customColor') || '#06b6d4';
            html.style.setProperty('--primary', customHex);
        }
        var lang = localStorage.getItem('app_lang') || 'fa';
        html.setAttribute('lang', lang);
        html.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
    } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ERROR PAGE 500 — v2.0
   World-class minimal design
   ============================================================ */

/* ============================================================
   VARIABLES
   ============================================================ */
:root {
    --ui-font: 'Vazirmatn', system-ui, sans-serif;
    --mono-font: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

    /* رنگ اختصاصی این صفحه (override می‌شه با data-color) */
    --error-accent: #ef4444;
    --error-accent-light: #f87171;
    --error-accent-dark: #dc2626;
    --error-accent-rgb: 239, 68, 68;
}

/* ---------- Color Themes ---------- */
html[data-color="indigo"]  { --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8; --primary-rgb: 99, 102, 241; }
html[data-color="emerald"] { --primary: #10b981; --primary-dark: #059669; --primary-light: #34d399; --primary-rgb: 16, 185, 129; }
html[data-color="rose"]    { --primary: #f43f5e; --primary-dark: #e11d48; --primary-light: #fb7185; --primary-rgb: 244, 63, 94; }
html[data-color="amber"]   { --primary: #f59e0b; --primary-dark: #d97706; --primary-light: #fbbf24; --primary-rgb: 245, 158, 11; }
html[data-color="violet"]  { --primary: #a855f7; --primary-dark: #9333ea; --primary-light: #c084fc; --primary-rgb: 168, 85, 247; }
html[data-color="cyan"]    { --primary: #06b6d4; --primary-dark: #0891b2; --primary-light: #22d3ee; --primary-rgb: 6, 182, 212; }
html[data-color="custom"]  { --primary: #06b6d4; --primary-dark: #0891b2; --primary-light: #22d3ee; --primary-rgb: 6, 182, 212; }

/* ---------- Dark Theme ---------- */
html[data-theme="dark"] {
    --bg-page: #070c16;
    --bg-card: rgba(20, 28, 45, 0.6);
    --bg-card-solid: #131c2d;
    --bg-input: rgba(10, 16, 28, 0.8);
    --bg-hover: rgba(148, 163, 184, 0.06);
    --bg-hover-strong: rgba(148, 163, 184, 0.1);
    --text-light: #e6edf7;
    --text-muted: #8b9bb4;
    --text-dim: #5c6b82;
    --text-faint: #3d4959;
    --border: rgba(148, 163, 184, 0.07);
    --border-strong: rgba(148, 163, 184, 0.15);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
    --primary-bg: rgba(var(--primary-rgb), 0.1);
    --error-accent-bg: rgba(var(--error-accent-rgb), 0.1);
    --ambient-opacity: 0.045;
}

/* ---------- Light Theme ---------- */
html[data-theme="light"] {
    --bg-page: #f6f8fc;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-solid: #ffffff;
    --bg-input: rgba(248, 250, 252, 0.95);
    --bg-hover: rgba(15, 23, 42, 0.04);
    --bg-hover-strong: rgba(15, 23, 42, 0.07);
    --text-light: #0d1421;
    --text-muted: #5c6b82;
    --text-dim: #8b9bb4;
    --text-faint: #a8b4c4;
    --border: rgba(15, 23, 42, 0.06);
    --border-strong: rgba(15, 23, 42, 0.12);
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.12);
    --primary-bg: rgba(var(--primary-rgb), 0.08);
    --error-accent-bg: rgba(var(--error-accent-rgb), 0.08);
    --ambient-opacity: 0.055;
}

/* ============================================================
   RESET
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    overflow-x: hidden;
    height: 100%;
}

body {
    font-family: var(--ui-font);
    background: var(--bg-page);
    min-height: 100vh;
    color: var(--text-light);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    transition: background var(--transition), color var(--transition);
}

::selection { background: var(--error-accent); color: white; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--error-accent); }

/* ============================================================
   AMBIENT BACKGROUND GLOW
   ============================================================ */
body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 900px;
    max-width: 100vw;
    max-height: 100vh;
    background: radial-gradient(
        circle at center,
        var(--error-accent) 0%,
        rgba(var(--error-accent-rgb), 0.5) 30%,
        transparent 65%
    );
    opacity: var(--ambient-opacity);
    pointer-events: none;
    z-index: 0;
    animation: ambientBreath 7s ease-in-out infinite;
}

@keyframes ambientBreath {
    0%, 100% {
        opacity: var(--ambient-opacity);
        transform: translate(-50%, -50%) scale(1);
    }
    50% {
        opacity: calc(var(--ambient-opacity) * 1.6);
        transform: translate(-50%, -50%) scale(1.1);
    }
}

/* Subtle grid pattern overlay */
body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
}

[data-theme="light"] body::after {
    opacity: 0.15;
}

/* ============================================================
   ERROR CARD
   ============================================================ */
.error-card {
    position: relative;
    z-index: 1;
    max-width: 540px;
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 56px 48px 36px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    text-align: center;
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    animation: cardIn 0.7s var(--ease-spring);
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Top accent line */
.error-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--error-accent),
        transparent
    );
    border-radius: 0 0 2px 2px;
    opacity: 0.9;
    animation: accentPulse 3s ease-in-out infinite;
}

@keyframes accentPulse {
    0%, 100% { opacity: 0.9; }
    50%      { opacity: 0.4; }
}

/* ============================================================
   ICON (Server Error)
   ============================================================ */
.error-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: var(--error-accent-bg);
    color: var(--error-accent-light);
    border: 1px solid rgba(var(--error-accent-rgb), 0.25);
    position: relative;
    animation: iconFloat 3s ease-in-out infinite;
}

.error-icon::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 22px;
    border: 1.5px solid var(--error-accent);
    opacity: 0;
    animation: iconRing 2s ease-out infinite;
}

@keyframes iconFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
}

@keyframes iconRing {
    0%   { transform: scale(0.95); opacity: 0.6; }
    100% { transform: scale(1.35); opacity: 0; }
}

.error-icon svg {
    width: 26px;
    height: 26px;
}

/* ============================================================
   EYEBROW
   ============================================================ */
.error-eyebrow {
    font-family: var(--mono-font);
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3.5px;
    color: var(--text-dim);
    margin-bottom: 14px;
    animation: contentIn 0.7s var(--ease-spring) 0.1s backwards;
}

/* ============================================================
   ERROR CODE
   ============================================================ */
.error-code {
    font-family: var(--mono-font);
    font-size: 108px;
    font-weight: 800;
    letter-spacing: -6px;
    line-height: 0.92;
    background: linear-gradient(
        135deg,
        var(--error-accent-light) 0%,
        var(--error-accent) 50%,
        var(--error-accent-dark) 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-bottom: 22px;
    animation:
        contentIn 0.7s var(--ease-spring) 0.15s backwards,
        codeGlow 4s ease-in-out infinite;
    position: relative;
    filter: drop-shadow(0 4px 20px rgba(var(--error-accent-rgb), 0.4));
}

@keyframes codeGlow {
    0%, 100% {
        filter: drop-shadow(0 4px 20px rgba(var(--error-accent-rgb), 0.4));
    }
    50% {
        filter: drop-shadow(0 4px 36px rgba(var(--error-accent-rgb), 0.65));
    }
}

/* ============================================================
   TITLE
   ============================================================ */
.error-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-light);
    margin-bottom: 12px;
    letter-spacing: -0.5px;
    line-height: 1.35;
    animation: contentIn 0.7s var(--ease-spring) 0.25s backwards;
}

/* ============================================================
   DESC
   ============================================================ */
.error-desc {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.85;
    margin-bottom: 36px;
    max-width: 420px;
    margin-inline: auto;
    animation: contentIn 0.7s var(--ease-spring) 0.35s backwards;
}

/* ============================================================
   ACTIONS
   ============================================================ */
.error-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 40px;
    flex-wrap: wrap;
    animation: contentIn 0.7s var(--ease-spring) 0.45s backwards;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    text-decoration: none;
    transition: all 0.2s var(--transition);
    white-space: nowrap;
    user-select: none;
    position: relative;
    overflow: hidden;
}

.btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    transition: transform 0.25s var(--transition);
}

.btn-primary {
    background: var(--error-accent);
    color: white;
    box-shadow:
        0 4px 14px rgba(var(--error-accent-rgb), 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
}

.btn-primary:hover {
    background: var(--error-accent-dark);
    transform: translateY(-2px);
    box-shadow:
        0 8px 24px rgba(var(--error-accent-rgb), 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
}

.btn-primary:hover svg {
    transform: rotate(-180deg);
}

.btn-primary:active {
    transform: translateY(0);
}

.btn-ghost {
    background: var(--bg-hover);
    color: var(--text-light);
    border-color: var(--border-strong);
}

.btn-ghost:hover {
    background: var(--bg-hover-strong);
    border-color: var(--text-faint);
    transform: translateY(-2px);
}

.btn-ghost:hover svg {
    transform: translateX(-3px);
}

.btn-ghost:active {
    transform: translateY(0);
}

/* ============================================================
   META
   ============================================================ */
.error-meta {
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    animation: contentIn 0.7s var(--ease-spring) 0.55s backwards;
}

.meta-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono-font);
    font-size: 11px;
    min-width: 0;
    max-width: 100%;
}

.meta-label {
    font-size: 9.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-faint);
    flex-shrink: 0;
}

.meta-value {
    color: var(--text-muted);
    font-weight: 600;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: ltr;
    display: inline-block;
}

.meta-sep {
    color: var(--text-faint);
    font-size: 12px;
    opacity: 0.6;
    user-select: none;
}

/* ============================================================
   SHARED ANIMATIONS
   ============================================================ */
@keyframes contentIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 640px) {
    body { padding: 16px; }

    .error-card {
        padding: 44px 28px 28px;
        border-radius: 20px;
    }

    .error-code {
        font-size: 84px;
        letter-spacing: -5px;
        margin-bottom: 18px;
    }

    .error-icon {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        margin-bottom: 18px;
    }

    .error-icon svg { width: 22px; height: 22px; }

    .error-title { font-size: 18px; }
    .error-desc { font-size: 12.5px; margin-bottom: 28px; }

    .error-actions {
        flex-direction: column;
        width: 100%;
        margin-bottom: 32px;
    }

    .btn { width: 100%; }

    .error-meta {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
        text-align: right;
    }

    .meta-sep { display: none; }
}

@media (max-width: 400px) {
    .error-card { padding: 36px 20px 24px; }
    .error-code { font-size: 68px; letter-spacing: -4px; }
    .error-title { font-size: 16.5px; }
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

    <div class="error-card" role="main">

        <!-- Icon (Server Alert) -->
        <div class="error-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>

        <!-- Eyebrow -->
        <div class="error-eyebrow">Internal Server Error</div>

        <!-- Code -->
        <div class="error-code" aria-label="خطای ۵۰۰">500</div>

        <!-- Title -->
        <h1 class="error-title">خطای داخلی سرور</h1>

        <!-- Description -->
        <p class="error-desc">
            متأسفانه سرور ما با مشکلی مواجه شده و نتوانست درخواست شما را پردازش کند.
            تیم فنی مطلع شده و در حال بررسی است.
            لطفاً چند لحظه دیگر دوباره تلاش کنید.
        </p>

        <!-- Actions -->
        <div class="error-actions">
            <button class="btn btn-primary" onclick="location.reload()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M8 16H3v5"/>
                </svg>
                <span>تلاش مجدد</span>
            </button>
            <a href="/dashboard" class="btn btn-ghost">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>بازگشت به داشبورد</span>
            </a>
        </div>

        <!-- Meta -->
        <div class="error-meta">
            <span class="meta-item">
                <span class="meta-label">Tracking</span>
                <span class="meta-value" id="errorId">—</span>
            </span>
            <span class="meta-sep" aria-hidden="true">·</span>
            <span class="meta-item">
                <span class="meta-label">Time</span>
                <span class="meta-value" id="errorTime">—</span>
            </span>
        </div>

    </div>

    <script>
    (function() {
        'use strict';

        // ===== کد رهگیری =====
        const idEl = document.getElementById('errorId');
        if (idEl) {
            const id = Math.random().toString(36).substring(2, 10).toUpperCase();
            idEl.textContent = id;
        }

        // ===== ساعت خطا =====
        const timeEl = document.getElementById('errorTime');
        if (timeEl) {
            const now = new Date();
            const time = now.toLocaleTimeString('en-GB', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            timeEl.textContent = time;
        }

        // ===== تشخیص زبان =====
        try {
            const lang = localStorage.getItem('app_lang') || 'fa';
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';

            if (lang !== 'fa') {
                const titleEl = document.querySelector('.error-title');
                const descEl = document.querySelector('.error-desc');
                const eyebrowEl = document.querySelector('.error-eyebrow');
                const retryBtn = document.querySelector('.btn-primary span');
                const homeBtn = document.querySelector('.btn-ghost span');

                if (titleEl) titleEl.textContent = 'Internal Server Error';
                if (descEl) descEl.textContent = 'Our server ran into a problem and couldn\'t process your request. Our team has been notified. Please try again in a moment.';
                if (eyebrowEl) eyebrowEl.textContent = 'Internal Server Error';
                if (retryBtn) retryBtn.textContent = 'Retry';
                if (homeBtn) homeBtn.textContent = 'Back to Dashboard';
            }
        } catch (e) {}

        console.log('%c 500 ',
            'background: linear-gradient(135deg, #ef4444, #f87171); color: white; padding: 4px 12px; border-radius: 6px; font-weight: bold;'
        );
    })();
    </script>

</body>
</html>
