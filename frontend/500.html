<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e1a">
    <title>خطای سرور | سیستم تحلیلگر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/themes.css">

    <!-- Page-specific -->
    <link rel="stylesheet" href="/css/pages/errors.css">
</head>
<body>

    <div class="error-page error-500">

        <div class="error-container">

            <!-- ====================================================
                 SVG Animation — Server + Sparks
                 ==================================================== -->
            <div class="error-svg-wrapper">
                <svg class="error-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Glow background -->
                    <defs>
                        <radialGradient id="serverGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
                            <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
                        </radialGradient>
                        <linearGradient id="serverBody" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#4b5563"/>
                            <stop offset="100%" stop-color="#1f2937"/>
                        </linearGradient>
                        <linearGradient id="serverRack" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#374151"/>
                            <stop offset="100%" stop-color="#111827"/>
                        </linearGradient>
                    </defs>

                    <!-- Server body (rack) -->
                    <rect
                        x="55" y="60" width="90" height="100" rx="10"
                        fill="url(#serverBody)"
                        stroke="#374151" stroke-width="2"/>

                    <!-- Server slots -->
                    <rect x="68" y="72" width="64" height="8" rx="3" fill="url(#serverRack)"/>
                    <rect x="68" y="88" width="64" height="8" rx="3" fill="url(#serverRack)"/>
                    <rect x="68" y="104" width="64" height="8" rx="3" fill="url(#serverRack)"/>
                    <rect x="68" y="120" width="64" height="8" rx="3" fill="url(#serverRack)"/>
                    <rect x="68" y="136" width="64" height="8" rx="3" fill="url(#serverRack)"/>

                    <!-- LED lights on each slot -->
                    <circle cx="75" cy="76" r="2" fill="#22d3ee" style="animation: serverBlink 1.2s ease-in-out infinite;"/>
                    <circle cx="75" cy="92" r="2" fill="#22d3ee" style="animation: serverBlink 1.4s ease-in-out infinite 0.2s;"/>
                    <circle cx="75" cy="108" r="2" fill="#ef4444" style="animation: serverBlink 0.8s ease-in-out infinite 0.4s;"/>
                    <circle cx="75" cy="124" r="2" fill="#f59e0b" style="animation: serverBlink 1.6s ease-in-out infinite 0.6s;"/>
                    <circle cx="75" cy="140" r="2" fill="#22d3ee" style="animation: serverBlink 1.3s ease-in-out infinite 0.8s;"/>

                    <!-- Top warning light (blinking red) -->
                    <circle
                        cx="100" cy="45" r="8"
                        fill="#ef4444"
                        style="animation: serverBlink 0.6s ease-in-out infinite;"/>
                    <circle
                        cx="100" cy="45" r="14"
                        fill="#ef4444"
                        opacity="0.3"
                        style="animation: pulseGlow 1.5s ease-in-out infinite;"/>

                    <!-- Antenna -->
                    <line x1="100" y1="53" x2="100" y2="60" stroke="#6b7280" stroke-width="2"/>

                    <!-- Sparks flying out -->
                    <circle cx="120" cy="70" r="3" fill="#f59e0b" style="--spark-x: 30px; --spark-y: -20px; animation: sparkFly 1.8s ease-out infinite;"/>
                    <circle cx="130" cy="85" r="2" fill="#fbbf24" style="--spark-x: 40px; --spark-y: 5px; animation: sparkFly 2s ease-out infinite 0.3s;"/>
                    <circle cx="85" cy="75" r="2.5" fill="#ef4444" style="--spark-x: -30px; --spark-y: -25px; animation: sparkFly 1.6s ease-out infinite 0.6s;"/>
                    <circle cx="75" cy="95" r="2" fill="#fb923c" style="--spark-x: -35px; --spark-y: 10px; animation: sparkFly 2.2s ease-out infinite 0.9s;"/>

                    <!-- Smoke -->
                    <ellipse cx="100" cy="30" rx="12" ry="6" fill="#94a3b8" opacity="0.15" style="animation: float 3s ease-in-out infinite;"/>
                    <ellipse cx="105" cy="18" rx="8" ry="4" fill="#94a3b8" opacity="0.1" style="animation: float 4s ease-in-out infinite 1s;"/>
                </svg>
            </div>

            <!-- ====================================================
                 Error Code
                 ==================================================== -->
            <div class="error-code">500</div>

            <!-- ====================================================
                 Title & Description
                 ==================================================== -->
            <h1 class="error-title">
                <i class="fas fa-server"></i>
                خطای داخلی سرور
            </h1>

            <p class="error-description">
                متأسفانه سرور ما با مشکلی مواجه شده و نتوانست درخواست شما را پردازش کند.
                تیم فنی ما مطلع شده و در حال بررسی است. لطفاً چند لحظه دیگر دوباره تلاش کنید.
            </p>

            <!-- ====================================================
                 Actions
                 ==================================================== -->
            <div class="error-actions">
                <button class="btn btn-primary" onclick="location.reload()">
                    <i class="fas fa-sync-alt"></i>
                    <span>تلاش مجدد</span>
                </button>
                <a href="/dashboard" class="btn btn-outline">
                    <i class="fas fa-home"></i>
                    <span>بازگشت به داشبورد</span>
                </a>
            </div>

            <!-- ====================================================
                 Meta
                 ==================================================== -->
            <div class="error-meta">
                <span class="error-meta-item">
                    <i class="fas fa-clock"></i>
                    <span id="errorTime">—</span>
                </span>
                <span class="error-meta-item">
                    <i class="fas fa-hashtag"></i>
                    <span id="errorId">—</span>
                </span>
            </div>

        </div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaliday@1/dist/index.min.js"></script>

    <script>
    (function() {
        'use strict';

        // ساعت خطا
        const timeEl = document.getElementById('errorTime');
        if (timeEl) {
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString('fa-IR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
            });
        }

        // کد رهگیری تصادفی
        const idEl = document.getElementById('errorId');
        if (idEl) {
            const id = Math.random().toString(36).substring(2, 10).toUpperCase();
            idEl.textContent = id;
        }

        console.log('💥 Error 500 page loaded');
    })();
    </script>

</body>
</html>
