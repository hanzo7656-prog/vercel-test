<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تنظیمات</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .settings-container { max-width: 900px; margin: 0 auto; padding: 16px 20px; }

        .settings-group {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
        }

        .settings-group .group-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-group .group-title i { color: var(--accent-cyan); }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.03);
            flex-wrap: wrap;
            gap: 8px;
        }

        .settings-row:last-child { border-bottom: none; }

        .settings-row .label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .settings-row .value {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .settings-row input,
        .settings-row select {
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
        }

        .settings-row input:focus,
        .settings-row select:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .settings-row .btn {
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .settings-row .btn-primary {
            background: var(--accent-cyan);
            color: var(--bg-primary);
        }

        .settings-row .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.25);
        }

        .settings-row .btn-danger {
            background: var(--accent-red);
            color: #fff;
        }

        .settings-row .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 68, 68, 0.25);
        }

        .settings-row .toggle {
            width: 44px;
            height: 24px;
            background: var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .settings-row .toggle.active {
            background: var(--accent-cyan);
        }

        .settings-row .toggle .thumb {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: var(--transition);
        }

        .settings-row .toggle.active .thumb { left: 23px; }

        .settings-row .toggle-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .settings-container { padding: 10px 12px; }
            .settings-group { padding: 14px 16px; }
            .settings-row { flex-direction: column; align-items: stretch; }
            .settings-row .btn { width: 100%; justify-content: center; }
            .settings-row input,
            .settings-row select { width: 100%; }
            .settings-row .toggle { align-self: center; }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="settings-container">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-cog" style="color:var(--accent-cyan);"></i> تنظیمات</h1>
                <span class="subtitle">مدیریت تنظیمات کاربر و سیستم</span>
            </div>
            <span class="timestamp" id="pageTimestamp"></span>
        </div>

        <!-- Account -->
        <div class="settings-group">
            <div class="group-title"><i class="fas fa-user-circle"></i> حساب کاربری</div>
            <div class="settings-row">
                <span class="label">نام کاربری</span>
                <span class="value" id="settingsUsername">—</span>
            </div>
            <div class="settings-row">
                <span class="label">نقش</span>
                <span class="value" id="settingsRole">—</span>
            </div>
            <div class="settings-row">
                <span class="label">رمز عبور</span>
                <button class="btn btn-primary" onclick="changePassword()">🔑 تغییر</button>
            </div>
            <div class="settings-row">
                <span class="label">خروج از حساب</span>
                <button class="btn btn-danger" onclick="logout()">🚪 خروج</button>
            </div>
        </div>

        <!-- Model -->
        <div class="settings-group">
            <div class="group-title"><i class="fas fa-brain"></i> تنظیمات مدل</div>
            <div class="settings-row">
                <span class="label">بازه پیش‌فرض</span>
                <select id="defaultPeriod">
                    <option value="24h">۲۴ ساعت</option>
                    <option value="1w">۱ هفته</option>
                    <option value="1m" selected>۱ ماه</option>
                </select>
            </div>
            <div class="settings-row">
                <span class="label">آموزش خودکار</span>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span class="toggle-label" id="scheduleStatus">غیرفعال</span>
                    <div class="toggle" id="scheduleToggle" onclick="toggleSchedule()">
                        <div class="thumb"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Appearance -->
        <div class="settings-group">
            <div class="group-title"><i class="fas fa-palette"></i> ظاهر</div>
            <div class="settings-row">
                <span class="label">حالت نمایش</span>
                <select id="themeSelect">
                    <option value="dark">🌙 تیره</option>
                    <option value="light">☀️ روشن</option>
                </select>
            </div>
        </div>

        <!-- System -->
        <div class="settings-group">
            <div class="group-title"><i class="fas fa-server"></i> اطلاعات سیستم</div>
            <div class="settings-row">
                <span class="label">نسخه</span>
                <span class="value" id="systemVersion">v9.0.0</span>
            </div>
            <div class="settings-row">
                <span class="label">وضعیت</span>
                <span class="value" id="systemStatus">⏳</span>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/script.js"></script>
    <script>
        // ============================================================
        // USER INFO
        // ============================================================
        function loadUserInfo() {
            fetch('/api/user', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('settingsUsername').textContent = data.data.username || '—';
                        document.getElementById('settingsRole').textContent = data.data.role || 'guest';
                    }
                })
                .catch(() => {});
        }

        // ============================================================
        // SCHEDULE
        // ============================================================
        function loadScheduleStatus() {
            fetch('/api/model/schedule', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.data) {
                        const isRunning = data.data.is_running || false;
                        const toggle = document.getElementById('scheduleToggle');
                        const status = document.getElementById('scheduleStatus');
                        if (isRunning) {
                            toggle.classList.add('active');
                            status.textContent = 'فعال (هر ' + (data.data.interval_hours || 6) + ' ساعت)';
                        } else {
                            toggle.classList.remove('active');
                            status.textContent = 'غیرفعال';
                        }
                    }
                })
                .catch(() => {});
        }

        function toggleSchedule() {
            const toggle = document.getElementById('scheduleToggle');
            const status = document.getElementById('scheduleStatus');
            const isActive = toggle.classList.contains('active');

            fetch('/api/model/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        enabled: !isActive,
                        interval: 6,
                        period: document.getElementById('defaultPeriod').value,
                        coins: ['bitcoin', 'ethereum']
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        if (!isActive) {
                            toggle.classList.add('active');
                            status.textContent = 'فعال (هر ۶ ساعت)';
                            showToast('✅ آموزش خودکار فعال شد', 'success');
                        } else {
                            toggle.classList.remove('active');
                            status.textContent = 'غیرفعال';
                            showToast('⏹️ آموزش خودکار غیرفعال شد', 'success');
                        }
                    } else {
                        showToast('❌ ' + data.message, 'error');
                    }
                })
                .catch(() => showToast('❌ خطا', 'error'));
        }

        // ============================================================
        // ACTIONS
        // ============================================================
        function changePassword() {
            const newPass = prompt('رمز عبور جدید را وارد کنید (حداقل ۶ کاراکتر):');
            if (!newPass) return;
            if (newPass.length < 6) {
                showToast('❌ رمز عبور باید حداقل ۶ کاراکتر باشد', 'error');
                return;
            }
            showToast('🔧 این قابلیت در حال توسعه است', 'info');
        }

        function logout() {
            if (!confirm('آیا از خروج از حساب کاربری اطمینان دارید؟')) return;
            fetch('/logout', { method: 'POST', credentials: 'include' })
                .then(() => window.location.href = '/');
        }

        // ============================================================
        // THEME
        // ============================================================
        document.getElementById('themeSelect').addEventListener('change', function() {
            const theme = this.value;
            document.body.className = theme;
            localStorage.setItem('theme', theme);
        });

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.getElementById('themeSelect').value = savedTheme;
        document.body.className = savedTheme;

        // ============================================================
        // SYSTEM INFO
        // ============================================================
        function loadSystemInfo() {
            fetch('/api/health', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    const status = document.getElementById('systemStatus');
                    if (data.status === 'ok') {
                        status.textContent = '✅ پایدار';
                        status.className = 'value green';
                    } else {
                        status.textContent = '⚠️ ضعیف';
                        status.className = 'value orange';
                    }
                })
                .catch(() => {
                    document.getElementById('systemStatus').textContent = '❌ نامشخص';
                    document.getElementById('systemStatus').className = 'value red';
                });
        }

        // ============================================================
        // NAV & TIMESTAMP
        // ============================================================
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        old.parentNode.replaceChild(ns, old);
                    });
                })
                .catch(() => {
                    container.innerHTML = `
                            <div style="background:#111d2b;padding:8px;text-align:center;border-bottom:1px solid #1a2a3a;font-size:0.8rem;color:#ff4444;">
                                ⚠️ خطا در بارگذاری منو
                                <button onclick="loadNav()" style="background:#00d4ff;color:#000;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;margin:4px;">🔄</button>
                            </div>
                        `;
                });
        }

        function updateTimestamp() {
            const el = document.getElementById('pageTimestamp');
            if (el) el.textContent = '🔄 ' + new Date().toLocaleString('fa-IR');
        }
        setInterval(updateTimestamp, 1000);

        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            loadUserInfo();
            loadScheduleStatus();
            loadSystemInfo();
            console.log('🚀 Settings page ready');
        });
    </script>
</body>
</html>
