<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .settings-container { max-width: 900px; margin: 0 auto; padding: 20px 24px; }
        .settings-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; }
        .settings-card h3 { color: var(--text-secondary); margin-bottom: 12px; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.03); flex-wrap: wrap; gap: 8px; }
        .settings-row .label { color: var(--text-secondary); font-size: 0.9rem; }
        .settings-row .value { color: var(--text-primary); font-weight: 500; }
        .settings-row input, .settings-row select { padding: 6px 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); }
        .settings-row input:focus, .settings-row select:focus { outline: none; border-color: var(--accent-cyan); }
        .settings-row button { padding: 6px 16px; border: none; border-radius: 6px; background: var(--accent-cyan); color: #fff; cursor: pointer; transition: all 0.3s ease; }
        .settings-row button:hover { box-shadow: 0 4px 20px rgba(0, 212, 255, 0.25); }
        .settings-row button.danger { background: var(--accent-red); }
        .settings-row button.danger:hover { box-shadow: 0 4px 20px rgba(255, 68, 68, 0.25); }
        .settings-row .toggle { width: 44px; height: 24px; background: var(--border-color); border-radius: 12px; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .settings-row .toggle.active { background: var(--accent-cyan); }
        .settings-row .toggle .thumb { width: 18px; height: 18px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: all 0.3s ease; }
        .settings-row .toggle.active .thumb { left: 23px; }
        .settings-row .toggle-label { font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; }
        @media (max-width: 768px) {
            .settings-row { flex-direction: column; align-items: stretch; }
            .settings-row input, .settings-row select { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="navContainer"></div>
    
    <main class="settings-container">
        <h1>⚙️ تنظیمات</h1>
        <p class="subtitle">مدیریت تنظیمات کاربر و سیستم</p>
        
        <div class="settings-card">
            <h3>👤 حساب کاربری</h3>
            <div class="settings-row">
                <span class="label">نام کاربری</span>
                <span class="value" id="settingsUsername">—</span>
            </div>
            <div class="settings-row">
                <span class="label">نقش</span>
                <span class="value" id="settingsRole">—</span>
            </div>
            <div class="settings-row">
                <span class="label">تغییر رمز عبور</span>
                <button onclick="changePassword()">🔑 تغییر</button>
            </div>
            <div class="settings-row">
                <span class="label">خروج از حساب</span>
                <button class="danger" onclick="logout()">🚪 خروج</button>
            </div>
        </div>
        
        <div class="settings-card">
            <h3>🧠 تنظیمات مدل</h3>
            <div class="settings-row">
                <span class="label">بازه زمانی پیش‌فرض</span>
                <select id="defaultPeriod">
                    <option value="24h">۲۴ ساعت</option>
                    <option value="1w">۱ هفته</option>
                    <option value="1m">۱ ماه</option>
                </select>
            </div>
            <div class="settings-row">
                <span class="label">آموزش خودکار</span>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span class="toggle-label" id="scheduleStatus">غیرفعال</span>
                    <div class="toggle" id="scheduleToggle" onclick="toggleAutoTrain()">
                        <div class="thumb"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="settings-card">
            <h3>🎨 ظاهر</h3>
            <div class="settings-row">
                <span class="label">حالت نمایش</span>
                <select id="themeSelect">
                    <option value="dark">🌙 تیره</option>
                    <option value="light">☀️ روشن</option>
                </select>
            </div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
