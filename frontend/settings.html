<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تنظیمات | سیستم تحلیلگر</title>
    
    <!-- ============================================================
         CDN LIBRARIES - CSS
         ============================================================ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- ============================================================
         CUSTOM CSS
         ============================================================ -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/settings_animations.css">
</head>
<body>

    <!-- ============================================================
         LOADING OVERLAY CONTAINER
         ============================================================ -->
    <div id="loadingOverlayContainer"></div>

    <!-- ============================================================
         NAVIGATION
         ============================================================ -->
    <div id="navContainer"></div>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="page-header">
            <div>
                <h1>
                    <i class="fas fa-cog"></i>
                    <span>تنظیمات</span>
                </h1>
                <span class="subtitle">مدیریت تنظیمات سیستم و ظاهر برنامه</span>
            </div>
            <div class="header-actions">
                <span class="timestamp" id="pageTimestamp">—</span>
                <button class="btn btn-xs btn-outline" onclick="refreshCurrentTab()" title="بروزرسانی">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <!-- ===== TABS NAVIGATION ===== -->
        <div class="settings-tabs" id="settingsTabs">
            <button class="settings-tab-btn active" data-tab="scheduler">
                <i class="fas fa-sync-alt"></i>
                <span>همگام‌سازی</span>
            </button>
            <button class="settings-tab-btn" data-tab="theme">
                <i class="fas fa-palette"></i>
                <span>ظاهر</span>
            </button>
            <button class="settings-tab-btn" data-tab="cache">
                <i class="fas fa-database"></i>
                <span>کش</span>
            </button>
            <button class="settings-tab-btn" data-tab="notifications">
                <i class="fas fa-bell"></i>
                <span>اعلان‌ها</span>
            </button>
            <button class="settings-tab-btn" data-tab="dashboard">
                <i class="fas fa-chart-pie"></i>
                <span>داشبورد</span>
            </button>
            <button class="settings-tab-btn" data-tab="account">
                <i class="fas fa-user-circle"></i>
                <span>حساب کاربری</span>
            </button>
            <button class="settings-tab-btn" data-tab="system">
                <i class="fas fa-server"></i>
                <span>سیستم</span>
            </button>
        </div>

        <!-- ===== TAB CONTENT WRAPPER ===== -->
        <div class="settings-tab-wrapper" id="settingsTabContent">
            <div class="settings-empty">
                <div class="settings-loading-spinner"></div>
                <p>در حال بارگذاری...</p>
            </div>
        </div>

    </div>

    <!-- ============================================================
         CDN LIBRARIES - JS
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaliday@1/dist/index.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mitt@3/dist/mitt.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/radash@12/dist/radash.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.min.js"></script>

    <!-- ============================================================
         CUSTOM JS
         ============================================================ -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/settings_loader.js"></script>

</body>
</html>
