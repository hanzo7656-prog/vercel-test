<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تنظیمات</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .settings-group {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .settings-group:hover { border-color: var(--border-hover); }
        .settings-group .group-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-group .group-title i { color: var(--accent-cyan); font-size: 1rem; }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
        }
        .settings-row:last-child { border-bottom: none; }
        .settings-row .label { color: var(--text-secondary); font-size: 0.85rem; }
        .settings-row .value { color: var(--text-primary); font-weight: 500; font-size: 0.85rem; }
        .settings-row .value.green { color: var(--accent-green); }
        .settings-row .value.orange { color: var(--accent-orange); }
        .settings-row .value.cyan { color: var(--accent-cyan); }

        .settings-row select, .settings-row input {
            padding: 6px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
            transition: var(--transition);
        }
        .settings-row select:focus, .settings-row input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.05);
        }

        /* ===== Password field with toggle ===== */
        .password-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 300px;
        }
        .password-wrapper input {
            flex: 1;
            padding: 6px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
            transition: var(--transition);
            min-width: 120px;
        }
        .password-wrapper input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.05);
        }
        .password-wrapper .toggle-password {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            padding: 4px;
        }
        .password-wrapper .toggle-password:hover {
            color: var(--accent-cyan);
        }

        .settings-row .btn {
            padding: 6px 18px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }
        .settings-row .btn-primary { background: var(--accent-cyan); color: var(--text-inverse); }
        .settings-row .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 212, 255, 0.2); }
        .settings-row .btn-danger { background: var(--accent-red); color: white; }
        .settings-row .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(239, 68, 68, 0.2); }

        .toggle-wrapper { display: flex; align-items: center; gap: 12px; }
        .toggle {
            width: 48px;
            height: 26px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 13px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .toggle.active { background: var(--accent-cyan); border-color: var(--accent-cyan); }
        .toggle .thumb {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .toggle.active .thumb { left: 24px; }
        .toggle-label { font-size: 0.75rem; color: var(--text-secondary); }

        @media (max-width: 768px) {
            .settings-group { padding: 14px 16px; }
            .settings-row { flex-direction: column; align-items: stretch; }
            .settings-row .btn { width: 100%; justify-content: center; }
            .settings-row select, .settings-row input { width: 100%; }
            .password-wrapper { max-width: 100%; }
            .toggle-wrapper { justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="container">

        <div class="page-header">
            <div><h1><i class="fas fa-cog" style="color:var(--accent-cyan);"></i> تنظیمات</h1><span class="subtitle">مدیریت تنظیمات کاربر و سیستم</span></div>
            <span class="timestamp" id="pageTimestamp"></span>
        </div>

        <!-- ===== ACCOUNT ===== -->
        <div class="settings-group">
            <div class="group-title"><i class="fas fa-user-circle"></i> حساب کاربری</div>
            <div class="settings-row">
                <span class="label">نام کاربری</span>
                <span class="value" id="settingsUsername">—</span>
            </div>
            <div class="settings-row">
                <span class="label">نقش</span>
                <span class="value" id="settingsRole">—</span>
            </div>
            <div class="settings-row">
                <span class="label">رمز عبور جدید</span>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="رمز عبور جدید (حداقل ۶ کاراکتر)">
                    <button type="button" class="toggle-password" id="toggleNewPassword" title="نمایش/مخفی کردن رمز عبور">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="settings-row">
                <span class="label">عملیات</span>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-primary" onclick="changePassword()">🔑 تغییر رمز</button>
                    <button class="btn btn-danger" onclick="logout()">🚪 خروج</button>
                </div>
            </div>
        </div>

        <!-- ===== MODEL ===== -->
        <div class="settings-group">
            <div class="group-title"><i class="fas fa-brain"></i> تنظیمات مدل</div>
            <div class="settings-row">
                <span class="label">بازه پیش‌فرض</span>
                <select id="defaultPeriod">
                    <option value="24h">۲۴ ساعت</option>
                    <option value="1w">۱ هفته</option>
                    <option value="1m" selected>۱ ماه</option>
                    <option value="3m">۳ ماه</option>
                </select>
            </div>
            <div class="settings-row">
                <span class="label">آموزش خودکار</span>
                <div class="toggle-wrapper">
                    <span class="toggle-label" id="scheduleStatus">غیرفعال</span>
                    <div class="toggle" id="scheduleToggle" onclick="toggleSchedule()"><div class="thumb"></div></div>
                </div>
            </div>
        </div>

        <!-- ===== APPEARANCE ===== -->
        <div class="settings-group">
            <div class="group-title"><i class="fas fa-palette"></i> ظاهر</div>
            <div class="settings-row">
                <span class="label">حالت نمایش</span>
                <select id="themeSelect">
                    <option value="dark">🌙 تیره</option>
                    <option value="light">☀️ روشن</option>
                </select>
            </div>
        </div>

        <!-- ===== SYSTEM (بدون آپتایم) ===== -->
        <div class="settings-group">
            <div class="group-title"><i class="fas fa-server"></i> اطلاعات سیستم</div>
            <div class="settings-row">
                <span class="label">نسخه</span>
                <span class="value" id="systemVersion">v10.0.0</span>
            </div>
            <div class="settings-row">
                <span class="label">وضعیت</span>
                <span class="value" id="systemStatus">⏳</span>
            </div>
        </div>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // ============================================================
        // SETTINGS CONTROLLER
        // ============================================================
        
        let isPasswordVisible = false;

        class SettingsController {
            constructor() {
                this.init();
            }
            async init() {
                console.log('🚀 Settings initializing...');
                await this.loadNav();
                await this.loadUserInfo();
                await this.loadSchedule();
                await this.loadSystemInfo();
                this.setupTheme();
                this.setupEvents();
                this.setupPasswordToggle();
                console.log('🚀 Settings ready');
            }
            async loadNav() {
                const container = document.getElementById('navContainer');
                if (!container) return;
                try {
                    const res = await fetch('/nav.html');
                    if (!res.ok) throw new Error('nav.html not found');
                    const html = await res.text();
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        old.parentNode.replaceChild(ns, old);
                    });
                } catch (err) { console.error('❌ Nav error:', err); }
            }
            async loadUserInfo() {
                try {
                    const data = await api.getUserInfo();
                    if (data.success) {
                        document.getElementById('settingsUsername').textContent = data.data.username || '—';
                        document.getElementById('settingsRole').textContent = data.data.role || 'guest';
                    }
                } catch (err) { console.error('User info error:', err); }
            }
            async loadSchedule() {
                try {
                    const data = await api.getScheduleStatus();
                    if (data.success && data.data) {
                        const isRunning = data.data.is_running || false;
                        const toggle = document.getElementById('scheduleToggle');
                        const status = document.getElementById('scheduleStatus');
                        if (isRunning) { toggle.classList.add('active'); status.textContent = `فعال (هر ${data.data.interval_hours || 6} ساعت)`; }
                        else { toggle.classList.remove('active'); status.textContent = 'غیرفعال'; }
                    }
                } catch (err) { console.error('Schedule error:', err); }
            }
            async loadSystemInfo() {
                try {
                    const health = await api.getHealth();
                    const statusEl = document.getElementById('systemStatus');
                    if (health.status === 'ok') { statusEl.textContent = '✅ پایدار'; statusEl.className = 'value green'; }
                    else { statusEl.textContent = '⚠️ ضعیف'; statusEl.className = 'value orange'; }
                } catch (err) {
                    console.error('System info error:', err);
                    document.getElementById('systemStatus').textContent = '❌ نامشخص';
                    document.getElementById('systemStatus').className = 'value';
                }
            }
            setupTheme() {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                document.getElementById('themeSelect').value = savedTheme;
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelect').addEventListener('change', (e) => {
                    const theme = e.target.value;
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                    showToast(`🌓 حالت ${theme === 'dark' ? 'تیره' : 'روشن'} فعال شد`, 'success');
                });
            }
            setupEvents() {
                document.getElementById('defaultPeriod').addEventListener('change', (e) => {
                    localStorage.setItem('defaultPeriod', e.target.value);
                    showToast('✅ بازه پیش‌فرض ذخیره شد', 'success');
                });
                const savedPeriod = localStorage.getItem('defaultPeriod');
                if (savedPeriod) document.getElementById('defaultPeriod').value = savedPeriod;
            }
            setupPasswordToggle() {
                const toggleBtn = document.getElementById('toggleNewPassword');
                const passwordInput = document.getElementById('newPassword');
                if (toggleBtn && passwordInput) {
                    toggleBtn.addEventListener('click', function() {
                        isPasswordVisible = !isPasswordVisible;
                        passwordInput.type = isPasswordVisible ? 'text' : 'password';
                        toggleBtn.innerHTML = isPasswordVisible ? 
                            '<i class="fas fa-eye-slash"></i>' : 
                            '<i class="fas fa-eye"></i>';
                    });
                }
            }
        }

        // ============================================================
        // GLOBAL FUNCTIONS
        // ============================================================

        async function toggleSchedule() {
            const toggle = document.getElementById('scheduleToggle');
            const status = document.getElementById('scheduleStatus');
            const isActive = toggle.classList.contains('active');
            try {
                const data = await api.startSchedule({ enabled: !isActive });
                if (data.success) {
                    if (!isActive) { toggle.classList.add('active'); status.textContent = 'فعال (هر ۶ ساعت)'; showToast('✅ آموزش خودکار فعال شد', 'success'); }
                    else { toggle.classList.remove('active'); status.textContent = 'غیرفعال'; showToast('⏹️ آموزش خودکار غیرفعال شد', 'success'); }
                } else { showToast('❌ ' + (data.message || 'خطا'), 'error'); }
            } catch (err) { showToast('❌ خطا', 'error'); }
        }

        function changePassword() {
            const input = document.getElementById('newPassword');
            const newPass = input.value.trim();
            if (!newPass) {
                showToast('⚠️ لطفاً رمز عبور جدید را وارد کنید', 'warning');
                return;
            }
            if (newPass.length < 6) {
                showToast('❌ رمز عبور باید حداقل ۶ کاراکتر باشد', 'error');
                return;
            }
            showToast('🔧 این قابلیت در حال توسعه است', 'info');
            input.value = '';
        }

        async function logout() {
            if (!confirm('آیا از خروج از حساب کاربری اطمینان دارید؟')) return;
            try { await api.logout(); window.location.href = '/'; }
            catch (err) { showToast('❌ خطا در خروج', 'error'); }
        }

        document.addEventListener('DOMContentLoaded', function() {
            new SettingsController();
        });
    </script>
</body>
</html>
