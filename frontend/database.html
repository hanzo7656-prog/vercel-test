<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت دیتابیس</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .db-container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }
        .db-tabs { display: flex; gap: 4px; background: var(--bg-secondary); border-radius: 12px; padding: 4px; border: 1px solid var(--border-color); margin-bottom: 20px; overflow-x: auto; }
        .db-tabs button { padding: 10px 20px; background: transparent; border: none; border-radius: 8px; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; font-size: 0.85rem; white-space: nowrap; }
        .db-tabs button:hover { background: rgba(0, 212, 255, 0.05); color: var(--text-primary); }
        .db-tabs button.active { background: rgba(0, 212, 255, 0.1); color: var(--accent-cyan); }
        .db-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; min-height: 400px; }
        .db-table-wrapper { overflow-x: auto; }
        .db-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .db-table th { text-align: right; padding: 10px 12px; border-bottom: 2px solid var(--border-color); color: var(--text-secondary); }
        .db-table td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .db-search { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .db-search input { flex: 1; padding: 8px 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); min-width: 150px; }
        .db-search input:focus { outline: none; border-color: var(--accent-cyan); }
        .db-search button { padding: 8px 20px; border: none; border-radius: 8px; background: var(--accent-cyan); color: #fff; font-weight: 600; cursor: pointer; }
        .db-search button:hover { box-shadow: 0 4px 20px rgba(0, 212, 255, 0.25); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @media (max-width: 768px) {
            .db-tabs { flex-wrap: nowrap; overflow-x: auto; }
            .db-tabs button { font-size: 0.75rem; padding: 8px 14px; }
            .db-search { flex-direction: column; }
            .db-search input { width: 100%; }
            .db-search button { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="navContainer"></div>
    
    <main class="db-container">
        <h1>🗄️ مدیریت دیتابیس</h1>
        <p class="subtitle">مشاهده و مدیریت دیتابیس‌های سیستم</p>
        
        <div class="db-tabs" id="dbTabs">
            <button class="active" data-tab="overview">📊 نمای کلی</button>
            <button data-tab="postgresql">🐘 PostgreSQL</button>
            <button data-tab="redis">⚡ Redis</button>
            <button data-tab="sqlite">📄 SQLite</button>
            <button data-tab="explorer">🔍 کاوشگر</button>
            <button data-tab="monitor">📈 مانیتورینگ</button>
        </div>
        
        <div class="db-content" id="dbContent">
            <!-- تب‌ها با جاوااسکریپت بارگذاری می‌شوند -->
            <div class="loading">در حال بارگذاری...</div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/database.js"></script>
</body>
</html>
