<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-color="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>لیست ارزها — تحلیلگر بازار</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   VARIABLES
   ============================================================ */
:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #818cf8;
    --primary-rgb: 99, 102, 241;
    --bg-page: #070c16;
    --bg-card: rgba(20, 28, 45, 0.6);
    --bg-card-solid: #131c2d;
    --bg-glass: rgba(19, 28, 45, 0.85);
    --bg-input: rgba(10, 16, 28, 0.8);
    --bg-hover: rgba(148, 163, 184, 0.06);
    --bg-hover-strong: rgba(148, 163, 184, 0.1);
    --text-light: #e6edf7;
    --text-muted: #8b9bb4;
    --text-dim: #5c6b82;
    --text-faint: #3d4959;
    --border: rgba(148, 163, 184, 0.07);
    --border-strong: rgba(148, 163, 184, 0.15);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
    --shadow-focus: 0 0 0 3px rgba(99, 102, 241, 0.15);
    --success: #22c55e;
    --success-dark: #16a34a;
    --warning: #f59e0b;
    --warning-dark: #d97706;
    --danger: #ef4444;
    --danger-dark: #dc2626;
    --info: #06b6d4;
    --purple: #a855f7;
    --success-bg: rgba(34, 197, 94, 0.1);
    --warning-bg: rgba(245, 158, 11, 0.1);
    --danger-bg: rgba(239, 68, 68, 0.1);
    --info-bg: rgba(6, 182, 212, 0.1);
    --primary-bg: rgba(99, 102, 241, 0.1);
    --purple-bg: rgba(168, 85, 247, 0.1);
    --mono-font: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
    --ui-font: 'Vazirmatn', system-ui, sans-serif;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

html[data-color="emerald"] { --primary: #10b981; --primary-dark: #059669; --primary-light: #34d399; --primary-rgb: 16, 185, 129; }
html[data-color="rose"]    { --primary: #f43f5e; --primary-dark: #e11d48; --primary-light: #fb7185; --primary-rgb: 244, 63, 94; }
html[data-color="amber"]   { --primary: #f59e0b; --primary-dark: #d97706; --primary-light: #fbbf24; --primary-rgb: 245, 158, 11; }
html[data-color="violet"]  { --primary: #a855f7; --primary-dark: #9333ea; --primary-light: #c084fc; --primary-rgb: 168, 85, 247; }
html[data-color="cyan"]    { --primary: #06b6d4; --primary-dark: #0891b2; --primary-light: #22d3ee; --primary-rgb: 6, 182, 212; }

html[data-theme="light"] {
    --bg-page: #f6f8fc;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-solid: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.9);
    --bg-input: rgba(248, 250, 252, 0.95);
    --bg-hover: rgba(15, 23, 42, 0.04);
    --bg-hover-strong: rgba(15, 23, 42, 0.07);
    --text-light: #0d1421;
    --text-muted: #5c6b82;
    --text-dim: #8b9bb4;
    --text-faint: #a8b4c4;
    --border: rgba(15, 23, 42, 0.06);
    --border-strong: rgba(15, 23, 42, 0.12);
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-x: hidden; }

body {
    font-family: var(--ui-font);
    background: var(--bg-page);
    min-height: 100vh;
    color: var(--text-light);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: 12px 16px 40px;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

/* ============================================================
   MARKET WIDGETS (۶ کارت)
   ============================================================ */
.market-widgets {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

@media (max-width: 1400px) { .market-widgets { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px) { .market-widgets { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .market-widgets { grid-template-columns: 1fr; } }

.mw-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) backwards;
}

.mw-card:nth-child(1) { animation-delay: 0.03s; }
.mw-card:nth-child(2) { animation-delay: 0.06s; }
.mw-card:nth-child(3) { animation-delay: 0.09s; }
.mw-card:nth-child(4) { animation-delay: 0.12s; }
.mw-card:nth-child(5) { animation-delay: 0.15s; }
.mw-card:nth-child(6) { animation-delay: 0.18s; }

.mw-card:hover {
    border-color: var(--border-strong);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
}

.mw-card.fear-greed { background: linear-gradient(135deg, rgba(245, 158, 11, 0.06), var(--bg-card)); }
.mw-card.btc-dom { background: linear-gradient(135deg, rgba(245, 158, 11, 0.04), var(--bg-card)); }
.mw-card.market-cap { background: linear-gradient(135deg, rgba(6, 182, 212, 0.06), var(--bg-card)); }
.mw-card.volume { background: linear-gradient(135deg, rgba(99, 102, 241, 0.06), var(--bg-card)); }
.mw-card.eth-dom { background: linear-gradient(135deg, rgba(168, 85, 247, 0.06), var(--bg-card)); }
.mw-card.active-coins { background: linear-gradient(135deg, rgba(34, 197, 94, 0.06), var(--bg-card)); }

.mw-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.mw-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 600;
    font-family: var(--mono-font);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mw-label svg { width: 11px; height: 11px; flex-shrink: 0; }

.mw-value {
    font-family: var(--mono-font);
    font-size: 18px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: -0.4px;
    line-height: 1.05;
    transition: color 0.4s;
}

.mw-value.up { color: var(--success); }
.mw-value.down { color: var(--danger); }
.mw-value.warning { color: var(--warning); }
.mw-value.primary { color: var(--primary-light); }
.mw-value.purple { color: var(--purple); }

.mw-hint {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--mono-font);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mw-gauge {
    height: 4px;
    background: var(--bg-hover-strong);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 2px;
}

.mw-gauge-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.mw-gauge-fill.good { background: linear-gradient(90deg, var(--success-dark), var(--success)); }
.mw-gauge-fill.warning { background: linear-gradient(90deg, var(--warning-dark), var(--warning)); }
.mw-gauge-fill.danger { background: linear-gradient(90deg, var(--danger-dark), var(--danger)); }
.mw-gauge-fill.primary { background: linear-gradient(90deg, var(--primary-dark), var(--primary)); }
.mw-gauge-fill.purple { background: linear-gradient(90deg, var(--purple), #c084fc); }

@keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   PRESET FILTERS
   ============================================================ */
.preset-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
}

.preset-bar::-webkit-scrollbar { display: none; }

.preset-label {
    font-size: 10.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 700;
    font-family: var(--mono-font);
    flex-shrink: 0;
    padding-left: 4px;
}

.preset-btn {
    padding: 7px 13px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.preset-btn:hover {
    background: var(--bg-hover);
    color: var(--text-light);
    border-color: var(--border-strong);
    transform: translateY(-1px);
}

.preset-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.35);
}

/* ============================================================
   TOOLBAR
   ============================================================ */
.analyzer-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.toolbar-search {
    flex: 1;
    min-width: 180px;
    position: relative;
}

.toolbar-search input {
    width: 100%;
    padding: 10px 36px 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-light);
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
    transition: all 0.2s;
}

.toolbar-search input:focus {
    border-color: var(--primary);
    box-shadow: var(--shadow-focus);
    background: var(--bg-card-solid);
}

.toolbar-search svg {
    width: 14px; height: 14px;
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
}

.toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-light);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    position: relative;
}

.toolbar-btn svg { width: 13px; height: 13px; }

.toolbar-btn:hover {
    background: var(--bg-hover);
    border-color: var(--border-strong);
    transform: translateY(-1px);
}

.toolbar-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.35);
}

.toolbar-btn .fb-badge {
    padding: 1px 6px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    font-family: var(--mono-font);
    font-size: 10px;
    font-weight: 700;
    min-width: 18px;
    text-align: center;
}

.toolbar-btn:not(.active) .fb-badge {
    background: var(--bg-hover);
    color: var(--text-dim);
}

.toolbar-counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 12px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 9px;
    font-family: var(--mono-font);
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 700;
}

.toolbar-counter svg { width: 12px; height: 12px; }

/* View Toggle */
.view-toggle {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
}

.view-toggle-btn {
    width: 30px;
    height: 28px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.view-toggle-btn svg { width: 14px; height: 14px; }

.view-toggle-btn:hover { background: var(--bg-hover); color: var(--text-light); }
.view-toggle-btn.active { background: var(--primary); color: white; }

/* ============================================================
   COINS TABLE
   ============================================================ */
.coins-table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
}

.coins-table-wrap::-webkit-scrollbar { height: 6px; }
.coins-table-wrap::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 3px;
}
.coins-table-wrap::-webkit-scrollbar-thumb:hover { background: var(--primary); }

.coins-table {
    width: 100%;
    min-width: 950px;
    border-collapse: collapse;
}

@media (max-width: 640px) {
    .coins-table { min-width: 700px; }
}

.coins-table thead {
    background: var(--bg-input);
    border-bottom: 1px solid var(--border);
}

.coins-table th {
    padding: 11px 12px;
    text-align: right;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-family: var(--mono-font);
    white-space: nowrap;
    user-select: none;
}

.coins-table th.sortable { cursor: pointer; transition: color 0.15s; }
.coins-table th.sortable:hover { color: var(--primary-light); }
.coins-table th.active { color: var(--primary-light); }

.coins-table th .sort-icon {
    display: inline-block;
    margin-right: 3px;
    font-size: 8px;
    opacity: 0.4;
}

.coins-table th.active .sort-icon { opacity: 1; }

.coins-table td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-light);
    white-space: nowrap;
}

.coins-table tbody tr {
    cursor: pointer;
    transition: background 0.15s;
}

.coins-table tbody tr:hover { background: var(--bg-hover); }
.coins-table tbody tr:last-child td { border-bottom: none; }

.coins-table tbody tr.active {
    background: linear-gradient(90deg, rgba(99, 102, 241, 0.08), transparent);
}

@media (max-width: 1200px) { .coins-table .hide-lg { display: none; } }
@media (max-width: 900px) { .coins-table .hide-md { display: none; } }
@media (max-width: 640px) {
    .coins-table .hide-sm { display: none; }
    .coins-table th, .coins-table td { padding: 9px 6px; font-size: 11px; }
}

.coin-cell {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
}

.coin-icon-sm {
    width: 28px; height: 28px;
    min-width: 28px;
    border-radius: 50%;
    background: var(--bg-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono-font);
    font-weight: 700;
    font-size: 10px;
    color: var(--primary-light);
    border: 1px solid var(--border);
    flex-shrink: 0;
}

.coin-cell-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
}

.coin-cell-symbol {
    font-family: var(--mono-font);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: -0.2px;
}

.coin-cell-name {
    font-size: 10px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 140px;
}

.rank-cell {
    font-family: var(--mono-font);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-align: center;
    width: 40px;
}

.price-cell {
    font-family: var(--mono-font);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: -0.3px;
    transition: color 0.3s;
}

.price-cell.flash-up { animation: cellFlashUp 0.7s; }
.price-cell.flash-down { animation: cellFlashDown 0.7s; }

@keyframes cellFlashUp {
    0% { color: var(--success); }
    100% { color: var(--text-light); }
}
@keyframes cellFlashDown {
    0% { color: var(--danger); }
    100% { color: var(--text-light); }
}

.change-cell {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: var(--mono-font);
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
}

.change-cell svg { width: 9px; height: 9px; }
.change-cell.up { background: var(--success-bg); color: var(--success); }
.change-cell.down { background: var(--danger-bg); color: var(--danger); }
.change-cell.neutral { background: var(--bg-hover); color: var(--text-muted); }

.hl-cell {
    font-family: var(--mono-font);
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    gap: 1px;
    line-height: 1.3;
}

.hl-cell .hl-high { color: var(--success); }
.hl-cell .hl-low { color: var(--danger); }

.volume-cell,
.marketcap-cell {
    font-family: var(--mono-font);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
}

.atr-cell {
    font-family: var(--mono-font);
    font-size: 11.5px;
    font-weight: 600;
}

.atr-cell.low { color: var(--text-muted); }
.atr-cell.medium { color: var(--warning); }
.atr-cell.high { color: var(--danger); }

.sparkline-cell {
    width: 90px;
    height: 24px;
}

.sparkline-cell svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.star-cell { width: 34px; text-align: center; }

.star-btn {
    width: 26px; height: 26px;
    background: transparent;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.star-btn svg { width: 14px; height: 14px; }
.star-btn:hover { background: var(--warning-bg); color: var(--warning); }
.star-btn.active { color: var(--warning); }
.star-btn.active svg { fill: currentColor; }

/* ============================================================
   COINS GRID (Card View)
   ============================================================ */
.coins-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
}

@media (max-width: 640px) {
    .coins-grid { grid-template-columns: 1fr; gap: 8px; }
}

.coin-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    padding-top: 38px;
}

.coin-card:hover {
    border-color: var(--border-strong);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}

.coin-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

.coin-card-icon {
    width: 38px; height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: var(--bg-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono-font);
    font-weight: 700;
    font-size: 12px;
    color: var(--primary-light);
    border: 1px solid var(--border);
    flex-shrink: 0;
}

.coin-card-title {
    flex: 1;
    min-width: 0;
}

.coin-card-symbol {
    font-family: var(--mono-font);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
}

.coin-card-name {
    font-size: 10.5px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.coin-card-rank {
    font-family: var(--mono-font);
    font-size: 10px;
    color: var(--text-dim);
    background: var(--bg-hover);
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 700;
}

.coin-card-star {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 26px; height: 26px;
    background: transparent;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.coin-card-star svg { width: 14px; height: 14px; }
.coin-card-star:hover { background: var(--warning-bg); color: var(--warning); }
.coin-card-star.active { color: var(--warning); }
.coin-card-star.active svg { fill: currentColor; }

.coin-card-price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.coin-card-price {
    font-family: var(--mono-font);
    font-size: 18px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: -0.4px;
    line-height: 1.1;
    transition: color 0.3s;
}

.coin-card-price.flash-up { animation: cellFlashUp 0.7s; }
.coin-card-price.flash-down { animation: cellFlashDown 0.7s; }

.coin-card-change {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: var(--mono-font);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
}

.coin-card-change svg { width: 10px; height: 10px; }
.coin-card-change.up { background: var(--success-bg); color: var(--success); }
.coin-card-change.down { background: var(--danger-bg); color: var(--danger); }
.coin-card-change.neutral { background: var(--bg-hover); color: var(--text-muted); }

.coin-card-chart {
    height: 40px;
}

.coin-card-chart svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.coin-card-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
}

.coin-card-stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.coin-card-stat-label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 600;
    font-family: var(--mono-font);
}

.coin-card-stat-value {
    font-family: var(--mono-font);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-light);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.coin-card-stat-value.up { color: var(--success); }
.coin-card-stat-value.down { color: var(--danger); }
.coin-card-stat-value.warning { color: var(--warning); }
.coin-card-stat-value.muted { color: var(--text-muted); }

/* ============================================================
   EMPTY / SKELETON
   ============================================================ */
.empty-state {
    padding: 60px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: cardIn 0.5s ease;
}

.empty-icon { width: 60px; height: 60px; color: var(--text-faint); opacity: 0.5; }
.empty-icon svg { width: 100%; height: 100%; }
.empty-title { font-size: 14px; font-weight: 700; color: var(--text-light); }
.empty-message { font-size: 12px; color: var(--text-muted); }

.skeleton-row { display: table-row; }

.skeleton-line {
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, rgba(148, 163, 184, 0.05) 0%, rgba(148, 163, 184, 0.12) 50%, rgba(148, 163, 184, 0.05) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s linear infinite;
}

.skeleton-line.short { width: 40px; }
.skeleton-line.medium { width: 100px; }
.skeleton-line.long { width: 150px; }

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* ============================================================

.toast-container {

<script>
(function() {
'use strict';

if (window.__analyzerMarketLoaded) return;
window.__analyzerMarketLoaded = true;

const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => ctx.querySelectorAll(sel);

// ============================================================
// CONFIG — Endpoints واقعی
// ============================================================
const CONFIG = {
    API: {
        COINS: '/api/coinstats/coins',
        FEAR_GREED: '/api/coinstats/fear-greed',
        BTC_DOM: '/api/coinstats/btc-dominance',
        GLOBAL_MARKET: '/api/coinstats/global-market',
        WS_PRICE: '/api/ws/price',
    },
    PRICE_UPDATE_INTERVAL: 5000,
    INSIGHTS_UPDATE_INTERVAL: 5 * 60 * 1000,
    STORAGE: {
        WATCHLIST: 'analyzer_watchlist',
        VIEW_MODE: 'analyzer_view_mode',
        SELECTED_COIN: 'analyzer_selected_coin',
    }
};

// ============================================================
// API WRAPPER
// ============================================================
const API = {
    async request(url, options = {}) {
        try {
            const res = await fetch(url, {
                credentials: 'include',
                headers: { 'Accept': 'application/json' },
                ...options,
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } catch (err) {
            console.warn(`[API] ${url}:`, err.message);
            return { success: false, error: err.message };
        }
    },

    async getCoins(limit = 250) {
        return this.request(`${CONFIG.API.COINS}?limit=${limit}`);
    },

    async getFearGreed() {
        return this.request(CONFIG.API.FEAR_GREED);
    },

    async getBTCDominance() {
        return this.request(CONFIG.API.BTC_DOM);
    },

    async getGlobalMarket() {
        return this.request(CONFIG.API.GLOBAL_MARKET);
    },

    async getWSPrice(symbol) {
        return this.request(`${CONFIG.API.WS_PRICE}/${symbol.toLowerCase()}`);
    },

    async getBatchPrices(symbols) {
        const results = await Promise.allSettled(
            symbols.map(sym => this.getWSPrice(sym))
        );
        const prices = {};
        results.forEach((r, i) => {
            if (r.status === 'fulfilled' && r.value?.success && r.value?.data) {
                prices[symbols[i]] = r.value.data;
            }
        });
        return { success: true, data: prices };
    }
};

// ============================================================
// STATE
// ============================================================
const state = {
    coins: [],
    filteredCoins: [],
    searchQuery: '',
    sortBy: 'rank_asc',
    preset: 'all',
    viewMode: 'table',
    watchlist: new Set(),
    priceUpdateTimer: null,
    insightsTimer: null,
    isLoading: true,
};

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(str) {
    if (!str && str !== 0) return '';
    return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function formatCurrency(value) {
    if (value === undefined || value === null || isNaN(value)) return '$0.00';
    const n = Number(value);
    if (n >= 1000) return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    if (n >= 1) return '$' + n.toFixed(2);
    if (n >= 0.01) return '$' + n.toFixed(4);
    return '$' + n.toFixed(6);
}

function formatPercent(value) {
    if (value === undefined || value === null || isNaN(value)) return '0.00%';
    return (value >= 0 ? '+' : '') + Number(value).toFixed(2) + '%';
}

function formatNumber(n) {
    if (!n && n !== 0) return '۰';
    return Number(n).toLocaleString('fa-IR');
}

function formatCompact(n) {
    if (!n && n !== 0) return '—';
    const abs = Math.abs(n);
    if (abs >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
    if (abs >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
    if (abs >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
    if (abs >= 1e3) return '$' + (n / 1e3).toFixed(2) + 'K';
    return '$' + n.toFixed(2);
}

function showToast(msg, type = 'info', duration = 2200) {
    const container = $('#toastContainer');
    if (!container) return;

    const colors = {
        success: '#22c55e',
        error: '#ef4444',
        warning: '#f59e0b',
        info: '#6366f1'
    };

    const icons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',

// ============================================================
// ATR ESTIMATION
// ============================================================
function estimateATR(coin) {
    const absChange = Math.abs(coin.priceChange1d || 0);
    const atr = absChange * 1.5 + 0.5;
    return Math.max(0.5, Math.min(atr, 20));
}

function getAtrCategory(atr) {
    if (atr < 2) return 'low';
    if (atr < 5) return 'medium';
    return 'high';
}

function getMarketCapCategory(mc) {
    if (mc >= 10e9) return 'large';
    if (mc >= 1e9) return 'mid';
    return 'small';
}

// ============================================================
// SPARKLINE
// ============================================================
function hashStr(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h);
}

function generateSparkline(coin, width = 90, height = 24) {
    const seed = hashStr(coin.id);
    let s = seed;
    const random = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const points = 20;
    const values = [50];
    for (let i = 1; i < points; i++) values.push(values[i - 1] + (random() - 0.5) * 20);
    const trend = (coin.change7d || 0) / 10;
    for (let i = 0; i < values.length; i++) values[i] += trend * (i / values.length) * 20;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const stepX = width / (points - 1);
    const pts = values.map((v, i) => {
        const x = i * stepX;
        const y = height - ((v - min) / range) * (height - 4) - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const color = (coin.change7d || 0) >= 0 ? '#22c55e' : '#ef4444';
    return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </svg>`;
}

function generateCardSparkline(coin, width = 240, height = 40) {
    const seed = hashStr(coin.id + 'card');
    let s = seed;
    const random = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const points = 30;
    const values = [50];
    for (let i = 1; i < points; i++) values.push(values[i - 1] + (random() - 0.5) * 18);
    const trend = (coin.change7d || 0) / 10;
    for (let i = 0; i < values.length; i++) values[i] += trend * (i / values.length) * 25;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const stepX = width / (points - 1);
    const pts = values.map((v, i) => {
        const x = i * stepX;
        const y = height - ((v - min) / range) * (height - 4) - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const color = (coin.change7d || 0) >= 0 ? '#22c55e' : '#ef4444';
    return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </svg>`;
}

function loadWatchlist() {

        state.watchlist = new Set(saved);
    } catch (e) {

    }
}

function saveWatchlist() {
    try {
        localStorage.setItem(CONFIG.STORAGE.WATCHLIST, JSON.stringify([...state.watchlist]));
    } catch (e) {}
}

function toggleWatchlist(coinId) {
    if (state.watchlist.has(coinId)) {
        state.watchlist.delete(coinId);
    } else {
        state.watchlist.add(coinId);
    }
    saveWatchlist();

    document.querySelectorAll(`[data-watch="${coinId}"]`).forEach(btn => {
        const isWatched = state.watchlist.has(coinId);
        btn.classList.toggle('active', isWatched);
        btn.innerHTML = isWatched ? SVG.starFill : SVG.star;
    });

    if (state.preset === 'watchlist') {
        applyFilters();
    }
}

async function loadCoins() {
    try {
        const res = await API.getCoins(250);

        if (!res.success || !Array.isArray(res.data)) {
            throw new Error(res.error || 'Invalid data');
        }

        state.coins = res.data
            .filter(c => c.id && c.symbol)
            .map(c => ({
                id: c.id,
                symbol: c.symbol || '',
                name: c.name || c.symbol || '',
                rank: c.rank || 999,
                price: parseFloat(c.price) || 0,
                priceChange1d: parseFloat(c.priceChange1d) || 0,
                change7d: parseFloat(c.priceChange1w) || 0,
                change30d: parseFloat(c.priceChange1m) || parseFloat(c.priceChange1w) || 0,
                high24h: parseFloat(c.high24h) || 0,
                low24h: parseFloat(c.low24h) || 0,
                volume24h: parseFloat(c.volume) || 0,
                marketCap: parseFloat(c.marketCap) || 0,
            }));

        return true;
    } catch (e) {
        console.error('loadCoins error:', e);
        showToast('خطا در دریافت لیست ارزها', 'error', 4000);
        return false;
    }
}

async function loadMarketWidgets() {
    // Fear & Greed
    try {
        const fg = await API.getFearGreed();
        if (fg.success && fg.data) {
            renderFearGreed(fg.data);
        }
    } catch (e) {
        console.warn('Fear&Greed failed:', e);
    }

    // Global Market (BTC Dom, Market Cap, Volume, ETH Dom, Active Coins)
    try {
        const gm = await API.getGlobalMarket();
        if (gm.success && gm.data) {
            renderGlobalMarket(gm.data);
        }
    } catch (e) {
        console.warn('Global Market failed:', e);
    }

    // BTC Dominance (از endpoint جداگانه، چون ممکنه GlobalMarket نده)
    try {
        const dom = await API.getBTCDominance();
        if (dom.success && dom.data) {
            let value = 50;
            if (Array.isArray(dom.data.data) && dom.data.data.length > 0) {
                const lastPair = dom.data.data[dom.data.data.length - 1];
                value = parseFloat(lastPair[1]) || 50;
            } else if (typeof dom.data.value === 'number') {
                value = dom.data.value;
            }

            // فقط اگه GlobalMarket داده قبلی رو نداشته باشه
            const btcDomEl = $('#mwBtcDom');
            if (btcDomEl && btcDomEl.textContent === '—') {
                renderBtcDominance(value);
            }
        }
    } catch (e) {
        console.warn('BTC Dominance failed:', e);
    }
}

// RENDER MARKET WIDGETS
// ============================================================
function renderFearGreed(data) {
    const v = data.value || 50;
    const valEl = $('#mwFearGreed');
    const barEl = $('#mwFearGreedBar');
    const hintEl = $('#mwFearGreedHint');

    if (!valEl) return;

    valEl.textContent = v;

    let cls = 'warning';
    let valCls = 'warning';
    if (v < 25) { cls = 'danger'; valCls = 'down'; }
    else if (v < 45) { cls = 'warning'; valCls = 'warning'; }
    else if (v < 55) { cls = 'warning'; valCls = 'warning'; }
    else if (v < 75) { cls = 'good'; valCls = 'up'; }
    else { cls = 'good'; valCls = 'up'; }

    valEl.className = 'mw-value ' + valCls;
    if (hintEl) hintEl.textContent = data.classification || '—';
    if (barEl) {
        barEl.className = 'mw-gauge-fill ' + cls;
        setTimeout(() => { barEl.style.width = v + '%'; }, 100);
    }
}

function renderGlobalMarket(data) {
    // BTC Dominance
    if (data.btc_dominance) {
        renderBtcDominance(data.btc_dominance);
    }

    // Total Market Cap
    const mcEl = $('#mwMarketCap');
    const mcHintEl = $('#mwMarketCapHint');
    if (mcEl && data.total_market_cap) {
        mcEl.textContent = formatCompact(data.total_market_cap);
        if (mcHintEl) {
            const ch = data.market_cap_change_24h || 0;
            mcHintEl.textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '٪ امروز';
        }
    }

    // Volume
    const volEl = $('#mwVolume');
    const volHintEl = $('#mwVolumeHint');
    if (volEl && data.total_volume_24h) {
        volEl.textContent = formatCompact(data.total_volume_24h);
        if (volHintEl) volHintEl.textContent = 'در ۲۴ ساعت اخیر';
    }

    // ETH Dominance
    const ethEl = $('#mwEthDom');
    const ethHintEl = $('#mwEthDomHint');
    const ethBarEl = $('#mwEthDomBar');
    if (ethEl && data.eth_dominance) {
        ethEl.textContent = data.eth_dominance.toFixed(1) + '٪';
        if (ethHintEl) ethHintEl.textContent = 'از کل بازار';
        if (ethBarEl) {
            setTimeout(() => { ethBarEl.style.width = data.eth_dominance + '%'; }, 100);
        }
    }

    // Active Coins
    const acEl = $('#mwActiveCoins');
    const acHintEl = $('#mwActiveCoinsHint');
    if (acEl && data.active_cryptocurrencies) {
        acEl.textContent = formatNumber(data.active_cryptocurrencies);
        if (acHintEl) acHintEl.textContent = 'ارز فعال';
    }
}

function renderBtcDominance(value) {
    const el = $('#mwBtcDom');
    const hintEl = $('#mwBtcDomHint');
    const barEl = $('#mwBtcDomBar');
    if (!el) return;

    el.textContent = value.toFixed(1) + '٪';
    if (hintEl) hintEl.textContent = 'از کل بازار';
    if (barEl) {
        setTimeout(() => { barEl.style.width = value + '%'; }, 100);
    }
}

        card.addEventListener('click', (e) => {
            if (e.target.closest('.coin-card-star')) return;
            goToAnalyze(card.dataset.coinId);
        });
    });

    grid.querySelectorAll('.coin-card-star').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleWatchlist(btn.dataset.watch);
        });
    });
}

function updateCount() {
    const el = $('#coinsCount');
    if (el) el.textContent = formatNumber(state.filteredCoins.length);
}

// ============================================================
// RENDER (switch between table/grid)
// ============================================================
function renderCoins() {
    if (state.viewMode === 'card') {
        $('#tableWrap').style.display = 'none';
        $('#gridWrap').style.display = 'grid';
        renderGrid();
    } else {
        $('#tableWrap').style.display = 'block';
        $('#gridWrap').style.display = 'none';
        renderTable();
    }
}

// ============================================================
// GO TO ANALYZE
// ============================================================
function goToAnalyze(coinId) {
    try {
        localStorage.setItem(CONFIG.STORAGE.SELECTED_COIN, coinId);
    } catch (e) {}

    showToast('در حال انتقال به تحلیل...', 'info', 800);

    // ارسال پیام به shell مادر
    try {
        window.parent.postMessage({
            type: 'navigate-analyze',
            coinId
        }, '*');
    } catch (e) {}

    // Fallback: تغییر URL مستقیم
    setTimeout(() => {
        try {
            window.parent.location.href = '/analyzer/analyze';
        } catch (e) {
            window.location.href = '/analyzer/analyze';
        }
    }, 350);
}

// ============================================================
// APPLY FILTERS
// ============================================================
function applyFilters() {
    let coins = [...state.coins];

    // Preset
    if (state.preset === 'watchlist') {
        coins = coins.filter(c => state.watchlist.has(c.id));
    } else if (state.preset === 'gainers') {
        coins = coins.filter(c => (c.priceChange1d || 0) > 0);
        coins.sort((a, b) => (b.priceChange1d || 0) - (a.priceChange1d || 0));
    } else if (state.preset === 'losers') {
        coins = coins.filter(c => (c.priceChange1d || 0) < 0);
        coins.sort((a, b) => (a.priceChange1d || 0) - (b.priceChange1d || 0));
    } else if (state.preset === 'volume') {
        coins.sort((a, b) => (b.volume24h || 0) - (a.volume24h || 0));
    } else if (state.preset === 'volatile') {
        coins.sort((a, b) => estimateATR(b) - estimateATR(a));
    }

    // Search
    if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        coins = coins.filter(c =>
            c.name.toLowerCase().includes(q) ||
            c.symbol.toLowerCase().includes(q) ||
            c.id.toLowerCase().includes(q)
        );
    }

    // Sort (اگه preset != همه)
    if (state.preset === 'all') {
        const sorters = {
            'rank_asc': (a, b) => (a.rank || 999) - (b.rank || 999),
            'price_desc': (a, b) => (b.price || 0) - (a.price || 0),
            'price_asc': (a, b) => (a.price || 0) - (b.price || 0),
            'change_desc': (a, b) => (b.priceChange1d || 0) - (a.priceChange1d || 0),
            'change_asc': (a, b) => (a.priceChange1d || 0) - (b.priceChange1d || 0),
            'volume_desc': (a, b) => (b.volume24h || 0) - (a.volume24h || 0),
            'marketcap_desc': (a, b) => (b.marketCap || 0) - (a.marketCap || 0),
            'atr_desc': (a, b) => estimateATR(b) - estimateATR(a),
            'name_asc': (a, b) => (a.name || '').localeCompare(b.name || '')
        };
        if (sorters[state.sortBy]) coins.sort(sorters[state.sortBy]);
    }

    state.filteredCoins = coins;
    renderCoins();
}

// ============================================================
// REFRESH PRICES (Polling)
// ============================================================
async function refreshPrices() {
    if (state.coins.length === 0) return;

    try {
        // آپدیت CoinStats (هر ۵ ثانیه سبک‌تر از WS)
        const res = await API.getCoins(250);
        if (!res.success || !Array.isArray(res.data)) return;

        const updates = {};
        res.data.forEach(c => {
            if (c.id) {
                updates[c.id] = {
                    price: parseFloat(c.price) || 0,
                    change: parseFloat(c.priceChange1d) || 0,
                };
            }
        });

        // آپدیت state
        state.coins.forEach(coin => {
            if (updates[coin.id]) {
                coin.price = updates[coin.id].price;
                coin.priceChange1d = updates[coin.id].change;
            }
        });

        // آپدیت DOM (بدون re-render کامل)
        document.querySelectorAll('[data-price-symbol]').forEach(el => {
            const sym = el.dataset.priceSymbol;
            const coin = state.coins.find(c => c.symbol === sym);
            if (!coin) return;

            const oldPrice = parseFloat(el.dataset.price || '0');
            const newPrice = coin.price;

            if (Math.abs(newPrice - oldPrice) > 0.000001) {
                el.classList.remove('flash-up', 'flash-down');
                void el.offsetWidth;
                el.classList.add(newPrice > oldPrice ? 'flash-up' : 'flash-down');
            }
            el.textContent = formatCurrency(newPrice);
            el.dataset.price = newPrice;
        });

        // آپدیت بازار (هر ۵ دقیقه)
        // ... (توی تایمر جدا انجام می‌شه)
    } catch (e) {
        // silent
    }
}

// ============================================================
// PRESET BAR
// ============================================================
function setupPresetBar() {
    $$('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            $$('.preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.preset = btn.dataset.preset;
            applyFilters();
        });
    });
}

// ============================================================
// VIEW TOGGLE
// ============================================================
function setupViewToggle() {
    $$('.view-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            $$('.view-toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.viewMode = btn.dataset.view;
            saveViewMode();
            renderCoins();
        });
    });
}

// ============================================================
// SORT HEADERS
// ============================================================
function setupSortHeaders() {
    $$('.coins-table th.sortable').forEach(th => {
        th.addEventListener('click', () => {
            const key = th.dataset.sort;
            const map = {
                rank: 'rank_asc',
                name: 'name_asc',
                price: 'price_desc',
                change: 'change_desc',
                change7d: 'change_desc',
                change30d: 'change_desc',
                volume: 'volume_desc',
                marketcap: 'marketcap_desc',
                atr: 'atr_desc'
            };
            const newSort = map[key] || 'rank_asc';
            state.sortBy = newSort;
            state.preset = 'all';
            $$('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset === 'all'));
            $('#sortSelect').value = newSort;

            $$('.coins-table th.sortable').forEach(t => {
                t.classList.remove('active');
                const ic = t.querySelector('.sort-icon');
                if (ic) ic.textContent = '▼';
            });
            th.classList.add('active');

            applyFilters();
        });
    });
}

// ============================================================
// EVENTS
// ============================================================
function setupEvents() {
    // Search
    let searchTimer;
    $('#searchInput')?.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            state.searchQuery = e.target.value.trim();
            applyFilters();
        }, 250);
    });

    // Sort select
    $('#sortSelect')?.addEventListener('change', (e) => {
        state.sortBy = e.target.value;
        state.preset = 'all';
        $$('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset === 'all'));
        applyFilters();
    });

    setupPresetBar();
    setupViewToggle();
    setupSortHeaders();

    // Message listener از shell مادر
    window.addEventListener('message', (e) => {
        if (e.data?.type === 'theme-changed') {
            // اعمال تم جدید اگه لازمه
            const theme = e.data.theme;
            if (theme) document.documentElement.setAttribute('data-theme', theme);
            const color = e.data.color;
            if (color) document.documentElement.setAttribute('data-color', color);
        }
        if (e.data?.type === 'refresh') {
            refreshAll();
        }
    });
}

// ============================================================
// REFRESH ALL
// ============================================================
async function refreshAll() {
    showToast('در حال بروزرسانی...', 'info', 1500);
    await Promise.allSettled([
        loadCoins(),
        loadMarketWidgets(),
    ]);
    applyFilters();
    showToast('بروزرسانی شد', 'success', 1500);
}

// ============================================================
// INIT
// ============================================================
async function init() {
    console.log('%c 📊 Market Tab ', 'background: linear-gradient(135deg, #06b6d4, #6366f1); color: white; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 12px;');

    loadWatchlist();
    loadViewMode();

    // تنظیم ویو اولیه
    if (state.viewMode === 'card') {
        $$('.view-toggle-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.view === 'card');
        });
    }

    // همگام‌سازی تم با parent
    try {
        const parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
        const parentColor = window.parent.document.documentElement.getAttribute('data-color');
        if (parentTheme) document.documentElement.setAttribute('data-theme', parentTheme);
        if (parentColor) document.documentElement.setAttribute('data-color', parentColor);
    } catch (e) {
        // از localStorage استفاده کن
        const theme = localStorage.getItem('app_theme') || 'dark';
        const color = localStorage.getItem('app_color') || 'indigo';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-color', color);
    }

    // بارگذاری موازی
    await Promise.allSettled([
        loadCoins(),
        loadMarketWidgets(),
    ]);

    state.isLoading = false;

    // رندر
    setupEvents();
    applyFilters();

    // تایمر آپدیت قیمت‌ها
    if (state.priceUpdateTimer) clearInterval(state.priceUpdateTimer);
    state.priceUpdateTimer = setInterval(refreshPrices, CONFIG.PRICE_UPDATE_INTERVAL);

    // تایمر آپدیت بازار (هر ۵ دقیقه)
    if (state.insightsTimer) clearInterval(state.insightsTimer);
    state.insightsTimer = setInterval(loadMarketWidgets, CONFIG.INSIGHTS_UPDATE_INTERVAL);

    console.log('✅ Market ready:', state.coins.length, 'coins');
}

// ============================================================
// BOOT
// ============================================================
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

// Cleanup
window.__marketCleanup = function() {
    if (state.priceUpdateTimer) clearInterval(state.priceUpdateTimer);
    if (state.insightsTimer) clearInterval(state.insightsTimer);
    window.__analyzerMarketLoaded = false;
};

})();

</script>
