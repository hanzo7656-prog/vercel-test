<!-- ============================================================
     analyzer_tabs/predict.html — تب پیش‌بینی
     نسخه ۳.۰ — با init/cleanup استاندارد + api.js هماهنگ
     ============================================================ -->

<div class="card">
    <!-- ====================================================
         Header
         ==================================================== -->
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-wand-magic-sparkles"></i>
            <span>پیش‌بینی لحظه‌ای</span>
        </div>

        <div class="header-actions">
            <span class="status-badge" id="apiStatus">
                <span class="status-indicator" style="background: var(--text-muted);"></span>
                <span class="status-text">در حال بررسی...</span>
            </span>

            <span class="status-badge" id="predictStatus">
                <span class="status-indicator" style="background: var(--text-muted);"></span>
                <span class="status-text">آماده</span>
            </span>

            <button class="btn btn-xs btn-outline" onclick="refreshPredictCoins()" title="بروزرسانی">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- ====================================================
         Toolbar
         ==================================================== -->
    <div class="predict-toolbar">
        <div class="predict-search">
            <input
                type="text"
                id="coinSearch"
                class="form-input"
                placeholder="جستجو در ارزها..."
                oninput="debouncedFilterPredictCoins()">
            <span class="search-icon">🔍</span>
        </div>

        <select id="sortFilter" class="form-select" onchange="filterPredictCoins()">
            <option value="rank_asc">📊 رتبه (صعودی)</option>
            <option value="rank_desc">📊 رتبه (نزولی)</option>
            <option value="name_asc">🔤 نام</option>
            <option value="price_desc">💰 قیمت (بیشترین)</option>
            <option value="change_desc">📈 بیشترین تغییر</option>
            <option value="change_asc">📉 کمترین تغییر</option>
        </select>

        <select id="changeFilter" class="form-select" onchange="filterPredictCoins()">
            <option value="all">🔄 همه</option>
            <option value="positive">📈 مثبت</option>
            <option value="negative">📉 منفی</option>
            <option value="high">🔥 بیش از ۵٪</option>
        </select>

        <div class="predict-counters">
            <span class="counter-badge" id="coinCount">
                <i class="fas fa-coins"></i>
                <span>۰</span>
            </span>
            <span class="counter-badge live" id="apiPriceCount" style="display:none;">
                <i class="fas fa-bolt"></i>
                <span>۰</span>
            </span>
        </div>
    </div>

    <!-- ====================================================
         Coins Grid
         ==================================================== -->
    <div id="coinsGrid" class="predict-coins-grid">
        <div class="predict-skeleton"></div>
        <div class="predict-skeleton"></div>
        <div class="predict-skeleton"></div>
        <div class="predict-skeleton"></div>
        <div class="predict-skeleton"></div>
        <div class="predict-skeleton"></div>
    </div>

    <!-- ====================================================
         Selected Indicator
         ==================================================== -->
    <div id="selectedIndicator" class="predict-selected">
        <span class="check-icon">✓</span>
        <span>ارز انتخاب شده:</span>
        <span class="coin-label" id="selectedCoinName">—</span>
        <span class="hint">(برای پیش‌بینی کلیک کنید)</span>
    </div>

    <!-- ====================================================
         Result Card
         ==================================================== -->
    <div id="predictResult" class="predict-result">
        <div class="predict-result-content">

            <!-- Signal Circle -->
            <div class="signal-circle neutral" id="signalCircle">
                <span class="signal-emoji">⏳</span>
                <span class="signal-label">در انتظار</span>
            </div>

            <!-- Details -->
            <div class="predict-details">
                <div class="predict-detail">
                    <div class="pd-label">قیمت</div>
                    <div class="pd-value cyan" id="resultPrice">—</div>
                </div>
                <div class="predict-detail">
                    <div class="pd-label">اطمینان</div>
                    <div class="pd-value" id="resultConfidence">—</div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill" style="width:0%"></div>
                    </div>
                </div>
                <div class="predict-detail">
                    <div class="pd-label">مدل</div>
                    <div class="pd-value purple" id="resultMode">—</div>
                </div>
                <div class="predict-detail">
                    <div class="pd-label">سیگنال</div>
                    <div class="pd-value" id="resultSignalType">—</div>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div class="predict-result-desc" id="resultDetail">
            در انتظار پیش‌بینی...
        </div>

        <!-- Footer -->
        <div class="predict-result-footer">
            <div class="timestamp">
                <i class="fas fa-clock"></i>
                <span id="resultTime">—</span>
            </div>
            <span class="source-badge" id="resultSource">مدل پیش‌بینی</span>
        </div>
    </div>

    <!-- ====================================================
         API Stats
         ==================================================== -->
    <div id="apiStats" class="predict-api-stats">
        <div class="api-stats-grid">
            <div class="api-stat">
                <div class="as-label">وضعیت</div>
                <div class="as-value" id="statConnection">—</div>
            </div>
            <div class="api-stat">
                <div class="as-label">نمادها</div>
                <div class="as-value cyan" id="statSymbols">—</div>
            </div>
            <div class="api-stat">
                <div class="as-label">پیام‌ها</div>
                <div class="as-value" id="statMessages">—</div>
            </div>
            <div class="api-stat">
                <div class="as-label">Fallback</div>
                <div class="as-value orange" id="statFallback">—</div>
            </div>
            <div class="api-stat">
                <div class="as-label">آخرین بروزرسانی</div>
                <div class="as-value" id="statLastUpdate">—</div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// PREDICT TAB v3.0
// ============================================================

let _predictCoins = [];
let _predictFiltered = [];
let _predictSelectedCoinId = null;
let _predictPriceInterval = null;
let _predictApiStatsInterval = null;
let _predictDebounceTimer = null;
let _predictAbortController = null;
let _predictIsLoading = false;
let _predictInitialized = false;

// ============================================================
// Init
// ============================================================

window.init_predict = async function() {
    console.log('🔮 Predict tab initializing...');

    if (_predictInitialized) return;
    _predictInitialized = true;

    await loadPredictCoins();
};

// ============================================================
// Cleanup
// ============================================================

window.cleanup_predict = function() {
    console.log('🧹 Predict tab cleaning up...');

    if (_predictPriceInterval) {
        clearInterval(_predictPriceInterval);
        _predictPriceInterval = null;
    }
    if (_predictApiStatsInterval) {
        clearInterval(_predictApiStatsInterval);
        _predictApiStatsInterval = null;
    }
    if (_predictDebounceTimer) {
        clearTimeout(_predictDebounceTimer);
        _predictDebounceTimer = null;
    }
    if (_predictAbortController) {
        _predictAbortController.abort();
        _predictAbortController = null;
    }

    _predictInitialized = false;
};

// ============================================================
// Load Coins
// ============================================================

async function loadPredictCoins() {
    const grid = document.getElementById('coinsGrid');
    if (!grid) return;

    showPredictSkeleton(grid);

    try {
        await checkPredictApiHealth();

        // ✅ api.getCoinsList() (موجود در api.js)
        const data = await window.api?.getCoinsList?.({ limit: 100 });

        if (!data?.success || !data.data || data.data.length === 0) {
            showPredictEmpty(grid, 'empty');
            return;
        }

        _predictCoins = data.data;
        _predictFiltered = [..._predictCoins];

        // بازیابی آخرین انتخاب
        const savedCoinId = localStorage.getItem('lastPredictedCoin');
        let defaultCoin = null;

        if (savedCoinId) {
            defaultCoin = _predictCoins.find(c => c.id === savedCoinId);
        }
        if (!defaultCoin) {
            defaultCoin = _predictCoins.find(c => c.id === 'bitcoin') || _predictCoins[0];
        }

        if (defaultCoin) {
            _predictSelectedCoinId = defaultCoin.id;
            updatePredictSelectedIndicator(defaultCoin);
        }

        renderPredictCoins();
        updatePredictCoinCount();

        // ✅ api.getRealtimePrices() (موجود در api.js)
        await updatePredictPrices();

        // پیش‌بینی خودکار
        if (_predictSelectedCoinId) {
            setTimeout(() => predictCoin(_predictSelectedCoinId), 500);
        }

        // Auto-refresh prices
        _predictPriceInterval = setInterval(() => {
            const activeTab = document.querySelector('#analyzerTabs .analyzer-tab-btn.active');
            if (activeTab?.dataset.tab === 'predict') {
                updatePredictPrices();
            }
        }, 12000);

        // Auto-refresh API stats
        _predictApiStatsInterval = setInterval(() => {
            const activeTab = document.querySelector('#analyzerTabs .analyzer-tab-btn.active');
            if (activeTab?.dataset.tab === 'predict') {
                checkPredictApiHealth();
            }
        }, 20000);

    } catch (error) {
        console.error('❌ Load predict coins error:', error);
        showPredictEmpty(grid, 'error', error.message);
    }
}

// ============================================================
// API Health
// ============================================================

async function checkPredictApiHealth() {
    try {
        // ✅ api.getCryptoStats() (موجود در api.js)
        const stats = await window.api?.getCryptoStats?.();

        if (!stats?.success || !stats.data) {
            updatePredictStatus('apiStatus', 'unknown', 'وضعیت نامشخص');
            return;
        }

        const data = stats.data;
        const ws = data.websocket || {};
        const pm = data.price_manager || {};

        let status = 'unknown';
        let text = 'وضعیت نامشخص';

        if (ws.connected === true) {
            status = 'online';
            text = 'متصل (FreeCrypto)';
        } else if (pm.is_running && pm.last_update) {
            status = 'warning';
            text = 'Fallback (CoinStats)';
        } else {
            status = 'offline';
            text = 'قطع';
        }

        updatePredictStatus('apiStatus', status, text);
        updatePredictApiStatsPanel(data);

    } catch (e) {
        console.warn('checkPredictApiHealth error:', e);
        updatePredictStatus('apiStatus', 'offline', 'خطا در بررسی');
    }
}

function updatePredictStatus(elementId, status, text) {
    const badge = document.getElementById(elementId);
    if (!badge) return;

    const statusColors = {
        online: 'var(--color-green)',
        warning: 'var(--color-orange)',
        offline: 'var(--color-red)',
        unknown: 'var(--text-muted)',
    };

    const indicator = badge.querySelector('.status-indicator');
    const textEl = badge.querySelector('.status-text');

    if (indicator) {
        indicator.style.background = statusColors[status] || statusColors.unknown;
    }
    if (textEl) {
        textEl.textContent = text;
    }
}

function updatePredictApiStatsPanel(data) {
    const panel = document.getElementById('apiStats');
    if (!panel) return;

    panel.classList.add('active');

    const ws = data.websocket || {};
    const pm = data.price_manager || {};

    const statConn = document.getElementById('statConnection');
    if (statConn) {
        const isConnected = ws.connected === true;
        statConn.textContent = isConnected ? '✅ متصل' : '⚠️ Fallback';
        statConn.className = 'as-value ' + (isConnected ? 'green' : 'orange');
    }

    setText('statSymbols', ws.symbols_count || 0);
    setText('statMessages', ws.messages_received || 0);
    setText('statFallback', pm.fallback_count || 0);

    const statLast = document.getElementById('statLastUpdate');
    if (statLast && pm.last_update) {
        const ts = typeof pm.last_update === 'number'
            ? pm.last_update * 1000
            : new Date(pm.last_update).getTime();
        statLast.textContent = (typeof formatTimeAgo === 'function')
            ? formatTimeAgo(new Date(ts))
            : '—';
    }
}

// ============================================================
// Update Prices
// ============================================================

async function updatePredictPrices() {
    try {
        const symbols = _predictCoins
            .slice(0, 30)
            .map(c => (c.symbol || '').toUpperCase())
            .filter(Boolean);

        if (symbols.length === 0) return;

        // ✅ api.getRealtimePrices() (موجود در api.js)
        const data = await window.api?.getRealtimePrices?.(symbols);

        if (!data?.success || !data.data) return;

        let updatedCount = 0;

        symbols.forEach(symbol => {
            const priceData = data.data[symbol];
            if (!priceData || !priceData.price) return;

            const price = priceData.price;
            if (price <= 0) return;

            const el = document.querySelector(`.pc-price[data-symbol="${symbol}"]`);
            if (!el) return;

            const oldPrice = parseFloat(el.dataset.price || '0');
            const newPrice = parseFloat(price);

            if (oldPrice > 0 && newPrice !== oldPrice) {
                el.classList.remove('flash-up', 'flash-down');
                void el.offsetWidth;
                el.classList.add(newPrice > oldPrice ? 'flash-up' : 'flash-down');
            }

            el.textContent = formatCurrency(price);
            el.dataset.price = price;
            updatedCount++;
        });

        const counter = document.getElementById('apiPriceCount');
        if (counter) {
            counter.style.display = 'inline-flex';
            const countSpan = counter.querySelector('span');
            if (countSpan) countSpan.textContent = updatedCount;
        }
    } catch (error) {
        console.warn('updatePredictPrices error:', error.message);
    }
}

// ============================================================
// Render Coins
// ============================================================

function renderPredictCoins() {
    const grid = document.getElementById('coinsGrid');
    if (!grid) return;

    if (_predictFiltered.length === 0) {
        grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
                <span class="empty-icon">🔍</span>
                <div class="empty-title">نتیجه‌ای یافت نشد</div>
                <div class="empty-message">فیلتر یا جستجو را تغییر دهید</div>
            </div>
        `;
        return;
    }

    grid.innerHTML = _predictFiltered.map((coin, i) => {
        const isSelected = _predictSelectedCoinId === coin.id;
        const change = coin.priceChange1d || 0;
        const changeCls = change > 0 ? 'up' : change < 0 ? 'down' : 'neutral';
        const changeText = (change > 0 ? '+' : '') + change.toFixed(2) + '%';
        const price = coin.price || 0;
        const symbol = (coin.symbol || coin.id.toUpperCase().slice(0, 4)).toUpperCase();
        const name = escapePredictHtml(coin.name || coin.id);
        const rank = coin.rank || '—';

        return `
            <div class="predict-coin ${isSelected ? 'selected' : ''}"
                 data-coin-id="${escapePredictAttr(coin.id)}"
                 style="animation-delay:${Math.min(i * 0.02, 0.4)}s;"
                 onclick="predictCoin('${escapePredictAttr(coin.id)}')">
                <div class="pc-symbol">
                    ${coin.icon ? `<img src="${escapePredictAttr(coin.icon)}" onerror="this.style.display='none'" alt="${symbol}">` : ''}
                    <span>${escapePredictHtml(symbol)}</span>
                </div>
                <div class="pc-name">${name}</div>
                <div class="pc-price" data-symbol="${symbol}" data-price="${price}">
                    ${formatCurrency(price)}
                </div>
                <div class="pc-change ${changeCls}">${changeText}</div>
                <div class="pc-rank">#${rank}</div>
            </div>
        `;
    }).join('');
}

// ============================================================
// Filter
// ============================================================

function filterPredictCoins() {
    const search = (document.getElementById('coinSearch')?.value || '').toLowerCase().trim();
    const sort = document.getElementById('sortFilter')?.value || 'rank_asc';
    const changeFilter = document.getElementById('changeFilter')?.value || 'all';

    _predictFiltered = _predictCoins.filter(coin => {
        const name = (coin.name || '').toLowerCase();
        const symbol = (coin.symbol || '').toLowerCase();
        const id = (coin.id || '').toLowerCase();
        return name.includes(search) || symbol.includes(search) || id.includes(search);
    });

    if (changeFilter === 'positive') {
        _predictFiltered = _predictFiltered.filter(c => (c.priceChange1d || 0) > 0);
    } else if (changeFilter === 'negative') {
        _predictFiltered = _predictFiltered.filter(c => (c.priceChange1d || 0) < 0);
    } else if (changeFilter === 'high') {
        _predictFiltered = _predictFiltered.filter(c => (c.priceChange1d || 0) > 5);
    }

    const sortFns = {
        rank_asc: (a, b) => (a.rank || 999) - (b.rank || 999),
        rank_desc: (a, b) => (b.rank || 0) - (a.rank || 0),
        name_asc: (a, b) => (a.name || '').localeCompare(b.name || ''),
        price_desc: (a, b) => (b.price || 0) - (a.price || 0),
        change_desc: (a, b) => (b.priceChange1d || 0) - (a.priceChange1d || 0),
        change_asc: (a, b) => (a.priceChange1d || 0) - (b.priceChange1d || 0),
    };

    if (sortFns[sort]) _predictFiltered.sort(sortFns[sort]);

    updatePredictCoinCount();
    renderPredictCoins();
}

function debouncedFilterPredictCoins() {
    if (_predictDebounceTimer) clearTimeout(_predictDebounceTimer);
    _predictDebounceTimer = setTimeout(filterPredictCoins, 250);
}

function updatePredictCoinCount() {
    const el = document.getElementById('coinCount');
    if (el) {
        const span = el.querySelector('span');
        if (span) span.textContent = _predictFiltered.length;
    }
}

// ============================================================
// Predict
// ============================================================

async function predictCoin(coinId) {
    if (!coinId) return;

    if (_predictIsLoading && _predictAbortController) {
        _predictAbortController.abort();
    }

    _predictSelectedCoinId = coinId;
    localStorage.setItem('lastPredictedCoin', coinId);

    const coin = _predictCoins.find(c => c.id === coinId);
    if (coin) updatePredictSelectedIndicator(coin);

    renderPredictCoins();

    _predictIsLoading = true;
    updatePredictStatus('predictStatus', 'unknown', 'در حال پیش‌بینی...');
    showPredictLoading(coin);

    _predictAbortController = new AbortController();

    try {
        // ✅ api.predictSingle() (موجود در api.js)
        const data = await window.api?.predictSingle?.(coinId, '24h');

        if (!data?.success || !data.data) {
            throw new Error(data?.error || 'پیش‌بینی ناموفق');
        }

        showPredictResult(data.data);
        updatePredictStatus('predictStatus', 'online', 'پیش‌بینی شد');

    } catch (error) {
        if (error.name === 'AbortError') return;

        console.error('❌ Predict error:', error);
        showPredictError(error.message || 'خطا در پیش‌بینی');
        updatePredictStatus('predictStatus', 'offline', 'خطا');
    } finally {
        _predictIsLoading = false;
        _predictAbortController = null;
    }
}

function updatePredictSelectedIndicator(coin) {
    const indicator = document.getElementById('selectedIndicator');
    const nameEl = document.getElementById('selectedCoinName');

    if (indicator && nameEl) {
        indicator.classList.add('active');
        nameEl.textContent = `${coin.symbol || ''} - ${coin.name || ''}`;
    }
}

// ============================================================
// Show Result
// ============================================================

function showPredictLoading(coin) {
    const result = document.getElementById('predictResult');
    if (!result) return;

    result.classList.add('active');
    result.className = 'predict-result active';

    const circle = document.getElementById('signalCircle');
    if (circle) {
        circle.className = 'signal-circle neutral';
        const emoji = circle.querySelector('.signal-emoji');
        const label = circle.querySelector('.signal-label');
        if (emoji) emoji.textContent = '⏳';
        if (label) label.textContent = 'تحلیل';
    }

    setText('resultPrice', coin ? formatCurrency(coin.price) : '—');
    setText('resultConfidence', '—');
    setText('resultMode', '—');
    setText('resultSignalType', '—');
    setText('resultDetail', 'در حال دریافت داده از مدل...');
    setText('resultTime', '—');

    const fill = document.getElementById('confidenceFill');
    if (fill) fill.style.width = '0%';
}

function showPredictResult(d) {
    const result = document.getElementById('predictResult');
    if (!result) return;

    const signalType = d.signal_type || 'NEUTRAL';

    const config = {
        BUY: { emoji: '🟢', label: 'خرید', cls: 'buy', color: 'green' },
        SELL: { emoji: '🔴', label: 'فروش', cls: 'sell', color: 'red' },
        NEUTRAL: { emoji: '🟡', label: 'خنثی', cls: 'neutral', color: 'orange' },
    };

    const cfg = config[signalType] || config.NEUTRAL;

    result.className = `predict-result active signal-${cfg.cls}`;

    const circle = document.getElementById('signalCircle');
    if (circle) {
        circle.className = `signal-circle ${cfg.cls}`;
        const emoji = circle.querySelector('.signal-emoji');
        const label = circle.querySelector('.signal-label');
        if (emoji) emoji.textContent = cfg.emoji;
        if (label) label.textContent = cfg.label;
    }

    setText('resultPrice', formatCurrency(d.current_price));

    const confidence = parseInt(d.confidence) || 0;
    const confEl = document.getElementById('resultConfidence');
    if (confEl) {
        confEl.textContent = confidence + '%';
        confEl.className = 'pd-value ' + (confidence > 60 ? 'green' : 'orange');
    }

    const fill = document.getElementById('confidenceFill');
    if (fill) fill.style.width = confidence + '%';

    setText('resultMode', d.model_mode || 'DEMO');

    const sigTypeEl = document.getElementById('resultSignalType');
    if (sigTypeEl) {
        sigTypeEl.textContent = signalType;
        sigTypeEl.className = 'pd-value ' + cfg.color;
    }

    setText('resultDetail', d.signal || 'سیگنال ثبت شده');
    setText('resultTime', formatDate(d.timestamp) || '—');
    setText('resultSource', `مدل ${d.model_mode || 'DEMO'}`);
}

function showPredictError(message) {
    const result = document.getElementById('predictResult');
    if (!result) return;

    result.classList.add('active');
    result.className = 'predict-result active';

    const circle = document.getElementById('signalCircle');
    if (circle) {
        circle.className = 'signal-circle sell';
        const emoji = circle.querySelector('.signal-emoji');
        const label = circle.querySelector('.signal-label');
        if (emoji) emoji.textContent = '❌';
        if (label) label.textContent = 'خطا';
    }

    setText('resultDetail', message);

    const sigTypeEl = document.getElementById('resultSignalType');
    if (sigTypeEl) {
        sigTypeEl.textContent = 'خطا';
        sigTypeEl.className = 'pd-value red';
    }
}

// ============================================================
// Refresh
// ============================================================

async function refreshPredictCoins() {
    if (typeof showToast === 'function') showToast('🔄 بروزرسانی...', 'info', 1500);

    if (_predictPriceInterval) {
        clearInterval(_predictPriceInterval);
        _predictPriceInterval = null;
    }
    if (_predictApiStatsInterval) {
        clearInterval(_predictApiStatsInterval);
        _predictApiStatsInterval = null;
    }

    _predictInitialized = false;
    await loadPredictCoins();
    _predictInitialized = true;
}

// ============================================================
// Helpers
// ============================================================

function showPredictSkeleton(grid) {
    grid.innerHTML = Array(6).fill('').map((_, i) => `
        <div class="predict-skeleton" style="animation-delay:${i * 0.05}s;"></div>
    `).join('');
}

function showPredictEmpty(grid, type, message) {
    const icon = type === 'error' ? '❌' : '📭';
    const title = type === 'error' ? 'خطا در بارگذاری' : 'هیچ ارزی یافت نشد';

    grid.innerHTML = `
        <div class="empty-state ${type}" style="grid-column:1/-1;">
            <span class="empty-icon">${icon}</span>
            <div class="empty-title">${title}</div>
            ${message ? `<div class="empty-message">${escapePredictHtml(message)}</div>` : ''}
            <button class="empty-action" onclick="loadPredictCoins()">
                <i class="fas fa-sync-alt"></i>
                تلاش مجدد
            </button>
        </div>
    `;
}

function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value ?? '—';
}

function escapePredictHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapePredictAttr(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}
