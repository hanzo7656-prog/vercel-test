<!-- ============================================================
     PREDICT TAB - پیش‌بینی لحظه‌ای با WebSocket
     ============================================================ -->

<div class="card">
    <div class="card-title">
        <i class="fas fa-wand-magic-sparkles"></i> پیش‌بینی لحظه‌ای
        <div style="display:flex;align-items:center;gap:8px;margin-right:auto;">
            <span class="badge" id="wsStatus" style="font-size:0.55rem;padding:2px 10px;background:var(--bg-input);color:var(--text-muted);border:1px solid var(--border-color);">
                <i class="fas fa-circle" style="color:var(--accent-orange);font-size:0.4rem;"></i> در حال اتصال...
            </span>
            <span class="badge" id="predictStatus" style="font-size:0.55rem;padding:2px 10px;background:var(--bg-input);color:var(--text-muted);border:1px solid var(--border-color);">
                ✅ آماده
            </span>
            <button class="btn btn-xs btn-outline" onclick="refreshCoins()" style="padding:2px 10px;font-size:0.6rem;">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- ===== TOOLBAR: Search + Filters ===== -->
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:8px 12px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;">
            <div style="position:relative;flex:1;min-width:150px;">
                <input type="text" id="coinSearch" placeholder="🔍 جستجو در ارزها..." onkeyup="filterCoins()" style="width:100%;padding:6px 12px;padding-right:30px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.75rem;font-family:inherit;">
                <span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.7rem;">🔍</span>
            </div>
            <select id="sortFilter" onchange="filterCoins()" style="padding:6px 10px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.7rem;font-family:inherit;">
                <option value="rank_asc">📊 رتبه (صعودی)</option>
                <option value="rank_desc">📊 رتبه (نزولی)</option>
                <option value="name_asc">🔤 نام (الفبا)</option>
                <option value="name_desc">🔤 نام (الفبا معکوس)</option>
                <option value="price_asc">💰 قیمت (کمترین)</option>
                <option value="price_desc">💰 قیمت (بیشترین)</option>
                <option value="change_desc">📈 بیشترین تغییر</option>
                <option value="change_asc">📉 کمترین تغییر</option>
            </select>
            <select id="changeFilter" onchange="filterCoins()" style="padding:6px 10px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.7rem;font-family:inherit;">
                <option value="all">🔄 همه</option>
                <option value="positive">📈 مثبت</option>
                <option value="negative">📉 منفی</option>
                <option value="high">🔥 بیش از ۵٪</option>
            </select>
        </div>
        <div style="display:flex;gap:12px;font-size:0.6rem;color:var(--text-muted);">
            <span id="coinCount">۰ ارز</span>
            <span id="wsPriceCount" style="color:var(--accent-cyan);">⚡ ۰</span>
        </div>
    </div>

    <!-- ===== COINS GRID ===== -->
    <div id="coinsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-height:400px;overflow-y:auto;padding:4px 2px;" class="custom-scroll">
        <div class="loading-container" style="padding:30px;grid-column:1/-1;">
            <div class="loading-spinner" style="width:28px;height:28px;"></div>
            <p class="loading-text" style="font-size:0.8rem;">در حال بارگذاری ارزها...</p>
        </div>
    </div>

    <!-- ===== SELECTED COIN INDICATOR ===== -->
    <div id="selectedIndicator" style="display:none;margin-top:10px;padding:6px 14px;background:rgba(0,212,255,0.06);border-radius:var(--radius-sm);border:1px solid rgba(0,212,255,0.08);font-size:0.7rem;color:var(--text-secondary);">
        <i class="fas fa-check-circle" style="color:var(--accent-green);"></i>
        ارز انتخاب شده: <span id="selectedCoinName" style="color:var(--text-primary);font-weight:600;">—</span>
        <span style="color:var(--text-muted);font-size:0.6rem;">(برای پیش‌بینی کلیک کنید)</span>
    </div>

    <!-- ===== RESULT ===== -->
    <div id="predictResult" style="display:none;margin-top:16px;padding:16px 20px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-input);">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <div>
                <div style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">نتیجه پیش‌بینی</div>
                <div style="font-size:1.1rem;font-weight:700;" id="resultSignal">—</div>
                <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px;" id="resultDetail">—</div>
            </div>
            <div style="display:flex;gap:16px;">
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">قیمت</div>
                    <div style="font-size:0.9rem;font-weight:600;color:var(--accent-cyan);font-family:var(--font-mono);" id="resultPrice">—</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">اطمینان</div>
                    <div style="font-size:0.9rem;font-weight:600;font-family:var(--font-mono);" id="resultConfidence">—</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">مدل</div>
                    <div style="font-size:0.9rem;font-weight:600;color:var(--accent-purple);font-family:var(--font-mono);" id="resultMode">—</div>
                </div>
            </div>
        </div>
        <div style="margin-top:8px;font-size:0.6rem;color:var(--text-muted);" id="resultTime">—</div>
    </div>

    <!-- ===== WebSocket Stats ===== -->
    <div id="wsStats" style="display:none;margin-top:10px;padding:6px 14px;background:rgba(0,0,0,0.2);border-radius:var(--radius-sm);border:1px solid var(--border-color);font-size:0.55rem;color:var(--text-muted);">
        <span id="wsStatsText">🔄 در حال دریافت آمار...</span>
    </div>
</div>

<script>
// ============================================================
// PREDICT TAB - با WebSocket و بروزرسانی لحظه‌ای
// ============================================================

let allCoins = [];
let filteredCoins = [];
let selectedCoinId = null;
let isPredictLoading = false;
let priceUpdateCount = 0;
let wsConnected = false;

// Intervals
let wsInterval = null;
let heartbeatInterval = null;
let statsInterval = null;
let isPredictLoaded = false;

// ============================================================
// ۱. بارگذاری لیست ارزها
// ============================================================

async function loadCoins() {
    const grid = document.getElementById('coinsGrid');
    grid.innerHTML = `
        <div class="loading-container" style="padding:30px;grid-column:1/-1;">
            <div class="loading-spinner" style="width:28px;height:28px;"></div>
            <p class="loading-text" style="font-size:0.8rem;">در حال بارگذاری ارزها...</p>
        </div>
    `;

    try {
        const data = await api.getCoinsList({ limit: 100 });
        
        if (data.success && data.data) {
            allCoins = data.data;
            filteredCoins = [...allCoins];
            document.getElementById('coinCount').textContent = allCoins.length + ' ارز';
            
            // انتخاب پیش‌فرض هوشمند
            const defaultCoin = await getDefaultPredictCoin(allCoins);
            selectedCoinId = defaultCoin;
            
            renderCoins();
            
            // هایلایت انتخاب شده
            const indicator = document.getElementById('selectedIndicator');
            const selectedName = document.getElementById('selectedCoinName');
            const coin = allCoins.find(c => c.id === defaultCoin);
            if (coin) {
                selectedName.textContent = coin.symbol + ' - ' + coin.name;
                indicator.style.display = 'block';
            }
            
            // خودکار پیش‌بینی کن
            setTimeout(() => predictCoin(defaultCoin), 300);
            
            // شروع WebSocket
            startWebSocketUpdates();
            
        } else {
            grid.innerHTML = `
                <div style="text-align:center;padding:30px;color:var(--text-muted);grid-column:1/-1;">
                    <span style="font-size:2rem;display:block;margin-bottom:8px;">📭</span>
                    <p>هیچ ارزی یافت نشد</p>
                    <button class="btn btn-primary btn-sm" onclick="loadCoins()" style="margin-top:8px;padding:4px 16px;font-size:0.7rem;">
                        <i class="fas fa-sync-alt"></i> تلاش مجدد
                    </button>
                </div>
            `;
        }
    } catch (error) {
        console.error('Load coins error:', error);
        grid.innerHTML = `
            <div style="text-align:center;padding:30px;color:var(--accent-red);grid-column:1/-1;">
                <span style="font-size:2rem;display:block;margin-bottom:8px;">❌</span>
                <p>خطا در دریافت لیست ارزها</p>
                <button class="btn btn-primary btn-sm" onclick="loadCoins()" style="margin-top:8px;padding:4px 16px;font-size:0.7rem;">
                    <i class="fas fa-sync-alt"></i> تلاش مجدد
                </button>
            </div>
        `;
    }
}

// ============================================================
// ۲. رندر کارت‌های ارزها
// ============================================================

function renderCoins() {
    const grid = document.getElementById('coinsGrid');
    
    if (filteredCoins.length === 0) {
        grid.innerHTML = `
            <div style="text-align:center;padding:30px;color:var(--text-muted);grid-column:1/-1;">
                <span style="font-size:2rem;display:block;margin-bottom:8px;">🔍</span>
                <p>هیچ ارزی با این جستجو یافت نشد</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = filteredCoins.map(coin => {
        const isSelected = selectedCoinId === coin.id;
        const change = coin.priceChange1d || 0;
        const changeColor = change > 0 ? 'var(--accent-green)' : change < 0 ? 'var(--accent-red)' : 'var(--text-muted)';
        const changeText = (change > 0 ? '+' : '') + change.toFixed(2) + '%';
        const price = coin.price || 0;
        const symbol = coin.symbol || coin.id.toUpperCase().slice(0, 4);
        const name = coin.name || coin.id;
        
        return `
            <div class="coin-card" 
                 data-coin-id="${coin.id}"
                 data-symbol="${symbol}"
                 onclick="predictCoin('${coin.id}')"
                 style="background:${isSelected ? 'rgba(0,212,255,0.08)' : 'var(--bg-input)'};
                        border:2px solid ${isSelected ? 'var(--accent-cyan)' : 'var(--border-color)'};
                        border-radius:var(--radius-sm);
                        padding:12px 14px;
                        cursor:pointer;
                        transition:all 0.25s ease;
                        text-align:center;
                        position:relative;
                        ${isSelected ? 'box-shadow:0 0 30px rgba(0,212,255,0.08);' : ''}
                        "
                 onmouseover="this.style.borderColor='var(--border-hover)';this.style.transform='translateY(-2px)';"
                 onmouseout="this.style.borderColor='${isSelected ? 'var(--accent-cyan)' : 'var(--border-color)'}';this.style.transform='translateY(0)';">
                
                ${isSelected ? `<span style="position:absolute;top:4px;right:8px;font-size:0.6rem;color:var(--accent-cyan);"><i class="fas fa-check-circle"></i></span>` : ''}
                
                <div style="font-size:1.2rem;margin-bottom:2px;display:flex;align-items:center;justify-content:center;gap:6px;">
                    <img src="${coin.icon || ''}" 
                         onerror="this.style.display='none'" 
                         style="width:20px;height:20px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,0.05);">
                    <span style="font-weight:700;font-size:0.85rem;color:var(--text-primary);">${symbol}</span>
                </div>
                <div style="font-size:0.6rem;color:var(--text-muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
                <div style="font-size:0.85rem;font-weight:600;color:var(--text-primary);font-family:var(--font-mono);" class="coin-price" data-symbol="${symbol}">
                    ${formatCurrency(price)}
                </div>
                <div style="font-size:0.6rem;font-weight:500;color:${changeColor};">${changeText}</div>
                <div style="font-size:0.5rem;color:var(--text-muted);margin-top:4px;">#${coin.rank || '—'}</div>
                <div id="ws-price-${symbol}" style="font-size:0.5rem;color:var(--accent-cyan);margin-top:2px;display:none;">
                    <i class="fas fa-bolt"></i> <span class="ws-price-value">—</span>
                </div>
            </div>
        `;
    }).join('');
}

// ============================================================
// ۳. WebSocket - بروزرسانی قیمت‌ها
// ============================================================

function startWebSocketUpdates() {
    // بروزرسانی قیمت‌ها هر ۱۰ ثانیه
    if (wsInterval) clearInterval(wsInterval);
    wsInterval = setInterval(updatePricesFromWebSocket, 10000);
    
    // ارسال Heartbeat هر ۱۵ ثانیه
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(sendHeartbeat, 15000);
    
    // بروزرسانی وضعیت WebSocket هر ۳۰ ثانیه
    if (statsInterval) clearInterval(statsInterval);
    statsInterval = setInterval(updateWebSocketStatus, 30000);
    
    // بروزرسانی اولیه
    updatePricesFromWebSocket();
    updateWebSocketStatus();
}

async function updatePricesFromWebSocket() {
    try {
        const symbols = allCoins.slice(0, 20).map(c => c.symbol);
        const data = await api.getRealtimePrices(symbols);
        
        if (data.success && data.data) {
            priceUpdateCount++;
            
            Object.keys(data.data).forEach(symbol => {
                const priceData = data.data[symbol];
                const price = priceData.price || 0;
                
                // به‌روزرسانی قیمت روی کارت
                const priceElement = document.querySelector(`.coin-price[data-symbol="${symbol}"]`);
                if (priceElement) {
                    priceElement.textContent = formatCurrency(price);
                }
                
                // نمایش نشانگر WebSocket
                const wsElement = document.getElementById(`ws-price-${symbol}`);
                if (wsElement) {
                    wsElement.style.display = 'block';
                    const valueEl = wsElement.querySelector('.ws-price-value');
                    if (valueEl) {
                        valueEl.textContent = formatCurrency(price);
                    }
                }
            });
            
            document.getElementById('wsPriceCount').textContent = '⚡ ' + Object.keys(data.data).length;
        }
    } catch (error) {
        console.error('WebSocket price update error:', error);
    }
}

async function sendHeartbeat() {
    try {
        await api.sendHeartbeat();
    } catch (error) {
        // بی‌صدا خطا را نادیده بگیر
    }
}

async function updateWebSocketStatus() {
    try {
        const data = await api.getCryptoStats();
        const statusEl = document.getElementById('wsStatus');
        
        if (data.success && data.data) {
            const ws = data.data.websocket || {};
            const connected = ws.connected || false;
            
            if (connected) {
                statusEl.innerHTML = `<i class="fas fa-circle" style="color:var(--accent-green);font-size:0.4rem;"></i> متصل (${ws.symbols_count || 0} ارز)`;
                statusEl.style.borderColor = 'rgba(34,211,238,0.3)';
                wsConnected = true;
            } else {
                statusEl.innerHTML = `<i class="fas fa-circle" style="color:var(--accent-orange);font-size:0.4rem;"></i> در حال اتصال...`;
                statusEl.style.borderColor = 'var(--border-color)';
                wsConnected = false;
            }
            
            const statsEl = document.getElementById('wsStats');
            const statsText = document.getElementById('wsStatsText');
            if (statsEl && statsText) {
                statsEl.style.display = 'block';
                statsText.textContent = `📡 WebSocket: ${connected ? '🟢 متصل' : '🟡 در حال اتصال'} | پیام‌ها: ${ws.messages_received || 0} | بروزرسانی‌ها: ${priceUpdateCount}`;
            }
        }
    } catch (error) {
        console.error('WebSocket status error:', error);
    }
}

function stopWebSocketUpdates() {
    if (wsInterval) { clearInterval(wsInterval); wsInterval = null; }
    if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
    if (statsInterval) { clearInterval(statsInterval); statsInterval = null; }
}

// ============================================================
// ۴. فیلتر و جستجو
// ============================================================

function filterCoins() {
    const search = document.getElementById('coinSearch').value.toLowerCase().trim();
    const sort = document.getElementById('sortFilter').value;
    const changeFilter = document.getElementById('changeFilter').value;
    
    // فیلتر بر اساس جستجو
    filteredCoins = allCoins.filter(coin => {
        const name = (coin.name || '').toLowerCase();
        const symbol = (coin.symbol || '').toLowerCase();
        const id = (coin.id || '').toLowerCase();
        return name.includes(search) || symbol.includes(search) || id.includes(search);
    });
    
    // فیلتر بر اساس تغییرات
    if (changeFilter === 'positive') {
        filteredCoins = filteredCoins.filter(c => (c.priceChange1d || 0) > 0);
    } else if (changeFilter === 'negative') {
        filteredCoins = filteredCoins.filter(c => (c.priceChange1d || 0) < 0);
    } else if (changeFilter === 'high') {
        filteredCoins = filteredCoins.filter(c => (c.priceChange1d || 0) > 5);
    }
    
    // مرتب‌سازی
    switch(sort) {
        case 'rank_asc':
            filteredCoins.sort((a, b) => (a.rank || 999) - (b.rank || 999));
            break;
        case 'rank_desc':
            filteredCoins.sort((a, b) => (b.rank || 0) - (a.rank || 0));
            break;
        case 'name_asc':
            filteredCoins.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            break;
        case 'name_desc':
            filteredCoins.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
            break;
        case 'price_asc':
            filteredCoins.sort((a, b) => (a.price || 0) - (b.price || 0));
            break;
        case 'price_desc':
            filteredCoins.sort((a, b) => (b.price || 0) - (a.price || 0));
            break;
        case 'change_desc':
            filteredCoins.sort((a, b) => (b.priceChange1d || 0) - (a.priceChange1d || 0));
            break;
        case 'change_asc':
            filteredCoins.sort((a, b) => (a.priceChange1d || 0) - (b.priceChange1d || 0));
            break;
        default:
            break;
    }
    
    document.getElementById('coinCount').textContent = filteredCoins.length + ' ارز';
    renderCoins();
}

// ============================================================
// ۵. پیش‌بینی با کلیک روی کارت
// ============================================================

async function predictCoin(coinId) {
    if (isPredictLoading) return;
    if (!coinId) return;
    
    selectedCoinId = coinId;
    localStorage.setItem('lastPredictedCoin', coinId);
    renderCoins();
    
    const indicator = document.getElementById('selectedIndicator');
    const selectedName = document.getElementById('selectedCoinName');
    const coin = allCoins.find(c => c.id === coinId);
    if (coin) {
        selectedName.textContent = coin.symbol + ' - ' + coin.name;
        indicator.style.display = 'block';
    }
    
    isPredictLoading = true;
    document.getElementById('predictStatus').textContent = '⏳ در حال پیش‌بینی...';
    document.getElementById('predictStatus').style.color = 'var(--accent-orange)';
    
    const resultEl = document.getElementById('predictResult');
    resultEl.style.display = 'block';
    document.getElementById('resultSignal').textContent = '⏳ در حال تحلیل...';
    document.getElementById('resultSignal').style.color = 'var(--text-secondary)';
    document.getElementById('resultDetail').textContent = 'در حال دریافت داده از مدل...';
    document.getElementById('resultPrice').textContent = '—';
    document.getElementById('resultConfidence').textContent = '—';
    document.getElementById('resultMode').textContent = '—';
    document.getElementById('resultTime').textContent = '';

    try {
        const data = await api.predictSingle(coinId, '24h');
        
        if (data.success && data.data) {
            const d = data.data;
            const signalType = d.signal_type || 'NEUTRAL';
            const emojis = { BUY: '🟢', SELL: '🔴', NEUTRAL: '🟡' };
            const labels = { BUY: 'خرید', SELL: 'فروش', NEUTRAL: 'خنثی' };
            const colors = { BUY: 'var(--accent-green)', SELL: 'var(--accent-red)', NEUTRAL: 'var(--accent-orange)' };
            
            document.getElementById('resultSignal').textContent = `${emojis[signalType]} ${labels[signalType]}`;
            document.getElementById('resultSignal').style.color = colors[signalType];
            document.getElementById('resultDetail').textContent = d.signal || 'سیگنال خنثی';
            document.getElementById('resultPrice').textContent = formatCurrency(d.current_price);
            document.getElementById('resultConfidence').textContent = d.confidence || '—';
            document.getElementById('resultConfidence').style.color = (parseInt(d.confidence) || 0) > 60 ? 'var(--accent-green)' : 'var(--accent-orange)';
            document.getElementById('resultMode').textContent = d.model_mode || 'DEMO';
            document.getElementById('resultTime').textContent = '🕐 ' + formatDate(d.timestamp);
            
            document.getElementById('predictStatus').textContent = '✅ پیش‌بینی انجام شد';
            document.getElementById('predictStatus').style.color = 'var(--accent-green)';
            
        } else {
            document.getElementById('resultSignal').textContent = '❌ خطا';
            document.getElementById('resultSignal').style.color = 'var(--accent-red)';
            document.getElementById('resultDetail').textContent = data.error || 'خطا در پیش‌بینی';
            document.getElementById('predictStatus').textContent = '❌ خطا';
            document.getElementById('predictStatus').style.color = 'var(--accent-red)';
        }
    } catch (error) {
        console.error('Predict error:', error);
        document.getElementById('resultSignal').textContent = '❌ خطا';
        document.getElementById('resultSignal').style.color = 'var(--accent-red)';
        document.getElementById('resultDetail').textContent = error.message || 'خطا در ارتباط با سرور';
        document.getElementById('predictStatus').textContent = '❌ خطا';
        document.getElementById('predictStatus').style.color = 'var(--accent-red)';
    }
    
    isPredictLoading = false;
}

// ============================================================
// ۶. پیش‌فرض هوشمند برای پیش‌بینی
// ============================================================

async function getDefaultPredictCoin(allCoins) {
    // ۱. آخرین ارز انتخاب شده
    const lastCoin = localStorage.getItem('lastPredictedCoin');
    if (lastCoin && allCoins.some(c => c.id === lastCoin)) {
        return lastCoin;
    }
    
    // ۲. ارز با بالاترین امتیاز ترکیبی
    const topCoins = getTripleScoreCoins(allCoins, 1);
    if (topCoins.length > 0) {
        return topCoins[0];
    }
    
    // ۳. Fallback به بیت‌کوین
    return 'bitcoin';
}

// ============================================================
// ۷. رفرش
// ============================================================

function refreshCoins() {
    showToast('🔄 بروزرسانی...', 'info');
    stopWebSocketUpdates();
    loadCoins();
}

// ============================================================
// ۸. مقداردهی اولیه و پاکسازی
// ============================================================

window.init_predict = function() {
    console.log('🔮 Predict tab initializing...');
    
    if (isPredictLoaded) return;
    isPredictLoaded = true;
    
    loadCoins();
};

window.cleanup_predict = function() {
    stopWebSocketUpdates();
    isPredictLoaded = false;
    console.log('🧹 Predict tab cleaned up');
};

console.log('✅ Predict tab loaded with WebSocket');
</script>
