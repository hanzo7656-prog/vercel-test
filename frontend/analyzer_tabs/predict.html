<script>
// ============================================================
// PREDICT TAB v3.0
// - رفع memory leak
// - مدیریت خطا کامل
// - ۳ حالته connection status
// - debounce search
// - cancel درخواست‌های قبلی
// - skeleton loading
// ============================================================

// ===== State =====
let allCoins = [];
let filteredCoins = [];
let selectedCoinId = null;
let isPredictLoading = false;
let predictAbortController = null;
let priceUpdateInterval = null;
let debounceTimer = null;
let isPredictLoaded = false;
let apiStatsInterval = null;

// ============================================================
// ۱. INITIALIZE
// ============================================================

window.init_predict = function() {
    console.log('🔮 Predict tab initializing...');
    if (isPredictLoaded) return;
    isPredictLoaded = true;
    loadCoins();
};

window.cleanup_predict = function() {
    console.log('🧹 Predict tab cleaning up...');
    isPredictLoaded = false;
    
    // پاک کردن intervalها
    if (priceUpdateInterval) {
        clearInterval(priceUpdateInterval);
        priceUpdateInterval = null;
    }
    if (apiStatsInterval) {
        clearInterval(apiStatsInterval);
        apiStatsInterval = null;
    }
    if (debounceTimer) {
        clearTimeout(debounceTimer);
        debounceTimer = null;
    }
    
    // cancel کردن درخواست‌های در جریان
    if (predictAbortController) {
        predictAbortController.abort();
        predictAbortController = null;
    }
};

// ============================================================
// ۲. LOAD COINS
// ============================================================

async function loadCoins() {
    const grid = document.getElementById('coinsGrid');
    showSkeletonLoading(grid);
    
    try {
        // وضعیت اولیه API
        await checkApiHealth();
        
        // بارگذاری لیست ارزها
        const data = await api.getCoinsList({ limit: 100 });
        
        if (!data || !data.success || !data.data || data.data.length === 0) {
            showEmptyState(grid, 'empty', 'هیچ ارزی یافت نشد', 'لیست ارزها خالی است');
            return;
        }
        
        allCoins = data.data;
        filteredCoins = [...allCoins];
        
        // ✅ بازیابی آخرین انتخاب از localStorage
        const savedCoinId = localStorage.getItem('lastPredictedCoin');
        let defaultCoin = null;
        
        if (savedCoinId) {
            defaultCoin = allCoins.find(c => c.id === savedCoinId);
        }
        if (!defaultCoin) {
            defaultCoin = allCoins.find(c => c.id === 'bitcoin') || allCoins[0];
        }
        
        if (defaultCoin) {
            selectedCoinId = defaultCoin.id;
            updateSelectedIndicator(defaultCoin);
        }
        
        // رندر
        renderCoins();
        updateCoinCount();
        
        // قیمت‌های اولیه
        await updatePricesFromAPI();
        
        // پیش‌بینی خودکار
        if (selectedCoinId) {
            setTimeout(() => predictCoin(selectedCoinId), 800);
        }
        
        // شروع auto-update (به صورت singleton)
        startAutoPriceUpdate();
        startApiStatsUpdate();
        
    } catch (error) {
        console.error('❌ loadCoins error:', error);
        
        let errorMsg = 'خطا در دریافت لیست ارزها';
        if (error.message) {
            if (error.message.includes('401')) errorMsg = 'لطفاً دوباره وارد شوید';
            else if (error.message.includes('429')) errorMsg = 'محدودیت درخواست، چند لحظه صبر کنید';
            else if (error.message.includes('Failed to fetch')) errorMsg = 'اتصال به سرور برقرار نیست';
        }
        
        showEmptyState(grid, 'error', 'خطا در بارگذاری', errorMsg);
    }
}

// ============================================================
// ۳. SKELETON / EMPTY STATE
// ============================================================

function showSkeletonLoading(grid) {
    grid.innerHTML = Array(6).fill('').map((_, i) => `
        <div class="predict-skeleton-card" style="animation-delay:${i * 0.05}s;">
            <div class="predict-skeleton-line symbol"></div>
            <div class="predict-skeleton-line name"></div>
            <div class="predict-skeleton-line price"></div>
            <div class="predict-skeleton-line change"></div>
        </div>
    `).join('');
}

function showEmptyState(grid, type, title, message) {
    const icon = type === 'error' ? '❌' : '📭';
    grid.innerHTML = `
        <div class="predict-empty ${type}">
            <span class="empty-icon">${icon}</span>
            <div class="empty-title">${title}</div>
            <div class="empty-message">${message}</div>
            <button class="empty-action" onclick="loadCoins()">
                <i class="fas fa-sync-alt"></i>
                تلاش مجدد
            </button>
        </div>
    `;
}

// ============================================================
// ۴. API HEALTH CHECK (3-STATE)
// ============================================================

async function checkApiHealth() {
    try {
        const stats = await api.getCryptoStats();
        
        if (!stats || !stats.success || !stats.data) {
            updateApiStatusBadge('unknown', 'وضعیت نامشخص');
            return;
        }
        
        const data = stats.data;
        const ws = data.websocket || {};
        const pm = data.price_manager || {};
        
        let status = 'unknown';
        let text = 'وضعیت نامشخص';
        
        if (ws.connected === true) {
            status = 'online';
            text = 'متصل (FreeCrypto)';
        } else if (pm.is_running && pm.last_update) {
            status = 'degraded';
            text = 'Fallback (CoinStats)';
        } else {
            status = 'offline';
            text = 'قطع';
        }
        
        updateApiStatusBadge(status, text);
        updateApiStatsPanel(data);
        
    } catch (e) {
        console.warn('checkApiHealth error:', e);
        updateApiStatusBadge('offline', 'خطا در بررسی');
    }
}

function updateApiStatusBadge(status, text) {
    const badge = document.getElementById('apiStatus');
    if (!badge) return;
    
    badge.className = 'predict-status-badge ' + status;
    const textEl = badge.querySelector('.status-text');
    if (textEl) textEl.textContent = text;
}

function updateApiStatsPanel(data) {
    const panel = document.getElementById('apiStats');
    if (!panel) return;
    
    panel.classList.add('active');
    
    const ws = data.websocket || {};
    const pm = data.price_manager || {};
    const users = data.users || {};
    
    // وضعیت
    const statConn = document.getElementById('statConnection');
    if (statConn) {
        const isConnected = ws.connected === true;
        statConn.textContent = isConnected ? '✅ متصل' : '⚠️ Fallback';
        statConn.className = 'stat-value ' + (isConnected ? 'green' : 'orange');
    }
    
    // نمادها
    const statSymbols = document.getElementById('statSymbols');
    if (statSymbols) statSymbols.textContent = ws.symbols_count || 0;
    
    // پیام‌ها
    const statMessages = document.getElementById('statMessages');
    if (statMessages) statMessages.textContent = ws.messages_received || 0;
    
    // Fallback
    const statFallback = document.getElementById('statFallback');
    if (statFallback) statFallback.textContent = pm.fallback_count || 0;
    
    // آخرین بروزرسانی
    const statLast = document.getElementById('statLastUpdate');
    if (statLast && pm.last_update) {
        const ts = typeof pm.last_update === 'number' 
            ? pm.last_update * 1000 
            : new Date(pm.last_update).getTime();
        statLast.textContent = formatTimeAgo(new Date(ts)) || '—';
    }
}

function startApiStatsUpdate() {
    if (apiStatsInterval) return;
    
    apiStatsInterval = setInterval(async () => {
        await checkApiHealth();
    }, 20000); // هر ۲۰ ثانیه
}

// ============================================================
// ۵. PRICE UPDATE
// ============================================================

async function updatePricesFromAPI() {
    try {
        // ✅ symbolها رو uppercase کن
        const symbols = allCoins
            .slice(0, 20)
            .map(c => (c.symbol || '').toUpperCase())
            .filter(Boolean);
        
        if (symbols.length === 0) return;
        
        const data = await api.getRealtimePrices(symbols);
        
        if (data.success && data.data) {
            let updatedCount = 0;
            const missing = [];
            
            symbols.forEach(symbol => {
                const priceData = data.data[symbol];
                
                // ✅ اگه symbol نیومد، لاگ کن
                if (!priceData || !priceData.price) {
                    missing.push(symbol);
                    return;
                }
                
                const price = priceData.price;
                if (price > 0) {
                    const el = document.querySelector(`.coin-price[data-symbol="${symbol}"]`);
                    if (el) {
                        const oldPrice = parseFloat(el.dataset.price || '0');
                        const newPrice = parseFloat(price);
                        
                        // ✅ انیمیشن تغییر قیمت
                        if (oldPrice > 0 && newPrice !== oldPrice) {
                            el.classList.remove('flash-up', 'flash-down');
                            void el.offsetWidth; // force reflow
                            if (newPrice > oldPrice) {
                                el.classList.add('flash-up');
                            } else {
                                el.classList.add('flash-down');
                            }
                        }
                        
                        el.textContent = formatCurrency(price);
                        el.dataset.price = price;
                        updatedCount++;
                    }
                }
            });
            
            // نمایش تعداد آپدیت‌ها
            const counter = document.getElementById('apiPriceCount');
            if (counter) {
                counter.style.display = 'inline-flex';
                counter.innerHTML = `<i class="fas fa-bolt"></i> ${updatedCount}`;
            }
            
            // ✅ لاگ کردن symbolهای نیومده (فقط یه بار)
            if (missing.length > 0 && !window._missingWarned) {
                console.debug('⚠️ Missing symbols in API response:', missing.slice(0, 5));
                window._missingWarned = true;
                setTimeout(() => { window._missingWarned = false; }, 60000);
            }
            
        } else {
            console.warn('⚠️ No prices in API response');
        }
    } catch (error) {
        console.warn('updatePricesFromAPI error:', error.message);
    }
}

function startAutoPriceUpdate() {
    // ✅ جلوگیری از memory leak
    if (priceUpdateInterval) {
        clearInterval(priceUpdateInterval);
    }
    
    // هر ۱۲ ثانیه (نزدیک به price_manager که هر ۱۰ ثانیه آپدیت می‌کنه)
    priceUpdateInterval = setInterval(() => {
        if (allCoins.length > 0) {
            updatePricesFromAPI();
        }
    }, 12000);
}

// ============================================================
// ۶. RENDER COINS
// ============================================================

function renderCoins() {
    const grid = document.getElementById('coinsGrid');
    
    if (filteredCoins.length === 0) {
        grid.innerHTML = `
            <div class="predict-empty">
                <span class="empty-icon">🔍</span>
                <div class="empty-title">نتیجه‌ای یافت نشد</div>
                <div class="empty-message">فیلتر یا جستجو را تغییر دهید</div>
            </div>
        `;
        return;
    }
    
    grid.innerHTML = filteredCoins.map((coin, i) => {
        const isSelected = selectedCoinId === coin.id;
        const change = coin.priceChange1d || 0;
        const changeCls = change > 0 ? 'up' : change < 0 ? 'down' : 'neutral';
        const changeText = (change > 0 ? '+' : '') + change.toFixed(2) + '%';
        const price = coin.price || 0;
        const symbol = (coin.symbol || coin.id.toUpperCase().slice(0, 4)).toUpperCase();
        const name = escapeHtml(coin.name || coin.id);
        const rank = coin.rank || '—';
        
        // ✅ stagger animation با تأخیر کمتر برای کارت‌های اول
        const delay = Math.min(i * 0.03, 0.5);
        
        return `
            <div class="predict-coin-card ${isSelected ? 'selected' : ''}"
                 data-coin-id="${coin.id}"
                 data-symbol="${symbol}"
                 data-click-handler="true"
                 style="animation-delay:${delay}s;">
                <div class="coin-symbol">
                    <img src="${escapeHtml(coin.icon || '')}" 
                         onerror="this.style.display='none'" 
                         alt="${escapeHtml(symbol)}">
                    <span>${escapeHtml(symbol)}</span>
                </div>
                <div class="coin-name">${name}</div>
                <div class="coin-price" data-symbol="${symbol}" data-price="${price}">
                    ${formatCurrency(price)}
                </div>
                <div class="coin-change ${changeCls}">${changeText}</div>
                <div class="coin-rank">#${rank}</div>
            </div>
        `;
    }).join('');
    
    // ✅ Event Delegation (به جای inline onclick)
    grid.querySelectorAll('[data-click-handler]').forEach(card => {
        card.addEventListener('click', () => {
            const coinId = card.dataset.coinId;
            if (coinId) predictCoin(coinId);
        });
    });
}

// ============================================================
// ۷. FILTER (با Debounce)
// ============================================================

function filterCoins() {
    const search = (document.getElementById('coinSearch').value || '').toLowerCase().trim();
    const sort = document.getElementById('sortFilter').value;
    const changeFilter = document.getElementById('changeFilter').value;
    
    filteredCoins = allCoins.filter(coin => {
        const name = (coin.name || '').toLowerCase();
        const symbol = (coin.symbol || '').toLowerCase();
        const id = (coin.id || '').toLowerCase();
        return name.includes(search) || symbol.includes(search) || id.includes(search);
    });
    
    // تغییر فیلتر
    if (changeFilter === 'positive') {
        filteredCoins = filteredCoins.filter(c => (c.priceChange1d || 0) > 0);
    } else if (changeFilter === 'negative') {
        filteredCoins = filteredCoins.filter(c => (c.priceChange1d || 0) < 0);
    } else if (changeFilter === 'high') {
        filteredCoins = filteredCoins.filter(c => (c.priceChange1d || 0) > 5);
    }
    
    // مرتب‌سازی
    const sortFns = {
        'rank_asc': (a, b) => (a.rank || 999) - (b.rank || 999),
        'rank_desc': (a, b) => (b.rank || 0) - (a.rank || 0),
        'name_asc': (a, b) => (a.name || '').localeCompare(b.name || ''),
        'name_desc': (a, b) => (b.name || '').localeCompare(a.name || ''),
        'price_asc': (a, b) => (a.price || 0) - (b.price || 0),
        'price_desc': (a, b) => (b.price || 0) - (a.price || 0),
        'change_desc': (a, b) => (b.priceChange1d || 0) - (a.priceChange1d || 0),
        'change_asc': (a, b) => (a.priceChange1d || 0) - (b.priceChange1d || 0),
    };
    
    if (sortFns[sort]) filteredCoins.sort(sortFns[sort]);
    
    updateCoinCount();
    renderCoins();
}

function debouncedFilterCoins() {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(filterCoins, 250);
}

function updateCoinCount() {
    const el = document.getElementById('coinCount');
    if (el) {
        el.innerHTML = `<i class="fas fa-coins"></i> ${filteredCoins.length}`;
    }
}

// ============================================================
// ۸. PREDICT
// ============================================================

async function predictCoin(coinId) {
    if (!coinId) return;
    if (isPredictLoading) {
        // اگه قبلی در جریانه، لغو کن و برو سراغ جدید
        if (predictAbortController) {
            predictAbortController.abort();
        }
    }
    
    selectedCoinId = coinId;
    localStorage.setItem('lastPredictedCoin', coinId);
    
    // آپدیت indicator
    const coin = allCoins.find(c => c.id === coinId);
    if (coin) updateSelectedIndicator(coin);
    
    // آپدیت رندر
    renderCoins();
    
    // نمایش loading
    isPredictLoading = true;
    updatePredictStatusBadge('loading', 'در حال پیش‌بینی...');
    showPredictLoading(coin);
    
    predictAbortController = new AbortController();
    
    try {
        const data = await api.predictSingle(coinId, '24h');
        
        if (!data.success || !data.data) {
            throw new Error(data.error || 'پیش‌بینی ناموفق');
        }
        
        showPredictResult(data.data);
        updatePredictStatusBadge('online', 'پیش‌بینی شد');
        
    } catch (error) {
        if (error.name === 'AbortError') {
            console.log('⏹️ Predict cancelled');
            return;
        }
        
        console.error('❌ Predict error:', error);
        showPredictError(error.message || 'خطا در پیش‌بینی');
        updatePredictStatusBadge('offline', 'خطا');
    } finally {
        isPredictLoading = false;
        predictAbortController = null;
    }
}

function updateSelectedIndicator(coin) {
    const indicator = document.getElementById('selectedIndicator');
    const nameEl = document.getElementById('selectedCoinName');
    
    if (indicator && nameEl) {
        indicator.classList.add('active');
        nameEl.textContent = `${coin.symbol} - ${coin.name}`;
    }
}

function updatePredictStatusBadge(status, text) {
    const badge = document.getElementById('predictStatus');
    if (!badge) return;
    
    // map loading → unknown برای رنگ
    const cls = status === 'loading' ? 'unknown' : status;
    badge.className = 'predict-status-badge ' + cls;
    
    const textEl = badge.querySelector('.status-text');
    if (textEl) textEl.textContent = text;
}

// ============================================================
// ۹. SHOW RESULT
// ============================================================

function showPredictLoading(coin) {
    const result = document.getElementById('predictResult');
    result.classList.add('active');
    result.className = 'predict-result active';
    
    const circle = document.getElementById('signalCircle');
    circle.className = 'predict-signal-circle neutral';
    circle.querySelector('.signal-emoji').textContent = '⏳';
    circle.querySelector('.signal-label').textContent = 'تحلیل';
    
    document.getElementById('resultPrice').textContent = coin ? formatCurrency(coin.price) : '—';
    document.getElementById('resultConfidence').textContent = '—';
    document.getElementById('resultMode').textContent = '—';
    document.getElementById('resultSignalType').textContent = '—';
    document.getElementById('resultDetail').textContent = 'در حال دریافت داده از مدل...';
    document.getElementById('resultTime').textContent = '—';
    document.getElementById('confidenceFill').style.width = '0%';
}

function showPredictResult(d) {
    const result = document.getElementById('predictResult');
    const signalType = d.signal_type || 'NEUTRAL';
    
    // ✅ رنگ بر اساس سیگنال
    const config = {
        'BUY': { emoji: '🟢', label: 'خرید', cls: 'buy', color: 'green' },
        'SELL': { emoji: '🔴', label: 'فروش', cls: 'sell', color: 'red' },
        'NEUTRAL': { emoji: '🟡', label: 'خنثی', cls: 'neutral', color: 'orange' }
    };
    
    const cfg = config[signalType] || config['NEUTRAL'];
    
    // Result container
    result.className = `predict-result active signal-${cfg.cls}`;
    
    // Signal circle
    const circle = document.getElementById('signalCircle');
    circle.className = `predict-signal-circle ${cfg.cls}`;
    circle.querySelector('.signal-emoji').textContent = cfg.emoji;
    circle.querySelector('.signal-label').textContent = cfg.label;
    
    // Details
    document.getElementById('resultPrice').textContent = formatCurrency(d.current_price);
    
    const confidence = parseInt(d.confidence) || 0;
    document.getElementById('resultConfidence').textContent = confidence + '%';
    document.getElementById('resultConfidence').className = 'detail-value ' + (confidence > 60 ? 'green' : 'orange');
    document.getElementById('confidenceFill').style.width = confidence + '%';
    
    document.getElementById('resultMode').textContent = d.model_mode || 'DEMO';
    document.getElementById('resultSignalType').textContent = signalType;
    document.getElementById('resultSignalType').className = 'detail-value ' + cfg.color;
    
    document.getElementById('resultDetail').textContent = d.signal || 'سیگنال ثبت شده';
    document.getElementById('resultTime').textContent = formatDate(d.timestamp) || '—';
    document.getElementById('resultSource').textContent = `مدل ${d.model_mode || 'DEMO'}`;
}

function showPredictError(message) {
    const result = document.getElementById('predictResult');
    result.classList.add('active');
    result.className = 'predict-result active';
    
    const circle = document.getElementById('signalCircle');
    circle.className = 'predict-signal-circle sell';
    circle.querySelector('.signal-emoji').textContent = '❌';
    circle.querySelector('.signal-label').textContent = 'خطا';
    
    document.getElementById('resultDetail').textContent = message;
    document.getElementById('resultSignalType').textContent = 'خطا';
    document.getElementById('resultSignalType').className = 'detail-value red';
}

// ============================================================
// ۱۰. REFRESH
// ============================================================

function refreshCoins() {
    showToast('🔄 بروزرسانی...', 'info');
    
    // ✅ پاک کردن intervalها
    if (priceUpdateInterval) {
        clearInterval(priceUpdateInterval);
        priceUpdateInterval = null;
    }
    
    loadCoins();
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
