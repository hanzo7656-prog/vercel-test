<!-- ============================================================
     CHART TAB - نمودار قیمت با RSI، SMA، EMA و MACD
     ============================================================ -->

<div class="card">
    <div class="card-title">
        <i class="fas fa-chart-line"></i> نمودار قیمت و اندیکاتورها
        <span class="badge-count" id="chartStatus" style="margin-right:auto;font-size:0.6rem;color:var(--text-muted);">✅ آماده</span>
        <button class="btn btn-xs btn-outline" onclick="refreshChart()" style="padding:2px 10px;font-size:0.6rem;">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- ===== CONTROLS ===== -->
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:8px 12px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <select id="chartCoin" onchange="loadChart()" style="padding:6px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.7rem;font-family:inherit;min-width:120px;">
                <option value="bitcoin">₿ بیت‌کوین</option>
            </select>
            <select id="chartPeriod" onchange="loadChart()" style="padding:6px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.7rem;font-family:inherit;">
                <option value="24h">۲۴ ساعت</option>
                <option value="1w">۱ هفته</option>
                <option value="1m" selected>۱ ماه</option>
                <option value="3m">۳ ماه</option>
                <option value="6m">۶ ماه</option>
            </select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <label style="display:flex;align-items:center;gap:4px;font-size:0.6rem;color:var(--text-secondary);">
                <input type="checkbox" id="showRSI" checked onchange="loadChart()"> RSI
            </label>
            <label style="display:flex;align-items:center;gap:4px;font-size:0.6rem;color:var(--text-secondary);">
                <input type="checkbox" id="showSMA" checked onchange="loadChart()"> SMA
            </label>
            <label style="display:flex;align-items:center;gap:4px;font-size:0.6rem;color:var(--text-secondary);">
                <input type="checkbox" id="showEMA" onchange="loadChart()"> EMA
            </label>
            <label style="display:flex;align-items:center;gap:4px;font-size:0.6rem;color:var(--text-secondary);">
                <input type="checkbox" id="showMACD" onchange="loadChart()"> MACD
            </label>
        </div>
        <div style="display:flex;gap:6px;font-size:0.6rem;color:var(--text-muted);">
            <span id="chartDataPoints">۰ نقطه</span>
            <span id="rsiPoints" style="color:var(--accent-cyan);">۰ RSI</span>
        </div>
    </div>

    <!-- ===== CHART ===== -->
    <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:12px 14px;border:1px solid var(--border-color);">
        <div style="height:400px;position:relative;">
            <canvas id="priceChart"></canvas>
        </div>
    </div>

    <!-- ===== SIGNAL MARKERS ===== -->
    <div id="signalMarkers" style="display:none;margin-top:10px;padding:8px 14px;background:rgba(0,0,0,0.2);border-radius:var(--radius-sm);border:1px solid var(--border-color);font-size:0.65rem;color:var(--text-secondary);">
        <div style="display:flex;gap:16px;flex-wrap:wrap;">
            <span><span style="color:var(--accent-green);">🟢</span> خرید (BUY)</span>
            <span><span style="color:var(--accent-red);">🔴</span> فروش (SELL)</span>
            <span><span style="color:var(--accent-orange);">🟡</span> خنثی (NEUTRAL)</span>
            <span id="signalCount" style="color:var(--text-muted);">۰ سیگنال</span>
        </div>
    </div>

    <!-- ===== INDICATORS SUMMARY ===== -->
    <div id="indicatorsSummary" style="display:none;margin-top:10px;padding:8px 14px;background:rgba(0,0,0,0.15);border-radius:var(--radius-sm);border:1px solid var(--border-color);font-size:0.6rem;color:var(--text-muted);">
        <span id="summaryText">—</span>
    </div>
</div>

<script>
// ============================================================
// CHART TAB - با RSI، SMA، EMA و MACD واقعی
// ============================================================

let priceChart = null;
let chartInterval = null;
let isChartLoaded = false;
let showIndicators = false;

// ===== بارگذاری ارزها در سلکت =====
async function loadChartCoins() {
    try {
        const data = await api.getCoinsList({ limit: 50 });
        if (data.success && data.data) {
            const select = document.getElementById('chartCoin');
            const currentVal = select.value;
            select.innerHTML = data.data.map(coin => 
                `<option value="${coin.id}">${coin.symbol} - ${coin.name}</option>`
            ).join('');
            if (currentVal) select.value = currentVal;
        }
    } catch (error) {
        console.error('Load chart coins error:', error);
    }
}

// ===== بارگذاری نمودار =====
async function loadChart() {
    const coin = document.getElementById('chartCoin').value;
    const period = document.getElementById('chartPeriod').value;
    const statusEl = document.getElementById('chartStatus');
    const pointsEl = document.getElementById('chartDataPoints');
    const rsiPointsEl = document.getElementById('rsiPoints');
    
    statusEl.textContent = '⏳ در حال بارگذاری...';
    statusEl.style.color = 'var(--accent-orange)';

    try {
        const data = await api.getChartData(coin, period);
        
        if (data.success && data.data) {
            const d = data.data;
            const chartData = {
                labels: d.timestamps.map(t => new Date(t).toLocaleDateString()),
                prices: d.prices,
                rsi: d.rsi || [],
                sma_20: d.sma_20 || [],
                sma_50: d.sma_50 || [],
                ema_20: d.ema_20 || [],
                macd: d.macd || { macd_line: [], signal_line: [], histogram: [] },
                signals: d.signals || []
            };
            
            renderChart(chartData, coin, period);
            
            pointsEl.textContent = chartData.labels.length + ' نقطه';
            rsiPointsEl.textContent = chartData.rsi.filter(v => v !== null).length + ' RSI';
            statusEl.textContent = '✅ بارگذاری شد';
            statusEl.style.color = 'var(--accent-green)';
            
            // نمایش خلاصه اندیکاتورها
            updateIndicatorsSummary(chartData);
        } else {
            statusEl.textContent = '❌ خطا';
            statusEl.style.color = 'var(--accent-red)';
            showToast('❌ خطا در دریافت داده‌های نمودار', 'error');
        }
    } catch (error) {
        console.error('Chart error:', error);
        statusEl.textContent = '❌ خطا';
        statusEl.style.color = 'var(--accent-red)';
        showToast('❌ خطا: ' + error.message, 'error');
    }
}

// ===== رندر نمودار =====
function renderChart(data, coin, period) {
    const ctx = document.getElementById('priceChart');
    if (!ctx) return;
    
    if (priceChart) {
        priceChart.destroy();
        priceChart = null;
    }
    
    const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#94a3b8';
    const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim() || 'rgba(255,255,255,0.06)';
    
    const showRSI = document.getElementById('showRSI').checked;
    const showSMA = document.getElementById('showSMA').checked;
    const showEMA = document.getElementById('showEMA').checked;
    const showMACD = document.getElementById('showMACD').checked;
    
    const signals = data.signals || [];
    const buySignals = signals.filter(s => s.type === 'BUY');
    const sellSignals = signals.filter(s => s.type === 'SELL');
    
    document.getElementById('signalCount').textContent = signals.length + ' سیگنال';
    document.getElementById('signalMarkers').style.display = signals.length > 0 ? 'block' : 'none';
    
    // ساخت دیتاست‌ها
    const datasets = [
        {
            label: 'قیمت',
            data: data.prices,
            borderColor: '#00d4ff',
            backgroundColor: 'rgba(0,212,255,0.05)',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
            fill: true,
            yAxisID: 'y'
        }
    ];
    
    // SMA 20
    if (showSMA && data.sma_20 && data.sma_20.length > 0) {
        datasets.push({
            label: 'SMA 20',
            data: data.sma_20,
            borderColor: '#f59e0b',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            borderDash: [5, 5],
            yAxisID: 'y'
        });
    }
    
    // SMA 50
    if (showSMA && data.sma_50 && data.sma_50.length > 0) {
        datasets.push({
            label: 'SMA 50',
            data: data.sma_50,
            borderColor: '#ec4899',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            borderDash: [5, 5],
            yAxisID: 'y'
        });
    }
    
    // EMA 20
    if (showEMA && data.ema_20 && data.ema_20.length > 0) {
        datasets.push({
            label: 'EMA 20',
            data: data.ema_20,
            borderColor: '#8b5cf6',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            borderDash: [3, 3],
            yAxisID: 'y'
        });
    }
    
    // RSI
    if (showRSI && data.rsi && data.rsi.length > 0) {
        const rsiData = data.rsi.map(v => v !== null ? v : null);
        datasets.push({
            label: 'RSI',
            data: rsiData,
            borderColor: '#22d3ee',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            borderDash: [2, 2],
            yAxisID: 'y1',
            fill: false
        });
        
        // خطوط RSI (70 و 30)
        datasets.push({
            label: 'RSI 70',
            data: data.rsi.map(() => 70),
            borderColor: 'rgba(239,68,68,0.3)',
            borderWidth: 1,
            pointRadius: 0,
            borderDash: [10, 5],
            yAxisID: 'y1',
            fill: false
        });
        datasets.push({
            label: 'RSI 30',
            data: data.rsi.map(() => 30),
            borderColor: 'rgba(34,211,238,0.3)',
            borderWidth: 1,
            pointRadius: 0,
            borderDash: [10, 5],
            yAxisID: 'y1',
            fill: false
        });
    }
    
    // MACD
    if (showMACD && data.macd && data.macd.macd_line && data.macd.macd_line.length > 0) {
        const macdData = data.macd.macd_line.map(v => v !== null ? v : null);
        const signalData = data.macd.signal_line.map(v => v !== null ? v : null);
        const histData = data.macd.histogram.map(v => v !== null ? v : 0);
        
        datasets.push({
            label: 'MACD',
            data: macdData,
            borderColor: '#00d4ff',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            yAxisID: 'y2',
            fill: false
        });
        datasets.push({
            label: 'Signal',
            data: signalData,
            borderColor: '#f59e0b',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            yAxisID: 'y2',
            fill: false
        });
        // هیستوگرام MACD
        datasets.push({
            label: 'Histogram',
            data: histData,
            backgroundColor: histData.map(v => v >= 0 ? 'rgba(34,211,238,0.6)' : 'rgba(239,68,68,0.6)'),
            borderColor: 'transparent',
            type: 'bar',
            yAxisID: 'y2',
            barPercentage: 0.8
        });
    }
    
    // سیگنال‌های خرید/فروش
    if (buySignals.length > 0) {
        datasets.push({
            label: '🟢 خرید',
            data: buySignals.map(s => ({
                x: s.index,
                y: data.prices[s.index] * 0.98
            })),
            backgroundColor: 'rgba(34,211,238,0.8)',
            borderColor: '#22d3ee',
            pointRadius: 6,
            pointStyle: 'triangle',
            showLine: false,
            yAxisID: 'y'
        });
    }
    
    if (sellSignals.length > 0) {
        datasets.push({
            label: '🔴 فروش',
            data: sellSignals.map(s => ({
                x: s.index,
                y: data.prices[s.index] * 1.02
            })),
            backgroundColor: 'rgba(239,68,68,0.8)',
            borderColor: '#ef4444',
            pointRadius: 6,
            pointStyle: 'triangle',
            rotation: 180,
            showLine: false,
            yAxisID: 'y'
        });
    }
    
    // ایجاد Chart
    priceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.labels,
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                intersect: false,
                mode: 'index'
            },
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        color: textColor,
                        font: { size: 8, family: 'inherit' },
                        boxWidth: 12,
                        usePointStyle: true,
                        padding: 6
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label.includes('خرید') || label.includes('فروش')) {
                                return label;
                            }
                            if (context.dataset.yAxisID === 'y1') {
                                return label + ': ' + context.parsed.y.toFixed(1);
                            }
                            if (context.dataset.yAxisID === 'y2') {
                                return label + ': ' + context.parsed.y.toFixed(2);
                            }
                            return label + ': $' + context.parsed.y.toFixed(2);
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: {
                        color: gridColor,
                        drawBorder: false
                    },
                    ticks: {
                        color: textColor,
                        font: { size: 7, family: 'inherit' },
                        maxTicksLimit: 15
                    }
                },
                y: {
                    position: 'right',
                    grid: {
                        color: gridColor,
                        drawBorder: false
                    },
                    ticks: {
                        color: textColor,
                        font: { size: 7, family: 'inherit' },
                        callback: function(value) {
                            return '$' + value.toFixed(0);
                        }
                    }
                },
                y1: {
                    position: 'left',
                    grid: {
                        display: false,
                        drawBorder: false
                    },
                    ticks: {
                        color: textColor,
                        font: { size: 7, family: 'inherit' },
                        callback: function(value) {
                            return value.toFixed(0);
                        }
                    },
                    min: 0,
                    max: 100
                },
                y2: {
                    position: 'left',
                    grid: {
                        display: false,
                        drawBorder: false
                    },
                    ticks: {
                        color: textColor,
                        font: { size: 7, family: 'inherit' },
                        callback: function(value) {
                            return value.toFixed(2);
                        }
                    }
                }
            }
        }
    });
    
    // نمایش نشانگرها
    document.getElementById('signalMarkers').style.display = signals.length > 0 ? 'block' : 'none';
}

// ===== بروزرسانی خلاصه اندیکاتورها =====
function updateIndicatorsSummary(data) {
    const summaryEl = document.getElementById('indicatorsSummary');
    const textEl = document.getElementById('summaryText');
    
    if (data.rsi && data.rsi.length > 0) {
        const lastRsi = data.rsi[data.rsi.length - 1];
        const lastPrice = data.prices[data.prices.length - 1];
        const lastSma = data.sma_20 ? data.sma_20[data.sma_20.length - 1] : null;
        
        let rsiStatus = 'خنثی';
        if (lastRsi > 70) rsiStatus = '🟢 اشباع خرید';
        else if (lastRsi < 30) rsiStatus = '🔴 اشباع فروش';
        
        let smaStatus = '';
        if (lastSma) {
            smaStatus = lastPrice > lastSma ? '📈 بالای SMA' : '📉 پایین SMA';
        }
        
        textEl.textContent = `RSI: ${lastRsi || '—'} (${rsiStatus}) | قیمت: $${lastPrice?.toFixed(2) || '—'} ${smaStatus}`;
        summaryEl.style.display = 'block';
    } else {
        summaryEl.style.display = 'none';
    }
}

// ===== رفرش =====
function refreshChart() {
    showToast('🔄 بروزرسانی نمودار...', 'info');
    loadChart();
}

// ===== مقداردهی اولیه =====
window.init_chart = function() {
    console.log('📊 Chart tab initializing...');
    
    if (isChartLoaded) return;
    isChartLoaded = true;
    
    loadChartCoins().then(() => {
        loadChart();
    });
    
    if (chartInterval) {
        clearInterval(chartInterval);
    }
    chartInterval = setInterval(() => {
        const activeTab = document.querySelector('#analyzerTabs .tab-btn.active');
        if (activeTab && activeTab.dataset.tab === 'chart') {
            loadChart();
        }
    }, 60000);
};

// ===== پاکسازی =====
window.cleanup_chart = function() {
    if (chartInterval) {
        clearInterval(chartInterval);
        chartInterval = null;
    }
    if (priceChart) {
        priceChart.destroy();
        priceChart = null;
    }
    isChartLoaded = false;
    console.log('🧹 Chart tab cleaned up');
};

console.log('✅ Chart tab loaded with real indicators');
</script>
