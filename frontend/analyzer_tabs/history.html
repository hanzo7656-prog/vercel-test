<!-- ============================================================
     analyzer_tabs/history.html — تب تاریخچه پیش‌بینی‌ها
     نسخه ۳.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="card">
    <!-- Header -->
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-history"></i>
            <span>تاریخچه پیش‌بینی‌ها</span>
        </div>
        <div class="header-actions">
            <span class="counter-badge" id="historyCount">
                <i class="fas fa-database"></i>
                <span>۰</span>
            </span>
            <button class="btn btn-xs btn-outline" onclick="refreshHistory()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="history-toolbar">
        <div class="history-search">
            <input
                type="text"
                id="historySearch"
                class="form-input"
                placeholder="جستجو در ارزها..."
                oninput="debouncedFilterHistory()">
            <span class="search-icon">🔍</span>
        </div>

        <select id="historyFilter" class="form-select" onchange="filterHistory()">
            <option value="all">🔄 همه سیگنال‌ها</option>
            <option value="BUY">🟢 خرید</option>
            <option value="SELL">🔴 فروش</option>
            <option value="NEUTRAL">🟡 خنثی</option>
        </select>

        <select id="confidenceFilter" class="form-select" onchange="filterHistory()">
            <option value="all">🎯 همه سطوح</option>
            <option value="high">🔥 اطمینان بالا (+۷۰٪)</option>
            <option value="medium">⚡ اطمینان متوسط (۴۰-۷۰٪)</option>
            <option value="low">💤 اطمینان پایین (-۴۰٪)</option>
        </select>

        <button class="btn btn-xs btn-outline" onclick="exportHistoryCSV()">
            <i class="fas fa-file-csv"></i>
            <span>CSV</span>
        </button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
        <table class="table-modern">
            <thead>
                <tr>
                    <th>ارز</th>
                    <th>سیگنال</th>
                    <th>قیمت</th>
                    <th>اطمینان</th>
                    <th>مدل</th>
                    <th>زمان</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr class="skeleton-row">
                    <td><div class="skeleton skeleton-sm" style="width:80%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:60%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:70%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:50%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:40%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:80%;"></div></td>
                </tr>
                <tr class="skeleton-row">
                    <td><div class="skeleton skeleton-sm" style="width:70%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:50%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:60%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:40%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:50%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:70%;"></div></td>
                </tr>
                <tr class="skeleton-row">
                    <td><div class="skeleton skeleton-sm" style="width:75%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:65%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:55%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:45%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:45%;"></div></td>
                    <td><div class="skeleton skeleton-sm" style="width:75%;"></div></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<style>
/* ============================================================
   History Tab Styles
   ============================================================ */

.history-toolbar {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
    align-items: center;
    padding: var(--space-3) var(--space-4);
    background: var(--bg-input);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    margin-bottom: var(--space-4);
}

.history-search {
    position: relative;
    flex: 1;
    min-width: 180px;
}

.history-search .form-input {
    padding-right: 36px;
}

.history-search .search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.75rem;
    pointer-events: none;
}

.history-toolbar .counter-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    font-size: var(--fs-xs);
    font-family: var(--font-mono);
    color: var(--text-muted);
}

/* Coin Cell */
.table-modern .coin-cell {
    display: flex;
    align-items: center;
    gap: var(--space-2);
}

.table-modern .coin-cell .coin-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    object-fit: contain;
    background: rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
}

.table-modern .coin-cell .coin-symbol {
    font-weight: var(--fw-bold);
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    color: var(--text-primary);
}

.table-modern .coin-cell .coin-name {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    display: block;
}

/* Signal Cell */
.table-modern .signal-cell {
    font-weight: var(--fw-semibold);
}

.table-modern .signal-cell.buy { color: var(--color-green); }
.table-modern .signal-cell.sell { color: var(--color-red); }
.table-modern .signal-cell.neutral { color: var(--color-orange); }

/* Price Cell */
.table-modern .price-cell {
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
}

/* Confidence */
.confidence-mini {
    display: flex;
    align-items: center;
    gap: var(--space-2);
}

.confidence-mini .cm-value {
    font-weight: var(--fw-semibold);
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    min-width: 40px;
}

.confidence-mini .cm-value.high { color: var(--color-green); }
.confidence-mini .cm-value.medium { color: var(--color-orange); }
.confidence-mini .cm-value.low { color: var(--color-red); }

.confidence-mini .cm-bar {
    width: 40px;
    height: 4px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: var(--radius-full);
    overflow: hidden;
}

.confidence-mini .cm-fill {
    height: 100%;
    border-radius: var(--radius-full);
    background: linear-gradient(90deg, var(--color-cyan), var(--color-purple));
    transition: width 0.5s var(--ease-out);
}

/* Source Badge */
.source-badge {
    font-size: var(--fs-xs);
    padding: 3px 10px;
    border-radius: var(--radius-full);
    background: rgba(139, 92, 246, 0.1);
    color: var(--color-purple);
    border: 1px solid rgba(139, 92, 246, 0.25);
    font-family: var(--font-mono);
    font-weight: var(--fw-medium);
}

/* Time Cell */
.table-modern .time-cell {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    font-family: var(--font-mono);
}

/* Skeleton Row */
.table-modern .skeleton-row td {
    padding: var(--space-3) var(--space-4);
}

.skeleton-sm {
    height: 12px;
}
</style>

<script>
// ============================================================
// HISTORY TAB v3.0
// ============================================================

let _historyData = [];
let _historyFiltered = [];
let _historyInterval = null;
let _historyDebounceTimer = null;
let _historyInitialized = false;

// ============================================================
// Init
// ============================================================

window.init_history = function() {
    console.log('📋 History tab initializing...');

    if (_historyInitialized) return;
    _historyInitialized = true;

    loadHistory();

    if (_historyInterval) clearInterval(_historyInterval);
    _historyInterval = setInterval(() => {
        const activeTab = document.querySelector('#analyzerTabs .analyzer-tab-btn.active');
        if (activeTab?.dataset.tab === 'history') {
            loadHistory();
        }
    }, 60000);
};

// ============================================================
// Cleanup
// ============================================================

window.cleanup_history = function() {
    console.log('🧹 History tab cleaning up...');

    if (_historyInterval) {
        clearInterval(_historyInterval);
        _historyInterval = null;
    }
    if (_historyDebounceTimer) {
        clearTimeout(_historyDebounceTimer);
        _historyDebounceTimer = null;
    }

    _historyInitialized = false;
};

// ============================================================
// Load History
// ============================================================

async function loadHistory() {
    const tbody = document.getElementById('historyBody');
    if (!tbody) return;

    try {
        // ✅ api.getPredictionHistory() (موجود در api.js)
        const data = await window.api?.getPredictionHistory?.(100);

        if (!data?.success) {
            throw new Error(data?.error || 'خطا در دریافت تاریخچه');
        }

        if (!data.data || data.data.length === 0) {
            showHistoryEmpty(tbody);
            updateHistoryCount(0);
            return;
        }

        _historyData = data.data;
        _historyFiltered = [..._historyData];

        updateHistoryCount(_historyData.length);
        renderHistory();

    } catch (error) {
        console.error('❌ History error:', error);

        let errorMsg = 'خطا در ارتباط با سرور';
        if (error.message) {
            if (error.message.includes('401')) errorMsg = 'لطفاً دوباره وارد شوید';
            else if (error.message.includes('Failed to fetch')) errorMsg = 'اتصال به سرور برقرار نیست';
            else errorMsg = error.message;
        }

        showHistoryError(tbody, errorMsg);
    }
}

// ============================================================
// Empty / Error States
// ============================================================

function showHistoryEmpty(tbody) {
    tbody.innerHTML = `
        <tr>
            <td colspan="6" style="padding:0;">
                <div class="empty-state" style="padding:var(--space-8) var(--space-5);">
                    <span class="empty-icon">📭</span>
                    <div class="empty-title">هیچ پیش‌بینی ذخیره‌ای نیست</div>
                    <div class="empty-message">با انجام پیش‌بینی، تاریخچه اینجا نمایش داده می‌شود</div>
                </div>
            </td>
        </tr>
    `;
}

function showHistoryError(tbody, message) {
    tbody.innerHTML = `
        <tr>
            <td colspan="6" style="padding:0;">
                <div class="empty-state error" style="padding:var(--space-8) var(--space-5);">
                    <span class="empty-icon">⚠️</span>
                    <div class="empty-title">خطا در بارگذاری</div>
                    <div class="empty-message">${escapeHistoryHtml(message)}</div>
                    <button class="empty-action" onclick="refreshHistory()">
                        <i class="fas fa-sync-alt"></i>
                        تلاش مجدد
                    </button>
                </div>
            </td>
        </tr>
    `;
}

// ============================================================
// Render History
// ============================================================

function renderHistory() {
    const tbody = document.getElementById('historyBody');
    if (!tbody) return;

    if (_historyFiltered.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" style="padding:0;">
                    <div class="empty-state" style="padding:var(--space-8) var(--space-5);">
                        <span class="empty-icon">🔍</span>
                        <div class="empty-title">نتیجه‌ای یافت نشد</div>
                        <div class="empty-message">فیلتر یا جستجو را تغییر دهید</div>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    tbody.innerHTML = _historyFiltered.map((item, i) => {
        const signal = item.signal_type || 'NEUTRAL';

        const signalConfig = {
            BUY: { emoji: '🟢', label: 'خرید', cls: 'buy' },
            SELL: { emoji: '🔴', label: 'فروش', cls: 'sell' },
            NEUTRAL: { emoji: '🟡', label: 'خنثی', cls: 'neutral' },
        };

        const cfg = signalConfig[signal] || signalConfig.NEUTRAL;
        const confidence = parseInt(item.confidence) || 0;
        const coinName = escapeHistoryHtml(item.coin_name || item.coin || '—');
        const coinSymbol = escapeHistoryHtml((item.coin || '').toUpperCase().slice(0, 6) || '—');
        const coinIcon = item.coin_icon || '';
        const price = item.current_price || 0;
        const modelMode = item.model_mode || 'DEMO';

        let confClass = 'low';
        if (confidence >= 70) confClass = 'high';
        else if (confidence >= 40) confClass = 'medium';

        return `
            <tr style="animation: slideUp 0.3s var(--ease-out) backwards; animation-delay:${Math.min(i * 0.02, 0.4)}s;">
                <td>
                    <div class="coin-cell">
                        ${coinIcon ? `<img src="${escapeHistoryAttr(coinIcon)}" class="coin-icon" onerror="this.style.display='none'" alt="${coinSymbol}">` : ''}
                        <div>
                            <div class="coin-symbol">${coinSymbol}</div>
                            <span class="coin-name">${coinName}</span>
                        </div>
                    </div>
                </td>
                <td class="signal-cell ${cfg.cls}">
                    ${cfg.emoji} ${cfg.label}
                </td>
                <td class="price-cell">
                    ${formatCurrency(price)}
                </td>
                <td>
                    <div class="confidence-mini">
                        <span class="cm-value ${confClass}">${confidence}%</span>
                        <span class="cm-bar">
                            <span class="cm-fill" style="width:${confidence}%"></span>
                        </span>
                    </div>
                </td>
                <td>
                    <span class="source-badge">${escapeHistoryHtml(modelMode)}</span>
                </td>
                <td class="time-cell">
                    ${formatDate(item.timestamp) || '—'}
                </td>
            </tr>
        `;
    }).join('');
}

// ============================================================
// Filter
// ============================================================

function filterHistory() {
    const search = (document.getElementById('historySearch')?.value || '').toLowerCase().trim();
    const signalFilter = document.getElementById('historyFilter')?.value || 'all';
    const confFilter = document.getElementById('confidenceFilter')?.value || 'all';

    _historyFiltered = _historyData.filter(item => {
        const coin = (item.coin || '').toLowerCase();
        const coinName = (item.coin_name || '').toLowerCase();
        const matchSearch = !search || coin.includes(search) || coinName.includes(search);

        const matchSignal = signalFilter === 'all' || item.signal_type === signalFilter;

        const conf = parseInt(item.confidence) || 0;
        let matchConf = true;
        if (confFilter === 'high') matchConf = conf >= 70;
        else if (confFilter === 'medium') matchConf = conf >= 40 && conf < 70;
        else if (confFilter === 'low') matchConf = conf < 40;

        return matchSearch && matchSignal && matchConf;
    });

    renderHistory();
}

function debouncedFilterHistory() {
    if (_historyDebounceTimer) clearTimeout(_historyDebounceTimer);
    _historyDebounceTimer = setTimeout(filterHistory, 250);
}

// ============================================================
// Count
// ============================================================

function updateHistoryCount(count) {
    const el = document.getElementById('historyCount');
    if (el) {
        const span = el.querySelector('span');
        if (span) span.textContent = count;
    }
}

// ============================================================
// Export CSV
// ============================================================

function exportHistoryCSV() {
    if (_historyFiltered.length === 0) {
        if (typeof showToast === 'function') {
            showToast('⚠️ هیچ داده‌ای برای خروجی وجود ندارد', 'warning');
        }
        return;
    }

    try {
        const headers = ['ارز', 'نماد', 'سیگنال', 'قیمت', 'اطمینان', 'مدل', 'زمان'];

        const rows = _historyFiltered.map(item => [
            item.coin_name || item.coin || '',
            (item.coin || '').toUpperCase(),
            item.signal_type || 'NEUTRAL',
            item.current_price || 0,
            (item.confidence || 0) + '%',
            item.model_mode || 'DEMO',
            formatDate(item.timestamp) || '',
        ]);

        const csvContent = [
            headers.map(escapeCsv).join(','),
            ...rows.map(row => row.map(escapeCsv).join(',')),
        ].join('\n');

        const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });

        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `predictions_history_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);

        if (typeof showToast === 'function') {
            showToast('📥 دانلود CSV شروع شد', 'success');
        }
    } catch (err) {
        console.error('❌ CSV export error:', err);
        if (typeof showToast === 'function') {
            showToast('❌ خطا در خروجی CSV', 'error');
        }
    }
}

function escapeCsv(value) {
    const str = String(value ?? '');
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
}

// ============================================================
// Refresh
// ============================================================

function refreshHistory() {
    if (typeof showToast === 'function') showToast('🔄 بروزرسانی...', 'info', 1500);
    loadHistory();
}

// ============================================================
// Helpers
// ============================================================

function escapeHistoryHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeHistoryAttr(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}
</script>
