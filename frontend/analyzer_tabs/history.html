<!-- ============================================================
     history.html - تب تاریخچه پیش‌بینی‌ها
     نسخه ۲.۰ - با CSS مشترک analyzer-animations.css
     ============================================================ -->

<div class="card">
    <!-- ============================================================
         HEADER
         ============================================================ -->
    <div class="card-title">
        <i class="fas fa-history"></i>
        <span>تاریخچه پیش‌بینی‌ها</span>
        <span class="analyzer-counter-badge" id="historyCount" style="margin-right:auto;">
            <i class="fas fa-database"></i>
            <span>۰</span>
        </span>
        <button class="btn btn-xs btn-outline" onclick="refreshHistory()" 
                style="padding:3px 10px;font-size:0.65rem;">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- ============================================================
         TOOLBAR
         ============================================================ -->
    <div class="analyzer-toolbar">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;">
            <!-- Search -->
            <div class="analyzer-search">
                <input type="text" id="historySearch" 
                       placeholder="جستجو در ارزها..." 
                       oninput="debouncedFilterHistory()">
                <span class="search-icon">🔍</span>
            </div>
            
            <!-- Signal Filter -->
            <select id="historyFilter" class="analyzer-filter" onchange="filterHistory()">
                <option value="all">🔄 همه سیگنال‌ها</option>
                <option value="BUY">🟢 خرید</option>
                <option value="SELL">🔴 فروش</option>
                <option value="NEUTRAL">🟡 خنثی</option>
            </select>
            
            <!-- Confidence Filter -->
            <select id="confidenceFilter" class="analyzer-filter" onchange="filterHistory()">
                <option value="all">🎯 همه سطوح</option>
                <option value="high">🔥 اطمینان بالا (+۷۰٪)</option>
                <option value="medium">⚡ اطمینان متوسط (۴۰-۷۰٪)</option>
                <option value="low">💤 اطمینان پایین (-۴۰٪)</option>
            </select>
        </div>
        
        <!-- Export CSV -->
        <button class="btn btn-xs btn-outline" onclick="exportHistoryCSV()" 
                style="padding:3px 12px;font-size:0.65rem;">
            <i class="fas fa-file-csv"></i>
            <span style="margin-right:4px;">CSV</span>
        </button>
    </div>

    <!-- ============================================================
         TABLE
         ============================================================ -->
    <div class="analyzer-table-wrapper">
        <table class="analyzer-table">
            <thead>
                <tr>
                    <th>ارز</th>
                    <th>سیگنال</th>
                    <th>قیمت</th>
                    <th>اطمینان</th>
                    <th>مدل</th>
                    <th>زمان</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- Skeleton Loading -->
                <tr class="skeleton-row">
                    <td><div class="analyzer-skeleton-line" style="width:80%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:60%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:70%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:50%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:40%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:80%;"></div></td>
                </tr>
                <tr class="skeleton-row">
                    <td><div class="analyzer-skeleton-line" style="width:70%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:50%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:60%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:40%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:50%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:70%;"></div></td>
                </tr>
                <tr class="skeleton-row">
                    <td><div class="analyzer-skeleton-line" style="width:75%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:65%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:55%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:45%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:45%;"></div></td>
                    <td><div class="analyzer-skeleton-line" style="width:75%;"></div></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<style>
    /* ============================================================
       استایل اختصاصی جدول (تکمیلی analyzer-animations.css)
       ============================================================ */
    .analyzer-table .skeleton-row td {
        padding: 14px;
    }
    
    .analyzer-table .skeleton-row .analyzer-skeleton-line {
        height: 10px;
        border-radius: 4px;
        background: linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.03) 0%,
            rgba(255, 255, 255, 0.08) 50%,
            rgba(255, 255, 255, 0.03) 100%
        );
        background-size: 200% 100%;
        animation: skeletonShimmer 1.5s linear infinite;
    }
    
    .analyzer-table .coin-cell {
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .analyzer-table .coin-cell .coin-icon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        object-fit: contain;
        background: rgba(255, 255, 255, 0.05);
    }
    
    .analyzer-table .coin-cell .coin-symbol {
        font-weight: 700;
        font-family: 'Courier New', monospace;
        font-size: 0.8rem;
    }
    
    .analyzer-table .coin-cell .coin-name {
        font-size: 0.65rem;
        color: var(--text-muted);
    }
</style>

<script>
// ============================================================
// HISTORY TAB v2.0
// ============================================================

// ===== State =====
let historyData = [];
let filteredHistory = [];
let historyInterval = null;
let debounceHistoryTimer = null;
let isHistoryLoaded = false;

// ============================================================
// ۱. INITIALIZE / CLEANUP
// ============================================================

window.init_history = function() {
    console.log('📋 History tab initializing...');
    if (isHistoryLoaded) {
        console.log('⚠️ Already loaded, skipping');
        return;
    }
    isHistoryLoaded = true;
    loadHistory();
    
    // auto-refresh هر ۶۰ ثانیه
    if (historyInterval) clearInterval(historyInterval);
    historyInterval = setInterval(loadHistory, 60000);
};

window.cleanup_history = function() {
    console.log('🧹 History tab cleaning up...');
    isHistoryLoaded = false;
    
    if (historyInterval) {
        clearInterval(historyInterval);
        historyInterval = null;
    }
    if (debounceHistoryTimer) {
        clearTimeout(debounceHistoryTimer);
        debounceHistoryTimer = null;
    }
};

// ============================================================
// ۲. LOAD HISTORY
// ============================================================

async function loadHistory() {
    const tbody = document.getElementById('historyBody');
    
    try {
        const data = await api.getPredictionHistory(100);
        
        if (!data || !data.success) {
            throw new Error(data?.error || 'خطا در دریافت تاریخچه');
        }
        
        if (!data.data || data.data.length === 0) {
            showEmptyState(tbody);
            updateHistoryCount(0);
            return;
        }
        
        historyData = data.data;
        filteredHistory = [...historyData];
        
        updateHistoryCount(historyData.length);
        renderHistory();
        
    } catch (error) {
        console.error('❌ History error:', error);
        
        let errorMsg = 'خطا در ارتباط با سرور';
        if (error.message) {
            if (error.message.includes('401')) errorMsg = 'لطفاً دوباره وارد شوید';
            else if (error.message.includes('Failed to fetch')) errorMsg = 'اتصال به سرور برقرار نیست';
            else if (error.message) errorMsg = error.message;
        }
        
        showErrorState(tbody, errorMsg);
    }
}

// ============================================================
// ۳. EMPTY / ERROR STATE
// ============================================================

function showEmptyState(tbody) {
    tbody.innerHTML = `
        <tr>
            <td colspan="6" style="padding:0;">
                <div class="analyzer-empty" style="padding:40px 20px;">
                    <span class="empty-icon">📭</span>
                    <div class="empty-title">هیچ پیش‌بینی ذخیره‌ای نیست</div>
                    <div class="empty-message">با انجام پیش‌بینی، تاریخچه اینجا نمایش داده می‌شود</div>
                </div>
            </td>
        </tr>
    `;
}

function showErrorState(tbody, message) {
    tbody.innerHTML = `
        <tr>
            <td colspan="6" style="padding:0;">
                <div class="analyzer-empty error" style="padding:40px 20px;">
                    <span class="empty-icon">⚠️</span>
                    <div class="empty-title">خطا در بارگذاری</div>
                    <div class="empty-message">${escapeHtml(message)}</div>
                    <button class="empty-action" onclick="refreshHistory()">
                        <i class="fas fa-sync-alt"></i>
                        تلاش مجدد
                    </button>
                </div>
            </td>
        </tr>
    `;
}

// ============================================================
// ۴. RENDER HISTORY
// ============================================================

function renderHistory() {
    const tbody = document.getElementById('historyBody');
    
    if (filteredHistory.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" style="padding:0;">
                    <div class="analyzer-empty">
                        <span class="empty-icon">🔍</span>
                        <div class="empty-title">نتیجه‌ای یافت نشد</div>
                        <div class="empty-message">فیلتر یا جستجو را تغییر دهید</div>
                    </div>
                </td>
            </tr>
        `;
        return;
    }
    
    tbody.innerHTML = filteredHistory.map((item, i) => {
        const signal = item.signal_type || 'NEUTRAL';
        const signalConfig = {
            'BUY': { emoji: '🟢', label: 'خرید', cls: 'buy' },
            'SELL': { emoji: '🔴', label: 'فروش', cls: 'sell' },
            'NEUTRAL': { emoji: '🟡', label: 'خنثی', cls: 'neutral' }
        };
        
        const cfg = signalConfig[signal] || signalConfig['NEUTRAL'];
        const confidence = parseInt(item.confidence) || 0;
        const coinName = escapeHtml(item.coin_name || item.coin || '—');
        const coinSymbol = escapeHtml((item.coin || '').toUpperCase().slice(0, 6) || '—');
        const coinIcon = item.coin_icon || '';
        const price = item.current_price || 0;
        const modelMode = item.model_mode || 'DEMO';
        
        // رنگ confidence
        let confColor = 'orange';
        if (confidence >= 70) confColor = 'green';
        else if (confidence < 40) confColor = 'red';
        
        // تأخیر برای stagger
        const delay = Math.min(i * 0.02, 0.4);
        
        return `
            <tr style="animation: analyzeStaggerIn 0.3s ease backwards; animation-delay: ${delay}s;">
                <td class="coin-cell">
                    ${coinIcon ? `<img src="${escapeHtml(coinIcon)}" class="coin-icon" onerror="this.style.display='none'">` : ''}
                    <div>
                        <div class="coin-symbol">${coinSymbol}</div>
                        <div class="coin-name">${coinName}</div>
                    </div>
                </td>
                <td class="signal-cell ${cfg.cls}">
                    ${cfg.emoji} ${cfg.label}
                </td>
                <td class="price-cell">
                    ${formatCurrency(price)}
                </td>
                <td>
                    <div class="confidence-mini-bar">
                        <span style="color: var(--accent-${confColor}); font-weight: 600;">${confidence}%</span>
                        <span class="mini-fill" style="--fill: ${confidence}%;"></span>
                    </div>
                </td>
                <td>
                    <span class="source-badge" style="font-size:0.55rem;">
                        ${escapeHtml(modelMode)}
                    </span>
                </td>
                <td class="time-cell">
                    ${formatDate(item.timestamp) || '—'}
                </td>
            </tr>
        `;
    }).join('');
}

// ============================================================
// ۵. FILTER
// ============================================================

function filterHistory() {
    const search = (document.getElementById('historySearch').value || '').toLowerCase().trim();
    const signalFilter = document.getElementById('historyFilter').value;
    const confFilter = document.getElementById('confidenceFilter').value;
    
    filteredHistory = historyData.filter(item => {
        // جستجو
        const coin = (item.coin || '').toLowerCase();
        const coinName = (item.coin_name || '').toLowerCase();
        const matchSearch = !search || coin.includes(search) || coinName.includes(search);
        
        // فیلتر سیگنال
        const matchSignal = signalFilter === 'all' || item.signal_type === signalFilter;
        
        // فیلتر اطمینان
        const conf = parseInt(item.confidence) || 0;
        let matchConf = true;
        if (confFilter === 'high') matchConf = conf >= 70;
        else if (confFilter === 'medium') matchConf = conf >= 40 && conf < 70;
        else if (confFilter === 'low') matchConf = conf < 40;
        
        return matchSearch && matchSignal && matchConf;
    });
    
    renderHistory();
}

function debouncedFilterHistory() {
    if (debounceHistoryTimer) clearTimeout(debounceHistoryTimer);
    debounceHistoryTimer = setTimeout(filterHistory, 250);
}

// ============================================================
// ۶. COUNT
// ============================================================

function updateHistoryCount(count) {
    const el = document.getElementById('historyCount');
    if (el) {
        const span = el.querySelector('span');
        if (span) span.textContent = count;
    }
}

// ============================================================
// ۷. EXPORT CSV
// ============================================================

function exportHistoryCSV() {
    if (filteredHistory.length === 0) {
        if (typeof showToast === 'function') {
            showToast('⚠️ هیچ داده‌ای برای خروجی وجود ندارد', 'warning');
        }
        return;
    }
    
    try {
        const headers = ['ارز', 'نماد', 'سیگنال', 'قیمت', 'اطمینان', 'مدل', 'زمان'];
        const rows = filteredHistory.map(item => [
            item.coin_name || item.coin || '',
            (item.coin || '').toUpperCase(),
            item.signal_type || 'NEUTRAL',
            item.current_price || 0,
            (item.confidence || 0) + '%',
            item.model_mode || 'DEMO',
            formatDate(item.timestamp) || ''
        ]);
        
        // ساخت CSV با escape
        const csvContent = [
            headers.map(escapeCsv).join(','),
            ...rows.map(row => row.map(escapeCsv).join(','))
        ].join('\n');
        
        // BOM برای پشتیبانی از فارسی
        const blob = new Blob(['\ufeff' + csvContent], { 
            type: 'text/csv;charset=utf-8;' 
        });
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `predictions_history_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        
        if (typeof showToast === 'function') {
            showToast('📥 دانلود CSV شروع شد', 'success');
        }
    } catch (err) {
        console.error('❌ CSV export error:', err);
        if (typeof showToast === 'function') {
            showToast('❌ خطا در خروجی CSV', 'error');
        }
    }
}

function escapeCsv(value) {
    const str = String(value ?? '');
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
}

// ============================================================
// ۸. REFRESH
// ============================================================

function refreshHistory() {
    if (typeof showToast === 'function') {
        showToast('🔄 بروزرسانی...', 'info');
    }
    loadHistory();
}

// ============================================================
// ۹. UTILS
// ============================================================

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

console.log('✅ History tab v2.0 loaded');
</script>
