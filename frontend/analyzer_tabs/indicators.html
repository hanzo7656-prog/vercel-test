<div class="card">
    <!-- ============================================================

         ============================================================ -->
    <div class="card-title">
        <i class="fas fa-chart-bar"></i>
        <span>شاخص‌های بازار</span>
        <span class="analyzer-status-badge unknown" id="indicatorsStatus" style="margin-right:auto;">
            <span class="status-dot"></span>
            <span class="status-text">آماده</span>
        </span>
        <button class="btn btn-xs btn-outline" onclick="refreshIndicators()" 
                style="padding:3px 10px;font-size:0.65rem;">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- ============================================================
         COIN SELECTOR
         ============================================================ -->
    <div class="analyzer-toolbar">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;">
            <select id="indicatorsCoin" class="analyzer-filter" onchange="loadIndicators()" 
                    style="min-width:180px;">
                <option value="bitcoin">₿ بیت‌کوین</option>
            </select>
            <span style="font-size:0.7rem;color:var(--text-muted);">
                شاخص‌های تکنیکال و احساسات بازار
            </span>

    </div>

    <!-- ============================================================
         INDICATORS GRID
         ============================================================ -->
    <div id="indicatorsGrid" class="analyzer-indicators-grid">
        <!-- Skeleton Loading - ۸ کارت -->
        <div class="analyzer-skeleton-card">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
        <div class="analyzer-skeleton-card">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
        <div class="analyzer-skeleton-card">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
        <div class="analyzer-skeleton-card">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
        <div class="analyzer-skeleton-card">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
        <div class="analyzer-skeleton-card">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
        <div class="analyzer-skeleton-card">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
        <div class="analyzer-skeleton-card">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// INDICATORS TAB v2.0
// ============================================================

// ===== State =====
let indicatorsInterval = null;
let isIndicatorsLoaded = false;
let currentCoin = 'bitcoin';

// ============================================================
// ۱. INITIALIZE / CLEANUP
// ============================================================

window.init_indicators = function() {
    console.log('📊 Indicators tab initializing...');
    if (isIndicatorsLoaded) {
        console.log('⚠️ Already loaded, skipping');
        return;
    }
    isIndicatorsLoaded = true;
    
    loadIndicatorsCoins().then(() => {
        loadIndicators();
    });
    
    // auto-refresh هر ۳۰ ثانیه (فقط اگه این تب فعاله)
    if (indicatorsInterval) clearInterval(indicatorsInterval);
    indicatorsInterval = setInterval(() => {
        const activeTab = document.querySelector('#analyzerTabs .analyzer-tab-btn.active');
        if (activeTab && activeTab.dataset.tab === 'indicators') {
            loadIndicators();
        }
    }, 30000);
};

window.cleanup_indicators = function() {
    console.log('🧹 Indicators tab cleaning up...');
    isIndicatorsLoaded = false;
    
    if (indicatorsInterval) {
        clearInterval(indicatorsInterval);
        indicatorsInterval = null;
    }
};

// ============================================================
// ۲. LOAD COINS LIST (برای سلکت)
// ============================================================

async function loadIndicatorsCoins() {
    try {
        const data = await api.getCoinsList({ limit: 30 });
        
        if (data.success && data.data && data.data.length > 0) {
            const select = document.getElementById('indicatorsCoin');
            const currentVal = select.value || 'bitcoin';
            
            select.innerHTML = data.data.map(coin => {
                const symbol = escapeHtml(coin.symbol || '');
                const name = escapeHtml(coin.name || '');
                return `<option value="${escapeHtml(coin.id)}">${symbol} - ${name}</option>`;
            }).join('');
            
            // بازیابی انتخاب قبلی
            if (data.data.find(c => c.id === currentVal)) {
                select.value = currentVal;
            } else {
                select.value = 'bitcoin';
                currentCoin = 'bitcoin';
            }
        }
    } catch (error) {
        console.warn('⚠️ Load indicators coins error:', error.message);
    }
}

// ============================================================
// ۳. LOAD INDICATORS
// ============================================================

async function loadIndicators() {
    const coin = document.getElementById('indicatorsCoin').value;
    currentCoin = coin;
    
    const grid = document.getElementById('indicatorsGrid');
    updateStatusBadge('unknown', 'در حال بارگذاری...');
    showSkeletonLoading(grid);
    
    try {
        // ===== دریافت داده‌ها به صورت موازی =====
        const [coinData, fearGreed, dominance] = await Promise.allSettled([
            api.getCoinPrice(coin),
            api.getFearGreed(),
            api.getBTCDominance()
        ]);
        
        // ===== استخراج داده‌ها =====
        const coinInfo = coinData.status === 'fulfilled' ? coinData.value?.data || {} : {};
        const fgInfo = fearGreed.status === 'fulfilled' ? fearGreed.value?.data || {} : {};
        const domInfo = dominance.status === 'fulfilled' ? dominance.value?.data || {} : {};
        
        // ===== دریافت شاخص‌های تکنیکال =====
        // TODO: اگه /api/coinstats/chart/{coin} کار می‌کنه، از اون استفاده کن
        const technical = await getTechnicalIndicators(coin, coinInfo);
        
        // ===== ساخت آبجکت نهایی =====
        const indicators = {
            // قیمت
            price: coinInfo.price || 0,
            change24h: coinInfo.change_24h || 0,
            high24h: coinInfo.high_24h || 0,
            low24h: coinInfo.low_24h || 0,
            volume24h: coinInfo.volume_24h || 0,
            marketCap: coinInfo.market_cap || 0,
            
            // تکنیکال
            rsi: technical.rsi,
            macd: technical.macd,
            macdSignal: technical.macdSignal,
            macdHistogram: technical.macdHistogram,
            sma20: technical.sma20,
            sma50: technical.sma50,
            support: technical.support,
            resistance: technical.resistance,
            volatility: technical.volatility,
            
            // احساسات
            fearGreed: fgInfo.value || 50,
            fearGreedLabel: fgInfo.classification || 'Neutral',
            btcDominance: domInfo.value || 50
        };
        
        renderIndicators(indicators);
        updateStatusBadge('online', 'بارگذاری شد');
        
    } catch (error) {
        console.error('❌ Indicators error:', error);
        showErrorState(grid, error.message || 'خطا در دریافت شاخص‌ها');
        updateStatusBadge('offline', 'خطا');
    }
}

// ============================================================
// ۴. GET TECHNICAL INDICATORS
// ============================================================

async function getTechnicalIndicators(coin, coinInfo) {
    // اگه price داری، mock بر اساس اون
    const price = coinInfo.price || (coin === 'bitcoin' ? 80000 : coin === 'ethereum' ? 2500 : 100);
    const change = coinInfo.change_24h || 0;
    
    // محاسبه volatility بر اساس change
    const volatility = Math.abs(change) / 100 + 0.01;
    
    // TODO: اگه /api/coinstats/chart/{coin} کار می‌کنه، از API بگیر
    // const chartData = await api.getChartData(coin, '1m');
    // const rsi = calculateRSI(chartData.prices);
    // ...
    
    // فعلاً mock هوشمند بر اساس price و change
    return {
        rsi: calculateMockRSI(change),
        macd: calculateMockMACD(change),
        macdSignal: calculateMockMACD(change) * 0.8,
        macdHistogram: calculateMockMACD(change) * 0.2,
        sma20: price * (1 - 0.005),
        sma50: price * (1 - 0.01),
        support: price * (1 - volatility * 0.7),
        resistance: price * (1 + volatility * 0.7),
        volatility: volatility
    };
}

function calculateMockRSI(change24h) {
    // RSI واقع‌گرایانه بر اساس change
    // اگه change مثبت باشه، RSI بالاتره
    const base = 50;
    const impact = Math.max(Math.min(change24h * 3, 45), -45);
    return Math.max(15, Math.min(85, base + impact));
}

function calculateMockMACD(change24h) {
    // MACD بر اساس change
    return change24h * 2.5;
}

// ============================================================
// ۵. RENDER INDICATORS
// ============================================================

function renderIndicators(data) {
    const grid = document.getElementById('indicatorsGrid');
    
    const items = [
        // ===== قیمت‌ها =====
        {
            label: '💰 قیمت',
            value: formatCurrency(data.price),
            color: 'cyan',
            icon: '💰',
            hint: '',
            gauge: null
        },
        {
            label: '📈 تغییر ۲۴h',
            value: formatPercent(data.change24h),
            color: data.change24h >= 0 ? 'green' : 'red',
            icon: '📈',
            hint: '',
            gauge: null
        },
        {
            label: '⬆️ بالاترین ۲۴h',
            value: formatCurrency(data.high24h),
            color: 'green',
            icon: '⬆️',
            hint: '',
            gauge: null
        },
        {
            label: '⬇️ پایین‌ترین ۲۴h',
            value: formatCurrency(data.low24h),
            color: 'red',
            icon: '⬇️',
            hint: '',
            gauge: null
        },
        
        // ===== تکنیکال =====
        {
            label: '📊 RSI (14)',
            value: data.rsi.toFixed(1),
            color: data.rsi > 70 ? 'red' : data.rsi < 30 ? 'green' : 'orange',
            icon: '📊',
            hint: data.rsi > 70 ? 'اشباع خرید' : data.rsi < 30 ? 'اشباع فروش' : 'خنثی',
            gauge: {
                value: data.rsi,
                max: 100,
                type: data.rsi > 70 ? 'danger' : data.rsi < 30 ? 'good' : 'warning'
            }
        },
        {
            label: '📉 MACD',
            value: data.macd.toFixed(2),
            color: data.macd > 0 ? 'green' : 'red',
            icon: '📉',
            hint: data.macd > 0 ? 'صعودی' : 'نزولی',
            gauge: null
        },
        {
            label: '🛡️ حمایت',
            value: formatCurrency(data.support),
            color: 'cyan',
            icon: '🛡️',
            hint: '',
            gauge: null
        },
        {
            label: '⚔️ مقاومت',
            value: formatCurrency(data.resistance),
            color: 'purple',
            icon: '⚔️',
            hint: '',
            gauge: null
        },
        
        // ===== احساسات =====
        {
            label: '😨 ترس و طمع',
            value: data.fearGreed,
            color: data.fearGreed > 70 ? 'red' : data.fearGreed < 30 ? 'green' : 'orange',
            icon: '😨',
            hint: data.fearGreedLabel,
            gauge: {
                value: data.fearGreed,
                max: 100,
                type: data.fearGreed > 70 ? 'danger' : data.fearGreed < 30 ? 'good' : 'warning'
            }
        },
        {
            label: '📊 سلطه BTC',
            value: data.btcDominance.toFixed(1) + '%',
            color: 'cyan',
            icon: '📊',
            hint: '',
            gauge: {
                value: data.btcDominance,
                max: 100,
                type: 'good'
            }
        },
        
        // ===== حجم و نوسان =====
        {
            label: '📦 حجم ۲۴h',
            value: formatNumber(data.volume24h),
            color: 'cyan',
            icon: '📦',
            hint: '',
            gauge: null
        },
        {
            label: '📈 نوسان',
            value: (data.volatility * 100).toFixed(2) + '%',
            color: data.volatility > 0.05 ? 'red' : data.volatility > 0.03 ? 'orange' : 'green',
            icon: '📈',
            hint: data.volatility > 0.05 ? 'بالا' : data.volatility > 0.03 ? 'متوسط' : 'پایین',
            gauge: null
        }
    ];
    
    grid.innerHTML = items.map((item, i) => {
        const delay = Math.min(i * 0.04, 0.5);
        const colorClass = item.color;
        
        // Gauge
        let gaugeHtml = '';
        if (item.gauge) {
            const pct = Math.min((item.gauge.value / item.gauge.max) * 100, 100);
            const gaugeClass = item.gauge.type || '';
            gaugeHtml = `
                <div class="indicator-gauge">
                    <div class="gauge-fill ${gaugeClass}" style="width:${pct}%"></div>
                </div>
            `;
        }
        
        // Hint
        const hintHtml = item.hint 
            ? `<div class="indicator-hint">${escapeHtml(item.hint)}</div>` 
            : '';
        
        return `
            <div class="analyzer-indicator-card" style="animation-delay:${delay}s;">
                <div class="indicator-label">
                    <span>${item.icon}</span>
                    <span>${escapeHtml(item.label)}</span>
                </div>
                <div class="indicator-value text-${colorClass}">
                    ${item.value}
                </div>
                ${hintHtml}
                ${gaugeHtml}
            </div>
        `;
    }).join('');
}

// ============================================================
// ۶. SKELETON / ERROR
// ============================================================

function showSkeletonLoading(grid) {
    grid.innerHTML = Array(8).fill('').map((_, i) => `
        <div class="analyzer-skeleton-card" style="animation-delay:${i * 0.04}s;">
            <div class="analyzer-skeleton-line name"></div>
            <div class="analyzer-skeleton-line price"></div>
        </div>
    `).join('');
}

function showErrorState(grid, message) {
    grid.innerHTML = `
        <div class="analyzer-empty error" style="grid-column:1/-1;">
            <span class="empty-icon">❌</span>
            <div class="empty-title">خطا در دریافت شاخص‌ها</div>
            <div class="empty-message">${escapeHtml(message)}</div>
            <button class="empty-action" onclick="loadIndicators()">
                <i class="fas fa-sync-alt"></i>
                تلاش مجدد
            </button>
        </div>
    `;
}

// ============================================================
// ۷. STATUS BADGE
// ============================================================

function updateStatusBadge(status, text) {
    const badge = document.getElementById('indicatorsStatus');
    if (!badge) return;
    
    badge.className = 'analyzer-status-badge ' + status;
    const textEl = badge.querySelector('.status-text');
    if (textEl) textEl.textContent = text;
}

// ============================================================
// ۸. REFRESH
// ============================================================

function refreshIndicators() {
    if (typeof showToast === 'function') {
        showToast('🔄 بروزرسانی شاخص‌ها...', 'info');
    }
    loadIndicators();
}

// ============================================================
// ۹. UTILS
// ============================================================

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

console.log('✅ Indicators tab v2.0 loaded');
</script>
