<style>

<script>
// ============================================================
// INDICATORS TAB v3.0
// ============================================================

let _indicatorsInterval = null;
let _indicatorsInitialized = false;

// ============================================================
// Init
// ============================================================

window.init_indicators = async function() {
    console.log('📊 Indicators tab initializing...');

    if (_indicatorsInitialized) return;
    _indicatorsInitialized = true;

    await loadIndicatorsCoins();
    await loadIndicators();

    if (_indicatorsInterval) clearInterval(_indicatorsInterval);
    _indicatorsInterval = setInterval(() => {
        const activeTab = document.querySelector('#analyzerTabs .analyzer-tab-btn.active');
        if (activeTab?.dataset.tab === 'indicators') {
            loadIndicators();
        }
    }, 30000);
};

// ============================================================
// Cleanup
// ============================================================

window.cleanup_indicators = function() {
    console.log('🧹 Indicators tab cleaning up...');

    if (_indicatorsInterval) {
        clearInterval(_indicatorsInterval);
        _indicatorsInterval = null;
    }

    _indicatorsInitialized = false;
};

// ============================================================
// Load Coins List
// ============================================================

async function loadIndicatorsCoins() {
    try {
        // ✅ api.getCoinsList() (موجود در api.js)
        const data = await window.api?.getCoinsList?.({ limit: 30 });

        if (!data?.success || !data.data || data.data.length === 0) return;

        const select = document.getElementById('indicatorsCoin');
        if (!select) return;

        const currentVal = select.value || 'bitcoin';

        select.innerHTML = data.data.map(coin => {
            const symbol = escapeIndicatorsHtml(coin.symbol || '');
            const name = escapeIndicatorsHtml(coin.name || '');
            return `<option value="${escapeIndicatorsAttr(coin.id)}">${symbol} - ${name}</option>`;
        }).join('');

        if (data.data.find(c => c.id === currentVal)) {
            select.value = currentVal;
        } else {
            select.value = 'bitcoin';
        }
    } catch (error) {
        console.warn('⚠️ Load indicators coins error:', error.message);
    }
}

// ============================================================
// Load Indicators
// ============================================================

async function loadIndicators() {
    const coin = document.getElementById('indicatorsCoin')?.value || 'bitcoin';

    const grid = document.getElementById('indicatorsGrid');
    if (!grid) return;

    updateIndicatorsStatus('unknown', 'در حال بارگذاری...');
    showIndicatorsSkeleton(grid);

    try {
        // ✅ FIX: دریافت داده‌های موازی از api.js
        const [coinData, fearGreed, dominance, chartData] = await Promise.allSettled([
            window.api?.getCoinPrice?.(coin),
            window.api?.getFearGreed?.(),
            window.api?.getBTCDominance?.(),
            window.api?.getChartData?.(coin, '1m'),  // ✅ برای RSI/MACD واقعی
        ]);

        const coinInfo = coinData.status === 'fulfilled' ? coinData.value?.data || {} : {};
        const fgInfo = fearGreed.status === 'fulfilled' ? fearGreed.value?.data || {} : {};
        const domInfo = dominance.status === 'fulfilled' ? dominance.value?.data || {} : {};
        const chart = chartData.status === 'fulfilled' ? chartData.value?.data : null;

        // محاسبه RSI/MACD از chart data
        const technical = calculateTechnicalIndicators(chart, coinInfo);

        const indicators = {
            // قیمت
            price: coinInfo.price || 0,
            change24h: coinInfo.change_24h || 0,
            high24h: coinInfo.high_24h || 0,
            low24h: coinInfo.low_24h || 0,
            volume24h: coinInfo.volume_24h || 0,

            // تکنیکال (واقعی یا mock بر اساس chart)
            rsi: technical.rsi,
            macd: technical.macd,
            sma20: technical.sma20,
            support: technical.support,
            resistance: technical.resistance,
            volatility: technical.volatility,

            // احساسات
            fearGreed: fgInfo.value || 50,
            fearGreedLabel: fgInfo.classification || 'Neutral',
            btcDominance: domInfo.value || 50,
        };

        renderIndicators(indicators);
        updateIndicatorsStatus('online', 'بارگذاری شد');

    } catch (error) {
        console.error('❌ Indicators error:', error);
        showIndicatorsError(grid, error.message);
        updateIndicatorsStatus('offline', 'خطا');
    }
}

// ============================================================
// Calculate Technical Indicators (from chart data)
// ============================================================

function calculateTechnicalIndicators(chart, coinInfo) {
    const price = coinInfo.price || 1000;
    const change = coinInfo.change_24h || 0;
    const volatility = Math.abs(change) / 100 + 0.01;

    let prices = [];

    // اگه chart داریم، از اون استفاده کن
    if (chart && Array.isArray(chart.prices) && chart.prices.length > 14) {
        prices = chart.prices.map(p => {
            if (Array.isArray(p)) return p[1];
            if (typeof p === 'object' && p.price) return p.price;
            return Number(p);
        }).filter(p => !isNaN(p) && p > 0);
    }

    // RSI واقعی اگه داده داریم
    let rsi = null;
    if (prices.length >= 15) {
        rsi = calculateRSI(prices, 14);
    }

    // MACD واقعی
    let macd = null;
    let macdSignal = null;
    let macdHistogram = null;
    if (prices.length >= 26) {
        const macdData = calculateMACD(prices);
        macd = macdData.macd;
        macdSignal = macdData.signal;
        macdHistogram = macdData.histogram;
    }

    // SMA واقعی
    let sma20 = null;
    let sma50 = null;
    if (prices.length >= 20) {
        sma20 = prices.slice(-20).reduce((a, b) => a + b, 0) / 20;
    }
    if (prices.length >= 50) {
        sma50 = prices.slice(-50).reduce((a, b) => a + b, 0) / 50;
    }

    // اگه نداشتیم، mock هوشمند
    if (rsi === null) rsi = calculateMockRSI(change);
    if (macd === null) macd = change * 2.5;
    if (sma20 === null) sma20 = price * 0.995;

    return {
        rsi: Math.max(15, Math.min(85, rsi)),
        macd,
        macdSignal,
        macdHistogram,
        sma20,
        sma50,
        support: price * (1 - volatility * 0.7),
        resistance: price * (1 + volatility * 0.7),
        volatility,
    };
}

// ============================================================
// RSI Calculation
// ============================================================

function calculateRSI(prices, period = 14) {
    if (prices.length < period + 1) return null;

    let gains = 0;
    let losses = 0;

    for (let i = 1; i <= period; i++) {
        const diff = prices[i] - prices[i - 1];
        if (diff >= 0) gains += diff;
        else losses -= diff;
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;

    for (let i = period + 1; i < prices.length; i++) {
        const diff = prices[i] - prices[i - 1];
        const gain = diff > 0 ? diff : 0;
        const loss = diff < 0 ? -diff : 0;

        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
    }

    if (avgLoss === 0) return 100;
    const rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
}

// ============================================================
// MACD Calculation
// ============================================================

function calculateMACD(prices, fastPeriod = 12, slowPeriod = 26, signalPeriod = 9) {
    if (prices.length < slowPeriod + signalPeriod) return null;

    const emaFast = calculateEMA(prices, fastPeriod);
    const emaSlow = calculateEMA(prices, slowPeriod);

    if (emaFast === null || emaSlow === null) return null;

    const macd = emaFast - emaSlow;

    // Signal line requires MACD history; simplified here
    const signal = macd * 0.8;
    const histogram = macd - signal;

    return { macd, signal, histogram };
}

function calculateEMA(prices, period) {
    if (prices.length < period) return null;

    const k = 2 / (period + 1);
    let ema = prices.slice(0, period).reduce((a, b) => a + b, 0) / period;

    for (let i = period; i < prices.length; i++) {
        ema = prices[i] * k + ema * (1 - k);
    }

    return ema;
}

// ============================================================
// Mock helpers
// ============================================================

function calculateMockRSI(change24h) {
    const base = 50;
    const impact = Math.max(Math.min(change24h * 3, 45), -45);
    return base + impact;
}

// ============================================================
// Render Indicators
// ============================================================

function renderIndicators(data) {
    const grid = document.getElementById('indicatorsGrid');
    if (!grid) return;

    const items = [
        {
            label: '💰 قیمت',
            icon: '💰',
            value: formatCurrency(data.price),
            color: 'cyan',
        },
        {
            label: '📈 تغییر ۲۴h',
            icon: '📈',
            value: formatPercent(data.change24h),
            color: data.change24h >= 0 ? 'green' : 'red',
        },
        {
            label: '⬆️ بالاترین ۲۴h',
            icon: '⬆️',
            value: formatCurrency(data.high24h),
            color: 'green',
        },
        {
            label: '⬇️ پایین‌ترین ۲۴h',
            icon: '⬇️',
            value: formatCurrency(data.low24h),
            color: 'red',
        },
        {
            label: '📊 RSI (14)',
            icon: '📊',
            value: data.rsi.toFixed(1),
            color: data.rsi > 70 ? 'red' : data.rsi < 30 ? 'green' : 'orange',
            hint: data.rsi > 70 ? 'اشباع خرید' : data.rsi < 30 ? 'اشباع فروش' : 'خنثی',
            gauge: {
                value: data.rsi,
                max: 100,
                type: data.rsi > 70 ? 'danger' : data.rsi < 30 ? 'good' : 'warning',
            },
        },
        {
            label: '📉 MACD',
            icon: '📉',
            value: data.macd.toFixed(2),
            color: data.macd > 0 ? 'green' : 'red',
            hint: data.macd > 0 ? 'صعودی' : 'نزولی',
        },
        {
            label: '🛡️ حمایت',
            icon: '🛡️',
            value: formatCurrency(data.support),
            color: 'cyan',
        },
        {
            label: '⚔️ مقاومت',
            icon: '⚔️',
            value: formatCurrency(data.resistance),
            color: 'purple',
        },
        {
            label: '😨 ترس و طمع',
            icon: '😨',
            value: data.fearGreed,
            color: data.fearGreed > 70 ? 'red' : data.fearGreed < 30 ? 'green' : 'orange',
            hint: data.fearGreedLabel,
            gauge: {
                value: data.fearGreed,
                max: 100,
                type: data.fearGreed > 70 ? 'danger' : data.fearGreed < 30 ? 'good' : 'warning',
            },
        },
        {
            label: '📊 سلطه BTC',
            icon: '📊',
            value: data.btcDominance.toFixed(1) + '%',
            color: 'cyan',
            gauge: {
                value: data.btcDominance,
                max: 100,
                type: 'good',
            },
        },
        {
            label: '📦 حجم ۲۴h',
            icon: '📦',
            value: formatNumber(data.volume24h),
            color: 'cyan',
        },
        {
            label: '📈 نوسان',
            icon: '📈',
            value: (data.volatility * 100).toFixed(2) + '%',
            color: data.volatility > 0.05 ? 'red' : data.volatility > 0.03 ? 'orange' : 'green',
            hint: data.volatility > 0.05 ? 'بالا' : data.volatility > 0.03 ? 'متوسط' : 'پایین',
        },
    ];

    grid.innerHTML = items.map((item, i) => {
        const delay = Math.min(i * 0.04, 0.5);

        let gaugeHtml = '';
        if (item.gauge) {
            const pct = Math.min((item.gauge.value / item.gauge.max) * 100, 100);
            gaugeHtml = `
                <div class="ic-gauge">
                    <div class="ic-gauge-fill ${item.gauge.type || ''}" style="width:${pct}%"></div>
                </div>
            `;
        }

        const hintHtml = item.hint
            ? `<div class="ic-hint">${escapeIndicatorsHtml(item.hint)}</div>`
            : '';

        return `
            <div class="indicator-card" style="animation-delay:${delay}s;">
                <div class="ic-label">
                    <span>${item.icon}</span>
                    <span>${escapeIndicatorsHtml(item.label)}</span>
                </div>
                <div class="ic-value text-${item.color}">
                    ${item.value}
                </div>
                ${hintHtml}
                ${gaugeHtml}
            </div>
        `;
    }).join('');
}

// ============================================================
// UI States
// ============================================================

function showIndicatorsSkeleton(grid) {
    grid.innerHTML = Array(8).fill('').map((_, i) => `
        <div class="ind-skeleton" style="animation-delay:${i * 0.04}s;"></div>
    `).join('');
}

function showIndicatorsError(grid, message) {
    grid.innerHTML = `
        <div class="empty-state error" style="grid-column:1/-1;">
            <span class="empty-icon">❌</span>
            <div class="empty-title">خطا در دریافت شاخص‌ها</div>
            <div class="empty-message">${escapeIndicatorsHtml(message)}</div>
            <button class="empty-action" onclick="loadIndicators()">
                <i class="fas fa-sync-alt"></i>
                تلاش مجدد
            </button>
        </div>
    `;
}

function updateIndicatorsStatus(status, text) {
    const badge = document.getElementById('indicatorsStatus');
    if (!badge) return;

    const statusColors = {
        online: 'var(--color-green)',
        warning: 'var(--color-orange)',
        offline: 'var(--color-red)',
        unknown: 'var(--text-muted)',
    };

    const indicator = badge.querySelector('.status-indicator');
    const textEl = badge.querySelector('.status-text');

    if (indicator) indicator.style.background = statusColors[status] || statusColors.unknown;
    if (textEl) textEl.textContent = text;
}

// ============================================================
// Refresh
// ============================================================

function refreshIndicators() {
    if (typeof showToast === 'function') showToast('🔄 بروزرسانی شاخص‌ها...', 'info', 1500);
    loadIndicators();
}

// ============================================================
// Helpers
// ============================================================

function escapeIndicatorsHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeIndicatorsAttr(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}
</script>
