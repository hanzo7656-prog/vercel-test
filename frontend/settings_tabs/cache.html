<!-- ============================================================
     settings_tabs/cache.html - تب کش
     نسخه ۱.۰ - تنظیمات Cache
     ============================================================ -->

<div class="settings-tab-content">

    <!-- ===== گروه ۱: TTL ها ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-clock"></i>
            <span>مدت زمان نگهداری (TTL)</span>
        </div>

        <!-- Prices -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-dollar-sign"></i>
                <span>قیمت‌ها</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_prices" min="1" max="3600" step="1" value="60" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="settings-btn settings-btn-secondary" onclick="clearCacheKey('prices')" style="padding: 6px 12px;">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Coins List -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-coins"></i>
                <span>لیست ارزها</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_coinsList" min="60" max="86400" step="60" value="86400" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="settings-btn settings-btn-secondary" onclick="clearCacheKey('coinsList')" style="padding: 6px 12px;">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Fear & Greed -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-smile"></i>
                <span>ترس و طمع</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_fearGreed" min="30" max="3600" step="10" value="300" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="settings-btn settings-btn-secondary" onclick="clearCacheKey('fearGreed')" style="padding: 6px 12px;">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- BTC Dominance -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-chart-pie"></i>
                <span>سلطه بیت‌کوین</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_btcDominance" min="30" max="3600" step="10" value="300" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="settings-btn settings-btn-secondary" onclick="clearCacheKey('btcDominance')" style="padding: 6px 12px;">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Model Status -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-brain"></i>
                <span>وضعیت مدل</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_modelStatus" min="1" max="600" step="1" value="10" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="settings-btn settings-btn-secondary" onclick="clearCacheKey('modelStatus')" style="padding: 6px 12px;">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Chart -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-chart-line"></i>
                <span>داده‌های نمودار</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_chart" min="60" max="86400" step="60" value="3600" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="settings-btn settings-btn-secondary" onclick="clearCacheKey('chart')" style="padding: 6px 12px;">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Actions -->
        <div class="settings-actions">
            <button class="settings-btn settings-btn-primary" onclick="saveCacheSettings()">
                <i class="fas fa-save"></i>
                ذخیره
            </button>
            <button class="settings-btn settings-btn-danger" onclick="clearAllCaches()">
                <i class="fas fa-trash"></i>
                پاک کردن همه
            </button>
            <button class="settings-btn settings-btn-secondary" onclick="resetCacheSettings()">
                <i class="fas fa-undo"></i>
                بازنشانی
            </button>
        </div>
    </div>

    <!-- ===== گروه ۲: آمار Cache ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-chart-bar"></i>
            <span>آمار Cache فعلی</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">تعداد کلیدها</span>
            <span class="info-value cyan" id="cache_total_keys">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">حجم تخمینی</span>
            <span class="info-value purple" id="cache_memory_usage">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">آخرین پاک‌سازی</span>
            <span class="info-value" id="cache_last_clear">—</span>
        </div>

        <div class="settings-actions">
            <button class="settings-btn settings-btn-secondary" onclick="refreshCacheStats()">
                <i class="fas fa-sync-alt"></i>
                بروزرسانی آمار
            </button>
        </div>
    </div>

</div>

<script>
// ============================================================
// CACHE TAB CONTROLLER
// ============================================================

function init_settings_cache() {
    console.log('💾 Initializing cache tab...');
    loadCacheSettings();
    refreshCacheStats();
    
    // شروع بروزرسانی خودکار آمار
    if (window._cacheStatsInterval) {
        clearInterval(window._cacheStatsInterval);
    }
    window._cacheStatsInterval = setInterval(refreshCacheStats, 10000);
}

function cleanup_settings_cache() {
    console.log('🧹 Cleaning up cache tab...');
    
    if (window._cacheStatsInterval) {
        clearInterval(window._cacheStatsInterval);
        window._cacheStatsInterval = null;
    }
}

// ============================================================
// LOAD
// ============================================================

function loadCacheSettings() {
    try {
        const settings = appSettings.get('cache') || {};
        
        const keys = ['prices', 'coinsList', 'fearGreed', 'btcDominance', 'modelStatus', 'chart'];
        
        keys.forEach(key => {
            const el = document.getElementById(`cache_${key}`);
            if (el) el.value = settings[key] || 60;
        });
        
        console.log('✅ Cache settings loaded');
    } catch (err) {
        console.error('❌ Failed to load cache settings:', err);
    }
}

// ============================================================
// SAVE
// ============================================================

async function saveCacheSettings() {
    try {
        const keys = ['prices', 'coinsList', 'fearGreed', 'btcDominance', 'modelStatus', 'chart'];
        const newSettings = {};
        
        keys.forEach(key => {
            const el = document.getElementById(`cache_${key}`);
            newSettings[key] = parseInt(el?.value) || 60;
        });
        
        await appSettings.save('cache', newSettings);
        
        window.showToast?.('✅ تنظیمات ذخیره شد', 'success');
        console.log('✅ Cache settings saved:', newSettings);
    } catch (err) {
        console.error('❌ Failed to save cache settings:', err);
        window.showToast?.('❌ خطا در ذخیره', 'error');
    }
}

// ============================================================
// CLEAR SINGLE
// ============================================================

async function clearCacheKey(key) {
    if (!window.confirm) return;
    
    const confirmed = await window.confirm(
        'پاک کردن کش',
        `آیا مطمئن هستید که می‌خواهید کش "${key}" را پاک کنید؟`,
        'بله',
        'انصراف'
    );
    
    if (!confirmed) return;
    
    try {
        // پاک کردن از app cache
        if (window.appCache?.invalidate) {
            window.appCache.invalidate(key);
        }
        
        // پاک کردن از Redis
        if (window.api?.clearRedisNamespace) {
            await window.api.clearRedisNamespace(key);
        }
        
        window.showToast?.(`✅ کش "${key}" پاک شد`, 'success');
        refreshCacheStats();
    } catch (err) {
        console.error(`❌ Failed to clear cache "${key}":`, err);
        window.showToast?.('❌ خطا در پاک کردن', 'error');
    }
}

// ============================================================
// CLEAR ALL
// ============================================================

async function clearAllCaches() {
    if (!window.confirm) return;
    
    const confirmed = await window.confirm(
        'پاک کردن همه کش',
        'آیا مطمئن هستید؟ همه کش‌ها پاک می‌شوند. این کار ممکن است سرعت برنامه را موقتاً کاهش دهد.',
        'بله، پاک کن',
        'انصراف'
    );
    
    if (!confirmed) return;
    
    try {
        // پاک کردن از app
        if (window.appCache?.clear) {
            window.appCache.clear();
        }
        
        // پاک کردن Redis
        if (window.api?.clearRedis) {
            await window.api.clearRedis(true);
        }
        
        // ذخیره زمان
        localStorage.setItem('cache_last_clear', new Date().toISOString());
        
        window.showToast?.('✅ همه کش‌ها پاک شدند', 'success');
        refreshCacheStats();
    } catch (err) {
        console.error('❌ Failed to clear all caches:', err);
        window.showToast?.('❌ خطا در پاک کردن', 'error');
    }
}

// ============================================================
// RESET
// ============================================================

async function resetCacheSettings() {
    if (!window.confirm) return;
    
    const confirmed = await window.confirm(
        'بازنشانی تنظیمات',
        'آیا مطمئن هستید؟',
        'بله',
        'انصراف'
    );
    
    if (!confirmed) return;
    
    try {
        appSettings.reset('cache');
        loadCacheSettings();
        window.showToast?.('✅ بازنشانی شد', 'success');
    } catch (err) {
        console.error('❌ Failed to reset cache settings:', err);
    }
}

// ============================================================
// STATS
// ============================================================

async function refreshCacheStats() {
    try {
        // از app cache
        const stats = window.appCache?.stats?.() || { size: 0, keys: [] };
        
        const keysEl = document.getElementById('cache_total_keys');
        const memEl = document.getElementById('cache_memory_usage');
        const lastClearEl = document.getElementById('cache_last_clear');
        
        if (keysEl) keysEl.textContent = stats.size || 0;
        
        if (memEl) {
            // تخمین حجم
            const estimated = (stats.size || 0) * 1024; // ~1KB per key
            memEl.textContent = window.formatFileSize?.(estimated) || '0 B';
        }
        
        if (lastClearEl) {
            const lastClear = localStorage.getItem('cache_last_clear');
            lastClearEl.textContent = lastClear 
                ? (window.formatTimeAgo?.(lastClear) || '—')
                : '—';
        }
        
        // از Redis
        try {
            const redisStats = await window.api?.getRedisStats?.();
            if (redisStats?.success && redisStats.data) {
                const redisKeys = redisStats.data.keys?.total || 0;
                if (keysEl) keysEl.textContent = `${stats.size || 0} + Redis: ${redisKeys}`;
            }
        } catch (e) {
            // بی‌خطر
        }
    } catch (err) {
        console.error('❌ Failed to refresh cache stats:', err);
    }
}

console.log('✅ Cache tab script loaded');
</script>
