<!-- ============================================================
     settings_tabs/cache.html — تب کش
     نسخه ۲.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="settings-tab-content">

    <!-- ===== گروه ۱: TTL ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-clock"></i>
            <span>مدت زمان نگهداری (TTL)</span>
        </div>

        <!-- Prices -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-dollar-sign"></i>
                <span>قیمت‌ها</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_prices" min="1" max="3600" step="1" value="60" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="btn btn-outline btn-xs" onclick="clearCacheKey('prices')" title="پاک کردن">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Coins List -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-coins"></i>
                <span>لیست ارزها</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_coinsList" min="60" max="86400" step="60" value="86400" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="btn btn-outline btn-xs" onclick="clearCacheKey('coinsList')" title="پاک کردن">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Fear & Greed -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-smile"></i>
                <span>ترس و طمع</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_fearGreed" min="30" max="3600" step="10" value="300" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="btn btn-outline btn-xs" onclick="clearCacheKey('fearGreed')" title="پاک کردن">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- BTC Dominance -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-chart-pie"></i>
                <span>سلطه بیت‌کوین</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_btcDominance" min="30" max="3600" step="10" value="300" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="btn btn-outline btn-xs" onclick="clearCacheKey('btcDominance')" title="پاک کردن">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Model Status -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-brain"></i>
                <span>وضعیت مدل</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_modelStatus" min="1" max="600" step="1" value="10" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="btn btn-outline btn-xs" onclick="clearCacheKey('modelStatus')" title="پاک کردن">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Chart -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-chart-line"></i>
                <span>داده‌های نمودار</span>
            </span>
            <div class="toggle-wrapper">
                <input type="number" id="cache_chart" min="60" max="86400" step="60" value="3600" style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
                <button class="btn btn-outline btn-xs" onclick="clearCacheKey('chart')" title="پاک کردن">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Actions -->
        <div class="settings-actions">
            <button class="btn btn-primary btn-sm" onclick="saveCacheSettings()">
                <i class="fas fa-save"></i>
                <span>ذخیره</span>
            </button>
            <button class="btn btn-danger btn-sm" onclick="clearAllCaches()">
                <i class="fas fa-trash"></i>
                <span>پاک کردن همه</span>
            </button>
            <button class="btn btn-outline btn-sm" onclick="resetCacheSettings()">
                <i class="fas fa-undo"></i>
                <span>بازنشانی</span>
            </button>
        </div>
    </div>

    <!-- ===== گروه ۲: آمار Cache ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-chart-bar"></i>
            <span>آمار Cache فعلی</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">تعداد کلیدها</span>
            <span class="info-value cyan" id="cache_total_keys">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">حجم تخمینی</span>
            <span class="info-value purple" id="cache_memory_usage">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">آخرین پاک‌سازی</span>
            <span class="info-value" id="cache_last_clear">—</span>
        </div>

        <div class="settings-actions">
            <button class="btn btn-outline btn-sm" onclick="refreshCacheStats()">
                <i class="fas fa-sync-alt"></i>
                <span>بروزرسانی آمار</span>
            </button>
        </div>
    </div>

</div>

<script>
// ============================================================
// SETTINGS CACHE TAB
// ============================================================

const _CACHE_KEYS = ['prices', 'coinsList', 'fearGreed', 'btcDominance', 'modelStatus', 'chart'];
let _cacheStatsInterval = null;

// ============================================================
// Load
// ============================================================

function loadCacheSettings() {
    try {
        const settings = window.appSettings?.get('cache') || {};

        _CACHE_KEYS.forEach(key => {
            const el = document.getElementById(`cache_${key}`);
            if (el) el.value = settings[key] || 60;
        });

        console.log('✅ Cache settings loaded');
    } catch (err) {
        console.error('❌ Load cache settings error:', err);
    }
}

// ============================================================
// Save
// ============================================================

async function saveCacheSettings() {
    try {
        const newSettings = {};

        _CACHE_KEYS.forEach(key => {
            const el = document.getElementById(`cache_${key}`);
            newSettings[key] = parseInt(el?.value) || 60;
        });

        await window.appSettings.save('cache', newSettings);

        if (typeof showToast === 'function') {
            showToast('✅ تنظیمات ذخیره شد', 'success');
        }
    } catch (err) {
        console.error('❌ Save cache error:', err);
        if (typeof showToast === 'function') {
            showToast('❌ خطا در ذخیره', 'error');
        }
    }
}

// ============================================================
// Clear single
// ============================================================

async function clearCacheKey(key) {
    const confirmed = await confirmDialog(
        'پاک کردن کش',
        `آیا مطمئن هستید که می‌خواهید کش "${key}" را پاک کنید؟`
    );

    if (!confirmed) return;

    try {
        // ✅ appCache.invalidate() → app.cacheInvalidate()
        window.appCache?.invalidate?.(key);

        // ✅ api.clearRedisNamespace() که تو api.js هست
        await window.api?.clearRedisNamespace?.(key);

        if (typeof showToast === 'function') {
            showToast(`✅ کش "${key}" پاک شد`, 'success');
        }
        refreshCacheStats();
    } catch (err) {
        console.error(`❌ Clear cache "${key}" error:`, err);
        if (typeof showToast === 'function') {
            showToast('❌ خطا در پاک کردن', 'error');
        }
    }
}

// ============================================================
// Clear all
// ============================================================

async function clearAllCaches() {
    const confirmed = await confirmDialog(
        'پاک کردن همه کش',
        'آیا مطمئن هستید؟ همه کش‌ها پاک می‌شوند.'
    );

    if (!confirmed) return;

    try {
        // ✅ appCache.clear() → app.cacheClear()
        window.appCache?.clear?.();

        // ✅ api.clearRedis(true) که تو api.js هست
        await window.api?.clearRedis?.(true);

        // ذخیره زمان
        localStorage.setItem('cache_last_clear', new Date().toISOString());

        if (typeof showToast === 'function') {
            showToast('✅ همه کش‌ها پاک شدند', 'success');
        }
        refreshCacheStats();
    } catch (err) {
        console.error('❌ Clear all caches error:', err);
        if (typeof showToast === 'function') {
            showToast('❌ خطا در پاک کردن', 'error');
        }
    }
}

// ============================================================
// Reset
// ============================================================

async function resetCacheSettings() {
    const confirmed = await confirmDialog(
        'بازنشانی تنظیمات',
        'آیا مطمئن هستید؟'
    );

    if (!confirmed) return;

    try {
        await window.appSettings.reset('cache');
        loadCacheSettings();

        if (typeof showToast === 'function') {
            showToast('✅ بازنشانی شد', 'success');
        }
    } catch (err) {
        console.error('❌ Reset cache error:', err);
    }
}

// ============================================================
// Stats
// ============================================================

async function refreshCacheStats() {
    try {
        const stats = window.appCache?.stats?.() || { size: 0, keys: [] };

        const keysEl = document.getElementById('cache_total_keys');
        const memEl = document.getElementById('cache_memory_usage');
        const lastClearEl = document.getElementById('cache_last_clear');

        if (keysEl) keysEl.textContent = stats.size || 0;

        if (memEl) {
            const estimated = (stats.size || 0) * 1024;
            memEl.textContent = (typeof formatFileSize === 'function')
                ? formatFileSize(estimated)
                : '0 B';
        }

        if (lastClearEl) {
            const lastClear = localStorage.getItem('cache_last_clear');
            lastClearEl.textContent = lastClear
                ? ((typeof formatTimeAgo === 'function') ? formatTimeAgo(lastClear) : '—')
                : '—';
        }

        // ✅ api.getRedisStats() که تو api.js هست
        try {
            const redisStats = await window.api?.getRedisStats?.();
            if (redisStats?.success && redisStats.data) {
                const redisKeys = redisStats.data.keys?.total || 0;
                if (keysEl) {
                    keysEl.textContent = `${stats.size || 0} + Redis: ${redisKeys}`;
                }
            }
        } catch (e) { /* silent */ }
    } catch (err) {
        console.error('❌ Refresh cache stats error:', err);
    }
}

// ============================================================
// Helpers
// ============================================================

async function confirmDialog(title, text) {
    if (typeof window.confirm === 'function') {
        try {
            return await window.confirm(title, text, 'بله', 'انصراف');
        } catch (e) {
            return window.confirm(`${title}\n${text}`);
        }
    }
    return window.confirm(`${title}\n${text}`);
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_settings_cache = function() {
    console.log('💾 Settings cache tab initializing...');
    loadCacheSettings();
    refreshCacheStats();

    if (_cacheStatsInterval) clearInterval(_cacheStatsInterval);
    _cacheStatsInterval = setInterval(() => {
        const activeTab = document.querySelector('#settingsTabs .settings-tab-btn.active');
        if (activeTab?.dataset.tab === 'cache') {
            refreshCacheStats();
        }
    }, 10000);
};

window.cleanup_settings_cache = function() {
    console.log('🧹 Settings cache tab cleaning up...');
    if (_cacheStatsInterval) {
        clearInterval(_cacheStatsInterval);
        _cacheStatsInterval = null;
    }
};
</script>
