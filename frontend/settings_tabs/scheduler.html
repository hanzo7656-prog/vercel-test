<!-- ============================================================
     settings_tabs/scheduler.html — تب همگام‌سازی
     نسخه ۲.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="settings-tab-content">

    <!-- ===== گروه ۱: زمان‌بندی ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-sync-alt"></i>
            <span>زمان‌بندی بروزرسانی خودکار</span>
        </div>

        <!-- Metrics -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-chart-line"></i>
                <span>متریک‌های سیستم</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="scheduler_metrics_enabled">
                    <span class="toggle-slider"></span>
                </label>
                <input type="number" id="scheduler_metrics_interval"
                       min="1" max="300" step="1" value="10"
                       style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
            </div>
        </div>

        <!-- App Stats -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-microchip"></i>
                <span>آمار اپلیکیشن</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="scheduler_appStats_enabled">
                    <span class="toggle-slider"></span>
                </label>
                <input type="number" id="scheduler_appStats_interval"
                       min="1" max="300" step="1" value="3"
                       style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
            </div>
        </div>

        <!-- Alerts -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-bell"></i>
                <span>هشدارها</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="scheduler_alerts_enabled">
                    <span class="toggle-slider"></span>
                </label>
                <input type="number" id="scheduler_alerts_interval"
                       min="1" max="600" step="1" value="30"
                       style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
            </div>
        </div>

        <!-- DB Health -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-database"></i>
                <span>وضعیت دیتابیس</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="scheduler_dbHealth_enabled">
                    <span class="toggle-slider"></span>
                </label>
                <input type="number" id="scheduler_dbHealth_interval"
                       min="5" max="600" step="1" value="60"
                       style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
            </div>
        </div>

        <!-- Model Status -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-brain"></i>
                <span>وضعیت مدل</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="scheduler_modelStatus_enabled">
                    <span class="toggle-slider"></span>
                </label>
                <input type="number" id="scheduler_modelStatus_interval"
                       min="5" max="600" step="1" value="15"
                       style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
            </div>
        </div>

        <!-- Quotas -->
        <div class="settings-row">
            <span class="label">
                <i class="fas fa-hdd"></i>
                <span>وضعیت Quota</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="scheduler_quotas_enabled">
                    <span class="toggle-slider"></span>
                </label>
                <input type="number" id="scheduler_quotas_interval"
                       min="10" max="1800" step="1" value="120"
                       style="width: 80px;">
                <span class="toggle-label">ثانیه</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="settings-actions">
            <button class="btn btn-primary btn-sm" onclick="saveSchedulerSettings()">
                <i class="fas fa-save"></i>
                <span>ذخیره</span>
            </button>
            <button class="btn btn-outline btn-sm" onclick="applySchedulerNow()">
                <i class="fas fa-play"></i>
                <span>اعمال فوری</span>
            </button>
            <button class="btn btn-outline btn-sm" onclick="resetSchedulerSettings()">
                <i class="fas fa-undo"></i>
                <span>بازنشانی</span>
            </button>
        </div>
    </div>

    <!-- ===== گروه ۲: وضعیت فعلی ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-info-circle"></i>
            <span>وضعیت فعلی Scheduler</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">وضعیت کلی</span>
            <span class="info-value" id="scheduler_overall_status">
                <span class="status-dot"></span>
                در حال بررسی...
            </span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">تعداد تسک‌های فعال</span>
            <span class="info-value cyan" id="scheduler_active_tasks">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">حالت Pause</span>
            <span class="info-value" id="scheduler_paused">—</span>
        </div>

        <div class="settings-actions">
            <button class="btn btn-outline btn-sm" onclick="pauseAllSchedulerTasks()">
                <i class="fas fa-pause"></i>
                <span>توقف همه</span>
            </button>
            <button class="btn btn-primary btn-sm" onclick="resumeAllSchedulerTasks()">
                <i class="fas fa-play"></i>
                <span>ادامه همه</span>
            </button>
        </div>
    </div>

</div>

<script>
// ============================================================
// SETTINGS SCHEDULER TAB
// ============================================================

const _SCHEDULER_TASKS = ['metrics', 'appStats', 'alerts', 'dbHealth', 'modelStatus', 'quotas'];
let _schedulerInterval = null;

// ============================================================
// Load
// ============================================================

function loadSchedulerSettings() {
    try {
        // ✅ appSettings.get() که از app.js → api.getSettingsCategory('scheduler')
        const settings = window.appSettings?.get('scheduler') || {};

        _SCHEDULER_TASKS.forEach(task => {
            const taskConfig = settings[task] || {};

            const enabledEl = document.getElementById(`scheduler_${task}_enabled`);
            const intervalEl = document.getElementById(`scheduler_${task}_interval`);

            if (enabledEl) enabledEl.checked = taskConfig.enabled === true;

            if (intervalEl) {
                const ms = taskConfig.interval || 10000;
                intervalEl.value = Math.round(ms / 1000);
            }
        });

        console.log('✅ Scheduler settings loaded');
    } catch (err) {
        console.error('❌ Load scheduler settings error:', err);
    }
}

// ============================================================
// Save
// ============================================================

async function saveSchedulerSettings() {
    try {
        const newSettings = {};

        _SCHEDULER_TASKS.forEach(task => {
            const enabledEl = document.getElementById(`scheduler_${task}_enabled`);
            const intervalEl = document.getElementById(`scheduler_${task}_interval`);

            newSettings[task] = {
                enabled: enabledEl ? enabledEl.checked : false,
                interval: (parseInt(intervalEl?.value) || 10) * 1000,
            };
        });

        // ✅ appSettings.save() → api.saveSettingsCategory('scheduler')
        await window.appSettings.save('scheduler', newSettings);

        if (typeof showToast === 'function') {
            showToast('✅ تنظیمات ذخیره شد', 'success');
        }

        setTimeout(loadSchedulerStatus, 500);
    } catch (err) {
        console.error('❌ Save scheduler settings error:', err);
        if (typeof showToast === 'function') {
            showToast('❌ خطا در ذخیره', 'error');
        }
    }
}

// ============================================================
// Apply Now
// ============================================================

function applySchedulerNow() {
    try {
        if (window.app && typeof window.app._applySchedulerSettings === 'function') {
            window.app._applySchedulerSettings();
            if (typeof showToast === 'function') {
                showToast('✅ تنظیمات اعمال شد', 'success');
            }
            setTimeout(loadSchedulerStatus, 300);
        } else {
            if (typeof showToast === 'function') {
                showToast('⚠️ در حال توسعه', 'warning');
            }
        }
    } catch (err) {
        console.error('❌ Apply scheduler error:', err);
    }
}

// ============================================================
// Reset
// ============================================================

async function resetSchedulerSettings() {
    const confirmed = await confirmDialog(
        'بازنشانی تنظیمات',
        'آیا مطمئن هستید؟ تنظیمات به حالت پیش‌فرض برمی‌گردد.'
    );

    if (!confirmed) return;

    try {
        // ✅ appSettings.reset() → api.resetSettingsCategory('scheduler')
        await window.appSettings.reset('scheduler');
        loadSchedulerSettings();

        if (typeof showToast === 'function') {
            showToast('✅ بازنشانی شد', 'success');
        }
    } catch (err) {
        console.error('❌ Reset scheduler error:', err);
    }
}

// ============================================================
// Status
// ============================================================

function loadSchedulerStatus() {
    try {
        // ✅ appTasks.status() → app.getTasksStatus()
        const status = window.appTasks?.status?.() || {};
        const taskCount = Object.keys(status).length;
        const activeCount = Object.values(status).filter(t => t.enabled).length;

        const statusEl = document.getElementById('scheduler_overall_status');
        const activeEl = document.getElementById('scheduler_active_tasks');
        const pausedEl = document.getElementById('scheduler_paused');

        if (statusEl) {
            if (activeCount > 0) {
                statusEl.innerHTML = '<span class="status-dot online"></span>فعال';
                statusEl.className = 'info-value green';
            } else {
                statusEl.innerHTML = '<span class="status-dot"></span>غیرفعال';
                statusEl.className = 'info-value';
            }
        }

        if (activeEl) {
            activeEl.textContent = `${activeCount} از ${taskCount}`;
        }

        if (pausedEl) {
            const isPaused = window.app?._isPaused || false;
            pausedEl.textContent = isPaused ? '⏸️ بله' : '▶️ خیر';
            pausedEl.className = `info-value ${isPaused ? 'orange' : 'green'}`;
        }
    } catch (err) {
        console.error('❌ Load scheduler status error:', err);
    }
}

// ============================================================
// Pause / Resume
// ============================================================

function pauseAllSchedulerTasks() {
    try {
        // ✅ appTasks.pause() → app.pauseAllTasks()
        window.appTasks?.pause?.();
        if (typeof showToast === 'function') showToast('⏸️ همه تسک‌ها متوقف شدند', 'warning');
        loadSchedulerStatus();
    } catch (err) {
        console.error('❌ Pause error:', err);
    }
}

function resumeAllSchedulerTasks() {
    try {
        window.appTasks?.resume?.();
        if (typeof showToast === 'function') showToast('▶️ همه تسک‌ها ادامه یافتند', 'success');
        loadSchedulerStatus();
    } catch (err) {
        console.error('❌ Resume error:', err);
    }
}

// ============================================================
// Helpers
// ============================================================

async function confirmDialog(title, text) {
    if (typeof window.confirm === 'function') {
        try {
            return await window.confirm(title, text, 'بله', 'انصراف');
        } catch (e) {
            return window.confirm(`${title}\n${text}`);
        }
    }
    return window.confirm(`${title}\n${text}`);
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_settings_scheduler = function() {
    console.log('⚙️ Settings scheduler tab initializing...');
    loadSchedulerSettings();
    loadSchedulerStatus();

    if (_schedulerInterval) clearInterval(_schedulerInterval);
    _schedulerInterval = setInterval(() => {
        const activeTab = document.querySelector('#settingsTabs .settings-tab-btn.active');
        if (activeTab?.dataset.tab === 'scheduler') {
            loadSchedulerStatus();
        }
    }, 5000);
};

window.cleanup_settings_scheduler = function() {
    console.log('🧹 Settings scheduler tab cleaning up...');
    if (_schedulerInterval) {
        clearInterval(_schedulerInterval);
        _schedulerInterval = null;
    }
};
</script>
