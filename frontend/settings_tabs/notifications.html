<!-- ============================================================
     settings_tabs/notifications.html — تب اعلان‌ها
     نسخه ۲.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="settings-tab-content">

    <!-- ===== گروه ۱: تنظیمات پایه ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-bell"></i>
            <span>تنظیمات اعلان‌ها</span>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-bell"></i>
                <span>فعال‌سازی اعلان‌ها</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="notif_enabled">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">Browser Notification</span>
            </div>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-volume-up"></i>
                <span>صدای اعلان</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="notif_sound">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">پخش صدا</span>
            </div>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-exclamation-triangle"></i>
                <span>فقط هشدارهای بحرانی</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="notif_criticalOnly">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">CRITICAL فقط</span>
            </div>
        </div>
    </div>

    <!-- ===== گروه ۲: Do Not Disturb ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-moon"></i>
            <span>حالت مزاحم نشوید (Do Not Disturb)</span>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-toggle-off"></i>
                <span>فعال‌سازی</span>
            </span>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" id="notif_doNotDisturb">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">در بازه زیر اعلان‌ها قطع شوند</span>
            </div>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-clock"></i>
                <span>ساعت شروع</span>
            </span>
            <input type="time" id="notif_dndStart" value="22:00" class="form-input" style="max-width: 140px;">
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-clock"></i>
                <span>ساعت پایان</span>
            </span>
            <input type="time" id="notif_dndEnd" value="08:00" class="form-input" style="max-width: 140px;">
        </div>
    </div>

    <!-- ===== گروه ۳: تست ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-flask"></i>
            <span>تست اعلان‌ها</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">وضعیت دسترسی</span>
            <span class="info-value" id="notif_permission_status">—</span>
        </div>

        <div class="settings-actions">
            <button class="btn btn-primary btn-sm" onclick="requestNotificationPermission()">
                <i class="fas fa-key"></i>
                <span>درخواست دسترسی</span>
            </button>
            <button class="btn btn-outline btn-sm" onclick="testNotification()">
                <i class="fas fa-bell"></i>
                <span>ارسال اعلان تست</span>
            </button>
        </div>
    </div>

    <!-- ===== Actions ===== -->
    <div class="settings-actions">
        <button class="btn btn-primary btn-sm" onclick="saveNotificationSettings()">
            <i class="fas fa-save"></i>
            <span>ذخیره</span>
        </button>
        <button class="btn btn-outline btn-sm" onclick="resetNotificationSettings()">
            <i class="fas fa-undo"></i>
            <span>بازنشانی</span>
        </button>
    </div>

</div>

<script>
// ============================================================
// SETTINGS NOTIFICATIONS TAB
// ============================================================

// ============================================================
// Load
// ============================================================

function loadNotificationSettings() {
    try {
        const settings = window.appSettings?.get('notifications') || {};

        const setChecked = (id, value) => {
            const el = document.getElementById(id);
            if (el) el.checked = value === true;
        };

        const setValue = (id, value) => {
            const el = document.getElementById(id);
            if (el) el.value = value;
        };

        setChecked('notif_enabled', settings.enabled);
        setChecked('notif_sound', settings.sound);
        setChecked('notif_criticalOnly', settings.criticalOnly);
        setChecked('notif_doNotDisturb', settings.doNotDisturb);

        setValue('notif_dndStart', settings.dndStart || '22:00');
        setValue('notif_dndEnd', settings.dndEnd || '08:00');

        console.log('✅ Notification settings loaded');
    } catch (err) {
        console.error('❌ Load notification settings error:', err);
    }
}

// ============================================================
// Save
// ============================================================

async function saveNotificationSettings() {
    try {
        const newSettings = {
            enabled: document.getElementById('notif_enabled')?.checked || false,
            sound: document.getElementById('notif_sound')?.checked || false,
            criticalOnly: document.getElementById('notif_criticalOnly')?.checked || false,
            doNotDisturb: document.getElementById('notif_doNotDisturb')?.checked || false,
            dndStart: document.getElementById('notif_dndStart')?.value || '22:00',
            dndEnd: document.getElementById('notif_dndEnd')?.value || '08:00',
        };

        await window.appSettings.save('notifications', newSettings);

        if (typeof showToast === 'function') {
            showToast('✅ تنظیمات ذخیره شد', 'success');
        }
    } catch (err) {
        console.error('❌ Save notification error:', err);
        if (typeof showToast === 'function') {
            showToast('❌ خطا در ذخیره', 'error');
        }
    }
}

// ============================================================
// Reset
// ============================================================

async function resetNotificationSettings() {
    const confirmed = await confirmDialog(
        'بازنشانی تنظیمات',
        'آیا مطمئن هستید؟'
    );

    if (!confirmed) return;

    try {
        await window.appSettings.reset('notifications');
        loadNotificationSettings();

        if (typeof showToast === 'function') {
            showToast('✅ بازنشانی شد', 'success');
        }
    } catch (err) {
        console.error('❌ Reset notification error:', err);
    }
}

// ============================================================
// Permissions
// ============================================================

function checkNotificationPermission() {
    const el = document.getElementById('notif_permission_status');
    if (!el) return;

    if (!('Notification' in window)) {
        el.textContent = '❌ پشتیبانی نمی‌شود';
        el.className = 'info-value red';
        return;
    }

    const permission = Notification.permission;

    const labels = {
        granted: '✅ مجاز',
        denied: '❌ رد شده',
        default: '⚠️ درخواست نشده',
    };

    el.textContent = labels[permission] || permission;
    el.className = `info-value ${permission === 'granted' ? 'green' : permission === 'denied' ? 'red' : 'orange'}`;
}

async function requestNotificationPermission() {
    if (!('Notification' in window)) {
        if (typeof showToast === 'function') showToast('❌ مرورگر پشتیبانی نمی‌کند', 'error');
        return;
    }

    try {
        const permission = await Notification.requestPermission();
        checkNotificationPermission();

        if (permission === 'granted') {
            if (typeof showToast === 'function') showToast('✅ دسترسی داده شد', 'success');
        } else {
            if (typeof showToast === 'function') showToast('⚠️ دسترسی داده نشد', 'warning');
        }
    } catch (err) {
        console.error('❌ Permission error:', err);
    }
}

// ============================================================
// Test
// ============================================================

function testNotification() {
    if (!('Notification' in window)) {
        if (typeof showToast === 'function') showToast('❌ مرورگر پشتیبانی نمی‌کند', 'error');
        return;
    }

    if (Notification.permission !== 'granted') {
        if (typeof showToast === 'function') showToast('⚠️ ابتدا دسترسی بدهید', 'warning');
        return;
    }

    try {
        new Notification('🔔 اعلان تست', {
            body: 'این یک اعلان تست است. اگر این را می‌بینید، اعلان‌ها کار می‌کنند.',
            icon: '/favicon.ico',
            tag: 'test-notification',
        });

        if (typeof showToast === 'function') showToast('✅ اعلان تست ارسال شد', 'success');
    } catch (err) {
        console.error('❌ Test notification error:', err);
        if (typeof showToast === 'function') showToast('❌ خطا در ارسال', 'error');
    }
}

// ============================================================
// Helpers
// ============================================================

async function confirmDialog(title, text) {
    if (typeof window.confirm === 'function') {
        try {
            return await window.confirm(title, text, 'بله', 'انصراف');
        } catch (e) {
            return window.confirm(`${title}\n${text}`);
        }
    }
    return window.confirm(`${title}\n${text}`);
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_settings_notifications = function() {
    console.log('🔔 Settings notifications tab initializing...');
    loadNotificationSettings();
    checkNotificationPermission();
};

window.cleanup_settings_notifications = function() {
    console.log('🧹 Settings notifications tab cleaning up...');
    // No interval
};
</script>
