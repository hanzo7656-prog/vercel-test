<!-- ============================================================
     settings_tabs/theme.html — تب ظاهر
     نسخه ۲.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="settings-tab-content">

    <!-- ===== گروه ۱: حالت نمایش ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-adjust"></i>
            <span>حالت نمایش</span>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-moon"></i>
                <span>تم اصلی</span>
            </span>
            <select id="theme_mode_select" class="form-select">
                <option value="dark">🌙 تیره</option>
                <option value="light">☀️ روشن</option>
                <option value="auto">🔄 خودکار (سیستم)</option>
            </select>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-palette"></i>
                <span>رنگ اصلی</span>
            </span>
            <div class="color-swatches" id="theme_accent_swatches">
                <div class="color-swatch" data-color="cyan" style="background: #00d4ff;" title="فیروزه‌ای"></div>
                <div class="color-swatch" data-color="purple" style="background: #8b5cf6;" title="بنفش"></div>
                <div class="color-swatch" data-color="green" style="background: #22d3ee;" title="سبز"></div>
                <div class="color-swatch" data-color="orange" style="background: #f59e0b;" title="نارنجی"></div>
                <div class="color-swatch" data-color="pink" style="background: #ec4899;" title="صورتی"></div>
            </div>
        </div>
    </div>

    <!-- ===== گروه ۲: تایپوگرافی ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-font"></i>
            <span>تایپوگرافی</span>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-font"></i>
                <span>فونت</span>
            </span>
            <select id="theme_font_select" class="form-select">
                <option value="Vazir">Vazir</option>
                <option value="system">System</option>
                <option value="mono">Monospace</option>
            </select>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-text-height"></i>
                <span>اندازه فونت</span>
            </span>
            <div class="interval-slider-wrapper">
                <input type="range"
                       id="theme_font_size"
                       class="interval-slider"
                       min="12"
                       max="20"
                       step="1"
                       value="16">
                <span class="interval-value" id="theme_font_size_value">16px</span>
            </div>
        </div>
    </div>

    <!-- ===== گروه ۳: پیش‌نمایش ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-eye"></i>
            <span>پیش‌نمایش</span>
        </div>

        <div class="theme-preview">
            <h3 class="theme-preview-title">
                <i class="fas fa-rocket"></i>
                این یک پیش‌نمایش است
            </h3>
            <p class="theme-preview-text">
                این متن برای نمایش اندازه فونت و رنگ اصلی استفاده می‌شود.
            </p>
            <div class="theme-preview-actions">
                <button class="btn btn-primary btn-sm">دکمه اولیه</button>
                <button class="btn btn-outline btn-sm">دکمه ثانویه</button>
                <button class="btn btn-danger btn-sm">دکمه خطر</button>
            </div>
        </div>
    </div>

    <!-- ===== Actions ===== -->
    <div class="settings-actions">
        <button class="btn btn-primary btn-sm" onclick="saveThemeSettings()">
            <i class="fas fa-save"></i>
            <span>ذخیره</span>
        </button>
        <button class="btn btn-outline btn-sm" onclick="resetThemeSettings()">
            <i class="fas fa-undo"></i>
            <span>بازنشانی</span>
        </button>
    </div>

</div>

<script>
// ============================================================
// SETTINGS THEME TAB
// ============================================================

let _themeSwatchHandler = null;

// ============================================================
// Load
// ============================================================

function loadThemeSettings() {
    try {
        const settings = window.appSettings?.get('theme') || {};

        // Mode
        const modeSelect = document.getElementById('theme_mode_select');
        if (modeSelect) modeSelect.value = settings.mode || 'dark';

        // Accent
        const accent = settings.accent || 'cyan';
        document.querySelectorAll('#theme_accent_swatches .color-swatch').forEach(s => {
            s.classList.toggle('active', s.dataset.color === accent);
        });

        // Font
        const fontSelect = document.getElementById('theme_font_select');
        if (fontSelect) fontSelect.value = settings.font || 'Vazir';

        // Font size
        const fontSize = settings.fontSize || 16;
        const sizeInput = document.getElementById('theme_font_size');
        const sizeValue = document.getElementById('theme_font_size_value');
        if (sizeInput) sizeInput.value = fontSize;
        if (sizeValue) sizeValue.textContent = fontSize + 'px';

        console.log('✅ Theme settings loaded');
    } catch (err) {
        console.error('❌ Load theme settings error:', err);
    }
}

// ============================================================
// Events
// ============================================================

function setupThemeEvents() {
    // Mode change
    const modeSelect = document.getElementById('theme_mode_select');
    if (modeSelect) {
        modeSelect.addEventListener('change', (e) => {
            const mode = e.target.value;
            // ✅ themeManager.setMode() → apply + save در localStorage
            window.themeManager?.setMode(mode);
        });
    }

    // Accent swatches
    const swatches = document.querySelectorAll('#theme_accent_swatches .color-swatch');
    _themeSwatchHandler = function() {
        swatches.forEach(s => s.classList.remove('active'));
        this.classList.add('active');
        const color = this.dataset.color;
        // ✅ themeManager.setAccent()
        window.themeManager?.setAccent(color);
    };
    swatches.forEach(s => s.addEventListener('click', _themeSwatchHandler));

    // Font size
    const sizeInput = document.getElementById('theme_font_size');
    if (sizeInput) {
        sizeInput.addEventListener('input', (e) => {
            const val = e.target.value;
            const valueEl = document.getElementById('theme_font_size_value');
            if (valueEl) valueEl.textContent = val + 'px';
        });
    }
}

// ============================================================
// Save
// ============================================================

async function saveThemeSettings() {
    try {
        const mode = document.getElementById('theme_mode_select')?.value || 'dark';
        const font = document.getElementById('theme_font_select')?.value || 'Vazir';
        const fontSize = parseInt(document.getElementById('theme_font_size')?.value) || 16;

        const activeSwatch = document.querySelector('#theme_accent_swatches .color-swatch.active');
        const accent = activeSwatch ? activeSwatch.dataset.color : 'cyan';

        const newSettings = { mode, accent, font, fontSize };

        // ✅ appSettings.save('theme') → api.saveSettingsCategory('theme')
        await window.appSettings.save('theme', newSettings);

        // Apply
        window.themeManager?.setMode(mode);
        window.themeManager?.setAccent(accent);

        if (typeof showToast === 'function') {
            showToast('✅ تنظیمات ذخیره شد', 'success');
        }
    } catch (err) {
        console.error('❌ Save theme error:', err);
        if (typeof showToast === 'function') {
            showToast('❌ خطا در ذخیره', 'error');
        }
    }
}

// ============================================================
// Reset
// ============================================================

async function resetThemeSettings() {
    const confirmed = await confirmDialog(
        'بازنشانی تنظیمات',
        'آیا مطمئن هستید؟'
    );

    if (!confirmed) return;

    try {
        // ✅ appSettings.reset('theme') → api.resetSettingsCategory('theme')
        await window.appSettings.reset('theme');
        loadThemeSettings();
        window.themeManager?.setMode('dark');
        window.themeManager?.setAccent('cyan');

        if (typeof showToast === 'function') {
            showToast('✅ بازنشانی شد', 'success');
        }
    } catch (err) {
        console.error('❌ Reset theme error:', err);
    }
}

// ============================================================
// Helpers
// ============================================================

async function confirmDialog(title, text) {
    if (typeof window.confirm === 'function') {
        try {
            return await window.confirm(title, text, 'بله', 'انصراف');
        } catch (e) {
            return window.confirm(`${title}\n${text}`);
        }
    }
    return window.confirm(`${title}\n${text}`);
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_settings_theme = function() {
    console.log('🎨 Settings theme tab initializing...');
    loadThemeSettings();
    setupThemeEvents();
};

window.cleanup_settings_theme = function() {
    console.log('🧹 Settings theme tab cleaning up...');

    // حذف event listenerها با شبیه‌سازی
    const swatches = document.querySelectorAll('#theme_accent_swatches .color-swatch');
    if (_themeSwatchHandler) {
        swatches.forEach(s => s.removeEventListener('click', _themeSwatchHandler));
        _themeSwatchHandler = null;
    }
};
</script>

<style>
.theme-preview {
    padding: var(--space-5);
    background: var(--bg-input);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
}

.theme-preview-title {
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    color: var(--accent-cyan, #00d4ff);
    margin-bottom: var(--space-3);
    display: flex;
    align-items: center;
    gap: var(--space-2);
}

.theme-preview-text {
    font-size: var(--fs-base);
    color: var(--text-secondary);
    margin-bottom: var(--space-4);
    line-height: var(--lh-relaxed);
}

.theme-preview-actions {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
}
</style>
