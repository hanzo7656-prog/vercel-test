<!-- ============================================================
     settings_tabs/system.html — تب سیستم
     نسخه ۲.۰ — رفع api.getStatus() ناموجود
     ============================================================ -->

<div class="settings-tab-content">

    <!-- ===== گروه ۱: اطلاعات نسخه ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-info-circle"></i>
            <span>اطلاعات سیستم</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-tag"></i>
                نسخه برنامه
            </span>
            <span class="info-value cyan" id="sys_version">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-cube"></i>
                نام برنامه
            </span>
            <span class="info-value" id="sys_name">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-server"></i>
                محیط
            </span>
            <span class="info-value" id="sys_env">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-clock"></i>
                Uptime
            </span>
            <span class="info-value green" id="sys_uptime">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-heartbeat"></i>
                وضعیت سلامت
            </span>
            <span class="info-value" id="sys_health">—</span>
        </div>
    </div>

    <!-- ===== گروه ۲: وضعیت دیتابیس‌ها ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-database"></i>
            <span>وضعیت دیتابیس‌ها</span>
        </div>

        <div id="sys_database_list">
            <div class="loading-container">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <div class="settings-actions">
            <button class="btn btn-outline btn-sm" onclick="refreshSystemInfo()">
                <i class="fas fa-sync-alt"></i>
                <span>بروزرسانی</span>
            </button>
        </div>
    </div>

    <!-- ===== گروه ۳: API ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-cloud"></i>
            <span>وضعیت API</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-wifi"></i>
                وضعیت API
            </span>
            <span class="info-value" id="sys_api_status">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-coins"></i>
                اعتبار باقیمانده
            </span>
            <span class="info-value cyan" id="sys_api_credits">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-chart-bar"></i>
                درخواست‌های امروز
            </span>
            <span class="info-value purple" id="sys_api_requests">—</span>
        </div>
    </div>

    <!-- ===== گروه ۴: عملیات ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-tools"></i>
            <span>عملیات سیستم</span>
        </div>

        <div class="settings-actions" style="margin-top: 0; padding-top: 0; border-top: none;">
            <button class="btn btn-outline btn-sm" onclick="exportSettings()">
                <i class="fas fa-download"></i>
                <span>خروجی تنظیمات</span>
            </button>
            <button class="btn btn-outline btn-sm" onclick="openDebugPage()">
                <i class="fas fa-bug"></i>
                <span>صفحه دیباگ</span>
            </button>
            <button class="btn btn-outline btn-sm" onclick="openDatabasePage()">
                <i class="fas fa-database"></i>
                <span>مدیریت دیتابیس</span>
            </button>
        </div>
    </div>

</div>

<script>
// ============================================================
// SETTINGS SYSTEM TAB
// ============================================================

let _systemInfoInterval = null;

// ============================================================
// Load System Info
// ============================================================

async function loadSystemInfo() {
    try {
        // ===== نسخه از API root =====
        try {
            const res = await fetch('/api');
            if (res.ok) {
                const data = await res.json();
                setText('sys_version', data.version || '—');
                setText('sys_name', data.name || 'Trading Signal System');
            }
        } catch (e) {
            console.debug('API root not available:', e);
        }

        // Environment
        setText('sys_env', 'Production');

        // ===== Health =====
        try {
            // ✅ FIX: api.getHealth() (موجود در api.js)
            const health = await window.api?.getHealth?.();

            const healthEl = document.getElementById('sys_health');
            if (healthEl && health) {
                const status = health.status || health.data?.status || 'unknown';
                if (status === 'ok' || status === 'healthy') {
                    healthEl.innerHTML = '<span class="status-dot online"></span> پایدار';
                    healthEl.className = 'info-value green';
                } else if (status === 'degraded') {
                    healthEl.textContent = '⚠️ ضعیف';
                    healthEl.className = 'info-value orange';
                } else {
                    healthEl.textContent = '❌ خطا';
                    healthEl.className = 'info-value red';
                }
            }
        } catch (e) {
            console.debug('Health check error:', e);
        }

        // ===== Uptime =====
        try {
            const stats = await window.api?.getAppStats?.();
            if (stats?.success && stats.data?.uptime) {
                setText('sys_uptime', stats.data.uptime.app_formatted || '—');
            }
        } catch (e) {
            console.debug('Stats error:', e);
        }

        // ===== Databases =====
        await loadDatabasesStatus();

        // ===== API Status =====
        await loadApiStatus();

        console.log('✅ System info loaded');
    } catch (err) {
        console.error('❌ Load system info error:', err);
    }
}

// ============================================================
// Databases Status
// ============================================================

async function loadDatabasesStatus() {
    try {
        // ✅ FIX: api.getHealthSummary() (موجود در api.js)
        const health = await window.api?.getHealthSummary?.();
        const container = document.getElementById('sys_database_list');
        if (!container) return;

        if (!health?.success || !health.data) {
            container.innerHTML = `
                <div class="settings-info-item">
                    <span class="info-label">خطا در دریافت داده</span>
                    <span class="info-value red">—</span>
                </div>
            `;
            return;
        }

        const data = health.data;
        const details = data.details || {};

        const dbNames = ['primary', 'backup', 'analytics', 'logs', 'archive', 'cache'];
        const dbLabels = {
            primary: 'دیتابیس اصلی',
            backup: 'پشتیبان',
            analytics: 'تحلیل و آمار',
            logs: 'لاگ‌ها',
            archive: 'آرشیو',
            cache: 'کش (Redis)',
        };
        const dbIcons = {
            primary: 'fa-database',
            backup: 'fa-archive',
            analytics: 'fa-chart-bar',
            logs: 'fa-file-alt',
            archive: 'fa-box-archive',
            cache: 'fa-bolt',
        };

        container.innerHTML = dbNames.map(dbName => {
            const info = details[dbName] || {};
            const isConnected = info.connected === true || info.status === 'online';

            return `
                <div class="settings-info-item">
                    <span class="info-label">
                        <i class="fas ${dbIcons[dbName] || 'fa-database'}"></i>
                        ${dbLabels[dbName] || dbName}
                    </span>
                    <span class="info-value ${isConnected ? 'green' : 'red'}">
                        ${isConnected ? '<span class="status-dot online"></span> متصل' : '❌ قطع'}
                    </span>
                </div>
            `;
        }).join('');
    } catch (err) {
        console.error('❌ Load databases status error:', err);
    }
}

// ============================================================
// API Status
// ============================================================

async function loadApiStatus() {
    try {
        // ===== API Status =====
        // ✅ FIX: به جای api.getStatus() → api.getCryptoStats()
        // (چون getStatus وجود نداره، از getCryptoStats استفاده می‌کنیم که وضعیت API رو داره)
        try {
            const stats = await window.api?.getCryptoStats?.();
            const statusEl = document.getElementById('sys_api_status');

            if (statusEl && stats?.success && stats.data) {
                const ws = stats.data.websocket || {};
                const pm = stats.data.price_manager || {};

                if (ws.connected === true) {
                    statusEl.innerHTML = '<span class="status-dot online"></span> فعال';
                    statusEl.className = 'info-value green';
                } else if (pm.is_running) {
                    statusEl.innerHTML = '<span class="status-dot warning"></span> Fallback';
                    statusEl.className = 'info-value orange';
                } else {
                    statusEl.innerHTML = '<span class="status-dot offline"></span> غیرفعال';
                    statusEl.className = 'info-value red';
                }
            }
        } catch (e) {
            console.debug('API status error:', e);
        }

        // ===== Credits =====
        try {
            // ✅ api.getCredits() (موجود در api.js)
            const credits = await window.api?.getCredits?.();
            const creditsEl = document.getElementById('sys_api_credits');

            if (creditsEl && credits?.data) {
                const remaining = credits.data.remainingCredits || 0;
                creditsEl.textContent = remaining.toLocaleString('en-US');

                if (remaining < 100) {
                    creditsEl.className = 'info-value red';
                } else if (remaining < 500) {
                    creditsEl.className = 'info-value orange';
                } else {
                    creditsEl.className = 'info-value cyan';
                }
            }
        } catch (e) {
            console.debug('Credits error:', e);
        }

        // ===== Requests Count =====
        try {
            // ✅ appMetrics.get() (موجود در app.js)
            const metrics = window.appMetrics?.get?.() || {};
            const requestsEl = document.getElementById('sys_api_requests');
            if (requestsEl) {
                requestsEl.textContent = (metrics.totalRequests || 0).toLocaleString('en-US');
            }
        } catch (e) {
            console.debug('Metrics error:', e);
        }
    } catch (err) {
        console.error('❌ Load API status error:', err);
    }
}

// ============================================================
// Refresh
// ============================================================

function refreshSystemInfo() {
    if (typeof showToast === 'function') {
        showToast('🔄 در حال بروزرسانی...', 'info', 1500);
    }
    loadSystemInfo();
}

// ============================================================
// Actions
// ============================================================

function exportSettings() {
    try {
        const settings = {
            scheduler: window.appSettings?.get('scheduler'),
            theme: window.appSettings?.get('theme'),
            cache: window.appSettings?.get('cache'),
            notifications: window.appSettings?.get('notifications'),
            dashboard: window.appSettings?.get('dashboard'),
            exported_at: new Date().toISOString(),
        };

        const filename = `settings_${new Date().toISOString().slice(0, 10)}.json`;

        // ✅ downloadJSON() از utils.js
        if (typeof downloadJSON === 'function') {
            downloadJSON(settings, filename);
        } else {
            const blob = new Blob([JSON.stringify(settings, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        if (typeof showToast === 'function') showToast('📥 دانلود شروع شد', 'success');
    } catch (err) {
        console.error('❌ Export settings error:', err);
        if (typeof showToast === 'function') showToast('❌ خطا در خروجی', 'error');
    }
}

function openDebugPage() {
    window.open('/debug', '_blank');
}

function openDatabasePage() {
    window.open('/database', '_blank');
}

// ============================================================
// Helpers
// ============================================================

function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value ?? '—';
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_settings_system = function() {
    console.log('⚙️ Settings system tab initializing...');
    loadSystemInfo();

    if (_systemInfoInterval) clearInterval(_systemInfoInterval);
    _systemInfoInterval = setInterval(() => {
        const activeTab = document.querySelector('#settingsTabs .settings-tab-btn.active');
        if (activeTab?.dataset.tab === 'system') {
            loadSystemInfo();
        }
    }, 30000);
};

window.cleanup_settings_system = function() {
    console.log('🧹 Settings system tab cleaning up...');
    if (_systemInfoInterval) {
        clearInterval(_systemInfoInterval);
        _systemInfoInterval = null;
    }
};
</script>
