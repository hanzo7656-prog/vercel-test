<!-- ============================================================
     settings_tabs/account.html — تب حساب کاربری
     نسخه ۲.۰ — با init/cleanup استاندارد
     ============================================================ -->

<div class="settings-tab-content">

    <!-- ===== گروه ۱: اطلاعات کاربر ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-user-circle"></i>
            <span>اطلاعات کاربری</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-user"></i>
                نام کاربری
            </span>
            <span class="info-value cyan" id="acc_username">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-user-tag"></i>
                نقش
            </span>
            <span class="info-value purple" id="acc_role">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-clock"></i>
                آخرین ورود
            </span>
            <span class="info-value" id="acc_last_login">—</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-key"></i>
                Session ID
            </span>
            <span class="info-value" id="acc_session_id">—</span>
        </div>
    </div>

    <!-- ===== گروه ۲: تغییر رمز عبور ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-lock"></i>
            <span>تغییر رمز عبور</span>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-lock"></i>
                <span>رمز فعلی</span>
            </span>
            <div class="password-wrapper">
                <input type="password" id="acc_current_password" class="form-input"
                       placeholder="رمز عبور فعلی" autocomplete="current-password">
                <button type="button" class="password-toggle"
                        onclick="togglePasswordVisibility('acc_current_password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-key"></i>
                <span>رمز جدید</span>
            </span>
            <div class="password-wrapper">
                <input type="password" id="acc_new_password" class="form-input"
                       placeholder="حداقل ۶ کاراکتر" autocomplete="new-password">
                <button type="button" class="password-toggle"
                        onclick="togglePasswordVisibility('acc_new_password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="settings-row">
            <span class="label">
                <i class="fas fa-check-double"></i>
                <span>تکرار رمز جدید</span>
            </span>
            <div class="password-wrapper">
                <input type="password" id="acc_confirm_password" class="form-input"
                       placeholder="تکرار رمز جدید" autocomplete="new-password">
                <button type="button" class="password-toggle"
                        onclick="togglePasswordVisibility('acc_confirm_password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <!-- Password Strength -->
        <div class="settings-row" id="acc_password_strength_row" style="display: none;">
            <span class="label">
                <i class="fas fa-shield-alt"></i>
                <span>قدرت رمز</span>
            </span>
            <div class="password-strength">
                <div class="password-strength-bar">
                    <div class="password-strength-fill" id="acc_password_strength_bar"></div>
                </div>
                <div class="password-strength-text" id="acc_password_strength_text">—</div>
            </div>
        </div>

        <div class="settings-actions">
            <button class="btn btn-primary btn-sm" onclick="changePasswordSubmit()">
                <i class="fas fa-key"></i>
                <span>تغییر رمز عبور</span>
            </button>
        </div>
    </div>

    <!-- ===== گروه ۳: Session ===== -->
    <div class="settings-group">
        <div class="group-title">
            <i class="fas fa-shield-alt"></i>
            <span>امنیت</span>
        </div>

        <div class="settings-info-item">
            <span class="info-label">
                <i class="fas fa-clock"></i>
                زمان انقضای Session
            </span>
            <span class="info-value">۲۴ ساعت</span>
        </div>

        <div class="settings-actions">
            <button class="btn btn-danger btn-sm" onclick="logoutAccount()">
                <i class="fas fa-sign-out-alt"></i>
                <span>خروج از حساب</span>
            </button>
        </div>
    </div>

</div>

<script>
// ============================================================
// SETTINGS ACCOUNT TAB
// ============================================================

let _passwordEventsSet = false;

// ============================================================
// Load Info
// ============================================================

async function loadAccountInfo() {
    try {
        // ✅ api.getUserInfo() که تو api.js هست
        const data = await window.api?.getUserInfo?.();

        if (!data?.success || !data.data) {
            console.warn('User info not available');
            return;
        }

        const user = data.data;

        // Username
        const usernameEl = document.getElementById('acc_username');
        if (usernameEl) usernameEl.textContent = user.username || '—';

        // Role
        const roleEl = document.getElementById('acc_role');
        if (roleEl) {
            const roleLabels = {
                admin: '👑 ادمین',
                user: '👤 کاربر',
                guest: '👥 مهمان',
            };
            roleEl.textContent = roleLabels[user.role] || user.role || '—';
        }

        // Last login
        const lastLoginEl = document.getElementById('acc_last_login');
        if (lastLoginEl) {
            lastLoginEl.textContent = user.login_time
                ? ((typeof formatTimeAgo === 'function') ? formatTimeAgo(user.login_time) : '—')
                : '—';
        }

        // Session ID
        const sessionEl = document.getElementById('acc_session_id');
        if (sessionEl && user.session_id) {
            sessionEl.textContent = user.session_id.slice(0, 12) + '...';
            sessionEl.title = user.session_id;
        }

        console.log('✅ Account info loaded');
    } catch (err) {
        console.error('❌ Load account info error:', err);
    }
}

// ============================================================
// Password Toggle
// ============================================================

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;

    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';

    const icon = btn.querySelector('i');
    if (icon) {
        icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
    }
}

// ============================================================
// Password Strength
// ============================================================

function updatePasswordStrength(password) {
    const rowEl = document.getElementById('acc_password_strength_row');
    const barEl = document.getElementById('acc_password_strength_bar');
    const textEl = document.getElementById('acc_password_strength_text');

    if (!rowEl || !barEl || !textEl) return;

    if (!password) {
        rowEl.style.display = 'none';
        return;
    }

    rowEl.style.display = 'flex';

    let score = 0;
    if (password.length >= 6) score++;
    if (password.length >= 10) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^a-zA-Z0-9]/.test(password)) score++;

    const levels = [
        { percent: 0, color: 'var(--color-red)', label: 'خیلی ضعیف' },
        { percent: 20, color: 'var(--color-red)', label: 'ضعیف' },
        { percent: 40, color: 'var(--color-orange)', label: 'متوسط' },
        { percent: 60, color: 'var(--color-orange)', label: 'خوب' },
        { percent: 80, color: 'var(--color-green)', label: 'قوی' },
        { percent: 100, color: 'var(--color-green)', label: 'خیلی قوی' },
    ];

    const level = levels[Math.min(score, 5)];

    barEl.style.width = level.percent + '%';
    barEl.style.background = level.color;
    textEl.textContent = level.label;
    textEl.style.color = level.color;
}

function setupPasswordEvents() {
    if (_passwordEventsSet) return;
    _passwordEventsSet = true;

    const newPassEl = document.getElementById('acc_new_password');
    if (newPassEl) {
        newPassEl.addEventListener('input', (e) => {
            updatePasswordStrength(e.target.value);
        });
    }
}

// ============================================================
// Change Password
// ============================================================

async function changePasswordSubmit() {
    try {
        const currentPassword = document.getElementById('acc_current_password')?.value || '';
        const newPassword = document.getElementById('acc_new_password')?.value || '';
        const confirmPassword = document.getElementById('acc_confirm_password')?.value || '';

        // Validation
        if (!currentPassword) {
            if (typeof showToast === 'function') showToast('⚠️ رمز فعلی را وارد کنید', 'warning');
            return;
        }

        if (!newPassword) {
            if (typeof showToast === 'function') showToast('⚠️ رمز جدید را وارد کنید', 'warning');
            return;
        }

        if (newPassword.length < 6) {
            if (typeof showToast === 'function') showToast('❌ رمز باید حداقل ۶ کاراکتر باشد', 'error');
            return;
        }

        if (newPassword !== confirmPassword) {
            if (typeof showToast === 'function') showToast('❌ رمز جدید و تکرار آن مطابقت ندارند', 'error');
            return;
        }

        if (currentPassword === newPassword) {
            if (typeof showToast === 'function') showToast('⚠️ رمز جدید باید متفاوت باشد', 'warning');
            return;
        }

        // Loading
        if (window.loadingSystem?.show) {
            window.loadingSystem.show({
                messages: ['در حال تغییر رمز...'],
                subMessages: ['لطفاً صبر کنید'],
                duration: 2000,
            });
        }

        // ✅ api.changePassword() که تو api.js هست
        const result = await window.api?.changePassword?.(currentPassword, newPassword);

        if (window.loadingSystem?.hide) {
            window.loadingSystem.hide();
        }

        if (result?.success) {
            if (typeof showToast === 'function') showToast('✅ رمز عبور تغییر یافت', 'success');

            // Clear form
            document.getElementById('acc_current_password').value = '';
            document.getElementById('acc_new_password').value = '';
            document.getElementById('acc_confirm_password').value = '';

            const rowEl = document.getElementById('acc_password_strength_row');
            if (rowEl) rowEl.style.display = 'none';
        } else {
            if (typeof showToast === 'function') {
                showToast(`❌ ${result?.error || 'خطا در تغییر رمز'}`, 'error');
            }
        }
    } catch (err) {
        if (window.loadingSystem?.hide) window.loadingSystem.hide();
        console.error('❌ Change password error:', err);
        if (typeof showToast === 'function') showToast('❌ ' + err.message, 'error');
    }
}

// ============================================================
// Logout
// ============================================================

async function logoutAccount() {
    const confirmed = await confirmDialog(
        'خروج از حساب',
        'آیا مطمئن هستید که می‌خواهید خارج شوید؟'
    );

    if (!confirmed) return;

    try {
        if (window.loadingSystem?.show) {
            window.loadingSystem.show({
                messages: ['در حال خروج...'],
                duration: 1500,
            });
        }

        // ✅ api.logout() که تو api.js هست
        await window.api?.logout?.();

        setTimeout(() => {
            window.location.href = '/';
        }, 1500);
    } catch (err) {
        console.error('❌ Logout error:', err);
        if (window.loadingSystem?.hide) window.loadingSystem.hide();
        if (typeof showToast === 'function') showToast('❌ خطا در خروج', 'error');
    }
}

// ============================================================
// Helpers
// ============================================================

async function confirmDialog(title, text) {
    if (typeof window.confirm === 'function') {
        try {
            return await window.confirm(title, text, 'بله', 'انصراف');
        } catch (e) {
            return window.confirm(`${title}\n${text}`);
        }
    }
    return window.confirm(`${title}\n${text}`);
}

// ============================================================
// INIT / CLEANUP
// ============================================================

window.init_settings_account = function() {
    console.log('👤 Settings account tab initializing...');
    loadAccountInfo();
    setupPasswordEvents();
};

window.cleanup_settings_account = function() {
    console.log('🧹 Settings account tab cleaning up...');
    _passwordEventsSet = false;
};
</script>

<style>

    position: relative;
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 320px;
}

    padding-left: 40px;
    flex: 1;
}

    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
    font-size: 0.85rem;
}

.password-toggle:hover {
    color: var(--color-cyan);
    background: rgba(0, 212, 255, 0.1);
}

    max-width: 320px;
}

.password-strength-bar {

}

}

</style>
