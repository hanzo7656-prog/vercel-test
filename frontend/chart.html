<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e1a">
    <title>نمودار | سیستم تحلیلگر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/themes.css">

    <!-- Shared -->
    <link rel="stylesheet" href="/css/nav.css">

    <!-- Page-specific -->
    <link rel="stylesheet" href="/css/pages/chart.css">
</head>
<body class="chart-body">

    <!-- ============================================================
         NAVIGATION (auto-loaded by NavManager)
         ============================================================ -->
    <div id="navContainer"></div>

    <!-- ============================================================
         CHART CONTAINER
         ============================================================ -->
    <div class="chart-container">
        <div class="chart-wrapper">

            <!-- Loading overlay -->
            <div class="chart-loading" id="chartLoading">
                <div class="loading-spinner"></div>
                <div class="loading-text">در حال بارگذاری نمودار...</div>
            </div>

            <!-- Info banner -->
            <div class="chart-info-banner">
                <span class="live-dot"></span>
                <span>زنده از</span>
                <strong>TradingView</strong>
            </div>

            <!-- TradingView Widget -->
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <div class="tradingview-widget-copyright">
                    <a href="https://www.tradingview.com/symbols/BTCUSDT/?exchange=BINANCE" rel="noopener nofollow" target="_blank">
                        <span class="blue-text">BTCUSDT price</span>
                    </a>
                    <span class="trademark"> by TradingView</span>
                </div>

                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                    "allow_symbol_change": true,
                    "calendar": false,
                    "details": false,
                    "hide_side_toolbar": false,
                    "hide_top_toolbar": false,
                    "hide_legend": false,
                    "hide_volume": false,
                    "hotlist": false,
                    "interval": "D",
                    "locale": "en",
                    "save_image": true,
                    "style": "1",
                    "symbol": "BINANCE:BTCUSDT",
                    "theme": "dark",
                    "timezone": "Asia/Tehran",
                    "backgroundColor": "#0F0F0F",
                    "gridColor": "rgba(242, 242, 242, 0.2)",
                    "watchlist": [
                        "BINANCE:BTCUSDT",
                        "BINANCE:ETHUSDT",
                        "BINANCE:SOLUSDT",
                        "BINANCE:BNBUSDT",
                        "BINANCE:XRPUSDT",
                        "BINANCE:ADAUSDT"
                    ],
                    "withdateranges": true,
                    "compareSymbols": [],
                    "support_host": "https://www.tradingview.com",
                    "studies": [
                        "STD;Divergence%1Indicator"
                    ],
                    "autosize": true
                }
                </script>
            </div>
        </div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaliday@1/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mitt@3/dist/mitt.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/radash@12/dist/radash.umd.js"></script>

    <!-- App Base -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>

    <!-- Core (NavManager خودکار nav + loading-overlay لود می‌کنه) -->
    <script src="/js/core/theme.js"></script>
    <script src="/js/core/tabs.js"></script>
    <script src="/js/core/nav.js"></script>
    <script src="/js/core/index.js"></script>

    <!-- Page Script -->
    <script>
    // ============================================================
    // CHART PAGE (TradingView) v2.0
    // ============================================================

    (function() {
        'use strict';

        // ========================================================
        // Hide Loading
        // ========================================================

        function hideLoading() {
            const loading = document.getElementById('chartLoading');
            if (loading) {
                loading.classList.add('hidden');
                setTimeout(() => {
                    if (loading.parentNode) loading.remove();
                }, 600);
            }
        }

        // ========================================================
        // Sync Theme with TradingView
        // ========================================================

        function syncChartTheme() {
            // TradingView theme از ابتدا "dark" ست شده
            // اگه تم سایت light باشه، می‌تونیم بعداً اضافه کنیم
            const isLight = window.themeManager?.isLight?.();

            if (isLight) {
                // TODO: در آینده، رفرش widget با theme "light"
                // فعلاً فقط لاگ می‌کنیم
                console.log('ℹ️ Light theme detected — TradingView stays dark');
            }
        }

        // ========================================================
        // Watch theme changes
        // ========================================================

        function watchThemeChanges() {
            if (window.themeManager?.on) {
                window.themeManager.on((state) => {
                    console.log('🎨 Theme changed:', state.effective);
                    // TradingView widget خودش theme رو نمی‌تونه live تغییر بده
                    // برای تغییر، نیاز به reload widget هست
                });
            }
        }

        // ========================================================
        // Detect widget load (via MutationObserver)
        // ========================================================

        function detectWidgetLoad() {
            const wrapper = document.querySelector('.tradingview-widget-container__widget');
            if (!wrapper) return;

            const observer = new MutationObserver(() => {
                // اگه داخل widget iframe اضافه شده، یعنی لود شد
                const iframe = wrapper.querySelector('iframe');
                if (iframe) {
                    console.log('✅ TradingView widget loaded');
                    hideLoading();
                    observer.disconnect();
                }
            });

            observer.observe(wrapper, {
                childList: true,
                subtree: true,
            });

            // Fallback: بعد از ۵ ثانیه force hide
            setTimeout(() => {
                const iframe = wrapper.querySelector('iframe');
                if (iframe) {
                    hideLoading();
                    observer.disconnect();
                }
            }, 5000);
        }

        // ========================================================
        // Responsive resize handler
        // ========================================================

        let resizeTimeout;
        function handleResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                // TradingView widget خودش autosize هست
                // فقط لاگ می‌کنیم
                console.log('📱 Screen resized:', window.innerWidth + 'x' + window.innerHeight);
            }, 250);
        }

        // ========================================================
        // Prevent scroll issues
        // ========================================================

        function lockScroll() {
            document.body.style.overflow = 'hidden';
        }

        // ========================================================
        // Init
        // ========================================================

        function init() {
            console.log('🚀 Chart page initializing...');

            lockScroll();
            syncChartTheme();
            watchThemeChanges();
            detectWidgetLoad();

            window.addEventListener('resize', handleResize);

            console.log('✅ Chart page ready');
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            clearTimeout(resizeTimeout);
        });

        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>

</body>
</html>
