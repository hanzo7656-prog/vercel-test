<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e1a">
    <title>نمودار | سیستم تحلیلگر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/themes.css">

    <!-- Shared -->
    <link rel="stylesheet" href="/css/nav.css">

    <!-- Page-specific -->
    <link rel="stylesheet" href="/css/pages/chart.css">
</head>
<body class="chart-body">

    <!-- ============================================================
         NAVIGATION (auto-loaded by NavManager)
         ============================================================ -->
    <div id="navContainer"></div>

    <!-- ============================================================
         CHART CONTAINER
         ============================================================ -->
    <div class="chart-container">
        <div class="chart-wrapper" id="chartWrapper">

            <!-- Info banner -->
            <div class="chart-info-banner">
                <span class="live-dot"></span>
                <span>زنده از</span>
                <strong>TradingView</strong>
            </div>

            <!--
                ============================================
                Loading از loadingSystem میاد (inline mode)
                ============================================
            -->

            <!-- TradingView Widget -->
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <div class="tradingview-widget-copyright">
                    <a href="https://www.tradingview.com/symbols/BTCUSDT/?exchange=BINANCE" rel="noopener nofollow" target="_blank">
                        <span class="blue-text">BTCUSDT price</span>
                    </a>
                    <span class="trademark"> by TradingView</span>
                </div>

                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                    "allow_symbol_change": true,
                    "calendar": false,
                    "details": false,
                    "hide_side_toolbar": false,
                    "hide_top_toolbar": false,
                    "hide_legend": false,
                    "hide_volume": false,
                    "hotlist": false,
                    "interval": "D",
                    "locale": "en",
                    "save_image": true,
                    "style": "1",
                    "symbol": "BINANCE:BTCUSDT",
                    "theme": "dark",
                    "timezone": "Asia/Tehran",
                    "backgroundColor": "#0F0F0F",
                    "gridColor": "rgba(242, 242, 242, 0.2)",
                    "watchlist": [
                        "BINANCE:BTCUSDT",
                        "BINANCE:ETHUSDT",
                        "BINANCE:SOLUSDT",
                        "BINANCE:BNBUSDT",
                        "BINANCE:XRPUSDT",
                        "BINANCE:ADAUSDT"
                    ],
                    "withdateranges": true,
                    "compareSymbols": [],
                    "support_host": "https://www.tradingview.com",
                    "studies": [
                        "STD;Divergence%1Indicator"
                    ],
                    "autosize": true
                }
                </script>
            </div>
        </div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaliday@1/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mitt@3/dist/mitt.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/radash@12/dist/radash.umd.js"></script>

    <!-- App Base -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>

    <!-- Core (NavManager خودکار nav + loading-overlay لود می‌کنه) -->
    <script src="/js/core/theme.js"></script>
    <script src="/js/core/tabs.js"></script>
    <script src="/js/core/nav.js"></script>
    <script src="/js/core/index.js"></script>

    <!-- Page Script -->
    <script>
    // ============================================================
    // CHART PAGE (TradingView) v3.0
    // با inline loading از loadingSystem
    // ============================================================

    (function() {
        'use strict';

        // ========================================================
        // State
        // ========================================================

        let _chartWidgetLoaded = false;
        let _chartTimeoutId = null;
        let _chartResizeTimer = null;

        // ========================================================
        // Show/Hide Chart Loading (INLINE)
        // ========================================================

        function showChartLoading() {
            const wrapper = document.getElementById('chartWrapper');
            if (!wrapper) return;

            // استفاده از loadingSystem inline mode
            if (window.loadingSystem?.showInline) {
                window.loadingSystem.showInline(wrapper, {
                    color: '#00d4ff',
                });
                console.log('🔄 Chart inline loading shown');
            } else {
                console.warn('⚠️ loadingSystem not available');
            }
        }

        function hideChartLoading() {
            if (window.loadingSystem?.hideInline) {
                window.loadingSystem.hideInline();
                console.log('✅ Chart inline loading hidden');
            }
        }

        // ========================================================
        // Detect Widget Load
        // ========================================================

        function detectWidgetLoad() {
            const wrapper = document.querySelector('.tradingview-widget-container__widget');
            if (!wrapper) return;

            // اگه iframe از قبل هست
            if (wrapper.querySelector('iframe')) {
                console.log('✅ TradingView iframe already exists');
                _chartWidgetLoaded = true;
                hideChartLoading();
                return;
            }

            // MutationObserver برای تشخیص اضافه شدن iframe
            const observer = new MutationObserver(() => {
                const iframe = wrapper.querySelector('iframe');
                if (iframe && !_chartWidgetLoaded) {
                    _chartWidgetLoaded = true;
                    console.log('✅ TradingView widget loaded');
                    hideChartLoading();
                    observer.disconnect();
                    clearTimeout(_chartTimeoutId);
                }
            });

            observer.observe(wrapper, {
                childList: true,
                subtree: true,
            });

            // Timeout: اگه بعد از ۱۲ ثانیه لود نشد
            _chartTimeoutId = setTimeout(() => {
                if (!_chartWidgetLoaded) {
                    console.warn('⚠️ TradingView timeout — showing error');
                    observer.disconnect();
                    hideChartLoading();
                    showChartError();
                }
            }, 12000);
        }

        // ========================================================
        // Error State
        // ========================================================

        function showChartError() {
            const wrapper = document.getElementById('chartWrapper');
            if (!wrapper) return;

            // حذف قبلی اگه هست
            const existing = wrapper.querySelector('.chart-error');
            if (existing) existing.remove();

            const errorEl = document.createElement('div');
            errorEl.className = 'chart-error';
            errorEl.innerHTML = `
                <div class="error-icon">📡</div>
                <div class="error-title">TradingView لود نشد</div>
                <div class="error-message">
                    احتمالاً به‌خاطر محدودیت شبکه یا VPN.
                    اتصال اینترنت خود را بررسی کنید.
                </div>
                <button class="error-btn" onclick="location.reload()">
                    <i class="fas fa-sync-alt"></i>
                    <span>تلاش مجدد</span>
                </button>
            `;

            wrapper.appendChild(errorEl);
        }

        function hideChartError() {
            const wrapper = document.getElementById('chartWrapper');
            if (!wrapper) return;

            const errorEl = wrapper.querySelector('.chart-error');
            if (errorEl) errorEl.remove();
        }

        // ========================================================
        // Handle Resize
        // ========================================================

        function handleResize() {
            clearTimeout(_chartResizeTimer);
            _chartResizeTimer = setTimeout(() => {
                // TradingView autosize هست، فقط لاگ
                console.log('📱 Resize:', window.innerWidth + 'x' + window.innerHeight);
            }, 250);
        }

        // ========================================================
        // Init
        // ========================================================

        async function init() {
            console.log('🚀 Chart page initializing...');

            // ۱. مطمئن شو nav + loadingSystem آماده‌ست
            // NavManager خودش loading-overlay رو لود می‌کنه
            // ولی هنوز ممکنه آماده نشده باشه — صبر کوتاه
            await waitForLoadingSystem();

            // ۲. نمایش loading (inline)
            showChartLoading();

            // ۳. تشخیص لود TradingView
            detectWidgetLoad();

            // ۴. resize handler
            window.addEventListener('resize', handleResize);

            console.log('✅ Chart page ready');
        }

        // ========================================================
        // Wait for loadingSystem (اگه NavManager هنوز لودش نکرده)
        // ========================================================

        function waitForLoadingSystem(timeout = 3000) {
            return new Promise((resolve) => {
                if (window.loadingSystem?.showInline) {
                    resolve();
                    return;
                }

                const startTime = Date.now();
                const checkInterval = setInterval(() => {
                    if (window.loadingSystem?.showInline) {
                        clearInterval(checkInterval);
                        resolve();
                    } else if (Date.now() - startTime > timeout) {
                        clearInterval(checkInterval);
                        console.warn('⚠️ loadingSystem timeout');
                        resolve();
                    }
                }, 50);
            });
        }

        // ========================================================
        // Cleanup
        // ========================================================

        window.addEventListener('beforeunload', () => {
            clearTimeout(_chartTimeoutId);
            clearTimeout(_chartResizeTimer);
            hideChartLoading();
        });

        // ========================================================
        // Start
        // ========================================================

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>

</body>
</html>
