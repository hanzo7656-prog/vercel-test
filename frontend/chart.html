<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>نمودار</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* ============================================================
           CHART PAGE - کاملاً ریسپانسیو
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
        }

        #navContainer {
            flex-shrink: 0;
        }

        .chart-container {
            width: 100%;
            height: calc(100vh - 60px);  /* منو 60px */
            padding: 8px;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chart-wrapper {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: var(--bg-primary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
        }

        .chart-wrapper .tradingview-widget-container {
            width: 100% !important;
            height: 100% !important;
        }

        .chart-wrapper .tradingview-widget-container__widget {
            width: 100% !important;
            height: calc(100% - 32px) !important;
        }

        .chart-wrapper .tradingview-widget-copyright {
            display: none !important;
        }

        /* ===== گوشی (موبایل) ===== */
        @media (max-width: 768px) {
            .chart-container {
                height: calc(100vh - 54px);  /* منو در موبایل 54px */
                padding: 4px;
            }
        }

        /* ===== گوشی خیلی کوچک ===== */
        @media (max-width: 480px) {
            .chart-container {
                height: calc(100vh - 48px);  /* منو در موبایل کوچک 48px */
                padding: 2px;
            }
        }

        /* ===== لپ‌تاپ و دسکتاپ ===== */
        @media (min-width: 769px) {
            .chart-container {
                padding: 12px 20px;
            }
        }

        /* ===== حالت افقی گوشی (Landscape) ===== */
        @media (max-width: 900px) and (orientation: landscape) {
            .chart-container {
                height: calc(100vh - 48px);
                padding: 4px 8px;
            }
            .chart-wrapper {
                border-radius: var(--radius-sm);
            }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="chart-container">
        <div class="chart-wrapper">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <div class="tradingview-widget-copyright">
                    <a href="https://www.tradingview.com/symbols/BTCUSDT/?exchange=BINANCE" rel="noopener nofollow" target="_blank">
                        <span class="blue-text">BTCUSDT price</span>
                    </a>
                    <span class="trademark"> by TradingView</span>
                </div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                    {
                        "allow_symbol_change": true,
                        "calendar": false,
                        "details": false,
                        "hide_side_toolbar": false,
                        "hide_top_toolbar": false,
                        "hide_legend": false,
                        "hide_volume": false,
                        "hotlist": false,
                        "interval": "D",
                        "locale": "en",
                        "save_image": true,
                        "style": "1",
                        "symbol": "BINANCE:BTCUSDT",
                        "theme": "dark",
                        "timezone": "Asia/Tehran",
                        "backgroundColor": "#0F0F0F",
                        "gridColor": "rgba(242, 242, 242, 0.2)",
                        "watchlist": [],
                        "withdateranges": true,
                        "compareSymbols": [],
                        "support_host": "https://www.tradingview.com",
                        "studies": ["STD;Divergence%1Indicator"],
                        "autosize": true
                    }
                </script>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // ============================================================
        // بارگذاری نویگیشن
        // ============================================================
        async function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            try {
                const res = await fetch('/nav.html');
                if (!res.ok) throw new Error('nav.html not found');
                const html = await res.text();
                container.innerHTML = html;
                const scripts = container.querySelectorAll('script');
                scripts.forEach(old => {
                    const ns = document.createElement('script');
                    ns.textContent = old.textContent;
                    old.parentNode.replaceChild(ns, old);
                });
            } catch (err) {
                console.error('❌ Nav error:', err);
                container.innerHTML = `
                    <div style="background:var(--bg-secondary);padding:8px;text-align:center;border-bottom:1px solid var(--border-color);font-size:0.8rem;color:var(--accent-red);">
                        ⚠️ خطا در بارگذاری منو
                        <button onclick="location.reload()" style="background:var(--accent-cyan);color:#000;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;margin:4px;">🔄</button>
                    </div>
                `;
            }
        }

        // ============================================================
        // مقداردهی اولیه
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNav();
            console.log('🚀 Chart page ready');
        });

        // ============================================================
        // رفرش در صورت تغییر اندازه صفحه
        // ============================================================
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                // TradingView Widget خودش ریسپانسیو هست، فقط کافیست رفرش کنیم
                console.log('📱 Screen resized');
            }, 200);
        });
    </script>
</body>
</html>
