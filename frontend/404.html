<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e1a">
    <title>یافت نشد | سیستم تحلیلگر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/themes.css">

    <!-- Page-specific -->
    <link rel="stylesheet" href="/css/pages/errors.css">
</head>
<body>

    <div class="error-page error-404">

        <div class="error-container">

            <!-- ====================================================
                 SVG Animation — Astronaut Lost in Space
                 ==================================================== -->
            <div class="error-svg-wrapper">
                <svg class="error-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Defs -->
                    <defs>
                        <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
                            <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
                        </radialGradient>
                        <linearGradient id="helmetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#e2e8f0"/>
                            <stop offset="100%" stop-color="#94a3b8"/>
                        </linearGradient>
                        <linearGradient id="visorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#0ea5e9"/>
                            <stop offset="100%" stop-color="#0369a1"/>
                        </linearGradient>
                        <linearGradient id="suitGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#f1f5f9"/>
                            <stop offset="100%" stop-color="#cbd5e1"/>
                        </linearGradient>
                        <linearGradient id="planetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#22d3ee"/>
                            <stop offset="50%" stop-color="#0891b2"/>
                            <stop offset="100%" stop-color="#0e7490"/>
                        </linearGradient>
                        <radialGradient id="planetRing" cx="50%" cy="50%" r="50%">
                            <stop offset="70%" stop-color="#22d3ee" stop-opacity="0"/>
                            <stop offset="85%" stop-color="#67e8f9" stop-opacity="0.6"/>
                            <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
                        </radialGradient>
                    </defs>

                    <!-- ============================================
                         Twinkling Stars (background)
                         ============================================ -->
                    <g>
                        <circle cx="25" cy="30" r="1.2" fill="#fff" style="animation: starTwinkle 2s ease-in-out infinite;"/>
                        <circle cx="170" cy="45" r="1.5" fill="#fff" style="animation: starTwinkle 2.5s ease-in-out infinite 0.3s;"/>
                        <circle cx="50" cy="160" r="1" fill="#67e8f9" style="animation: starTwinkle 1.8s ease-in-out infinite 0.6s;"/>
                        <circle cx="150" cy="170" r="1.3" fill="#fff" style="animation: starTwinkle 2.2s ease-in-out infinite 0.9s;"/>
                        <circle cx="180" cy="90" r="1" fill="#a5f3fc" style="animation: starTwinkle 3s ease-in-out infinite 1.2s;"/>
                        <circle cx="15" cy="100" r="1.4" fill="#fff" style="animation: starTwinkle 2.4s ease-in-out infinite 1.5s;"/>
                        <circle cx="90" cy="20" r="1" fill="#67e8f9" style="animation: starTwinkle 2.8s ease-in-out infinite 0.4s;"/>
                        <circle cx="185" cy="130" r="1.2" fill="#fff" style="animation: starTwinkle 2.1s ease-in-out infinite 0.7s;"/>
                    </g>

                    <!-- ============================================
                         Planet with rotating ring
                         ============================================ -->
                    <g>
                        <!-- Planet body -->
                        <circle cx="155" cy="145" r="18" fill="url(#planetGradient)"/>
                        <!-- Planet highlight -->
                        <ellipse cx="150" cy="140" rx="6" ry="4" fill="rgba(255,255,255,0.3)"/>
                        <!-- Planet craters -->
                        <circle cx="160" cy="148" r="2" fill="rgba(0,0,0,0.2)"/>
                        <circle cx="150" cy="152" r="1.5" fill="rgba(0,0,0,0.15)"/>
                        <circle cx="162" cy="140" r="1" fill="rgba(0,0,0,0.2)"/>
                    </g>

                    <!-- Planet ring (rotating) -->
                    <g style="transform-origin: 155px 145px; animation: chainSpin 8s linear infinite;">
                        <ellipse
                            cx="155" cy="145" rx="26" ry="8"
                            fill="none"
                            stroke="url(#planetRing)"
                            stroke-width="2"
                            transform="rotate(-20 155 145)"/>
                    </g>

                    <!-- ============================================
                         Astronaut (floating)
                         ============================================ -->
                    <g style="transform-origin: 100px 100px; animation: astronautFloat 4s ease-in-out infinite;">

                        <!-- Tether/cable (floating) -->
                        <path
                            d="M 100 130 Q 90 160 70 175 Q 55 185 45 180"
                            fill="none"
                            stroke="#fbbf24"
                            stroke-width="2"
                            stroke-dasharray="4 4"
                            stroke-linecap="round"
                            opacity="0.6"
                            style="animation: pulse 2s ease-in-out infinite;"/>

                        <!-- Body / Suit -->
                        <rect
                            x="78" y="95" width="44" height="50" rx="12"
                            fill="url(#suitGradient)"
                            stroke="#94a3b8"
                            stroke-width="1.5"/>

                        <!-- Suit detail lines -->
                        <line x1="85" y1="115" x2="115" y2="115" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
                        <line x1="85" y1="125" x2="115" y2="125" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

                        <!-- Chest control panel -->
                        <rect x="92" y="118" width="16" height="10" rx="2" fill="#0f172a"/>
                        <circle cx="96" cy="123" r="1.2" fill="#22d3ee" style="animation: serverBlink 1s ease-in-out infinite;"/>
                        <circle cx="100" cy="123" r="1.2" fill="#f59e0b" style="animation: serverBlink 1.3s ease-in-out infinite 0.3s;"/>
                        <circle cx="104" cy="123" r="1.2" fill="#ef4444" style="animation: serverBlink 1.6s ease-in-out infinite 0.6s;"/>

                        <!-- Left arm (waving) -->
                        <g style="transform-origin: 82px 105px; animation: lockShake 3s ease-in-out infinite;">
                            <path
                                d="M 82 105 Q 65 100 55 85 Q 50 75 55 70"
                                fill="none"
                                stroke="url(#suitGradient)"
                                stroke-width="9"
                                stroke-linecap="round"/>
                            <!-- Glove -->
                            <circle cx="55" cy="68" r="6" fill="url(#helmetGradient)"/>
                        </g>

                        <!-- Right arm (static) -->
                        <path
                            d="M 118 105 Q 130 110 135 125"
                            fill="none"
                            stroke="url(#suitGradient)"
                            stroke-width="9"
                            stroke-linecap="round"/>
                        <circle cx="137" cy="128" r="6" fill="url(#helmetGradient)"/>

                        <!-- Legs (floating) -->
                        <g style="animation: float 3s ease-in-out infinite 0.5s;">
                            <rect x="82" y="140" width="14" height="30" rx="7" fill="url(#suitGradient)" stroke="#94a3b8" stroke-width="1"/>
                            <rect x="104" y="140" width="14" height="30" rx="7" fill="url(#suitGradient)" stroke="#94a3b8" stroke-width="1"/>
                            <!-- Boots -->
                            <ellipse cx="89" cy="172" rx="9" ry="4" fill="#94a3b8"/>
                            <ellipse cx="111" cy="172" rx="9" ry="4" fill="#94a3b8"/>
                        </g>

                        <!-- ============================================
                             Helmet
                             ============================================ -->
                        <circle
                            cx="100" cy="80" r="22"
                            fill="url(#helmetGradient)"
                            stroke="#64748b"
                            stroke-width="1.5"/>

                        <!-- Visor -->
                        <ellipse
                            cx="100" cy="82" rx="16" ry="18"
                            fill="url(#visorGradient)"/>

                        <!-- Visor shine -->
                        <ellipse cx="94" cy="76" rx="5" ry="7" fill="rgba(255,255,255,0.5)" opacity="0.7"/>
                        <ellipse cx="105" cy="88" rx="3" ry="4" fill="rgba(255,255,255,0.3)" opacity="0.5"/>

                        <!-- Visor reflection of stars -->
                        <circle cx="108" cy="75" r="1.5" fill="#fff" opacity="0.9" style="animation: starTwinkle 1.5s ease-in-out infinite;"/>
                        <circle cx="96" cy="90" r="1" fill="#fff" opacity="0.7" style="animation: starTwinkle 2s ease-in-out infinite 0.5s;"/>

                        <!-- Helmet top light -->
                        <circle cx="100" cy="58" r="2.5" fill="#ef4444" style="animation: serverBlink 1s ease-in-out infinite;"/>
                        <circle cx="100" cy="58" r="5" fill="#ef4444" opacity="0.3" style="animation: pulseGlow 1.5s ease-in-out infinite;"/>

                    </g>

                    <!-- ============================================
                         Signal waves (searching for connection)
                         ============================================ -->
                    <g style="transform-origin: 100px 80px;">
                        <circle
                            cx="100" cy="80" r="28"
                            fill="none"
                            stroke="#67e8f9"
                            stroke-width="1"
                            opacity="0.6"
                            style="animation: pulseDot 2.5s ease-out infinite;"/>
                        <circle
                            cx="100" cy="80" r="28"
                            fill="none"
                            stroke="#67e8f9"
                            stroke-width="1"
                            opacity="0.4"
                            style="animation: pulseDot 2.5s ease-out infinite 0.8s;"/>
                        <circle
                            cx="100" cy="80" r="28"
                            fill="none"
                            stroke="#67e8f9"
                            stroke-width="1"
                            opacity="0.2"
                            style="animation: pulseDot 2.5s ease-out infinite 1.6s;"/>
                    </g>

                </svg>
            </div>

            <!-- ====================================================
                 Error Code
                 ==================================================== -->
            <div class="error-code">404</div>

            <!-- ====================================================
                 Title & Description
                 ==================================================== -->
            <h1 class="error-title">
                <i class="fas fa-rocket"></i>
                صفحه‌ای که دنبالش بودید پیدا نشد
            </h1>

            <p class="error-description">
                به نظر می‌رسد این صفحه در فضا گم شده!
                ممکن است آدرس را اشتباه وارد کرده باشید یا این صفحه منتقل/حذف شده باشد.
                بیایید به مسیر اصلی برگردیم.
            </p>

            <!-- ====================================================
                 Actions
                 ==================================================== -->
            <div class="error-actions">
                <a href="/dashboard" class="btn btn-primary">
                    <i class="fas fa-home"></i>
                    <span>بازگشت به داشبورد</span>
                </a>
                <button class="btn btn-outline" onclick="history.back()">
                    <i class="fas fa-arrow-right"></i>
                    <span>بازگشت</span>
                </button>
            </div>

            <!-- ====================================================
                 Meta
                 ==================================================== -->
            <div class="error-meta">
                <span class="error-meta-item">
                    <i class="fas fa-link"></i>
                    <span id="errorPath">—</span>
                </span>
                <span class="error-meta-item">
                    <i class="fas fa-clock"></i>
                    <span id="errorTime">—</span>
                </span>
            </div>

        </div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaliday@1/dist/index.min.js"></script>

    <script>
    (function() {
        'use strict';

        // مسیر درخواست
        const pathEl = document.getElementById('errorPath');
        if (pathEl) {
            const path = window.location.pathname || '/';
            const display = path.length > 40
                ? path.substring(0, 37) + '...'
                : path;
            pathEl.textContent = display;
            pathEl.title = path;
        }

        // ساعت خطا
        const timeEl = document.getElementById('errorTime');
        if (timeEl) {
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString('fa-IR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
            });
        }

        console.log('🚀 Error 404 page loaded');
    })();
    </script>

</body>
</html>
