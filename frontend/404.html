<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۰۴ - صفحه یافت نشد</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            background: #080c18;
        }

        .error-page .error-code {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Courier New', monospace;
        }

        .error-page .error-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        .error-page .error-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #e8eef7;
            margin: 8px 0;
        }

        .error-page .error-message {
            color: #7a8fa3;
            font-size: 1rem;
            max-width: 500px;
            margin: 8px auto 20px;
        }

        .error-page .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 28px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: inherit;
        }

        .error-page .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.3);
        }

        .error-page .error-footer {
            margin-top: 30px;
            color: #4a5a6a;
            font-size: 0.7rem;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 480px) {
            .error-page .error-code {
                font-size: 4rem;
            }
            .error-page .error-title {
                font-size: 1.3rem;
            }
            .error-page .error-message {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="error-page">
        <span class="error-icon">🔍</span>
        <div class="error-code">404</div>
        <h1 class="error-title">صفحه مورد نظر یافت نشد</h1>
        <p class="error-message">
            متأسفیم، صفحه‌ای که به دنبال آن هستید وجود ندارد یا تغییر کرده است.
        </p>
        <a href="/" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            بازگشت به صفحه اصلی
        </a>
        <div class="error-footer">🚀 سیستم تحلیلگر v9.0</div>
    </div>

    <script src="/js/script.js"></script>
    <script>
        function loadNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;
            fetch('/nav.html')
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        old.parentNode.replaceChild(ns, old);
                    });
                })
                .catch(() => {});
        }
        document.addEventListener('DOMContentLoaded', loadNav);
    </script>
</body>
</html>
