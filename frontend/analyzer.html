<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحلیلگر</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .analyzer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
        }
        .analyzer-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .analyzer-controls select, .analyzer-controls input {
            padding: 8px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .analyzer-controls select:focus, .analyzer-controls input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }
        .analyzer-controls button {
            padding: 8px 24px;
            background: linear-gradient(135deg, var(--accent-cyan), #0099cc);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .analyzer-controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.25);
        }
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 24px;
            margin-top: 16px;
        }
        .result-card .signal {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            padding: 16px;
            border-radius: 8px;
        }
        .result-card .signal.buy { color: var(--accent-green); }
        .result-card .signal.sell { color: var(--accent-red); }
        .result-card .signal.neutral { color: var(--accent-orange); }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .result-item {
            background: var(--bg-primary);
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
        }
        .result-item .label { color: var(--text-secondary); font-size: 0.7rem; }
        .result-item .value { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }
        @media (max-width: 768px) {
            .result-grid { grid-template-columns: 1fr 1fr; }
            .analyzer-controls { flex-direction: column; }
            .analyzer-controls select, .analyzer-controls input, .analyzer-controls button { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="navContainer"></div>
    
    <main class="analyzer-container">
        <h1>🧠 تحلیلگر بازار</h1>
        <p class="subtitle">پیش‌بینی لحظه‌ای با مدل XGBoost</p>
        
        <div class="analyzer-controls">
            <select id="coinSelect">
                <option value="bitcoin">بیت‌کوین (BTC)</option>
                <option value="ethereum">اتریوم (ETH)</option>
                <option value="solana">سولانا (SOL)</option>
                <option value="cardano">کاردانو (ADA)</option>
                <option value="ripple">ریپل (XRP)</option>
            </select>
            <select id="periodSelect">
                <option value="24h">۲۴ ساعت</option>
                <option value="1w">۱ هفته</option>
                <option value="1m" selected>۱ ماه</option>
            </select>
            <button id="predictBtn">🔮 پیش‌بینی</button>
        </div>
        
        <div id="resultContainer">
            <div class="result-card">
                <p style="color: var(--text-secondary); text-align: center; padding: 20px;">
                    برای شروع پیش‌بینی، ارز و بازه را انتخاب کنید.
                </p>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <h3>📋 تاریخچه پیش‌بینی‌ها</h3>
            <div class="result-card" id="historyContainer">
                <p style="color: var(--text-secondary); text-align: center; padding: 10px;">
                    در حال بارگذاری...
                </p>
            </div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/analyzer.js"></script>
</body>
</html>
