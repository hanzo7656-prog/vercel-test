<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تحلیلگر بازار | سیستم تحلیلگر</title>
    
    <!-- استایل‌ها -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/analyzer-animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Chart.js (برای تب indicators) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

    <!-- ============================================================
         LOADING OVERLAY (لودینگ داخلی)
         ============================================================ -->
    <div id="loadingOverlayContainer"></div>

    <!-- ============================================================
         NAVIGATION
         ============================================================ -->
    <div id="navContainer"></div>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="analyzer-header">
            <div>
                <h1>
                    <i class="fas fa-robot"></i>
                    تحلیلگر بازار
                </h1>
                <span class="subtitle">پیش‌بینی لحظه‌ای با مدل XGBoost و شاخص‌های تکنیکال</span>
            </div>
            <div class="header-actions">
                <span class="analyzer-status-badge unknown" id="pageStatusBadge">
                    <span class="status-dot"></span>
                    <span class="status-text">آماده</span>
                </span>
                <span class="timestamp" id="pageTimestamp">—</span>
                <button class="btn btn-xs btn-outline" onclick="refreshCurrentTab()" 
                        style="padding:4px 12px;font-size:0.7rem;">
                    <i class="fas fa-sync-alt"></i>
                    <span style="margin-right:4px;">بروزرسانی</span>
                </button>
            </div>
        </div>

        <!-- ===== TABS ===== -->
        <div class="analyzer-tabs" id="analyzerTabs">
            <button class="analyzer-tab-btn active" data-tab="predict">
                <i class="fas fa-wand-magic-sparkles"></i>
                <span>پیش‌بینی</span>
                <span class="badge" id="predictBadge" style="display:none;">0</span>
            </button>
            <button class="analyzer-tab-btn" data-tab="indicators">
                <i class="fas fa-chart-bar"></i>
                <span>شاخص‌ها</span>
            </button>
            <button class="analyzer-tab-btn" data-tab="history">
                <i class="fas fa-history"></i>
                <span>تاریخچه</span>
                <span class="badge" id="historyBadge" style="display:none;">0</span>
            </button>
        </div>

        <!-- ===== TAB CONTENT ===== -->
        <div class="analyzer-tab-wrapper" id="analyzerTabContent">
            <div class="analyzer-empty">
                <span class="empty-icon">⏳</span>
                <div class="empty-title">در حال بارگذاری...</div>
                <div class="empty-message">لطفاً صبر کنید</div>
            </div>
        </div>

    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/analyzer-loader.js"></script>

</body>
</html>
