<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تحلیلگر</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .analyzer-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 22px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        
        .analyzer-controls .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 120px;
        }
        
        .analyzer-controls .control-group label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        .analyzer-controls select {
            padding: 8px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
            width: 100%;
            transition: var(--transition);
        }
        
        .analyzer-controls select:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.05);
        }
        
        .analyzer-controls select option { background: var(--bg-secondary); }
        
        .analyzer-controls .btn {
            padding: 10px 28px;
            border-radius: var(--radius-sm);
            border: none;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 0.85rem;
            min-width: 120px;
            align-self: flex-end;
        }
        
        .analyzer-controls .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.25);
        }
        
        .analyzer-controls .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .analyzer-controls .btn .spinner-sm {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        
        /* ===== RESULT ===== */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        
        .result-card:hover { border-color: var(--border-hover); }
        
        .result-card .signal-display {
            text-align: center;
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 2rem;
            font-weight: 700;
            transition: var(--transition);
        }
        
        .result-card .signal-display.buy {
            background: rgba(34, 211, 238, 0.05);
            color: var(--accent-green);
            border: 2px solid rgba(34, 211, 238, 0.1);
        }
        
        .result-card .signal-display.sell {
            background: rgba(239, 68, 68, 0.05);
            color: var(--accent-red);
            border: 2px solid rgba(239, 68, 68, 0.1);
        }
        
        .result-card .signal-display.neutral {
            background: rgba(245, 158, 11, 0.05);
            color: var(--accent-orange);
            border: 2px solid rgba(245, 158, 11, 0.1);
        }
        
        .result-card .signal-display .signal-icon { display: block; font-size: 3rem; margin-bottom: 4px; }
        .result-card .signal-display .signal-sub { font-size: 0.9rem; font-weight: 400; opacity: 0.7; }
        
        .result-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        
        .result-item {
            background: var(--bg-input);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            text-align: center;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        
        .result-item:hover { border-color: var(--border-hover); }
        
        .result-item .label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .result-item .value {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 4px;
            font-family: var(--font-mono);
        }
        
        .result-item .value.cyan { color: var(--accent-cyan); }
        .result-item .value.green { color: var(--accent-green); }
        .result-item .value.orange { color: var(--accent-orange); }
        .result-item .value.purple { color: var(--accent-purple); }
        
        /* ===== HISTORY ===== */
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 6px;
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .history-item:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        
        .history-item .h-signal { font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .history-item .h-signal.buy { color: var(--accent-green); }
        .history-item .h-signal.sell { color: var(--accent-red); }
        .history-item .h-signal.neutral { color: var(--accent-orange); }
        
        .history-item .h-details {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        
        .history-item .h-details .h-price { font-family: var(--font-mono); color: var(--text-primary); }
        .history-item .h-details .h-time { font-size: 0.65rem; color: var(--text-muted); }
        
        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .result-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 768px) {
            .analyzer-controls { flex-direction: column; padding: 14px 16px; }
            .analyzer-controls .control-group { min-width: 100%; }
            .analyzer-controls .btn { width: 100%; margin-top: 8px; justify-content: center; }
            .result-card { padding: 16px 18px; }
            .result-card .signal-display { font-size: 1.5rem; padding: 14px; }
            .result-card .signal-display .signal-icon { font-size: 2rem; }
            .result-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .result-item { padding: 8px 12px; }
            .result-item .value { font-size: 0.9rem; }
            .history-item { flex-direction: column; align-items: stretch; }
            .history-item .h-details { justify-content: space-between; }
        }
        
        @media (max-width: 480px) {
            .result-grid { grid-template-columns: 1fr; }
            .result-item .value { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="container">

        <div class="page-header">
            <div>
                <h1><i class="fas fa-robot" style="color:var(--accent-purple);"></i> تحلیلگر بازار</h1>
                <span class="subtitle">پیش‌بینی لحظه‌ای با مدل XGBoost</span>
            </div>
            <span class="timestamp" id="pageTimestamp"></span>
        </div>

        <!-- Controls -->
        <div class="analyzer-controls">
            <div class="control-group">
                <label>🪙 ارز دیجیتال</label>
                <select id="coinSelect">
                    <option value="bitcoin">₿ بیت‌کوین</option>
                    <option value="ethereum">⟠ اتریوم</option>
                    <option value="solana">◎ سولانا</option>
                    <option value="cardano">₳ کاردانو</option>
                    <option value="ripple">✕ ریپل</option>
                    <option value="polkadot">◈ پولکادات</option>
                    <option value="dogecoin">🐕 دوج‌کوین</option>
                    <option value="avalanche">❄️ آوالانچ</option>
                </select>
            </div>
            <div class="control-group">
                <label>⏱️ بازه زمانی</label>
                <select id="periodSelect">
                    <option value="24h">۲۴ ساعت</option>
                    <option value="1w">۱ هفته</option>
                    <option value="1m" selected>۱ ماه</option>
                    <option value="3m">۳ ماه</option>
                </select>
            </div>
            <button class="btn" id="predictBtn">
                <i class="fas fa-wand-magic-sparkles"></i>
                پیش‌بینی
            </button>
        </div>

        <!-- Result -->
        <div id="resultContainer">
            <div class="result-card">
                <div style="text-align:center;padding:30px 20px;color:var(--text-muted);">
                    <div style="font-size:3rem;margin-bottom:12px;">🔮</div>
                    <p style="font-size:1rem;">برای شروع پیش‌بینی، ارز و بازه را انتخاب کنید</p>
                    <p style="font-size:0.8rem;margin-top:4px;">مدل XGBoost با دقت بالا آماده تحلیل است</p>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-history"></i> تاریخچه پیش‌بینی‌ها
                <span class="badge-count" id="historyCount" style="margin-right:auto;">۰</span>
            </div>
            <div id="historyContainer">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">در حال بارگذاری...</p>
                </div>
            </div>
        </div>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        class AnalyzerController {
            constructor() {
                this.isLoading = false;
                this.init();
            }
            
            async init() {
                console.log('🚀 Analyzer initializing...');
                await this.loadNav();
                this.setupEvents();
                await this.loadHistory();
                console.log('🚀 Analyzer ready');
            }
            
            async loadNav() {
                const container = document.getElementById('navContainer');
                if (!container) return;
                try {
                    const res = await fetch('/nav.html');
                    if (!res.ok) throw new Error('nav.html not found');
                    const html = await res.text();
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        old.parentNode.replaceChild(ns, old);
                    });
                } catch (err) {
                    console.error('❌ Nav error:', err);
                    container.innerHTML = `
                        <div style="background:var(--bg-secondary);padding:8px;text-align:center;border-bottom:1px solid var(--border-color);font-size:0.8rem;color:var(--accent-red);">
                            ⚠️ خطا در بارگذاری منو
                            <button onclick="location.reload()" style="background:var(--accent-cyan);color:#000;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;margin:4px;">🔄</button>
                        </div>
                    `;
                }
            }
            
            setupEvents() {
                const predictBtn = document.getElementById('predictBtn');
                const coinSelect = document.getElementById('coinSelect');
                const periodSelect = document.getElementById('periodSelect');
                
                predictBtn.addEventListener('click', () => this.predict());
                coinSelect.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.predict(); });
                periodSelect.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.predict(); });
            }
            
            async predict() {
                if (this.isLoading) return;
                
                const coin = document.getElementById('coinSelect').value;
                const period = document.getElementById('periodSelect').value;
                const container = document.getElementById('resultContainer');
                const btn = document.getElementById('predictBtn');
                
                this.isLoading = true;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-sm"></span> در حال تحلیل...';
                
                container.innerHTML = `
                    <div class="result-card">
                        <div class="loading-container">
                            <div class="loading-spinner"></div>
                            <p class="loading-text">در حال دریافت پیش‌بینی از مدل...</p>
                            <p style="font-size:0.7rem;color:var(--text-muted);">${coin} • ${period}</p>
                        </div>
                    </div>
                `;
                
                try {
                    const data = await api.predictSingle(coin, period);
                    if (data.success && data.data) {
                        this.renderPrediction(data.data);
                        await this.loadHistory();
                    } else {
                        this.renderError(data.error || 'خطا در پیش‌بینی');
                    }
                } catch (err) {
                    this.renderError('خطا در ارتباط با سرور');
                }
                
                this.isLoading = false;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> پیش‌بینی';
            }
            
            renderPrediction(data) {
                const container = document.getElementById('resultContainer');
                const signalType = data.signal_type?.toLowerCase() || 'neutral';
                const emojis = { buy: '🟢', sell: '🔴', neutral: '🟡' };
                const labels = { buy: 'خرید', sell: 'فروش', neutral: 'خنثی' };
                
                container.innerHTML = `
                    <div class="result-card">
                        <div class="signal-display ${signalType}">
                            <span class="signal-icon">${emojis[signalType] || '🟡'}</span>
                            ${labels[signalType] || 'خنثی'}
                            <div class="signal-sub">${data.signal || 'سیگنال خنثی'}</div>
                        </div>
                        <div class="result-grid">
                            <div class="result-item">
                                <div class="label">💰 قیمت</div>
                                <div class="value cyan">${formatCurrency(data.current_price)}</div>
                            </div>
                            <div class="result-item">
                                <div class="label">🎯 اطمینان</div>
                                <div class="value green">${data.confidence || '—'}</div>
                            </div>
                            <div class="result-item">
                                <div class="label">📊 امتیاز</div>
                                <div class="value orange">${((data.prediction_score || 0) * 100).toFixed(1)}%</div>
                            </div>
                            <div class="result-item">
                                <div class="label">🧠 مدل</div>
                                <div class="value purple">${data.model_mode || 'DEMO'}</div>
                            </div>
                            <div class="result-item" style="grid-column:1/-1;">
                                <div class="label">🪙 ارز • ⏱️ زمان</div>
                                <div class="value" style="font-size:0.9rem;color:var(--text-secondary);">
                                    ${data.coin_name || data.coin} • ${data.timestamp ? formatDate(data.timestamp) : '—'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            renderError(message) {
                const container = document.getElementById('resultContainer');
                container.innerHTML = `
                    <div class="result-card">
                        <div style="text-align:center;padding:30px 20px;">
                            <div style="font-size:3rem;margin-bottom:12px;">❌</div>
                            <p style="color:var(--accent-red);font-size:1rem;">${message}</p>
                            <p style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">لطفاً مجدداً تلاش کنید</p>
                        </div>
                    </div>
                `;
            }
            
            async loadHistory() {
                const container = document.getElementById('historyContainer');
                const countEl = document.getElementById('historyCount');
                
                try {
                    const data = await api.getModelHistory(10);
                    if (data.success && data.data && data.data.length > 0) {
                        countEl.textContent = data.data.length;
                        container.innerHTML = data.data.map(item => `
                            <div class="history-item">
                                <div class="h-signal ${item.is_active ? 'buy' : 'neutral'}">
                                    ${item.is_active ? '🟢' : '🟡'} ${item.is_active ? 'فعال' : 'غیرفعال'}
                                </div>
                                <div class="h-details">
                                    <span class="h-price">نسخه: ${item.version || '—'}</span>
                                    <span class="h-price">دقت: ${((item.accuracy || 0) * 100).toFixed(1)}%</span>
                                    <span class="h-time">${formatDate(item.training_date)}</span>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        countEl.textContent = '۰';
                        container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-muted);">📭 هیچ پیش‌بینی ذخیره‌ای یافت نشد</div>`;
                    }
                } catch (err) {
                    container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--accent-red);">❌ خطا در دریافت تاریخچه</div>`;
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            new AnalyzerController();
        });
    </script>
</body>
</html>
