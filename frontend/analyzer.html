<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تحلیلگر بازار</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        /* ============================================================
           ANALYZER PAGE STYLES
           ============================================================ */
        
        .tab-content-wrapper {
            min-height: 400px;
            position: relative;
        }
        
        .tab-content-wrapper .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 16px;
        }
        
        .tab-content-wrapper .loading-spinner {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-cyan);
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tab-content-wrapper .loading-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .tab-content-wrapper .error-msg {
            text-align: center;
            padding: 40px 20px;
            color: var(--accent-orange);
        }
        
        .tab-content-wrapper .error-msg .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }
        
        .tab-content-wrapper .error-msg button {
            margin-top: 12px;
            padding: 6px 16px;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
        }
        
        .tab-content-wrapper .error-msg button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
        }

        /* ===== LOADING OVERLAY (همون سیستم قبلی) ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: overlayFadeIn 0.3s ease;
            font-family: var(--font-family);
        }
        
        .loading-overlay.active {
            display: flex;
        }

        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 48px;
            min-width: 280px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: cardSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .loading-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 212, 255, 0.03), transparent 70%);
            pointer-events: none;
            animation: cardGlow 3s ease-in-out infinite;
        }

        @keyframes cardSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cardGlow {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(5deg); }
        }

        .loading-spinner-wrapper {
            position: relative;
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
        }

        .loading-spinner-wrapper svg {
            width: 100%;
            height: 100%;
            animation: spinnerRotate 1.2s linear infinite;
        }

        @keyframes spinnerRotate {
            to { transform: rotate(360deg); }
        }

        .loading-spinner-wrapper .spinner-circle-bg {
            fill: none;
            stroke-width: 3;
            stroke: var(--border-color);
            opacity: 0.3;
        }

        .loading-spinner-wrapper .spinner-circle-fg {
            fill: none;
            stroke-width: 3;
            stroke: var(--accent-cyan);
            stroke-linecap: round;
            stroke-dasharray: 180;
            stroke-dashoffset: 0;
            animation: spinnerDash 1.2s ease-in-out infinite;
        }

        @keyframes spinnerDash {
            0% { stroke-dashoffset: 180; }
            50% { stroke-dashoffset: 40; }
            100% { stroke-dashoffset: 180; }
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 8px 0 16px;
        }

        .loading-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.2;
            transition: all 0.3s ease;
        }

        .loading-dots .dot.active {
            opacity: 1;
            background: var(--accent-cyan);
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .loading-dots .dot:nth-child(1).active {
            animation: dotPulse 1.2s ease-in-out infinite 0s;
        }
        .loading-dots .dot:nth-child(2).active {
            animation: dotPulse 1.2s ease-in-out infinite 0.2s;
        }
        .loading-dots .dot:nth-child(3).active {
            animation: dotPulse 1.2s ease-in-out infinite 0.4s;
        }

        @keyframes dotPulse {
            0%, 100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            }
        }

        .loading-message {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-top: 4px;
            min-height: 28px;
            transition: all 0.3s ease;
        }

        .loading-submessage {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        .loading-progress {
            width: 100%;
            height: 3px;
            background: var(--bg-input);
            border-radius: var(--radius-full);
            margin-top: 16px;
            overflow: hidden;
            position: relative;
        }

        .loading-progress .progress-fill {
            height: 100%;
            border-radius: var(--radius-full);
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            width: 0%;
            transition: width 0.5s ease;
        }

        .loading-progress .progress-fill.indeterminate {
            width: 30%;
            animation: progressIndeterminate 1.5s ease-in-out infinite;
        }

        @keyframes progressIndeterminate {
            0% { transform: translateX(0%); width: 30%; }
            50% { width: 60%; }
            100% { transform: translateX(300%); width: 30%; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .tabs { flex-wrap: nowrap; overflow-x: auto; }
            .tab-btn { font-size: 0.7rem; padding: 6px 12px; white-space: nowrap; }
        }

        @media (max-width: 768px) {
            .tab-btn { font-size: 0.65rem; padding: 6px 10px; }
            .tab-btn i { font-size: 0.7rem; }
        }

        @media (max-width: 480px) {
            .loading-card {
                padding: 28px 20px;
                min-width: unset;
            }
            .loading-spinner-wrapper {
                width: 56px;
                height: 56px;
            }
            .loading-message {
                font-size: 0.85rem;
            }
            .loading-dots .dot {
                width: 8px;
                height: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <div id="navContainer"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">
        
        <!-- ===== HEADER ===== -->
        <div class="page-header">
            <div>
                <h1><i class="fas fa-robot" style="color:var(--accent-purple);"></i> تحلیلگر بازار</h1>
                <span class="subtitle">پیش‌بینی لحظه‌ای با مدل XGBoost</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <span class="badge" id="analyzerStatusBadge">🟢 آماده</span>
                <span class="timestamp" id="pageTimestamp"></span>
                <button class="btn btn-xs btn-outline" onclick="refreshCurrentTab()" style="padding:2px 10px;font-size:0.6rem;">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <!-- ===== TABS ===== -->
        <div class="tabs" id="analyzerTabs">
            <button class="tab-btn active" data-tab="predict">
                <i class="fas fa-wand-magic-sparkles"></i> پیش‌بینی
                <span class="badge" id="predictBadge" style="display:none;font-size:0.45rem;padding:1px 6px;background:var(--accent-cyan);color:#000;">0</span>
            </button>
            <button class="tab-btn" data-tab="chart">
                <i class="fas fa-chart-line"></i> نمودار
            </button>
            <button class="tab-btn" data-tab="indicators">
                <i class="fas fa-chart-bar"></i> شاخص‌ها
            </button>
            <button class="tab-btn" data-tab="history">
                <i class="fas fa-history"></i> تاریخچه
            </button>
        </div>

        <!-- ===== TAB CONTENT ===== -->
        <div class="tab-content-wrapper" id="analyzerTabContent">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p class="loading-text">در حال بارگذاری...</p>
            </div>
        </div>

    </div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="loading-spinner-wrapper">
                <svg viewBox="0 0 72 72">
                    <circle class="spinner-circle-bg" cx="36" cy="36" r="28"/>
                    <circle class="spinner-circle-fg" cx="36" cy="36" r="28"/>
                </svg>
            </div>
            <div class="loading-dots" id="loadingDots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="loading-message" id="loadingMessage">در حال انجام...</div>
            <div class="loading-submessage" id="loadingSubMessage">لطفاً صبر کنید</div>
            <div class="loading-progress">
                <div class="progress-fill indeterminate" id="loadingProgress"></div>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    
    <script>
    // ============================================================
    // LOADING SYSTEM (همون سیستم قبلی)
    // ============================================================
    
    class LoadingSystem {
        constructor() {
            this.overlay = document.getElementById('loadingOverlay');
            this.messageEl = document.getElementById('loadingMessage');
            this.subMessageEl = document.getElementById('loadingSubMessage');
            this.dots = document.querySelectorAll('#loadingDots .dot');
            this.progress = document.getElementById('loadingProgress');
            this.isActive = false;
            this.dotsInterval = null;
            this.progressTimer = null;
            this.onComplete = null;
            
            this.messages = {
                short: ['در حال انجام...'],
                medium: ['در حال انجام...', 'لطفاً کمی صبر کنید'],
                long: ['در حال انجام...', 'لطفاً کمی صبر کنید', 'تقریباً تمام است', 'پایان']
            };
        }

        show(options = {}) {
            const { messages = 'long', duration = null, onComplete = null } = options;
            if (this.isActive) return;

            this.isActive = true;
            this.onComplete = onComplete;

            let messageList;
            if (Array.isArray(messages)) {
                messageList = messages;
            } else {
                messageList = this.messages[messages] || this.messages.long;
            }

            this.messageQueue = messageList;
            this.currentMessageIndex = 0;
            this.updateMessage(0);
            this.startDotsAnimation();

            this.overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            if (duration) {
                this.startProgressAnimation(duration);
            }

            console.log('🔄 Loading started:', messageList[0]);
        }

        updateMessage(index) {
            if (index >= this.messageQueue.length) {
                this.complete();
                return;
            }

            const message = this.messageQueue[index];
            const parts = message.split('|');
            const mainMsg = parts[0] || message;
            const subMsg = parts[1] || '';

            this.messageEl.textContent = mainMsg;
            this.subMessageEl.textContent = subMsg;

            if (index === this.messageQueue.length - 1) {
                this.stopDotsAnimation();
            }

            this.currentMessageIndex = index;
        }

        startDotsAnimation() {
            this.stopDotsAnimation();
            let activeIndex = 0;
            this.dots.forEach(d => d.classList.remove('active'));

            this.dotsInterval = setInterval(() => {
                this.dots.forEach(d => d.classList.remove('active'));
                this.dots[activeIndex].classList.add('active');
                activeIndex = (activeIndex + 1) % this.dots.length;
            }, 400);
        }

        stopDotsAnimation() {
            if (this.dotsInterval) {
                clearInterval(this.dotsInterval);
                this.dotsInterval = null;
            }
            this.dots.forEach(d => d.classList.remove('active'));
        }

        startProgressAnimation(duration) {
            this.progress.classList.remove('indeterminate');
            const startTime = Date.now();

            const updateProgress = () => {
                if (!this.isActive) return;
                const elapsed = Date.now() - startTime;
                const percent = Math.min((elapsed / duration) * 100, 100);
                this.progress.style.width = percent + '%';

                const ratio = elapsed / duration;
                const totalMessages = this.messageQueue.length;

                if (ratio > 0.85 && totalMessages > 1) {
                    const lastIndex = totalMessages - 1;
                    if (this.currentMessageIndex < lastIndex) {
                        this.updateMessage(lastIndex);
                    }
                } else if (ratio > 0.5 && totalMessages > 2) {
                    const midIndex = Math.min(Math.floor(totalMessages * 0.7), totalMessages - 2);
                    if (this.currentMessageIndex < midIndex) {
                        this.updateMessage(midIndex);
                    }
                }

                if (percent < 100) {
                    this.progressTimer = setTimeout(updateProgress, 50);
                } else {
                    this.progress.style.width = '100%';
                }
            };

            updateProgress();
        }

        complete() {
            if (!this.isActive) return;

            this.messageEl.textContent = '✅ پایان';
            this.subMessageEl.textContent = 'عملیات با موفقیت انجام شد';
            this.progress.style.width = '100%';
            this.stopDotsAnimation();

            setTimeout(() => {
                this.hide();
                if (this.onComplete) {
                    this.onComplete();
                }
            }, 800);
        }

        hide() {
            if (!this.isActive) return;

            this.isActive = false;
            this.overlay.classList.remove('active');
            document.body.style.overflow = '';
            this.stopDotsAnimation();
            
            if (this.progressTimer) {
                clearTimeout(this.progressTimer);
                this.progressTimer = null;
            }

            this.progress.classList.add('indeterminate');
            this.progress.style.width = '0%';
            this.dots.forEach(d => d.classList.remove('active'));

            console.log('✅ Loading hidden');
        }

        setMessage(message) {
            this.messageEl.textContent = message;
        }

        setSubMessage(message) {
            this.subMessageEl.textContent = message;
        }

        setProgress(percent) {
            if (this.progressMode) {
                this.progress.classList.remove('indeterminate');
                this.progress.style.width = Math.min(percent, 100) + '%';
            }
        }
    }

    // ===== نمونه Singleton =====
    const loading = new LoadingSystem();
    window.loading = loading;

    console.log('✅ Loading System v1.0 loaded');
    </script>

    <!-- ===== ANALYZER LOADER ===== -->
    <script src="/js/analyzer-loader.js"></script>

</body>
</html>
