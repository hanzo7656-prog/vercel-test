<!-- ============================================================
     NEXT TRAINING
     ============================================================ -->
<div class="next-training-card">
    <div class="next-icon">⏰</div>
    <div class="next-info">
        <div class="next-label">آموزش بعدی</div>
        <div class="next-value cyan" id="nextTrainingTime">—</div>

            <div class="progress-fill" id="nextProgressBar" style="width:0%;"></div>
        </div>
    </div>
    <div class="next-action">
        <button class="btn-model btn-primary btn-neon" onclick="goToTraining()">
            <i class="fas fa-graduation-cap"></i>
            آموزش جدید
        </button>
    </div>

<script>
// ============================================================
// DASHBOARD TAB v3.0
// ============================================================

// ===== State =====
let dashboardInterval = null;
let isDashboardLoaded = false;
let healthCircleAnimation = null;

// ============================================================
// ۱. INITIALIZE / CLEANUP
// ============================================================

window.init_dashboard = function() {
    console.log('📊 Dashboard tab initializing...');
    if (isDashboardLoaded) {
        console.log('⚠️ Already loaded, skipping');
        return;
    }
    isDashboardLoaded = true;
    loadAll();
    
    // auto-refresh هر ۲۰ ثانیه
    if (dashboardInterval) clearInterval(dashboardInterval);
    dashboardInterval = setInterval(loadAll, 20000);
};

window.cleanup_dashboard = function() {
    console.log('🧹 Dashboard tab cleaning up...');
    isDashboardLoaded = false;
    
    if (dashboardInterval) {
        clearInterval(dashboardInterval);
        dashboardInterval = null;
    }
    if (healthCircleAnimation) {
        clearTimeout(healthCircleAnimation);
        healthCircleAnimation = null;
    }
};

// ============================================================
// ۲. LOAD ALL
// ============================================================

async function loadAll() {
    await Promise.allSettled([
        loadModelStatus(),
        loadPredictions(),
        loadAlerts(),
        loadNextTraining()
    ]);
}

// ============================================================
// ۳. LOAD MODEL STATUS + HEALTH SCORE
// ============================================================

async function loadModelStatus() {
    try {
        const [statusRes, historyRes] = await Promise.allSettled([
            api.getModelStatus(),
            api.getModelHistory(1)
        ]);
        
        let accuracy = null;
        let version = 'N/A';
        let isLoaded = false;
        let isTraining = false;
        let totalTrainings = 0;
        let lastTrainingDate = null;
        
        // پردازش status
        if (statusRes.status === 'fulfilled' && statusRes.value?.success) {
            const data = statusRes.value.data || {};
            accuracy = data.last_score;
            version = data.version || 'N/A';
            isLoaded = data.loaded || false;
            isTraining = data.is_training || false;
            totalTrainings = data.total_trainings || 0;
        }
        
        // پردازش history
        if (historyRes.status === 'fulfilled' && historyRes.value?.success) {
            const history = historyRes.value.data;
            if (history && history.length > 0) {
                lastTrainingDate = history[0].training_date;
            }
        }
        
        // ===== محاسبه Health Score =====
        const healthScore = calculateHealthScore({
            accuracy,
            totalTrainings,
            lastTrainingDate,
            isLoaded
        });
        
        // ===== به‌روزرسانی Hero =====
        updateHeroSection({
            version,
            isLoaded,
            isTraining,
            accuracy,
            lastTrainingDate
        });
        
        // ===== به‌روزرسانی Health Circle =====
        updateHealthCircle(healthScore);
        
        // ===== به‌روزرسانی Stats =====
        updateStats({
            isLoaded,
            isTraining,
            version,
            accuracy,
            totalTrainings
        });
        
    } catch (error) {
        console.error('❌ Model status error:', error);
    }
}

// ============================================================
// ۴. HEALTH SCORE CALCULATION
// ============================================================

function calculateHealthScore({ accuracy, totalTrainings, lastTrainingDate, isLoaded }) {
    let score = 0;
    
    // ===== ۱. دقت (۴۰٪) =====
    if (accuracy !== null && accuracy !== undefined) {
        score += Math.min(accuracy * 100, 100) * 0.4;
    }
    
    // ===== ۲. تعداد آموزش (۲۰٪) =====
    // هر آموزش ۲ امتیاز، حداکثر ۲۰
    score += Math.min(totalTrainings * 2, 20);
    
    // ===== ۳. تازگی (۲۵٪) =====
    if (lastTrainingDate) {
        const daysOld = (Date.now() - new Date(lastTrainingDate).getTime()) / (1000 * 60 * 60 * 24);
        if (daysOld < 1) score += 25;
        else if (daysOld < 3) score += 20;
        else if (daysOld < 7) score += 15;
        else if (daysOld < 30) score += 10;
        else score += 5;
    }
    
    // ===== ۴. فعال بودن (۱۵٪) =====
    if (isLoaded) score += 15;
    
    return Math.round(Math.min(score, 100));
}

// ============================================================
// ۵. UPDATE HEALTH CIRCLE
// ============================================================

function updateHealthCircle(score) {
    const circle = document.getElementById('healthCircle');
    const numberEl = document.getElementById('healthScoreNumber');
    
    if (!circle || !numberEl) return;
    
    // محاسبه offset
    // قطر 140، شعاع 65، محیط = 2 * π * 65 ≈ 408
    const circumference = 408;
    const offset = circumference - (score / 100) * circumference;
    
    // انیمیشن عدد (Count-Up)
    animateNumber(numberEl, score, 1500);
    
    // انیمیشن دایره
    // ست کردن CSS variable برای انیمیشن
    circle.style.setProperty('--target-offset', offset);
    
    // ریست و اجرای مجدد انیمیشن
    circle.style.animation = 'none';
    void circle.offsetWidth; // force reflow
    circle.style.animation = 'fillCircle 2s cubic-bezier(0.22, 1, 0.36, 1) forwards';
}

// ============================================================
// ۶. ANIMATE NUMBER (Count-Up)
// ============================================================

function animateNumber(element, target, duration = 1500) {
    if (!element) return;
    
    const startTime = performance.now();
    const startValue = 0;
    
    function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        const current = startValue + (target - startValue) * eased;
        
        element.textContent = Math.round(current);
        
        if (progress < 1) {
            requestAnimationFrame(update);
        }
    }
    
    requestAnimationFrame(update);
}

// ============================================================
// ۷. UPDATE HERO SECTION
// ============================================================

function updateHeroSection({ version, isLoaded, isTraining, accuracy, lastTrainingDate }) {
    // نسخه
    const versionEl = document.getElementById('heroVersion');
    if (versionEl) versionEl.textContent = version;
    
    // وضعیت
    const statusEl = document.getElementById('heroStatus');
    if (statusEl) {
        if (isTraining) {
            statusEl.textContent = '⏳ در حال آموزش';
            statusEl.className = 'hero-metric-value cyan';
        } else if (isLoaded) {
            statusEl.textContent = '✅ فعال';
            statusEl.className = 'hero-metric-value green';
        } else {
            statusEl.textContent = '📦 دمو';
            statusEl.className = 'hero-metric-value purple';
        }
    }
    
    // آخرین آموزش
    const lastTrainingEl = document.getElementById('heroLastTraining');
    if (lastTrainingEl) {
        lastTrainingEl.textContent = lastTrainingDate 
            ? (formatTimeAgo ? formatTimeAgo(new Date(lastTrainingDate)) : formatDate(lastTrainingDate))
            : '—';
    }
    
    // دقت
    const accuracyEl = document.getElementById('heroAccuracy');
    if (accuracyEl) {
        if (accuracy !== null && accuracy !== undefined) {
            accuracyEl.textContent = (accuracy * 100).toFixed(1) + '%';
        } else {
            accuracyEl.textContent = '—';
        }
    }
    
    // Subtitle
    const subtitleEl = document.getElementById('heroSubtitle');
    if (subtitleEl) {
        if (isLoaded) {
            subtitleEl.textContent = 'مدل در حال اجرا است و آماده پیش‌بینی می‌باشد';
        } else {
            subtitleEl.textContent = 'مدل در حالت دمو می‌باشد. برای فعال‌سازی، آموزش دهید';
        }
    }
}

// ============================================================
// ۸. UPDATE STATS
// ============================================================

function updateStats({ isLoaded, isTraining, version, accuracy, totalTrainings }) {
    // وضعیت
    const statusEl = document.getElementById('statStatus');
    if (statusEl) {
        if (isTraining) {
            statusEl.textContent = 'در حال آموزش';
            statusEl.className = 'stat-value cyan';
        } else if (isLoaded) {
            statusEl.textContent = 'فعال';
            statusEl.className = 'stat-value green';
        } else {
            statusEl.textContent = 'دمو';
            statusEl.className = 'stat-value purple';
        }
    }
    
    // نسخه
    const versionEl = document.getElementById('statVersion');
    if (versionEl) versionEl.textContent = version;
    
    // دقت
    const accuracyEl = document.getElementById('statAccuracy');
    if (accuracyEl) {
        if (accuracy !== null && accuracy !== undefined) {
            animateNumber(accuracyEl, accuracy * 100, 1200, 1, '%');
        } else {
            accuracyEl.textContent = '—';
        }
    }
    
    // تعداد آموزش
    const trainingsEl = document.getElementById('statTrainings');
    if (trainingsEl) {
        animateNumber(trainingsEl, totalTrainings, 1000, 0);
    }
}

// ============================================================
// ۹. ANIMATE NUMBER (با فرمت)
// ============================================================

function animateNumber(element, target, duration = 1200, decimals = 0, suffix = '') {
    if (!element) return;
    if (!target || target === 0 || isNaN(target)) {
        element.textContent = '0' + suffix;
        return;
    }
    
    const startTime = performance.now();
    
    function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        const current = target * eased;
        
        element.textContent = current.toFixed(decimals) + suffix;
        
        if (progress < 1) {
            requestAnimationFrame(update);
        }
    }
    
    requestAnimationFrame(update);
}

// ============================================================
// ۱۰. LOAD PREDICTIONS
// ============================================================

async function loadPredictions() {
    const container = document.getElementById('predictionsList');
    if (!container) return;
    
    try {
        const data = await api.getPredictionHistory(5);
        
        if (data && data.success && data.data && data.data.length > 0) {
            container.innerHTML = data.data.slice(0, 5).map((pred, i) => {
                const signal = pred.signal_type || 'NEUTRAL';
                const config = {
                    'BUY': { icon: '🟢', cls: 'buy', label: 'خرید' },
                    'SELL': { icon: '🔴', cls: 'sell', label: 'فروش' },
                    'NEUTRAL': { icon: '🟡', cls: 'neutral', label: 'خنثی' }
                };
                const cfg = config[signal] || config['NEUTRAL'];
                
                return `
                    <div class="prediction-item" style="animation-delay:${0.05 + i * 0.05}s;">
                        <div class="pred-icon ${cfg.cls}">${cfg.icon}</div>
                        <div class="pred-info">
                            <span class="pred-coin">${escapeHtml(pred.coin_name || pred.coin || '—')}</span>
                            <span class="pred-signal">${cfg.label} • ${pred.confidence || 0}% اطمینان</span>
                        </div>
                        <span class="pred-time">${formatTimeAgo ? formatTimeAgo(new Date(pred.timestamp)) : '—'}</span>
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = `
                <div class="empty-state-model" style="padding:20px;">
                    <span class="empty-icon" style="font-size:2rem;">📭</span>
                    <div class="empty-title" style="font-size:0.85rem;">هیچ پیش‌بینی‌ای نیست</div>
                    <div class="empty-message" style="font-size:0.7rem;">با آموزش مدل، پیش‌بینی‌ها اینجا نمایش داده می‌شوند</div>
                </div>
            `;
        }
    } catch (error) {
        console.warn('⚠️ Predictions error:', error.message);
        container.innerHTML = `
            <div class="empty-state-model" style="padding:20px;">
                <span class="empty-icon" style="font-size:2rem;">⚠️</span>
                <div class="empty-title" style="font-size:0.85rem;">خطا در بارگذاری</div>
            </div>
        `;
    }
}

// ============================================================
// ۱۱. LOAD ALERTS
// ============================================================

async function loadAlerts() {
    const container = document.getElementById('alertsList');
    const countEl = document.getElementById('alertsCount');
    if (!container) return;
    
    try {
        const data = await api.getAlerts({ limit: 5, resolved: false });
        
        if (data && data.success && data.data && data.data.length > 0) {
            if (countEl) countEl.textContent = data.data.length;
            
            container.innerHTML = data.data.slice(0, 4).map((alert, i) => {
                const level = alert.level || 'INFO';
                const config = {
                    'CRITICAL': { icon: '🚨', cls: 'critical' },
                    'WARNING': { icon: '⚠️', cls: 'warning' },
                    'INFO': { icon: 'ℹ️', cls: 'info' }
                };
                const cfg = config[level] || config['INFO'];
                
                return `
                    <div class="alert-item ${cfg.cls}" style="animation-delay:${0.05 + i * 0.05}s;">
                        <span class="alert-icon">${cfg.icon}</span>
                        <div class="alert-content">
                            <span class="alert-message">${escapeHtml(alert.message || 'رویداد جدید')}</span>
                            <span class="alert-time">${formatTimeAgo ? formatTimeAgo(new Date(alert.timestamp)) : '—'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            if (countEl) countEl.textContent = '۰';
            container.innerHTML = `
                <div class="empty-state-model" style="padding:20px;">
                    <span class="empty-icon" style="font-size:2rem;">✅</span>
                    <div class="empty-title" style="font-size:0.85rem;">همه چیز خوبه</div>
                    <div class="empty-message" style="font-size:0.7rem;">هیچ هشدار فعالی وجود ندارد</div>
                </div>
            `;
        }
    } catch (error) {
        console.warn('⚠️ Alerts error:', error.message);
        if (countEl) countEl.textContent = '۰';
    }
}

// ============================================================
// ۱۲. LOAD NEXT TRAINING
// ============================================================

async function loadNextTraining() {
    const timeEl = document.getElementById('nextTrainingTime');
    const progressEl = document.getElementById('nextProgressBar');
    
    try {
        const data = await api.getScheduleStatus();
        
        if (data && data.success && data.data) {
            const s = data.data;
            const isRunning = s.is_running || false;
            const nextTraining = s.next_training;
            
            if (isRunning && nextTraining) {
                if (timeEl) {
                    timeEl.textContent = formatDate(nextTraining) || '—';
                }
                
                // محاسبه progress
                if (progressEl) {
                    const now = Date.now();
                    const next = new Date(nextTraining).getTime();
                    const intervalHours = s.interval_hours || 6;
                    const start = next - (intervalHours * 60 * 60 * 1000);
                    const total = next - start;
                    const elapsed = now - start;
                    const percent = Math.min(Math.max((elapsed / total) * 100, 0), 100);
                    
                    setTimeout(() => {
                        progressEl.style.width = percent + '%';
                    }, 300);
                }
            } else {
                if (timeEl) timeEl.textContent = 'زمان‌بندی فعال نیست';
                if (progressEl) progressEl.style.width = '0%';
            }
        }
    } catch (error) {
        console.warn('⚠️ Next training error:', error.message);
        if (timeEl) timeEl.textContent = '—';
    }
}

// ============================================================
// ۱۳. GO TO TRAINING TAB
// ============================================================

function goToTraining() {
    if (typeof window.loadModelTab === 'function') {
        // از model-loader استفاده کن
        const tabs = document.querySelectorAll('#modelTabs .model-tab-btn');
        tabs.forEach(b => b.classList.remove('active'));
        const targetBtn = document.querySelector('#modelTabs .model-tab-btn[data-tab="training"]');
        if (targetBtn) targetBtn.classList.add('active');
        window.loadModelTab('training');
    }
}

// ============================================================
// ۱۴. UTILS
// ============================================================

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

console.log('✅ Dashboard tab v3.0 loaded');
</script>
