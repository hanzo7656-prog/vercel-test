<!-- ============================================================
     DASHBOARD TAB - داشبورد مدل با نمودارهای حرفه‌ای
     ============================================================ -->

<div class="card">
    <div class="card-title">
        <i class="fas fa-chart-pie"></i> داشبورد مدل
        <span class="badge-count" id="lastUpdateTime" style="margin-right:auto;font-size:0.6rem;color:var(--text-muted);">—</span>
        <button class="btn btn-xs btn-outline" onclick="refreshDashboard()" style="padding:2px 10px;font-size:0.6rem;">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- ===== STATUS CARDS ===== -->
    <div class="model-dashboard-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
        <div class="stat-card" style="background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:12px 14px;text-align:center;transition:var(--transition);">
            <div class="stat-icon" style="font-size:1.2rem;display:block;margin-bottom:4px;">🧠</div>
            <div class="stat-value" id="dashStatus" style="font-size:1rem;font-weight:700;font-family:var(--font-mono);">—</div>
            <div class="stat-label" style="font-size:0.55rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;">وضعیت مدل</div>
        </div>
        <div class="stat-card" style="background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:12px 14px;text-align:center;transition:var(--transition);">
            <div class="stat-icon" style="font-size:1.2rem;display:block;margin-bottom:4px;">📌</div>
            <div class="stat-value cyan" id="dashVersion" style="font-size:1rem;font-weight:700;font-family:var(--font-mono);color:var(--accent-cyan);">—</div>
            <div class="stat-label" style="font-size:0.55rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;">نسخه</div>
        </div>
        <div class="stat-card" style="background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:12px 14px;text-align:center;transition:var(--transition);">
            <div class="stat-icon" style="font-size:1.2rem;display:block;margin-bottom:4px;">🎯</div>
            <div class="stat-value" id="dashAccuracy" style="font-size:1rem;font-weight:700;font-family:var(--font-mono);">—</div>
            <div class="stat-label" style="font-size:0.55rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;">دقت</div>
        </div>
        <div class="stat-card" style="background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:12px 14px;text-align:center;transition:var(--transition);">
            <div class="stat-icon" style="font-size:1.2rem;display:block;margin-bottom:4px;">📊</div>
            <div class="stat-value cyan" id="dashTrainings" style="font-size:1rem;font-weight:700;font-family:var(--font-mono);color:var(--accent-cyan);">—</div>
            <div class="stat-label" style="font-size:0.55rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;">تعداد آموزش</div>
        </div>
    </div>

    <!-- ===== CHARTS ROW ===== -->
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px;">
        <!-- Performance Chart -->
        <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:14px 16px;border:1px solid var(--border-color);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="font-size:0.7rem;font-weight:600;color:var(--text-secondary);">
                    <i class="fas fa-chart-line" style="color:var(--accent-cyan);"></i> عملکرد مدل (تغییرات دقت)
                </span>
                <span class="badge badge-green" id="performanceBadge" style="font-size:0.5rem;padding:2px 8px;">● LIVE</span>
            </div>
            <div style="height:200px;position:relative;">
                <canvas id="performanceChart"></canvas>
            </div>
        </div>

        <!-- Feature Importance Mini -->
        <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:14px 16px;border:1px solid var(--border-color);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="font-size:0.7rem;font-weight:600;color:var(--text-secondary);">
                    <i class="fas fa-chart-bar" style="color:var(--accent-purple);"></i> ویژگی‌های برتر
                </span>
                <span class="badge" id="featureCountBadge" style="font-size:0.5rem;padding:2px 8px;background:var(--bg-input);color:var(--text-muted);border:1px solid var(--border-color);">۰</span>
            </div>
            <div style="height:200px;position:relative;">
                <canvas id="featureMiniChart"></canvas>
            </div>
        </div>
    </div>

    <!-- ===== BOTTOM ROW ===== -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
        <!-- آخرین پیش‌بینی -->
        <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:12px 14px;border:1px solid var(--border-color);">
            <div style="font-size:0.55rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">
                <i class="fas fa-bullseye"></i> آخرین پیش‌بینی
            </div>
            <div style="font-size:0.9rem;font-weight:600;margin-top:4px;font-family:var(--font-mono);" id="lastPrediction">—</div>
            <div style="font-size:0.6rem;color:var(--text-muted);margin-top:2px;" id="lastPredictionTime">—</div>
        </div>

        <!-- اعتبار API -->
        <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:12px 14px;border:1px solid var(--border-color);">
            <div style="font-size:0.55rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">
                <i class="fas fa-coins"></i> اعتبار API
            </div>
            <div style="font-size:0.9rem;font-weight:600;margin-top:4px;font-family:var(--font-mono);" id="dashCredits">—</div>
            <div style="font-size:0.6rem;color:var(--text-muted);margin-top:2px;" id="dashCreditsStatus">—</div>
        </div>

        <!-- وضعیت دیتابیس‌ها -->
        <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:12px 14px;border:1px solid var(--border-color);">
            <div style="font-size:0.55rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">
                <i class="fas fa-database"></i> دیتابیس‌ها
            </div>
            <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;" id="dbStatusContainer">
                <span class="badge" style="font-size:0.55rem;background:var(--bg-input);color:var(--text-muted);border:1px solid var(--border-color);">🔄 در حال بارگذاری...</span>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// DASHBOARD TAB - کامل با نمودارهای Chart.js
// ============================================================

let performanceChart = null;
let featureMiniChart = null;
let dashboardInterval = null;
let isDashboardLoaded = false;

// ===== توابع اصلی =====
async function loadDashboardData() {
    try {
        const [status, performance, credits, dbHealth] = await Promise.all([
            api.getModelStatus(),
            api.getModelPerformance(),
            api.getCredits(),
            api.getDatabaseHealth()
        ]);

        updateStatusCards(status);
        updatePerformanceChart(performance);
        updateCredits(credits);
        updateDatabases(dbHealth);
        
        document.getElementById('lastUpdateTime').textContent = 
            '🕐 ' + new Date().toLocaleTimeString('fa-IR');

    } catch (error) {
        console.error('Dashboard error:', error);
    }
}

async function loadFeatureImportance() {
    try {
        const data = await api.getModelImportance();
        if (data.success && data.data && data.data.length > 0) {
            updateFeatureMiniChart(data.data);
        }
    } catch (err) {
        console.error('Feature importance error:', err);
    }
}

async function loadLastPrediction() {
    try {
        const data = await api.getPredictionHistory(1);
        if (data.success && data.data && data.data.length > 0) {
            const pred = data.data[0];
            const signal = pred.signal_type || 'NEUTRAL';
            const emojis = { BUY: '🟢 خرید', SELL: '🔴 فروش', NEUTRAL: '🟡 خنثی' };
            document.getElementById('lastPrediction').textContent = 
                `${pred.coin_name || pred.coin}: ${emojis[signal] || signal}`;
            document.getElementById('lastPredictionTime').textContent = 
                formatDate(pred.timestamp);
        } else {
            document.getElementById('lastPrediction').textContent = '—';
            document.getElementById('lastPredictionTime').textContent = 'هیچ پیش‌بینی ذخیره‌ای نیست';
        }
    } catch (err) {
        console.error('Last prediction error:', err);
    }
}

// ===== بروزرسانی کارت‌های وضعیت =====
function updateStatusCards(status) {
    if (!status.success) return;
    const data = status.data || {};
    
    const loaded = data.loaded || false;
    const isTraining = data.is_training || false;
    const accuracy = data.last_score || null;
    
    const statusEl = document.getElementById('dashStatus');
    if (isTraining) {
        statusEl.textContent = '⏳ در حال آموزش';
        statusEl.className = 'stat-value orange';
        statusEl.style.color = 'var(--accent-orange)';
    } else if (loaded) {
        statusEl.textContent = '✅ فعال';
        statusEl.className = 'stat-value green';
        statusEl.style.color = 'var(--accent-green)';
    } else {
        statusEl.textContent = '📦 دمو';
        statusEl.className = 'stat-value orange';
        statusEl.style.color = 'var(--accent-orange)';
    }
    
    document.getElementById('dashVersion').textContent = data.version || 'N/A';
    
    const accEl = document.getElementById('dashAccuracy');
    if (accuracy !== null && accuracy !== undefined) {
        accEl.textContent = (accuracy * 100).toFixed(1) + '%';
        accEl.style.color = accuracy > 0.6 ? 'var(--accent-green)' : 'var(--accent-orange)';
    } else {
        accEl.textContent = '—';
        accEl.style.color = 'var(--text-muted)';
    }
    
    document.getElementById('dashTrainings').textContent = data.total_trainings || 0;
}

// ===== نمودار عملکرد =====
function updatePerformanceChart(performance) {
    const ctx = document.getElementById('performanceChart');
    if (!ctx) return;
    
    if (performanceChart) {
        performanceChart.destroy();
        performanceChart = null;
    }
    
    const labels = performance.data?.labels || [];
    const accuracyData = performance.data?.accuracy || [];
    const versions = performance.data?.versions || [];
    
    if (labels.length === 0) {
        performanceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['بدون داده'],
                datasets: [{
                    label: 'دقت',
                    data: [0],
                    borderColor: '#00d4ff',
                    backgroundColor: 'rgba(0,212,255,0.08)',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { display: false } },
                    y: { grid: { display: false }, ticks: { display: false } }
                }
            }
        });
        return;
    }
    
    const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 200);
    gradient.addColorStop(0, 'rgba(0,212,255,0.3)');
    gradient.addColorStop(1, 'rgba(0,212,255,0.01)');
    
    performanceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'دقت (%)',
                data: accuracyData,
                borderColor: '#00d4ff',
                backgroundColor: gradient,
                borderWidth: 2.5,
                pointRadius: 3,
                pointBackgroundColor: '#00d4ff',
                pointBorderColor: '#fff',
                pointBorderWidth: 1,
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        afterLabel: function(context) {
                            const idx = context.dataIndex;
                            return versions[idx] ? 'نسخه: ' + versions[idx] : '';
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false },
                    ticks: { color: 'var(--text-muted)', font: { size: 8, family: 'inherit' }, maxTicksLimit: 10 }
                },
                y: {
                    min: 0,
                    max: 100,
                    grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false },
                    ticks: { color: 'var(--text-muted)', font: { size: 8, family: 'inherit' }, callback: function(v) { return v + '%'; } }
                }
            },
            interaction: { intersect: false, mode: 'index' }
        }
    });
}

// ===== نمودار ویژگی‌های برتر =====
function updateFeatureMiniChart(features) {
    const ctx = document.getElementById('featureMiniChart');
    if (!ctx) return;
    
    if (featureMiniChart) {
        featureMiniChart.destroy();
        featureMiniChart = null;
    }
    
    const top5 = features.slice(0, 5);
    const colors = ['#00d4ff', '#8b5cf6', '#ec4899', '#f59e0b', '#22d3ee'];
    
    document.getElementById('featureCountBadge').textContent = features.length;
    
    if (top5.length === 0) {
        featureMiniChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['بدون داده'],
                datasets: [{
                    data: [1],
                    backgroundColor: ['rgba(255,255,255,0.1)'],
                    borderColor: ['rgba(255,255,255,0.05)'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });
        return;
    }
    
    featureMiniChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: top5.map(f => f.feature),
            datasets: [{
                data: top5.map(f => f.importance),
                backgroundColor: colors.slice(0, top5.length),
                borderColor: 'var(--bg-input)',
                borderWidth: 2,
                hoverOffset: 8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        color: 'var(--text-secondary)',
                        font: { size: 7, family: 'inherit' },
                        boxWidth: 10,
                        padding: 4,
                        usePointStyle: true
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const total = context.dataset.data.reduce((a,b) => a + b, 0);
                            const percentage = ((context.parsed / total) * 100).toFixed(1);
                            return context.label + ': ' + percentage + '%';
                        }
                    }
                }
            }
        }
    });
}

// ===== بروزرسانی اعتبار API =====
function updateCredits(credits) {
    const remaining = credits.data?.remainingCredits || 0;
    
    document.getElementById('dashCredits').textContent = remaining.toLocaleString();
    
    const statusEl = document.getElementById('dashCreditsStatus');
    if (remaining > 100) {
        statusEl.textContent = '✅ به اندازه';
        statusEl.style.color = 'var(--accent-green)';
    } else if (remaining > 20) {
        statusEl.textContent = '⚠️ کم';
        statusEl.style.color = 'var(--accent-orange)';
    } else {
        statusEl.textContent = '🚨 بحرانی';
        statusEl.style.color = 'var(--accent-red)';
    }
}

// ===== بروزرسانی دیتابیس‌ها =====
function updateDatabases(dbHealth) {
    const container = document.getElementById('dbStatusContainer');
    if (!dbHealth.success) {
        container.innerHTML = '<span class="badge badge-red" style="font-size:0.55rem;">❌ خطا</span>';
        return;
    }
    
    const dbs = dbHealth.data || {};
    const icons = { postgresql: '🐘', redis: '⚡', sqlite: '📄' };
    const labels = { postgresql: 'PostgreSQL', redis: 'Redis', sqlite: 'SQLite' };
    
    let html = '';
    for (const [name, info] of Object.entries(dbs)) {
        const connected = info.connected || false;
        const icon = icons[name] || '📦';
        const label = labels[name] || name;
        html += `
            <span class="badge ${connected ? 'badge-green' : 'badge-red'}" style="font-size:0.55rem;padding:2px 8px;">
                ${connected ? '🟢' : '🔴'} ${label}
            </span>
        `;
    }
    
    container.innerHTML = html || '<span class="badge" style="font-size:0.55rem;">—</span>';
}

// ===== بارگذاری همه =====
async function loadAll() {
    await loadDashboardData();
    await loadFeatureImportance();
    await loadLastPrediction();
}

// ===== رفرش دستی =====
async function refreshDashboard() {
    showToast('🔄 بروزرسانی داشبورد...', 'info');
    await loadAll();
    showToast('✅ بروزرسانی شد', 'success');
}

// ===== مقداردهی اولیه =====
window.init_dashboard = function() {
    console.log('📊 Dashboard tab initializing...');
    
    if (isDashboardLoaded) return;
    isDashboardLoaded = true;
    
    loadAll();
    
    if (dashboardInterval) {
        clearInterval(dashboardInterval);
    }
    dashboardInterval = setInterval(loadAll, 15000);
};

// ===== پاکسازی =====
window.cleanup_dashboard = function() {
    if (dashboardInterval) {
        clearInterval(dashboardInterval);
        dashboardInterval = null;
    }
    if (performanceChart) {
        performanceChart.destroy();
        performanceChart = null;
    }
    if (featureMiniChart) {
        featureMiniChart.destroy();
        featureMiniChart = null;
    }
    isDashboardLoaded = false;
    console.log('🧹 Dashboard cleaned up');
};

console.log('✅ Dashboard tab loaded');
</script>
