<!-- ============================================================
     history.html - تب تاریخچه نسخه‌ها
     نسخه ۲.۰ - با CSS مشترک model-animations.css
     ============================================================ -->

<div class="card">
    <!-- ============================================================
         HEADER
         ============================================================ -->
    <div class="card-title">
        <i class="fas fa-history"></i>
        <span>تاریخچه نسخه‌ها</span>
        <span class="model-status-badge demo" id="historyCountBadge" style="margin-right:auto;">
            <span class="status-dot"></span>
            <span class="status-text" id="historyCountText">۰ نسخه</span>
        </span>
        <button class="btn btn-xs btn-outline" onclick="refreshHistory()" 
                style="padding:3px 10px;font-size:0.65rem;margin-right:6px;">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- ============================================================
         TOOLBAR
         ============================================================ -->
    <div class="analyzer-toolbar" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:10px 14px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;">
            <!-- Search -->
            <div style="position:relative;flex:1;min-width:150px;">
                <input type="text" id="historySearch" 
                       placeholder="جستجو در نسخه‌ها..." 
                       oninput="debouncedFilterHistory()"
                       style="width:100%;padding:7px 12px;padding-right:32px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.75rem;font-family:inherit;">
                <span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.7rem;pointer-events:none;">🔍</span>
            </div>
            
            <!-- Sort -->
            <select id="historySort" class="analyzer-filter" onchange="filterHistory()" 
                    style="padding:6px 10px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.7rem;font-family:inherit;cursor:pointer;">
                <option value="date_desc">جدیدترین</option>
                <option value="date_asc">قدیمی‌ترین</option>
                <option value="accuracy_desc">بیشترین دقت</option>
                <option value="accuracy_asc">کمترین دقت</option>
            </select>
            
            <!-- Limit -->
            <select id="historyLimit" class="analyzer-filter" onchange="loadHistory()" 
                    style="padding:6px 10px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.7rem;font-family:inherit;cursor:pointer;">
                <option value="10">۱۰ مورد</option>
                <option value="25" selected>۲۵ مورد</option>
                <option value="50">۵۰ مورد</option>
                <option value="100">۱۰۰ مورد</option>
            </select>
        </div>
        
        <!-- Export -->
        <div style="display:flex;gap:6px;">
            <button class="btn btn-xs btn-outline" onclick="exportHistoryCSV()" 
                    style="padding:3px 12px;font-size:0.65rem;">
                <i class="fas fa-file-csv"></i>
                <span style="margin-right:4px;">CSV</span>
            </button>
            <button class="btn btn-xs btn-outline" onclick="exportHistoryJSON()" 
                    style="padding:3px 12px;font-size:0.65rem;">
                <i class="fas fa-file-code"></i>
                <span style="margin-right:4px;">JSON</span>
            </button>
        </div>
    </div>

    <!-- ============================================================
         TABLE
         ============================================================ -->
    <div class="model-table-wrapper">
        <table class="model-table">
            <thead>
                <tr>
                    <th>نسخه</th>
                    <th>دقت</th>
                    <th>بازه</th>
                    <th>نمونه‌ها</th>
                    <th>تاریخ</th>
                    <th>وضعیت</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr class="skeleton-row">
                    <td><div class="model-skeleton-line long"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line long"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                </tr>
                <tr class="skeleton-row">
                    <td><div class="model-skeleton-line long"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line long"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                </tr>
                <tr class="skeleton-row">
                    <td><div class="model-skeleton-line long"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line long"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                    <td><div class="model-skeleton-line short"></div></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ============================================================
         PAGINATION
         ============================================================ -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px;">
        <span style="font-size:0.65rem;color:var(--text-muted);" id="historyPaginationInfo">نمایش ۰ از ۰</span>
        <div style="display:flex;gap:4px;">
            <button class="btn btn-xs btn-outline" onclick="prevPage()" id="historyPrevBtn" 
                    style="padding:3px 10px;font-size:0.7rem;" disabled>‹</button>
            <span style="font-size:0.7rem;color:var(--text-secondary);padding:0 12px;display:flex;align-items:center;" 
                  id="historyPageInfo">صفحه ۱ از ۱</span>
            <button class="btn btn-xs btn-outline" onclick="nextPage()" id="historyNextBtn" 
                    style="padding:3px 10px;font-size:0.7rem;" disabled>›</button>
        </div>
    </div>
</div>

<!-- ============================================================
     DETAIL MODAL
     ============================================================ -->
<div id="historyDetailModal" 
     style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:99999;justify-content:center;align-items:center;padding:20px;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:32px 36px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation: modelSlideUp 0.3s ease;">
        
        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="font-size:1rem;color:var(--text-primary);display:flex;align-items:center;gap:8px;">
                <i class="fas fa-file-alt" style="color:var(--accent-cyan);"></i>
                جزئیات نسخه
            </h3>
            <button onclick="closeDetailModal()" 
                    style="background:none;border:none;color:var(--text-muted);font-size:1.3rem;cursor:pointer;transition:var(--transition);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;">&times;</button>
        </div>
        
        <!-- Content -->
        <div id="detailContent" style="font-size:0.85rem;">
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);">
                <span style="color:var(--text-secondary);">نسخه</span>
                <span style="color:var(--text-primary);font-weight:600;font-family:'Courier New',monospace;" id="detailVersion">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);">
                <span style="color:var(--text-secondary);">دقت</span>
                <span style="color:var(--accent-cyan);font-weight:600;font-family:'Courier New',monospace;" id="detailAccuracy">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);">
                <span style="color:var(--text-secondary);">بازه زمانی</span>
                <span style="color:var(--text-primary);font-family:'Courier New',monospace;" id="detailPeriod">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);">
                <span style="color:var(--text-secondary);">تعداد نمونه‌ها</span>
                <span style="color:var(--text-primary);font-family:'Courier New',monospace;" id="detailSamples">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);">
                <span style="color:var(--text-secondary);">تاریخ ایجاد</span>
                <span style="color:var(--text-primary);font-family:'Courier New',monospace;" id="detailDate">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);">
                <span style="color:var(--text-secondary);">وضعیت</span>
                <span style="font-weight:600;font-family:'Courier New',monospace;" id="detailStatus">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;">
                <span style="color:var(--text-secondary);">ارزها</span>
                <span style="color:var(--text-primary);font-family:'Courier New',monospace;text-align:left;max-width:60%;word-break:break-word;" id="detailCoins">—</span>
            </div>
        </div>
        
        <!-- Actions -->
        <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;">
            <button class="btn btn-primary btn-xs" onclick="exportVersion()" 
                    style="padding:6px 16px;font-size:0.7rem;flex:1;min-width:100px;justify-content:center;">
                <i class="fas fa-download"></i>
                دانلود
            </button>
            <button class="btn btn-success btn-xs" onclick="activateVersion()" 
                    style="padding:6px 16px;font-size:0.7rem;flex:1;min-width:100px;justify-content:center;">
                <i class="fas fa-check-circle"></i>
                فعال‌سازی
            </button>
            <button class="btn btn-purple btn-xs" onclick="generateVersionReport()" 
                    style="padding:6px 16px;font-size:0.7rem;flex:1;min-width:100px;justify-content:center;background:linear-gradient(135deg,var(--accent-purple),var(--accent-blue));color:white;">
                <i class="fas fa-file-alt"></i>
                گزارش
            </button>
            <button class="btn btn-danger btn-xs" onclick="deleteVersion()" 
                    style="padding:6px 16px;font-size:0.7rem;flex:1;min-width:100px;justify-content:center;">
                <i class="fas fa-trash"></i>
                حذف
            </button>
        </div>
    </div>
</div>

<script>
// ============================================================
// HISTORY TAB v2.0
// ============================================================

// ===== State =====
let historyData = [];
let filteredData = [];
let currentPage = 1;
let pageSize = 25;
let selectedVersion = null;
let historyInterval = null;
let debounceTimer = null;
let isHistoryLoaded = false;

// ============================================================
// ۱. INITIALIZE / CLEANUP
// ============================================================

window.init_history = function() {
    console.log('📋 History tab initializing...');
    if (isHistoryLoaded) {
        console.log('⚠️ Already loaded, skipping');
        return;
    }
    isHistoryLoaded = true;
    loadHistory();
    
    // auto-refresh هر ۶۰ ثانیه
    if (historyInterval) clearInterval(historyInterval);
    historyInterval = setInterval(loadHistory, 60000);
};

window.cleanup_history = function() {
    console.log('🧹 History tab cleaning up...');
    isHistoryLoaded = false;
    
    if (historyInterval) {
        clearInterval(historyInterval);
        historyInterval = null;
    }
    if (debounceTimer) {
        clearTimeout(debounceTimer);
        debounceTimer = null;
    }
};

// ============================================================
// ۲. LOAD HISTORY
// ============================================================

async function loadHistory() {
    const tbody = document.getElementById('historyBody');
    const limit = parseInt(document.getElementById('historyLimit')?.value || 25);
    pageSize = limit;
    currentPage = 1;
    
    showSkeletonLoading(tbody);
    
    try {
        const data = await api.getModelHistory(100);
        
        if (data && data.success && data.data) {
            historyData = data.data;
            filteredData = [...historyData];
            
            // بروزرسانی شمارنده
            const countText = document.getElementById('historyCountText');
            if (countText) countText.textContent = `${historyData.length} نسخه`;
            
            renderHistory();
        } else {
            showEmptyState(tbody);
        }
    } catch (error) {
        console.error('❌ History error:', error);
        showErrorState(tbody, error.message);
    }
}

// ============================================================
// ۳. SKELETON / EMPTY / ERROR
// ============================================================

function showSkeletonLoading(tbody) {
    if (!tbody) return;
    tbody.innerHTML = Array(3).fill('').map(() => `
        <tr class="skeleton-row">
            <td><div class="model-skeleton-line long"></div></td>
            <td><div class="model-skeleton-line short"></div></td>
            <td><div class="model-skeleton-line short"></div></td>
            <td><div class="model-skeleton-line short"></div></td>
            <td><div class="model-skeleton-line long"></div></td>
            <td><div class="model-skeleton-line short"></div></td>
            <td><div class="model-skeleton-line short"></div></td>
        </tr>
    `).join('');
}

function showEmptyState(tbody) {
    tbody.innerHTML = `
        <tr>
            <td colspan="7" style="padding:0;">
                <div class="model-empty" style="padding:40px 20px;">
                    <span class="empty-icon">📭</span>
                    <div class="empty-title">هیچ نسخه‌ای یافت نشد</div>
                    <div class="empty-message">لطفاً ابتدا مدل را آموزش دهید</div>
                </div>
            </td>
        </tr>
    `;
}

function showErrorState(tbody, message) {
    tbody.innerHTML = `
        <tr>
            <td colspan="7" style="padding:0;">
                <div class="model-empty error" style="padding:40px 20px;">
                    <span class="empty-icon">⚠️</span>
                    <div class="empty-title">خطا در بارگذاری</div>
                    <div class="empty-message">${escapeHtml(message || 'خطای نامشخص')}</div>
                    <button class="empty-action" onclick="refreshHistory()">
                        <i class="fas fa-sync-alt"></i>
                        تلاش مجدد
                    </button>
                </div>
            </td>
        </tr>
    `;
}

// ============================================================
// ۴. RENDER HISTORY
// ============================================================

function renderHistory() {
    const tbody = document.getElementById('historyBody');
    if (!tbody) return;
    
    const start = (currentPage - 1) * pageSize;
    const end = Math.min(start + pageSize, filteredData.length);
    const pageData = filteredData.slice(start, end);
    
    // Pagination info
    const paginationInfo = document.getElementById('historyPaginationInfo');
    if (paginationInfo) {
        paginationInfo.textContent = `نمایش ${start + 1}-${end} از ${filteredData.length}`;
    }
    
    const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
    const pageInfo = document.getElementById('historyPageInfo');
    if (pageInfo) pageInfo.textContent = `صفحه ${currentPage} از ${totalPages}`;
    
    const prevBtn = document.getElementById('historyPrevBtn');
    const nextBtn = document.getElementById('historyNextBtn');
    if (prevBtn) prevBtn.disabled = currentPage <= 1;
    if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
    
    if (pageData.length === 0) {
        showEmptyState(tbody);
        return;
    }
    
    tbody.innerHTML = pageData.map((item, i) => {
        const accuracy = (item.accuracy || 0) * 100;
        const isActive = item.is_active || false;
        const isEnsemble = item.is_ensemble || false;
        const delay = Math.min(i * 0.03, 0.5);
        
        return `
            <tr style="animation: modelStaggerIn 0.3s ease backwards; animation-delay: ${delay}s; cursor:pointer;" 
                onclick="showDetail('${escapeAttr(item.version)}')">
                <td style="font-family:'Courier New',monospace;font-size:0.7rem;color:var(--text-primary);">
                    ${escapeHtml(item.version || 'N/A')}
                    ${isEnsemble ? ' <span class="model-status-badge demo" style="font-size:0.5rem;padding:1px 6px;display:inline-flex;"><span class="status-dot"></span><span class="status-text">Ensemble</span></span>' : ''}
                </td>
                <td style="font-family:'Courier New',monospace;font-size:0.7rem;color:${accuracy > 60 ? 'var(--accent-green)' : 'var(--accent-orange)'};">
                    ${accuracy.toFixed(2)}%
                </td>
                <td style="font-size:0.7rem;color:var(--text-secondary);">
                    ${escapeHtml(item.period || '—')}
                </td>
                <td style="font-size:0.7rem;color:var(--text-secondary);font-family:'Courier New',monospace;">
                    ${item.training_samples || 0}
                </td>
                <td style="font-size:0.65rem;color:var(--text-muted);font-family:'Courier New',monospace;">
                    ${formatDate(item.training_date) || '—'}
                </td>
                <td>
                    <span class="model-status-badge ${isActive ? 'active' : 'demo'}" style="font-size:0.55rem;padding:2px 8px;">
                        <span class="status-dot"></span>
                        <span class="status-text">${isActive ? 'فعال' : 'غیرفعال'}</span>
                    </span>
                </td>
                <td>
                    <div style="display:flex;gap:4px;flex-wrap:wrap;">
                        <button class="btn btn-xs btn-outline" 
                                onclick="event.stopPropagation();showDetail('${escapeAttr(item.version)}')" 
                                style="padding:3px 8px;font-size:0.6rem;" title="جزئیات">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-xs btn-outline" 
                                onclick="event.stopPropagation();exportVersion('${escapeAttr(item.version)}')" 
                                style="padding:3px 8px;font-size:0.6rem;" title="دانلود">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="btn btn-xs btn-outline" 
                                onclick="event.stopPropagation();generateVersionReport('${escapeAttr(item.version)}')" 
                                style="padding:3px 8px;font-size:0.6rem;color:var(--accent-purple);" title="گزارش">
                            <i class="fas fa-file-alt"></i>
                        </button>
                        ${!isActive ? `
                            <button class="btn btn-xs btn-outline" 
                                    onclick="event.stopPropagation();activateVersion('${escapeAttr(item.version)}')" 
                                    style="padding:3px 8px;font-size:0.6rem;color:var(--accent-green);" title="فعال‌سازی">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="btn btn-xs btn-outline" 
                                    onclick="event.stopPropagation();deleteVersion('${escapeAttr(item.version)}')" 
                                    style="padding:3px 8px;font-size:0.6rem;color:var(--accent-red);" title="حذف">
                                <i class="fas fa-trash"></i>
                            </button>
                        ` : ''}
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

// ============================================================
// ۵. FILTER
// ============================================================

function filterHistory() {
    const search = (document.getElementById('historySearch')?.value || '').toLowerCase().trim();
    const sort = document.getElementById('historySort')?.value || 'date_desc';
    
    filteredData = historyData.filter(item => {
        const version = (item.version || '').toLowerCase();
        const period = (item.period || '').toLowerCase();
        return version.includes(search) || period.includes(search);
    });
    
    // مرتب‌سازی
    const sortFns = {
        'date_desc': (a, b) => new Date(b.training_date) - new Date(a.training_date),
        'date_asc': (a, b) => new Date(a.training_date) - new Date(b.training_date),
        'accuracy_desc': (a, b) => (b.accuracy || 0) - (a.accuracy || 0),
        'accuracy_asc': (a, b) => (a.accuracy || 0) - (b.accuracy || 0),
    };
    
    if (sortFns[sort]) filteredData.sort(sortFns[sort]);
    
    currentPage = 1;
    renderHistory();
}

function debouncedFilterHistory() {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(filterHistory, 250);
}

function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        renderHistory();
    }
}

function nextPage() {
    const totalPages = Math.ceil(filteredData.length / pageSize);
    if (currentPage < totalPages) {
        currentPage++;
        renderHistory();
    }
}

// ============================================================
// ۶. DETAIL MODAL
// ============================================================

function showDetail(version) {
    const item = historyData.find(h => h.version === version);
    if (!item) return;
    
    selectedVersion = version;
    
    const setVal = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
    };
    
    setVal('detailVersion', item.version || 'N/A');
    setVal('detailAccuracy', ((item.accuracy || 0) * 100).toFixed(2) + '%');
    setVal('detailPeriod', item.period || '—');
    setVal('detailSamples', item.training_samples || 0);
    setVal('detailDate', formatDate(item.training_date) || '—');
    setVal('detailCoins', item.coins ? item.coins.join(', ') : '—');
    
    const statusEl = document.getElementById('detailStatus');
    if (statusEl) {
        statusEl.textContent = item.is_active ? '✅ فعال' : '📦 غیرفعال';
        statusEl.style.color = item.is_active ? 'var(--accent-green)' : 'var(--text-muted)';
    }
    
    const modal = document.getElementById('historyDetailModal');
    if (modal) modal.style.display = 'flex';
}

function closeDetailModal() {
    const modal = document.getElementById('historyDetailModal');
    if (modal) modal.style.display = 'none';
    selectedVersion = null;
}

// ============================================================
// ۷. VERSION ACTIONS
// ============================================================

async function activateVersion(version) {
    if (!version) version = selectedVersion;
    if (!version) return;
    
    if (!confirm(`⚠️ آیا از فعال‌سازی نسخه "${version}" اطمینان دارید؟`)) return;
    
    try {
        if (window.loadingSystem && typeof window.loadingSystem.show === 'function') {
            window.loadingSystem.show({
                messages: ['در حال فعال‌سازی نسخه...'],
                duration: 2000,
                onComplete: function() {
                    loadHistory();
                    closeDetailModal();
                }
            });
        }
        
        const result = await api.activateModel(version);
        
        if (!result || !result.success) {
            if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
                window.loadingSystem.hide();
            }
            if (typeof showToast === 'function') {
                showToast('❌ ' + (result?.message || 'خطا'), 'error');
            }
            return;
        }
        
        if (typeof showToast === 'function') {
            showToast('✅ نسخه ' + version + ' فعال شد', 'success');
        }
    } catch (error) {
        if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
            window.loadingSystem.hide();
        }
        if (typeof showToast === 'function') {
            showToast('❌ خطا: ' + error.message, 'error');
        }
    }
}

async function deleteVersion(version) {
    if (!version) version = selectedVersion;
    if (!version) return;
    
    if (!confirm(`⚠️ آیا از حذف نسخه "${version}" اطمینان دارید؟\nاین عمل غیرقابل بازگشت است!`)) return;
    
    try {
        if (window.loadingSystem && typeof window.loadingSystem.show === 'function') {
            window.loadingSystem.show({
                messages: ['در حال حذف نسخه...'],
                duration: 2000,
                onComplete: function() {
                    loadHistory();
                    closeDetailModal();
                }
            });
        }
        
        const result = await api.deleteModel(version);
        
        if (!result || !result.success) {
            if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
                window.loadingSystem.hide();
            }
            if (typeof showToast === 'function') {
                showToast('❌ ' + (result?.message || 'خطا'), 'error');
            }
            return;
        }
        
        if (typeof showToast === 'function') {
            showToast('🗑️ نسخه ' + version + ' حذف شد', 'success');
        }
    } catch (error) {
        if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
            window.loadingSystem.hide();
        }
        if (typeof showToast === 'function') {
            showToast('❌ خطا: ' + error.message, 'error');
        }
    }
}

function exportVersion(version) {
    if (!version) version = selectedVersion;
    if (!version) return;
    
    api.exportModel(version);
    if (typeof showToast === 'function') {
        showToast('📥 دانلود شروع شد', 'success');
    }
}

function generateVersionReport(version) {
    if (!version) version = selectedVersion;
    if (!version) {
        if (typeof showToast === 'function') {
            showToast('⚠️ نسخه‌ای انتخاب نشده است', 'warning');
        }
        return;
    }
    
    const url = `/report_template.html?version=${encodeURIComponent(version)}`;
    const newWindow = window.open(url, '_blank');
    
    if (!newWindow) {
        if (typeof showToast === 'function') {
            showToast('⚠️ لطفاً باز شدن پنجره جدید را مجاز کنید', 'warning');
        }
        return;
    }
    
    if (typeof showToast === 'function') {
        showToast(`📊 گزارش نسخه ${version} در تب جدید باز شد`, 'success');
    }
}

// ۸. EXPORT
// ============================================================

function exportHistoryCSV() {
    if (historyData.length === 0) {
        if (typeof showToast === 'function') showToast('⚠️ هیچ داده‌ای وجود ندارد', 'warning');
        return;
    }
    
    try {
        const headers = ['نسخه', 'دقت', 'بازه', 'نمونه‌ها', 'تاریخ', 'وضعیت'];
        const rows = historyData.map(item => [
            item.version || 'N/A',
            ((item.accuracy || 0) * 100).toFixed(2) + '%',
            item.period || '—',
            item.training_samples || 0,
            formatDate(item.training_date) || '',
            item.is_active ? 'فعال' : 'غیرفعال'
        ]);
        
        const csvContent = [
            headers.map(escapeCsv).join(','),
            ...rows.map(row => row.map(escapeCsv).join(','))
        ].join('\n');
        
        // BOM برای Excel
        const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `model_history_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        
        if (typeof showToast === 'function') showToast('📥 دانلود CSV شروع شد', 'success');
    } catch (err) {
        console.error('CSV error:', err);
        if (typeof showToast === 'function') showToast('❌ خطا در CSV', 'error');
    }
}

function exportHistoryJSON() {
    if (historyData.length === 0) {
        if (typeof showToast === 'function') showToast('⚠️ هیچ داده‌ای وجود ندارد', 'warning');

// ============================================================
// ۹. UTILS
// ============================================================

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function escapeCsv(value) {
    const str = String(value ?? '');
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
}
