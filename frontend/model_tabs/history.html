<!-- ============================================================
     HISTORY TAB - تاریخچه نسخه‌های مدل
     ============================================================ -->

<div class="card">
    <div class="card-title">
        <i class="fas fa-history"></i> تاریخچه نسخه‌ها
        <span class="badge-count" id="historyCount" style="margin-right:auto;font-size:0.6rem;color:var(--text-muted);">۰</span>
        <button class="btn btn-xs btn-outline" onclick="refreshHistory()" style="padding:2px 10px;font-size:0.6rem;">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- ===== TOOLBAR ===== -->
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:8px 12px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;">
            <input type="text" id="historySearch" placeholder="🔍 جستجو در نسخه‌ها..." onkeyup="filterHistory()" style="padding:4px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.7rem;font-family:inherit;min-width:150px;flex:1;">
            <select id="historySort" onchange="filterHistory()" style="padding:4px 8px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.65rem;font-family:inherit;">
                <option value="date_desc">جدیدترین</option>
                <option value="date_asc">قدیمی‌ترین</option>
                <option value="accuracy_desc">بیشترین دقت</option>
                <option value="accuracy_asc">کمترین دقت</option>
            </select>
            <select id="historyLimit" onchange="loadHistory()" style="padding:4px 8px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.65rem;font-family:inherit;">
                <option value="10">۱۰</option>
                <option value="25" selected>۲۵</option>
                <option value="50">۵۰</option>
                <option value="100">۱۰۰</option>
            </select>
        </div>
        <div style="display:flex;gap:6px;">
            <button class="btn btn-xs btn-outline" onclick="exportHistoryCSV()" style="padding:2px 10px;font-size:0.6rem;">
                <i class="fas fa-file-csv"></i> CSV
            </button>
            <button class="btn btn-xs btn-outline" onclick="exportHistoryJSON()" style="padding:2px 10px;font-size:0.6rem;">
                <i class="fas fa-file-code"></i> JSON
            </button>
        </div>
    </div>

    <!-- ===== TABLE ===== -->
    <div style="overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border-color);">
        <table style="width:100%;border-collapse:collapse;font-size:0.75rem;min-width:700px;">
            <thead>
                <tr>
                    <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-color);background:var(--bg-input);">نسخه</th>
                    <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-color);background:var(--bg-input);">دقت</th>
                    <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-color);background:var(--bg-input);">بازه</th>
                    <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-color);background:var(--bg-input);">نمونه‌ها</th>
                    <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-color);background:var(--bg-input);">تاریخ</th>
                    <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-color);background:var(--bg-input);">وضعیت</th>
                    <th style="text-align:right;padding:8px 12px;color:var(--text-secondary);font-weight:500;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border-color);background:var(--bg-input);">عملیات</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">
                    <span style="font-size:2rem;display:block;margin-bottom:8px;">📭</span>
                    در حال بارگذاری...
                </td></tr>
            </tbody>
        </table>
    </div>

    <!-- ===== PAGINATION ===== -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px;">
        <span style="font-size:0.65rem;color:var(--text-muted);" id="historyPaginationInfo">نمایش ۰ از ۰</span>
        <div style="display:flex;gap:4px;">
            <button class="btn btn-xs btn-outline" onclick="prevPage()" id="historyPrevBtn" style="padding:2px 10px;font-size:0.6rem;" disabled>‹</button>
            <span style="font-size:0.65rem;color:var(--text-secondary);padding:0 8px;display:flex;align-items:center;" id="historyPageInfo">صفحه ۱ از ۱</span>
            <button class="btn btn-xs btn-outline" onclick="nextPage()" id="historyNextBtn" style="padding:2px 10px;font-size:0.6rem;" disabled>›</button>
        </div>
    </div>
</div>

<!-- ===== DETAIL MODAL ===== -->
<div id="historyDetailModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:99999;justify-content:center;align-items:center;padding:20px;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:32px 36px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="font-size:1rem;color:var(--text-primary);">📋 جزئیات نسخه</h3>
            <button onclick="closeDetailModal()" style="background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;transition:var(--transition);">&times;</button>
        </div>
        <div id="detailContent" style="font-size:0.85rem;color:var(--text-secondary);">
            <div class="detail-row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                <span>نسخه</span>
                <span style="color:var(--text-primary);font-weight:600;" id="detailVersion">—</span>
            </div>
            <div class="detail-row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                <span>دقت</span>
                <span style="color:var(--accent-cyan);font-weight:600;" id="detailAccuracy">—</span>
            </div>
            <div class="detail-row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                <span>بازه زمانی</span>
                <span style="color:var(--text-primary);" id="detailPeriod">—</span>
            </div>
            <div class="detail-row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                <span>تعداد نمونه‌ها</span>
                <span style="color:var(--text-primary);" id="detailSamples">—</span>
            </div>
            <div class="detail-row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                <span>تاریخ ایجاد</span>
                <span style="color:var(--text-primary);" id="detailDate">—</span>
            </div>
            <div class="detail-row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                <span>وضعیت</span>
                <span style="font-weight:600;" id="detailStatus">—</span>
            </div>
            <div class="detail-row" style="display:flex;justify-content:space-between;padding:6px 0;">
                <span>ارزها</span>
                <span style="color:var(--text-primary);" id="detailCoins">—</span>
            </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="exportVersion()" style="padding:6px 16px;font-size:0.75rem;">
                <i class="fas fa-download"></i> دانلود
            </button>
            <button class="btn btn-success btn-sm" onclick="activateVersion()" style="padding:6px 16px;font-size:0.75rem;">
                <i class="fas fa-check-circle"></i> فعال‌سازی
            </button>
            <button class="btn btn-danger btn-sm" onclick="deleteVersion()" style="padding:6px 16px;font-size:0.75rem;">
                <i class="fas fa-trash"></i> حذف
            </button>
        </div>
    </div>
</div>

<script>
// ============================================================
// HISTORY TAB - تاریخچه نسخه‌های مدل
// ============================================================

let historyData = [];
let filteredData = [];
let currentPage = 1;
let pageSize = 25;
let selectedVersion = null;
let historyInterval = null;
let isHistoryLoaded = false;

// ===== بارگذاری تاریخچه =====
async function loadHistory() {
    const limit = parseInt(document.getElementById('historyLimit').value);
    pageSize = limit;
    currentPage = 1;

    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">
        <div class="loading-spinner" style="width:24px;height:24px;border:2px solid var(--border-color);border-top-color:var(--accent-cyan);border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;margin-bottom:8px;"></div>
        <br>در حال بارگذاری...
    </td></tr>`;

    try {
        const data = await api.getModelHistory(100);
        
        if (data.success && data.data) {
            historyData = data.data;
            filteredData = [...historyData];
            document.getElementById('historyCount').textContent = historyData.length;
            renderHistory();
        } else {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--accent-red);">❌ خطا در دریافت تاریخچه</td></tr>`;
        }
    } catch (error) {
        console.error('History error:', error);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--accent-red);">❌ خطا در ارتباط با سرور</td></tr>`;
    }
}

// ===== رندر تاریخچه =====
function renderHistory() {
    const tbody = document.getElementById('historyBody');
    const start = (currentPage - 1) * pageSize;
    const end = Math.min(start + pageSize, filteredData.length);
    const pageData = filteredData.slice(start, end);

    document.getElementById('historyPaginationInfo').textContent = 
        `نمایش ${start + 1}-${end} از ${filteredData.length}`;
    
    const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
    document.getElementById('historyPageInfo').textContent = `صفحه ${currentPage} از ${totalPages}`;
    document.getElementById('historyPrevBtn').disabled = currentPage <= 1;
    document.getElementById('historyNextBtn').disabled = currentPage >= totalPages;

    if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">
            <span style="font-size:2rem;display:block;margin-bottom:8px;">📭</span>
            هیچ نسخه‌ای یافت نشد
        </td></tr>`;
        return;
    }

    tbody.innerHTML = pageData.map(item => {
        const accuracy = (item.accuracy || 0) * 100;
        const isActive = item.is_active || false;
        const isEnsemble = item.is_ensemble || false;
        
        return `
            <tr style="cursor:pointer;transition:var(--transition);" onclick="showDetail('${item.version}')" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'">
                <td style="padding:8px 12px;border-bottom:1px solid var(--border-color);font-family:var(--font-mono);font-size:0.7rem;color:var(--text-primary);">
                    ${item.version || 'N/A'}
                    ${isEnsemble ? ' <span class="badge badge-purple" style="font-size:0.5rem;padding:1px 6px;">Ensemble</span>' : ''}
                </td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--border-color);font-family:var(--font-mono);font-size:0.7rem;color:${accuracy > 60 ? 'var(--accent-green)' : 'var(--accent-orange)'};">
                    ${accuracy.toFixed(2)}%
                </td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--border-color);font-size:0.7rem;color:var(--text-secondary);">
                    ${item.period || '—'}
                </td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--border-color);font-size:0.7rem;color:var(--text-secondary);">
                    ${item.training_samples || 0}
                </td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--border-color);font-size:0.65rem;color:var(--text-muted);">
                    ${formatDate(item.training_date)}
                </td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--border-color);">
                    <span class="badge ${isActive ? 'badge-green' : 'badge'}" style="padding:2px 10px;border-radius:20px;font-size:0.55rem;${!isActive ? 'background:var(--bg-input);color:var(--text-muted);border:1px solid var(--border-color);' : ''}">
                        ${isActive ? '✅ فعال' : '📦 غیرفعال'}
                    </span>
                </td>
                <td style="padding:8px 12px;border-bottom:1px solid var(--border-color);">
                    <div style="display:flex;gap:4px;">
                        <button class="btn btn-xs btn-outline" onclick="event.stopPropagation();showDetail('${item.version}')" style="padding:2px 8px;font-size:0.55rem;" title="جزئیات">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-xs btn-outline" onclick="event.stopPropagation();exportVersion('${item.version}')" style="padding:2px 8px;font-size:0.55rem;" title="دانلود">
                            <i class="fas fa-download"></i>
                        </button>
                        ${!isActive ? `<button class="btn btn-xs btn-success" onclick="event.stopPropagation();activateVersion('${item.version}')" style="padding:2px 8px;font-size:0.55rem;" title="فعال‌سازی">
                            <i class="fas fa-check"></i>
                        </button>` : ''}
                        ${!isActive ? `<button class="btn btn-xs btn-danger" onclick="event.stopPropagation();deleteVersion('${item.version}')" style="padding:2px 8px;font-size:0.55rem;" title="حذف">
                            <i class="fas fa-trash"></i>
                        </button>` : ''}
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

// ===== فیلتر و جستجو =====
function filterHistory() {
    const search = document.getElementById('historySearch').value.toLowerCase();
    const sort = document.getElementById('historySort').value;
    
    filteredData = historyData.filter(item => {
        const version = (item.version || '').toLowerCase();
        const period = (item.period || '').toLowerCase();
        return version.includes(search) || period.includes(search);
    });

    // مرتب‌سازی
    switch(sort) {
        case 'date_desc':
            filteredData.sort((a, b) => new Date(b.training_date) - new Date(a.training_date));
            break;
        case 'date_asc':
            filteredData.sort((a, b) => new Date(a.training_date) - new Date(b.training_date));
            break;
        case 'accuracy_desc':
            filteredData.sort((a, b) => (b.accuracy || 0) - (a.accuracy || 0));
            break;
        case 'accuracy_asc':
            filteredData.sort((a, b) => (a.accuracy || 0) - (b.accuracy || 0));
            break;
    }

    currentPage = 1;
    renderHistory();
}

// ===== صفحه‌بندی =====
function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        renderHistory();
    }
}

function nextPage() {
    const totalPages = Math.ceil(filteredData.length / pageSize);
    if (currentPage < totalPages) {
        currentPage++;
        renderHistory();
    }
}

// ===== نمایش جزئیات =====
function showDetail(version) {
    const item = historyData.find(h => h.version === version);
    if (!item) return;
    
    selectedVersion = version;
    document.getElementById('detailVersion').textContent = item.version || 'N/A';
    document.getElementById('detailAccuracy').textContent = ((item.accuracy || 0) * 100).toFixed(2) + '%';
    document.getElementById('detailPeriod').textContent = item.period || '—';
    document.getElementById('detailSamples').textContent = item.training_samples || 0;
    document.getElementById('detailDate').textContent = formatDate(item.training_date);
    document.getElementById('detailStatus').textContent = item.is_active ? '✅ فعال' : '📦 غیرفعال';
    document.getElementById('detailStatus').style.color = item.is_active ? 'var(--accent-green)' : 'var(--text-muted)';
    document.getElementById('detailCoins').textContent = item.coins ? item.coins.join(', ') : '—';
    
    document.getElementById('historyDetailModal').style.display = 'flex';
}

function closeDetailModal() {
    document.getElementById('historyDetailModal').style.display = 'none';
}

// ===== فعال‌سازی نسخه =====
async function activateVersion(version) {
    if (!version) version = selectedVersion;
    if (!version) return;
    if (!confirm(`⚠️ آیا از فعال‌سازی نسخه "${version}" اطمینان دارید؟`)) return;

    loading.show({
        messages: ['در حال فعال‌سازی نسخه...', 'پایان|نسخه فعال شد ✅'],
        duration: 3000,
        onComplete: function() {
            loadHistory();
            closeDetailModal();
        }
    });

    try {
        const result = await api.activateModel(version);
        if (!result.success) {
            loading.hide();
            showToast('❌ ' + (result.message || 'خطا'), 'error');
            return;
        }
        showToast('✅ نسخه ' + version + ' فعال شد', 'success');
    } catch (error) {
        loading.hide();
        showToast('❌ خطا: ' + error.message, 'error');
    }
}

// ===== حذف نسخه =====
async function deleteVersion(version) {
    if (!version) version = selectedVersion;
    if (!version) return;
    if (!confirm(`⚠️ آیا از حذف نسخه "${version}" اطمینان دارید؟\nاین عمل غیرقابل بازگشت است!`)) return;

    loading.show({
        messages: ['در حال حذف نسخه...', 'پایان|نسخه حذف شد 🗑️'],
        duration: 3000,
        onComplete: function() {
            loadHistory();
            closeDetailModal();
        }
    });

    try {
        const result = await api.deleteModel(version);
        if (!result.success) {
            loading.hide();
            showToast('❌ ' + (result.message || 'خطا'), 'error');
            return;
        }
        showToast('🗑️ نسخه ' + version + ' حذف شد', 'success');
    } catch (error) {
        loading.hide();
        showToast('❌ خطا: ' + error.message, 'error');
    }
}

// ===== خروجی گرفتن =====
function exportVersion(version) {
    if (!version) version = selectedVersion;
    if (!version) return;
    api.exportModel(version);
    showToast('📥 دانلود شروع شد', 'success');
}

// ===== خروجی CSV =====
function exportHistoryCSV() {
    if (historyData.length === 0) {
        showToast('⚠️ هیچ داده‌ای برای خروجی وجود ندارد', 'warning');
        return;
    }
    
    const headers = ['نسخه', 'دقت', 'بازه', 'نمونه‌ها', 'تاریخ', 'وضعیت'];
    const rows = historyData.map(item => [
        item.version || 'N/A',
        ((item.accuracy || 0) * 100).toFixed(2) + '%',
        item.period || '—',
        item.training_samples || 0,
        formatDate(item.training_date),
        item.is_active ? 'فعال' : 'غیرفعال'
    ]);
    
    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `model_history_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('📥 دانلود CSV شروع شد', 'success');
}

// ===== خروجی JSON =====
function exportHistoryJSON() {
    if (historyData.length === 0) {
        showToast('⚠️ هیچ داده‌ای برای خروجی وجود ندارد', 'warning');
        return;
    }
    
    const blob = new Blob([JSON.stringify(historyData, null, 2)], { type: 'application/json;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `model_history_${new Date().toISOString().slice(0,10)}.json`;
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('📥 دانلود JSON شروع شد', 'success');
}

// ===== رفرش دستی =====
function refreshHistory() {
    showToast('🔄 بروزرسانی...', 'info');
    loadHistory();
}

// ===== مقداردهی اولیه =====
window.init_history = function() {
    console.log('📋 History tab initializing...');
    
    if (isHistoryLoaded) return;
    isHistoryLoaded = true;
    
    loadHistory();
    
    if (historyInterval) {
        clearInterval(historyInterval);
    }
    historyInterval = setInterval(loadHistory, 60000);
};

// ===== پاکسازی =====
window.cleanup_history = function() {
    if (historyInterval) {
        clearInterval(historyInterval);
        historyInterval = null;
    }
    isHistoryLoaded = false;
    console.log('🧹 History tab cleaned up');
};

console.log('✅ History tab loaded');
</script>
