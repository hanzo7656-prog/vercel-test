<script>
// ============================================================
// MODEL SCHEDULE TAB v2.0
// ============================================================

let _scheduleInterval = null;
let _scheduleRefreshTimer = null;
let _scheduleInitialized = false;
let _scheduleData = null;
let _scheduleProgressInterval = null;

// ============================================================
// Init
// ============================================================

window.init_schedule = function() {
    console.log('⏰ Model schedule tab initializing...');

    if (_scheduleInitialized) return;
    _scheduleInitialized = true;

    loadScheduleStatus();

    // Auto-refresh status هر ۳۰ ثانیه
    if (_scheduleInterval) clearInterval(_scheduleInterval);
    _scheduleInterval = setInterval(() => {
        const activeTab = document.querySelector('#modelTabs .model-tab-btn.active');
        if (activeTab?.dataset.tab === 'schedule') {
            loadScheduleStatus();
        }
    }, 30000);

    // Progress bar animation (هر ۵ ثانیه)
    if (_scheduleProgressInterval) clearInterval(_scheduleProgressInterval);
    _scheduleProgressInterval = setInterval(() => {
        const activeTab = document.querySelector('#modelTabs .model-tab-btn.active');
        if (activeTab?.dataset.tab === 'schedule' && _scheduleData) {
            updateScheduleProgress();
        }
    }, 5000);
};

// ============================================================
// Cleanup
// ============================================================

window.cleanup_schedule = function() {
    console.log('🧹 Model schedule tab cleaning up...');

    if (_scheduleInterval) {
        clearInterval(_scheduleInterval);
        _scheduleInterval = null;
    }
    if (_scheduleRefreshTimer) {
        clearTimeout(_scheduleRefreshTimer);
        _scheduleRefreshTimer = null;
    }
    if (_scheduleProgressInterval) {
        clearInterval(_scheduleProgressInterval);
        _scheduleProgressInterval = null;
    }

    _scheduleInitialized = false;
    _scheduleData = null;
};

// ============================================================
// Load Status
// ============================================================

async function loadScheduleStatus() {
    try {
        // ✅ api.getScheduleStatus() (موجود در api.js)
        const data = await window.api?.getScheduleStatus?.();

        if (data?.success && data.data) {
            const s = data.data;
            _scheduleData = s;

            updateScheduleHero(s);
            updateScheduleStats(s);
            renderScheduleTimeline(s);

            // بارگذاری تاریخچه با تأخیر کوتاه
            if (_scheduleRefreshTimer) clearTimeout(_scheduleRefreshTimer);
            _scheduleRefreshTimer = setTimeout(() => loadScheduleHistory(), 500);
        }
    } catch (error) {
        console.warn('⚠️ Schedule status error:', error.message);
    }
}

// ============================================================
// Update Hero
// ============================================================

function updateScheduleHero(s) {
    const isRunning = s.is_running || false;
    const interval = s.interval_hours || 6;
    const lastTraining = s.last_training || null;
    const nextTraining = s.next_training || null;

    // badge
    const badge = document.getElementById('scheduleStatusBadge');
    if (badge) badge.textContent = isRunning ? 'فعال' : 'غیرفعال';

    // icon + label
    const icon = document.getElementById('scheduleStatusIcon');
    const label = document.getElementById('scheduleStatusLabel');
    if (icon) icon.textContent = isRunning ? '✅' : '⏹️';
    if (label) label.textContent = isRunning ? 'فعال' : 'غیرفعال';

    // دایره
    updateScheduleCircle(isRunning ? 100 : 30);

    // interval
    const heroInterval = document.getElementById('heroInterval');
    if (heroInterval) heroInterval.textContent = interval + ' ساعت';

    // last run
    const heroLast = document.getElementById('heroLastRun');
    if (heroLast) {
        heroLast.textContent = lastTraining
            ? ((typeof formatTimeAgo === 'function') ? formatTimeAgo(new Date(lastTraining)) : formatDate(lastTraining))
            : '—';
    }

    // next run
    const heroNext = document.getElementById('heroNextRun');
    if (heroNext) {
        heroNext.textContent = nextTraining
            ? ((typeof formatTimeAgo === 'function') ? formatTimeAgo(new Date(nextTraining)) : formatDate(nextTraining))
            : '—';
    }

    // toggle buttons
    const startBtn = document.getElementById('startScheduleBtn');
    const stopBtn = document.getElementById('stopScheduleBtn');
    if (startBtn) startBtn.style.display = isRunning ? 'none' : 'flex';
    if (stopBtn) stopBtn.style.display = isRunning ? 'flex' : 'none';

    // select interval
    const intervalSelect = document.getElementById('scheduleInterval');
    if (intervalSelect) intervalSelect.value = interval;

    // select period
    const periodSelect = document.getElementById('schedulePeriod');
    if (periodSelect && s.period) periodSelect.value = s.period;

    // subtitle
    const subtitle = document.getElementById('scheduleSubtitle');
    if (subtitle) {
        subtitle.textContent = isRunning
            ? `آموزش خودکار هر ${interval} ساعت فعال است`
            : 'آموزش خودکار مدل در بازه‌های زمانی مشخص';
    }
}

// ============================================================
// Update Circle
// ============================================================

function updateScheduleCircle(percent) {
    const circle = document.getElementById('scheduleCircle');
    if (!circle) return;

    const circumference = 2 * Math.PI * 65;
    const offset = circumference - (percent / 100) * circumference;

    circle.style.strokeDasharray = circumference;
    circle.style.strokeDashoffset = circumference;
    circle.style.transition = 'none';

    void circle.offsetWidth;

    circle.style.transition = 'stroke-dashoffset 1.5s var(--ease-out)';
    circle.style.strokeDashoffset = offset;
}

// ============================================================
// Update Stats
// ============================================================

function updateScheduleStats(s) {
    const successCount = s.success_count || 0;
    const errorCount = s.error_count || 0;
    const totalCount = s.total_executions || (successCount + errorCount);
    const rate = totalCount > 0 ? Math.round((successCount / totalCount) * 100) : 0;

    animateScheduleNumber('statSuccess', successCount);
    animateScheduleNumber('statErrors', errorCount);
    animateScheduleNumber('statTotal', totalCount);
    animateScheduleNumber('statRate', rate, 1200, 0, '٪');
}

// ============================================================
// Animate Number
// ============================================================

function animateScheduleNumber(id, target, duration = 1000, decimals = 0, suffix = '') {
    const el = document.getElementById(id);
    if (!el) return;

    if (!target && target !== 0) {
        el.textContent = '0' + suffix;
        return;
    }

    const startTime = performance.now();

    function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        const current = target * eased;

        el.textContent = current.toFixed(decimals) + suffix;

        if (progress < 1) requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
}

// ============================================================
// Render Timeline
// ============================================================

function renderScheduleTimeline(s) {
    const track = document.getElementById('timelineTrack');
    if (!track) return;

    const isRunning = s.is_running || false;
    const intervalHours = s.interval_hours || 6;
    const nextTraining = s.next_training;

    if (!isRunning || !nextTraining) {
        track.innerHTML = `
            <div class="timeline-loading">
                <span style="font-size:var(--fs-sm);color:var(--text-muted);">
                    زمان‌بندی فعال نیست
                </span>
            </div>
        `;

        const nextInfo = document.getElementById('nextRunInfo');
        if (nextInfo) nextInfo.style.display = 'none';

        return;
    }

    // محاسبه نقاط زمانی
    const now = Date.now();
    const next = new Date(nextTraining).getTime();
    const interval = intervalHours * 60 * 60 * 1000;
    const totalDuration = 24 * 60 * 60 * 1000; // 24h
    const startTime = now;

    const points = [];

    // نقطه فعلی
    points.push({
        time: now,
        label: 'الان',
        type: 'current',
        percent: 0,
    });

    // نقاط بعدی
    let cursor = next;
    let idx = 1;

    while (cursor <= startTime + totalDuration && idx < 10) {
        const percent = ((cursor - startTime) / totalDuration) * 100;

        if (percent > 3 && percent < 100) {
            const hoursFromNow = Math.round((cursor - now) / (1000 * 60 * 60));
            points.push({
                time: cursor,
                label: `${hoursFromNow}h`,
                type: idx === 1 ? 'next' : 'future',
                percent,
                isNext: idx === 1,
            });
        }

        cursor += interval;
        idx++;
    }

    track.innerHTML = points.map((p, i) => `
        <div class="timeline-point ${p.type}"
             style="left:${p.percent}%; animation-delay:${i * 0.08}s;"
             title="${new Date(p.time).toLocaleString('fa-IR')}">
            <span class="point-label">${p.label}</span>
            <span class="point-dot"></span>
        </div>
    `).join('');

    // Next Run Info
    const nextInfo = document.getElementById('nextRunInfo');
    const nextValue = document.getElementById('nextRunValue');
    const nextShort = document.getElementById('nextRunShort');

    if (nextInfo) nextInfo.style.display = 'block';
    if (nextValue) nextValue.textContent = formatDate(nextTraining) || '—';
    if (nextShort) {
        nextShort.textContent = new Date(nextTraining).toLocaleTimeString('fa-IR', {
            hour: '2-digit',
            minute: '2-digit',
        });
    }

    // Progress bar
    updateScheduleProgress();
}

// ============================================================
// Update Progress
// ============================================================

function updateScheduleProgress() {
    const progressEl = document.getElementById('nextRunProgress');
    if (!progressEl || !_scheduleData) return;

    const s = _scheduleData;
    const now = Date.now();
    const next = s.next_training ? new Date(s.next_training).getTime() : null;
    const intervalHours = s.interval_hours || 6;

    if (!next) {
        progressEl.style.width = '0%';
        return;
    }

    const last = s.last_training
        ? new Date(s.last_training).getTime()
        : (next - intervalHours * 60 * 60 * 1000);

    const elapsed = now - last;
    const total = next - last;
    const percent = Math.min(Math.max((elapsed / total) * 100, 0), 100);

    progressEl.style.width = percent + '%';
}

// ============================================================
// Load History
// ============================================================

async function loadScheduleHistory() {
    try {
        // ✅ api.getModelHistory() (موجود در api.js)
        const data = await window.api?.getModelHistory?.(10);

        const container = document.getElementById('scheduleHistory');
        const countEl = document.getElementById('historyCount');

        if (!container) return;

        if (data?.success && data.data && data.data.length > 0) {
            if (countEl) {
                const span = countEl.querySelector('span');
                if (span) span.textContent = data.data.length;
            }

            container.innerHTML = data.data.map((item, i) => {
                const isActive = item.is_active || false;
                const accuracy = ((item.accuracy || 0) * 100).toFixed(1);
                const version = item.version || 'N/A';
                const date = formatDate(item.training_date) || '—';

                return `
                    <div class="history-item-model" style="animation-delay:${i * 0.05}s;">
                        <div class="history-version">
                            ${isActive ? '✅' : '📦'}
                            <span>${escapeScheduleHtml(version)}</span>
                            ${isActive ? '<span class="history-status-badge">فعال</span>' : ''}
                        </div>
                        <span class="history-accuracy">${accuracy}%</span>
                        <span class="history-date">${escapeScheduleHtml(date)}</span>
                    </div>
                `;
            }).join('');
        } else {
            if (countEl) {
                const span = countEl.querySelector('span');
                if (span) span.textContent = '۰';
            }

            container.innerHTML = `
                <div class="empty-state-model" style="padding:var(--space-8) var(--space-5);">
                    <span class="empty-icon" style="font-size:2rem;">📭</span>
                    <div class="empty-title" style="font-size:var(--fs-sm);">هیچ اجرایی ثبت نشده</div>
                    <div class="empty-message" style="font-size:var(--fs-xs);">با فعال‌سازی زمان‌بندی، اجراها اینجا نمایش داده می‌شوند</div>
                </div>
            `;
        }
    } catch (error) {
        console.warn('⚠️ History error:', error.message);
    }
}

// ============================================================
// Toggle Schedule
// ============================================================

async function toggleSchedule(enabled) {
    const interval = parseInt(document.getElementById('scheduleInterval')?.value || 6);
    const period = document.getElementById('schedulePeriod')?.value || '1m';
    const incremental = document.getElementById('scheduleIncremental')?.checked ?? true;

    if (enabled && !confirm(`فعال‌سازی زمان‌بندی هر ${interval} ساعت؟`)) return;
    if (!enabled && !confirm('غیرفعال‌سازی زمان‌بندی؟')) return;

    try {
        if (enabled) {
            // ✅ api.startSchedule() (موجود در api.js)
            const result = await window.api?.startSchedule?.({
                interval,
                period,
                incremental,
            });

            if (!result?.success) {
                if (typeof showToast === 'function') {
                    showToast('❌ ' + (result?.message || 'خطا'), 'error');
                }
                return;
            }

            if (typeof showToast === 'function') {
                showToast(`✅ زمان‌بندی هر ${interval} ساعت فعال شد`, 'success');
            }
        } else {
            // ✅ api.stopSchedule() (موجود در api.js)
            const result = await window.api?.stopSchedule?.();

            if (!result?.success) {
                if (typeof showToast === 'function') {
                    showToast('❌ ' + (result?.message || 'خطا'), 'error');
                }
                return;
            }

            if (typeof showToast === 'function') {
                showToast('⏹️ زمان‌بندی غیرفعال شد', 'warning');
            }
        }

        setTimeout(loadScheduleStatus, 500);

    } catch (error) {
        if (typeof showToast === 'function') {
            showToast('❌ خطا: ' + error.message, 'error');
        }
    }
}

// ============================================================
// Run Now
// ============================================================

async function runScheduleNow() {
    if (!confirm('اجرای فوری آموزش؟')) return;

    const period = document.getElementById('schedulePeriod')?.value || '1m';
    const incremental = document.getElementById('scheduleIncremental')?.checked ?? true;

    if (window.loadingSystem?.show) {
        window.loadingSystem.show({
            messages: [
                'اجرای فوری آموزش...|لطفاً صبر کنید',
                'در حال پردازش داده‌ها...',
                'تقریباً تمام است...',
            ],
            duration: 20000,
            onComplete: function() {
                loadScheduleStatus();
            },
        });
    }

    try {
        // ✅ api.trainModel() (موجود در api.js)
        const result = await window.api?.trainModel?.({
            period,
            coins: ['bitcoin', 'ethereum'],
            incremental,
        });

        if (!result?.success) {
            if (window.loadingSystem?.hide) window.loadingSystem.hide();
            if (typeof showToast === 'function') {
                showToast('❌ ' + (result?.message || 'خطا'), 'error');
            }
            return;
        }

        if (typeof showToast === 'function') {
            showToast('✅ آموزش فوری شروع شد', 'success');
        }
    } catch (error) {
        if (window.loadingSystem?.hide) window.loadingSystem.hide();
        if (typeof showToast === 'function') {
            showToast('❌ خطا: ' + error.message, 'error');
        }
    }
}

// ============================================================
// Helpers
// ============================================================

function escapeScheduleHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
