<!-- ============================================================
     schedule.html - تب زمان‌بندی آموزش خودکار
     نسخه ۳.۰ - طراحی جدید + Timeline + Status Cards
     ============================================================ -->

<!-- ============================================================
     HERO SECTION
     ============================================================ -->
<div class="hero-card" id="scheduleHero">
    
    <div class="health-circle-wrapper">
        <svg class="health-circle" viewBox="0 0 140 140">
            <circle class="circle-bg" cx="70" cy="70" r="65"/>
            <circle class="circle-fill" cx="70" cy="70" r="65" id="scheduleCircle"/>
        </svg>
        <div class="health-score-value">
            <span class="health-score-number" id="scheduleStatusIcon">⏹️</span>
            <span class="health-score-label" id="scheduleStatusLabel">غیرفعال</span>
        </div>
    </div>

    <div class="hero-info">
        <h2 class="hero-title">
            <i class="fas fa-clock" style="color:var(--cyan-primary);"></i>
            <span>زمان‌بندی آموزش خودکار</span>
            <span class="badge-version" id="scheduleStatusBadge">غیرفعال</span>
        </h2>
        <p class="hero-subtitle" id="scheduleSubtitle">
            آموزش خودکار مدل در بازه‌های زمانی مشخص
        </p>
        <div class="hero-metrics">
            <div class="hero-metric">
                <span class="hero-metric-label">فاصله</span>
                <span class="hero-metric-value cyan" id="heroInterval">—</span>
            </div>
            <div class="hero-metric">
                <span class="hero-metric-label">آخرین اجرا</span>
                <span class="hero-metric-value" id="heroLastRun">—</span>
            </div>
            <div class="hero-metric">
                <span class="hero-metric-label">اجرای بعدی</span>
                <span class="hero-metric-value green" id="heroNextRun">—</span>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================
     STATS ROW
     ============================================================ -->
<div class="stats-row">
    <div class="stat-card-model">
        <span class="stat-icon">✅</span>
        <div class="stat-label">موفق</div>
        <div class="stat-value green" id="statSuccess">۰</div>
    </div>
    <div class="stat-card-model">
        <span class="stat-icon">❌</span>
        <div class="stat-label">خطا</div>
        <div class="stat-value orange" id="statErrors">۰</div>
    </div>
    <div class="stat-card-model">
        <span class="stat-icon">📊</span>
        <div class="stat-label">مجموع اجراها</div>
        <div class="stat-value cyan" id="statTotal">۰</div>
    </div>
    <div class="stat-card-model">
        <span class="stat-icon">📈</span>
        <div class="stat-label">نرخ موفقیت</div>
        <div class="stat-value purple" id="statRate">۰٪</div>
    </div>
</div>

<!-- ============================================================
     CONTROLS
     ============================================================ -->
<div class="live-row">
    
    <!-- تنظیمات -->
    <div class="card-section">
        <div class="section-header-model">
            <div class="section-title-model">
                <i class="fas fa-sliders-h"></i>
                <span>تنظیمات زمان‌بندی</span>
            </div>
            <span class="section-badge-model">
                <i class="fas fa-cog"></i>
                پیکربندی
            </span>
        </div>
        
        <div class="training-controls">
            <div class="control-item">
                <label class="control-label">
                    <i class="fas fa-hourglass-half"></i>
                    فاصله زمانی
                </label>
                <select id="scheduleInterval" class="control-select">
                    <option value="1">۱ ساعت</option>
                    <option value="3">۳ ساعت</option>
                    <option value="6" selected>۶ ساعت</option>
                    <option value="12">۱۲ ساعت</option>
                    <option value="24">۲۴ ساعت</option>
                </select>
            </div>
            
            <div class="control-item">
                <label class="control-label">
                    <i class="fas fa-calendar"></i>
                    بازه داده‌ها
                </label>
                <select id="schedulePeriod" class="control-select">
                    <option value="24h">۲۴ ساعت</option>
                    <option value="1w">۱ هفته</option>
                    <option value="1m" selected>۱ ماه</option>
                    <option value="3m">۳ ماه</option>
                </select>
            </div>
            
            <div class="control-item">
                <label class="control-label">
                    <i class="fas fa-sync-alt"></i>
                    حالت
                </label>
                <label class="toggle-switch">
                    <input type="checkbox" id="scheduleIncremental" checked>
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">افزایشی</span>
                </label>
            </div>
        </div>
        
        <!-- Actions -->
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
            <button class="btn-model btn-primary btn-lg" id="startScheduleBtn" onclick="toggleSchedule(true)">
                <i class="fas fa-play-circle"></i>
                فعال‌سازی زمان‌بندی
            </button>
            <button class="btn-model btn-danger btn-lg" id="stopScheduleBtn" onclick="toggleSchedule(false)" style="display:none;">
                <i class="fas fa-stop-circle"></i>
                غیرفعال‌سازی
            </button>
            <button class="btn-model btn-cyan btn-sm" onclick="runNow()">
                <i class="fas fa-bolt"></i>
                اجرای فوری
            </button>
        </div>
    </div>

    <!-- Timeline -->
    <div class="card-section">
        <div class="section-header-model">
            <div class="section-title-model">
                <i class="fas fa-stream"></i>
                <span>Timeline ۲۴ ساعت آینده</span>
            </div>
            <span class="section-badge-model">

                بعدی: <span id="nextRunShort">—</span>
            </span>
        </div>
        
        <div class="timeline-container">
            <div class="timeline-track" id="timelineTrack">

                    <div class="skeleton-model skeleton-lg" style="width:100%;height:60px;border-radius:var(--radius-sm);"></div>
                </div>
            </div>
            
            <div class="timeline-labels">
                <span>الان</span>

                <span>+۱۲h</span>
                <span>+۱۸h</span>
                <span>+۲۴h</span>
            </div>
        </div>
        
        <!-- Next Run Info -->
        <div class="next-run-info" id="nextRunInfo" style="display:none;">
            <div class="next-run-item">
                <span class="next-run-label">اجرای بعدی</span>
                <span class="next-run-value" id="nextRunValue">—</span>
            </div>
            <div class="next-run-progress">
                <div class="progress-model">
                    <div class="progress-fill" id="nextRunProgress" style="width:0%;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================
     HISTORY
     ============================================================ -->

    <div class="section-header-model">
        <div class="section-title-model">
            <i class="fas fa-history"></i>

<script>
// ============================================================
// SCHEDULE TAB v3.0
// ============================================================

let scheduleInterval = null;
let isScheduleLoaded = false;
let currentScheduleData = null;
let scheduleRefreshTimer = null;

// ============================================================
// ۱. INITIALIZE / CLEANUP
// ============================================================

window.init_schedule = function() {
    console.log('⏰ Schedule tab initializing...');
    if (isScheduleLoaded) return;
    isScheduleLoaded = true;
    
    loadScheduleStatus();
    
    if (scheduleInterval) clearInterval(scheduleInterval);
    scheduleInterval = setInterval(loadScheduleStatus, 30000);
};

window.cleanup_schedule = function() {
    console.log('🧹 Schedule tab cleaning up...');
    isScheduleLoaded = false;
    
    if (scheduleInterval) {
        clearInterval(scheduleInterval);
        scheduleInterval = null;
    }
    if (scheduleRefreshTimer) {
        clearTimeout(scheduleRefreshTimer);
        scheduleRefreshTimer = null;
    }
};

// ============================================================
// ۲. LOAD STATUS
// ============================================================

async function loadScheduleStatus() {
    try {
        const data = await api.getScheduleStatus();
        
        if (data && data.success && data.data) {
            const s = data.data;
            currentScheduleData = s;
            
            updateHeroSection(s);
            updateStats(s);
            renderTimeline(s);
            
            // بعد از ۱ ثانیه، تاریخچه رو لود کن
            if (scheduleRefreshTimer) clearTimeout(scheduleRefreshTimer);
            scheduleRefreshTimer = setTimeout(() => loadScheduleHistory(), 500);
        }
        
    } catch (error) {
        console.warn('⚠️ Schedule status error:', error.message);
    }
}

// ============================================================
// ۳. UPDATE HERO
// ============================================================

function updateHeroSection(s) {
    const isRunning = s.is_running || false;
    const interval = s.interval_hours || 6;
    const lastTraining = s.last_training || null;
    const nextTraining = s.next_training || null;
    
    // badge
    const badge = document.getElementById('scheduleStatusBadge');
    if (badge) badge.textContent = isRunning ? 'فعال' : 'غیرفعال';
    
    // icon + label
    const icon = document.getElementById('scheduleStatusIcon');
    const label = document.getElementById('scheduleStatusLabel');
    if (icon) icon.textContent = isRunning ? '✅' : '⏹️';
    if (label) label.textContent = isRunning ? 'فعال' : 'غیرفعال';
    
    // دایره - انیمیشن
    updateCircle(isRunning ? 100 : 30);
    
    // interval
    const heroInterval = document.getElementById('heroInterval');
    if (heroInterval) heroInterval.textContent = interval + ' ساعت';
    
    // last run
    const heroLast = document.getElementById('heroLastRun');
    if (heroLast) {
        heroLast.textContent = lastTraining 
            ? (typeof formatTimeAgo === 'function' ? formatTimeAgo(new Date(lastTraining)) : formatDate(lastTraining))
            : '—';
    }
    
    // next run
    const heroNext = document.getElementById('heroNextRun');
    if (heroNext) {
        heroNext.textContent = nextTraining 
            ? (typeof formatTimeAgo === 'function' ? formatTimeAgo(new Date(nextTraining)) : formatDate(nextTraining))
            : '—';
    }
    
    // toggle buttons
    const startBtn = document.getElementById('startScheduleBtn');
    const stopBtn = document.getElementById('stopScheduleBtn');
    if (startBtn) startBtn.style.display = isRunning ? 'none' : 'flex';
    if (stopBtn) stopBtn.style.display = isRunning ? 'flex' : 'none';
    
    // select interval
    const intervalSelect = document.getElementById('scheduleInterval');
    if (intervalSelect) intervalSelect.value = interval;
}

// ============================================================
// ۴. UPDATE CIRCLE
// ============================================================

function updateCircle(percent) {
    const circle = document.getElementById('scheduleCircle');
    if (!circle) return;
    
    const circumference = 2 * Math.PI * 65;
    const offset = circumference - (percent / 100) * circumference;
    
    circle.style.strokeDasharray = circumference;
    circle.style.strokeDashoffset = circumference;
    circle.style.transition = 'none';
    
    void circle.offsetWidth;
    
    circle.style.transition = 'stroke-dashoffset 1.5s cubic-bezier(0.22, 1, 0.36, 1)';
    circle.style.strokeDashoffset = offset;
}

// ============================================================
// ۵. UPDATE STATS
// ============================================================

function updateStats(s) {
    const successCount = s.success_count || 0;
    const errorCount = s.error_count || 0;
    const totalCount = s.total_executions || (successCount + errorCount);
    const rate = totalCount > 0 ? Math.round((successCount / totalCount) * 100) : 0;
    
    animateNumber('statSuccess', successCount);
    animateNumber('statErrors', errorCount);
    animateNumber('statTotal', totalCount);
    animateNumber('statRate', rate, 1200, 0, '٪');
}

// ============================================================
// ۶. RENDER TIMELINE
// ============================================================

function renderTimeline(s) {
    const track = document.getElementById('timelineTrack');
    if (!track) return;
    
    const isRunning = s.is_running || false;
    const intervalHours = s.interval_hours || 6;
    const nextTraining = s.next_training;
    
    if (!isRunning || !nextTraining) {
        track.innerHTML = `
            <div class="timeline-loading">
                <span style="font-size:0.75rem;color:var(--text-muted);">
                    زمان‌بندی فعال نیست
                </span>
            </div>
        `;
        return;
    }
    
    // محاسبه نقاط زمانی
    const now = Date.now();
    const next = new Date(nextTraining).getTime();
    const interval = intervalHours * 60 * 60 * 1000;
    
    const points = [];
    const totalDuration = 24 * 60 * 60 * 1000; // 24h
    const startTime = now;
    
    // نقطه فعلی
    points.push({
        time: now,
        label: 'الان',
        type: 'current',
        percent: 0
    });
    
    // نقاط بعدی
    let cursor = next;
    let idx = 1;
    while (cursor <= startTime + totalDuration && idx < 8) {
        const percent = ((cursor - startTime) / totalDuration) * 100;
        if (percent > 5 && percent < 100) {
            const hoursFromNow = Math.round((cursor - now) / (1000 * 60 * 60));
            points.push({
                time: cursor,
                label: `${hoursFromNow}h`,
                type: idx === 1 ? 'next' : 'future',
                percent,
                isNext: idx === 1
            });
        }
        cursor += interval;
        idx++;
    }
    
    track.innerHTML = points.map((p, i) => `
        <div class="timeline-point ${p.type}" 
             style="left:${p.percent}%; animation-delay:${i * 0.08}s;"
             title="${new Date(p.time).toLocaleString('fa-IR')}">
            <span class="point-label">${p.label}</span>
            <span class="point-dot"></span>
        </div>
    `).join('');
    
    // Next Run Info
    const nextInfo = document.getElementById('nextRunInfo');
    const nextValue = document.getElementById('nextRunValue');
    const nextShort = document.getElementById('nextRunShort');
    const nextProgress = document.getElementById('nextRunProgress');
    
    if (nextInfo) nextInfo.style.display = 'block';
    if (nextValue) nextValue.textContent = formatDate(nextTraining) || '—';
    if (nextShort) nextShort.textContent = new Date(nextTraining).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    
    if (nextProgress) {
        // محاسبه درصد: چقدر از فاصله بین آخرین اجرا تا اجرای بعدی گذشته
        const last = s.last_training ? new Date(s.last_training).getTime() : (next - interval);
        const elapsed = now - last;
        const total = next - last;
        const percent = Math.min(Math.max((elapsed / total) * 100, 0), 100);
        
        setTimeout(() => {
            nextProgress.style.width = percent + '%';
        }, 300);
    }
}

// ============================================================
// ۷. LOAD HISTORY
// ============================================================

async function loadScheduleHistory() {
    try {
        const data = await api.getModelHistory(10);
        const container = document.getElementById('scheduleHistory');
        const countEl = document.getElementById('historyCount');
        
        if (!container) return;
        
        if (data && data.success && data.data && data.data.length > 0) {
            if (countEl) {
                const span = countEl.querySelector('span');
                if (span) span.textContent = data.data.length;
            }
            
            container.innerHTML = data.data.map((item, i) => {
                const isActive = item.is_active || false;
                const accuracy = ((item.accuracy || 0) * 100).toFixed(1);
                const version = item.version || 'N/A';
                const date = formatDate(item.training_date) || '—';
                
                return `
                    <div class="history-item-model" style="animation-delay:${i * 0.05}s;">
                        <div class="history-version">
                            ${isActive ? '✅' : '📦'}
                            <span>${escapeHtml(version)}</span>
                            ${isActive ? '<span class="history-status-badge">فعال</span>' : ''}
                        </div>
                        <span class="history-accuracy">${accuracy}%</span>
                        <span class="history-date">${escapeHtml(date)}</span>
                    </div>
                `;
            }).join('');
        } else {
            if (countEl) {
                const span = countEl.querySelector('span');
                if (span) span.textContent = '۰';
            }
            container.innerHTML = `
                <div class="empty-state-model" style="padding:30px 20px;">
                    <span class="empty-icon" style="font-size:2rem;">📭</span>
                    <div class="empty-title" style="font-size:0.85rem;">هیچ اجرایی ثبت نشده</div>
                    <div class="empty-message" style="font-size:0.7rem;">با فعال‌سازی زمان‌بندی، اجراها اینجا نمایش داده می‌شوند</div>
                </div>
            `;
        }
    } catch (error) {
        console.warn('⚠️ History error:', error.message);
    }
}

// ============================================================
// ۸. TOGGLE SCHEDULE
// ============================================================

async function toggleSchedule(enabled) {
    const interval = parseInt(document.getElementById('scheduleInterval')?.value || 6);
    const period = document.getElementById('schedulePeriod')?.value || '1m';
    const incremental = document.getElementById('scheduleIncremental')?.checked ?? true;
    
    if (enabled && !confirm(`فعال‌سازی زمان‌بندی هر ${interval} ساعت؟`)) return;
    if (!enabled && !confirm('غیرفعال‌سازی زمان‌بندی؟')) return;
    
    try {
        if (enabled) {
            const result = await api.startSchedule({ interval, period, incremental });
            
            if (!result || !result.success) {
                if (typeof showToast === 'function') {
                    showToast('❌ ' + (result?.message || 'خطا'), 'error');
                }
                return;
            }
            
            if (typeof showToast === 'function') {
                showToast(`✅ زمان‌بندی هر ${interval} ساعت فعال شد`, 'success');
            }
        } else {
            const result = await api.stopSchedule();
            
            if (!result || !result.success) {
                if (typeof showToast === 'function') {
                    showToast('❌ ' + (result?.message || 'خطا'), 'error');
                }
                return;
            }
            
            if (typeof showToast === 'function') {
                showToast('⏹️ زمان‌بندی غیرفعال شد', 'warning');
            }
        }
        
        // بروزرسانی
        setTimeout(loadScheduleStatus, 500);
        
    } catch (error) {
        if (typeof showToast === 'function') {
            showToast('❌ خطا: ' + error.message, 'error');
        }
    }
}

async function runNow() {
    if (!confirm('اجرای فوری آموزش؟')) return;
    
    const period = document.getElementById('schedulePeriod')?.value || '1m';
    const incremental = document.getElementById('scheduleIncremental')?.checked ?? true;
    
    if (window.loadingSystem && typeof window.loadingSystem.show === 'function') {
        window.loadingSystem.show({
            messages: [
                'اجرای فوری آموزش...|لطفاً صبر کنید',
                'در حال پردازش داده‌ها...',
                'تقریباً تمام است...'
            ],
            duration: 20000,
            onComplete: function() {
                loadScheduleStatus();
            }
        });
    }
    
    try {
        const result = await api.trainModel({
            period,
            coins: ['bitcoin', 'ethereum'],
            incremental
        });
        
        if (!result || !result.success) {
            if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
                window.loadingSystem.hide();
            }
            if (typeof showToast === 'function') {
                showToast('❌ ' + (result?.message || 'خطا'), 'error');
            }
            return;
        }
        
        if (typeof showToast === 'function') {
            showToast('✅ آموزش فوری شروع شد', 'success');

    } catch (error) {
        if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
            window.loadingSystem.hide();
        }
        if (typeof showToast === 'function') {
            showToast('❌ خطا: ' + error.message, 'error');
        }
    }
}

// ============================================================
// ۱۰. ANIMATE NUMBER
// ============================================================

function animateNumber(id, target, duration = 1000, decimals = 0, suffix = '') {
    const el = document.getElementById(id);
    if (!el) return;
    if (!target && target !== 0) {
        el.textContent = '0' + suffix;
        return;
    }
    
    const startTime = performance.now();
    
    function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        const current = target * eased;
        
        el.textContent = current.toFixed(decimals) + suffix;
        
        if (progress < 1) requestAnimationFrame(update);
    }
    
    requestAnimationFrame(update);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
