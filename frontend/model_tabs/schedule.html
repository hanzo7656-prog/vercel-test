<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-color="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#070c16">
<title>زمان‌بندی | سیستم تحلیلگر</title>

<!-- ⚡ FOUC Prevention -->
<script>
(function() {
    try {
        var html = document.documentElement;
        var theme = localStorage.getItem('app_theme') || 'dark';
        html.setAttribute('data-theme', theme);
        var color = localStorage.getItem('app_color') || 'violet';
        html.setAttribute('data-color', color);
        var preset = localStorage.getItem('app_preset');
        if (preset && preset !== 'default') {
            html.setAttribute('data-preset', preset);
        }
        if (color === 'custom') {
            var customHex = localStorage.getItem('app_customColor') || '#a855f7';
            html.style.setProperty('--primary', customHex);
        }
        var lang = localStorage.getItem('app_lang') || 'fa';
        html.setAttribute('lang', lang);
        html.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
    } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   MODEL SCHEDULE TAB — CSS
   Auto-Calibration + Timeline + Logs
   ============================================================ */

/* ---------- Base Variables ---------- */
:root {
    --primary: #a855f7;
    --primary-dark: #9333ea;
    --primary-light: #c084fc;
    --primary-rgb: 168, 85, 247;

    --bg-page: #070c16;
    --bg-card: rgba(20, 28, 45, 0.6);
    --bg-card-solid: #131c2d;
    --bg-glass: rgba(19, 28, 45, 0.85);
    --bg-input: rgba(10, 16, 28, 0.8);
    --bg-hover: rgba(148, 163, 184, 0.06);
    --bg-hover-strong: rgba(148, 163, 184, 0.1);

    --text-light: #e6edf7;
    --text-muted: #8b9bb4;
    --text-dim: #5c6b82;
    --text-faint: #3d4959;

    --border: rgba(148, 163, 184, 0.07);
    --border-strong: rgba(148, 163, 184, 0.15);

    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
    --shadow-focus: 0 0 0 3px rgba(168, 85, 247, 0.15);

    --success: #22c55e;
    --success-dark: #16a34a;
    --warning: #f59e0b;
    --warning-dark: #d97706;
    --danger: #ef4444;
    --danger-dark: #dc2626;
    --info: #06b6d4;
    --purple: #a855f7;

    --success-bg: rgba(34, 197, 94, 0.1);
    --warning-bg: rgba(245, 158, 11, 0.1);
    --danger-bg: rgba(239, 68, 68, 0.1);
    --info-bg: rgba(6, 182, 212, 0.1);
    --primary-bg: rgba(168, 85, 247, 0.1);

    --mono-font: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
    --ui-font: 'Vazirmatn', system-ui, sans-serif;

    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---------- Color Themes ---------- */
html[data-color="indigo"]  { --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8; --primary-rgb: 99, 102, 241; --shadow-focus: 0 0 0 3px rgba(99, 102, 241, 0.15); --primary-bg: rgba(99, 102, 241, 0.1); }
html[data-color="emerald"] { --primary: #10b981; --primary-dark: #059669; --primary-light: #34d399; --primary-rgb: 16, 185, 129; --shadow-focus: 0 0 0 3px rgba(16, 185, 129, 0.15); --primary-bg: rgba(16, 185, 129, 0.1); }
html[data-color="rose"]    { --primary: #f43f5e; --primary-dark: #e11d48; --primary-light: #fb7185; --primary-rgb: 244, 63, 94; --shadow-focus: 0 0 0 3px rgba(244, 63, 94, 0.15); --primary-bg: rgba(244, 63, 94, 0.1); }
html[data-color="amber"]   { --primary: #f59e0b; --primary-dark: #d97706; --primary-light: #fbbf24; --primary-rgb: 245, 158, 11; --shadow-focus: 0 0 0 3px rgba(245, 158, 11, 0.15); --primary-bg: rgba(245, 158, 11, 0.1); }
html[data-color="cyan"]    { --primary: #06b6d4; --primary-dark: #0891b2; --primary-light: #22d3ee; --primary-rgb: 6, 182, 212; --shadow-focus: 0 0 0 3px rgba(6, 182, 212, 0.15); --primary-bg: rgba(6, 182, 212, 0.1); }

/* ---------- Light Theme ---------- */
html[data-theme="light"] {
    --bg-page: #f6f8fc;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-solid: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.9);
    --bg-input: rgba(248, 250, 252, 0.95);
    --bg-hover: rgba(15, 23, 42, 0.04);
    --bg-hover-strong: rgba(15, 23, 42, 0.07);
    --text-light: #0d1421;
    --text-muted: #5c6b82;
    --text-dim: #8b9bb4;
    --text-faint: #a8b4c4;
    --border: rgba(15, 23, 42, 0.06);
    --border-strong: rgba(15, 23, 42, 0.12);
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.12);
}

/* ---------- Reset ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-x: hidden; }

body {
    font-family: var(--ui-font);
    background: var(--bg-page);
    min-height: 100vh;
    color: var(--text-light);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding: 12px 16px 40px;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

::selection { background: var(--primary); color: white; }

.hidden { display: none !important; }

/* ============================================================
   INITIAL LOADER
   ============================================================ */
.initial-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-page);
    transition: opacity 0.4s, visibility 0.4s;
}

.initial-loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.initial-loader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
}

.loader-spinner {
    width: 52px;
    height: 52px;
    border: 3px solid var(--border-strong);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    position: relative;
}

.loader-spinner::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--primary-light);
    opacity: 0.5;
    animation: spin 1.5s linear infinite reverse;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loader-text {
    font-family: var(--mono-font);
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.3px;
}

/* ============================================================
   HERO CARD (Schedule)
   ============================================================ */
.hero-card {
    background: linear-gradient(135deg,
        rgba(168, 85, 247, 0.06) 0%,
        var(--bg-card) 50%,
        rgba(6, 182, 212, 0.04) 100%
    );
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    animation: cardIn 0.6s var(--ease-spring);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.hero-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(
        circle at 70% 30%,
        rgba(168, 85, 247, 0.08),
        transparent 60%
    );
    animation: heroBreath 12s ease-in-out infinite;
    pointer-events: none;
}

@keyframes heroBreath {
    0%, 100% { transform: rotate(0deg) scale(1); opacity: 0.7; }
    50% { transform: rotate(180deg) scale(1.1); opacity: 1; }
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.hero-content {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    z-index: 1;
}

.hero-title-block {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.hero-icon {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.4);
    flex-shrink: 0;
    transition: all 0.4s var(--ease-spring);
}

.hero-icon.running {
    background: linear-gradient(135deg, var(--success), var(--success-dark));
    box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
    animation: heroPulse 2s ease-in-out infinite;
}

@keyframes heroPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

.hero-icon svg { width: 26px; height: 26px; }

.hero-title-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
}

.hero-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-light);
    letter-spacing: -0.4px;
    line-height: 1.2;
}

.hero-subtitle {
    font-size: 12.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.hero-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    border: 1px solid;
}

.hero-status-pill.running {
    background: var(--success-bg);
    color: var(--success);
    border-color: rgba(34, 197, 94, 0.3);
}

.hero-status-pill.stopped {
    background: var(--bg-hover);
    color: var(--text-muted);
    border-color: var(--border);
}

.hero-status-pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: dotPulse 1.8s ease-in-out infinite;
}

@keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
}

/* Hero Stats */
.hero-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

@media (max-width: 900px) { .hero-stats { grid-template-columns: repeat(2, 1fr); } }

.hero-stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 14px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 11px;
    transition: all 0.2s ease;
    min-width: 0;
    position: relative;
    overflow: hidden;
}

.hero-stat:hover {
    background: var(--bg-hover-strong);
    border-color: var(--border-strong);
    transform: translateY(-2px);
}

.hero-stat::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 3px;
    height: 100%;
    background: var(--primary);
    opacity: 0.4;
}

.hero-stat.total::before { background: var(--info); opacity: 1; }
.hero-stat.success::before { background: var(--success); opacity: 1; }
.hero-stat.failed::before { background: var(--danger); opacity: 1; }
.hero-stat.next::before { background: var(--warning); opacity: 1; }

.hero-stat-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 700;
    font-family: var(--mono-font);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hero-stat-value {
    font-family: var(--mono-font);
    font-size: 20px;
    font-weight: 800;
    color: var(--text-light);
    letter-spacing: -0.5px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hero-stat.total .hero-stat-value { color: var(--info); }
.hero-stat.success .hero-stat-value { color: var(--success); }
.hero-stat.failed .hero-stat-value { color: var(--danger); }
.hero-stat.next .hero-stat-value { color: var(--warning); }

.hero-stat-hint {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--mono-font);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ============================================================
   CONTROL PANEL
   ============================================================ */
.control-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    animation: cardIn 0.5s var(--ease-spring) backwards;
    animation-delay: 0.1s;
}

.control-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.06), transparent);
    flex-wrap: wrap;
}

.control-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-light);
}

.control-title svg {
    width: 15px;
    height: 15px;
    color: var(--primary-light);
    flex-shrink: 0;
}

.control-badge {
    background: var(--bg-hover);
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 7px;
    font-family: var(--mono-font);
}

.control-body {
    padding: 16px 18px;
}

/* Toggle Row */
.toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    transition: all 0.2s;
    flex-wrap: wrap;
}

.toggle-row.active {
    background: linear-gradient(135deg, var(--success-bg), var(--bg-input));
    border-color: rgba(34, 197, 94, 0.3);
}

.toggle-row-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
}

.toggle-row-icon {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 11px;
    background: var(--bg-hover);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
}

.toggle-row.active .toggle-row-icon {
    background: var(--success);
    color: white;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
}

.toggle-row-icon svg { width: 18px; height: 18px; }

.toggle-row-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
}

.toggle-row-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-light);
}

.toggle-row-desc {
    font-size: 11.5px;
    color: var(--text-muted);
    font-family: var(--mono-font);
}

.toggle-switch {
    position: relative;
    display: inline-flex;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
}

.toggle-switch input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.toggle-track {
    width: 52px;
    height: 28px;
    background: var(--bg-hover-strong);
    border: 1px solid var(--border);
    border-radius: 999px;
    position: relative;
    transition: all 0.25s;
}

.toggle-track::after {
    content: '';
    position: absolute;
    top: 50%;
    right: 4px;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    background: var(--text-muted);
    border-radius: 50%;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.toggle-switch input:checked + .toggle-track {
    background: var(--success);
    border-color: var(--success);
}

.toggle-switch input:checked + .toggle-track::after {
    right: calc(100% - 22px);
    background: white;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

/* Form Grid */
.form-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 14px;
}

@media (max-width: 900px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    font-family: var(--mono-font);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.form-label .hint {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
}

.form-input,
.form-select {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text-light);
    font-family: var(--mono-font);
    font-size: 12.5px;
    font-weight: 600;
    outline: none;
    transition: all 0.18s;
}

.form-select { cursor: pointer; }

.form-input:focus,
.form-select:focus {
    border-color: var(--primary);
    box-shadow: var(--shadow-focus);
    background: var(--bg-card-solid);
}

.form-input::placeholder {
    color: var(--text-faint);
    font-weight: 400;
}

/* Interval Selector */
.interval-selector {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 4px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 11px;
}

.interval-btn {
    padding: 8px 4px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--text-muted);
    font-family: var(--mono-font);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
}

.interval-btn:hover {
    color: var(--text-light);
    background: var(--bg-hover);
}

.interval-btn.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 2px 8px rgba(var(--primary-rgb), 0.4);
}

/* Control Actions */
.control-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
}

.control-actions-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono-font);
    flex-wrap: wrap;
}

.control-actions-left svg {
    width: 12px;
    height: 12px;
    color: var(--info);
}

.control-actions-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text-light);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    position: relative;
}

.toolbar-btn svg { width: 13px; height: 13px; }

.toolbar-btn:hover {
    background: var(--bg-hover-strong);
    border-color: var(--border-strong);
    transform: translateY(-1px);
}

.toolbar-btn.success {
    background: var(--success);
    color: white;
    border-color: var(--success);
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
}

.toolbar-btn.success:hover {
    background: var(--success-dark);
    box-shadow: 0 6px 18px rgba(34, 197, 94, 0.4);
}

.toolbar-btn.danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
}

.toolbar-btn.danger:hover {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
}

.toolbar-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.toolbar-btn.loading svg {
    animation: spin 0.7s linear infinite;
}

/* ============================================================
   PANEL (Generic)
   ============================================================ */
.panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
    animation: cardIn 0.5s var(--ease-spring) backwards;
    animation-delay: 0.15s;
}

.panel-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
}

.panel-title-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
}

.panel-title-bar svg {
    width: 15px;
    height: 15px;
    color: var(--primary-light);
    flex-shrink: 0;
}

.panel-count {
    background: var(--bg-hover);
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 7px;
    font-family: var(--mono-font);
}

.panel-actions-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.panel-body-bar {
    padding: 14px 16px;
}

.panel-body-bar.no-padding { padding: 0; }

/* ============================================================
   TIMELINE VISUAL
   ============================================================ */
.timeline-wrapper {
    padding: 30px 20px 16px;
    overflow-x: auto;
    scrollbar-width: thin;
}

.timeline-wrapper::-webkit-scrollbar { height: 6px; }
.timeline-wrapper::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.timeline-track {
    position: relative;
    height: 80px;
    min-width: 100%;
    padding: 0 40px;
}

.timeline-line {
    position: absolute;
    top: 40px;
    left: 40px;
    right: 40px;
    height: 3px;
    background: linear-gradient(90deg,
        var(--border-strong) 0%,
        var(--primary) 50%,
        var(--border-strong) 100%
    );
    border-radius: 2px;
}

.timeline-progress {
    position: absolute;
    top: 40px;
    left: 40px;
    height: 3px;
    background: linear-gradient(90deg, var(--success), var(--primary-light));
    border-radius: 2px;
    transition: width 1s linear;
    box-shadow: 0 0 10px rgba(var(--primary-rgb), 0.6);
}

.timeline-node {
    position: absolute;
    top: 40px;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 1;
}

.timeline-node-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--bg-card-solid);
    border: 3px solid var(--text-dim);
    box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.1);
    transition: all 0.3s;
    position: relative;
}

.timeline-node.past .timeline-node-dot {
    background: var(--success);
    border-color: var(--success);
    box-shadow: 0 0 12px var(--success);
}

.timeline-node.current .timeline-node-dot {
    width: 20px;
    height: 20px;
    background: var(--info);
    border-color: var(--info);
    box-shadow:
        0 0 16px var(--info),
        0 0 32px rgba(6, 182, 212, 0.5);
    animation: currentPulse 2s ease-in-out infinite;
}

@keyframes currentPulse {
    0%, 100% { box-shadow: 0 0 16px var(--info), 0 0 32px rgba(6, 182, 212, 0.5); }
    50% { box-shadow: 0 0 24px var(--info), 0 0 48px rgba(6, 182, 212, 0.8); }
}

.timeline-node.next .timeline-node-dot {
    background: var(--warning);
    border-color: var(--warning);
    box-shadow: 0 0 16px var(--warning);
    animation: nextPulse 1.5s ease-in-out infinite;
}

@keyframes nextPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 16px var(--warning); }
    50% { transform: scale(1.15); box-shadow: 0 0 24px var(--warning); }
}

.timeline-node.future .timeline-node-dot {
    background: var(--bg-card-solid);
    border-color: var(--text-faint);
}

.timeline-node-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    font-family: var(--mono-font);
    white-space: nowrap;
    background: var(--bg-card);
    padding: 2px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    transition: all 0.3s;
}

.timeline-node.past .timeline-node-label {
    color: var(--success);
    border-color: rgba(34, 197, 94, 0.3);
}

.timeline-node.current .timeline-node-label {
    color: var(--info);
    border-color: rgba(6, 182, 212, 0.3);
}

.timeline-node.next .timeline-node-label {
    color: var(--warning);
    border-color: rgba(245, 158, 11, 0.3);
}

.timeline-node-time {
    font-size: 9px;
    color: var(--text-faint);
    font-family: var(--mono-font);
    white-space: nowrap;
}

/* Next Run Highlight */
.next-run-highlight {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: linear-gradient(135deg,
        rgba(245, 158, 11, 0.08),
        var(--bg-hover)
    );
    border: 1px solid rgba(245, 158, 11, 0.25);
    border-radius: 12px;
    margin: 0 16px 16px;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
}

.next-run-highlight::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px;
    height: 100%;
    background: var(--warning);
}

.next-run-icon {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--warning), var(--warning-dark));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    flex-shrink: 0;
    animation: floatIcon 3s ease-in-out infinite;
}

@keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}

.next-run-icon svg { width: 22px; height: 22px; }

.next-run-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.next-run-label {
    font-size: 10.5px;
    color: var(--warning);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 700;
    font-family: var(--mono-font);
}

.next-run-value {
    font-family: var(--mono-font);
    font-size: 26px;
    font-weight: 800;
    color: var(--warning);
    letter-spacing: -0.5px;
    line-height: 1.1;
    text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
}

.next-run-meta {
    font-size: 11.5px;
    color: var(--text-muted);
    font-family: var(--mono-font);
}

/* ============================================================
   LOGS TABLE
   ============================================================ */
.data-table-wrap {
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
}

.data-table-wrap::-webkit-scrollbar { height: 6px; }
.data-table-wrap::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.data-table-wrap::-webkit-scrollbar-thumb:hover { background: var(--primary); }

.data-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

.data-table thead {
    background: var(--bg-input);
    border-bottom: 1px solid var(--border);
}

.data-table th {
    padding: 11px 12px;
    text-align: right;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-family: var(--mono-font);
    white-space: nowrap;
    user-select: none;
}

.data-table td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-light);
    white-space: nowrap;
}

.data-table tbody tr {
    transition: background 0.15s;
}

.data-table tbody tr:hover { background: var(--bg-hover); }
.data-table tbody tr:last-child td { border-bottom: none; }

/* Badges */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 6px;
    font-family: var(--mono-font);
    font-size: 10.5px;
    font-weight: 700;
    white-space: nowrap;
}

.badge.success { background: var(--success-bg); color: var(--success); }
.badge.warning { background: var(--warning-bg); color: var(--warning); }
.badge.danger  { background: var(--danger-bg); color: var(--danger); }
.badge.info    { background: var(--info-bg); color: var(--info); }
.badge.primary { background: var(--primary-bg); color: var(--primary-light); }
.badge.muted   { background: var(--bg-hover); color: var(--text-muted); }

.badge::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
}

.badge.no-dot::before { display: none; }

.mono {
    font-family: var(--mono-font);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-light);
}

.mono.muted { color: var(--text-muted); font-weight: 500; }

/* Log Row */
.log-row-item {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
}

.log-row-item:hover { background: var(--bg-hover); }
.log-row-item:last-child { border-bottom: none; }

.log-icon {
    width: 30px;
    height: 30px;
    min-width: 30px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 800;
}

.log-icon.success { background: var(--success-bg); color: var(--success); }
.log-icon.error { background: var(--danger-bg); color: var(--danger); }
.log-icon.running { background: var(--info-bg); color: var(--info); }
.log-icon.info { background: var(--primary-bg); color: var(--primary-light); }

.log-icon svg { width: 14px; height: 14px; }

.log-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.log-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-light);
    font-family: var(--mono-font);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.log-meta {
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: var(--mono-font);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.log-time {
    font-size: 10.5px;
    color: var(--text-dim);
    font-family: var(--mono-font);
    flex-shrink: 0;
    white-space: nowrap;
}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state {
    padding: 40px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.empty-icon {
    width: 48px;
    height: 48px;
    color: var(--text-faint);
    opacity: 0.5;
}

.empty-icon svg { width: 100%; height: 100%; }

.empty-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
}

.empty-message {
    font-size: 11.5px;
    color: var(--text-muted);
    max-width: 320px;
    line-height: 1.5;
}

/* ============================================================
   SKELETON
   ============================================================ */
.skeleton {
    background: linear-gradient(
        90deg,
        rgba(148, 163, 184, 0.05) 0%,
        rgba(148, 163, 184, 0.12) 50%,
        rgba(148, 163, 184, 0.05) 100%
    );
    background-size: 200% 100%;
    animation: shimmer 1.5s linear infinite;
    border-radius: 6px;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.skeleton-line {
    height: 12px;
    margin-bottom: 8px;
}

.skeleton-line.short { width: 40%; }
.skeleton-line.medium { width: 70%; }
.skeleton-line.long { width: 100%; }

/* ============================================================
   MODALS
   ============================================================ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 99998;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.modal-overlay.open {
    opacity: 1;
    visibility: visible;
}

.modal {
    background: var(--bg-card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    box-shadow: var(--shadow-lg);
    transform: scale(0.92);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.modal.modal-sm { max-width: 420px; }

.modal-overlay.open .modal { transform: scale(1); }

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.08), transparent);
    gap: 10px;
    flex-shrink: 0;
}

.modal-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-light);
    min-width: 0;
}

.modal-title svg {
    width: 16px;
    height: 16px;
    color: var(--primary-light);
    flex-shrink: 0;
}

.modal-close {
    width: 30px;
    height: 30px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    padding: 0;
}

.modal-close:hover { background: var(--danger); color: white; }
.modal-close svg { width: 14px; height: 14px; }

.modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.modal-footer {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    background: var(--bg-card);
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.modal-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 9px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 90px;
}

.modal-btn svg { width: 13px; height: 13px; }

.modal-btn.cancel { background: var(--bg-hover); color: var(--text-light); }
.modal-btn.cancel:hover { background: var(--bg-hover-strong); }

.modal-btn.primary {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 14px rgba(var(--primary-rgb), 0.35);
}

.modal-btn.primary:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

.modal-btn.danger {
    background: var(--danger);
    color: white;
}

.modal-btn.danger:hover {
    background: var(--danger-dark);
    transform: translateY(-1px);
}

.modal-btn.success {
    background: var(--success);
    color: white;
}

.modal-btn.success:hover {
    background: var(--success-dark);
    transform: translateY(-1px);
}

.modal-btn.warning {
    background: var(--warning);
    color: white;
}

.modal-btn.warning:hover {
    background: var(--warning-dark);
    transform: translateY(-1px);
}

/* Confirm dialog */
.confirm-body {
    padding: 24px 20px 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
}

.confirm-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--warning-bg);
    color: var(--warning);
    display: flex;
    align-items: center;
    justify-content: center;
}

.confirm-icon.danger { background: var(--danger-bg); color: var(--danger); }
.confirm-icon.success { background: var(--success-bg); color: var(--success); }
.confirm-icon svg { width: 24px; height: 24px; }

.confirm-title { font-size: 15px; font-weight: 700; color: var(--text-light); }
.confirm-desc {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.65;
    text-align: center;
}

.confirm-desc code {
    font-family: var(--mono-font);
    background: var(--bg-hover);
    padding: 2px 7px;
    border-radius: 5px;
    color: var(--primary-light);
    font-size: 11.5px;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-container {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 100000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    font-family: var(--ui-font);
    max-width: calc(100vw - 48px);
}

@keyframes toastIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
    .toast-container {
        bottom: auto;
        top: 80px;
        left: 12px;
        right: 12px;
        max-width: none;
    }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 640px) {
    body { padding: 10px 10px 30px; }
    .hero-title { font-size: 17px; }
    .hero-stat-value { font-size: 17px; }
    .toolbar-btn { padding: 8px 11px; font-size: 11.5px; }
    .panel-header-bar { padding: 10px 12px; }
    .panel-body-bar { padding: 12px; }
    .control-body { padding: 14px; }
    .control-header { padding: 12px 14px; }
    .next-run-value { font-size: 20px; }
    .next-run-highlight { padding: 14px; margin: 0 12px 12px; }
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<!-- ============================================================

<section class="control-panel">

        <div class="control-title">

                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>کنترل زمان‌بندی</span>
            <span class="control-badge" id="controlBadge">غیرفعال</span>
        </div>

    <div class="control-body">

        <!-- Toggle Row -->
        <div class="toggle-row" id="scheduleToggleRow">

<script>

(function() {

if (window.__modelScheduleLoaded) return;
window.__modelScheduleLoaded = true;


// ============================================================

const CONFIG = {

        SCHEDULE_CONFIG: 'model_schedule_config',

};


// ============================================================

const state = {

    stats: null,
    logs: [],
    history: [],

    form: {
        enabled: false,
        interval_hours: 6,

        coins: ['bitcoin', 'ethereum', 'solana'],
    },

    isUpdating: false,
    isRunningNow: false,

    countdownTimer: null,
    autoRefreshTimer: null,

    // Countdown state
    nextRunAt: null,
    currentProgress: 0,
};


// ============================================================
// HELPERS
// ============================================================
const $  = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function formatNumber(n) {
    if (n === undefined || n === null || isNaN(n)) return '—';
    return Number(n).toLocaleString('fa-IR');
}

function formatPercent(v, decimals = 1) {
    if (v === undefined || v === null || isNaN(v)) return '—';
    return Number(v).toFixed(decimals) + '٪';
}

function formatTimeAgo(date) {
    if (!date) return '—';
    try {
        const d = typeof date === 'string' ? new Date(date) : date;
        if (isNaN(d.getTime())) return '—';
        const diff = Math.floor((Date.now() - d.getTime()) / 1000);
        if (diff < 5) return 'همین حالا';
        if (diff < 60) return diff + ' ثانیه پیش';
        if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';
        if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت پیش';
        return Math.floor(diff / 86400) + ' روز پیش';
    } catch {
        return '—';
    }
}

function formatDate(date) {
    if (!date) return '—';
    try {
        const d = typeof date === 'string' ? new Date(date) : date;
        if (isNaN(d.getTime())) return '—';
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hour = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${year}/${month}/${day} ${hour}:${min}`;
    } catch {
        return '—';
    }
}

function formatDuration(seconds) {
    if (seconds === undefined || seconds === null || isNaN(seconds)) return '—';
    const s = Math.floor(Number(seconds));
    if (s < 60) return s + ' ثانیه';
    if (s < 3600) return Math.floor(s / 60) + ' دقیقه';
    if (s < 86400) return Math.floor(s / 3600) + ' ساعت';
    return Math.floor(s / 86400) + ' روز';
}

function formatCountdown(seconds) {
    if (seconds <= 0) return 'همین حالا';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}


// ============================================================

        info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',

// ============================================================
// API LAYER
// ============================================================
const API = {
    async request(url, options = {}) {
        try {
            const res = await fetch(url, {
                credentials: 'include',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                ...options,
            });
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.error || `HTTP ${res.status}`);
            }
            return await res.json();
        } catch (err) {
            console.warn(`[API] ${url}:`, err.message);
            return { success: false, error: err.message };
        }
    },

    getStatus() {
        return this.request(CONFIG.API.STATUS);
    },

    start(options) {
        return this.request(CONFIG.API.START, {
            method: 'POST',
            body: JSON.stringify(options || {}),
        });
    },

    stop() {
        return this.request(CONFIG.API.STOP, {
            method: 'POST',
        });
    },

    getTrainerStats() {
        return this.request(CONFIG.API.TRAINER_STATS);
    },

    runCalibration(options) {
        return this.request(CONFIG.API.CALIBRATE, {
            method: 'POST',
            body: JSON.stringify(options || {}),
        });
    },

    getHistory(limit = 20) {
        return this.request(`${CONFIG.API.HISTORY}?limit=${limit}`);
    },
};

// LOADING HELPERS

function showInitialLoader() {

// RENDER: HERO
// ============================================================
function renderHero() {
    const status = state.status || {};
    const isRunning = status.is_running === true;
    const isCalibrating = status.is_calibrating === true;

    // Icon state
    const icon = $('#heroIcon');
    if (icon) {
        icon.classList.toggle('running', isRunning);
    }

    // Status pill
    const pill = $('#heroStatusPill');
    const pillText = $('#heroStatusText');
    if (pill && pillText) {
        pill.className = 'hero-status-pill';
        if (isRunning) {
            pill.classList.add('running');
            pillText.textContent = isCalibrating ? 'در حال اجرا' : 'فعال';
        } else {
            pill.classList.add('stopped');
            pillText.textContent = 'غیرفعال';
        }
    }

    // Last run
    const lastRunEl = $('#heroLastRun');
    if (lastRunEl) {
        const last = status.last_calibration || status.stats?.last_calibration;
        lastRunEl.textContent = last ? `آخرین اجرا: ${formatTimeAgo(last)}` : 'آخرین اجرا: —';
    }

    // Stats
    const stats = status.stats || {};
    const total = stats.total_calibrations ?? status.total_calibrations ?? 0;
    const success = stats.successful_calibrations ?? status.successful_calibrations ?? 0;
    const failed = stats.failed_calibrations ?? status.failed_calibrations ?? 0;

    setText('#heroTotalRuns', formatNumber(total));
    setText('#heroSuccessRuns', formatNumber(success));
    setText('#heroFailedRuns', formatNumber(failed));

    // Success hint
    const successHint = $('#heroSuccessHint');
    if (successHint) {
        if (total > 0) {
            const pct = ((success / total) * 100).toFixed(1);
            successHint.textContent = `${pct}٪ موفق`;
        } else {
            successHint.textContent = 'از کل';
        }
    }

    // Next In (این توسط countdown پر می‌شه)
    updateNextInCounter();
}

// ============================================================
// RENDER: TIMELINE
// ============================================================
function renderTimeline() {
    const track = $('#timelineTrack');
    const timelineBadge = $('#timelineBadge');
    if (!track) return;

    const status = state.status || {};
    const isRunning = status.is_running === true;
    const intervalHours = state.form.interval_hours;

    // Last run + Next run
    const stats = status.stats || {};
    const lastRun = stats.last_calibration || status.last_calibration;
    const nextRun = status.next_training || status.next_run;

    if (!isRunning) {
        // حذف nodes (فقط line بمونه)
        track.querySelectorAll('.timeline-node').forEach(n => n.remove());

        const progress = $('#timelineProgress');
        if (progress) progress.style.width = '0%';

        setText('#timelineBadge', 'غیرفعال');

        // مخفی کردن next run highlight
        const highlight = $('#nextRunHighlight');
        if (highlight) highlight.style.display = 'none';

        return;
    }

    if (timelineBadge) {
        timelineBadge.textContent = `هر ${intervalHours}h`;
    }

    // محاسبه nodes
    const now = Date.now();
    const intervalMs = intervalHours * 60 * 60 * 1000;

    // Next run timestamp
    let nextTs = null;
    if (nextRun) {
        nextTs = new Date(nextRun).getTime();
    } else if (lastRun) {
        nextTs = new Date(lastRun).getTime() + intervalMs;
    } else {
        nextTs = now + intervalMs;
    }

    state.nextRunAt = nextTs;

    // بازه نمایش: از ۲ دوره قبل تا ۲ دوره بعد
    const startTime = nextTs - 2 * intervalMs;
    const endTime = nextTs + 2 * intervalMs;
    const totalRange = endTime - startTime;

    // حذف nodes قبلی
    track.querySelectorAll('.timeline-node').forEach(n => n.remove());

    // ساخت nodes: -2, -1, 0 (next), +1, +2
    for (let i = -2; i <= 2; i++) {
        const nodeTime = nextTs + (i * intervalMs);
        const percent = ((nodeTime - startTime) / totalRange) * 100;

        // تعیین کلاس
        let nodeClass = 'future';
        if (i < 0) nodeClass = 'past';
        else if (i === 0) nodeClass = 'next';
        else if (i === 1) nodeClass = 'current';

        // label
        let label = '';
        if (i === -2) label = '-2x';
        else if (i === -1) label = '-1x';
        else if (i === 0) label = 'بعدی';
        else if (i === 1) label = '+1x';
        else if (i === 2) label = '+2x';

        const node = document.createElement('div');
        node.className = `timeline-node ${nodeClass}`;
        node.style.left = `calc(40px + ${percent}% * (100% - 80px) / 100%)`;
        node.style.left = `${percent}%`;

        node.innerHTML = `
            <span class="timeline-node-dot"></span>
            <span class="timeline-node-label">${label}</span>
            <span class="timeline-node-time">${formatDate(nodeTime).split(' ')[1] || ''}</span>
        `;

        track.appendChild(node);
    }

    // Progress bar
    updateTimelineProgress();

    // Next run highlight
    const highlight = $('#nextRunHighlight');
    if (highlight) {
        highlight.style.display = 'flex';
        updateNextRunHighlight();
    }

    // Start countdown
    startCountdown();
}


function updateTimelineProgress() {
    if (!state.nextRunAt) return;

    const status = state.status || {};
    const stats = status.stats || {};
    const lastRun = stats.last_calibration || status.last_calibration;

    if (!lastRun) return;

    const lastTs = new Date(lastRun).getTime();
    const nextTs = state.nextRunAt;
    const now = Date.now();

    const total = nextTs - lastTs;
    const elapsed = now - lastTs;

    if (total <= 0) return;

    const percent = Math.min(Math.max((elapsed / total) * 100, 0), 100);

    const progress = $('#timelineProgress');
    if (progress) {
        progress.style.width = `calc((100% - 80px) * ${percent / 100})`;
    }

    state.currentProgress = percent;
}


// ============================================================
// RENDER: NEXT RUN HIGHLIGHT (Countdown)
// ============================================================
function updateNextRunHighlight() {
    if (!state.nextRunAt) return;

    const nextTs = state.nextRunAt;
    const now = Date.now();
    const diff = Math.floor((nextTs - now) / 1000);

    const valueEl = $('#nextRunValue');
    const metaEl = $('#nextRunMeta');

    if (diff <= 0) {
        if (valueEl) valueEl.textContent = 'در حال اجرا...';
        if (metaEl) metaEl.textContent = 'کالیبراسیون خودکار';
        return;
    }

    if (valueEl) valueEl.textContent = formatCountdown(diff);
    if (metaEl) metaEl.textContent = formatDate(nextTs);
}


function updateNextInCounter() {
    const el = $('#heroNextIn');
    if (!el) return;

    if (!state.nextRunAt) {
        el.textContent = '—';
        return;
    }

    const now = Date.now();
    const diff = Math.floor((state.nextRunAt - now) / 1000);

    if (diff <= 0) {
        el.textContent = 'همین حالا';
        return;
    }

    // کوتاه نمایش بده
    if (diff < 60) {
        el.textContent = diff + 's';
    } else if (diff < 3600) {
        el.textContent = Math.floor(diff / 60) + 'm';
    } else {
        el.textContent = Math.floor(diff / 3600) + 'h';
    }
}


function startCountdown() {
    stopCountdown();

    state.countdownTimer = setInterval(() => {
        if (document.visibilityState !== 'visible') return;

        updateNextRunHighlight();
        updateNextInCounter();
        updateTimelineProgress();

        // اگه به صفر رسید، یک بار refresh کن
        if (state.nextRunAt) {
            const diff = state.nextRunAt - Date.now();
            if (diff <= 0 && !state.isUpdating) {
                // بعد از ۵ ثانیه refresh
                setTimeout(() => {
                    if (state.nextRunAt - Date.now() <= 0) {
                        loadAll();
                    }
                }, 5000);
            }
        }
    }, CONFIG.COUNTDOWN_INTERVAL);
}

function stopCountdown() {
    if (state.countdownTimer) {
        clearInterval(state.countdownTimer);
        state.countdownTimer = null;
    }
}


// ============================================================
// RENDER: LOGS
// ============================================================
function renderLogs() {
    const container = $('#logsList');
    const countBadge = $('#logsCount');
    if (!container) return;

    const logs = state.history || [];

    if (countBadge) {
        countBadge.textContent = formatNumber(logs.length);
    }

    if (logs.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 17 10 11 4 5"/>
                        <line x1="12" y1="19" x2="20" y2="19"/>
                    </svg>
                </div>
                <div class="empty-title">تاریخچه‌ای موجود نیست</div>
                <div class="empty-message">هنوز کالیبراسیون خودکاری اجرا نشده</div>
            </div>
        `;
        return;
    }

    container.innerHTML = logs.map(log => {
        const status = log.status || 'success';
        const version = log.version || log.model_version || '—';
        const accuracy = log.accuracy ?? log.score;
        const improvement = log.improvement;
        const duration = log.duration_seconds ?? log.duration;
        const time = log.created_at || log.timestamp || log.calibrated_at;
        const errorMsg = log.error;

        let iconClass = 'success';
        let iconSvg = '<polyline points="20 6 9 17 4 12"/>';

        if (status === 'error' || status === 'failed') {
            iconClass = 'error';
            iconSvg = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
        } else if (status === 'running') {
            iconClass = 'running';
            iconSvg = '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>';
        }

        let meta = [];
        if (version && version !== '—') meta.push(`نسخه: ${version}`);
        if (accuracy !== undefined && accuracy !== null) meta.push(`Score: ${Number(accuracy).toFixed(3)}`);
        if (improvement !== undefined && improvement !== null) {
            const impPct = (improvement * 100).toFixed(2);
            meta.push(`بهبود: ${impPct > 0 ? '+' : ''}${impPct}٪`);
        }
        if (duration !== undefined && duration !== null) meta.push(`زمان: ${formatDuration(duration)}`);
        if (errorMsg) meta.push(`خطا: ${errorMsg}`);

        return `
            <div class="log-row-item">
                <div class="log-icon ${iconClass}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        ${iconSvg}
                    </svg>
                </div>
                <div class="log-content">
                    <span class="log-title">${status === 'error' ? 'ناموفق' : (status === 'running' ? 'در حال اجرا' : 'موفق')}</span>
                    <span class="log-meta">${escapeHtml(meta.join(' · ') || '—')}</span>
                </div>
                <span class="log-time">${escapeHtml(formatTimeAgo(time))}</span>
            </div>
        `;
    }).join('');
}


// ============================================================
// HELPERS
// ============================================================
function setText(selector, value) {
    const el = typeof selector === 'string' ? $(selector) : selector;
    if (el) el.textContent = value ?? '—';
}


// ============================================================
// MODAL HELPERS
// ============================================================
function openModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('open');
    if (!document.querySelector('.modal-overlay.open')) {
        document.body.style.overflow = '';
    }
}

let _confirmCallback = null;

function showConfirm(title, desc, iconType = 'warning', onConfirm = null, okBtnClass = 'primary') {
    const titleEl = $('#confirmTitle');
    const descEl = $('#confirmDesc');
    const iconEl = $('#confirmIcon');
    const okBtn = $('#confirmOkBtn');

    if (titleEl) titleEl.textContent = title;
    if (descEl) descEl.innerHTML = desc;
    if (okBtn) {
        okBtn.textContent = 'تأیید';
        okBtn.className = 'modal-btn ' + okBtnClass;
    }

    if (iconEl) {
        iconEl.classList.remove('danger', 'success', 'warning');
        if (iconType === 'danger') iconEl.classList.add('danger');
        else if (iconType === 'success') iconEl.classList.add('success');
        else if (iconType === 'warning') iconEl.classList.add('warning');

        const iconSvg = {
            danger: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
            success: '<polyline points="20 6 9 17 4 12"/>',
            warning: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
        };
        iconEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${iconSvg[iconType] || iconSvg.warning}</svg>`;
    }

    _confirmCallback = onConfirm;
    openModal('confirmModal');
}


// ============================================================
// FORM HANDLING
// ============================================================
function readForm() {
    const interval = parseInt($('#scheduleInterval')?.value, 10) || 6;
    const period = $('#schedulePeriod')?.value || '1m';
    const profile = $('#scheduleProfile')?.value || 'balanced';
    const coinsRaw = $('#scheduleCoins')?.value.trim() || '';

    const coins = coinsRaw
        .split(',')
        .map(c => c.trim().toLowerCase())
        .filter(c => c.length > 0);

    return {
        interval_hours: interval,
        period,
        profile_name: profile,
        coins: coins.length > 0 ? coins : ['bitcoin', 'ethereum'],
    };
}

function saveFormToState() {
    const form = readForm();
    state.form = { ...state.form, ...form };

    // ذخیره در localStorage
    try {
        localStorage.setItem(CONFIG.STORAGE.SCHEDULE_CONFIG, JSON.stringify(state.form));
    } catch (e) {}
}

function restoreFormFromStorage() {
    try {
        const saved = localStorage.getItem(CONFIG.STORAGE.SCHEDULE_CONFIG);
        if (saved) {
            const parsed = JSON.parse(saved);
            state.form = { ...state.form, ...parsed };
        }
    } catch (e) {}
}


// ============================================================
// ACTIONS
// ============================================================
async function toggleSchedule(enabled) {
    if (state.isUpdating) return;
    state.isUpdating = true;

    const toggle = $('#scheduleToggle');
    if (toggle) toggle.disabled = true;

    try {
        if (enabled) {
            saveFormToState();

            const res = await API.start({
                interval_hours: state.form.interval_hours,
                period: state.form.period,
                profile_name: state.form.profile_name,
                coins: state.form.coins,
            });

            if (res.success) {
                showToast('⏰ زمان‌بندی فعال شد', 'success', 2500);
                await loadAll();
            } else {
                showToast(res.error || 'خطا در فعال‌سازی', 'error', 3000);
                if (toggle) toggle.checked = false;
            }
        } else {
            const res = await API.stop();

            if (res.success) {
                showToast('⏹️ زمان‌بندی متوقف شد', 'info', 2500);
                await loadAll();
            } else {
                showToast(res.error || 'خطا در توقف', 'error', 3000);
                if (toggle) toggle.checked = true;
            }
        }
    } catch (err) {
        showToast('خطای غیرمنتظره: ' + err.message, 'error', 3000);
    } finally {
        state.isUpdating = false;
        if (toggle) toggle.disabled = false;
    }
}


async function applyChanges() {
    if (state.isUpdating) return;

    saveFormToState();

    const status = state.status || {};
    const isRunning = status.is_running === true;

    if (!isRunning) {
        // اگه زمان‌بندی غیرفعاله، فقط ذخیره کن
        showToast('✅ تنظیمات ذخیره شد (زمان‌بندی غیرفعال است)', 'success', 2500);
        return;
    }

    // تأیید
    showConfirm(
        'اعمال تغییرات',
        `زمان‌بندی با تنظیمات جدید <code>هر ${state.form.interval_hours} ساعت</code> دوباره راه‌اندازی می‌شود. ادامه؟`,
        'warning',
        async () => {
            state.isUpdating = true;

            const btn = $('#applyBtn');
            if (btn) {
                btn.disabled = true;
                btn.classList.add('loading');
            }

            try {
                // ۱. توقف
                await API.stop();

                // ۲. شروع مجدد
                const res = await API.start({
                    interval_hours: state.form.interval_hours,
                    period: state.form.period,
                    profile_name: state.form.profile_name,
                    coins: state.form.coins,
                });

                if (res.success) {
                    showToast('✅ تنظیمات اعمال شد', 'success', 2500);
                    await loadAll();
                } else {
                    showToast(res.error || 'خطا در اعمال', 'error', 3000);
                }
            } catch (err) {
                showToast('خطای غیرمنتظره: ' + err.message, 'error', 3000);
            } finally {
                state.isUpdating = false;
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                }
            }
        },
        'warning'
    );
}


async function runNow() {
    if (state.isRunningNow) return;

    saveFormToState();

    showConfirm(
        'اجرای فوری',
        `آیا یک کالیبراسیون فوری با پروفایل <code>${escapeHtml(state.form.profile_name)}</code> اجرا شود؟`,
        'warning',
        async () => {
            state.isRunningNow = true;

            const btn = $('#runNowBtn');
            if (btn) {
                btn.disabled = true;
                btn.classList.add('loading');
            }

            const hint = $('#scheduleHint');
            if (hint) hint.textContent = 'در حال اجرا...';

            try {
                const res = await API.runCalibration({
                    period: state.form.period,
                    profile_name: state.form.profile_name,
                    coins: state.form.coins,
                    save: true,
                });

                if (res.success) {
                    const result = res.data || res;
                    const score = result.score ?? result.avg_score;
                    let msg = '✅ کالیبراسیون موفق';
                    if (score !== undefined) msg += ` — Score: ${Number(score).toFixed(3)}`;
                    showToast(msg, 'success', 4000);
                    await loadAll();
                } else {
                    showToast(res.error || 'خطا در اجرا', 'error', 4000);
                }
            } catch (err) {
                showToast('خطای غیرمنتظره: ' + err.message, 'error', 4000);
            } finally {
                state.isRunningNow = false;
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                }
                if (hint) hint.textContent = state.status?.is_running ? 'زمان‌بندی فعال است' : 'آماده';
            }
        },
        'warning'
    );
}


// ============================================================
// LOAD FUNCTIONS
// ============================================================
async function loadStatus() {
    const res = await API.getStatus();
    if (res.success) {
        state.status = res.data || res;

        // آپدیت form از status
        const status = state.status;

        if (status.interval_hours !== undefined) state.form.interval_hours = status.interval_hours;
        if (status.period) state.form.period = status.period;
        if (status.profile_name) state.form.profile_name = status.profile_name;
        if (Array.isArray(status.coins) && status.coins.length > 0) state.form.coins = status.coins;

        // آپدیت nextRunAt
        if (status.next_training || status.next_run) {
            state.nextRunAt = new Date(status.next_training || status.next_run).getTime();
        }

        renderHero();
        renderControl();
        renderTimeline();

        return true;
    }
    return false;
}

async function loadTrainerStats() {
    const res = await API.getTrainerStats();
    if (res.success) {
        state.stats = res.data || res;
        return true;
    }
    return false;
}

async function loadHistory() {
    const res = await API.getHistory(20);
    if (res.success) {
        state.history = Array.isArray(res.data) ? res.data : [];
        renderLogs();
        return true;
    }
    return false;
}


// ============================================================
// LOAD ALL
// ============================================================
async function loadAll() {
    try {
        await Promise.allSettled([
            loadStatus(),
            loadTrainerStats(),
            loadHistory(),
        ]);
    } catch (e) {
        console.error('Load all error:', e);
    }
}


// ============================================================
// EVENT LISTENERS
// ============================================================
function bindEvents() {

    // ===== Schedule Toggle =====
    $('#scheduleToggle')?.addEventListener('change', (e) => {
        toggleSchedule(e.target.checked);
    });

    // ===== Form Changes → ذخیره خودکار =====
    $('#scheduleInterval')?.addEventListener('change', saveFormToState);
    $('#schedulePeriod')?.addEventListener('change', saveFormToState);
    $('#scheduleProfile')?.addEventListener('change', saveFormToState);
    $('#scheduleCoins')?.addEventListener('input', saveFormToState);

    // ===== Apply Button =====
    $('#applyBtn')?.addEventListener('click', applyChanges);

    // ===== Run Now Button =====
    $('#runNowBtn')?.addEventListener('click', runNow);

    // ===== Logs Refresh =====
    $('#logsRefreshBtn')?.addEventListener('click', async () => {
        const btn = $('#logsRefreshBtn');
        btn?.classList.add('loading');

        await loadHistory();

        setTimeout(() => btn?.classList.remove('loading'), 400);
        showToast('تاریخچه بروزرسانی شد', 'success', 1500);
    });

    // ===== Confirm Modal =====
    $('#confirmOkBtn')?.addEventListener('click', () => {
        const cb = _confirmCallback;
        closeModal('confirmModal');
        _confirmCallback = null;
        if (cb) setTimeout(cb, 100);
    });

    // ===== Modal Close =====
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-overlay')) {
            e.target.classList.remove('open');
            if (!document.querySelector('.modal-overlay.open')) {
                document.body.style.overflow = '';
            }
        }
    });

    $$('[data-close-modal]').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.dataset.closeModal));
    });

    // ===== Escape Key =====
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeModal('confirmModal');
        }
    });
}


// ============================================================
// AUTO REFRESH
// ============================================================
function startAutoRefresh() {
    if (state.autoRefreshTimer) {
        clearInterval(state.autoRefreshTimer);
    }

    state.autoRefreshTimer = setInterval(async () => {
        if (document.visibilityState !== 'visible') return;
        if (state.isUpdating || state.isRunningNow) return;
        if (document.querySelector('.modal-overlay.open')) return;

        await loadStatus();
        await loadHistory();
    }, CONFIG.AUTO_REFRESH);
}

function stopAutoRefresh() {
    if (state.autoRefreshTimer) {
        clearInterval(state.autoRefreshTimer);
        state.autoRefreshTimer = null;
    }
}


// ============================================================
// MESSAGES FROM PARENT SHELL
// ============================================================
function setupMessages() {
    window.addEventListener('message', (e) => {
        if (!e.data || typeof e.data !== 'object') return;

        const { type } = e.data;

        if (type === 'theme-changed') {
            if (e.data.theme) {
                document.documentElement.setAttribute('data-theme', e.data.theme);
            }
            if (e.data.color) {
                document.documentElement.setAttribute('data-color', e.data.color);
            }
        }

        if (type === 'lang-changed') {
            if (e.data.lang) {
                document.documentElement.setAttribute('lang', e.data.lang);
                document.documentElement.setAttribute('dir', e.data.lang === 'fa' ? 'rtl' : 'ltr');
            }
        }

        if (type === 'refresh') {
            loadAll();
        }
    });
}


// ============================================================
// INIT
// ============================================================
async function init() {
    console.log(
        '%c ⏰ Model Schedule v1.0 ',
        'background: linear-gradient(135deg, #a855f7, #c084fc); color: white; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 13px;'
    );

    showInitialLoader();

    // Restore form از localStorage
    restoreFormFromStorage();

    // Load data
    await loadAll();

    // Bind events
    bindEvents();
    setupMessages();

    // Auto refresh
    startAutoRefresh();

    // Hide loader
    hideInitialLoader();

    // Welcome toast
    setTimeout(() => {
        const status = state.status || {};
        if (status.is_running) {
            showToast(`⏰ زمان‌بندی فعال — هر ${state.form.interval_hours} ساعت`, 'success', 2500);
        } else {
            showToast('⏰ زمان‌بندی غیرفعال — آماده برای فعال‌سازی', 'info', 2500);
        }
    }, 600);

    console.log('✅ Model Schedule ready');
}


// ============================================================
// BOOT
// ============================================================
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}


// ============================================================
// CLEANUP
// ============================================================
window.__modelScheduleCleanup = function() {
    stopAutoRefresh();
    stopCountdown();
    window.__modelScheduleLoaded = false;
};

console.log('✅ Model Schedule — JavaScript loaded');

})();
</script>
