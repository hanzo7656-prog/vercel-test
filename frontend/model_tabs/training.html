<!-- ============================================================
     training.html - تب آموزش مدل
     نسخه ۲.۰ - با CSS مشترک model-animations.css
     ============================================================ -->

<div class="card">
    <!-- ============================================================
         HEADER
         ============================================================ -->
    <div class="card-title">
        <i class="fas fa-graduation-cap"></i>
        <span>آموزش مدل</span>
        <span class="model-status-badge demo" id="trainingStatusBadge" style="margin-right:auto;">
            <span class="status-dot"></span>
            <span class="status-text">آماده</span>
        </span>
    </div>

    <!-- ============================================================
         CONTROLS
         ============================================================ -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;margin-bottom:16px;align-items:end;">
        
        <!-- بازه زمانی -->
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
            <label style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">
                <i class="fas fa-clock"></i> بازه زمانی
            </label>
            <select id="trainPeriod" class="analyzer-filter" style="width:100%;">
                <option value="24h">۲۴ ساعت</option>
                <option value="1w">۱ هفته</option>
                <option value="1m" selected>۱ ماه</option>
                <option value="3m">۳ ماه</option>
                <option value="6m">۶ ماه</option>
            </select>
        </div>

        <!-- حالت آموزش -->
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
            <label style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">
                <i class="fas fa-sync-alt"></i> حالت آموزش
            </label>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);flex-wrap:wrap;">
                <label style="font-size:0.7rem;display:flex;align-items:center;gap:6px;cursor:pointer;">
                    <input type="checkbox" id="incrementalToggle" style="accent-color:var(--accent-cyan);">
                    <span>آموزش افزایشی</span>
                </label>
                <span style="font-size:0.55rem;color:var(--text-muted);">(با داده‌های جدید)</span>
            </div>
        </div>

        <!-- تعداد پیشنهاد -->
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
            <label style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">
                <i class="fas fa-list"></i> تعداد پیشنهاد
            </label>
            <select id="defaultCount" class="analyzer-filter" onchange="updateDefaultCount()" style="width:100%;">
                <option value="3">۳ ارز</option>
                <option value="5" selected>۵ ارز</option>
                <option value="10">۱۰ ارز</option>
            </select>
        </div>

        <!-- دکمه‌ها -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-primary" id="startTrainBtn" onclick="startTraining()" 
                    style="padding:10px 24px;font-size:0.8rem;min-width:120px;">
                <i class="fas fa-play"></i>
                شروع آموزش
            </button>
            <button class="btn btn-danger" id="stopTrainBtn" onclick="stopTraining()" 
                    style="padding:10px 20px;font-size:0.8rem;display:none;min-width:120px;">
                <i class="fas fa-stop"></i>
                توقف
            </button>
        </div>
    </div>

    <!-- ============================================================
         COIN SELECTOR
         ============================================================ -->
    <div style="margin-bottom:16px;padding:14px 16px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
        
        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="font-size:0.75rem;font-weight:600;color:var(--text-secondary);">
                    <i class="fas fa-coins"></i>
                    انتخاب ارزها برای آموزش
                </span>
                <span class="model-status-badge demo" id="selectedCount" style="font-size:0.55rem;padding:2px 8px;">
                    <span class="status-dot"></span>
                    <span class="status-text">۰ انتخاب</span>
                </span>
                <span class="model-status-badge active" id="trainedCount" style="font-size:0.55rem;padding:2px 8px;display:none;">
                    <span class="status-dot"></span>
                    <span class="status-text">🧠 آموزش دیده: ۰</span>
                </span>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn btn-xs btn-outline" onclick="selectAllCoins()" 
                        style="padding:3px 10px;font-size:0.6rem;">
                    <i class="fas fa-check-double"></i>
                    همه
                </button>
                <button class="btn btn-xs btn-outline" onclick="deselectAllCoins()" 
                        style="padding:3px 10px;font-size:0.6rem;">
                    <i class="fas fa-times"></i>
                    هیچ‌کدام
                </button>
                <button class="btn btn-xs btn-outline" onclick="selectTrainedCoins()" 
                        style="padding:3px 10px;font-size:0.6rem;display:none;" id="selectTrainedBtn">
                    <i class="fas fa-brain"></i>
                    آموزش‌دیده
                </button>
            </div>
        </div>

        <!-- Search & Filter -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
            <div style="position:relative;flex:1;min-width:150px;">
                <input type="text" id="trainCoinSearch" 
                       placeholder="جستجو در ارزها..." 
                       oninput="debouncedFilterTrainCoins()"
                       style="width:100%;padding:7px 12px;padding-right:32px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.75rem;font-family:inherit;">
                <span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.7rem;pointer-events:none;">🔍</span>
            </div>
            <select id="trainCoinSort" class="analyzer-filter" onchange="filterTrainCoins()">
                <option value="rank_asc">📊 رتبه (صعودی)</option>
                <option value="name_asc">🔤 نام (الفبا)</option>
                <option value="change_desc">📈 بیشترین تغییر</option>
            </select>
            <select id="trainChangeFilter" class="analyzer-filter" onchange="filterTrainCoins()">
                <option value="all">🔄 همه</option>
                <option value="positive">📈 مثبت</option>
                <option value="negative">📉 منفی</option>
                <option value="high">🔥 بیش از ۵٪</option>
            </select>
        </div>

        <!-- Coins List -->
        <div id="trainCoinsGrid" 
             style="display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto;padding:4px 2px;width:100%;">
            <!-- Skeleton -->
            <div class="model-skeleton-card" style="width:120px;">
                <div class="model-skeleton-line short"></div>
            </div>
            <div class="model-skeleton-card" style="width:120px;">
                <div class="model-skeleton-line short"></div>
            </div>
        </div>

        <!-- Info -->
        <div id="trainInfo" style="display:none;margin-top:10px;padding:8px 12px;background:rgba(0,0,0,0.2);border-radius:var(--radius-sm);font-size:0.6rem;color:var(--text-muted);">
            <span id="trainInfoText"></span>
        </div>
    </div>

    <!-- ============================================================
         PROGRESS
         ============================================================ -->
    <div id="trainingProgress" style="display:none;margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:0.75rem;color:var(--text-secondary);" id="progressLabel">در حال آماده‌سازی...</span>
            <span style="font-size:0.75rem;font-weight:600;color:var(--accent-cyan);font-family:'Courier New',monospace;" id="progressPercent">۰%</span>
        </div>
        <div class="model-progress-wrapper">
            <div class="model-progress-fill" id="progressBar" style="width:0%;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:0.6rem;color:var(--text-muted);">
            <span id="progressEta">زمان تخمینی: —</span>
            <span id="progressStatus">⏳ در حال اجرا...</span>
        </div>
    </div>

    <!-- ============================================================
         LOG CONSOLE
         ============================================================ -->
    <div class="model-log-container">
        <div class="model-log-toolbar">
            <button class="btn btn-xs btn-outline" onclick="copyAllLogs()" 
                    style="padding:3px 12px;font-size:0.65rem;">
                <i class="fas fa-copy"></i>
                کپی همه
            </button>
            <button class="btn btn-xs btn-danger" onclick="clearAllLogs()" 
                    style="padding:3px 12px;font-size:0.65rem;">
                <i class="fas fa-trash"></i>
                پاک کردن
            </button>
        </div>
        <div id="trainingLogContainer">
            <div class="model-log-entry">
                <span class="log-time">📋</span>
                <span class="log-message" style="color:var(--text-muted);">منتظر شروع آموزش...</span>
            </div>
            <div class="model-log-entry">
                <span class="log-time">💡</span>
                <span class="log-message" style="color:var(--text-muted);">بازه پیش‌فرض: ۱ ماه</span>
            </div>
            <div class="model-log-entry">
                <span class="log-time">🪙</span>
                <span class="log-message" style="color:var(--text-muted);" id="defaultCoinsLog">۰ ارز انتخاب شده</span>
            </div>
        </div>
    </div>

    <!-- ============================================================
         RESULT
         ============================================================ -->
    <div id="trainingResult" style="display:none;margin-top:16px;padding:16px 20px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-input);animation: modelSlideUp 0.4s ease;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div>
                <div style="font-size:0.7rem;color:var(--text-secondary);">نتیجه آموزش</div>
                <div style="font-size:1rem;font-weight:600;color:var(--text-primary);" id="resultMessage">—</div>
            </div>
            <div style="display:flex;gap:16px;flex-wrap:wrap;">
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">دقت جدید</div>
                    <div style="font-size:1rem;font-weight:700;color:var(--accent-cyan);font-family:'Courier New',monospace;" id="resultAccuracy">—</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">بهبود</div>
                    <div style="font-size:1rem;font-weight:700;font-family:'Courier New',monospace;" id="resultImprovement">—</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">نسخه</div>
                    <div style="font-size:1rem;font-weight:700;color:var(--accent-purple);font-family:'Courier New',monospace;" id="resultVersion">—</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">ارزها</div>
                    <div style="font-size:0.85rem;font-weight:600;color:var(--text-primary);font-family:'Courier New',monospace;" id="resultCoins">—</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// TRAINING TAB v2.0
// ============================================================

// ===== State =====
let trainAllCoins = [];
let trainFilteredCoins = [];
let selectedTrainCoins = [];
let trainedCoins = [];
let isTraining = false;
let trainingInterval = null;
let trainingProgressInterval = null;
let isTrainingLoaded = false;
let defaultCount = 5;
let debounceTimer = null;
let trainingStartTime = 0;

// ============================================================
// ۱. INITIALIZE / CLEANUP
// ============================================================

window.init_training = function() {
    console.log('🎓 Training tab initializing...');
    if (isTrainingLoaded) {
        console.log('⚠️ Already loaded, skipping');
        return;
    }
    isTrainingLoaded = true;
    
    loadTrainCoins();
    
    // auto-refresh هر ۵ دقیقه
    if (trainingInterval) clearInterval(trainingInterval);
    trainingInterval = setInterval(() => {
        const activeTab = document.querySelector('#modelTabs .model-tab-btn.active');
        if (activeTab && activeTab.dataset.tab === 'training') {
            loadTrainCoins();
        }
    }, 300000);
};

window.cleanup_training = function() {
    console.log('🧹 Training tab cleaning up...');
    isTrainingLoaded = false;
    
    if (trainingInterval) {
        clearInterval(trainingInterval);
        trainingInterval = null;
    }
    if (trainingProgressInterval) {
        clearInterval(trainingProgressInterval);
        trainingProgressInterval = null;
    }
    if (debounceTimer) {
        clearTimeout(debounceTimer);
        debounceTimer = null;
    }
};

// ============================================================
// ۲. LOG MANAGEMENT
// ============================================================

function addTrainLog(message) {
    const container = document.getElementById('trainingLogContainer');
    if (!container) return;
    
    const time = new Date().toLocaleTimeString('fa-IR');
    const entry = document.createElement('div');
    entry.className = 'model-log-entry';
    entry.innerHTML = `
        <span class="log-time">${time}</span>
        <span class="log-message">${escapeHtml(message)}</span>
    `;
    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;
}

function copyAllLogs() {
    const container = document.getElementById('trainingLogContainer');
    if (!container) return;
    
    const logs = container.textContent.trim();
    if (!logs) {
        if (typeof showToast === 'function') showToast('⚠️ هیچ لاگی برای کپی وجود ندارد', 'warning');
        return;
    }
    
    copyTextToClipboard(logs, '📋 همه لاگ‌ها کپی شدند');
}

function clearAllLogs() {
    if (!confirm('⚠️ آیا از پاک کردن همه لاگ‌ها اطمینان دارید؟')) return;
    
    const container = document.getElementById('trainingLogContainer');
    if (container) container.innerHTML = '';
    if (typeof showToast === 'function') showToast('🗑️ همه لاگ‌ها پاک شدند', 'success');
}

function copyTextToClipboard(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(() => {
                if (typeof showToast === 'function') showToast(successMsg, 'success');
            })
            .catch(() => fallbackCopy(text, successMsg));
    } else {
        fallbackCopy(text, successMsg);
    }
}

function fallbackCopy(text, successMsg) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
        if (typeof showToast === 'function') showToast(successMsg, 'success');
    } catch (e) {
        if (typeof showToast === 'function') showToast('❌ خطا در کپی', 'error');
    }
    document.body.removeChild(textarea);
}

// ============================================================
// ۳. LOAD COINS
// ============================================================

async function loadTrainCoins() {
    const grid = document.getElementById('trainCoinsGrid');
    if (!grid) return;
    
    showSkeletonLoading(grid);
    
    try {
        const data = await api.getCoinsList({ limit: 200 });
        
        if (data && data.success && data.data && data.data.length > 0) {
            trainAllCoins = data.data;
            await loadTrainedCoins();
            
            const defaultCoins = await getSmartDefaultCoins(trainAllCoins);
            
            if (defaultCoins && defaultCoins.length > 0) {
                selectedTrainCoins = defaultCoins;
            } else {
                selectedTrainCoins = ['bitcoin', 'ethereum'];
            }
            
            trainFilteredCoins = [...trainAllCoins];
            renderTrainCoins();
            updateSelectedCount();
            updateTrainInfo();
            
            const defaultCoinsLog = document.getElementById('defaultCoinsLog');
            if (defaultCoinsLog) {
                defaultCoinsLog.textContent = `${selectedTrainCoins.length} ارز انتخاب شده (${selectedTrainCoins.join(', ')})`;
            }
            
            // ذخیره
            if (typeof saveUserCoinSelection === 'function') {
                saveUserCoinSelection(selectedTrainCoins);
            }
            
            addTrainLog(`🪙 ${selectedTrainCoins.length} ارز به‌صورت پیش‌فرض انتخاب شد`);
            addTrainLog(`📊 بر اساس ترکیبی از رتبه، تغییرات و حجم معاملات`);
            
        } else {
            showEmptyState(grid);
        }
    } catch (error) {
        console.error('❌ Load train coins error:', error);
        showErrorState(grid, error.message);
    }
}

async function loadTrainedCoins() {
    try {
        const history = await api.getModelHistory(50);
        if (history && history.success && history.data) {
            const allTrained = [];
            history.data.forEach(item => {
                if (item.coins && Array.isArray(item.coins)) {
                    allTrained.push(...item.coins);
                }
            });
            trainedCoins = [...new Set(allTrained)];
            
            const trainedCount = document.getElementById('trainedCount');
            const selectTrainedBtn = document.getElementById('selectTrainedBtn');
            
            if (trainedCoins.length > 0) {
                if (trainedCount) {
                    trainedCount.style.display = 'inline-flex';
                    const textEl = trainedCount.querySelector('.status-text');
                    if (textEl) textEl.textContent = `🧠 آموزش دیده: ${trainedCoins.length}`;
                }
                if (selectTrainedBtn) selectTrainedBtn.style.display = 'inline-flex';
            } else {
                if (trainedCount) trainedCount.style.display = 'none';
                if (selectTrainedBtn) selectTrainedBtn.style.display = 'none';
            }
        }
    } catch (error) {
        console.warn('⚠️ Load trained coins error:', error.message);
    }
}

// ============================================================
// ۴. RENDER COINS
// ============================================================

function renderTrainCoins() {
    const grid = document.getElementById('trainCoinsGrid');
    if (!grid) return;
    
    if (trainFilteredCoins.length === 0) {
        grid.innerHTML = `
            <div class="model-empty" style="width:100%;padding:20px;">
                <span class="empty-icon">🔍</span>
                <div class="empty-title">نتیجه‌ای یافت نشد</div>
                <div class="empty-message">فیلتر یا جستجو را تغییر دهید</div>
            </div>
        `;
        return;
    }
    
    grid.innerHTML = trainFilteredCoins.map(coin => {
        const isSelected = selectedTrainCoins.includes(coin.id);
        const isTrained = trainedCoins.includes(coin.id);
        const change = coin.priceChange1d || 0;
        const changeCls = change > 0 ? 'up' : change < 0 ? 'down' : '';
        const changeColor = change > 0 ? 'var(--accent-green)' : change < 0 ? 'var(--accent-red)' : 'var(--text-muted)';
        
        return `
            <label style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:${isSelected ? 'rgba(0,212,255,0.1)' : 'var(--bg-input)'};border:1px solid ${isSelected ? 'var(--accent-cyan)' : 'var(--border-color)'};border-radius:var(--radius-sm);cursor:pointer;transition:all 0.25s ease;font-size:0.7rem;color:var(--text-secondary);white-space:nowrap;flex-shrink:0;"
                   onmouseover="this.style.borderColor='var(--border-hover)';"
                   onmouseout="this.style.borderColor='${isSelected ? 'var(--accent-cyan)' : 'var(--border-color)'}';">
                <input type="checkbox"
                       value="${coin.id}"
                       ${isSelected ? 'checked' : ''}
                       onchange="toggleTrainCoin('${coin.id}')"
                       style="accent-color:var(--accent-cyan);width:14px;height:14px;cursor:pointer;">
                <span style="font-weight:600;color:var(--text-primary);">${escapeHtml(coin.symbol || coin.id.toUpperCase().slice(0,4))}</span>
                <span style="color:var(--text-muted);font-size:0.55rem;max-width:80px;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(coin.name || '')}</span>
                <span style="color:${changeColor};font-size:0.55rem;font-weight:500;">${(change > 0 ? '+' : '') + change.toFixed(2)}%</span>
                ${isTrained ? '<span style="font-size:0.5rem;color:var(--accent-green);">✅</span>' : ''}
            </label>
        `;
    }).join('');
}

// ============================================================
// ۵. SKELETON / EMPTY / ERROR
// ============================================================

function showSkeletonLoading(container) {
    container.innerHTML = Array(6).fill('').map((_, i) => `
        <div class="model-skeleton-card" style="width:120px;animation-delay:${i * 0.05}s;">
            <div class="model-skeleton-line short"></div>
        </div>
    `).join('');
}

function showEmptyState(container) {
    container.innerHTML = `
        <div class="model-empty" style="width:100%;padding:20px;">
            <span class="empty-icon">📭</span>
            <div class="empty-title">هیچ ارزی یافت نشد</div>
        </div>
    `;
}

function showErrorState(container, message) {
    container.innerHTML = `
        <div class="model-empty error" style="width:100%;padding:20px;">
            <span class="empty-icon">❌</span>
            <div class="empty-title">خطا در دریافت ارزها</div>
            <div class="empty-message">${escapeHtml(message || 'خطای نامشخص')}</div>
        </div>
    `;
}

// ============================================================
// ۶. FILTER
// ============================================================

function filterTrainCoins() {
    const search = (document.getElementById('trainCoinSearch')?.value || '').toLowerCase().trim();
    const sort = document.getElementById('trainCoinSort')?.value || 'rank_asc';
    const changeFilter = document.getElementById('trainChangeFilter')?.value || 'all';
    
    trainFilteredCoins = trainAllCoins.filter(coin => {
        const name = (coin.name || '').toLowerCase();
        const symbol = (coin.symbol || '').toLowerCase();
        const id = (coin.id || '').toLowerCase();
        return name.includes(search) || symbol.includes(search) || id.includes(search);
    });
    
    if (changeFilter === 'positive') {
        trainFilteredCoins = trainFilteredCoins.filter(c => (c.priceChange1d || 0) > 0);
    } else if (changeFilter === 'negative') {
        trainFilteredCoins = trainFilteredCoins.filter(c => (c.priceChange1d || 0) < 0);
    } else if (changeFilter === 'high') {
        trainFilteredCoins = trainFilteredCoins.filter(c => (c.priceChange1d || 0) > 5);
    }
    
    const sortFns = {
        'rank_asc': (a, b) => (a.rank || 999) - (b.rank || 999),
        'name_asc': (a, b) => (a.name || '').localeCompare(b.name || ''),
        'change_desc': (a, b) => (b.priceChange1d || 0) - (a.priceChange1d || 0),
    };
    
    if (sortFns[sort]) trainFilteredCoins.sort(sortFns[sort]);
    
    renderTrainCoins();
}

function debouncedFilterTrainCoins() {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(filterTrainCoins, 250);
}

// ============================================================
// ۷. TOGGLE / SELECT
// ============================================================

function toggleTrainCoin(coinId) {
    const index = selectedTrainCoins.indexOf(coinId);
    if (index > -1) {
        selectedTrainCoins.splice(index, 1);
    } else {
        selectedTrainCoins.push(coinId);
    }
    
    if (typeof saveUserCoinSelection === 'function') {
        saveUserCoinSelection(selectedTrainCoins);
    }
    updateSelectedCount();
    updateTrainInfo();
    renderTrainCoins();
}

function selectAllCoins() {
    selectedTrainCoins = trainAllCoins.map(c => c.id);
    if (typeof saveUserCoinSelection === 'function') {
        saveUserCoinSelection(selectedTrainCoins);
    }
    updateSelectedCount();
    updateTrainInfo();
    renderTrainCoins();
}

function deselectAllCoins() {
    selectedTrainCoins = [];
    if (typeof saveUserCoinSelection === 'function') {
        saveUserCoinSelection(selectedTrainCoins);
    }
    updateSelectedCount();
    updateTrainInfo();
    renderTrainCoins();
}

function selectTrainedCoins() {
    if (trainedCoins.length === 0) {
        if (typeof showToast === 'function') showToast('⚠️ هیچ ارزی قبلاً آموزش دیده نیست', 'warning');
        return;
    }
    
    selectedTrainCoins = trainedCoins.filter(id =>
        trainAllCoins.some(c => c.id === id)
    );
    if (typeof saveUserCoinSelection === 'function') {
        saveUserCoinSelection(selectedTrainCoins);
    }
    updateSelectedCount();
    updateTrainInfo();
    renderTrainCoins();
    
    if (typeof showToast === 'function') {
        showToast(`✅ ${selectedTrainCoins.length} ارز آموزش‌دیده انتخاب شد`, 'success');
    }
}

function updateSelectedCount() {
    const el = document.getElementById('selectedCount');
    if (el) {
        const textEl = el.querySelector('.status-text');
        if (textEl) textEl.textContent = `${selectedTrainCoins.length} انتخاب`;
    }
}

function updateTrainInfo() {
    const info = document.getElementById('trainInfo');
    const text = document.getElementById('trainInfoText');
    
    if (!info || !text) return;
    
    if (selectedTrainCoins.length > 0) {
        info.style.display = 'block';
        const selectedNames = selectedTrainCoins.slice(0, 5).map(id => {
            const coin = trainAllCoins.find(c => c.id === id);
            return coin ? coin.symbol : id;
        }).join(', ');
        text.textContent = `📌 ${selectedTrainCoins.length} ارز انتخاب شده: ${selectedNames}${selectedTrainCoins.length > 5 ? ' ...' : ''}`;
    } else {
        info.style.display = 'none';
    }
}

function updateDefaultCount() {
    defaultCount = parseInt(document.getElementById('defaultCount')?.value || 5);
    
    if (typeof getTripleScoreCoins === 'function') {
        const defaultCoins = getTripleScoreCoins(trainAllCoins, defaultCount);
        if (defaultCoins.length > 0) {
            selectedTrainCoins = defaultCoins;
            if (typeof saveUserCoinSelection === 'function') {
                saveUserCoinSelection(selectedTrainCoins);
            }
            updateSelectedCount();
            updateTrainInfo();
            renderTrainCoins();
            addTrainLog(`🔄 تعداد پیشنهاد به ${defaultCount} ارز تغییر کرد`);
        }
    }
}

// ============================================================
// ۸. START TRAINING
// ============================================================

async function startTraining() {
    if (isTraining) {
        if (typeof showToast === 'function') showToast('⏳ آموزش در حال انجام است...', 'warning');
        return;
    }
    
    if (!selectedTrainCoins || selectedTrainCoins.length === 0) {
        if (typeof showToast === 'function') showToast('⚠️ حداقل یک ارز را انتخاب کنید', 'warning');
        return;
    }
    
    const period = document.getElementById('trainPeriod')?.value || '1m';
    const incremental = document.getElementById('incrementalToggle')?.checked || false;
    
    console.log('📤 Starting training:', { period, coins: selectedTrainCoins, incremental });
    
    // نمایش لودینگ
    if (window.loadingSystem && typeof window.loadingSystem.show === 'function') {
        window.loadingSystem.show({
            messages: [
                'در حال آماده‌سازی داده‌ها...|دریافت اطلاعات از API',
                'در حال آموزش مدل XGBoost...|این کار چند دقیقه طول می‌کشد',
                'تقریباً تمام است...|ذخیره‌سازی مدل در دیتابیس'
            ],
            duration: 30000,
            onComplete: function() {
                checkTrainingResult();
            }
        });
    }
    
    isTraining = true;
    trainingStartTime = Date.now();
    
    // UI updates
    const startBtn = document.getElementById('startTrainBtn');
    const stopBtn = document.getElementById('stopTrainBtn');
    const progressEl = document.getElementById('trainingProgress');
    const resultEl = document.getElementById('trainingResult');
    const statusEl = document.getElementById('trainingStatusBadge');
    
    if (startBtn) startBtn.style.display = 'none';
    if (stopBtn) stopBtn.style.display = 'inline-flex';
    if (progressEl) progressEl.style.display = 'block';
    if (resultEl) resultEl.style.display = 'none';
    if (statusEl) {
        statusEl.className = 'model-status-badge training';
        const textEl = statusEl.querySelector('.status-text');
        if (textEl) textEl.textContent = 'در حال آموزش';
    }
    
    // پاک کردن لاگ
    const logEl = document.getElementById('trainingLogContainer');
    if (logEl) logEl.innerHTML = '';
    
    addTrainLog('🚀 شروع آموزش مدل XGBoost');
    addTrainLog(`📊 بازه زمانی: ${period}`);
    addTrainLog(`🪙 ارزها: ${selectedTrainCoins.length} ارز`);
    addTrainLog(`🔄 آموزش افزایشی: ${incremental ? 'فعال' : 'غیرفعال'}`);
    addTrainLog('⏳ در حال ارسال درخواست به سرور...');
    
    startFakeProgress();
    
    try {
        const result = await api.trainModel({
            period: period,
            coins: selectedTrainCoins,
            incremental: incremental
        });
        
        console.log('📥 Response:', result);
        window._trainResult = result;
        
        if (!result || !result.success) {
            stopFakeProgress();
            isTraining = false;
            resetTrainingUI();
            
            const errorMsg = result?.message || result?.error || 'خطا در آموزش';
            if (typeof showToast === 'function') showToast('❌ ' + errorMsg, 'error');
            addTrainLog('❌ ' + errorMsg);
            return;
        }
        
        addTrainLog('✅ درخواست آموزش با موفقیت ارسال شد');
        addTrainLog('⏳ منتظر تکمیل آموزش...');
        
    } catch (error) {
        console.error('❌ Training error:', error);
        
        if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
            window.loadingSystem.hide();
        }
        
        stopFakeProgress();
        isTraining = false;
        resetTrainingUI();
        
        const errorMsg = error.message || 'خطا در ارتباط با سرور';
        if (typeof showToast === 'function') showToast('❌ خطا: ' + errorMsg, 'error');
        addTrainLog('❌ خطا: ' + errorMsg);
    }
}

// ============================================================
// ۹. FAKE PROGRESS (برای UX بهتر)
// ============================================================

function startFakeProgress() {
    let percent = 0;
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const progressStatus = document.getElementById('progressStatus');
    
    if (trainingProgressInterval) clearInterval(trainingProgressInterval);
    
    trainingProgressInterval = setInterval(() => {
        // رشد آرام
        percent += Math.random() * 3 + 0.5;
        if (percent > 95) percent = 95;
        
        if (progressBar) progressBar.style.width = percent + '%';
        if (progressPercent) progressPercent.textContent = Math.round(percent) + '%';
        
        // زمان تخمینی
        const elapsed = (Date.now() - trainingStartTime) / 1000;
        const eta = Math.max(0, 30 - elapsed);
        const etaEl = document.getElementById('progressEta');
        if (etaEl) etaEl.textContent = `زمان تخمینی: ${Math.round(eta)} ثانیه`;
        
        // پیام‌ها
        if (progressStatus) {
            if (percent < 30) progressStatus.textContent = '⏳ در حال آماده‌سازی داده‌ها...';
            else if (percent < 70) progressStatus.textContent = '🧠 در حال آموزش مدل...';
            else progressStatus.textContent = '💾 ذخیره‌سازی...';
        }
    }, 500);
}

function stopFakeProgress() {
    if (trainingProgressInterval) {
        clearInterval(trainingProgressInterval);
        trainingProgressInterval = null;
    }
    
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    if (progressBar) progressBar.style.width = '100%';
    if (progressPercent) progressPercent.textContent = '100%';
}

// ============================================================
// ۱۰. CHECK RESULT
// ============================================================

function checkTrainingResult() {
    const result = window._trainResult;
    console.log('📊 Training result:', result);
    
    stopFakeProgress();
    isTraining = false;
    resetTrainingUI();
    
    if (!result) {
        if (typeof showToast === 'function') showToast('❌ نتیجه‌ای دریافت نشد', 'error');
        addTrainLog('❌ نتیجه‌ای دریافت نشد');
        return;
    }
    
    if (!result.success) {
        if (typeof showToast === 'function') showToast('❌ ' + (result.message || 'خطا'), 'error');
        addTrainLog('❌ ' + (result.message || 'خطا'));
        return;
    }
    
    // نمایش نتیجه
    const resultEl = document.getElementById('trainingResult');
    if (resultEl) resultEl.style.display = 'block';
    
    const messageEl = document.getElementById('resultMessage');
    if (messageEl) messageEl.textContent = result.message || 'آموزش با موفقیت انجام شد';
    
    // دقت
    const accEl = document.getElementById('resultAccuracy');
    if (accEl) {
        if (result.accuracy !== undefined && result.accuracy !== null) {
            accEl.textContent = (result.accuracy * 100).toFixed(2) + '%';
        } else {
            accEl.textContent = '—';
        }
    }
    
    // بهبود
    const impEl = document.getElementById('resultImprovement');
    if (impEl) {
        if (result.improvement !== undefined && result.improvement !== null) {
            const imp = result.improvement * 100;
            impEl.textContent = (imp > 0 ? '+' : '') + imp.toFixed(2) + '%';
            impEl.style.color = imp > 0 ? 'var(--accent-green)' : 'var(--accent-red)';
        } else {
            impEl.textContent = '—';
            impEl.style.color = 'var(--text-muted)';
        }
    }
    
    // نسخه
    const verEl = document.getElementById('resultVersion');
    if (verEl) verEl.textContent = result.version || 'N/A';
    
    // ارزها
    const coinsEl = document.getElementById('resultCoins');
    if (coinsEl) coinsEl.textContent = selectedTrainCoins.length + ' ارز';
    
    // لاگ نهایی
    addTrainLog('✅ آموزش با موفقیت تکمیل شد');
    if (result.accuracy) addTrainLog(`📊 دقت نهایی: ${(result.accuracy * 100).toFixed(2)}%`);
    addTrainLog(`📌 نسخه: ${result.version || 'N/A'}`);
    
    if (typeof showToast === 'function') showToast('✅ آموزش با موفقیت انجام شد', 'success');
    
    // بروزرسانی
    loadTrainedCoins();
    
    // پاک کردن
    window._trainResult = null;
}

function resetTrainingUI() {
    const startBtn = document.getElementById('startTrainBtn');
    const stopBtn = document.getElementById('stopTrainBtn');
    const statusEl = document.getElementById('trainingStatusBadge');
    
    if (startBtn) startBtn.style.display = 'inline-flex';
    if (stopBtn) stopBtn.style.display = 'none';
    if (statusEl) {
        statusEl.className = 'model-status-badge active';
        const textEl = statusEl.querySelector('.status-text');
        if (textEl) textEl.textContent = 'تکمیل شد';
    }
}

// ============================================================
// ۱۱. STOP TRAINING
// ============================================================

async function stopTraining() {
    if (!isTraining) return;
    if (!confirm('⚠️ آیا از توقف آموزش اطمینان دارید؟')) return;
    
    try {
        if (window.loadingSystem && typeof window.loadingSystem.show === 'function') {
            window.loadingSystem.show({
                messages: ['در حال توقف آموزش...'],
                duration: 2000
            });
        }
        
        const result = await api.stopSchedule();
        
        if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
            window.loadingSystem.hide();
        }
        
        stopFakeProgress();
        isTraining = false;
        
        if (result && result.success) {
            resetTrainingUI();
            
            const statusEl = document.getElementById('trainingStatusBadge');
            if (statusEl) {
                statusEl.className = 'model-status-badge demo';
                const textEl = statusEl.querySelector('.status-text');
                if (textEl) textEl.textContent = 'متوقف شد';
            }
            
            addTrainLog('⏹️ آموزش توسط کاربر متوقف شد');
            if (typeof showToast === 'function') showToast('⏹️ آموزش متوقف شد', 'warning');
        }
    } catch (error) {
        if (window.loadingSystem && typeof window.loadingSystem.hide === 'function') {
            window.loadingSystem.hide();
        }
        if (typeof showToast === 'function') showToast('❌ خطا: ' + error.message, 'error');
    }
}

// ============================================================
// ۱۲. UTILS
// ============================================================

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

console.log('✅ Training tab v2.0 loaded');
</script>
