<!-- ============================================================
     TRAINING TAB - آموزش مدل با انتخاب داینامیک ارزها
     ============================================================ -->

<div class="card">
    <div class="card-title">
        <i class="fas fa-graduation-cap"></i> آموزش مدل
        <span class="badge-count" id="trainingStatusBadge" style="margin-right:auto;font-size:0.6rem;color:var(--text-muted);">⏹️ آماده</span>
    </div>

    <!-- ===== CONTROLS ===== -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;margin-bottom:16px;align-items:end;">
        <!-- بازه زمانی -->
        <div style="display:flex;flex-direction:column;gap:4px;">
            <label style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">
                <i class="fas fa-clock"></i> بازه زمانی
            </label>
            <select id="trainPeriod" style="padding:8px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.8rem;font-family:inherit;transition:var(--transition);">
                <option value="24h">۲۴ ساعت</option>
                <option value="1w">۱ هفته</option>
                <option value="1m" selected>۱ ماه</option>
                <option value="3m">۳ ماه</option>
                <option value="6m">۶ ماه</option>
            </select>
        </div>

        <!-- آموزش افزایشی -->
        <div style="display:flex;flex-direction:column;gap:4px;">
            <label style="font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">
                <i class="fas fa-sync-alt"></i> حالت آموزش
            </label>
            <div style="display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);">
                <label style="font-size:0.7rem;display:flex;align-items:center;gap:6px;cursor:pointer;">
                    <input type="checkbox" id="incrementalToggle"> 
                    <span>آموزش افزایشی</span>
                </label>
                <span style="font-size:0.55rem;color:var(--text-muted);">(با داده‌های جدید)</span>
            </div>
        </div>

        <!-- دکمه‌ها -->
        <div style="display:flex;gap:8px;grid-column:span 1;">
            <button class="btn btn-primary" id="startTrainBtn" onclick="startTraining()" style="padding:8px 24px;font-size:0.8rem;">
                <i class="fas fa-play"></i> شروع آموزش
            </button>
            <button class="btn btn-danger" id="stopTrainBtn" onclick="stopTraining()" style="padding:8px 20px;font-size:0.8rem;display:none;">
                <i class="fas fa-stop"></i> توقف
            </button>
        </div>
    </div>

    <!-- ===== COIN SELECTOR ===== -->
    <div style="margin-bottom:16px;padding:12px 14px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:0.7rem;font-weight:600;color:var(--text-secondary);">
                    <i class="fas fa-coins"></i> انتخاب ارزها برای آموزش
                </span>
                <span class="badge badge-cyan" id="selectedCount" style="font-size:0.55rem;padding:2px 8px;">۰ انتخاب</span>
            </div>
            <div style="display:flex;gap:6px;">
                <button class="btn btn-xs btn-outline" onclick="selectAllCoins()" style="padding:2px 10px;font-size:0.6rem;">
                    <i class="fas fa-check-double"></i> همه
                </button>
                <button class="btn btn-xs btn-outline" onclick="deselectAllCoins()" style="padding:2px 10px;font-size:0.6rem;">
                    <i class="fas fa-times"></i> هیچ‌کدام
                </button>
            </div>
        </div>

        <!-- جستجو و فیلتر -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
            <input type="text" id="trainCoinSearch" placeholder="🔍 جستجو در ارزها..." onkeyup="filterTrainCoins()" style="flex:1;min-width:150px;padding:4px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.7rem;font-family:inherit;">
            <select id="trainCoinSort" onchange="filterTrainCoins()" style="padding:4px 8px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.65rem;font-family:inherit;">
                <option value="rank_asc">📊 رتبه (صعودی)</option>
                <option value="name_asc">🔤 نام (الفبا)</option>
                <option value="change_desc">📈 بیشترین تغییر</option>
            </select>
        </div>

        <!-- لیست ارزها -->
        <div id="trainCoinsGrid" style="display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto;padding:4px 2px;">
            <div class="loading-container" style="padding:20px;width:100%;">
                <div class="loading-spinner" style="width:24px;height:24px;"></div>
                <p class="loading-text" style="font-size:0.7rem;">در حال بارگذاری ارزها...</p>
            </div>
        </div>
    </div>

    <!-- ===== PROGRESS ===== -->
    <div id="trainingProgress" style="display:none;margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:0.7rem;color:var(--text-secondary);" id="progressLabel">در حال آماده‌سازی...</span>
            <span style="font-size:0.7rem;font-weight:600;color:var(--accent-cyan);font-family:var(--font-mono);" id="progressPercent">۰%</span>
        </div>
        <div style="width:100%;height:6px;background:var(--bg-input);border-radius:var(--radius-full);overflow:hidden;">
            <div id="progressBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent-cyan),var(--accent-purple));border-radius:var(--radius-full);transition:width 0.5s ease;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:0.55rem;color:var(--text-muted);">
            <span id="progressEta">زمان تخمینی: —</span>
            <span id="progressStatus">⏳ در حال اجرا...</span>
        </div>
    </div>

    <!-- ===== LOG CONSOLE ===== -->
    <div style="background:rgba(0,0,0,0.4);border-radius:var(--radius-sm);padding:12px 14px;border:1px solid var(--border-color);max-height:200px;overflow-y:auto;font-family:var(--font-mono);font-size:0.7rem;color:var(--text-secondary);" id="trainingLog">
        <div style="color:var(--text-muted);padding:4px 0;">📋 منتظر شروع آموزش...</div>
        <div style="color:var(--text-muted);padding:4px 0;">💡 بازه پیش‌فرض: ۱ ماه</div>
        <div style="color:var(--text-muted);padding:4px 0;">🪙 ارزهای پیش‌فرض: bitcoin, ethereum</div>
    </div>

    <!-- ===== RESULT ===== -->
    <div id="trainingResult" style="display:none;margin-top:16px;padding:14px 18px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-input);">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div>
                <div style="font-size:0.7rem;color:var(--text-secondary);">نتیجه آموزش</div>
                <div style="font-size:1rem;font-weight:600;" id="resultMessage">—</div>
            </div>
            <div style="display:flex;gap:16px;">
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">دقت جدید</div>
                    <div style="font-size:1rem;font-weight:700;color:var(--accent-cyan);font-family:var(--font-mono);" id="resultAccuracy">—</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">بهبود</div>
                    <div style="font-size:1rem;font-weight:700;font-family:var(--font-mono);" id="resultImprovement">—</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:0.55rem;color:var(--text-muted);">نسخه</div>
                    <div style="font-size:1rem;font-weight:700;color:var(--accent-purple);font-family:var(--font-mono);" id="resultVersion">—</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// TRAINING TAB - با انتخاب داینامیک ارزها
// ============================================================

let trainAllCoins = [];
let trainFilteredCoins = [];
let selectedTrainCoins = [];
let isTraining = false;
let trainingInterval = null;
let isTrainingLoaded = false;

// ===== بارگذاری لیست ارزها =====
async function loadTrainCoins() {
    const grid = document.getElementById('trainCoinsGrid');
    grid.innerHTML = `
        <div class="loading-container" style="padding:20px;width:100%;">
            <div class="loading-spinner" style="width:24px;height:24px;"></div>
            <p class="loading-text" style="font-size:0.7rem;">در حال بارگذاری ارزها...</p>
        </div>
    `;

    try {
        const data = await api.getCoinsList({ limit: 100 });
        
        if (data.success && data.data) {
            trainAllCoins = data.data;
            
            // انتخاب پیش‌فرض: bitcoin و ethereum
            const defaultCoins = ['bitcoin', 'ethereum'];
            selectedTrainCoins = trainAllCoins
                .filter(c => defaultCoins.includes(c.id))
                .map(c => c.id);
            
            trainFilteredCoins = [...trainAllCoins];
            renderTrainCoins();
            updateSelectedCount();
        } else {
            grid.innerHTML = `
                <div style="text-align:center;padding:20px;color:var(--text-muted);width:100%;">
                    <span style="font-size:1.5rem;display:block;margin-bottom:4px;">📭</span>
                    <p style="font-size:0.7rem;">هیچ ارزی یافت نشد</p>
                </div>
            `;
        }
    } catch (error) {
        console.error('Load train coins error:', error);
        grid.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--accent-red);width:100%;">
                <span style="font-size:1.5rem;display:block;margin-bottom:4px;">❌</span>
                <p style="font-size:0.7rem;">خطا در دریافت لیست ارزها</p>
            </div>
        `;
    }
}

// ===== رندر لیست ارزهای آموزش =====
function renderTrainCoins() {
    const grid = document.getElementById('trainCoinsGrid');
    
    if (trainFilteredCoins.length === 0) {
        grid.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--text-muted);width:100%;">
                <span style="font-size:1.5rem;display:block;margin-bottom:4px;">🔍</span>
                <p style="font-size:0.7rem;">هیچ ارزی با این جستجو یافت نشد</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = trainFilteredCoins.map(coin => {
        const isSelected = selectedTrainCoins.includes(coin.id);
        const change = coin.priceChange1d || 0;
        const changeColor = change > 0 ? 'var(--accent-green)' : change < 0 ? 'var(--accent-red)' : 'var(--text-muted)';
        
        return `
            <label style="display:flex;align-items:center;gap:6px;padding:4px 10px;background:${isSelected ? 'rgba(0,212,255,0.08)' : 'var(--bg-input)'};border:1px solid ${isSelected ? 'var(--accent-cyan)' : 'var(--border-color)'};border-radius:var(--radius-sm);cursor:pointer;transition:all 0.2s ease;font-size:0.65rem;color:var(--text-secondary);"
                   onmouseover="this.style.borderColor='var(--border-hover)';"
                   onmouseout="this.style.borderColor='${isSelected ? 'var(--accent-cyan)' : 'var(--border-color)'}';">
                <input type="checkbox" 
                       value="${coin.id}" 
                       ${isSelected ? 'checked' : ''} 
                       onchange="toggleTrainCoin('${coin.id}')"
                       style="accent-color:var(--accent-cyan);width:14px;height:14px;cursor:pointer;">
                <span style="font-weight:500;color:var(--text-primary);">${coin.symbol || coin.id.toUpperCase().slice(0,4)}</span>
                <span style="color:var(--text-muted);font-size:0.55rem;">${coin.name || ''}</span>
                <span style="color:${changeColor};font-size:0.55rem;font-weight:500;">${(change > 0 ? '+' : '') + change.toFixed(2)}%</span>
            </label>
        `;
    }).join('');
}

// ===== فیلتر ارزهای آموزش =====
function filterTrainCoins() {
    const search = document.getElementById('trainCoinSearch').value.toLowerCase().trim();
    const sort = document.getElementById('trainCoinSort').value;
    
    trainFilteredCoins = trainAllCoins.filter(coin => {
        const name = (coin.name || '').toLowerCase();
        const symbol = (coin.symbol || '').toLowerCase();
        const id = (coin.id || '').toLowerCase();
        return name.includes(search) || symbol.includes(search) || id.includes(search);
    });
    
    switch(sort) {
        case 'rank_asc':
            trainFilteredCoins.sort((a, b) => (a.rank || 999) - (b.rank || 999));
            break;
        case 'name_asc':
            trainFilteredCoins.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            break;
        case 'change_desc':
            trainFilteredCoins.sort((a, b) => (b.priceChange1d || 0) - (a.priceChange1d || 0));
            break;
    }
    
    renderTrainCoins();
}

// ===== تغییر انتخاب یک ارز =====
function toggleTrainCoin(coinId) {
    const index = selectedTrainCoins.indexOf(coinId);
    if (index > -1) {
        selectedTrainCoins.splice(index, 1);
    } else {
        selectedTrainCoins.push(coinId);
    }
    updateSelectedCount();
    renderTrainCoins();
}

// ===== انتخاب همه ارزها =====
function selectAllCoins() {
    selectedTrainCoins = trainAllCoins.map(c => c.id);
    updateSelectedCount();
    renderTrainCoins();
}

// ===== لغو انتخاب همه ارزها =====
function deselectAllCoins() {
    selectedTrainCoins = [];
    updateSelectedCount();
    renderTrainCoins();
}

// ===== بروزرسانی تعداد انتخاب‌ها =====
function updateSelectedCount() {
    document.getElementById('selectedCount').textContent = selectedTrainCoins.length + ' انتخاب';
}

// ===== شروع آموزش =====
async function startTraining() {
    if (isTraining) return;
    if (selectedTrainCoins.length === 0) {
        showToast('⚠️ حداقل یک ارز را انتخاب کنید', 'warning');
        return;
    }

    const period = document.getElementById('trainPeriod').value;
    const incremental = document.getElementById('incrementalToggle').checked;

    // نمایش لودینگ
    loading.show({
        messages: [
            'در حال آماده‌سازی داده‌ها...|دریافت اطلاعات از API',
            'در حال آموزش مدل XGBoost...|این کار چند دقیقه طول می‌کشد',
            'تقریباً تمام است...|ذخیره‌سازی مدل در دیتابیس',
            'پایان|مدل با موفقیت آموزش دید ✅'
        ],
        duration: 30000,
        onComplete: function() {
            checkTrainingResult();
        }
    });

    isTraining = true;
    trainingStartTime = Date.now();

    document.getElementById('startTrainBtn').style.display = 'none';
    document.getElementById('stopTrainBtn').style.display = 'inline-flex';
    document.getElementById('trainingProgress').style.display = 'block';
    document.getElementById('trainingResult').style.display = 'none';
    document.getElementById('trainingStatusBadge').textContent = '⏳ در حال آموزش';
    document.getElementById('trainingStatusBadge').style.color = 'var(--accent-orange)';

    // پاک کردن لاگ
    const logEl = document.getElementById('trainingLog');
    logEl.innerHTML = '';

    addTrainLog('🚀 شروع آموزش مدل XGBoost');
    addTrainLog(`📊 بازه زمانی: ${period}`);
    addTrainLog(`🪙 ارزها: ${selectedTrainCoins.length} ارز (${selectedTrainCoins.join(', ')})`);
    addTrainLog(`🔄 آموزش افزایشی: ${incremental ? 'فعال' : 'غیرفعال'}`);
    addTrainLog('⏳ در حال دریافت داده‌ها...');

    try {
        const result = await api.trainModel({
            period: period,
            coins: selectedTrainCoins,
            incremental: incremental
        });

        window._trainResult = result;
        window._trainComplete = true;

        if (!result.success) {
            loading.hide();
            isTraining = false;
            document.getElementById('startTrainBtn').style.display = 'inline-flex';
            document.getElementById('stopTrainBtn').style.display = 'none';
            document.getElementById('trainingStatusBadge').textContent = '❌ خطا';
            document.getElementById('trainingStatusBadge').style.color = 'var(--accent-red)';
            document.getElementById('trainingProgress').style.display = 'none';
            showToast('❌ ' + (result.message || 'خطا در آموزش'), 'error');
            addTrainLog('❌ ' + (result.message || 'خطا در آموزش'));
        }
    } catch (error) {
        loading.hide();
        isTraining = false;
        document.getElementById('startTrainBtn').style.display = 'inline-flex';
        document.getElementById('stopTrainBtn').style.display = 'none';
        document.getElementById('trainingStatusBadge').textContent = '❌ خطا';
        document.getElementById('trainingStatusBadge').style.color = 'var(--accent-red)';
        document.getElementById('trainingProgress').style.display = 'none';
        showToast('❌ خطا: ' + error.message, 'error');
        addTrainLog('❌ خطا: ' + error.message);
    }
}

// ===== بررسی نتیجه آموزش =====
function checkTrainingResult() {
    const result = window._trainResult;
    if (!result) return;

    isTraining = false;
    document.getElementById('startTrainBtn').style.display = 'inline-flex';
    document.getElementById('stopTrainBtn').style.display = 'none';
    document.getElementById('trainingProgress').style.display = 'none';
    document.getElementById('trainingStatusBadge').textContent = '✅ تکمیل';
    document.getElementById('trainingStatusBadge').style.color = 'var(--accent-green)';

    document.getElementById('trainingResult').style.display = 'block';
    document.getElementById('resultMessage').textContent = result.message || 'آموزش با موفقیت انجام شد';
    document.getElementById('resultAccuracy').textContent = result.accuracy ? (result.accuracy * 100).toFixed(2) + '%' : '—';
    
    if (result.improvement !== undefined && result.improvement !== null) {
        const imp = result.improvement * 100;
        document.getElementById('resultImprovement').textContent = (imp > 0 ? '+' : '') + imp.toFixed(2) + '%';
        document.getElementById('resultImprovement').style.color = imp > 0 ? 'var(--accent-green)' : 'var(--accent-red)';
    } else {
        document.getElementById('resultImprovement').textContent = '—';
        document.getElementById('resultImprovement').style.color = 'var(--text-muted)';
    }
    
    document.getElementById('resultVersion').textContent = result.version || 'N/A';

    addTrainLog('✅ آموزش با موفقیت تکمیل شد');
    addTrainLog(`📊 دقت نهایی: ${result.accuracy ? (result.accuracy * 100).toFixed(2) + '%' : '—'}`);
    addTrainLog(`📌 نسخه: ${result.version || 'N/A'}`);

    showToast('✅ آموزش با موفقیت انجام شد', 'success');
}

// ===== توقف آموزش =====
async function stopTraining() {
    if (!isTraining) return;
    if (!confirm('⚠️ آیا از توقف آموزش اطمینان دارید؟')) return;

    try {
        loading.show({
            messages: ['در حال توقف آموزش...'],
            duration: 3000,
            onComplete: function() { /* ادامه */ }
        });

        const result = await api.stopSchedule();
        loading.hide();

        if (result.success) {
            isTraining = false;
            document.getElementById('startTrainBtn').style.display = 'inline-flex';
            document.getElementById('stopTrainBtn').style.display = 'none';
            document.getElementById('trainingProgress').style.display = 'none';
            document.getElementById('trainingStatusBadge').textContent = '⏹️ متوقف شد';
            document.getElementById('trainingStatusBadge').style.color = 'var(--accent-orange)';
            addTrainLog('⏹️ آموزش توسط کاربر متوقف شد');
            showToast('⏹️ آموزش متوقف شد', 'warning');
        }
    } catch (error) {
        loading.hide();
        showToast('❌ خطا: ' + error.message, 'error');
    }
}

// ===== افزودن لاگ =====
function addTrainLog(message) {
    const logEl = document.getElementById('trainingLog');
    const time = new Date().toLocaleTimeString('fa-IR');
    const entry = document.createElement('div');
    entry.style.cssText = 'padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.02);display:flex;gap:10px;';
    entry.innerHTML = `
        <span style="color:var(--text-muted);min-width:60px;font-size:0.6rem;">${time}</span>
        <span style="color:var(--text-secondary);">${message}</span>
    `;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
}

// ===== مقداردهی اولیه =====
window.init_training = function() {
    console.log('🎓 Training tab initializing...');
    
    if (isTrainingLoaded) return;
    isTrainingLoaded = true;
    
    loadTrainCoins();
    
    // بروزرسانی هر ۵ دقیقه
    if (trainingInterval) {
        clearInterval(trainingInterval);
    }
    trainingInterval = setInterval(() => {
        const activeTab = document.querySelector('#modelTabs .tab-btn.active');
        if (activeTab && activeTab.dataset.tab === 'training') {
            loadTrainCoins();
        }
    }, 300000);
};

// ===== پاکسازی =====
window.cleanup_training = function() {
    if (trainingInterval) {
        clearInterval(trainingInterval);
        trainingInterval = null;
    }
    isTrainingLoaded = false;
    console.log('🧹 Training tab cleaned up');
};

console.log('✅ Training tab loaded (dynamic coins)');
</script>
