<!-- ============================================================
     model_tabs/features.html — تب اهمیت ویژگی‌ها
     نسخه ۳.۰ — با init/cleanup استاندارد + Detail Modal
     ============================================================ -->

<!-- ============================================================
     HERO SECTION
     ============================================================ -->
<div class="hero-card" id="featuresHero">

    <div class="health-circle-wrapper">
        <svg class="health-circle" viewBox="0 0 140 140">
            <circle class="circle-bg" cx="70" cy="70" r="65"/>
            <circle class="circle-fill" cx="70" cy="70" r="65" id="featuresCircle"/>
        </svg>
        <div class="health-score-value">
            <span class="health-score-number" id="featuresCountHero">۰</span>
            <span class="health-score-label">ویژگی</span>
        </div>
    </div>

    <div class="hero-info">
        <h2 class="hero-title">
            <i class="fas fa-chart-bar" style="color:var(--color-green);"></i>
            <span>اهمیت ویژگی‌ها</span>
            <span class="badge-version" id="topFeatureBadge">—</span>
        </h2>
        <p class="hero-subtitle" id="featuresSubtitle">
            تحلیل اهمیت ویژگی‌ها در مدل XGBoost
        </p>
        <div class="hero-metrics">
            <div class="hero-metric">
                <span class="hero-metric-label">تعداد ویژگی‌ها</span>
                <span class="hero-metric-value cyan" id="heroTotalFeatures">۰</span>
            </div>
            <div class="hero-metric">
                <span class="hero-metric-label">ویژگی برتر</span>
                <span class="hero-metric-value green" id="heroTopFeature">—</span>
            </div>
            <div class="hero-metric">
                <span class="hero-metric-label">سهم برتر</span>
                <span class="hero-metric-value purple" id="heroTopPercent">—</span>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================
     TOOLBAR
     ============================================================ -->
<div class="card-section" style="margin-bottom:var(--space-5);">
    <div class="section-header-model">
        <div class="section-title-model">
            <i class="fas fa-filter"></i>
            <span>فیلتر و مرتب‌سازی</span>
        </div>
        <span class="section-badge-model" id="filteredCount">
            <i class="fas fa-list"></i>
            <span>۰</span>
        </span>
    </div>

    <div class="features-toolbar">
        <div class="training-search">
            <input type="text" id="featuresSearch"
                   class="form-input"
                   placeholder="جستجو در ویژگی‌ها..."
                   oninput="debouncedFilterFeatures()">
            <span class="search-icon">🔍</span>
        </div>

        <select id="featuresSort" class="form-select" onchange="filterFeatures()">
            <option value="importance_desc">⬇️ بیشترین اهمیت</option>
            <option value="importance_asc">⬆️ کمترین اهمیت</option>
            <option value="name_asc">🔤 نام (الفبا)</option>
            <option value="name_desc">🔤 نام (معکوس)</option>
        </select>

        <select id="featuresTypeFilter" class="form-select" onchange="filterFeatures()">
            <option value="all">🔄 همه</option>
            <option value="top5">⭐ ۵ برتر</option>
            <option value="top10">⭐ ۱۰ برتر</option>
        </select>

        <div class="toolbar-actions">
            <button class="btn btn-xs btn-outline" onclick="exportFeaturesCSV()" title="CSV">
                <i class="fas fa-file-csv"></i>
                <span>CSV</span>
            </button>
            <button class="btn btn-xs btn-outline" onclick="toggleFeaturesChartType()" id="chartToggleBtn" title="تغییر نمودار">
                <i class="fas fa-exchange-alt"></i>
                <span>تغییر</span>
            </button>
        </div>
    </div>
</div>

<!-- ============================================================
     CHART + LIST (دو ستونه)
     ============================================================ -->
<div class="live-row">

    <!-- Chart -->
    <div class="card-section">
        <div class="section-header-model">
            <div class="section-title-model">
                <i class="fas fa-chart-bar"></i>
                <span id="chartTitle">نمودار اهمیت</span>
            </div>
            <span class="section-badge-model" id="chartTypeBadge">
                <i class="fas fa-chart-bar"></i>
                <span>Bar</span>
            </span>
        </div>

        <div class="chart-features-wrapper">
            <canvas id="featuresChart"></canvas>
        </div>
    </div>

    <!-- List -->
    <div class="card-section">
        <div class="section-header-model">
            <div class="section-title-model">
                <i class="fas fa-list"></i>
                <span>لیست ویژگی‌ها</span>
            </div>
            <span class="section-badge-model">
                <i class="fas fa-mouse-pointer"></i>
                <span>کلیک کنید</span>
            </span>
        </div>

        <div id="featuresList" class="features-list">
            <div class="feature-item-skeleton">
                <div class="skeleton-model skeleton-sm" style="width:24px;height:24px;border-radius:50%;"></div>
                <div style="flex:1;">
                    <div class="skeleton-model skeleton-sm" style="width:70%;margin-bottom:6px;"></div>
                    <div class="skeleton-model skeleton-sm" style="width:40%;"></div>
                </div>
                <div class="skeleton-model skeleton-sm" style="width:50px;"></div>
            </div>
            <div class="feature-item-skeleton">
                <div class="skeleton-model skeleton-sm" style="width:24px;height:24px;border-radius:50%;"></div>
                <div style="flex:1;">
                    <div class="skeleton-model skeleton-sm" style="width:70%;margin-bottom:6px;"></div>
                    <div class="skeleton-model skeleton-sm" style="width:40%;"></div>
                </div>
                <div class="skeleton-model skeleton-sm" style="width:50px;"></div>
            </div>
            <div class="feature-item-skeleton">
                <div class="skeleton-model skeleton-sm" style="width:24px;height:24px;border-radius:50%;"></div>
                <div style="flex:1;">
                    <div class="skeleton-model skeleton-sm" style="width:70%;margin-bottom:6px;"></div>
                    <div class="skeleton-model skeleton-sm" style="width:40%;"></div>
                </div>
                <div class="skeleton-model skeleton-sm" style="width:50px;"></div>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================
     DETAIL MODAL
     ============================================================ -->
<div id="featureDetailModal" class="modal-overlay" onclick="if(event.target===this) closeFeatureDetail()">
    <div class="modal" style="max-width:480px;">

        <div class="modal-header">
            <div class="modal-title">
                <i class="fas fa-info-circle"></i>
                <span>جزئیات ویژگی</span>
            </div>
            <button class="modal-close" onclick="closeFeatureDetail()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body">
            <!-- Hero -->
            <div class="modal-hero">
                <div class="modal-hero-icon" id="featureDetailIcon">📊</div>
                <div class="modal-hero-info">
                    <div class="modal-hero-version" id="featureDetailName">—</div>
                    <div class="modal-hero-accuracy" id="featureDetailCode">—</div>
                </div>
            </div>

            <!-- Stats -->
            <div class="modal-stats-grid">
                <div class="modal-stat">
                    <span class="modal-stat-label">اهمیت</span>
                    <span class="modal-stat-value green" id="featureDetailImportance">—</span>
                </div>
                <div class="modal-stat">
                    <span class="modal-stat-label">درصد</span>
                    <span class="modal-stat-value cyan" id="featureDetailPercent">—</span>
                </div>
            </div>

            <!-- Info -->
            <div class="modal-info-list">
                <div class="modal-info-row">
                    <span class="modal-info-label">
                        <i class="fas fa-tag"></i>
                        <span>نام کد</span>
                    </span>
                    <span class="modal-info-value" id="featureDetailCodeValue">—</span>
                </div>
                <div class="modal-info-row">
                    <span class="modal-info-label">
                        <i class="fas fa-sort-numeric-up"></i>
                        <span>رتبه</span>
                    </span>
                    <span class="modal-info-value" id="featureDetailRank">—</span>
                </div>
            </div>

            <!-- Description -->
            <div class="feature-description-box">
                <div class="feature-description-title">
                    <i class="fas fa-info-circle"></i>
                    <span>توضیحات</span>
                </div>
                <div class="feature-description-text" id="featureDetailDescription">—</div>
            </div>

        <div class="modal-footer">
            <button class="btn btn-primary btn-sm" onclick="closeFeatureDetail()" style="flex:1;">
                <i class="fas fa-check"></i>
                <span>متوجه شدم</span>
            </button>
        </div>
    </div>
</div>

<script>
// ============================================================
// MODEL FEATURES TAB v3.0
// ============================================================

let _featuresData = [];
let _featuresFiltered = [];
let _featuresChart = null;
let _featuresInterval = null;
let _featuresDebounceTimer = null;
let _featuresInitialized = false;
let _featuresCurrentChartType = 'bar';
let _featuresSelectedFeature = null;

// ============================================================
// Feature Names + Descriptions
// ============================================================

const FEATURE_NAMES = {
    f0: { name: 'بازده ۱ روزه', desc: 'درصد تغییر قیمت در ۲۴ ساعت گذشته. نشان‌دهنده روند کوتاه‌مدت.' },
    f1: { name: 'بازده ۳ روزه', desc: 'درصد تغییر قیمت در ۳ روز گذشته. نشان‌دهنده روند میان‌مدت.' },
    f2: { name: 'بازده ۵ روزه', desc: 'درصد تغییر قیمت در ۵ روز گذشته.' },
    f3: { name: 'بازده ۱۰ روزه', desc: 'درصد تغییر قیمت در ۱۰ روز گذشته.' },
    f4: { name: 'SMA ۵', desc: 'میانگین متحرک ساده ۵ روزه. نشان‌دهنده روند کوتاه‌مدت.' },
    f5: { name: 'SMA ۱۰', desc: 'میانگین متحرک ساده ۱۰ روزه.' },
    f6: { name: 'SMA ۲۰', desc: 'میانگین متحرک ساده ۲۰ روزه. نشان‌دهنده روند میان‌مدت.' },
    f7: { name: 'نوسان', desc: 'میزان نوسان قیمت در بازه مشخص. معیار ریسک.' },
    f8: { name: 'ترس و طمع', desc: 'شاخص احساسات بازار (Fear & Greed Index).' },
    f9: { name: 'روند ۵ روزه', desc: 'قدرت روند صعودی/نزولی در ۵ روز گذشته.' },
    f10: { name: 'روند ۱۰ روزه', desc: 'قدرت روند در ۱۰ روز گذشته.' },
    f11: { name: 'روند ۲۰ روزه', desc: 'قدرت روند در ۲۰ روز گذشته.' },
    f12: { name: 'قدرت روند (R²)', desc: 'ضریب تعیین. نشان‌دهنده کیفیت روند.' },
    f13: { name: 'سلطه بیت‌کوین', desc: 'درصد سلطه بیت‌کوین بر کل بازار کریپتو.' },
    f14: { name: 'حجم بازار', desc: 'حجم کل معاملات بازار.' },
    f15: { name: 'حجم کل', desc: 'حجم کل معاملات ارز مورد نظر.' },
};

function getFeatureInfo(feature) {
    return FEATURE_NAMES[feature] || { name: feature, desc: 'ویژگی سفارشی' };
}

// ============================================================
// Init
// ============================================================

window.init_features = function() {
    console.log('📊 Model features tab initializing...');

    if (_featuresInitialized) return;
    _featuresInitialized = true;

    loadFeatures();

    if (_featuresInterval) clearInterval(_featuresInterval);
    _featuresInterval = setInterval(() => {
        const activeTab = document.querySelector('#modelTabs .model-tab-btn.active');
        if (activeTab?.dataset.tab === 'features') {
            loadFeatures();
        }
    }, 60000);
};

// ============================================================
// Cleanup
// ============================================================

window.cleanup_features = function() {
    console.log('🧹 Model features tab cleaning up...');

    if (_featuresInterval) {
        clearInterval(_featuresInterval);
        _featuresInterval = null;
    }
    if (_featuresDebounceTimer) {
        clearTimeout(_featuresDebounceTimer);
        _featuresDebounceTimer = null;
    }
    if (_featuresChart) {
        _featuresChart.destroy();
        _featuresChart = null;
    }

    _featuresInitialized = false;
};

// ============================================================
// Load Features
// ============================================================

async function loadFeatures() {
    const listEl = document.getElementById('featuresList');
    if (!listEl) return;

    try {
        // ✅ api.getModelImportance() (موجود در api.js)
        const data = await window.api?.getModelImportance?.();

        if (data?.success && data.data && data.data.length > 0) {
            _featuresData = data.data.map(f => {
                const info = getFeatureInfo(f.feature);
                return {
                    ...f,
                    displayName: info.name,
                    description: info.desc,
                };
            });

            // مرتب‌سازی پیش‌فرض
            _featuresData.sort((a, b) => b.importance - a.importance);

            _featuresFiltered = [..._featuresData];

            updateFeaturesHeroStats();
            renderFeatures();
            renderFeaturesChart();
        } else {
            showFeaturesEmpty();
        }
    } catch (error) {
        console.error('❌ Features error:', error);
        showFeaturesError(error.message);
    }
}

// ============================================================
// Hero Stats
// ============================================================

function updateFeaturesHeroStats() {
    const totalEl = document.getElementById('heroTotalFeatures');
    if (totalEl) totalEl.textContent = _featuresData.length;

    const heroCount = document.getElementById('featuresCountHero');
    if (heroCount) heroCount.textContent = _featuresData.length;

    if (_featuresData.length > 0) {
        const top = _featuresData[0];
        const topPercent = top.percentage || (top.importance * 100);

        setText('heroTopFeature', top.displayName);
        setText('heroTopPercent', topPercent.toFixed(1) + '%');
        setText('topFeatureBadge', top.displayName);

        updateFeaturesCircle(Math.min(topPercent * 3, 100));
    }
}

function updateFeaturesCircle(percent) {
    const circle = document.getElementById('featuresCircle');
    if (!circle) return;

    const circumference = 2 * Math.PI * 65;
    const offset = circumference - (percent / 100) * circumference;

    circle.style.strokeDasharray = circumference;
    circle.style.strokeDashoffset = circumference;
    circle.style.transition = 'none';

    void circle.offsetWidth;

    circle.style.transition = 'stroke-dashoffset 1.5s var(--ease-out)';
    circle.style.strokeDashoffset = offset;
}

// ============================================================
// Render Features List
// ============================================================

function renderFeatures() {
    const container = document.getElementById('featuresList');
    if (!container) return;

    const search = (document.getElementById('featuresSearch')?.value || '').toLowerCase().trim();
    const sort = document.getElementById('featuresSort')?.value || 'importance_desc';
    const typeFilter = document.getElementById('featuresTypeFilter')?.value || 'all';

    // فیلتر
    _featuresFiltered = _featuresData.filter(f => {
        const matchSearch = !search ||
            f.displayName.toLowerCase().includes(search) ||
            f.feature.toLowerCase().includes(search);
        return matchSearch;
    });

    if (typeFilter === 'top5') {
        _featuresFiltered = _featuresFiltered.slice(0, 5);
    } else if (typeFilter === 'top10') {
        _featuresFiltered = _featuresFiltered.slice(0, 10);
    }

    // مرتب‌سازی
    switch (sort) {
        case 'importance_desc':
            _featuresFiltered.sort((a, b) => b.importance - a.importance);
            break;
        case 'importance_asc':
            _featuresFiltered.sort((a, b) => a.importance - b.importance);
            break;
        case 'name_asc':
            _featuresFiltered.sort((a, b) => a.displayName.localeCompare(b.displayName));
            break;
        case 'name_desc':
            _featuresFiltered.sort((a, b) => b.displayName.localeCompare(a.displayName));
            break;
    }

    // شمارنده
    const fc = document.getElementById('filteredCount');
    if (fc) {
        const span = fc.querySelector('span');
        if (span) span.textContent = _featuresFiltered.length;
    }

    if (_featuresFiltered.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="padding:var(--space-10) var(--space-5);">
                <span class="empty-icon">🔍</span>
                <div class="empty-title">نتیجه‌ای یافت نشد</div>
                <div class="empty-message">فیلتر یا جستجو را تغییر دهید</div>
            </div>
        `;
        return;
    }

    const maxImportance = Math.max(..._featuresFiltered.map(f => f.importance), 0.001);

    container.innerHTML = _featuresFiltered.map((f, index) => {
        const percent = (f.importance / maxImportance) * 100;
        const percentDisplay = f.percentage || (f.importance * 100);
        const isTop5 = index < 5;

        let color;
        if (percent > 80) color = 'var(--color-green)';
        else if (percent > 60) color = 'var(--color-cyan)';
        else if (percent > 40) color = 'var(--color-orange)';
        else color = 'var(--color-red)';

        return `
            <div class="feature-item ${isTop5 ? 'top-5' : ''}"
                 style="animation-delay:${Math.min(index * 0.03, 0.4)}s;"
                 onclick="showFeatureDetail('${escapeFeaturesAttr(f.feature)}')">
                <div class="feature-rank">${index + 1}</div>
                <div class="feature-info">
                    <div class="feature-name">
                        <span>${escapeFeaturesHtml(f.displayName)}</span>
                        ${isTop5 ? `<span class="top-badge">TOP ${index + 1}</span>` : ''}
                    </div>
                    <div class="feature-bar-wrapper">
                        <div class="feature-bar">
                            <div class="feature-bar-fill"
                                 style="width:${percent}%; background:linear-gradient(90deg, ${color}, ${color}dd);"></div>
                        </div>
                        <span class="feature-percent" style="color:${color};">${percentDisplay.toFixed(1)}%</span>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// ============================================================
// Render Chart
// ============================================================

function renderFeaturesChart() {
    const ctx = document.getElementById('featuresChart');
    if (!ctx) return;

    if (typeof Chart === 'undefined') return;

    if (_featuresChart) {
        _featuresChart.destroy();
        _featuresChart = null;
    }

    const top20 = _featuresData.slice(0, 20);

    if (top20.length === 0) {
        _featuresChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['بدون داده'],
                datasets: [{
                    data: [0],
                    backgroundColor: ['rgba(255,255,255,0.1)'],
                    borderWidth: 1,
                }],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { display: false } },
                    y: { grid: { display: false }, ticks: { display: false } },
                },
            },
        });
        return;
    }

    const colors = [
        '#10b981', '#22d3ee', '#8b5cf6', '#ec4899', '#f59e0b',
        '#34d399', '#67e8f9', '#a855f7', '#f472b6', '#fb923c',
        '#6ee7b7', '#a5f3fc', '#c4b5fd', '#f9a8d4', '#fcd34d',
        '#059669', '#0891b2', '#7c3aed', '#db2777', '#d97706',
    ];

    const labels = top20.map(f => f.displayName);
    const percentages = top20.map(f => f.percentage || (f.importance * 100));
    const maxPercent = Math.max(...percentages, 1);

    const isBar = _featuresCurrentChartType === 'bar';

    _featuresChart = new Chart(ctx, {
        type: isBar ? 'bar' : 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                label: 'اهمیت (%)',
                data: percentages,
                backgroundColor: isBar
                    ? colors.slice(0, top20.length).map(c => c + 'cc')
                    : colors.slice(0, top20.length),
                borderColor: isBar
                    ? colors.slice(0, top20.length)
                    : 'var(--bg-card)',
                borderWidth: isBar ? 1.5 : 2,
                borderRadius: isBar ? 6 : 0,
                barPercentage: 0.75,
                hoverOffset: isBar ? 0 : 12,
            }],
        },
        options: {
            indexAxis: isBar ? 'y' : 'x',
            responsive: true,
            maintainAspectRatio: false,
            cutout: isBar ? undefined : '55%',
            plugins: {
                legend: {
                    display: !isBar,
                    position: 'bottom',
                    labels: {
                        color: '#94a3b8',
                        font: { size: 10, family: 'inherit' },
                        boxWidth: 10,
                        padding: 8,
                        usePointStyle: true,
                    },
                },
                tooltip: {
                    backgroundColor: 'rgba(17, 24, 39, 0.95)',
                    titleColor: '#10b981',
                    bodyColor: '#f1f5f9',
                    borderColor: 'rgba(16, 185, 129, 0.3)',
                    borderWidth: 1,
                    padding: 10,
                    callbacks: {
                        label: (context) => {
                            const val = context.parsed[isBar ? 'x' : 'y'] || context.parsed;
                            return 'اهمیت: ' + Number(val).toFixed(2) + '%';
                        },
                    },
                },
            },
            scales: isBar ? {
                x: {
                    grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false },
                    ticks: {
                        color: '#64748b',
                        font: { size: 9, family: 'inherit' },
                        callback: (v) => v + '%',
                    },
                    max: maxPercent * 1.15,
                },
                y: {
                    grid: { display: false, drawBorder: false },
                    ticks: {
                        color: '#94a3b8',
                        font: { size: 10, family: 'inherit' },
                    },
                },
            } : {},
        },
    });

    // Update badge
    const badge = document.getElementById('chartTypeBadge');
    if (badge) {
        badge.innerHTML = isBar
            ? '<i class="fas fa-chart-bar"></i><span>Bar</span>'
            : '<i class="fas fa-chart-pie"></i><span>Pie</span>';
    }
}

// ============================================================
// Toggle Chart Type
// ============================================================

function toggleFeaturesChartType() {
    _featuresCurrentChartType = _featuresCurrentChartType === 'bar' ? 'doughnut' : 'bar';
    renderFeaturesChart();

    const title = document.getElementById('chartTitle');
    if (title) {
        title.textContent = _featuresCurrentChartType === 'bar' ? 'نمودار Bar' : 'نمودار دایره‌ای';
    }
}

// ============================================================
// Filter
// ============================================================

function filterFeatures() {
    renderFeatures();
}

function debouncedFilterFeatures() {
    if (_featuresDebounceTimer) clearTimeout(_featuresDebounceTimer);
    _featuresDebounceTimer = setTimeout(filterFeatures, 250);
}

// ============================================================
// Feature Detail Modal
// ============================================================

function showFeatureDetail(featureCode) {
    const feature = _featuresData.find(f => f.feature === featureCode);
    if (!feature) return;

    _featuresSelectedFeature = featureCode;

    const index = _featuresData.findIndex(f => f.feature === featureCode);
    const percent = feature.percentage || (feature.importance * 100);

    setText('featureDetailIcon', index < 3 ? '🏆' : index < 5 ? '⭐' : '📊');
    setText('featureDetailName', feature.displayName);
    setText('featureDetailCode', feature.feature);
    setText('featureDetailImportance', feature.importance.toFixed(4));
    setText('featureDetailPercent', percent.toFixed(2) + '%');
    setText('featureDetailCodeValue', feature.feature);
    setText('featureDetailRank', `#${index + 1} از ${_featuresData.length}`);
    setText('featureDetailDescription', feature.description || '—');

    const modal = document.getElementById('featureDetailModal');
    if (modal) modal.classList.add('active');
}

function closeFeatureDetail() {
    const modal = document.getElementById('featureDetailModal');
    if (modal) modal.classList.remove('active');
    _featuresSelectedFeature = null;
}

// ============================================================
// Empty / Error
// ============================================================

function showFeaturesEmpty() {
    const container = document.getElementById('featuresList');
    if (container) {
        container.innerHTML = `
            <div class="empty-state" style="padding:var(--space-10) var(--space-5);">
                <span class="empty-icon" style="font-size:2.5rem;">📭</span>
                <div class="empty-title">هیچ ویژگی‌ای یافت نشد</div>
                <div class="empty-message">لطفاً ابتدا مدل را آموزش دهید</div>
            </div>
        `;
    }
}

function showFeaturesError(message) {
    const container = document.getElementById('featuresList');
    if (container) {
        container.innerHTML = `
            <div class="empty-state error" style="padding:var(--space-10) var(--space-5);">
                <span class="empty-icon" style="font-size:2.5rem;color:var(--color-red);">⚠️</span>
                <div class="empty-title" style="color:var(--color-red);">خطا در بارگذاری</div>
                <div class="empty-message">${escapeFeaturesHtml(message || '')}</div>
                <button class="empty-action" onclick="loadFeatures()">
                    <i class="fas fa-sync-alt"></i>
                    تلاش مجدد
                </button>
            </div>
        `;
    }
}

// ============================================================
// Export CSV
// ============================================================

function exportFeaturesCSV() {
    if (_featuresData.length === 0) {
        if (typeof showToast === 'function') showToast('⚠️ داده‌ای نیست', 'warning');
        return;
    }

    const headers = ['ویژگی', 'کد', 'اهمیت', 'درصد'];
    const rows = _featuresData.map(f => [
        f.displayName,
        f.feature,
        f.importance,
        (f.percentage || (f.importance * 100)).toFixed(2) + '%',
    ]);

    const csv = [headers, ...rows]
        .map(r => r.map(escapeFeaturesCsv).join(','))
        .join('\n');

    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `feature_importance_${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);

    if (typeof showToast === 'function') showToast('📥 CSV دانلود شد', 'success');
}

// ============================================================
// Helpers
// ============================================================

function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value ?? '—';
}

function escapeFeaturesHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeFeaturesAttr(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function escapeFeaturesCsv(value) {
    const str = String(value ?? '');
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
}
</script>
