<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e1a">
    <title>دیباگ | سیستم تحلیلگر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/themes.css">

    <!-- Shared -->
    <link rel="stylesheet" href="/css/nav.css">
    <link rel="stylesheet" href="/css/pages/shared-page.css">

    <!-- Page-specific -->
    <link rel="stylesheet" href="/css/pages/debug.css">
</head>
<body>

    <!-- Navigation -->
    <div id="navContainer"></div>

    <!-- Main -->
    <div class="tabbed-page debug-page">

        <div class="container">

            <!-- ====================================================
                 Header
                 ==================================================== -->
            <div class="page-header">
                <div>
                    <h1>
                        <span class="page-icon">
                            <i class="fas fa-bug"></i>
                        </span>
                        <span>دیباگ</span>
                    </h1>
                    <span class="subtitle">ابزارهای عیب‌یابی و مدیریت سیستم</span>
                </div>
                <div class="header-actions">
                    <span class="timestamp" id="pageTimestamp">—</span>
                </div>
            </div>

            <!-- ====================================================
                 Stats Grid
                 ==================================================== -->
            <div class="debug-stats-grid">
                <div class="debug-stat-card">
                    <span class="stat-icon">💻</span>
                    <div class="stat-value cyan" id="debugCpu">—</div>
                    <div class="stat-label">CPU (App)</div>
                </div>
                <div class="debug-stat-card">
                    <span class="stat-icon">💾</span>
                    <div class="stat-value green" id="debugRam">—</div>
                    <div class="ram-bar-container">
                        <div class="ram-bar" id="debugRamBar" style="width:0%;"></div>
                    </div>
                    <div class="stat-label">RAM (از ۵۱۲MB)</div>
                </div>
                <div class="debug-stat-card">
                    <span class="stat-icon">⏱️</span>
                    <div class="stat-value cyan" id="debugUptime">—</div>
                    <div class="stat-label">آپتایم اپلیکیشن</div>
                </div>
                <div class="debug-stat-card">
                    <span class="stat-icon">📊</span>
                    <div class="stat-value purple" id="debugCollections">—</div>
                    <div class="stat-label">جمع‌آوری‌ها</div>
                </div>
            </div>

            <!-- ====================================================
                 Tabs
                 ==================================================== -->
            <div class="tabs" id="debugTabs">
                <button class="tab-btn active" data-tab="status">
                    <i class="fas fa-heartbeat"></i>
                    <span>وضعیت</span>
                </button>
                <button class="tab-btn" data-tab="logs">
                    <i class="fas fa-list"></i>
                    <span>لاگ‌ها</span>
                </button>
                <button class="tab-btn" data-tab="cli">
                    <i class="fas fa-terminal"></i>
                    <span>کنسول</span>
                </button>
                <button class="tab-btn" data-tab="system">
                    <i class="fas fa-server"></i>
                    <span>سیستم</span>
                </button>
                <button class="tab-btn" data-tab="cache">
                    <i class="fas fa-database"></i>
                    <span>کش</span>
                </button>
                <button class="tab-btn" data-tab="processes">
                    <i class="fas fa-tasks"></i>
                    <span>پردازش‌ها</span>
                </button>
                <button class="tab-btn" data-tab="healing">
                    <i class="fas fa-heart-pulse"></i>
                    <span>خودترمیمی</span>
                </button>
            </div>

            <!-- ====================================================
                 Tab Content
                 ==================================================== -->
            <div class="tab-wrapper" id="tabContent">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">در حال بارگذاری...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaliday@1/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mitt@3/dist/mitt.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/radash@12/dist/radash.umd.js"></script>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>

    <!-- Core -->
    <script src="/js/core/theme.js"></script>
    <script src="/js/core/tabs.js"></script>
    <script src="/js/core/nav.js"></script>
    <script src="/js/core/index.js"></script>

    <!-- Loader -->
    <script src="/js/loaders/debug-loader.js"></script>

</body>
</html>
