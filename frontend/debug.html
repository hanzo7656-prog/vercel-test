<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیباگ</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .debug-container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }
        .debug-tabs { display: flex; gap: 4px; background: var(--bg-secondary); border-radius: 12px; padding: 4px; border: 1px solid var(--border-color); margin-bottom: 20px; overflow-x: auto; }
        .debug-tabs button { padding: 10px 20px; background: transparent; border: none; border-radius: 8px; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; font-size: 0.85rem; white-space: nowrap; }
        .debug-tabs button:hover { background: rgba(0, 212, 255, 0.05); color: var(--text-primary); }
        .debug-tabs button.active { background: rgba(0, 212, 255, 0.1); color: var(--accent-cyan); }
        .debug-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; min-height: 400px; }
        .debug-output { background: var(--bg-primary); border-radius: 8px; padding: 16px; font-family: 'Courier New', monospace; font-size: 0.8rem; overflow-x: auto; max-height: 400px; overflow-y: auto; color: var(--text-secondary); white-space: pre-wrap; }
        .debug-output .success { color: var(--accent-green); }
        .debug-output .error { color: var(--accent-red); }
        .debug-output .warning { color: var(--accent-orange); }
        .debug-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .debug-actions button { padding: 6px 16px; border: 1px solid var(--border-color); border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; }
        .debug-actions button:hover { border-color: var(--accent-cyan); color: var(--text-primary); }
        .cli-input { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .cli-input textarea { flex: 1; min-width: 200px; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-family: 'Courier New', monospace; resize: vertical; min-height: 60px; }
        .cli-input textarea:focus { outline: none; border-color: var(--accent-cyan); }
        .cli-input button { padding: 8px 20px; border: none; border-radius: 8px; background: var(--accent-cyan); color: #fff; font-weight: 600; cursor: pointer; height: 44px; }
        .cli-input button:hover { box-shadow: 0 4px 20px rgba(0, 212, 255, 0.25); }
        .cli-input button.danger { background: var(--accent-red); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .system-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .system-item { background: var(--bg-primary); padding: 14px 16px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; }
        .system-item .label { font-size: 0.7rem; color: var(--text-secondary); }
        .system-item .value { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }
        .system-item .value.green { color: var(--accent-green); }
        .system-item .value.orange { color: var(--accent-orange); }
        .system-item .value.red { color: var(--accent-red); }
        @media (max-width: 768px) {
            .debug-tabs { flex-wrap: nowrap; overflow-x: auto; }
            .debug-tabs button { font-size: 0.75rem; padding: 8px 14px; }
            .cli-input { flex-direction: column; }
            .cli-input textarea { width: 100%; }
            .cli-input button { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="navContainer"></div>
    
    <main class="debug-container">
        <h1>🐛 دیباگ</h1>
        <p class="subtitle">ابزارهای عیب‌یابی و مدیریت سیستم</p>
        
        <div class="debug-tabs" id="debugTabs">
            <button class="active" data-tab="status">📊 وضعیت</button>
            <button data-tab="logs">📋 لاگ‌ها</button>
            <button data-tab="cli">💻 کنسول</button>
            <button data-tab="system">🖥️ سیستم</button>
            <button data-tab="cache">🗄️ کش</button>
        </div>
        
        <div class="debug-content" id="debugContent">
            <div class="loading">⏳ در حال بارگذاری...</div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/debug.js"></script>
</body>
</html>
