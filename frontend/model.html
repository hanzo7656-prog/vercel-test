<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crypto AI - دستیار هوشمند</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

:root {
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.9);
    --glass-shadow: 0 10px 40px rgba(30, 41, 59, 0.08);
    --soft-shadow: 0 2px 8px rgba(30, 41, 59, 0.04), 0 8px 24px rgba(30, 41, 59, 0.05);

    --text-main: #0f172a;
    --text-muted: #64748b;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-soft: rgba(99, 102, 241, 0.12);
    --primary-glow: rgba(99, 102, 241, 0.25);

    --ai-bubble: rgba(255, 255, 255, 0.92);
    --user-bubble: linear-gradient(135deg, #6366f1, #8b5cf6);

    --voice-bg: #0b1120;
    --voice-text: #f8fafc;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }

body {
    background:
        radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0%, transparent 60%),
        radial-gradient(1000px 600px at 100% 100%, #ddd6fe 0%, transparent 60%),
        linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #ede9fe 100%);
    background-size: 100% 100%;
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* ============ کانتینر ============ */
.app-container {
    width: 100%;
    max-width: 1100px;
    height: 92vh;
    height: 92dvh;
    background: var(--glass-bg);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 0 0 1px rgba(255,255,255,0.35);
    display: flex;
    overflow: hidden;
    margin: 16px;
    position: relative;
    animation: containerPop 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes containerPop { from { opacity: 0; transform: scale(0.97) translateY(16px); } to { opacity: 1; transform: scale(1) translateY(0); } }

/* ============ سایدبار ============ */
.sidebar {
    width: 256px;
    background: rgba(255, 255, 255, 0.28);
    border-left: 1px solid rgba(255,255,255,0.7);
    display: flex;
    flex-direction: column;
    padding: 22px 14px;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
}
.brand { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; padding: 0 6px; }
.brand-icon { width: 30px; height: 30px; background: var(--primary); color: white; border-radius: 9px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px var(--primary-glow); flex-shrink: 0; }
.btn-new { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255,255,255,0.9); padding: 10px; border-radius: 11px; font-size: 0.85rem; font-weight: 600; font-family: inherit; color: var(--text-main); cursor: pointer; box-shadow: var(--soft-shadow); transition: all 0.25s; margin-bottom: 20px; }
.btn-new:hover { background: white; transform: translateY(-1px); color: var(--primary); }
.sidebar-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-left: 2px; }
.sidebar-item { padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-item svg { flex-shrink: 0; opacity: 0.55; }
.sidebar-item:hover, .sidebar-item.active { background: rgba(255, 255, 255, 0.85); opacity: 1; }
.sidebar-item.active { color: var(--primary); font-weight: 600; background: white; box-shadow: var(--soft-shadow); }
.sidebar-item.active svg { opacity: 1; }

/* ============ ناحیه چت ============ */
.chat-area { flex: 1; display: flex; flex-direction: column; position: relative; background: rgba(255, 255, 255, 0.06); min-width: 0; }
.chat-header { padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.7); background: rgba(255, 255, 255, 0.28); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); gap: 12px; }
.header-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mobile-menu-btn { display: none; background: transparent; border: none; color: var(--text-main); cursor: pointer; padding: 4px; border-radius: 8px; transition: background 0.2s; }
.mobile-menu-btn:hover { background: rgba(255,255,255,0.6); }
.chat-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-badge { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; background: rgba(255, 255, 255, 0.7); padding: 5px 11px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.9); color: var(--text-main); white-space: nowrap; flex-shrink: 0; }
.status-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; animation: pulseDot 2s infinite; }
@keyframes pulseDot { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }

/* ============ خوش‌آمد ============ */
.welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; overflow-y: auto; }
.welcome-logo { width: 68px; height: 68px; background: white; border: 1px solid rgba(255,255,255,0.9); border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--primary); margin-bottom: 22px; box-shadow: 0 12px 28px var(--primary-glow), inset 0 1px 0 white; animation: float 4s ease-in-out infinite; flex-shrink: 0; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.welcome-title { font-size: 1.7rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
.welcome-subtitle { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 30px; }

/* ============ ورودی اصلی ============ */
.hero-input-container { width: 100%; max-width: 640px; background: white; border: 1px solid rgba(255,255,255,0.9); border-radius: 22px; padding: 10px 12px; box-shadow: 0 8px 32px rgba(30, 41, 59, 0.06), 0 2px 6px rgba(30, 41, 59, 0.03); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
.hero-input-container:focus-within { border-color: var(--primary); box-shadow: 0 10px 32px var(--primary-glow), 0 0 0 4px var(--primary-soft); transform: translateY(-2px); }
.hero-textarea { width: 100%; border: none; outline: none; resize: none; font-size: 0.95rem; background: transparent; color: var(--text-main); font-family: inherit; min-height: 44px; max-height: 200px; padding: 8px 6px; line-height: 1.6; }
.hero-textarea::placeholder { color: var(--text-muted); }
.hero-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.05); gap: 6px; }
.actions-right { display: flex; align-items: center; gap: 6px; }

/* دکمه‌های آیکونی */
.icon-btn { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.06); width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
.icon-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-soft); }
.icon-btn.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

/* دکمه ارسال */
.btn-send { background: var(--primary); color: white; width: 34px; height: 34px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px var(--primary-glow); flex-shrink: 0; position: relative; }
.btn-send:hover:not(:disabled):not(.loading) { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 16px var(--primary-glow); }
.btn-send:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
.btn-send.loading { pointer-events: none; }
.btn-send.loading svg { display: none; }
.btn-send.loading::after { content: ''; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.35); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* chip فایل پیوست */
.file-chips { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 4px 4px; border-bottom: 1px solid rgba(0,0,0,0.05); margin-bottom: 4px; }
.file-chips.has-files { display: flex; }
.file-chip { display: flex; align-items: center; gap: 6px; background: var(--primary-soft); color: var(--primary); padding: 4px 8px 4px 10px; border-radius: 8px; font-size: 0.75rem; max-width: 200px; }
.file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip button { background: transparent; border: none; color: var(--primary); cursor: pointer; display: flex; align-items: center; padding: 0; opacity: 0.6; }
.file-chip button:hover { opacity: 1; }

/* ============ Quick Prompts ============ */
.quick-prompts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; max-width: 640px; width: 100%; }
.quick-chip { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.9); padding: 8px 14px; border-radius: 18px; font-size: 0.78rem; font-family: inherit; color: var(--text-main); cursor: pointer; transition: all 0.25s; box-shadow: 0 2px 6px rgba(30, 41, 59, 0.03); }
.quick-chip svg { color: var(--primary); flex-shrink: 0; }
.quick-chip:hover { background: white; color: var(--primary); transform: translateY(-2px); box-shadow: 0 6px 16px var(--primary-glow); border-color: var(--primary-soft); }

/* ============ پیام‌ها ============ */
.chat-messages { flex: 1; overflow-y: auto; padding: 22px; display: none; flex-direction: column; gap: 18px; scroll-behavior: smooth; min-height: 0; }
.chat-messages::-webkit-scrollbar, .sidebar-list::-webkit-scrollbar, .welcome-screen::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track, .sidebar-list::-webkit-scrollbar-track, .welcome-screen::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb, .sidebar-list::-webkit-scrollbar-thumb, .welcome-screen::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.2); border-radius: 3px; }
.chat-messages::-webkit-scrollbar-thumb:hover, .sidebar-list::-webkit-scrollbar-thumb:hover, .welcome-screen::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.4); }

.msg-row { display: flex; gap: 10px; width: 100%; animation: msgIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(12px); align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
@keyframes msgIn { to { opacity: 1; transform: translateY(0); } }

.msg-avatar { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg-avatar.ai { background: white; color: var(--primary); border: 1px solid rgba(0,0,0,0.04); box-shadow: var(--soft-shadow); }
.msg-avatar.user { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }

.msg-content { display: flex; flex-direction: column; gap: 6px; max-width: 82%; min-width: 0; }
.msg-row.user .msg-content { align-items: flex-end; }

.msg-bubble { padding: 12px 16px; border-radius: 18px; font-size: 0.92rem; line-height: 1.8; word-wrap: break-word; overflow-wrap: anywhere; }
.msg-row.ai .msg-bubble { background: var(--ai-bubble); border: 1px solid rgba(0,0,0,0.04); border-top-right-radius: 5px; box-shadow: 0 2px 8px rgba(30, 41, 59, 0.04); }
.msg-row.user .msg-bubble { background: var(--user-bubble); color: white; border-top-left-radius: 5px; box-shadow: 0 6px 18px var(--primary-glow); }
.msg-bubble p { margin: 0 0 0.6em; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble pre { background: #0f172a; color: #e2e8f0; padding: 12px 14px; border-radius: 10px; overflow-x: auto; direction: ltr; text-align: left; font-size: 0.8rem; margin: 8px 0; font-family: ui-monospace, 'Courier New', monospace; }
.msg-bubble code { background: rgba(99,102,241,0.12); color: var(--primary); padding: 2px 6px; border-radius: 4px; direction: ltr; display: inline-block; font-size: 0.85em; font-family: ui-monospace, 'Courier New', monospace; }
.msg-bubble pre code { background: transparent; color: inherit; padding: 0; }

.msg-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; padding: 0 2px; }
.msg-row:hover .msg-actions { opacity: 1; }
.msg-action-btn { background: rgba(255,255,255,0.9); border: 1px solid rgba(0,0,0,0.06); width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
.msg-action-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-soft); }
.msg-action-btn.copied { color: #10b981; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.08); }

/* typing */
.typing-indicator { display: flex; gap: 4px; align-items: center; padding: 14px 18px; }
.typing-indicator span { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: typingBounce 1.4s infinite ease-in-out; }
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

/* ============ ورودی پایین ============ */
.chat-input-area { padding: 14px 22px; border-top: 1px solid rgba(255,255,255,0.7); display: none; background: rgba(255, 255, 255, 0.28); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.chat-input-wrapper { display: flex; align-items: flex-end; background: white; border: 1px solid rgba(0,0,0,0.06); border-radius: 18px; padding: 5px; box-shadow: 0 2px 8px rgba(30, 41, 59, 0.04); transition: all 0.25s; gap: 4px; }
.chat-input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 4px 16px var(--primary-glow), 0 0 0 4px var(--primary-soft); }
.chat-textarea { flex: 1; border: none; outline: none; resize: none; padding: 8px 6px; font-size: 0.92rem; max-height: 120px; min-height: 20px; background: transparent; font-family: inherit; line-height: 1.6; color: var(--text-main); }

/* ============ بک‌دراپ ============ */
.sidebar-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.35); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 99; border-radius: 28px; }
.sidebar-backdrop.active { opacity: 1; pointer-events: auto; }

/* ============================================================
   گوی صوتی مایع (Liquid Orb)
   ============================================================ */
.voice-overlay { position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0b1120 60%); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.voice-overlay.active { opacity: 1; pointer-events: auto; }
.close-voice-btn { position: absolute; top: 28px; right: 28px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); width: 44px; height: 44px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s; z-index: 10; }
.close-voice-btn:hover { background: rgba(255,255,255,0.16); transform: rotate(90deg); }

.liquid-orb-wrap { position: relative; width: 320px; height: 320px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; filter: drop-shadow(0 20px 60px rgba(99, 102, 241, 0.45)); }
.pulse-ring { position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 1.5px solid rgba(139, 92, 246, 0.4); top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
.voice-overlay.listening .pulse-ring:nth-child(1) { animation: pulseRing 2.8s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
.voice-overlay.listening .pulse-ring:nth-child(2) { animation: pulseRing 2.8s infinite cubic-bezier(0.215, 0.61, 0.355, 1) 0.9s; }
.voice-overlay.listening .pulse-ring:nth-child(3) { animation: pulseRing 2.8s infinite cubic-bezier(0.215, 0.61, 0.355, 1) 1.8s; }
@keyframes pulseRing { 0% { width: 180px; height: 180px; opacity: 0.7; } 100% { width: 320px; height: 320px; opacity: 0; } }

.liquid-orb-svg { width: 100%; height: 100%; overflow: visible; }
.liquid-orb-svg .blob { transform-origin: 50% 50%; animation: blobSpin 18s linear infinite; }
.liquid-orb-svg .blob:nth-child(2) { animation: blobSpin 14s linear infinite reverse; }
.liquid-orb-svg .blob:nth-child(3) { animation: blobSpin 22s linear infinite; }
@keyframes blobSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.orb-particle { position: absolute; width: 4px; height: 4px; background: rgba(167, 139, 250, 0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 0 8px rgba(167, 139, 250, 0.9); }
.voice-overlay.listening .orb-particle { animation: particleFloat 4s ease-in-out infinite; }
.orb-particle:nth-child(5) { animation-delay: 0s; top: 20%; left: 15%; }
.orb-particle:nth-child(6) { animation-delay: 0.8s; top: 70%; left: 80%; width: 3px; height: 3px; }
.orb-particle:nth-child(7) { animation-delay: 1.6s; top: 85%; left: 25%; }
.orb-particle:nth-child(8) { animation-delay: 2.4s; top: 15%; left: 75%; width: 5px; height: 5px; }
.orb-particle:nth-child(9) { animation-delay: 3.2s; top: 50%; left: 5%; width: 3px; height: 3px; }
@keyframes particleFloat { 0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; } 50% { transform: translate(0, -20px) scale(1.4); opacity: 1; } }

.voice-status-text { color: var(--voice-text); font-size: 1.05rem; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.01em; }
.voice-timer { color: rgba(255,255,255,0.45); font-size: 0.8rem; font-family: ui-monospace, monospace; margin-bottom: 30px; }
.live-words { position: absolute; bottom: 110px; width: 80%; max-width: 560px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; pointer-events: none; }
.live-word { color: rgba(255,255,255,0.75); font-size: 0.85rem; opacity: 0; animation: wordFade 3s forwards; background: rgba(255,255,255,0.06); padding: 3px 10px; border-radius: 12px; }
@keyframes wordFade { 0% { opacity: 0; transform: translateY(5px); } 15% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-5px); } }

.test-panel { position: absolute; bottom: 24px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 10px; display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.55); font-size: 0.7rem; }
.test-panel input[type="range"] { -webkit-appearance: none; width: 90px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; }
.test-panel input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #a78bfa; border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(167,139,250,0.7); }

/* ============ ریسپانسیو ============ */
@media (max-width: 900px) { .msg-content { max-width: 86%; } .welcome-title { font-size: 1.5rem; } }
@media (max-width: 768px) {
    .app-container { height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; border: none; }
    .sidebar-backdrop { border-radius: 0; }
    .sidebar { position: absolute; top: 0; right: 0; bottom: 0; width: 280px; max-width: 85vw; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(30px); transform: translateX(100%); box-shadow: -8px 0 32px rgba(0,0,0,0.15); }
    .sidebar.open { transform: translateX(0); }
    .mobile-menu-btn { display: flex; }
    .chat-header { padding: 14px 16px; }
    .chat-messages { padding: 16px; gap: 14px; }
    .msg-content { max-width: 88%; }
    .msg-bubble { font-size: 0.88rem; padding: 11px 14px; }
    .chat-input-area { padding: 10px 12px; }
    .welcome-screen { padding: 16px; }
    .welcome-title { font-size: 1.3rem; }
    .welcome-subtitle { font-size: 0.85rem; margin-bottom: 22px; }
    .welcome-logo { width: 60px; height: 60px; margin-bottom: 18px; }
    .model-badge { display: none; }
    .quick-chip { font-size: 0.72rem; padding: 7px 11px; }
    .msg-actions { opacity: 1; }
    .liquid-orb-wrap { width: 260px; height: 260px; }
    .voice-status-text { font-size: 0.95rem; }
}
@media (max-width: 380px) {
    .chat-title { font-size: 0.85rem; }
    .welcome-title { font-size: 1.15rem; }
    .liquid-orb-wrap { width: 220px; height: 220px; }
}
</style>
</head>
<body>

<div class="app-container">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- سایدبار -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                </svg>
            </div>
            <span>Crypto AI</span>
        </div>

<script>
/* ============ تنظیمات ============ */
// برای سوئیچ بین مدل متنی و ایجنت Live:
// false = مدل متنی (سریع، ارزان)
// true  = ایجنت Live (با دسترسی به ابزارهای دیباگ، بازار و ...)
const USE_AGENT = false;

/* ============ آیکون‌ها ============ */
const ICONS = {
    copy: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    regen: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
    ai: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="3"/></svg>',
    user: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    file: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>',
    x: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'
};

/* ============ المان‌ها ============ */
const welcomeScreen = document.getElementById('welcomeScreen');
const chatMessages = document.getElementById('chatMessages');
const chatInputArea = document.getElementById('chatInputArea');
const heroTextarea = document.getElementById('heroTextarea');
const heroSendBtn = document.getElementById('heroSendBtn');
const chatTextarea = document.getElementById('chatTextarea');
const chatSendBtn = document.getElementById('chatSendBtn');
const chatTitle = document.getElementById('chatTitle');
const sidebar = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
const btnNew = document.getElementById('btnNew');
const voiceOverlay = document.getElementById('voiceOverlay');
const closeVoiceBtn = document.getElementById('closeVoiceBtn');
const voiceStatus = document.getElementById('voiceStatus');
const voiceTimer = document.getElementById('voiceTimer');
const liveWords = document.getElementById('liveWords');
const ampSlider = document.getElementById('ampSlider');
const liquidDisp = document.getElementById('liquidDisp');

/* ============ state ============ */
let isSending = false;
let heroFiles = [];
let chatFiles = [];
let chatHistory = []; // تاریخچه مکالمه برای مدل متنی

/* ============ فایل‌ها ============ */
function renderFileChips(container, files, onRemove) {
    if (!container) return;
    container.innerHTML = '';
    if (files.length === 0) { container.classList.remove('has-files'); return; }
    container.classList.add('has-files');
    files.forEach((file, idx) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = ICONS.file + '<span>' + file.name + '</span>';
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.innerHTML = ICONS.x;
        rm.onclick = () => onRemove(idx);
        chip.appendChild(rm);
        container.appendChild(chip);
    });
}

function setupAttach(inputEl, btnEl, chipsEl, getFiles, setFiles, onUpdate) {
    if (!btnEl || !inputEl) return;
    btnEl.addEventListener('click', () => inputEl.click());
    inputEl.addEventListener('change', (e) => {
        const newFiles = Array.from(e.target.files);
        setFiles([...getFiles(), ...newFiles]);
        onUpdate();
        inputEl.value = '';
    });
    onUpdate();
}

function updateHeroFiles() {
    renderFileChips(document.getElementById('heroFileChips'), heroFiles, (idx) => { heroFiles.splice(idx, 1); updateHeroFiles(); });
    updateSendState(heroTextarea, heroSendBtn);
}

function updateChatFiles() {
    updateSendState(chatTextarea, chatSendBtn);
}

setupAttach(document.getElementById('heroFileInput'), document.getElementById('heroAttachBtn'), document.getElementById('heroFileChips'), () => heroFiles, (f) => { heroFiles = f; }, updateHeroFiles);
setupAttach(document.getElementById('chatFileInput'), document.getElementById('chatAttachBtn'), null, () => chatFiles, (f) => { chatFiles = f; }, updateChatFiles);

/* ============ auto-resize ============ */
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

/* ============ state ============ */
function updateSendState(textarea, btn) {
    const hasText = textarea.value.trim().length > 0;
    const files = (textarea === heroTextarea ? heroFiles : chatFiles);
    btn.disabled = (!hasText && files.length === 0) || isSending;
}

/* ============ scroll ============ */
function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

/* ============ پیام‌ها ============ */
function createMessageRow(role, content, options = {}) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar ' + role;
    avatar.innerHTML = role === 'ai' ? ICONS.ai : ICONS.user;

    const contentWrapper = document.createElement('div');
    contentWrapper.className = 'msg-content';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (options.typing) {
        bubble.classList.add('typing-indicator');
        bubble.innerHTML = '<span></span><span></span><span></span>';
    } else {
        bubble.innerHTML = formatContent(content);
    }

    contentWrapper.appendChild(bubble);

    if (role === 'ai' && !options.typing && !options.noActions) {
        const actions = document.createElement('div');
        actions.className = 'msg-actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'msg-action-btn';
        copyBtn.title = 'کپی';
        copyBtn.innerHTML = ICONS.copy;
        copyBtn.onclick = () => {
            navigator.clipboard?.writeText(bubble.innerText).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = ICONS.check;
                setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = ICONS.copy; }, 1500);
            });
        };

        const regenBtn = document.createElement('button');
        regenBtn.className = 'msg-action-btn';
        regenBtn.title = 'تولید دوباره';
        regenBtn.innerHTML = ICONS.regen;
        regenBtn.onclick = () => {
            const prevUser = row.previousElementSibling;
            if (prevUser && prevUser.classList.contains('user')) {
                const prevText = prevUser.querySelector('.msg-bubble').innerText;
                row.remove();
                sendMessage(prevText, true);
            }
        };

        actions.appendChild(copyBtn);
        actions.appendChild(regenBtn);
        contentWrapper.appendChild(actions);
    }

    row.appendChild(avatar);
    row.appendChild(contentWrapper);
    return row;
}

function formatContent(text) {
    if (!text) return '';
    let safe = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    safe = safe.replace(/```([\s\S]*?)```/g, (m, code) => '<pre><code>' + code.trim() + '</code></pre>');
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    return safe.split(/\n\n+/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}

/* ============ چت ============ */
function enterChatMode() {
    welcomeScreen.style.display = 'none';
    chatInputArea.style.display = 'block';
    chatMessages.style.display = 'flex';
}

async function sendMessage(text, isRegen = false) {
    const files = (chatInputArea.style.display === 'block') ? chatFiles : heroFiles;
    if ((!text.trim() && files.length === 0) || isSending) return;

    enterChatMode();

    let displayText = text;
    if (files.length > 0 && !isRegen) {
        const fileList = files.map(f => '`' + f.name + '`').join('، ');
        displayText = text.trim() ? text + '\n\nپیوست: ' + fileList : 'پیوست: ' + fileList;
    }

    if (!isRegen) {
        const userRow = createMessageRow('user', displayText);
        chatMessages.appendChild(userRow);
        scrollToBottom();
    }

    // ذخیره تاریخچه
    if (text.trim()) {
        chatHistory.push({ role: 'user', text: text.trim() });
    }

    // پاک‌سازی
    heroTextarea.value = '';
    chatTextarea.value = '';
    heroFiles = [];
    chatFiles = [];
    autoResize(heroTextarea);
    autoResize(chatTextarea);
    updateHeroFiles();
    updateSendState(heroTextarea, heroSendBtn);
    updateSendState(chatTextarea, chatSendBtn);

    // typing
    isSending = true;
    updateSendState(chatTextarea, chatSendBtn);
    chatSendBtn.classList.add('loading');

    const typingRow = createMessageRow('ai', '', { typing: true });
    chatMessages.appendChild(typingRow);
    scrollToBottom();

    try {
        let reply = '';

        // ۱. اگر فایل تصویری پیوست شده → تحلیل تصویر
        const imageFile = files.find(f => f.type.startsWith('image/'));
        if (imageFile) {
            const base64 = await fileToBase64(imageFile);
            const response = await fetch('/api/ai/analyze-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    image_base64: base64,
                    mime_type: imageFile.type,
                    prompt: text.trim() || null,
                    include_context: true
                })
            });
            const data = await response.json();
            typingRow.remove();
            if (!data.success) throw new Error(data.error || 'خطا در تحلیل تصویر');
            reply = data.data.analysis;
            const aiRow = createMessageRow('ai', reply);
            chatMessages.appendChild(aiRow);
            scrollToBottom();
            chatHistory.push({ role: 'model', text: reply });
            return;
        }

        // ۲. ایجنت Live یا مدل متنی
        if (USE_AGENT) {
            const response = await fetch('/api/ai/agent/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ message: text.trim() })
            });
            const data = await response.json();
            typingRow.remove();
            if (!data.success) throw new Error(data.error || 'خطا در ارتباط با ایجنت');
            reply = data.data.reply;
            const aiRow = createMessageRow('ai', reply || 'ایجنت پاسخی نداد.');
            chatMessages.appendChild(aiRow);
            chatHistory.push({ role: 'model', text: reply });
        } else {
            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    message: text.trim(),
                    history: chatHistory.slice(-20),
                    include_context: true,
                    temperature: 0.7
                })
            });
            const data = await response.json();
            typingRow.remove();
            if (!data.success) throw new Error(data.error || 'خطا در ارتباط با AI');
            reply = data.data.reply;
            const aiRow = createMessageRow('ai', reply);
            chatMessages.appendChild(aiRow);
            chatHistory.push({ role: 'model', text: reply });
        }

        scrollToBottom();

    } catch (error) {
        typingRow.remove();
        const errRow = createMessageRow('ai', '❌ خطا: ' + error.message);
        chatMessages.appendChild(errRow);
        scrollToBottom();
    } finally {
        isSending = false;
        chatSendBtn.classList.remove('loading');
        updateSendState(chatTextarea, chatSendBtn);
        chatTextarea.focus();
    }
}

// تابع کمکی برای تبدیل فایل به base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const result = reader.result;
            // حذف پیشوند data:image/...;base64,
            const base64 = result.split(',')[1];
            resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

/* ============ حالت صوتی (نمایشی) ============ */
let voiceInterval = null;
let liveWordsInterval = null;
let voiceSeconds = 0;

function openVoice() {
    voiceOverlay.classList.add('active');
    voiceOverlay.classList.add('listening');
    voiceStatus.innerText = 'در حال گوش دادن...';
    voiceSeconds = 0;
    voiceTimer.innerText = '00:00';

    voiceInterval = setInterval(() => {
        voiceSeconds++;
        const m = String(Math.floor(voiceSeconds / 60)).padStart(2, '0');
        const s = String(voiceSeconds % 60).padStart(2, '0');
        voiceTimer.innerText = m + ':' + s;
    }, 1000);

    startLiveWords();
}
function closeVoice() {
    voiceOverlay.classList.remove('active');
    voiceOverlay.classList.remove('listening');
    clearInterval(voiceInterval);
    clearInterval(liveWordsInterval);
    liveWords.innerHTML = '';
}
function startLiveWords() {
    const words = ['سلام', 'تحلیل', 'بیت‌کوین', 'امروز', 'بازار', 'ETH', 'روند', 'صعودی', 'حمایت', 'مقاومت'];
    liveWords.innerHTML = '';
    liveWordsInterval = setInterval(() => {
        const span = document.createElement('span');
        span.className = 'live-word';
        span.innerText = words[Math.floor(Math.random() * words.length)];
        liveWords.appendChild(span);
        setTimeout(() => span.remove(), 3000);
    }, 400);
}

document.getElementById('heroVoiceBtn').addEventListener('click', openVoice);
document.getElementById('chatVoiceBtn').addEventListener('click', openVoice);
closeVoiceBtn.addEventListener('click', closeVoice);
