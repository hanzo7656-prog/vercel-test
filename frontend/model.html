<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-color="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#070c16">
<title>مدل | سیستم تحلیلگر</title>

<!-- ⚡ FOUC Prevention -->
<script>
(function() {
    try {
        var html = document.documentElement;
        var theme = localStorage.getItem('app_theme') || 'dark';
        html.setAttribute('data-theme', theme);
        var color = localStorage.getItem('app_color') || 'violet';
        html.setAttribute('data-color', color);
        var preset = localStorage.getItem('app_preset');
        if (preset && preset !== 'default') {
            html.setAttribute('data-preset', preset);
        }
        if (color === 'custom') {
            var customHex = localStorage.getItem('app_customColor') || '#a855f7';
            html.style.setProperty('--primary', customHex);
        }
        var lang = localStorage.getItem('app_lang') || 'fa';
        html.setAttribute('lang', lang);
        html.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
    } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   MODEL SHELL v1.0
   Violet theme · 4 tabs · iframe lazy load
   ============================================================ */

/* ---------- Base Variables ---------- */
:root {
    --sidebar-width: 280px;
    --sidebar-collapsed: 76px;

    --primary: #a855f7;
    --primary-dark: #9333ea;
    --primary-light: #c084fc;
    --primary-rgb: 168, 85, 247;

    --bg-page: #070c16;
    --bg-card: rgba(20, 28, 45, 0.6);
    --bg-card-solid: #131c2d;
    --bg-glass: rgba(19, 28, 45, 0.85);
    --bg-input: rgba(10, 16, 28, 0.8);
    --bg-hover: rgba(148, 163, 184, 0.06);
    --bg-hover-strong: rgba(148, 163, 184, 0.1);

    --text-light: #e6edf7;
    --text-muted: #8b9bb4;
    --text-dim: #5c6b82;
    --text-faint: #3d4959;

    --border: rgba(148, 163, 184, 0.07);
    --border-strong: rgba(148, 163, 184, 0.15);

    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
    --shadow-focus: 0 0 0 3px rgba(168, 85, 247, 0.15);

    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #06b6d4;

    --success-bg: rgba(34, 197, 94, 0.1);
    --warning-bg: rgba(245, 158, 11, 0.1);
    --danger-bg: rgba(239, 68, 68, 0.1);
    --info-bg: rgba(6, 182, 212, 0.1);
    --primary-bg: rgba(168, 85, 247, 0.1);

    --mono-font: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
    --ui-font: 'Vazirmatn', system-ui, sans-serif;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---------- Color Themes ---------- */
html[data-color="indigo"]  { --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8; --primary-rgb: 99, 102, 241; --shadow-focus: 0 0 0 3px rgba(99, 102, 241, 0.15); --primary-bg: rgba(99, 102, 241, 0.1); }
html[data-color="emerald"] { --primary: #10b981; --primary-dark: #059669; --primary-light: #34d399; --primary-rgb: 16, 185, 129; --shadow-focus: 0 0 0 3px rgba(16, 185, 129, 0.15); --primary-bg: rgba(16, 185, 129, 0.1); }
html[data-color="rose"]    { --primary: #f43f5e; --primary-dark: #e11d48; --primary-light: #fb7185; --primary-rgb: 244, 63, 94; --shadow-focus: 0 0 0 3px rgba(244, 63, 94, 0.15); --primary-bg: rgba(244, 63, 94, 0.1); }
html[data-color="amber"]   { --primary: #f59e0b; --primary-dark: #d97706; --primary-light: #fbbf24; --primary-rgb: 245, 158, 11; --shadow-focus: 0 0 0 3px rgba(245, 158, 11, 0.15); --primary-bg: rgba(245, 158, 11, 0.1); }
html[data-color="cyan"]    { --primary: #06b6d4; --primary-dark: #0891b2; --primary-light: #22d3ee; --primary-rgb: 6, 182, 212; --shadow-focus: 0 0 0 3px rgba(6, 182, 212, 0.15); --primary-bg: rgba(6, 182, 212, 0.1); }

/* ---------- Light Theme ---------- */
html[data-theme="light"] {
    --bg-page: #f6f8fc;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-solid: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.9);
    --bg-input: rgba(248, 250, 252, 0.95);
    --bg-hover: rgba(15, 23, 42, 0.04);
    --bg-hover-strong: rgba(15, 23, 42, 0.07);
    --text-light: #0d1421;
    --text-muted: #5c6b82;
    --text-dim: #8b9bb4;
    --text-faint: #a8b4c4;
    --border: rgba(15, 23, 42, 0.06);
    --border-strong: rgba(15, 23, 42, 0.12);
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.12);
}

/* ---------- Reset ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; height: 100vh; }

body {
    font-family: var(--ui-font);
    background: var(--bg-page);
    color: var(--text-light);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

/* ============================================================
   NEON LOADER (فقط رفرش صفحه)
   ============================================================ */
.neon-loader-overlay {
    position: fixed;
    inset: 0;
    background: rgba(7, 12, 22, 0.97);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 28px;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
}

.neon-loader-overlay.active {
    display: flex;
    opacity: 1;
    visibility: visible;
}

.neon-loader-icon {
    width: 68px; height: 68px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 8px 32px rgba(var(--primary-rgb), 0.5);
    animation: loaderPulse 1.8s ease-in-out infinite;
}

.neon-loader-icon svg { width: 34px; height: 34px; }

@keyframes loaderPulse {
    0%, 100% { transform: scale(1) rotate(0deg); box-shadow: 0 8px 32px rgba(var(--primary-rgb), 0.5); }
    50% { transform: scale(1.08) rotate(-3deg); box-shadow: 0 12px 48px rgba(var(--primary-rgb), 0.8); }
}

.neon-loader-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-light);
    min-height: 22px;
    text-align: center;
}

.neon-loader-sub {
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: var(--mono-font);
    margin-top: -18px;
    text-align: center;
}

/* ============================================================
   SHELL LAYOUT
   ============================================================ */
.model-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin-right: var(--sidebar-width);
    transition: margin-right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    opacity: 0;
}

.model-shell.ready {
    opacity: 1;
    transition: opacity 0.3s ease, margin-right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.model-shell.expanded { margin-right: var(--sidebar-collapsed); }

@media (max-width: 768px) {
    .model-shell { margin-right: 0; padding-top: 60px; opacity: 1; }
}

/* ============================================================
   TOP BAR
   ============================================================ */
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 20px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 100;
    min-height: 52px;
}

.top-bar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--primary-bg);
    border: 1px solid rgba(var(--primary-rgb), 0.3);
    border-radius: 7px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--primary-light);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: var(--mono-font);
    flex-shrink: 0;
}

.live-dot {
    width: 6px; height: 6px;
    background: var(--primary-light);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 8px var(--primary-light);
}

.live-dot::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1.5px solid var(--primary-light);
    opacity: 0;
    animation: livePulse 1.8s ease-out infinite;
}

@keyframes livePulse {
    0% { transform: scale(0.8); opacity: 0.8; }
    100% { transform: scale(1.8); opacity: 0; }
}

.page-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.top-bar-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.icon-btn {
    width: 32px; height: 32px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    padding: 0;
}

.icon-btn:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.4);
}

.icon-btn svg { width: 14px; height: 14px; }

.cmd-hint {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono-font);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
}

.cmd-hint:hover {
    border-color: var(--primary);
    color: var(--primary-light);
    transform: translateY(-1px);
}

.cmd-hint kbd {
    background: var(--bg-hover);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 10px;
    color: var(--text-muted);
}

/* ============================================================
   NAV TABS
   ============================================================ */
.nav-tabs {
    display: flex;
    gap: 4px;
    padding: 5px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
    min-height: 52px;
}

.nav-tabs::-webkit-scrollbar { display: none; }

.nav-tab {
    flex: 1;
    min-width: 140px;
    max-width: 280px;
    padding: 11px 18px;
    background: transparent;
    border: none;
    border-radius: 9px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    white-space: nowrap;
    position: relative;
}

.nav-tab svg { width: 15px; height: 15px; flex-shrink: 0; }

.nav-tab:hover { background: var(--bg-hover); color: var(--text-light); }

.nav-tab.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 6px 20px rgba(var(--primary-rgb), 0.4);
}

/* ============================================================
   CONTENT AREA
   ============================================================ */
.content-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg-page);
}

.tab-panel {
    position: absolute;
    inset: 0;
    display: none;
    overflow: hidden;
}

.tab-panel.active { display: block; }

.tab-panel iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: var(--bg-page);
}

/* ============================================================
   IFRAME LOADER — اسپینر نئونی
   ============================================================ */
.iframe-loader {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    background: var(--bg-page);
    opacity: 1;
    visibility: visible;
    transition: opacity 0.4s ease, visibility 0.4s ease;
}

.iframe-loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.iframe-loader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.neon-spinner {
    --size: 1px;
    --speed: 1.3s;
    position: relative;
    width: 1em;
    height: 1em;
    border-radius: 50%;
    font-size: calc(10 * var(--size));
    color: var(--primary-light);
    text-indent: -9999em;
    transform: translateZ(0);
    animation: neonMulShdSpin var(--speed) infinite linear;
    will-change: box-shadow;
}

@keyframes neonMulShdSpin {
    0%, 100% {
        box-shadow:
            0 -3em 0 0.2em, 2em -2em 0 0em, 3em 0 0 -1em,
            2em 2em 0 -1em, 0 3em 0 -1em, -2em 2em 0 -1em,
            -3em 0 0 -1em, -2em -2em 0 0;
    }
    12.5% {
        box-shadow:
            0 -3em 0 0, 2em -2em 0 0.2em, 3em 0 0 0,
            2em 2em 0 -1em, 0 3em 0 -1em, -2em 2em 0 -1em,
            -3em 0 0 -1em, -2em -2em 0 -1em;
    }
    25% {
        box-shadow:
            0 -3em 0 -0.5em, 2em -2em 0 0, 3em 0 0 0.2em,
            2em 2em 0 0, 0 3em 0 -1em, -2em 2em 0 -1em,
            -3em 0 0 -1em, -2em -2em 0 -1em;
    }
    37.5% {
        box-shadow:
            0 -3em 0 -1em, 2em -2em 0 -1em, 3em 0em 0 0,
            2em 2em 0 0.2em, 0 3em 0 0em, -2em 2em 0 -1em,
            -3em 0em 0 -1em, -2em -2em 0 -1em;
    }
    50% {
        box-shadow:
            0 -3em 0 -1em, 2em -2em 0 -1em, 3em 0 0 -1em,
            2em 2em 0 0em, 0 3em 0 0.2em, -2em 2em 0 0,
            -3em 0em 0 -1em, -2em -2em 0 -1em;
    }
    62.5% {
        box-shadow:
            0 -3em 0 -1em, 2em -2em 0 -1em, 3em 0 0 -1em,
            2em 2em 0 -1em, 0 3em 0 0, -2em 2em 0 0.2em,
            -3em 0 0 0, -2em -2em 0 -1em;
    }
    75% {
        box-shadow:
            0em -3em 0 -1em, 2em -2em 0 -1em, 3em 0em 0 -1em,
            2em 2em 0 -1em, 0 3em 0 -1em, -2em 2em 0 0,
            -3em 0em 0 0.2em, -2em -2em 0 0;
    }
    87.5% {
        box-shadow:
            0em -3em 0 0, 2em -2em 0 -1em, 3em 0 0 -1em,
            2em 2em 0 -1em, 0 3em 0 -1em, -2em 2em 0 0,
            -3em 0em 0 0, -2em -2em 0 0.2em;
    }
}

.iframe-loader-text {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: -0.2px;
    text-align: center;
}

.iframe-loader-sub {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono-font);
    text-align: center;
    margin-top: -10px;
}

/* ============================================================
   FLOATING QUICK ACCESS (FAB)
   ============================================================ */
.fab-container {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 90;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 10px;
    pointer-events: none;
}

.fab {
    pointer-events: auto;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
        0 8px 24px rgba(var(--primary-rgb), 0.5),
        0 0 0 0 rgba(var(--primary-rgb), 0.5);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
}

.fab svg { width: 20px; height: 20px; transition: transform 0.3s; }

.fab:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow:
        0 12px 32px rgba(var(--primary-rgb), 0.6),
        0 0 0 8px rgba(var(--primary-rgb), 0.08);
}

.fab.open svg { transform: rotate(45deg); }

.fab-menu {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px) scale(0.92);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
}

.fab-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.fab-item {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--bg-card-solid);
    border: 1px solid var(--border-strong);
    color: var(--text-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    position: relative;
    padding: 0;
}

.fab-item:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    transform: translateX(4px);
    box-shadow: 0 6px 18px rgba(var(--primary-rgb), 0.4);
}

.fab-item svg { width: 17px; height: 17px; }

.fab-item .fab-tooltip {
    position: absolute;
    right: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%) translateX(-4px);
    background: var(--bg-card-solid);
    color: var(--text-light);
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 700;
    white-space: nowrap;
    border: 1px solid var(--border-strong);
    box-shadow: var(--shadow);
    pointer-events: none;
    opacity: 0;
    transition: all 0.2s ease;
    font-family: var(--ui-font);
}

.fab-item:hover .fab-tooltip {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
}

@media (max-width: 768px) {
    .fab-container { bottom: 16px; left: 16px; }
    .fab { width: 44px; height: 44px; border-radius: 12px; }
    .fab svg { width: 18px; height: 18px; }
    .fab-item { width: 38px; height: 38px; }
    .fab-item svg { width: 15px; height: 15px; }
    .fab-item .fab-tooltip { display: none; }
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
.cmd-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, visibility 0.2s;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 12vh 16px 16px;
}

.cmd-overlay.open { opacity: 1; visibility: visible; }

.cmd-panel {
    background: var(--bg-card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    width: 100%;
    max-width: 600px;
    box-shadow: var(--shadow-lg);
    transform: scale(0.96) translateY(-10px);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: 70vh;
}

.cmd-overlay.open .cmd-panel { transform: scale(1) translateY(0); }

.cmd-search {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.cmd-search svg {
    width: 18px;
    height: 18px;
    color: var(--text-dim);
    flex-shrink: 0;
}

.cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-light);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
}

.cmd-input::placeholder { color: var(--text-faint); }

.cmd-kbd {
    padding: 3px 7px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: var(--mono-font);
    font-size: 10.5px;
    color: var(--text-dim);
    font-weight: 700;
    flex-shrink: 0;
}

.cmd-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.cmd-list::-webkit-scrollbar { width: 4px; }
.cmd-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.cmd-group-title {
    padding: 10px 12px 6px;
    font-size: 10.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;

}

.cmd-item {

    gap: 12px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s;
}

.cmd-item:hover,
.cmd-item.selected {
    background: var(--primary-bg);
    transform: translateX(-2px);
}

.cmd-item-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--bg-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--primary-light);
}

.cmd-item-icon svg { width: 15px; height: 15px; }

.cmd-item-main { flex: 1; min-width: 0; }

.cmd-item-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-light);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

.cmd-item-desc {

}

.cmd-empty {

}

/* ============================================================
   TOAST
   ============================================================ */
.toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999998;

    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    font-family: var(--ui-font);

}

@media (max-width: 768px) {
    .toast-container {
        bottom: auto;
        top: 80px;
        left: 12px;
        right: 12px;
        max-width: none;
    }
}

@keyframes toastIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes toastOut {
    to { opacity: 0; transform: translateY(20px); }
}

<script>
(function() {
'use strict';

if (window.__modelShellLoaded) return;
window.__modelShellLoaded = true;

const $  = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
    TABS: {
        overview: {
            url: '/model/overview',
            src: '/model_tabs/overview.html',
            title: 'وضعیت کلی',
            loader: 'loader-overview',
            iframe: 'iframe-overview',
            panel: 'panel-overview'
        },
        screener: {
            url: '/model/screener',
            src: '/model_tabs/screener.html',
            title: 'اسکنر و کالیبراسیون',
            loader: 'loader-screener',
            iframe: 'iframe-screener',
            panel: 'panel-screener'
        },
        state: {
            url: '/model/state',
            src: '/model_tabs/state.html',
            title: 'State Machine',
            loader: 'loader-state',
            iframe: 'iframe-state',
            panel: 'panel-state'
        },
        schedule: {
            url: '/model/schedule',
            src: '/model_tabs/schedule.html',
            title: 'زمان‌بندی',
            loader: 'loader-schedule',
            iframe: 'iframe-schedule',
            panel: 'panel-schedule'
        }
    },
    LOADER_TIMEOUT: 10000,
    STORAGE_KEY: 'model_last_tab'
};

// ============================================================
// STATE
// ============================================================
const state = {
    currentTab: 'overview',
    loadedTabs: new Set(),
    isRefresh: false,
    fabOpen: false,
    cmdOpen: false,
    cmdSelectedIdx: 0,
    cmdFiltered: []
};

// ============================================================
// TOAST
// ============================================================
function showToast(message, type = 'info', duration = 2500) {
    const container = $('#toastContainer');
    if (!container) return;

    const icons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };

    const colors = {
        success: '#22c55e',
        error: '#ef4444',
        warning: '#f59e0b',
        info: '#a855f7'
    };

    const toast = document.createElement('div');
    toast.style.cssText = `
        background: var(--bg-card-solid);
        border: 1px solid var(--border-strong);
        border-inline-start: 3px solid ${colors[type]};
        border-radius: 12px;
        padding: 12px 16px;
        color: var(--text-light);
        font-size: 12.5px;
        font-weight: 600;
        box-shadow: 0 12px 32px rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 220px;
        max-width: 380px;
        pointer-events: auto;
        direction: rtl;
        animation: toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    `;
    toast.innerHTML = `
        <span style="
            display:inline-flex;align-items:center;justify-content:center;
            width:22px;height:22px;min-width:22px;
            border-radius:7px;
            background:${colors[type]}20;
            color:${colors[type]};
            flex-shrink:0;
        ">${icons[type]}</span>
        <span style="flex:1;">${message}</span>
    `;
    container.appendChild(toast);

    setTimeout(() => {
        toast.style.animation = 'toastOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

// ============================================================
// NEON LOADER (فقط رفرش)
// ============================================================
function isReload() {
    try {
        const navEntries = performance.getEntriesByType('navigation');
        if (navEntries.length > 0) {
            return navEntries[0].type === 'reload';
        }
        if (performance.navigation) {
            return performance.navigation.type === 1;
        }
    } catch (e) {}
    return false;
}

function showNeonLoader() {
    const el = $('#neonLoader');
    if (el) el.classList.add('active');
}

function hideNeonLoader() {
    const el = $('#neonLoader');
    if (el) el.classList.remove('active');
}

// ============================================================
// IFRAME LOADER
// ============================================================
function showIframeLoader(tabKey) {
    const cfg = CONFIG.TABS[tabKey];
    if (!cfg) return;
    const loader = document.getElementById(cfg.loader);
    if (loader) loader.classList.remove('hidden');
}

function hideIframeLoader(tabKey) {
    const cfg = CONFIG.TABS[tabKey];
    if (!cfg) return;
    const loader = document.getElementById(cfg.loader);
    if (loader) loader.classList.add('hidden');
}

// ============================================================
// LOAD TAB IFRAME
// ============================================================
function loadTabIframe(tabKey, force = false) {
    const cfg = CONFIG.TABS[tabKey];
    if (!cfg) return;

    const iframe = document.getElementById(cfg.iframe);
    if (!iframe) return;

    if (force) {
        state.loadedTabs.delete(tabKey);
    }

    if (state.loadedTabs.has(tabKey) && iframe.src !== 'about:blank') {
        hideIframeLoader(tabKey);
        return;
    }

    if (iframe.src !== 'about:blank' && !force) {
        return;
    }

    showIframeLoader(tabKey);

    iframe.onload = () => {
        setTimeout(() => {
            hideIframeLoader(tabKey);
            state.loadedTabs.add(tabKey);
        }, 250);
    };

    iframe.src = cfg.src;

    setTimeout(() => {
        if (!state.loadedTabs.has(tabKey)) {
            hideIframeLoader(tabKey);
            state.loadedTabs.add(tabKey);
            console.warn(`[Model Shell] Loader timeout for ${tabKey}`);
        }
    }, CONFIG.LOADER_TIMEOUT);
}

// ============================================================
// SWITCH TAB
// ============================================================
function switchTab(tabKey, options = {}) {
    const { updateUrl = true, force = false } = options;
    const cfg = CONFIG.TABS[tabKey];
    if (!cfg) return;

    if (state.currentTab === tabKey && state.loadedTabs.has(tabKey) && !force) {
        return;
    }

    state.currentTab = tabKey;

    $$('.nav-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabKey);
    });

    $$('.tab-panel').forEach(panel => {
        panel.classList.remove('active');
    });
    const activePanel = document.getElementById(cfg.panel);
    if (activePanel) activePanel.classList.add('active');

    const titleEl = $('#pageTitle');
    if (titleEl) titleEl.textContent = cfg.title;

    if (updateUrl) {
        try {
            history.pushState({ tab: tabKey }, '', cfg.url);
        } catch (e) {}
    }

    loadTabIframe(tabKey, force);

    try {
        localStorage.setItem(CONFIG.STORAGE_KEY, tabKey);
    } catch (e) {}
}

// ============================================================
// HANDLE POPSTATE
// ============================================================
function handlePopState() {
    const path = window.location.pathname;
    let tabKey = 'overview';

    if (path === '/model/screener') tabKey = 'screener';
    else if (path === '/model/state') tabKey = 'state';
    else if (path === '/model/schedule') tabKey = 'schedule';

    switchTab(tabKey, { updateUrl: false });
}

// ============================================================
// NAV LOADER (sidebar)
// ============================================================
async function loadNav() {
    const container = $('#navContainer');
    if (!container) return;

    try {
        const response = await fetch('/components/nav.html');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const html = await response.text();
        container.innerHTML = html;

        container.querySelectorAll('script').forEach(oldScript => {
            const newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(attr => {
                newScript.setAttribute(attr.name, attr.value);
            });
            newScript.textContent = oldScript.textContent;
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });

        console.log('[Model Shell] Nav loaded');
    } catch (err) {
        console.error('[Model Shell] Failed to load nav:', err);
    }
}

// ============================================================
// NAV LISTENERS
// ============================================================
function setupNavListeners() {
    window.addEventListener('nav:toggle-sidebar', (e) => {
        const collapsed = e.detail?.collapsed;
        const shell = $('#modelShell');
        if (shell) shell.classList.toggle('expanded', !!collapsed);
    });

    window.addEventListener('nav:theme-changed', () => {
        broadcastToIframes('theme-changed', {
            theme: document.documentElement.getAttribute('data-theme'),
            color: document.documentElement.getAttribute('data-color')
        });
    });

    window.addEventListener('nav:lang-changed', (e) => {
        broadcastToIframes('lang-changed', { lang: e.detail?.lang });
    });
}

// ============================================================
// BROADCAST TO IFRAMES
// ============================================================
function broadcastToIframes(type, detail = {}) {
    $$('.tab-panel iframe').forEach(iframe => {
        try {
            if (iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type, ...detail }, '*');
            }
        } catch (e) {}
    });
}

// ============================================================
// REFRESH
// ============================================================
function refreshCurrentTab() {
    const btn = $('#refreshBtn');
    if (btn) {
        btn.style.transform = 'rotate(360deg)';
        btn.style.transition = 'transform 0.6s';
    }

    const tabKey = state.currentTab;
    const cfg = CONFIG.TABS[tabKey];

    state.loadedTabs.delete(tabKey);

    const iframe = document.getElementById(cfg.iframe);
    if (iframe) {
        showIframeLoader(tabKey);
        iframe.src = 'about:blank';
        setTimeout(() => {
            iframe.src = cfg.src;
        }, 100);
    }

    setTimeout(() => {
        if (btn) {
            btn.style.transform = '';
            btn.style.transition = '';
        }
    }, 600);

    showToast('در حال بروزرسانی...', 'info', 1500);
}

// ============================================================
// FAB (Floating Quick Access)
// ============================================================
function toggleFab() {
    state.fabOpen = !state.fabOpen;
    const fab = $('#fabMain');
    const menu = $('#fabMenu');
    if (fab) fab.classList.toggle('open', state.fabOpen);
    if (menu) menu.classList.toggle('open', state.fabOpen);
}

function closeFab() {
    if (!state.fabOpen) return;
    state.fabOpen = false;
    const fab = $('#fabMain');
    const menu = $('#fabMenu');
    if (fab) fab.classList.remove('open');
    if (menu) menu.classList.remove('open');
}

function setupFab() {
    const fab = $('#fabMain');
    const menu = $('#fabMenu');
    if (!fab || !menu) return;

    fab.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFab();
    });

    menu.querySelectorAll('[data-action]').forEach(item => {
        item.addEventListener('click', () => {
            const action = item.dataset.action;
            closeFab();

            switch (action) {
                case 'cmd':
                    openCmdPalette();
                    break;
                case 'refresh':
                    refreshCurrentTab();
                    break;
                case 'top':
                    scrollCurrentTabTop();
                    break;
                case 'help':
                    showHelp();
                    break;
            }
        });
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#fabContainer')) {
            closeFab();
        }
    });
}

function scrollCurrentTabTop() {
    const cfg = CONFIG.TABS[state.currentTab];
    if (!cfg) return;
    const iframe = document.getElementById(cfg.iframe);
    try {
        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.scrollTo({ top: 0, behavior: 'smooth' });
        }
    } catch (e) {}
}

function showHelp() {
    showToast('کلیدهای میانبر: Ctrl+1..4 (تب‌ها) · Ctrl+R (بروزرسانی) · Ctrl+K (پالت)', 'info', 5000);
}

function openCmdPalette() {
    const overlay = $('#cmdOverlay');
    const input = $('#cmdInput');
    if (!overlay) return;

    state.cmdOpen = true;
    state.cmdSelectedIdx = 0;
    state.cmdFiltered = COMMANDS.slice();

    overlay.classList.add('open');

    if (input) {
        input.value = '';
        setTimeout(() => input.focus(), 50);
    }

    renderCmdList();
}

function closeCmdPalette() {
    const overlay = $('#cmdOverlay');
    if (overlay) overlay.classList.remove('open');
    state.cmdOpen = false;
    const input = $('#cmdInput');
    if (input) input.blur();
}

function renderCmdList() {
    const list = $('#cmdList');
    if (!list) return;

    if (!state.cmdFiltered || state.cmdFiltered.length === 0) {
        list.innerHTML = '<div class="cmd-empty">نتیجه‌ای یافت نشد</div>';
        return;
    }

    const groups = {};
    state.cmdFiltered.forEach(c => {
        if (!groups[c.group]) groups[c.group] = [];
        groups[c.group].push(c);
    });

    let html = '';
    let idx = 0;

    Object.entries(groups).forEach(([group, items]) => {
        html += `<div class="cmd-group-title">${group}</div>`;
        items.forEach(cmd => {
            const sel = idx === state.cmdSelectedIdx ? 'selected' : '';
            html += `
                <div class="cmd-item ${sel}" data-cmd-idx="${idx}">
                    <div class="cmd-item-icon">${cmd.icon}</div>
                    <div class="cmd-item-main">
                        <div class="cmd-item-title">${cmd.title}</div>
                        <div class="cmd-item-desc">${cmd.desc}</div>
                    </div>
                    ${cmd.shortcut ? `<span class="cmd-item-shortcut">${cmd.shortcut}</span>` : ''}
                </div>
            `;
            idx++;
        });
    });

    list.innerHTML = html;

    list.querySelectorAll('.cmd-item').forEach(item => {
        item.addEventListener('click', () => {
            const i = parseInt(item.dataset.cmdIdx, 10);
            executeCommand(i);
        });
        item.addEventListener('mouseenter', () => {
            state.cmdSelectedIdx = parseInt(item.dataset.cmdIdx, 10);
            updateCmdSelection();
        });
    });
}

function updateCmdSelection() {
    const list = $('#cmdList');
    if (!list) return;
    list.querySelectorAll('.cmd-item').forEach(item => {
        const idx = parseInt(item.dataset.cmdIdx, 10);
        item.classList.toggle('selected', idx === state.cmdSelectedIdx);
    });
    const selected = list.querySelector('.cmd-item.selected');
    selected?.scrollIntoView({ block: 'nearest' });
}

function filterCmd(query) {
    const q = query.toLowerCase().trim();
    state.cmdFiltered = q
        ? COMMANDS.filter(c =>
            c.title.toLowerCase().includes(q) ||
            c.desc.toLowerCase().includes(q))
        : COMMANDS.slice();
    state.cmdSelectedIdx = 0;
    renderCmdList();
}

function executeCommand(index) {
    const cmd = state.cmdFiltered[index];
    if (!cmd) return;
    closeCmdPalette();
    setTimeout(() => cmd.action(), 100);
}

function setupCmdPalette() {
    const overlay = $('#cmdOverlay');
    const input = $('#cmdInput');

    if (overlay) {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeCmdPalette();
        });
    }

    if (input) {
        input.addEventListener('input', (e) => filterCmd(e.target.value));

        input.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                state.cmdSelectedIdx = Math.min(state.cmdSelectedIdx + 1, state.cmdFiltered.length - 1);
                updateCmdSelection();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                state.cmdSelectedIdx = Math.max(state.cmdSelectedIdx - 1, 0);
                updateCmdSelection();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                executeCommand(state.cmdSelectedIdx);
            } else if (e.key === 'Escape') {
                closeCmdPalette();
            }
        });
    }
}

// ============================================================
// MESSAGES FROM IFRAMES
// ============================================================
function setupMessages() {
    window.addEventListener('message', (e) => {
        if (!e.data || typeof e.data !== 'object') return;

        const { type } = e.data;

        if (type === 'switch-tab' && e.data.tab) {
            switchTab(e.data.tab);
        }

        if (type === 'toast') {
            showToast(e.data.message || '', e.data.level || 'info', e.data.duration || 2500);
        }

        if (type === 'refresh-current') {
            refreshCurrentTab();
        }
    });
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
function setupKeyboard() {
    document.addEventListener('keydown', (e) => {
        const isInput = e.target.matches('input, textarea, select');
        const mod = e.ctrlKey || e.metaKey;

        // Ctrl+K → Command Palette
        if (mod && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            if (state.cmdOpen) closeCmdPalette();
            else openCmdPalette();
            return;
        }

        // Ctrl+1..4 → Tabs
        if (mod && !e.shiftKey && !e.altKey) {
            const key = e.key;
            if (key === '1') { e.preventDefault(); switchTab('overview'); return; }
            if (key === '2') { e.preventDefault(); switchTab('screener'); return; }
            if (key === '3') { e.preventDefault(); switchTab('state'); return; }
            if (key === '4') { e.preventDefault(); switchTab('schedule'); return; }
        }

        // Ctrl+R → Refresh
        if (mod && e.key.toLowerCase() === 'r' && !isInput) {
            e.preventDefault();
            refreshCurrentTab();
            return;
        }

        // Escape
        if (e.key === 'Escape') {
            closeCmdPalette();
            closeFab();
        }
    });
}

// ============================================================
// INIT
// ============================================================
async function init() {
    console.log(
        '%c 🧠 Model Shell v1.0 ',
        'background: linear-gradient(135deg, #a855f7, #c084fc); color: white; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 13px;'
    );
    console.log(
        '%c Keys: Ctrl+1..4 (tabs) · Ctrl+R (refresh) · Ctrl+K (command) · Esc (close) ',
        'color:#94a3b8;font-size:11px;'
    );

    const isRefresh = isReload();
    state.isRefresh = isRefresh;

    if (isRefresh) {
        showNeonLoader();
    }

    // Setup nav
    setupNavListeners();
    await loadNav();

    // Nav tabs
    $$('.nav-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            switchTab(btn.dataset.tab);
        });
    });

    // Top bar actions
    $('#refreshBtn')?.addEventListener('click', refreshCurrentTab);
    $('#cmdBtn')?.addEventListener('click', openCmdPalette);

    // FAB
    setupFab();

    // Command Palette
    setupCmdPalette();

    // Messages from iframes
    setupMessages();

    // Popstate
    window.addEventListener('popstate', handlePopState);

    // Keyboard
    setupKeyboard();

    // Determine initial tab
    let initialTab = 'overview';

    const path = window.location.pathname;
    if (path === '/model/screener') initialTab = 'screener';
    else if (path === '/model/state') initialTab = 'state';
    else if (path === '/model/schedule') initialTab = 'schedule';

    if (path === '/model' || path === '/model/' || path === '/model/overview') {
        try {
            const savedTab = localStorage.getItem(CONFIG.STORAGE_KEY);
            if (savedTab && CONFIG.TABS[savedTab]) {
                initialTab = savedTab;
            }
        } catch (e) {}
    }

    switchTab(initialTab, { updateUrl: false });

    // Show shell
    const shell = $('#modelShell');
    if (shell) {
        shell.style.opacity = '';
        shell.classList.add('ready');
    }

    if (isRefresh) {
        setTimeout(() => {
            hideNeonLoader();
        }, 800);
    }

    console.log('[Model Shell] Ready · tab:', initialTab, '· refresh:', isRefresh);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

window.__modelShellCleanup = function() {
    window.__modelShellLoaded = false;
};

})();
