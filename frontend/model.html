<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>مدیریت مدل</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .tab-content-wrapper {
            min-height: 400px;
            position: relative;
        }
        .tab-content-wrapper .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 16px;
        }
        .tab-content-wrapper .loading-spinner {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-cyan);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .tab-content-wrapper .loading-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .tab-content-wrapper .error-msg {
            text-align: center;
            padding: 40px 20px;
            color: var(--accent-orange);
        }
        .tab-content-wrapper .error-msg .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }
        .tab-content-wrapper .error-msg button {
            margin-top: 12px;
            padding: 6px 16px;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        @media (max-width: 768px) {
            .tabs { flex-wrap: nowrap; overflow-x: auto; }
            .tab-btn { font-size: 0.65rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="container">
        
        <!-- ===== HEADER ===== -->
        <div class="page-header">
            <div>
                <h1><i class="fas fa-brain" style="color:var(--accent-purple);"></i> مدیریت مدل</h1>
                <span class="subtitle">مدیریت و آموزش مدل XGBoost</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <span class="badge" id="modelStatusBadge">🟡 دمو</span>
                <span class="timestamp" id="pageTimestamp"></span>
            </div>
        </div>

        <!-- ===== TABS ===== -->
        <div class="tabs" id="modelTabs">
            <button class="tab-btn active" data-tab="dashboard">
                <i class="fas fa-chart-pie"></i> داشبورد
            </button>
            <button class="tab-btn" data-tab="info">
                <i class="fas fa-microchip"></i> اطلاعات مدل
            </button>
            <button class="tab-btn" data-tab="training">
                <i class="fas fa-graduation-cap"></i> آموزش
            </button>
            <button class="tab-btn" data-tab="schedule">
                <i class="fas fa-clock"></i> زمان‌بندی
            </button>
            <button class="tab-btn" data-tab="history">
                <i class="fas fa-history"></i> تاریخچه
            </button>
            <button class="tab-btn" data-tab="features">
                <i class="fas fa-chart-bar"></i> اهمیت ویژگی‌ها
            </button>
            <button class="tab-btn" data-tab="tools">
                <i class="fas fa-tools"></i> ابزارها
            </button>
        </div>

        <!-- ===== TAB CONTENT ===== -->
        <div class="tab-content-wrapper" id="modelTabContent">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p class="loading-text">در حال بارگذاری...</p>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/model-loader.js"></script>

</body>
</html>
