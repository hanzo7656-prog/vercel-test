<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e1a">
    <title>مدیریت مدل | سیستم تحلیلگر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/themes.css">

    <!-- Shared -->
    <link rel="stylesheet" href="/css/nav.css">
    <link rel="stylesheet" href="/css/pages/shared-page.css">

    <!-- Page-specific -->
    <link rel="stylesheet" href="/css/pages/model.css">
</head>
<body>

    <!-- Navigation -->
    <div id="navContainer"></div>

    <!-- Main -->
    <div class="tabbed-page model-page">

        <div class="container">

            <!-- ====================================================
                 Header
                 ==================================================== -->
            <div class="page-header">
                <div>
                    <h1>
                        <span class="page-icon">
                            <i class="fas fa-brain"></i>
                        </span>
                        <span>مدیریت مدل</span>
                    </h1>
                    <span class="subtitle">مدیریت، آموزش و تحلیل مدل XGBoost</span>
                </div>
                <div class="header-actions">
                    <span class="status-badge" id="modelStatusBadge">
                        <span class="status-indicator" style="background: var(--text-muted);"></span>
                        <span class="status-text">در حال بررسی...</span>
                    </span>
                    <span class="timestamp" id="pageTimestamp">—</span>
                    <button class="btn btn-xs btn-outline" onclick="refreshCurrentTab()" title="بروزرسانی">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <!-- ====================================================
                 Tabs
                 ==================================================== -->
            <div class="tabs" id="modelTabs">
                <button class="tab-btn active" data-tab="dashboard">
                    <i class="fas fa-chart-pie"></i>
                    <span>داشبورد</span>
                </button>
                <button class="tab-btn" data-tab="info">
                    <i class="fas fa-microchip"></i>
                    <span>اطلاعات مدل</span>
                </button>
                <button class="tab-btn" data-tab="training">
                    <i class="fas fa-graduation-cap"></i>
                    <span>آموزش</span>
                </button>
                <button class="tab-btn" data-tab="schedule">
                    <i class="fas fa-clock"></i>
                    <span>زمان‌بندی</span>
                </button>
                <button class="tab-btn" data-tab="history">
                    <i class="fas fa-history"></i>
                    <span>تاریخچه</span>
                </button>
                <button class="tab-btn" data-tab="features">
                    <i class="fas fa-chart-bar"></i>
                    <span>اهمیت ویژگی‌ها</span>
                </button>
                <button class="tab-btn" data-tab="tools">
                    <i class="fas fa-tools"></i>
                    <span>ابزارها</span>
                </button>
            </div>

            <!-- ====================================================
                 Tab Content
                 ==================================================== -->
            <div class="tab-wrapper" id="modelTabContent">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">در حال بارگذاری...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaliday@1/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mitt@3/dist/mitt.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/radash@12/dist/radash.umd.js"></script>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>

    <!-- Core -->
    <script src="/js/core/theme.js"></script>
    <script src="/js/core/tabs.js"></script>
    <script src="/js/core/nav.js"></script>
    <script src="/js/core/index.js"></script>

    <!-- Loader -->
    <script src="/js/loaders/model-loader.js"></script>

</body>
</html>
