<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>مدیریت مدل | سیستم تحلیلگر</title>
    
    <!-- استایل‌ها -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/model-animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

    <!-- ============================================================
         LOADING OVERLAY
         ============================================================ -->
    <div id="loadingOverlayContainer"></div>

    <!-- ============================================================
         NAVIGATION
         ============================================================ -->
    <div id="navContainer"></div>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="model-header">
            <div>
                <h1>
                    <i class="fas fa-brain"></i>
                    مدیریت مدل
                </h1>
                <span class="subtitle">مدیریت و آموزش مدل XGBoost</span>
            </div>
            <div class="header-actions">
                <span class="model-status-badge demo" id="modelStatusBadge">
                    <span class="status-dot"></span>
                    <span class="status-text">در حال بررسی...</span>
                </span>
                <span class="timestamp" id="pageTimestamp">—</span>
            </div>
        </div>

        <!-- ===== TABS ===== -->
        <div class="model-tabs" id="modelTabs">
            <button class="model-tab-btn active" data-tab="dashboard">
                <i class="fas fa-chart-pie"></i>
                <span>داشبورد</span>
            </button>
            <button class="model-tab-btn" data-tab="info">
                <i class="fas fa-microchip"></i>
                <span>اطلاعات مدل</span>
            </button>
            <button class="model-tab-btn" data-tab="training">
                <i class="fas fa-graduation-cap"></i>
                <span>آموزش</span>
            </button>
            <button class="model-tab-btn" data-tab="schedule">
                <i class="fas fa-clock"></i>
                <span>زمان‌بندی</span>
            </button>
            <button class="model-tab-btn" data-tab="history">
                <i class="fas fa-history"></i>
                <span>تاریخچه</span>
            </button>
            <button class="model-tab-btn" data-tab="features">
                <i class="fas fa-chart-bar"></i>
                <span>اهمیت ویژگی‌ها</span>
            </button>
            <button class="model-tab-btn" data-tab="tools">
                <i class="fas fa-tools"></i>
                <span>ابزارها</span>
            </button>
        </div>

        <!-- ===== TAB CONTENT ===== -->
        <div class="model-tab-wrapper" id="modelTabContent">
            <div class="model-empty">
                <span class="empty-icon">⏳</span>
                <div class="empty-title">در حال بارگذاری...</div>
                <div class="empty-message">لطفاً صبر کنید</div>
            </div>
        </div>

    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/model-loader.js"></script>

</body>
</html>
