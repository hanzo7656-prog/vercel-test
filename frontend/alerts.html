<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>هشدارها</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .alert-filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 16px;
            align-items: center;
        }
        .alert-filters .filter-btn {
            padding: 5px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .alert-filters .filter-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .alert-filters .filter-btn.active { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(0, 212, 255, 0.05); }
        .alert-filters .refresh-btn { margin-right: auto; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 4px 8px; border-radius: var(--radius-sm); transition: var(--transition); }
        .alert-filters .refresh-btn:hover { color: var(--accent-cyan); background: rgba(0, 212, 255, 0.05); }
        .alert-filters .resolve-all-btn { padding: 4px 14px; border-radius: var(--radius-full); border: 1px solid var(--accent-red); background: transparent; color: var(--accent-red); cursor: pointer; font-size: 0.7rem; transition: var(--transition); font-family: inherit; }
        .alert-filters .resolve-all-btn:hover { background: rgba(239, 68, 68, 0.05); border-color: var(--accent-rose); }

        .alert-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            transition: var(--transition);
            border-right: 4px solid transparent;
        }
        .alert-item:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        .alert-item.critical { border-right-color: var(--accent-red); }
        .alert-item.warning { border-right-color: var(--accent-orange); }
        .alert-item.info { border-right-color: var(--accent-cyan); }
        .alert-item.resolved { border-right-color: var(--accent-green); opacity: 0.6; }
        .alert-item .alert-icon { font-size: 1.2rem; flex-shrink: 0; }
        .alert-item .alert-content { flex: 1; min-width: 0; }
        .alert-item .alert-title { font-size: 0.85rem; color: var(--text-primary); }
        .alert-item .alert-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; display: flex; gap: 12px; flex-wrap: wrap; }
        .alert-item .alert-meta .source { color: var(--text-secondary); }
        .alert-item .alert-time { font-size: 0.65rem; color: var(--text-muted); white-space: nowrap; font-family: var(--font-mono); }
        .alert-item .alert-action { background: none; border: none; color: var(--accent-cyan); cursor: pointer; font-size: 0.9rem; padding: 4px 10px; border-radius: var(--radius-sm); transition: var(--transition); flex-shrink: 0; }
        .alert-item .alert-action:hover { background: rgba(0, 212, 255, 0.05); color: var(--accent-green); }
        .alert-item .alert-resolved-badge { font-size: 0.6rem; padding: 2px 12px; border-radius: var(--radius-full); background: rgba(34, 211, 238, 0.08); color: var(--accent-green); border: 1px solid rgba(34, 211, 238, 0.12); flex-shrink: 0; }

        .no-alerts { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .no-alerts .icon { font-size: 3rem; display: block; margin-bottom: 12px; }

        @media (max-width: 768px) {
            .alert-filters { flex-wrap: nowrap; overflow-x: auto; padding: 10px 12px; }
            .alert-filters .filter-btn { font-size: 0.65rem; padding: 4px 12px; white-space: nowrap; }
            .alert-filters .refresh-btn { margin-right: 0; }
            .alert-item { flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
            .alert-item .alert-time { width: 100%; text-align: left; font-size: 0.6rem; }
            .alert-item .alert-action { align-self: flex-start; }
        }
        @media (max-width: 480px) { .alert-item .alert-meta { flex-direction: column; gap: 2px; } }
    </style>
</head>
<body>

    <div id="navContainer"></div>

    <div class="container">

        <div class="page-header">
            <div><h1><i class="fas fa-bell" style="color:var(--accent-pink);"></i> هشدارها</h1><span class="subtitle">مدیریت هشدارهای سیستم</span></div>
            <span class="badge-count" id="alertTotal" style="font-size:0.8rem;color:var(--text-muted);">۰</span>
        </div>

        <div class="alert-filters" id="filterContainer">
            <button class="filter-btn active" data-filter="all">همه</button>
            <button class="filter-btn" data-filter="critical">🚨 بحرانی</button>
            <button class="filter-btn" data-filter="warning">⚠️ هشدار</button>
            <button class="filter-btn" data-filter="info">ℹ️ اطلاع</button>
            <button class="filter-btn" data-filter="resolved">✅ حل شده</button>
            <button class="filter-btn" data-filter="unresolved">⏳ حل نشده</button>
            <button class="refresh-btn" onclick="loadAlerts()" title="بروزرسانی"><i class="fas fa-sync-alt"></i></button>
            <button class="resolve-all-btn" onclick="resolveAllAlerts()"><i class="fas fa-check-double"></i> حل همه</button>
        </div>

        <div id="alertsList">
            <div class="loading-container"><div class="loading-spinner"></div><p class="loading-text">در حال بارگذاری...</p></div>
        </div>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        class AlertsController {
            constructor() {
                this.currentFilter = 'all';
                this.updateInterval = null;
                this.init();
            }
            async init() {
                console.log('🚀 Alerts initializing...');
                await this.loadNav();
                this.setupFilters();
                await this.loadAlerts();
                this.updateInterval = setInterval(() => this.loadAlerts(), 30000);
                console.log('🚀 Alerts ready');
            }
            async loadNav() {
                const container = document.getElementById('navContainer');
                if (!container) return;
                try {
                    const res = await fetch('/nav.html');
                    if (!res.ok) throw new Error('nav.html not found');
                    const html = await res.text();
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        old.parentNode.replaceChild(ns, old);
                    });
                } catch (err) { console.error('❌ Nav error:', err); }
            }
            setupFilters() {
                document.querySelectorAll('#filterContainer .filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('#filterContainer .filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentFilter = btn.dataset.filter;
                        this.loadAlerts();
                    });
                });
            }
            async loadAlerts() {
                const container = document.getElementById('alertsList');
                const totalEl = document.getElementById('alertTotal');
                try {
                    let resolved = null;
                    if (this.currentFilter === 'resolved') resolved = true;
                    else if (this.currentFilter === 'unresolved') resolved = false;
                    const data = await api.getAlerts({ limit: 50, resolved });
                    if (data.success && data.data) {
                        let alerts = data.data;
                        if (['critical', 'warning', 'info'].includes(this.currentFilter)) {
                            alerts = alerts.filter(a => a.level?.toLowerCase() === this.currentFilter);
                        }
                        totalEl.textContent = alerts.length;
                        if (alerts.length === 0) {
                            container.innerHTML = `<div class="no-alerts"><span class="icon">✅</span><p>هیچ هشداری یافت نشد</p><p style="font-size:0.8rem;margin-top:4px;">همه چیز خوب است!</p></div>`;
                            return;
                        }
                        container.innerHTML = alerts.map(a => {
                            const level = a.level?.toLowerCase() || 'info';
                            const isResolved = a.resolved || false;
                            const levelClass = isResolved ? 'resolved' : level;
                            const icon = level === 'critical' ? '🚨' : level === 'warning' ? '⚠️' : 'ℹ️';
                            return `
                                <div class="alert-item ${levelClass}">
                                    <span class="alert-icon">${icon}</span>
                                    <div class="alert-content">
                                        <div class="alert-title">${a.message || 'بدون پیام'}</div>
                                        <div class="alert-meta"><span class="source">${a.source || 'system'}</span><span>•</span><span>${level.toUpperCase()}</span>${a.details ? `<span>• ${a.details}</span>` : ''}</div>
                                    </div>
                                    <span class="alert-time">${formatTimeAgo(a.timestamp)}</span>
                                    ${isResolved ? '<span class="alert-resolved-badge">✅ حل شد</span>' : `<button class="alert-action" onclick="resolveAlert(${a.id})"><i class="fas fa-check-circle"></i></button>`}
                                </div>
                            `;
                        }).join('');
                    }
                } catch (err) {
                    console.error('Alerts error:', err);
                    container.innerHTML = `<div class="no-alerts"><span class="icon">❌</span><p style="color:var(--accent-red);">خطا در دریافت هشدارها</p></div>`;
                }
            }
        }

        async function resolveAlert(id) {
            try {
                const data = await api.resolveAlert(id);
                if (data.success) {
                    showToast('✅ هشدار بسته شد', 'success');
                    if (window.alertsController) window.alertsController.loadAlerts();
                }
            } catch (err) { showToast('❌ خطا در بستن هشدار', 'error'); }
        }

        async function resolveAllAlerts() {
            if (!confirm('⚠️ آیا از حل کردن همه هشدارها اطمینان دارید؟')) return;
            try {
                const data = await api.resolveAllAlerts();
                if (data.success) {
                    showToast(`✅ ${data.count || 0} هشدار حل شد`, 'success');
                    if (window.alertsController) window.alertsController.loadAlerts();
                }
            } catch (err) { showToast('❌ خطا در حل کردن هشدارها', 'error'); }
        }

        function loadAlerts() {
            if (window.alertsController) window.alertsController.loadAlerts();
        }

        document.addEventListener('DOMContentLoaded', function() {
            window.alertsController = new AlertsController();
        });
    </script>
</body>
</html>
